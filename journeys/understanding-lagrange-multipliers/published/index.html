ncy</a></li><li><a class="util-journey-all-link" href="#lj-c2--activity-A4">Explain and test gradient alignment</a></li><li><a class="util-journey-all-link" href="#lj-c2--journey-study-tips">Study tips</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="lj-c2--journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This self-study resource explores how gradients, level curves and feasible movements help us understand constrained optimisation. Begin with the fixed-perimeter rectangle and work through four connected activities. Record your predictions and calculations before opening the corresponding feedback. Where a diagram is provided, use its accompanying equations, coordinates and descriptions to check your interpretation.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The activities progress from interpreting mathematical representations to constructing and evaluating your own geometric explanations. Each stage provides an opportunity to make a judgement, test it against mathematical evidence and revise your reasoning before moving towards greater independence.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><p>Constrained optimisation asks us to investigate the values of an objective function while respecting a restriction on the permitted choices.</p><p>For a rectangle with positive side lengths \(x\) and \(y\), the area is</p><p>\[A(x,y)=xy.\]</p><p>If its perimeter is fixed at 20 units, the permissible dimensions satisfy</p><p>\[2x+2y=20,\qquad x&gt;0,\quad y&gt;0.\]</p><p>This is an equality-constrained optimisation problem. The objective describes what is being investigated; the constraint describes which points are feasible. A point may have an attractive objective value without satisfying the constraint.</p><h3 class="util-md-heading util-md-heading--source-3">Functions and level curves</h3><p>A level curve of a function \(f(x,y)\) consists of points satisfying</p><p>\[f(x,y)=k,\]</p><p>where \(k\) is constant. Different values of \(k\) identify different level curves. An objective level curve therefore represents a constant objective value. A constraint equation \(g(x,y)=c\) also defines a level set, but its role is to identify feasible points.</p><p>These curves need not coincide. Moving along an objective level curve preserves the objective value; moving along a constraint curve preserves the constraint value. Distinguishing these two statements is central to interpreting the geometry.</p><h3 class="util-md-heading util-md-heading--source-3">Gradients and local change</h3><p>For a differentiable function of two variables, the gradient is</p><p>\[\nabla f(x,y)=\left(\frac{\partial f}{\partial x},\frac{\partial f}{\partial y}\right).\]</p><p>Its components describe the rates of change associated with the coordinate directions. At a point where the gradient is non-zero, it points in the direction of steepest local increase per unit distance when movement is unrestricted.</p><p>A proposed small displacement can be represented by a vector \(\mathbf{d}=(d_x,d_y)\). The dot product</p><p>\[\nabla f\cdot\mathbf{d}\]</p><p>expresses the first-order rate of change along that displacement. A positive result indicates first-order increase in the specified direction, a negative result indicates decrease, and zero indicates no first-order change along that direction. Zero first-order change does not, by itself, establish a maximum or minimum.</p><h3 class="util-md-heading util-md-heading--source-3">Tangents and normals</h3><p>A tangent direction describes the local direction of a smooth curve. A normal direction is perpendicular to its tangent.</p><p>The dot product provides an algebraic way to investigate perpendicularity. For vectors \(\mathbf{a}=(a_1,a_2)\) and \(\mathbf{b}=(b_1,b_2)\),</p><p>\[\mathbf{a}\cdot\mathbf{b}=a_1b_1+a_2b_2.\]</p><p>If two non-zero vectors have dot product zero, they are perpendicular.</p><p>For a differentiable function, a non-zero gradient is normal to a regular level curve through the point. The objective gradient and the constraint gradient therefore have distinct roles: each describes local change in its own function. Their relationships to tangent directions can be investigated using the same vector method.</p><h3 class="util-md-heading util-md-heading--source-3">Feasible directions and first-order reasoning</h3><p>For a smooth equality constraint \(g(x,y)=c\), a feasible tangent direction \(\mathbf{t}\) satisfies</p><p>\[\nabla g\cdot\mathbf{t}=0.\]</p><p>This condition describes preservation of the constraint to first order. It does not automatically mean that the objective is unchanged along that direction.</p><p>In this resource, you will compare the objective&#39;s local change with the directions permitted by the rectangle constraint. You will then investigate what additional geometric relationship is associated with a regular constrained stationary candidate.</p><p>The relevant regularity assumption is</p><p>\[\nabla g\ne\mathbf{0}.\]</p><p>It matters because a zero constraint gradient cannot identify a unique normal direction through the usual gradient argument. First-order conditions also need to be distinguished from independent evidence that a candidate is genuinely optimal.</p><p>Use these definitions and methods as preparation. The activity-specific calculations, geometric conclusions and worked interpretations are reserved for the investigations and their reveal-after-feedback materials.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/knowledge-summary-after-content.png" alt="Concept map of objective and constraint curves, gradients and movement tests; detailed description follows." aria-describedby="lj-c2--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> How objective and constraint concepts organise local geometric reasoning.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c2--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">The map separates an objective function from an equality constraint. Each leads to its own level curve and gradient. Where a gradient is non-zero, it is normal to its regular level curve. A proposed displacement connects to two distinct tests: its dot product with the objective gradient indicates first-order objective change, while its dot product with the constraint gradient indicates first-order constraint change. The map does not identify an optimum or complete the tangency argument.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Interpret objective level curves and gradient vectors for the fixed-perimeter rectangle, predicting directions of local increase and distinguishing them from movements permitted by the constraint. <span class="util-outcome-id">(LO1)</span></li><li>Compare gradient, tangent and normal directions at selected points, using vector components and geometric relationships to explain how objective values and constraint values change locally. <span class="util-outcome-id">(LO2)</span></li><li>Investigate feasible movement near a candidate constrained optimum and justify, using tangent and gradient relationships, why no first-order improvement is possible along the feasible constraint at a regular optimum. <span class="util-outcome-id">(LO3)</span></li><li>Construct an independent geometric explanation of the parallel-gradient condition grad f=lambda grad g at a regular constrained optimum, distinguishing this necessary first-order condition from a proof of optimality. <span class="util-outcome-id">(LO4)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="lj-c2--journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="lj-c2--activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Predict gradients and feasible movement</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The fixed-perimeter rectangle provides a familiar setting for investigating a new distinction: an objective can increase in a direction that the constraint does not permit. This activity connects feasible-choice reasoning to level curves and gradients.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>If you completed &#39;Why the constraint matters&#39;, revisit your initial prediction about the rectangle&#39;s dimensions and your reasoning about which choices were feasible. Use that reasoning to distinguish changes that preserve the perimeter from changes that increase area without necessarily preserving it.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Predict before revealing explanations. Keep separate the question of whether area increases and the question of whether the perimeter constraint remains satisfied.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which part of your reasoning establishes that area increases, and which part establishes that a movement is feasible? If your initial prediction changed, identify the mathematical observation responsible.</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A1"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a1-level-curves-01-activity-a1-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/activity-a1-materials-entry.png" alt="Coordinate plot of two area level curves, the perimeter constraint and three points; detailed description follows." aria-describedby="lj-c2--figure-description-asset-vb-38-4-va-a1-level-curves-01-activity-a1-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 2.</strong> Inspect constant-area curves and the perimeter constraint before judging the supplied points.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c2--figure-description-asset-vb-38-4-va-a1-level-curves-01-activity-a1-materials-entry">The horizontal and vertical axes represent positive side lengths x and y. The descending straight line x+y=10 crosses the curved level sets xy=16 and xy=24. Points (2,8) and (4,6) are marked on the corresponding constant-area curves and on the straight line. Point (6,6) is marked separately in the same coordinate plane. The curve types are identified independently of colour. No gradient arrow, optimal point or feasibility classification is supplied.</p></figure><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A1-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">How level curves, gradients and constraints fit together</span></p><h3 class="util-md-heading util-md-heading--source-2">Three ways to describe the same optimisation problem</h3><p>An objective function assigns a value to every point in its domain. For the rectangle, \(A(x,y)=xy\) assigns an area to each pair of positive side lengths. An objective level curve collects all points with the same objective value. Moving along one level curve changes the dimensions but keeps the area constant.</p><p>The gradient of a differentiable function is the vector of its partial derivatives:</p><p>\[\nabla f=(f_x,f_y).\]</p><p>Where this gradient is non-zero, its direction gives the steepest local increase in the function per unit distance. It describes what would happen if movement were unrestricted. Its components also allow us to estimate the first-order effect of a proposed small change.</p><p>The perimeter condition introduces a different question. A permitted movement must keep \(x+y=10\) and must not leave the positive-dimensions domain. A direction that increases area may fail that test. Conversely, a movement that preserves perimeter need not follow the direction of steepest unrestricted increase.</p><p>These relationships describe two distinct kinds of movement within the same mathematical system: movement selected for its effect on the objective, and movement permitted by the constraint. The geometric problem is to understand how they interact.</p><p>In a diagram, an objective level curve is a constant-area path, a gradient arrow indicates local unrestricted increase, and the constraint line marks allowable dimensions. These meanings do not depend on colour or visual arrow length.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c2--learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="lj-c2--learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="lj-c2--learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c2--learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c2--learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="lj-c2--learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c2--learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the rectangle objective and constraint, then interpret the meaning of two objective level curves and the feasible constraint line.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A1-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated rectangle: level curves and feasible choices</span></p><h3 class="util-md-heading util-md-heading--source-2">A rectangle with fixed perimeter</h3><p>This is a simulated mathematical teaching example, not an empirical dataset.</p><p>A rectangle has positive side lengths \(x\) and \(y\) and a fixed perimeter of 20 units. Its area is</p><p>\[A(x,y)=xy.\]</p><p>The perimeter condition is</p><p>\[2x+2y=20,\]</p><p>or equivalently</p><p>\[g(x,y)=x+y=10,\qquad x&gt;0,\quad y&gt;0.\]</p><h3 class="util-md-heading util-md-heading--source-3">Points to inspect</h3><table><thead><tr><th>Point \((x,y)\)</th><th>Area \(A(x,y)\)</th><th>Coordinates sum \(x+y\)</th></tr></thead><tbody><tr><td>\((2,8)\)</td><td>16</td><td>10</td></tr><tr><td>\((4,6)\)</td><td>24</td><td>10</td></tr><tr><td>\((6,6)\)</td><td>36</td><td>12</td></tr></tbody></table><p>The objective level curves through the first two points have equations \(xy=16\) and \(xy=24\). Every point on one such curve has the area specified by its equation.</p><p>The gradients are</p><p>\[\nabla A(x,y)=(y,x),\qquad \nabla g(x,y)=(1,1).\]</p><p>For your direction prediction, begin at \((4,6)\). Substitute its coordinates into the general objective-gradient formula before deciding where a small movement would increase area.</p><h3 class="util-md-heading util-md-heading--source-3">Visual inspection guide</h3><p>In an \(x\)-\(y\) plane, the horizontal coordinate is the first side length and the vertical coordinate is the second. The constraint \(x+y=10\) is a straight descending line through the positive quadrant. Each objective level curve \(xy=c\), for positive \(c\), is a curved line representing a fixed area. The three labelled points can be identified by coordinates without relying on colour.</p><p>An interactive representation may allow a point to move freely or remain attached to the constraint line. Record the coordinates and equation values as well as observing the visual movement. Do not assume that movement increasing area also preserves perimeter.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>At a supplied feasible point, predict a direction of local area increase using the gradient components.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A1-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Record your predictions and reasoning</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Decide whether that direction preserves the constraint, and identify a permitted direction of movement.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A recorded interpretation of the supplied level curves, a predicted direction of local increase supported by gradient components, a correctly justified feasibility decision, and an explanation distinguishing movement that increases area from movement that preserves the constraint. The response should refer to equations or coordinates rather than relying only on a graphical impression.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace u r response for Predicted increase direction.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a1-a1-template-section-a1-m3-section-predicted-increase-direction-2" name="learner-workspace-a1-a1-template-section-a1-m3-section-predicted-increase-direction-2" rows="6" aria-describedby="lj-c2--learner-workspace-a1-a1-template-section-a1-m3-section-predicted-increase-direction-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-feasible-movement-3" data-response-part-id="A1-template-section-a1-m3-section-feasible-movement-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a1-a1-template-section-a1-m3-section-feasible-movement-3-label" for="lj-c2--learner-workspace-a1-a1-template-section-a1-m3-section-feasible-movement-3">Feasible movement</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a1-a1-template-section-a1-m3-section-feasible-movement-3-desc">Record your response for Feasible movement.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a1-a1-template-section-a1-m3-section-feasible-movement-3" name="learner-workspace-a1-a1-template-section-a1-m3-section-feasible-movement-3" rows="6" aria-describedby="lj-c2--learner-workspace-a1-a1-template-section-a1-m3-section-feasible-movement-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-explanation-of-the-distinction-4" data-response-part-id="A1-template-section-a1-m3-section-explanation-of-the-distinction-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--lea g><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c2--learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c2--learner-task-a1">Back to your task (Predict gradients and feasible movement)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m5-c-0" data-revision-criterion-id="a1-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you interpreted the objective level curves as sets of constant area?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confusing a level curve with a permitted path would obscure the difference between preserving area and preserving perimeter.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each supplied level-curve equation is associated with its stated area.</li><li><span class="util-guided-review__feature-key">B.</span> Your explanation distinguishes constant-area movement from fixed-perimeter movement.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Substitute the coordinates of the two supplied feasible points into the objective and associate each result with the appropriate equation \(xy=c\).</li><li><span class="util-guided-review__feature-key">Missing B:</span> State which equation remains constant along an objective level curve and which equation must remain constant for feasibility.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a1-a1-m5-item-0" data-checklist-item-id="checklist-a1-a1-m5-item-0"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a1-a1-m5-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m5-c-1" data-revision-criterion-id="a1-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you justified your direction prediction using the objective gradient?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A visually plausible arrow alone cannot establish the direction of steepest unrestricted local increase.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The gradient is evaluated using the coordinates of the selected point.</li><li><span class="util-guided-review__feature-key">B.</span> The signs and relative components of the gradient inform your directional prediction.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Substitute the selected coordinates into \(\nabla A=(y,x)\) before describing the direction.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain how each gradient component corresponds to a change in its coordinate, rather than relying on arrow placement.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a1-a1-m5-item-1" data-checklist-item-id="checklist-a1-a1-m5-item-1"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a1-a1-m5-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m5-c-2" data-revision-criterion-id="a1-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you tested feasibility against the actual perimeter constraint?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without a constraint check, the response may mistake an area-increasing movement for an admissible one.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The proposed movement is checked against \(x+y=10\).</li><li><span class="util-guided-review__feature-key">B.</span> Your reasoning respects positive side lengths and distinguishes the infeasible comparison point.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Write the new coordinate sum or the condition on the changes \(\Delta x+\Delta y\), then use it to evaluate feasibility.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Check both the coordinate sum and the positivity of the dimensions; explain why the comparison point cannot be selected solely because of its area.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a1-a1-m5-item-2" data-checklist-item-id="checklist-a1-a1-m5-item-2"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a1-a1-m5-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m5-c-3" data-revision-criterion-id="a1-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Does your explanation clearly separate unrestricted increase from feasible movement?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>This distinction is needed to understand why constrained optimisation examines tangents rather than simply following the objective gradient.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> You identify the mathematical rule governing unrestricted local increase.</li><li><span class="util-guided-review__feature-key">B.</span> You identify the mathematical rule governing feasible movement.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Connect the objective gradient to local change in area without assuming that it preserves perimeter.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect allowable coordinate changes to the fixed-sum constraint, and compare this requirement with the gradient direction.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a1-a1-m5-item-3" data-checklist-item-id="checklist-a1-a1-m5-item-3"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a1-a1-m5-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><div class="util-verified-review" data-verified-review><button type="button" class="util-verified-review__toggle" data-verified-review-toggle data-verified-review-label="View verified feedback" data-verified-review-back="Back to review" aria-expanded="false" aria-controls="lj-c2--verified-review-a1">View verified feedback</button><div class="util-verified-review__panel" id="lj-c2--verified-review-a1" data-verified-review-panel><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Reveal verified feedback</summary><div class="util-composition-reveal__body"><article class="util-material-block util-prose-measure" data-material-id="A1-M4" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Reveal after your prediction: directions and feasibility</span></p><h3 class="util-md-heading util-md-heading--source-2">Review your initial reasoning</h3><p>Open this explanation only after recording your predictions.</p><p>The level curve \(xy=16\) contains \((2,8)\), and \(xy=24\) contains \((4,6)\). Their areas differ because they lie on different objective level curves. Both points satisfy \(x+y=10\). By contrast, \((6,6)\) has area 36 but gives \(x+y=12\), so it violates the fixed-perimeter constraint. A larger objective value does not make a point an admissible choice.</p><p>At \((4,6)\),</p><p>\[\nabla A(4,6)=(6,4).\]</p><p>The gradient points towards increasing both coordinates and is the direction of steepest unrestricted local area increase. A small step \((\Delta x,\Delta y)=\varepsilon(6,4)\), for \(\varepsilon&gt;0\), changes the coordinate sum by \(10\varepsilon\). It therefore fails to preserve the perimeter.</p><p>A movement along the constraint must satisfy</p><p>\[\Delta x+\Delta y=0.\]</p><p>For example, the direction \((1,-1)\) increases one side while decreasing the other by the same amount. From \((4,6)\), a sufficiently small positive step in this direction remains feasible and changes area as follows:</p><p>\[A(4+t,6-t)=(4+t)(6-t)=24+2t-t^2.\]</p><p>For small positive \(t\), area increases even though the movement is not parallel to the objective gradient. The direction \((-1,1)\) is also feasible locally, but has a different effect on area.</p><p>Compare your response with these two separate checks: the objective gradient indicates unrestricted local increase; the constraint equation determines whether a movement is allowed. Revise any statement that treats those checks as interchangeable.</p><h3 class="util-md-heading util-md-heading--source-3">Closure</h3><p>Keep the two questions separate when moving into the next activity: which direction changes the objective, and which direction preserves the constraint?</p></article></div></details></div></div></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c2--activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Compare gradients, tangents and normals</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The predictions about local increase and feasibility provide two different directional relationships. Comparing gradient, tangent and normal vectors makes those relationships mathematically explicit.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have distinguished unrestricted objective increase from movement that preserves the perimeter. Now investigate how the directions of gradients and tangents explain that distinction.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Use vector components and perpendicularity rather than the apparent angle or colour of a graphical arrow. Compare objective-level and constraint-level relationships separately before connecting them.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Why does a tangent to an objective level curve have a different mathematical role from a feasible tangent to the constraint?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A2"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="3" data-figure-id="asset-vb-38-4-va-a2-vector-geometry-01-activity-a2-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/activity-a2-materials-entry.png" alt="Two curves and four component-labelled vectors at (4,6); detailed description follows." aria-describedby="lj-c2--figure-description-asset-vb-38-4-va-a2-vector-geometry-01-activity-a2-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 3.</strong> Compare four candidate vector directions before assigning tangent and normal roles.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c2--figure-description-asset-vb-38-4-va-a2-vector-geometry-01-activity-a2-materials-entry">At the point (4,6), the curved line xy=24 and the descending straight line x+y=10 cross. Four vectors begin at the shared point and carry the component labels (6,4), (4,-6), (1,1) and (1,-1). Their orientations can be compared against the two curves and coordinate axes. The figure does not identify which vectors are tangents or normals, indicate right angles or provide dot-product results. Those relationships remain for the learner to establish.</p></figure><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A2-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Why gradients are normal to regular level curves</span></p><h3 class="util-md-heading util-md-heading--source-2">From constant values to perpendicular vectors</h3><p>Consider a differentiable function \(f(x,y)\) and a smooth path \(\mathbf{r}(t)\) that stays on one of its level curves. Because the function has the same value at every point on that path, \(f(\mathbf{r}(t))\) is constant.</p><p>Differentiating along the path gives</p><p>\[\frac{d}{dt}f(\mathbf{r}(t))=\nabla f(\mathbf{r}(t))\cdot\mathbf{r}&#39;(t)=0.\]</p><p>The vector \(\mathbf{r}&#39;(t)\) is tangent to the path. Thus, if \(\mathbf{t}\) is a tangent direction, the first-order change of the function in that direction is zero:</p><p>\[\nabla f\cdot\mathbf{t}=0.\]</p><p>The dot product of two non-zero vectors is zero when they are perpendicular. Therefore, where \(\nabla f\ne\mathbf{0}\), the gradient is normal to the regular level curve&#39;s tangent direction.</p><p>This argument applies to either kind of level curve. An objective level curve keeps the objective value constant; a constraint level curve keeps the constraint function constant. Each has its own gradient and potentially a different tangent direction.</p><p>A zero gradient does not provide a unique normal direction through this argument. The non-zero-gradient condition is therefore part of the geometric interpretation, not a detail that can always be omitted.</p><p>Use this general mechanism to classify the vectors supplied in the task card. Do not assume that a tangent to one curve must also be tangent to the other.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c2--learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="lj-c2--learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="lj-c2--learner-task-a2-heading" tabindex="
