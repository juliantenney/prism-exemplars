view" aria-current="page">Overview</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c1">Why the constraint matters</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c2">Seeing gradients and tangency</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c3">From geometry to the multiplier equations</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c4">What does the calculation prove?</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c5">Diagnosing mathematical claims</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c6">Independent constrained optimisation</button></li></ol></nav></div></div></aside><div class="lj-shell__workspace"><div id="lj-shell-live" class="lj-shell__live" aria-live="polite" aria-atomic="true"></div><main id="lj-shell-main" class="lj-shell__main" data-lj-role="active-resource" aria-label="Learning content" tabindex="-1"></main></div></div><div class="lj-shell__templates" hidden aria-hidden="true"><template id="lj-resource-overview"><article class="lj-shell-overview" data-lj-overview="true" role="region" aria-labelledby="lj-shell-overview-heading"><h2 id="lj-shell-overview-heading" class="lj-shell-overview__title" data-lj-resource-title="true" tabindex="-1">Overview</h2><div class="util-editorial-opening" data-region="editorial-opening"><figure class="util-visual-asset util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-figure-number="1"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/editorial-opening.png" alt="" loading="lazy" decoding="async" /></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> Understanding Lagrange Multipliers — editorial_opening.</figcaption></figure></div><div class="lj-shell-overview__body"><p>How do you find the best possible outcome when your choices are restricted?</p><p>You may already know how to differentiate a function and find stationary points. But a constrained optimisation problem is different: the best permissible solution need not be a stationary point of the unrestricted function.</p><p>In this journey, you will discover why Lagrange multipliers work, what their equations mean geometrically and how to use them to solve problems accurately.</p><p>You will begin with a familiar problem, investigate gradients and tangency, connect the geometry to the formal equations, and learn to distinguish candidate solutions from justified optima. Finally, you will apply your understanding independently in a new context.</p><p><strong>What you will learn to do</strong></p><ul><li>Identify an objective function, a constraint and the feasible choices.</li><li>Explain how gradients and tangency relate to constrained optima.</li><li>Construct and solve Lagrange multiplier equations.</li><li>Recognise limitations, common errors and unsupported conclusions.</li><li>Apply the method independently and justify your answer.</li></ul><p><strong>Study time:</strong> Approximately 90 minutes, available to complete over one week. You can spread the experiences across several study sessions. The journey assumes familiarity with partial differentiation and basic functions of two variables, but no previous knowledge of Lagrange multipliers.</p><p>Make your predictions before viewing explanations, attempt the mathematical reasoning yourself and use feedback to revisit earlier ideas. The aim is not simply to remember a procedure, but to understand when and why it works.</p></div></article></template><template id="lj-resource-c1"><article class="util-learner-page util-page util-learner-renderer-vnext" data-renderer="vnext" data-page-kind="interactive" data-persistence-page-key="v1::25416221-1206-4b10-83c1-4697623229b7::learner-page::2.0.0::a1-a2-a3::why-the-constraint-matters" data-persistence-storage-key="learner-renderer-vnext:draft:v1::25416221-1206-4b10-83c1-4697623229b7::learner-page::2.0.0::a1-a2-a3::why-the-constraint-matters" data-composition-mode="moments" data-composed-activity-count="3" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Why the constraint matters</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="4"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 4"><span class="util-journey-position__visible" aria-hidden="true">1 of 4</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c1--activity-A1" aria-label="Next section: Define the permissible rectangle"><span class="util-journey-adjacent__title">Define the permissible rectangle</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c1--journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#lj-c1--activity-A1">Define the permissible rectangle</a></li><li><a class="util-journey-all-link" href="#lj-c1--activity-A2">Test which rectangles are feasible</a></li><li><a class="util-journey-all-link" href="#lj-c1--activity-A3">Defend the best permissible choice</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="lj-c1--journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This self-study resource explores a rectangle made with a fixed amount of perimeter material. Begin by recording your own prediction about which dimensions will give the largest area. You will then formulate the mathematical problem, investigate proposed rectangles, develop a justification and apply the same reasoning to a different resource decision.</p><p>Work through the three activities in order. Complete each independent attempt before opening its worked explanation or feedback. Keep your original prediction so you can compare it with your later reasoning.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The activities progress from identifying the mathematical requirements of a decision, through testing proposed choices, to justifying a conclusion and evaluating a claim in a new context. Your initial prediction and subsequent responses provide a record of how your reasoning develops.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><p>In an optimisation problem, we seek the greatest or smallest possible value of a quantity. The mathematical expression describing that quantity is called the <strong>objective function</strong>.</p><p>For a rectangle with side lengths \(x\) and \(y\), the area is</p><p>\[
A(x,y)=xy.
\]</p><p>The two side lengths are <strong>decision variables</strong> because their values describe the choice being made. The objective function assigns an area to any proposed pair of dimensions. It does not, by itself, determine whether that pair is permissible.</p><p>A <strong>constraint</strong> restricts the choices available. An equality constraint requires a specified relationship to hold exactly. For example, a requirement that two quantities have a fixed total can be written</p><p>\[
u+v=c.
\]</p><p>If the total \(c\) is fixed, increasing one quantity requires a corresponding decrease in the other. The equality therefore introduces a trade-off that would not exist if the quantities could vary independently.</p><p>A mathematical model can also impose <strong>domain restrictions</strong>. Side lengths must be positive to describe the intended rectangles. In other applications, quantities such as allocations may be permitted to equal zero but not to become negative. These conditions are part of the problem and must be checked alongside any equality constraint.</p><p>The <strong>feasible set</strong> is the collection of all choices satisfying every stated restriction. A <strong>feasible choice</strong> belongs to this set; an <strong>infeasible choice</strong> violates at least one restriction. The objective value and feasibility are different properties of a proposed choice. Calculating an attractive objective value does not establish that the proposal is allowed.</p><p>This distinction separates <strong>constrained optimisation</strong> from <strong>unconstrained optimisation</strong>. In constrained optimisation, the objective is considered only over the feasible set. Removing a restriction changes the collection of candidates and may change what can be concluded about an optimum.</p><p>There is also an important distinction between <strong>comparison</strong> and <strong>proof</strong>. Comparing several feasible candidates can identify the best among those examined. A <strong>global constrained maximum</strong>, however, requires a justification that no choice anywhere in the feasible set has a larger objective value.</p><p>For a simple equality constraint, <strong>substitution</strong> can help establish such a result. If \(u+v=c\), then \(v=c-u\). Substituting this relationship into an objective function reduces the number of variables while retaining the constraint, provided the permitted domain is also preserved. An algebraic upper bound may then establish a global maximum if a feasible choice attains that bound.</p><p>As you investigate, keep three questions distinct: What quantity is being improved? Which choices are permissible? What evidence is sufficient to justify a claim about the best permissible choice?</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/knowledge-summary-after-content.png" alt="Concept map linking objective value, feasibility, comparison and global optimality; detailed description follows." aria-describedby="lj-c1--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> How an objective, restrictions and mathematical evidence contribute to a justified constrained choice.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c1--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">Decision variables connect to an objective function, which assigns an objective value. A separate connection leads from equality constraints and domain restrictions to the feasible set. A proposed choice must satisfy all these restrictions to be feasible; otherwise it is excluded from the constrained comparison. Feasible choices can be compared by their objective values, but comparing a sample establishes only which tested candidate performs best. A global maximum requires a bound valid for every feasible choice and a feasible candidate attaining that bound. Substitution appears as one possible route to such a proof for a suitable equality constraint.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Identify the objective function, equality constraint and domain restrictions in the fixed-perimeter rectangle problem, and describe how these determine the feasible set. <span class="util-outcome-id">(LO1)</span></li><li>Evaluate and compare proposed rectangle dimensions by calculating their areas, checking their feasibility and distinguishing permissible choices from those that violate the fixed-perimeter requirement. <span class="util-outcome-id">(LO2)</span></li><li>Justify a decision about the best permissible rectangle using mathematical evidence, and explain how the fixed-perimeter restriction changes the optimisation problem compared with an unrestricted choice of positive side lengths. <span class="util-outcome-id">(LO3)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="lj-c1--journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="lj-c1--activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Define the permissible rectangle</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Establish the distinction between the quantity being maximised and the restrictions defining permissible rectangles.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The central question is what makes a choice best when resources are restricted. Familiar algebra and the formula for a rectangle&#39;s area provide the starting point for distinguishing the quantity to improve from the conditions that every permissible choice must satisfy.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have 20 units of material to make the perimeter of a rectangle. Your aim is to obtain the largest possible area. The side lengths must be positive, and all 20 units must be used. Before calculating or comparing areas, decide what shape you expect to work best. Your initial prediction is a starting point for investigation, not a test of whether you already have the correct answer.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Start with the practical distinction between the area you want to increase and the material available to construct the rectangle. Use familiar formulae before introducing optimisation terminology. The task is to formulate the problem, not yet to establish the maximum.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Compare your original description with the feedback. What did you initially think determined a permissible rectangle, what mathematical condition confirms or challenges that view, and how would you now describe the feasible set?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A1"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A1-M1" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">One rectangle, two mathematical requirements</span></p><h3 class="util-md-heading util-md-heading--source-2">A rectangle made from 20 units of material</h3><p>Imagine making a rectangular enclosure using exactly 20 units of material around its boundary. You can change the rectangle&#39;s length and width, but you cannot change the amount of material available. Both side lengths must be positive.</p><p>Call the side lengths \(x\) and \(y\). These are <strong>decision variables</strong>: their values describe the choice you make. The rectangle&#39;s area depends on both lengths, through multiplication. Its perimeter depends on twice each length, through addition.</p><p>The <strong>objective function</strong> describes what you want to make as large as possible: the area. The <strong>equality constraint</strong> describes a condition that every permissible choice must meet: the perimeter must equal exactly 20 units. A rectangle cannot be considered a solution merely because it has an attractive area; it must also use precisely the available perimeter.</p><p>The <strong>feasible set</strong> consists of all pairs of positive side lengths that satisfy the perimeter equality. A proposed rectangle inside this set is permissible. A proposal outside it is not, even if its area looks better.</p><p>This distinction changes how you make a decision. Without the perimeter requirement, you could consider increasing both sides freely. With the requirement, increasing one side means adjusting the other to keep the total perimeter fixed.</p><h3 class="util-md-heading util-md-heading--source-3">Make your initial prediction</h3><p>Before calculating an optimum, predict what kind of rectangle will have the largest area under this restriction. You might expect a long, narrow rectangle, one with nearly equal sides, or another shape. Record your reasoning first; you will return to it after investigating actual dimensions.</p></article></div><div class="util-composition-learn-item util-composition-learn-item--example" data-composition-role="example"><article class="util-worked-example util-prose-measure" data-material-id="A1-M3" data-material-type="worked_example" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><span class="util-semantic-icon__label">Reveal after your attempt: Formulating the rectangle problem</span></p><h3 class="util-md-heading util-md-heading--source-3">Review your formulation</h3><p><strong>Release after you have recorded your prediction and attempted all four response sections.</strong></p><p>The rectangle has two side lengths that can vary, so let \(x\) and \(y\) represent those lengths. Because the problem asks for the greatest possible area, the quantity to maximise is</p><p>\[
A(x,y)=xy.
\]</p><p>This is the <strong>objective function</strong>. It assigns an area to each proposed pair of dimensions; by itself, it does not tell us whether that pair is allowed.</p><p>The same two dimensions determine the perimeter. A rectangle has two sides of length \(x\) and two of length \(y\). Using exactly 20 units of material therefore gives</p><p>\[
2x+2y=20.
\]</p><p>Dividing both sides by 2 gives the equivalent equality</p><p>\[
x+y=10.
\]</p><p>These equations express the same restriction. Neither permits the total perimeter to be smaller or larger than 20.</p><p>The side lengths must also be positive:</p><p>\[
x&gt;0,\qquad y&gt;0.
\]</p><p>Combining the objective, equality and positivity conditions gives the complete formulation:</p><p>\[
\begin{aligned}
&amp;\text{Maximise}\quad A(x,y)=xy,\\
&amp;\text{subject to}\quad x+y=10,\\
&amp;x&gt;0,\quad y&gt;0.
\end{aligned}
\]</p><p>The feasible set is therefore</p><p>\[
F=\{(x,y):x+y=10,\ x&gt;0,\ y&gt;0\}.
\]</p><p>Every pair in this set describes a permissible rectangle. A pair outside it is not a permissible choice, regardless of the area it would produce.</p><p>We have <strong>formulated</strong> the optimisation problem, but we have not yet <strong>solved</strong> it. Finding the best permissible rectangle requires comparing areas within this feasible set and eventually justifying why no other feasible rectangle can do better.</p><h3 class="util-md-heading util-md-heading--source-3">Debrief</h3><p>Compare the mathematical formulation with your initial response. Did you distinguish the quantity being maximised from the conditions defining which choices are allowed? Keep your original shape prediction for the next activity.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c1--learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="lj-c1--learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="lj-c1--learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c1--learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c1--learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="lj-c1--learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c1--learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Record your initial prediction about the rectangle shape that will maximise area, giving a brief reason without first calculating an optimum.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A1-M2" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">My prediction and mathematical formulation</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify the decision variables and write the objective function for area.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Express the fixed-perimeter requirement as an equality and state the restrictions on the side lengths.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Describe which pairs of side lengths belong to the feasible set, explaining how the equality and positivity conditions work together.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>After receiving explanatory feedback, compare your original description with the mathematical definition and identify any distinction you initially overlooked.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A recorded initial prediction with a reason; a correct mathematical identification of the objective, equality constraint and positive-domain restrictions; and a description of the feasible set that distinguishes what is being maximised from which choices are permitted. The learner&#39;s initial prediction remains visible and is not overwritten by the subsequent explanation.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m2-section-my-initial-prediction-1" data-response-part-id="A1-template-section-a1-m2-section-my-initial-prediction-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-my-initial-prediction-1-label" for="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-my-initial-prediction-1">My initial prediction</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-my-initial-prediction-1-desc">Describe the rectangle shape you expect to give the largest area. Explain your reason without calculating an optimum.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-my-initial-prediction-1" name="learner-workspace-a1-a1-template-section-a1-m2-section-my-initial-prediction-1" rows="6" aria-describedby="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-my-initial-prediction-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure util-learner-workspace--math-entry" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-2" data-response-part-id="A1-template-section-a1-m2-section-decision-variables-and-objective-2" data-input-modality="math" data-math-entry="true" data-math-field-id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-2" data-math-label-id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-2-label"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-2-label" for="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-2">Decision variables and objective</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-2-desc">Name the two quantities you can choose and write a mathematical expression for the area to be maximised.</p><div class="util-math-entry" data-math-entry-root><div class="util-math-entry__mount" data-math-entry-mount hidden></div><textarea class="util-learner-workspace__input util-learner-workspace__input--canonical" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-2" name="learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-2" rows="6" aria-labelledby="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-2-label" aria-describedby="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-2-desc lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-2-math-hint"></textarea><p class="util-math-entry__hint" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-decision-variables-and-objective-2-math-hint">Enter your mathematical expression. Use the maths keyboard for symbols and structures.</p><p class="util-math-entry__hint util-math-entry__hint--fallback-only">If the maths editor is unavailable, enter mathematical notation in this field.</p></div></div><div class="util-learner-workspace util-prose-measure util-learner-workspace--math-entry" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m2-section-constraint-and-restrictions-3" data-response-part-id="A1-template-section-a1-m2-section-constraint-and-restrictions-3" data-input-modality="math" data-math-entry="true" data-math-field-id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-constraint-and-restrictions-3" data-math-label-id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-constraint-and-restrictions-3-label"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-constraint-and-restrictions-3-label" for="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-constraint-and-restrictions-3">Constraint and restrictions</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-constraint-and-restrictions-3-desc">Write the perimeter equality and the conditions on both side lengths.</p><div class="util-math-entry" data-math-entry-root><div class="util-math-entry__mount" data-math-entry-mount hidden></div><textarea class="util-learner-workspace__input util-learner-workspace__input--canonical" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-constraint-and-restrictions-3" name="learner-workspace-a1-a1-template-section-a1-m2-section-constraint-and-restrictions-3" rows="6" aria-labelledby="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-constraint-and-restrictions-3-label" aria-describedby="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-constraint-and-restrictions-3-desc lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-constraint-and-restrictions-3-math-hint"></textarea><p class="util-math-entry__hint" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-constraint-and-restrictions-3-math-hint">Enter your mathematical expression. Use the maths keyboard for symbols and structures.</p><p class="util-math-entry__hint util-math-entry__hint--fallback-only">If the maths editor is unavailable, enter mathematical notation in this field.</p></div></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m2-section-feasible-set-description-4" data-response-part-id="A1-template-section-a1-m2-section-feasible-set-description-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-feasible-set-description-4-label" for="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-feasible-set-description-4">Feasible set description</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-feasible-set-description-4-desc">Explain in words or mathematical notation which pairs of side lengths are permissible. Distinguish satisfying the restriction from obtaining a large area.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-feasible-set-description-4" name="learner-workspace-a1-a1-template-section-a1-m2-section-feasible-set-description-4" rows="6" aria-describedby="lj-c1--learner-workspace-a1-a1-template-section-a1-m2-section-feasible-set-description-4-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c1--learner-check-a1" data-check-sidebar-open aria-controls="lj-c1--learner-check-a1" aria-expanded="false" aria-label="Check your work: Define the permissible rectangle">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c1--learner-check-a1" data-composition-moment="check" data-activity-id="A1" data-check-sidebar="available" aria-labelledby="lj-c1--learner-check-a1-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c1--learner-check-a1-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c1--learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c1--learner-task-a1">Back to your task (Define the permissible rectangle)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m4-c-0" data-revision-criterion-id="a1-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you distinguished the quantity being maximised from the conditions that make a rectangle permissible?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confusing the objective with the constraint prevents your formulation from distinguishing a desirable outcome from an allowable choice.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response identifies the side lengths as quantities that can vary.</li><li><span class="util-guided-review__feature-key">B.</span> The objective is explicitly connected to area rather than perimeter.</li><li><span class="util-guided-review__feature-key">C.</span> The fixed perimeter is described as a restriction on the choices, not as another objective.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the two independently specified dimensions of a proposed rectangle and explain that choosing them determines the rectangle&#39;s shape.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Write an area expression using the two side lengths and identify it as the quantity to maximise.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Separate the perimeter requirement from the area expression and explain which one determines permissibility.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a1-a1-m4-item-0" data-checklist-item-id="checklist-a1-a1-m4-item-0"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a1-a1-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m4-c-1" data-revision-criterion-id="a1-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Does your equality correctly represent the complete fixed perimeter?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An incorrect perimeter equation changes the set of available rectangles and therefore changes the optimisation problem.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Both pairs of opposite sides contribute to the perimeter expression.</li><li><span class="util-guided-review__feature-key">B.</span> The equality represents exactly 20 units, rather than an upper limit or an approximation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Account for two sides of each length when constructing the perimeter expression.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Express the total perimeter as an equality with 20 and avoid replacing it with an inequality.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a1-a1-m4-item-1" data-checklist-item-id="checklist-a1-a1-m4-item-1"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a1-a1-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m4-c-2" data-revision-criterion-id="a1-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you included the positive-length restrictions on both dimensions?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without these restrictions, the mathematical description includes values that do not represent the intended physical rectangles.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Both side lengths have explicit domain restrictions.</li><li><span class="util-guided-review__feature-key">B.</span> The response distinguishes positive lengths from zero or negative values.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Add a separate positivity condition for each decision variable.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain why a zero or negative side length does not describe a rectangle in this problem.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a1-a1-m4-item-2" data-checklist-item-id="checklist-a1-a1-m4-item-2"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a1-a1-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m4-c-3" data-revision-criterion-id="a1-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Does your feasible-set description combine all restrictions without claiming to have found the optimum?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A complete feasible-set description identifies every permissible candidate, whereas an unsupported optimum claim confuses formulation with proof.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The feasible set requires both the perimeter equality and positivity.</li><li><span class="util-guided-review__feature-key">B.</span> The description refers to all permissible pairs, not only one predicted rectangle.</li><li><span class="util-guided-review__feature-key">C.</span> The original prediction remains identifiable for later comparison.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Revise the description so that a proposed pair must satisfy the equality and both domain conditions simultaneously.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Describe a collection of possible dimension pairs rather than presenting your initial prediction as the only allowed choice.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Preserve your first prediction separately from any corrections to the mathematical formulation.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a1-a1-m4-item-3" data-checklist-item-id="checklist-a1-a1-m4-item-3"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a1-a1-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c1--activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Test which rectangles are feasible</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Apply the objective and restrictions to concrete alternatives, distinguishing numerical improvement from feasibility.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your formulation established two distinct tests: what area a rectangle produces and whether its dimensions satisfy the restriction. You will now apply both tests to concrete alternatives, using numerical evidence to examine your initial prediction and recognise why an attractive result may not be a valid solution.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have defined what makes a rectangle permissible. Now examine several possible dimensions and compare their areas. Some choices may appear attractive because they produce a larger area, but every proposal must be checked against the fixed perimeter. Use the same objective and constraint throughout your investigation.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Use the same two-stage decision process for every proposal: calculate what the rectangle achieves, then check whether it is allowed. Do not infer feasibility from the size of the area. Distinguish the best of the supplied feasible examples from a mathematically proven global maximum.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">What did you initially predict, which calculations most strongly confirmed or challenged that prediction, and what do you now conclude about choosing a rectangle under a fixed perimeter?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A2"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a2-feasibility-pathway-01-activity-a2-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/activity-a2-materials-entry.png" alt="Decision pathway for checking rectangle feasibility before comparing areas; detailed description follows." aria-describedby="lj-c1--figure-description-asset-vb-38-4-va-a2-feasibility-pathway-01-activity-a2-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 2.</strong> Check the restrictions before treating a calculated area as a permissible improvement.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c1--figure-description-asset-vb-38-4-va-a2-feasibility-pathway-01-activity-a2-materials-entry">The pathway begins with a proposed pair of rectangle side lengths. The first check asks whether both lengths are positive. The second calculates the perimeter from two copies of each length and asks whether it equals the fixed total exactly. Failure at either check leads to an infeasible classification: the rectangle&#39;s area may be calculated, but it cannot count as a permissible improvement. Passing both checks leads to a feasible classification, after which its area may be compared with other feasible candidates. The pathway ends by distinguishing such comparison from proof of a global maximum.</p></figure><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A2-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Calculating area is not the same as checking feasibility</span></p><h3 class="util-md-heading util-md-heading--source-2">Two calculations, one decision</h3><p>Consider a <strong>separate illustrative rectangle</strong>, not one of the four proposals in your investigation. Suppose its side lengths are \(x=3\) and \(y=7\), with the same 20-unit perimeter requirement.</p><p>The area is found by multiplying the side lengths:</p><p>\[
A(3,7)=3\times7=21.
\]</p><p>This gives an objective value of 21 square units. It tells us what the proposed rectangle achieves, but not yet whether it is permissible.</p><p>The perimeter uses both pairs of sides:</p><p>\[
P(3,7)=2(3)+2(7)=20.
\]</p><p>Both dimensions are positive, and the calculated perimeter matches the required total. This particular rectangle therefore belongs to the feasible set. Its area of 21 can legitimately be compared with the areas of other feasible rectangles.</p><p>Notice what the calculation establishes and what it does not. We have found the area of one permissible rectangle; we have not proved that its area is the greatest possible. That would require evidence covering all feasible alternatives, not merely one candidate.</p><p>Apply the same reasoning to proposals A–D. For each pair, calculate \(A=xy\) and \(P=2x+2y\), check positivity and the exact perimeter requirement, then compare the objective values of the feasible proposals only. A numerical area can be calculated for an infeasible proposal, but that number cannot establish a permissible improvement.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c1--learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="lj-c1--learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="lj-c1--learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c1--learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c1--learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="lj-c1--learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c1--learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the four proposed pairs of side lengths in the supplied comparison set.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A2-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated rectangle proposals</span></p><h3 class="util-md-heading util-md-heading--source-2">Four proposed rectangles</h3><p>These dimensions are <strong>synthetic teaching examples</strong>, provided for mathematical investigation rather than taken from measured enclosures.</p><p>Each rectangle is intended to use exactly <strong>20 units of perimeter material</strong>. Both side lengths must be positive.</p><p>The four proposals are:</p><table><thead><tr><th>Proposal</th><th>Side length \(x\)</th><th>Side length \(y\)</th></tr></thead><tbody><tr><td>A</td><td>2</td><td>8</td></tr><tr><td>B</td><td>4</td><td>6</td></tr><tr><td>C</td><td>5</td><td>5</td></tr><tr><td>D</td><td>6</td><td>6</td></tr></tbody></table><p>For each proposal, calculate its area and actual perimeter. Decide whether it meets every restriction before comparing it with other permissible choices.</p><p>Do not assume that a proposal is feasible merely because it appears in this table. Do not assume that the largest calculated area identifies a valid solution.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Calculate the area and perimeter for each pair.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a2-a2-m3" data-material-source-id="A2-M3" data-activity-id="A2"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A2-M3" data-m
