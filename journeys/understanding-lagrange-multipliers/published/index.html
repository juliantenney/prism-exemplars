he largest or smallest feasible objective value. Conversely, failure to satisfy the equations does not rule out optimality when the regularity assumption is absent.</p><p>When evaluating a claim, begin with feasibility: does the proposed point satisfy the constraint and any domain restrictions? Then examine the assumptions: is the constraint gradient non-zero where the standard theorem is being used? Next identify what the calculation actually establishes. Finally, ask whether there is enough additional reasoning to justify a local or global conclusion.</p><p>The standard first-order method concerns differentiable objectives under smooth equality constraints at regular points. Extra restrictions, such as inequalities or domain boundaries, need separate attention; the equality-constraint equations alone do not provide a complete analysis of them. Even within the regular setting, first-order equations identify candidates rather than automatically classifying them.</p><p>In &#39;Diagnosing mathematical claims&#39;, you will use these distinctions to judge the strength of statements about constrained optimisation. The aim is not merely to recognise an equation, but to decide which conclusions follow from it, which assumptions are required and which claims still need proof.</p></div></section></section></article></template><template id="lj-resource-c5"><article class="util-learner-page util-page util-learner-renderer-vnext util-page--assessment" data-renderer="vnext" data-page-kind="assessment" data-persistence-page-key="v1::917a08c4-4571-40f5-b47e-fd5d64e77e0a::learner-page::2.0.0::no-activities::diagnosing-mathematical-claims" data-persistence-storage-key="learner-renderer-vnext:draft:v1::917a08c4-4571-40f5-b47e-fd5d64e77e0a::learner-page::2.0.0::no-activities::diagnosing-mathematical-claims" data-composition-mode="moments" data-composed-activity-count="0" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Diagnosing mathematical claims</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="6"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">diagnosis_A_judgement</span><p class="util-journey-position" aria-label="Section 1 of 6"><span class="util-journey-position__visible" aria-hidden="true">1 of 6</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c5--elicitation-diagnosis_A_explanation" aria-label="Next section: Explain your rectangle judgement"><span class="util-journey-adjacent__title">Explain your rectangle judgement</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c5--elicitation-diagnosis_A_judgement" aria-current="location">diagnosis_A_judgement</a></li><li><a class="util-journey-all-link" href="#lj-c5--elicitation-diagnosis_A_explanation">Explain your rectangle judgement</a></li><li><a class="util-journey-all-link" href="#lj-c5--elicitation-diagnosis_B_judgement">diagnosis_B_judgement</a></li><li><a class="util-journey-all-link" href="#lj-c5--elicitation-diagnosis_B_explanation">Explain your stationary-point judgement</a></li><li><a class="util-journey-all-link" href="#lj-c5--elicitation-diagnosis_C_judgement">diagnosis_C_judgement</a></li><li><a class="util-journey-all-link" href="#lj-c5--elicitation-diagnosis_C_explanation">Explain your singular-constraint judgement</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c5/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-assessment-intro" data-region="assessment-intro" data-journey-section="true"><p>A correct calculation does not always justify the conclusion drawn from it. In this approximately eight-minute formative assessment, you will examine three claims about constrained optimisation. For each claim, decide whether the conclusion follows from the mathematical evidence and explain your reasoning. The focus is on evaluating arguments, not carrying out lengthy calculations. Your responses will help you identify how confidently you can distinguish candidate solutions, sufficient justification and the assumptions behind the multiplier method.</p><p>Work through the three mathematical cases in order. For each case, first read the student&#39;s claim and choose the judgement you consider best supported. Then write a brief explanation in your own words, identifying the mathematical reason for your decision and any missing or incorrect reasoning.

Try to make each judgement before consulting the feedback. You will receive explanatory feedback after checking each multiple-choice decision, and reasoning criteria and an example explanation after attempting each written response. Your written explanations are for formative self-review; they are not automatically graded.

You do not need external sources or tools. Focus on the evidence that supports or limits each conclusion rather than repeating full calculations. At the end, consider which aspects of your mathematical judgement are secure and which you would like to strengthen.</p></section><section class="util-assessment-guidance util-assessment-section" data-region="assessment" id="lj-c5--journey-assessment" data-journey-section="true" data-assessment-product="assessment_pack" data-feedback-timing="per_component"><section class="util-assessment-orientation" data-region="assessment-orientation" id="lj-c5--journey-assessment-briefing" data-journey-section="true"><h3>What to bring with you</h3><ul><li><p>If you completed &#39;From geometry to the multiplier equations&#39;, revisit your own rectangle candidate calculation and feasibility reasoning. If you completed &#39;What does the calculation prove?&#39;, revisit your reasoning about necessary and sufficient conditions and constraint regularity.</p><p>Use these earlier ideas to judge whether each mathematical claim follows from the evidence, distinguish a valid candidate from a proven optimum, and explain when the multiplier equations are insufficient or their assumptions fail.</p></li></ul></section><article class="util-assessment-elicitation" data-assessment-mode="determinate" id="lj-c5--elicitation-diagnosis_A_judgement" data-elicitation-id="diagnosis_A_judgement" data-journey-section="true"><p>A rectangle has perimeter 20 units, positive side lengths x and y, and area A(x,y)=xy. Its constraint is x+y=10. Using g(x,y)=x+y, a calculation gives grad A=(y,x), grad g=(1,1), and at (5,5), grad A=(5,5)=5 grad g. The point (5,5) satisfies the constraint. A student concludes: &#39;The multiplier equations hold, so this calculation proves that (5,5) is the global maximum.&#39;</p><article data-assessment-correct="B" class="util-task-block util-assessment-item util-assessment-item--formative util-assessment-item--interactive" data-assessment-mode="interactive" data-assessment-form="single_answer_mcq" data-workspace-kind="assessment_selection" data-workspace-id="assessment-a01" data-assessment-item-id="a01" data-assessment-rationale="The candidate calculation is correct, but the claimed proof is incomplete. The point (5,5) satisfies x+y=10, and grad A=(5,5)=5 grad g when g=x+y. These facts identify a feasible multiplier candidate; they do not establish that its area exceeds or equals the area of every feasible rectangle. A global maximum requires an argument covering the feasible set. The student&#39;s mistake is a conceptual inference error, not an error in the displayed gradient calculation. The multiplier value 5 is appropriate for the stated form of the constraint."><header class="util-assessment-item-header"><h3 class="util-assessment-title util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg></span><span class="util-semantic-icon__label">Question 1</span></h3></header><div class="util-assessment-item-body"><fieldset class="util-assessment-fieldset"><legend class="util-assessment-legend">Which judgement of the student&#39;s argument is best supported?</legend><div class="util-assessment-choices"><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c5--assessment-a01-opt-1" name="assessment-group-a01" value="A" data-assessment-option="A"><label class="util-assessment-option__label" for="lj-c5--assessment-a01-opt-1">The argument is valid: satisfying the multiplier equations at a feasible point proves a global maximum.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c5--assessment-a01-opt-2" name="assessment-group-a01" value="B" data-assessment-option="B"><label class="util-assessment-option__label" for="lj-c5--assessment-a01-opt-2">The candidate calculation is valid, but it does not by itself prove a global maximum; an additional argument about feasible area values is required.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c5--assessment-a01-opt-3" name="assessment-group-a01" value="C" data-assessment-option="C"><label class="util-assessment-option__label" for="lj-c5--assessment-a01-opt-3">The candidate calculation is invalid because the multiplier must equal 5/2 rather than 5.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c5--assessment-a01-opt-4" name="assessment-group-a01" value="D" data-assessment-option="D"><label class="util-assessment-option__label" for="lj-c5--assessment-a01-opt-4">The candidate calculation is invalid because (5,5) does not satisfy the perimeter constraint.</label></div></div></fieldset><button type="button" class="util-assessment-check" data-assessment-check>Check answer</button><div class="util-assessment-result" data-assessment-result aria-live="polite" hidden></div></div></article><section class="util-elicitation-forward" data-region="elicitation-forward"><p>When assessing a proposed optimum, separate what the equations establish from what the conclusion requires. A valid candidate is a starting point for justification, not a substitute for it.</p></section></article><article class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" id="lj-c5--elicitation-diagnosis_A_explanation" data-elicitation-id="diagnosis_A_explanation" data-journey-section="true"><h3>Explain your rectangle judgement</h3><p>Continue with the rectangle argument you have just evaluated. The student has correctly verified the multiplier equations and feasibility at (5,5), but claims that these calculations alone prove a global maximum.</p><p>The calculation identifies (5,5) as a feasible multiplier candidate.</p><p>Explain what the calculation establishes and what further reasoning would be needed to justify the student&#39;s global maximum claim.</p><p>Give a short mathematical explanation that distinguishes a candidate from a proven optimum. You may describe a suitable comparison or proof without carrying out a full derivation.</p><p>Two or three sentences.</p><p>About 45 seconds.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-diagnosis_A_explanation" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c5--assessment-constructed-diagnosis_A_explanation">Your response</label><p>Focus on why the conclusion does or does not follow, rather than repeating the multiplier calculation.</p><textarea class="util-learner-workspace__input" id="lj-c5--assessment-constructed-diagnosis_A_explanation" name="assessment-constructed-diagnosis_A_explanation" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="lj-c5--assessment-constructed-diagnosis_A_explanation-review">Review your response</button></p><div id="lj-c5--assessment-constructed-diagnosis_A_explanation-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="A_explanation_reasoning_criteria"><p>Compare your explanation with these reasoning criteria: (1) Did you acknowledge that (5,5) is feasible and satisfies the stated multiplier equations? (2) Did you distinguish identifying a candidate from proving a global maximum? (3) Did you identify the need for a valid argument about all feasible area values? (4) Did you avoid treating a correct calculation as sufficient proof? An explanation can be mathematically sound without using these exact words. A correct candidate calculation with an unsupported conclusion indicates a conceptual inference error; an incorrect gradient or constraint calculation would be a different, computational error.</p></article><article class="util-formative-material" data-material-id="A_explanation_model"><p>One valid explanation is: &#39;The equations correctly identify (5,5) as a feasible candidate, but they do not by themselves prove a global maximum. Using y=10-x gives A(x,10-x)=25-(x-5)^2, which is at most 25 for every feasible rectangle, with equality at x=5 and y=5. Therefore the global maximum is 25 square units at (5,5).&#39; A shorter explanation that correctly identifies the missing feasible-set comparison also addresses the task.</p></article></section><section class="util-assessment-revision" data-region="assessment-revision" data-automated-judgement="false"><p class="util-revision-offer" data-revision-offered="true">If useful, revise your explanation so it clearly separates the valid multiplier calculation from the additional argument establishing global optimality.</p><div class="util-learner-workspace" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-diagnosis_A_explanation-weakness" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c5--assessment-constructed-diagnosis_A_explanation-weakness">What is the most important weakness you identified in your argument?</label><textarea class="util-learner-workspace__input" id="lj-c5--assessment-constructed-diagnosis_A_explanation-weakness" name="assessment-constructed-diagnosis_A_explanation-weakness" rows="3"></textarea></div><p>Revision is yours to make. It is not marked correct or incorrect.</p><p><a href="#lj-c5--assessment-constructed-diagnosis_A_explanation" data-assessment-return-to-response="assessment-constructed-diagnosis_A_explanation">Revise your written judgement</a></p></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Use the distinction between candidate generation and proof whenever you encounter a proposed optimisation result. The strength of a conclusion depends on the reasoning supporting it.</p></section></article><article class="util-assessment-elicitation" data-assessment-mode="determinate" id="lj-c5--elicitation-diagnosis_B_judgement" data-elicitation-id="diagnosis_B_judgement" data-journey-section="true"><p>Consider f(x,y)=x^3 subject to y=0. At (0,0), grad f=(0,0) and the constraint gradient is grad g=(0,1). The multiplier equations hold with lambda=0. A student concludes: &#39;Because the multiplier equations hold, (0,0) must be a local maximum or a local minimum.&#39;</p><article data-assessment-correct="C" class="util-task-block util-assessment-item util-assessment-item--formative util-assessment-item--interactive" data-assessment-mode="interactive" data-assessment-form="single_answer_mcq" data-workspace-kind="assessment_selection" data-workspace-id="assessment-b01" data-assessment-item-id="b01" data-assessment-rationale="The multiplier equations are satisfied at (0,0), including the valid value lambda=0, but the point is neither a local maximum nor a local minimum. Every point (x,0) is feasible, and the objective there is x^3. For x&gt;0 close to zero, x^3&gt;0; for x&lt;0 close to zero, x^3&lt;0. Thus arbitrarily nearby feasible points have objective values both greater and smaller than f(0,0)=0. The constraint is regular because grad g=(0,1) is non-zero, but regularity makes the first-order condition necessary at a local optimum, not sufficient. The displayed calculation is correct; the inference from it is not."><header class="util-assessment-item-header"><h3 class="util-assessment-title util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg></span><span class="util-semantic-icon__label">Question 2</span></h3></header><div class="util-assessment-item-body"><fieldset class="util-assessment-fieldset"><legend class="util-assessment-legend">Which judgement is best supported by the given information?</legend><div class="util-assessment-choices"><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c5--assessment-b01-opt-1" name="assessment-group-b01" value="A" data-assessment-option="A"><label class="util-assessment-option__label" for="lj-c5--assessment-b01-opt-1">The claim follows because a zero objective gradient guarantees a local extremum.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c5--assessment-b01-opt-2" name="assessment-group-b01" value="B" data-assessment-option="B"><label class="util-assessment-option__label" for="lj-c5--assessment-b01-opt-2">The claim follows because the constraint gradient is non-zero, making the multiplier equations sufficient.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c5--assessment-b01-opt-3" name="assessment-group-b01" value="C" data-assessment-option="C"><label class="util-assessment-option__label" for="lj-c5--assessment-b01-opt-3">The claim does not follow: the equations hold, but feasible values of x^3 occur both above and below zero arbitrarily close to x=0.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c5--assessment-b01-opt-4" name="assessment-group-b01" value="D" data-assessment-option="D"><label class="util-assessment-option__label" for="lj-c5--assessment-b01-opt-4">The claim does not follow because lambda=0 cannot satisfy valid multiplier equations.</label></div></div></fieldset><button type="button" class="util-assessment-check" data-assessment-check>Check answer</button><div class="util-assessment-result" data-assessment-result aria-live="polite" hidden></div></div></article><section class="util-elicitation-forward" data-region="elicitation-forward"><p>A stationary point is not automatically an extremum. When evaluating a local optimality claim, consider what happens to the objective at nearby feasible points.</p></section></article><article class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" id="lj-c5--elicitation-diagnosis_B_explanation" data-elicitation-id="diagnosis_B_explanation" data-journey-section="true"><h3>Explain your stationary-point judgement</h3><p>Continue with f(x,y)=x^3 subject to y=0. The multiplier equations hold at (0,0) with lambda=0, but the student&#39;s claim is that this establishes a local maximum or minimum.</p><p>The first-order equations are satisfied at (0,0).</p><p>Explain whether (0,0) is a local maximum or minimum by considering feasible objective values close to the point.</p><p>Give a concise mathematical reason for your judgement and identify what the multiplier calculation does not establish.</p><p>Two or three sentences.</p><p>About 45 seconds.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-diagnosis_B_explanation" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c5--assessment-constructed-diagnosis_B_explanation">Your response</label><p>Use the behaviour of the objective on the feasible line to support your conclusion.</p><textarea class="util-learner-workspace__input" id="lj-c5--assessment-constructed-diagnosis_B_explanation" name="assessment-constructed-diagnosis_B_explanation" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="lj-c5--assessment-constructed-diagnosis_B_explanation-review">Review your response</button></p><div id="lj-c5--assessment-constructed-diagnosis_B_explanation-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="B_explanation_reasoning_criteria"><p>Compare your explanation with these reasoning criteria: (1) Did you recognise that the multiplier equations hold at (0,0), with lambda=0? (2) Did you examine objective values at feasible points near (0,0)? (3) Did you explain that feasible objective values occur on both sides of zero, ruling out both a local maximum and a local minimum? (4) Did you distinguish the insufficiency of the first-order equations from a failure of constraint regularity? Equivalent mathematical explanations are valid even when phrased differently. A response that rejects the claim without explaining nearby feasible behaviour identifies the conclusion but provides less evidence of the reasoning behind it.</p></article><article class="util-formative-material" data-material-id="B_explanation_model"><p>One valid explanation is: &#39;The multiplier equations hold at (0,0) with lambda=0, but this does not establish a local optimum. Along the feasible line y=0, the objective is x^3, which is negative for nearby negative x and positive for nearby positive x. Therefore (0,0) is neither a local maximum nor a local minimum.&#39; The important evidence is the change in feasible objective values around the candidate, not the exact wording.</p></article></section><section class="util-assessment-revision" data-region="assessment-revision" data-automated-judgement="false"><p class="util-revision-offer" data-revision-offered="true">If useful, revise your explanation to identify feasible points with objective values on both sides of f(0,0) and connect that evidence to the failure of local optimality.</p><p><a href="#lj-c5--assessment-constructed-diagnosis_B_explanation" data-assessment-return-to-response="assessment-constructed-diagnosis_B_explanation">Return to your response</a></p></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Use nearby feasible values to test claims of local optimality. This can reveal a failure of sufficiency even when every displayed first-order calculation is correct.</p></section></article><article class="util-assessment-elicitation" data-assessment-mode="determinate" id="lj-c5--elicitation-diagnosis_C_judgement" data-elicitation-id="diagnosis_C_judgement" data-journey-section="true"><p>Consider f(x,y)=x subject to x^2+y^2=0. The only feasible point is (0,0). At this point, grad f=(1,0) and grad g=(0,0), so no lambda satisfies grad f=lambda grad g. A student concludes: &#39;Since the multiplier equations have no solution, (0,0) cannot be an optimum.&#39;</p><article data-assessment-correct="D" class="util-task-block util-assessment-item util-assessment-item--formative util-assessment-item--interactive" data-assessment-mode="interactive" data-assessment-form="single_answer_mcq" data-workspace-kind="assessment_selection" data-workspace-id="assessment-c01" data-assessment-item-id="c01" data-assessment-rationale="The student&#39;s conclusion is incorrect because the standard multiplier necessity condition does not apply at this singular point. The constraint x^2+y^2=0 has exactly one feasible solution, (0,0). At that point grad g=(0,0), so the required non-zero constraint gradient assumption fails. Although grad f=(1,0) cannot equal lambda(0,0) for any lambda, this does not exclude optimality. Because there are no other feasible points, (0,0) is both a global maximum and a global minimum relative to the feasible set. The failure is not an incorrect gradient calculation; it is the application of a necessary condition without checking its assumptions."><header class="util-assessment-item-header"><h3 class="util-assessment-title util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg></span><span class="util-semantic-icon__label">Question 3</span></h3></header><div class="util-assessment-item-body"><fieldset class="util-assessment-fieldset"><legend class="util-assessment-legend">Which judgement is mathematically justified?</legend><div class="util-assessment-choices"><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c5--assessment-c01-opt-1" name="assessment-group-c01" value="A" data-assessment-option="A"><label class="util-assessment-option__label" for="lj-c5--assessment-c01-opt-1">The student is correct because every constrained optimum must satisfy the multiplier equations, without exception.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c5--assessment-c01-opt-2" name="assessment-group-c01" value="B" data-assessment-option="B"><label class="util-assessment-option__label" for="lj-c5--assessment-c01-opt-2">The student is correct because a zero constraint gradient proves that the feasible set contains no optimum.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c5--assessment-c01-opt-3" name="assessment-group-c01" value="C" data-assessment-option="C"><label class="util-assessment-option__label" for="lj-c5--assessment-c01-opt-3">The student is incorrect because the multiplier equations must have a solution whenever the feasible set contains exactly one point.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c5--assessment-c01-opt-4" name="assessment-group-c01" value="D" data-assessment-option="D"><label class="util-assessment-option__label" for="lj-c5--assessment-c01-opt-4">The student is incorrect: the constraint is singular at (0,0), so the standard multiplier necessity condition does not apply, and the sole feasible point is both a global maximum and a global minimum.</label></div></div></fieldset><button type="button" class="util-assessment-check" data-assessment-check>Check answer</button><div class="util-assessment-result" data-assessment-result aria-live="polite" hidden></div></div></article><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Before using a theorem to accept or reject an optimality claim, check its assumptions. A failed equation is decisive only when the condition is applicable.</p></section></article><article class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" id="lj-c5--elicitation-diagnosis_C_explanation" data-elicitation-id="diagnosis_C_explanation" data-journey-section="true"><h3>Explain your singular-constraint judgement</h3><p>Continue with f(x,y)=x subject to x^2+y^2=0. The only feasible point is (0,0), the constraint gradient vanishes there, and no multiplier satisfies the first-order equations.</p><p>The multiplier equations have no solution at the only feasible point.</p><p>Explain why the absence of a multiplier solution does not rule out an optimum here, and state what can be concluded about (0,0) relative to the feasible set.</p><p>Give a concise explanation addressing the relevant assumption and the role of the feasible set.</p><p>Two or three sentences.</p><p>About 45 seconds.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-diagnosis_C_explanation" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c5--assessment-constructed-diagnosis_C_explanation">Your response</label><p>Explain both the limitation of the multiplier condition and the conclusion supported by the constraint.</p><textarea class="util-learner-workspace__input" id="lj-c5--assessment-constructed-diagnosis_C_explanation" name="assessment-constructed-diagnosis_C_explanation" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="lj-c5--assessment-constructed-diagnosis_C_explanation-review">Review your response</button></p><div id="lj-c5--assessment-constructed-diagnosis_C_explanation-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="C_explanation_reasoning_criteria"><p>Compare your explanation with these reasoning criteria: (1) Did you identify that grad g=(0,0), so the constraint is singular at (0,0)? (2) Did you explain that the standard multiplier necessity condition requires a non-zero constraint gradient? (3) Did you recognise that the absence of a multiplier solution does not exclude optimality when that assumption fails? (4) Did you use the fact that the feasible set contains only (0,0) to justify both global maximum and global minimum status? A response that identifies singularity but does not discuss the feasible set explains why the theorem is inapplicable but does not fully justify the actual optimality conclusion. Equivalent mathematical reasoning is acceptable without exact phrase matching.</p></article><article class="util-formative-material" data-material-id="C_explanation_model"><p>One valid explanation is: &#39;The constraint gradient is zero at (0,0), so the regularity assumption required by the standard multiplier necessity condition fails. The absence of a multiplier solution therefore does not rule out an optimum. Since x^2+y^2=0 allows only (0,0), this point is both a global maximum and a global minimum relative to the feasible set.&#39;</p></article></section><section class="util-assessment-revision" data-region="assessment-revision" data-automated-judgement="false"><p class="util-revision-offer" data-revision-offered="true">If useful, revise your explanation so it addresses both the failed regularity assumption and why the singleton feasible set establishes optimality.</p><p><a href="#lj-c5--assessment-constructed-diagnosis_C_explanation" data-assessment-return-to-response="assessment-constructed-diagnosis_C_explanation">Return to your response</a></p></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Distinguish failure of a necessary condition from failure of the assumptions that make it necessary. Feasible-set reasoning remains essential when the standard multiplier method cannot be applied.</p></section></article><section class="util-pack-forward" data-region="pack-forward" id="lj-c5--journey-assessment-pack-forward" data-journey-section="true"><h2>What to take forward</h2><p>You have evaluated three different mathematical claims. In the rectangle problem, the multiplier equations correctly identify a feasible candidate, but additional reasoning is needed to prove a global maximum. For f(x,y)=x^3 subject to y=0, the first-order equations hold at a regular point that is neither a local maximum nor a local minimum. For f(x,y)=x subject to x^2+y^2=0, the constraint is singular and the standard multiplier necessity condition does not apply, although the only feasible point is both a global maximum and a global minimum. Review your decisions alongside your written explanations: a defensible choice supported by clear mathematical reasoning provides stronger evidence of your judgement than a correct choice alone. If your explanation identified the right conclusion but omitted the reason, focus on making the missing assumption, feasible-set comparison or counterexample explicit. These distinctions will be useful in &#39;Independent constrained optimisation&#39;, where you will need to evaluate candidates and justify conclusions in an unfamiliar problem. This formative assessment offers evidence of your current reasoning; it does not grade your ability or determine what you must study next.</p></section></section></article></template><template id="lj-resource-c6"><article class="util-learner-page util-page util-learner-renderer-vnext util-page--assessment" data-renderer="vnext" data-page-kind="assessment" data-persistence-page-key="v1::98844bf8-6922-43f5-87f3-48d730a91521::learner-page::2.0.0::no-activities::independent-constrained-optimisation" data-persistence-storage-key="learner-renderer-vnext:draft:v1::98844bf8-6922-43f5-87f3-48d730a91521::learner-page::2.0.0::no-activities::independent-constrained-optimisation" data-composition-mode="moments" data-composed-activity-count="0" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Independent constrained optimisation</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="2"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Independent constrained optimisation</span><p class="util-journey-position" aria-label="Section 1 of 2"><span class="util-journey-position__visible" aria-hidden="true">1 of 2</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c6--elicitation-E2" aria-label="Next section: Review your mathematical reasoning"><span class="util-journey-adjacent__title">Review your mathematical reasoning</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c6--elicitation-E1" aria-current="location">Independent constrained optimisation</a></li><li><a class="util-journey-all-link" href="#lj-c6--elicitation-E2">Review your mathematical reasoning</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c6/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-assessment-intro" data-region="assessment-intro" data-journey-section="true"><p>This 20-minute formative assessment brings together the mathematical reasoning you have developed across the Learning Journey. You will work independently on an unfamiliar resource allocation problem, then compare your solution with a fully justified worked answer and evaluate your reasoning. Allow approximately 15 minutes for your independent solution and 5 minutes for feedback-led review. This is an opportunity to examine the quality of your mathematical reasoning, not a graded test.</p><p>Work independently on the resource allocation problem. Produce one coherent worked solution that includes your mathematical calculations and explanations. Identify the objective and constraints, justify your choice of method, solve the problem, check feasibility, establish global optimality and explain the geometric relationship.

Submit your solution before consulting the worked answer and reasoning criteria. These become available during the review phase.

Use the remaining time to compare your solution with the worked answer and complete a brief self-evaluation. Equivalent mathematically valid reasoning is acceptable; your explanation does not need to reproduce the model solution word for word.</p></section><section class="util-assessment-guidance util-assessment-section" data-region="assessment" id="lj-c6--journey-assessment" data-journey-section="true" data-assessment-product="assessment_pack" data-feedback-timing="per_component"><section class="util-assessment-orientation" data-region="assessment-orientation" id="lj-c6--journey-assessment-briefing" data-journey-section="true"><h3>What to bring with you</h3><ul><li><p>If you completed &#39;Why the constraint matters&#39;, &#39;Seeing gradients and tangency&#39; and &#39;From geometry to the multiplier equations&#39;, revisit your own reasoning about feasible choices, gradients, tangency and the construction of multiplier equations. You may also draw on your evaluations from &#39;What does the calculation prove?&#39; and &#39;Diagnosing mathematical claims&#39;.</p><p>Use that earlier reasoning to decide independently how to approach the new resource allocation problem, and to distinguish finding a stationary candidate from justifying a global maximum. During the review, compare the completeness of your new argument with the mathematical standards you considered in those earlier activities.</p></li></ul></section><article class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" id="lj-c6--elicitation-E1" data-elicitation-id="E1" data-journey-section="true"><h3>Independent constrained optimisation</h3><p>Two non-negative allocations, x and y, must share exactly 12 resource units. Their combined performance is represented by the illustrative function P(x,y) = 20x + 16y - x^2 - y^2. The allocations must satisfy x + y = 12, with x &gt;= 0 and y &gt;= 0. The aim is to find the feasible allocation that maximises P. This is a synthetic mathematical model for learning purposes; its coefficients are not empirically validated.</p><p>You are responsible for finding and justifying the best allocation of 12 resource units between two non-negative quantities, x and y, using the illustrative performance function provided.</p><p>Produce a complete, independently worked mathematical solution. Identify the objective and constraints, explain why your chosen method is appropriate, calculate the necessary derivatives, formulate and solve the equations, and check that your result is feasible. Establish whether your solution is a global maximum rather than merely a stationary candidate. Explain the geometric relationship between the objective and constraint at the optimum.</p><p>Show your mathematical working and explain the reasoning supporting your conclusion. Your response should make clear how you obtained your result and why it is valid. You may use mathematical notation and accompanying prose.</p><p>One coherent worked solution with sufficient equations and explanation to make your reasoning assessable.</p><p>Approximately 15 minutes.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-E1" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c6--assessment-constructed-E1">Your response</label><p>Write your solution in your own words and notation. Include the working needed to support your conclusion.</p><textarea class="util-learner-workspace__input" id="lj-c6--assessment-constructed-E1" name="assessment-constructed-E1" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="lj-c6--assessment-constructed-E1-review">Review your response</button></p><div id="lj-c6--assessment-constructed-E1-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="E1_M1"><h4>Worked solution: interpretation and method</h4><p>The objective is to maximise the illustrative performance function P(x,y) = 20x + 16y - x^2 - y^2. The decision variables x and y are non-negative allocations subject to x + y = 12. The equality constraint can be written g(x,y) = x + y = 12. Since grad g = (1,1) is non-zero everywhere, the equality constraint is regular. The Lagrange multiplier method is appropriate for identifying a constrained stationary candidate. At a regular constrained local optimum, the necessary first-order condition is grad P = lambda grad g, together with the equality constraint. This condition identifies candidates; it does not by itself establish a global maximum.</p></article><article class="util-formative-material" data-material-id="E1_M2"><h4>Worked solution: derivatives and multiplier equations</h4><p>Differentiate the objective: partial P/partial x = 20 - 2x and partial P/partial y = 16 - 2y. Hence grad P = (20 - 2x,16 - 2y). For g(x,y) = x + y, grad g = (1,1). The multiplier equations are 20 - 2x = lambda, 16 - 2y = lambda and x + y = 12. Equating the first two expressions gives 20 - 2x = 16 - 2y, so x - y = 2. Solving x - y = 2 and x + y = 12 gives x = 7 and y = 5. Substitution into either multiplier equation gives lambda = 6.</p></article><article class="util-formative-material" data-material-id="E1_M3"><h4>Worked solution: feasibility and global optimality</h4><p>The candidate (7,5) is feasible because 7 + 5 = 12 and both allocations are non-negative. Its objective value is P(7,5) = 20(7) + 16(5) - 7^2 - 5^2 = 140 + 80 - 49 - 25 = 146. To prove global optimality, substitute y = 12 - x. The non-negativity restrictions give 0 &lt;= x &lt;= 12. Then P(x,12-x) = 20x + 16(12-x) - x^2 - (12-x)^2 = 146 - 2(x-7)^2. Because (x-7)^2 &gt;= 0, P(x,12-x) &lt;= 146 for every feasible x. Equality occurs only when x = 7, which requires y = 5. Therefore (7,5) is the unique global maximiser and the maximum illustrative performance is 146. This proof establishes more than the multiplier equations alone.</p></article><article class="util-formative-material" data-material-id="E1_M4"><h4>Worked solution: geometric interpretation</h4><p>At the optimum, grad P(7,5) = (20 - 14,16 - 10) = (6,6), while grad g(7,5) = (1,1). Therefore grad P(7,5) = 6 grad g(7,5). Both gradients are non-zero and parallel. Each is perpendicular to the tangent of its corresponding regular level curve. Consequently, the objective level curve P(x,y) = 146 and the constraint line x + y = 12 share a tangent at (7,5). This is the geometric meaning of the multiplier condition in this problem. Tangency identifies the stationary relationship; the completed-square argument establishes the unique global maximum.</p></article><article class="util-formative-material" data-material-id="E1_M5"><h4>Reasoning criteria for self-evaluation</h4><p>Compare your independent solution with these criteria. Mathematical interpretation and method selection: Did you correctly identify the objective, variables, equality constraint and non-negativity restrictions, and explain why the multiplier method applies? Procedural calculation and feasibility: Did you differentiate accurately, formulate and solve the simultaneous equations, and check every constraint? Global optimality justification: Did you distinguish a stationary candidate from a proven optimum and establish the maximum over the entire feasible set? Geometric explanation: Did you explain the parallel non-zero gradients and their relationship to tangency of regular level curves? Formative self-evaluation: Can you identify a mathematically supported strength and a specific improvement in your own response? An equivalent valid argument need not use exactly the same wording or algebraic sequence as the worked solution.</p></article><article class="util-formative-material" data-material-id="E1_M6"><h4>Connecting the calculation to earlier mathematical reasoning</h4><p>In &#39;Why the constraint matters&#39;, feasible choices were distinguished from choices that violated the constraint. That distinction remains essential when checking the allocation (7,5). In &#39;Seeing gradients and tangency&#39; and &#39;From geometry to the multiplier equations&#39;, the geometric relationship between gradients was connected to formal equations; the same relationship appears here through grad P = lambda grad g. In &#39;What does the calculation prove?&#39; and &#39;Diagnosing mathematical claims&#39;, the distinction between satisfying necessary conditions and establishing an optimum was central. The completed-square proof supplies the additional justification required here. Recall that Example B showed a multiplier candidate that was not an optimum, while Example C showed why regularity matters. Neither limitation invalidates the present calculation: the constraint is regular, and global optimality has been established separately.</p></article></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Compare your submitted solution with the worked argument, paying particular attention to whether you justified the method, verified feasibility and proved global optimality rather than stopping at the multiplier equations. Use the reasoning criteria to identify what your solution demonstrates and what would make it more convincing.</p></section></article><article class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" id="lj-c6--elicitation-E2" data-elicitation-id="E2" data-journey-section="true"><h3>Review your mathematical reasoning</h3><p>You have completed your independent solution and can now compare it with the fully justified worked solution and the reasoning criteria.</p><p>Evaluate the completeness and mathematical validity of your own response. Identify one aspect of your reasoning that is well supported and one specific aspect you would improve. Explain your choices using evidence from your working and the review criteria.</p><p>Provide a brief, evidence-based reflection that identifies a mathematical strength and a concrete improvement. Refer to the relevant parts of your own solution rather than giving only a general confidence judgement.</p><p>Two short explanations: one strength and one improvement.</p><p>Within the approximately 5-minute feedback-led review.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-E2" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c6--assessment-constructed-E2">Your response</label><p>Identify a specific strength and a specific improvement, explaining the mathematical evidence for each.</p><textarea class="util-learner-workspace__input" id="lj-c6--assessment-constructed-E2" name="assessment-constructed-E2" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="lj-c6--assessment-constructed-E2-review">Review your response</button></p><div id="lj-c6--assessment-constructed-E2-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="E2_M1"><h4>What makes a useful mathematical self-evaluation?</h4><p>A useful self-evaluation identifies evidence from your actual solution rather than simply stating that you were confident or that your answer matched the worked example. A mathematical strength is supported by something you did correctly, such as establishing the constraints, deriving valid equations, checking feasibility or proving the global maximum. A useful improvement identifies a specific omission, error or unclear explanation and states what would strengthen it. For example, if your response stopped after solving the multiplier equations, the improvement would be to add a separate argument establishing optimality over the feasible set. If your solution contained a valid global proof but little geometric explanation, the improvement would be to connect the gradients explicitly to tangency. These are illustrative possibilities, not judgements about your particular response.</p></article><article class="util-formative-material" data-material-id="E2_M2"><h4>Interpreting your evidence</h4><p>Your independent solution provides evidence of how you approached this unfamiliar problem. The worked solution provides a reference for mathematical validity, while your reflection identifies which parts of your reasoning are secure and which need strengthening. A correct allocation is useful evidence, but it does not replace the reasoning that establishes feasibility and global optimality. An alternative mathematically valid proof can meet the criteria even when it differs from the model approach. This review does not assign a grade or determine your subsequent learning pathway.</p></article></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Use the strength and improvement you identified as a personal reference when you next solve a constrained optimisation problem. Aim to preserve the reasoning you demonstrated securely and make the part you identified for improvement more explicit, particularly the distinction between finding a candidate and proving an optimum.</p></section></article><section class="util-pack-forward" data-region="pack-forward" id="lj-c6--journey-assessment-pack-forward" data-journey-section="true"><h2>What to take forward</h2><p>You have completed an independent constrained optimisation problem and reviewed the mathematical reasoning supporting its solution. The central lesson is that a successful argument does more than produce numerical values: it interprets the objective and constraints, applies an appropriate method accurately, verifies feasibility, establishes global optimality and explains the geometric relationship. Carry forward the strength and improvement identified in your self-evaluation. The same distinction between a stationary candidate and a justified optimum remains important when evaluating future mathematical claims. This formative review is intended to inform your judgement and future practice, not to assign a grade or control what you study next.</p></section></section></article></template></div><script type="application/json" id="lj-shell-manifest">[{"commissionId":"overview","title":"Overview","kind":"overview","pageKey":"","productId":""},{"commissionId":"c1","title":"Why the constraint matters","kind":"resource","pageKey":"v1::25416221-1206-4b10-83c1-4697623229b7::learner-page::2.0.0::a1-a2-a3::why-the-constraint-matters","productId":"interactive"},{"commissionId":"c2","title":"Seeing gradients and tangency","kind":"resource","pageKey":"v1::7b3b0faa-20af-4e91-84ef-26fb7d1b5e92::learner-page::2.0.0::a1-a2-a3-a4::seeing-gradients-and-tangency","productId":"interactive"},{"commissionId":"c3","title":"From geometry to the multiplier equations","kind":"resource","pageKey":"v1::ca68c3ba-2376-45c9-b099-1d58b1da6a5a::learner-page::2.0.0::no-activities::from-gradients-to-multiplier-equations","productId":"expository"},{"commissionId":"c4","title":"What does the calculation prove?","kind":"resource","pageKey":"v1::c96731df-f429-49a1-839c-f99edaf37dfd::learner-page::2.0.0::no-activities::from-candidate-t
