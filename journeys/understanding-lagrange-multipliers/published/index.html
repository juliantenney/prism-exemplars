<path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c1--learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c1--learner-task-a2">Back to your task (Test which rectangles are feasible)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M6" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m6" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m6-c-0" data-revision-criterion-id="a2-m6-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you calculated each proposed rectangle&#39;s area using the two supplied dimensions?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An incorrect objective value can reverse the ranking of the permissible candidates and undermine your comparison.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each area is obtained by multiplying the corresponding side lengths.</li><li><span class="util-guided-review__feature-key">B.</span> The area values are expressed consistently in square units.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Return to each dimension pair and multiply its two entries rather than adding them or using the perimeter formula.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Distinguish the units of area from the linear units used for side lengths and perimeter.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a2-a2-m6-item-0" data-checklist-item-id="checklist-a2-a2-m6-item-0"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a2-a2-m6-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m6-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m6-c-1" data-revision-criterion-id="a2-m6-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you checked the perimeter and positivity conditions before classifying every proposal?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Feasibility depends on all restrictions; an area comparison alone cannot identify which proposals are permitted.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each perimeter calculation includes two copies of each side length.</li><li><span class="util-guided-review__feature-key">B.</span> Each classification is explicitly compared with the exact 20-unit requirement.</li><li><span class="util-guided-review__feature-key">C.</span> Both side lengths are checked against the positive-domain restriction.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Reconstruct the perimeter from all four sides for any row where the total was calculated differently.</li><li><span class="util-guided-review__feature-key">Missing B:</span> For each row, state whether its calculated perimeter equals the required total rather than judging it by closeness.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Include a positivity check in the reasoning even when the perimeter calculation appears satisfactory.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a2-a2-m6-item-1" data-checklist-item-id="checklist-a2-a2-m6-item-1"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a2-a2-m6-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m6-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m6-c-2" data-revision-criterion-id="a2-m6-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Does your comparison distinguish the best feasible proposal from the largest area across all proposals?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Selecting a high objective value from an infeasible candidate would answer a different problem from the one posed.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The comparison excludes infeasible proposals when identifying a permissible choice.</li><li><span class="util-guided-review__feature-key">B.</span> The conclusion is limited to the supplied feasible examples.</li><li><span class="util-guided-review__feature-key">C.</span> A numerically larger but infeasible area is explained rather than ignored.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Separate candidates that satisfy every restriction from those that do not before ranking their areas.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Qualify any claim of absolute optimality as a comparison of the investigated candidates unless you have a general proof.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Connect the apparent improvement to the resource requirement it violates.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a2-a2-m6-item-2" data-checklist-item-id="checklist-a2-a2-m6-item-2"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a2-a2-m6-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m6-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m6-c-3" data-revision-criterion-id="a2-m6-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you used specific numerical evidence to explain how your prediction changed or was confirmed?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A reflection without identifiable calculations does not show how evidence informed your judgement.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your original prediction is identifiable and has not been silently rewritten.</li><li><span class="util-guided-review__feature-key">B.</span> You refer to relevant calculated areas or perimeters when explaining your response.</li><li><span class="util-guided-review__feature-key">C.</span> Your current conclusion explains what the evidence supports and what remains unproved.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Restore the prediction you made before calculating areas, keeping it separate from your current view.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify at least one specific pair of dimensions and the calculation that affected your reasoning.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Distinguish what the four comparisons establish from a claim about every possible feasible rectangle.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a2-a2-m6-item-3" data-checklist-item-id="checklist-a2-a2-m6-item-3"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a2-a2-m6-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m6-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Review the example response</summary><div class="util-composition-reveal__body"><article class="util-material-block util-sample-output util-prose-measure" data-material-id="A2-M5" data-material-type="sample_output" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><span class="util-semantic-icon__label">Reveal after your attempt: What the four proposals show</span></p><h3 class="util-md-heading util-md-heading--source-3">Review the calculated results</h3><p><strong>Release after you have completed the comparison table and explained your conclusion.</strong></p><table><thead><tr><th>Proposed dimensions</th><th>Area</th><th>Perimeter</th><th>Feasibility</th><th>Reason</th></tr></thead><tbody><tr><td>\((2,8)\)</td><td>16</td><td>20</td><td>Feasible</td><td>Both lengths are positive and the perimeter is exactly 20.</td></tr><tr><td>\((4,6)\)</td><td>24</td><td>20</td><td>Feasible</td><td>Both lengths are positive and the perimeter is exactly 20.</td></tr><tr><td>\((5,5)\)</td><td>25</td><td>20</td><td>Feasible</td><td>Both lengths are positive and the perimeter is exactly 20.</td></tr><tr><td>\((6,6)\)</td><td>36</td><td>24</td><td>Infeasible</td><td>Its perimeter exceeds the fixed 20-unit requirement.</td></tr></tbody></table><p>The area calculations use \(A=xy\). The perimeter calculations use \(P=2x+2y\).</p><p>For example, the fourth proposal produces</p><p>\[
A(6,6)=6\times6=36
\]</p><p>but its perimeter is</p><p>\[
P(6,6)=2(6)+2(6)=24.
\]</p><p>Although 36 is larger than every other area in the table, the rectangle would require 24 units of material. It is not an improvement available under the stated restriction.</p><p>Among the <strong>three feasible proposals supplied</strong>, \((5,5)\) gives the largest area: 25 square units. This is a valid comparison of the candidates investigated.</p><p>It is not yet a proof that \((5,5)\) is the best rectangle among <strong>all</strong> positive side lengths satisfying the perimeter requirement. There are infinitely many feasible dimension pairs, and the table contains only three of them.</p><h3 class="util-md-heading util-md-heading--source-3">Debrief</h3><p>Return to your original prediction. Which result was most informative: the variation in area among feasible rectangles, or the attractive but impermissible fourth proposal? Explain how that evidence affected your reasoning.</p></article></div></details></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c1--activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Defend the best permissible choice</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Establish a global constrained maximum through algebra, contrast the restricted and unrestricted problems, and independently apply the feasibility principle to a different resource decision.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The numerical comparison established which supplied rectangles are feasible and how their areas differ. It did not, by itself, establish that no untested feasible rectangle could perform better. You will now move from comparison to a general algebraic justification, then use the distinction between feasibility and objective value to evaluate a different kind of claim.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Your comparisons have shown why checking the restriction matters. Now develop a stronger mathematical justification for your decision. Use the fixed-perimeter equation to investigate all permissible positive side lengths, not just the examples already considered. Then apply the same reasoning to a different decision about what can count as a valid improvement.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Use the equality constraint to reduce the rectangle problem to one variable, then look for an algebraic reason why no feasible choice can exceed a particular area. Distinguish mathematical proof from a sample comparison. For the transfer claim, apply the same decision criteria without assuming that the largest stated output is automatically admissible.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">What did you originally expect about the best rectangle, what evidence or algebra confirmed or challenged that expectation, and what can you now explain about why constraints matter in a different resource decision?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A3"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A3-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">From a promising example to a justified maximum</span></p><h3 class="util-md-heading util-md-heading--source-2">What would establish the best permissible rectangle?</h3><p>The earlier investigation produced a meaningful result: several rectangles satisfied the perimeter requirement, and their areas differed. One of the supplied feasible rectangles had a larger area than the other supplied feasible rectangles. That supports a <strong>comparison of the tested choices</strong>. It does not, on its own, establish a global maximum.</p><p>The distinction matters because a fixed perimeter permits more than the few dimensions in the table. A rectangle with dimensions not yet tested might have a different area. To justify a global conclusion, an argument must cover <strong>every positive pair satisfying the perimeter equality</strong>, not only the pairs already examined.</p><p>Feasibility comes first. The perimeter equation determines which dimensions are permitted, and positivity excludes lengths that cannot represent the intended rectangle. A candidate&#39;s calculated area is relevant only after these conditions are met. This is why the proposal with an especially large area but an excessive perimeter cannot compete with feasible rectangles.</p><p>Among permissible candidates, area provides the basis for comparison. However, identifying the greatest area in a finite table and establishing a bound that no feasible rectangle can exceed are different kinds of mathematical evidence. The first is a sampled comparison; the second can justify a global conclusion.</p><p>One way to develop such a bound is to use the equality constraint to express one variable in terms of the other. Substitution then gives an area expression depending on a single variable. Algebraic rearrangement can sometimes reveal an upper bound and the condition under which equality holds. For example, an expression of the form</p><p>\[
c-(t-a)^2
\]</p><p>cannot exceed \(c\), because a square is non-negative. The bound is attained when \(t=a\), provided that value is permitted by the original restrictions. This is a general algebraic pattern, not the completed derivation for your rectangle.</p><p>A convincing conclusion must therefore bring together three things: the proposed dimensions satisfy the original restrictions; their area is correctly determined; and the reasoning rules out every feasible alternative with a larger area. If any of these is missing, the strength of the conclusion must be reduced.</p><p>There is also a meaningful comparison with an <strong>unrestricted positive-domain problem</strong>. Removing the fixed-perimeter equality changes which pairs can be chosen. A conclusion justified for the constrained feasible set need not remain valid for the larger domain.</p><p>Use these distinctions to develop your own algebraic argument before opening the worked solution. Your aim is not merely to name a plausible rectangle, but to justify exactly what the mathematics permits you to conclude.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c1--learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="lj-c1--learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="lj-c1--learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c1--learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c1--learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="lj-c1--learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c1--learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Use the equality constraint to express one rectangle side length in terms of the other, then substitute into the area function.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A3-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated resource-allocation claim</span></p><h3 class="util-md-heading util-md-heading--source-2">A different resource decision</h3><p>This is an <strong>illustrative, synthetic teaching model</strong>, not a validated description of an actual organisation or production process.</p><p>An organisation divides exactly 10 resource units between two activities. Let \(u\) and \(v\) denote the allocations. Neither allocation can be negative.</p><p>The illustrative output is</p><p>\[
Q(u,v)=uv.
\]</p><p>The resource restriction is</p><p>\[
u+v=10,\qquad u\geq0,\quad v\geq0.
\]</p><p>Two allocations are under discussion:</p><table><thead><tr><th>Proposal</th><th>Allocation \(u\)</th><th>Allocation \(v\)</th></tr></thead><tbody><tr><td>Existing allocation</td><td>5</td><td>5</td></tr><tr><td>Proposed replacement</td><td>6</td><td>6</td></tr></tbody></table><p>A colleague claims:</p><p>&gt; We should prefer the replacement allocation because it produces a larger output.</p><p>Use the stated model and resource conditions to evaluate that claim. Calculate the relevant outputs and resource totals yourself before deciding whether the proposal represents a permissible improvement.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Use algebra to establish an upper bound for the area over all permissible positive side lengths and identify where that bound is attained.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">My algebraic justification</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Justify your decision using the criteria of feasibility, objective value and evidence sufficient to support a global conclusion.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M5" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">My transfer judgement and final reflection</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain how the optimisation problem changes if the fixed-perimeter equality is removed while side lengths remain positive.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Apply the same distinction to the supplied short resource-allocation claim: identify the objective, the resource restriction, whether the proposed allocation is permissible, and whether the claim of improvement is justified.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A concise algebraic justification that correctly incorporates the equality and positivity restrictions, establishes a valid upper bound for the feasible area and identifies a choice attaining it. The explanation distinguishes a proof over the feasible set from a comparison of selected examples and contrasts the constrained problem with the unrestricted positive-domain problem. A separate short transfer judgement identifies the relevant objective and restriction in the changed context, checks the proposed choice against the available resource and justifies whether its claimed improvement is permissible. A final reflection identifies the initial view, decisive evidence and current conclusion.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure util-learner-workspace--math-entry" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-substitute-the-constraint-1" data-response-part-id="A3-template-section-a3-m3-section-substitute-the-constraint-1" data-input-modality="math" data-math-entry="true" data-math-field-id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-substitute-the-constraint-1" data-math-label-id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-substitute-the-constraint-1-label"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-substitute-the-constraint-1-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-substitute-the-constraint-1">Substitute the constraint</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-substitute-the-constraint-1-desc">Rearrange the perimeter equality to express one side length in terms of the other. Record the permissible domain for the remaining variable.</p><div class="util-math-entry" data-math-entry-root><div class="util-math-entry__mount" data-math-entry-mount hidden></div><textarea class="util-learner-workspace__input util-learner-workspace__input--canonical" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-substitute-the-constraint-1" name="learner-workspace-a3-a3-template-section-a3-m3-section-substitute-the-constraint-1" rows="6" aria-labelledby="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-substitute-the-constraint-1-label" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-substitute-the-constraint-1-desc lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-substitute-the-constraint-1-math-hint"></textarea><p class="util-math-entry__hint" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-substitute-the-constraint-1-math-hint">Enter your mathematical expression. Use the maths keyboard for symbols and structures.</p><p class="util-math-entry__hint util-math-entry__hint--fallback-only">If the maths editor is unavailable, enter mathematical notation in this field.</p></div></div><div class="util-learner-workspace util-prose-measure util-learner-workspace--math-entry" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace 5-section-my-judgement-and-justification-3">My judgement and justification</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-my-judgement-and-justification-3-desc">Explain whether the proposed replacement is a permissible improvement. Support your judgement with the relevant numerical results and the distinction between output and feasibility.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-my-judgement-and-justification-3" name="learner-workspace-a3-a3-template-section-a3-m5-section-my-judgement-and-justification-3" rows="5" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-my-judgement-and-justification-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-best-permissible-choice-and-justification-4" data-response-part-id="A3-template-section-a3-m3-section-best-permissible-choice-and-justification-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-best-permissible-choice-and-justification-4-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-best-permissible-choice-and-justification-4">Best permissible choice and justification</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-best-permissible-choice-and-justification-4-desc">Identify the dimensions that attain the bound, check the original restrictions and explain why the argument establishes a global conclusion.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-best-permissible-choice-and-justification-4" name="learner-workspace-a3-a3-template-section-a3-m3-section-best-permissible-choice-and-justification-4" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-best-permissible-choice-and-justification-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m5-section-initial-prediction-evidence-and-final-conclusion-4" data-response-part-id="A3-template-section-a3-m5-section-initial-prediction-evidence-and-final-conclusion-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-initial-prediction-evidence-and-final-conclusion-4-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-initial-prediction-evidence-and-final-conclusion-4">Initial prediction, evidence and final conclusion</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-initial-prediction-evidence-and-final-conclusion-4-desc">Return to your original rectangle prediction. State what you initially expected, which calculations or algebra confirmed or changed your thinking, and what you now understand about deciding what counts as the best permissible choice.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-initial-prediction-evidence-and-final-conclusion-4" name="learner-workspace-a3-a3-template-section-a3-m5-section-initial-prediction-evidence-and-final-conclusion-4" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-initial-prediction-evidence-and-final-conclusion-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-comparison-with-the-unrestricted-problem-5" data-response-part-id="A3-template-section-a3-m3-section-comparison-with-the-unrestricted-problem-5"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-comparison-with-the-unrestricted-problem-5-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-comparison-with-the-unrestricted-problem-5">Comparison with the unrestricted problem</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-comparison-with-the-unrestricted-problem-5-desc">Explain what changes when the perimeter equality is removed but the side lengths remain positive. Discuss whether the same finite maximum is still justified.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-comparison-with-the-unrestricted-problem-5" name="learner-workspace-a3-a3-template-section-a3-m3-section-comparison-with-the-unrestricted-problem-5" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-comparison-with-the-unrestricted-problem-5-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c1--learner-check-a3" data-check-sidebar-open aria-controls="lj-c1--learner-check-a3" aria-expanded="false" aria-label="Check your work: Defend the best permissible choice">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c1--learner-check-a3" data-composition-moment="check" data-activity-id="A3" data-check-sidebar="available" aria-labelledby="lj-c1--learner-check-a3-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c1--learner-check-a3-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c1--learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c1--learner-task-a3">Back to your task (Defend the best permissible choice)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M8" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m8" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m8-c-0" data-revision-criterion-id="a3-m8-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you used the perimeter equality correctly to derive an area expression covering every feasible rectangle?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An algebraic result cannot justify the constrained maximum if the substitution changes the restriction or omits part of the feasible domain.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> One side length is expressed in terms of the other using an equivalent form of the fixed-perimeter equality.</li><li><span class="util-guided-review__feature-key">B.</span> The resulting one-variable area expression follows from substituting into the original objective.</li><li><span class="util-guided-review__feature-key">C.</span> The remaining variable&#39;s domain reflects positivity of both original side lengths.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Rearrange the equality while preserving its meaning, then check that substituting your expression reproduces the original perimeter.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Replace the eliminated side length in the area product with your constraint-based expression, then simplify the product.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Use the positivity requirements for both dimensions to identify the permitted interval for the remaining variable.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a3-a3-m8-item-0" data-checklist-item-id="checklist-a3-a3-m8-item-0"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a3-a3-m8-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m8-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m8-c-1" data-revision-criterion-id="a3-m8-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Does your argument justify a global maximum rather than only identifying a promising rectangle?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A global claim requires an upper bound valid across the whole feasible set and a feasible choice that attains that bound.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The algebra establishes an upper bound using a mathematical property that holds for every feasible value.</li><li><span class="util-guided-review__feature-key">B.</span> The dimensions attaining the bound are identified and checked against the original restrictions.</li><li><span class="util-guided-review__feature-key">C.</span> The conclusion explains why the reasoning applies beyond the four sampled proposals.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Rearrange the area expression so that a non-negative quantity explains why the area cannot exceed your proposed bound.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Find when equality holds in your bound, then verify both side lengths are positive and the perimeter is exactly the required total.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Connect your one-variable expression and its domain to all feasible rectangles, not just those in the comparison table.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a3-a3-m8-item-1" data-checklist-item-id="checklist-a3-a3-m8-item-1"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a3-a3-m8-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m8-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m8-c-2" data-revision-criterion-id="a3-m8-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you accurately explained how removing the perimeter equality changes the optimisation problem?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A maximum proved for a restricted feasible set need not remain a maximum when the domain is enlarged.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your explanation distinguishes the original feasible set from the positive-domain choices available without the equality.</li><li><span class="util-guided-review__feature-key">B.</span> Your conclusion about a finite maximum is supported by reasoning about how area changes as dimensions increase.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify which restriction is removed and which positivity conditions remain, then describe how the permitted choices change.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Consider whether both positive dimensions can increase without violating any remaining condition, and connect that possibility to the area product.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a3-a3-m8-item-2" data-checklist-item-id="checklist-a3-a3-m8-item-2"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a3-a3-m8-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m8-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m8-c-3" data-revision-criterion-id="a3-m8-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you supported the transfer judgement with the resource calculations and explained how the evidence affected your original thinking?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A valid transfer judgement must evaluate the new claim under its own restrictions, while the reflection should show how evidence changed or confirmed your understanding.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Both allocation proposals have calculated outputs and resource totals.</li><li><span class="util-guided-review__feature-key">B.</span> Your judgement distinguishes larger calculated output from permissible improvement.</li><li><span class="util-guided-review__feature-key">C.</span> Your reflection identifies the original rectangle prediction, decisive evidence and current conclusion.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Apply the supplied output expression and resource-sum condition separately to each allocation before making a comparison.</li><li><span class="util-guided-review__feature-key">Missing B:</span> State whether each allocation satisfies the exact resource requirement, then explain how that classification affects the colleague&#39;s claim.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Restore your initial prediction and connect at least one numerical comparison or algebraic result to the conclusion you now hold.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a3-a3-m8-item-3" data-checklist-item-id="checklist-a3-a3-m8-item-3"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a3-a3-m8-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m8-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Review the example response</summary><div class="util-composition-reveal__body"><article class="util-material-block util-sample-output util-prose-measure" data-material-id="A3-M6" data-material-type="sample_output" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><span class="util-semantic-icon__label">Reveal after your attempt: Proving the rectangle maximum</span></p><p><strong>Release after you have completed your algebraic justification and unrestricted-problem comparison.</strong></p><h3 class="util-md-heading util-md-heading--source-3">Reducing the problem to one variable</h3><p>The fixed-perimeter equality is</p><p>\[
2x+2y=20.
\]</p><p>Dividing by 2 gives \(x+y=10\), so</p><p>\[
y=10-x.
\]</p><p>Because both side lengths must be positive, the remaining variable must satisfy</p><p>\[
0&lt;x&lt;10.
\]</p><p>Every value in this interval determines exactly one feasible pair \((x,10-x)\). The substitution therefore covers the entire feasible set, not merely the examples previously tested.</p><p>The area becomes</p><p>\[
A(x,10-x)=x(10-x)=10x-x^2.
\]</p><h3 class="util-md-heading util-md-heading--source-3">Establishing an upper bound</h3><p>Complete the square:</p><p>\[
\begin{aligned}
A(x,10-x)&amp;=10x-x^2\\
&amp;=25-(x^2-10x+25)\\
&amp;=25-(x-5)^2.
\end{aligned}
\]</p><p>For every real \(x\), the squared term is non-negative:</p><p>\[
(x-5)^2\geq0.
\]</p><p>Consequently, every feasible rectangle satisfies</p><p>\[
A(x,10-x)=25-(x-5)^2\leq25.
\]</p><p>This is a global upper bound on area for the stated feasible set.</p><p>Equality occurs precisely when</p><p>\[
(x-5)^2=0,
\]</p><p>which requires \(x=5\). The perimeter equality then gives \(y=5\). Both lengths are positive, and their sum is 10, so the rectangle is feasible.</p><p>The <strong>unique global maximum</strong> for this problem is therefore attained at</p><p>\[
(x,y)=(5,5),\qquad A_{\max}=25.
\]</p><p>The maximum area is <strong>25 square units</strong>.</p><p>This conclusion is stronger than the earlier numerical comparison. The completed-square expression applies to every permissible positive side length, so it proves that no feasible rectangle has a larger area. The equality condition also establishes uniqueness.</p><h3 class="util-md-heading util-md-heading--source-3">What happens without the perimeter restriction?</h3><p>If the equality \(x+y=10\) is removed while \(x&gt;0\) and \(y&gt;0\) remain, the area is still \(A(x,y)=xy\), but the choice of dimensions is no longer restricted by the fixed amount of material.</p><p>For any positive dimensions, increasing one side while keeping the other positive increases the area. Both dimensions can also grow without bound. For example, taking \(x=y=t\) gives</p><p>\[
A(t,t)=t^2,
\]</p><p>which increases without bound as positive \(t\) increases.</p><p>Thus the unrestricted positive-domain problem has <strong>no finite global maximum</strong>. The finite maximum of 25 arises from the fixed-perimeter constraint.</p><h3 class="util-md-heading util-md-heading--source-3">Debrief</h3><p>The numerical investigation helped identify a promising feasible choice. The algebra established why it is globally optimal. The constraint is not an incidental detail: it defines the domain over which the claim of optimality is valid.</p></article></div></details><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Review the example response</summary><div class="util-composition-reveal__body"><article class="util-material-block util-sample-output util-prose-measure" data-material-id="A3-M7" data-material-type="sample_output" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><span class="util-semantic-icon__label">Reveal after your attempt: Reviewing the allocation claim</span></p><p><strong>Release after you have submitted your independent resource-allocation judgement.</strong></p><p>The illustrative output function is</p><p>\[
Q(u,v)=uv,
\]</p><p>with the exact resource restriction</p><p>\[
u+v=10,\qquad u\geq0,\quad v\geq0.
\]</p><p>For the proposed replacement \((6,6)\), the output is</p><p>\[
Q(6,6)=6\times6=36.
\]</p><p>But the total resource use is</p><p>\[
6+6=12.
\]</p><p>This exceeds the available 10 units, so the replacement is <strong>infeasible</strong>.</p><p>For the existing allocation \((5,5)\), the output is</p><p>\[
Q(5,5)=5\times5=25.
\]</p><p>Its total resource use is</p><p>\[
5+5=10,
\]</p><p>and both allocations are non-negative. It is therefore <strong>feasible</strong>.</p><p>The colleague is correct that the replacement has a larger calculated output under the illustrative function. However, the claim that it should be preferred under the fixed resource condition does not follow: the proposed replacement uses more resource than is available.</p><p>The defensible judgement is that <strong>the larger output is not a permissible improvement under the stated restriction</strong>. This comparison evaluates the proposed replacement; it does not, by itself, prove that the existing allocation is globally optimal among all feasible allocations.</p><h3 class="util-md-heading util-md-heading--source-3">Debrief</h3><p>The mathematical structure is familiar even though the context has changed. An objective measures what you want to improve; a constraint determines which choices are allowed. A defensible decision requires both.</p></article></div></details></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A3"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M4" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Evaluate a different claim of improvement</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910" data-response-part-id="A3-transfer-prompt-a3-m4-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-transfer-prompt-a3-m4-910-label" for="lj-c1--learner-workspace-a3-a3-transfer-prompt-a3-m4-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="lj-c1--learner-workspace-a3-a3-transfer-prompt-a3-m4-910-desc"><p>Return to the <strong>simulated resource-allocation claim</strong> in the accompanying scenario. This time the decision concerns dividing a fixed resource between two activities, rather than choosing the dimensions of a rectangle.</p><p>Write a short judgement addressed to the colleague making the proposal.</p><ol><li>Identify the output function and the exact resource restriction.</li><li>Calculate the output and total resource use for each proposed allocation.</li><li>Decide which allocations satisfy all the stated conditions.</li><li>Evaluate the claim that the replacement should be preferred because it has a larger output.</li><li>Explain, using the calculations, what would have to be true for a proposed improvement to count as permissible.</li></ol><p>Your response should reach a clear, evidence-based judgement about <strong>this claim</strong>. You do not need to prove a global maximum for the allocation model. Do not use the rectangle&#39;s particular dimensions as an answer to the new decision.</p></div><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-transfer-prompt-a3-m4-910" name="learner-workspace-a3-a3-transfer-prompt-a3-m4-910" rows="5" aria-describedby="lj-c1--learner-workspace-a3-a3-transfer-prompt-a3-m4-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><style id="lj-c1--prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;position:fixed;top:var(--learner-sticky-nav-height,0px);lef
