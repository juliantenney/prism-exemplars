="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c2--a2-a2-m3-input-r3-c2" name="a2-a2-m3-input-r3-c2" data-learner-cell="a2-a2-m3-input-r3-c2" rows="3" aria-labelledby="lj-c2--a2-a2-m3-row-3 lj-c2--a2-a2-m3-col-relationship-to-gradient-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c2--a2-a2-m3-input-r3-c3" name="a2-a2-m3-input-r3-c3" data-learner-cell="a2-a2-m3-input-r3-c3" rows="3" aria-labelledby="lj-c2--a2-a2-m3-row-3 lj-c2--a2-a2-m3-col-mathematical-check-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c2--a2-a2-m3-input-r3-c4" name="a2-a2-m3-input-r3-c4" data-learner-cell="a2-a2-m3-input-r3-c4" rows="3" aria-labelledby="lj-c2--a2-a2-m3-row-3 lj-c2--a2-a2-m3-col-meaning-of-movement-4" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Determine a tangent direction to the objective level curve and compare it with the objective gradient.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A2-M1" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Simulated vector evidence at a feasible point</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-2">Compare four geometric roles</h3><p>This is a simulated mathematical teaching example using the fixed-perimeter rectangle.</p><p>At the feasible point \((4,6)\), the objective and constraint are</p><p>\[A(x,y)=xy,\qquad A(4,6)=24,\]</p><p>\[xy=24,\qquad x+y=10.\]</p><p>The objective level curve through the point is \(xy=24\). The feasible constraint line is \(x+y=10\).</p><p>The gradients at the point are</p><p>\[\nabla A(4,6)=(6,4),\qquad \nabla g(4,6)=(1,1).\]</p><p>Two candidate direction vectors are</p><p>\[\mathbf{u}=(4,-6),\qquad \mathbf{v}=(1,-1).\]</p><p>Your task is to decide which candidate direction is tangent to which curve, and to justify the classification using gradient relationships. Neither candidate has been assigned a tangent role here.</p><p>For a vector \((a,b)\), the first component represents horizontal movement and the second represents vertical movement. Positive components increase a coordinate; negative components decrease it. The curves and vectors can therefore be compared from their equations and components without using a visual colour key.</p></article></li></ol></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify a feasible tangent direction and compare it with the constraint gradient.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Use dot products or equivalent component reasoning to explain which vectors are perpendicular and what each direction means for local objective and constraint change.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A comparison of objective-gradient, objective-tangent, constraint-gradient and feasible-tangent directions, with appropriate vector components and justified perpendicularity relationships. The explanation must distinguish movement along a constant-objective curve from movement along the constraint, and interpret local change without relying solely on the visual representation.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-task-step-step-2-2" data-response-part-id="A2-task-step-step-2-2"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a2-a2-task-step-step-2-2-label" for="lj-c2--learner-workspace-a2-a2-task-step-step-2-2">Your response</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a2-a2-task-step-step-2-2-desc">Determine a tangent direction to the objective level curve and compare it with the objective gradient.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a2-a2-task-step-step-2-2" name="learner-workspace-a2-a2-task-step-step-2-2" rows="6" aria-describedby="lj-c2--learner-workspace-a2-a2-task-step-step-2-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-task-step-step-3-3" data-response-part-id="A2-task-step-step-3-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a2-a2-task-step-step-3-3-label" for="lj-c2--learner-workspace-a2-a2-task-step-step-3-3">Your response</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a2-a2-task-step-step-3-3-desc">Identify a feasible tangent direction and compare it with the constraint gradient.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a2-a2-task-step-step-3-3" name="learner-workspace-a2-a2-task-step-step-3-3" rows="6" aria-describedby="lj-c2--learner-workspace-a2-a2-task-step-step-3-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-task-step-step-4-4" data-response-part-id="A2-task-step-step-4-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a2-a2-task-step-step-4-4-label" for="lj-c2--learner-workspace-a2-a2-task-step-step-4-4">Your response</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a2-a2-task-step-step-4-4-desc">Use dot products or equivalent component reasoning to explain which vectors are perpendicular and what each direction means for local objective and constraint change.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a2-a2-task-step-step-4-4" name="learner-workspace-a2-a2-task-step-step-4-4" rows="6" aria-describedby="lj-c2--learner-workspace-a2-a2-task-step-step-4-4-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c2--learner-check-a2" data-check-sidebar-open aria-controls="lj-c2--learner-check-a2" aria-expanded="false" aria-label="Check your work: Compare gradients, tangents and normals">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c2--learner-check-a2" data-composition-moment="check" data-activity-id="A2" data-check-sidebar="available" aria-labelledby="lj-c2--learner-check-a2-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c2--learner-check-a2-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c2--learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c2--learner-task-a2">Back to your task (Compare gradients, tangents and normals)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m5-c-0" data-revision-criterion-id="a2-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you associated each gradient and candidate tangent with the correct function or curve?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Swapping the two curves changes which quantity is preserved and makes the geometric interpretation incorrect.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The objective gradient is linked to the area function and its level curve.</li><li><span class="util-guided-review__feature-key">B.</span> The constraint gradient is linked to the fixed-sum condition and its level curve.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Use the partial derivatives of \(A(x,y)=xy\) to identify the objective gradient before associating its perpendicular candidate.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Differentiate the constraint function and compare the result with the candidate direction that preserves the coordinate sum.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a2-a2-m5-item-0" data-checklist-item-id="checklist-a2-a2-m5-item-0"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a2-a2-m5-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m5-c-1" data-revision-criterion-id="a2-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you justified perpendicularity with valid component calculations?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A classification based only on a diagram cannot establish the claimed zero first-order change.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The relevant dot products use matching vector components.</li><li><span class="util-guided-review__feature-key">B.</span> Your conclusion about perpendicularity follows from the computed result.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Multiply corresponding first components and second components, then add the products for each proposed gradient-tangent pair.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Check whether each dot product is zero before describing its vectors as perpendicular.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a2-a2-m5-item-1" data-checklist-item-id="checklist-a2-a2-m5-item-1"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a2-a2-m5-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m5-c-2" data-revision-criterion-id="a2-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Does your table distinguish objective change from constraint preservation?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A tangent classification is incomplete without explaining what remains constant and what may change.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The objective-level tangent is interpreted in terms of first-order area change.</li><li><span class="util-guided-review__feature-key">B.</span> The feasible tangent is interpreted in terms of the fixed perimeter.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Relate its dot product with the objective gradient to the local change in \(A\).</li><li><span class="util-guided-review__feature-key">Missing B:</span> Relate its dot product with the constraint gradient to the first-order change in \(g\), and explain the distinction from area change.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a2-a2-m5-item-2" data-checklist-item-id="checklist-a2-a2-m5-item-2"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a2-a2-m5-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m5-c-3" data-revision-criterion-id="a2-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you recognised the non-zero-gradient condition for a regular level-curve normal?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without this qualification, the response would apply the normal-direction interpretation where the gradient might not determine a direction.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The normal interpretation is tied to a non-zero gradient.</li><li><span class="util-guided-review__feature-key">B.</span> The condition is checked against the supplied gradients.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State the non-zero condition alongside your explanation of why a gradient is normal to a regular level curve.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Inspect the components of both supplied gradients and say whether either is the zero vector.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a2-a2-m5-item-3" data-checklist-item-id="checklist-a2-a2-m5-item-3"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a2-a2-m5-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><div class="util-verified-review" data-verified-review><button type="button" class="util-verified-review__toggle" data-verified-review-toggle data-verified-review-label="View verified feedback" data-verified-review-back="Back to review" aria-expanded="false" aria-controls="lj-c2--verified-review-a2">View verified feedback</button><div class="util-verified-review__panel" id="lj-c2--verified-review-a2" data-verified-review-panel><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Reveal verified feedback</summary><div class="util-composition-reveal__body"><article class="util-material-block util-prose-measure" data-material-id="A2-M4" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Reveal after comparison: tangent and normal checks</span></p><h3 class="util-md-heading util-md-heading--source-2">Verify the vector relationships</h3><p>Open this explanation after completing the comparison table.</p><p>For the objective level curve \(xy=24\), the gradient at \((4,6)\) is \((6,4)\). The candidate direction \((4,-6)\) satisfies</p><p>\[(6,4)\cdot(4,-6)=24-24=0.\]</p><p>It is therefore tangent to the objective level curve at the selected point. Movement along this tangent produces zero first-order change in area.</p><p>For the constraint line \(x+y=10\), the gradient is \((1,1)\). The candidate direction \((1,-1)\) satisfies</p><p>\[(1,1)\cdot(1,-1)=1-1=0.\]</p><p>It is tangent to the constraint and describes a feasible direction of movement. For sufficiently small movements from the interior point \((4,6)\), both side lengths remain positive.</p><p>The two tangent directions are not interchangeable. In particular,</p><p>\[(6,4)\cdot(1,-1)=6-4=2,\]</p><p>so the feasible tangent is not an objective-level tangent at this point. Moving in its positive direction increases area to first order.</p><p>Likewise,</p><p>\[(1,1)\cdot(4,-6)=4-6=-2,\]</p><p>so the objective-level tangent does not preserve the constraint to first order.</p><p>Both gradients are non-zero. Each is a normal to its own level curve, but they are not parallel at \((4,6)\).</p><p>In words: the objective gradient is perpendicular to the direction that keeps area constant; the constraint gradient is perpendicular to the direction that keeps perimeter constant. These are distinct geometric statements.</p><h3 class="util-md-heading util-md-heading--source-3">Closure</h3><p>The next activity uses the feasible tangent to investigate when its first-order effect on the objective becomes zero.</p></article></div></details></div></div></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c2--activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Investigate movement at tangency</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The distinction between objective and constraint normals can now be applied to a candidate optimum. Learners use the established vector relationships to investigate what happens to the objective along the feasible tangent.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>The gradient and tangent comparisons now provide a way to investigate whether a feasible movement can improve the rectangle&#39;s area to first order.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Make a prediction about first-order feasible change before examining the complete geometric explanation. Distinguish zero first-order change from proof of a global maximum.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">How did your prediction about feasible improvement compare with the vector evidence? Explain what the evidence establishes and what it does not establish.</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c2--learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="lj-c2--learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="lj-c2--learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c2--learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c2--learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="lj-c2--learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c2--learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the supplied feasible rectangle points and predict how the objective changes for small movements in the feasible tangent direction.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A3-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated feasible movement at two rectangle points</span></p><h3 class="util-md-heading util-md-heading--source-2">Investigate first-order change</h3><p>This is a simulated mathematical teaching example using the same rectangle.</p><p>The objective and constraint are</p><p>\[A(x,y)=xy,\qquad x+y=10,\qquad x&gt;0,\quad y&gt;0.\]</p><p>Compare these two points:</p><table><thead><tr><th>Point</th><th>Area</th><th>Coordinate sum</th></tr></thead><tbody><tr><td>\((4,6)\)</td><td>24</td><td>10</td></tr><tr><td>\((5,5)\)</td><td>25</td><td>10</td></tr></tbody></table><p>The general gradients are</p><p>\[\nabla A(x,y)=(y,x),\qquad \nabla g(x,y)=(1,1).\]</p><p>A feasible tangent direction is</p><p>\[\mathbf{t}=(1,-1).\]</p><p>A small step of size \(h\) along this direction changes the coordinates from \((x,y)\) to \((x+h,y-h)\). For sufficiently small positive or negative \(h\), both supplied points remain within the positive-dimensions domain.</p><p>At each point, use the objective gradient and the same feasible tangent to investigate the first-order change in area. Compare the result with the constraint gradient, and then explain what the relationship does or does not establish.</p><p>If a graph is available, both points lie on the straight line \(x+y=10\). Their coordinates, areas and the direction \((1,-1)\) are supplied here so the task can be completed without interpreting colour or arrow placement.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Calculate or explain the objective&#39;s first-order change along that direction at the selected points.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M2" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Predict, calculate and explain tangency</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Construct a geometric justification for the relationship between feasible stationarity, tangency and parallel gradients, stating the regularity assumption and the limit of the first-order conclusion.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A comparison of first-order objective change along the feasible tangent at the supplied points, supported by vector calculations or equivalent reasoning. The learner identifies the stationary relationship at the candidate point and justifies it through feasible tangent and normal directions. The explanation distinguishes a necessary first-order condition from an independent proof of optimality.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-initial-prediction-1" data-response-part-id="A3-template-section-a3-m2-section-initial-prediction-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-initial-prediction-1-label" for="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-initial-prediction-1">Initial prediction</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-initial-prediction-1-desc">Record your response for Initial prediction.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-initial-prediction-1" name="learner-workspace-a3-a3-template-section-a3-m2-section-initial-prediction-1" rows="6" aria-describedby="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-initial-prediction-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure util-learner-workspace--math-entry" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-first-order-change-comparison-2" data-response-part-id="A3-template-section-a3-m2-section-first-order-change-comparison-2" data-input-modality="math" data-math-entry="true" data-math-field-id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-first-order-change-comparison-2" data-math-label-id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-first-order-change-comparison-2-label"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-first-order-change-comparison-2-label" for="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-first-order-change-comparison-2">First-order change comparison</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-first-order-change-comparison-2-desc">Record your response for First-order change comparison.</p><div class="util-math-entry" data-math-entry-root><div class="util-math-entry__mount" data-math-entry-mount hidden></div><textarea class="util-learner-workspace__input util-learner-workspace__input--canonical" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-first-order-change-comparison-2" name="learner-workspace-a3-a3-template-section-a3-m2-section-first-order-change-comparison-2" rows="6" aria-labelledby="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-first-order-change-comparison-2-label" aria-describedby="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-first-order-change-comparison-2-desc lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-first-order-change-comparison-2-math-hint"></textarea><p class="util-math-entry__hint" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-first-order-change-comparison-2-math-hint">Enter your mathematical expression. Use the maths keyboard for symbols and structures.</p><p class="util-math-entry__hint util-math-entry__hint--fallback-only">If the maths editor is unavailable, enter mathematical notation in this field.</p></div></div><div class="util-learner-workspace util-prose-measure util-learner-workspace--math-entry" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-gradient-relationship-3" data-response-part-id="A3-template-section-a3-m2-section-gradient-relationship-3" data-input-modality="math" data-math-entry="true" data-math-field-id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-gradient-relationship-3" data-math-label-id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-gradient-relationship-3-label"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-gradient-relationship-3-label" for="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-gradient-relationship-3">Gradient relationship</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-gradient-relationship-3-desc">Record your response for Gradient relationship.</p><div class="util-math-entry" data-math-entry-root><div class="util-math-entry__mount" data-math-entry-mount hidden></div><textarea class="util-learner-workspace__input util-learner-workspace__input--canonical" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-gradient-relationship-3" name="learner-workspace-a3-a3-template-section-a3-m2-section-gradient-relationship-3" rows="6" aria-labelledby="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-gradient-relationship-3-label" aria-describedby="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-gradient-relationship-3-desc lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-gradient-relationship-3-math-hint"></textarea><p class="util-math-entry__hint" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-gradient-relationship-3-math-hint">Enter your mathematical expression. Use the maths keyboard for symbols and structures.</p><p class="util-math-entry__hint util-math-entry__hint--fallback-only">If the maths editor is unavailable, enter mathematical notation in this field.</p></div></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-geometric-justification-and-scope-4" data-response-part-id="A3-template-section-a3-m2-section-geometric-justification-and-scope-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-geometric-justification-and-scope-4-label" for="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-geometric-justification-and-scope-4">Geometric justification and scope</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-geometric-justification-and-scope-4-desc">Record your response for Geometric justification and scope.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-geometric-justification-and-scope-4" name="learner-workspace-a3-a3-template-section-a3-m2-section-geometric-justification-and-scope-4" rows="6" aria-describedby="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-geometric-justification-and-scope-4-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c2--learner-check-a3" data-check-sidebar-open aria-controls="lj-c2--learner-check-a3" aria-expanded="false" aria-label="Check your work: Investigate movement at tangency">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c2--learner-check-a3" data-composition-moment="check" data-activity-id="A3" data-check-sidebar="available" aria-labelledby="lj-c2--learner-check-a3-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c2--learner-check-a3-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c2--learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c2--learner-task-a3">Back to your task (Investigate movement at tangency)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m4-c-0" data-revision-criterion-id="a3-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you compared feasible first-order change at both supplied points?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The contrast between the points is needed to distinguish an improving feasible direction from first-order stationarity.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The objective gradient is evaluated separately at each point.</li><li><span class="util-guided-review__feature-key">B.</span> Both evaluated gradients are tested against the same feasible tangent.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Substitute each point&#39;s coordinates into \(\nabla A=(y,x)\) rather than carrying one gradient across both points.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Compute the dot product with \((1,-1)\) at each point and compare the resulting first-order changes.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a3-a3-m4-item-0" data-checklist-item-id="checklist-a3-a3-m4-item-0"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a3-a3-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m4-c-1" data-revision-criterion-id="a3-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you used the directional derivative to justify your geometric interpretation?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without the derivative relationship, the explanation does not establish why a tangent movement changes the objective to first order.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The calculation is connected to \(\nabla A\cdot\mathbf{t}\).</li><li><span class="util-guided-review__feature-key">B.</span> The sign or zero value is interpreted correctly.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the gradient-dot-tangent calculation as the first-order rate of objective change along the proposed direction.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Distinguish positive first-order increase from zero first-order change, and avoid treating a zero value as proof of a maximum.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a3-a3-m4-item-1" data-checklist-item-id="checklist-a3-a3-m4-item-1"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a3-a3-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m4-c-2" data-revision-criterion-id="a3-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you explained why regular feasible stationarity leads to gradient proportionality?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The multiplier relationship needs a geometric justification rather than appearing as an unexplained equation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The objective gradient is related to the feasible tangent through a zero directional derivative.</li><li><span class="util-guided-review__feature-key">B.</span> The non-zero constraint gradient is identified as a normal to the same tangent.</li><li><span class="util-guided-review__feature-key">C.</span> The scalar-multiple relationship follows from the shared normal direction.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Explain how zero first-order objective change constrains the objective gradient relative to the feasible tangent.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect the constraint equation to its gradient and explain why the non-zero condition permits a normal-direction argument.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain why two vectors normal to the same tangent in this two-dimensional setting must be proportional.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a3-a3-m4-item-2" data-checklist-item-id="checklist-a3-a3-m4-item-2"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a3-a3-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m4-c-3" data-revision-criterion-id="a3-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you distinguished a necessary first-order condition from proof of optimality?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Treating stationarity as sufficient would overstate what the gradient calculation establishes.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your conclusion identifies a stationary candidate or necessary condition.</li><li><span class="util-guided-review__feature-key">B.</span> Any claim of a maximum is supported independently of the gradient equation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Qualify the gradient relationship as a first-order condition under the stated regularity assumptions.</li><li><span class="util-guided-review__feature-key">Missing B:</span> If you assert optimality, identify an additional argument using the objective and feasible domain rather than relying solely on gradient alignment.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a3-a3-m4-item-3" data-checklist-item-id="checklist-a3-a3-m4-item-3"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a3-a3-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><div class="util-verified-review" data-verified-review><button type="button" class="util-verified-review__toggle" data-verified-review-toggle data-verified-review-label="View verified feedback" data-verified-review-back="Back to review" aria-expanded="false" aria-controls="lj-c2--verified-review-a3">View verified feedback</button><div class="util-verified-review__panel" id="lj-c2--verified-review-a3" data-verified-review-panel><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="4" data-figure-id="asset-vb-38-4-va-a3-feasible-change-01-activity-a3-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/activity-a3-materials-entry.png" alt="Two rectangle-point geometries with feasible directions and objective gradients; detailed description follows." aria-describedby="lj-c2--figure-description-asset-vb-38-4-va-a3-feasible-change-01-activity-a3-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 4.</strong> Compare local feasible movement at two points before calculating first-order change.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c2--figure-description-asset-vb-38-4-va-a3-feasible-change-01-activity-a3-materials-entry">Two coordinate-plane views show the same descending constraint line x+y=10. One view marks (4,6) on the area level curve xy=24; the other marks (5,5) on xy=25. At each point, a vector labelled (1,-1) indicates a feasible direction, and an objective-gradient arrow shows the direction obtained from the general gradient formula. The views invite comparison but contain no directional-derivative results, tangency labels, multiplier values or optimality conclusions.</p></figure><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Reveal verified feedback</summary><div class="util-composition-reveal__body"><article class="util-material-block util-prose-measure" data-material-id="A3-M3" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Reveal after investigation: why gradients align</span></p><h3 class="util-md-heading util-md-heading--source-2">From feasible stationarity to parallel gradients</h3><p>Open this explanation after recording your prediction, calculations and geometric justification.</p><p>For a differentiable equality constraint \(g(x,y)=c\), a feasible tangent \(\mathbf{t}\) preserves the constraint to first order:</p><p>\[\nabla g\cdot\mathbf{t}=0.\]</p><p>At an interior constrained local optimum, moving a small amount in either feasible tangent direction cannot produce a first-order improvement. The objective&#39;s directional derivative along the feasible tangent must therefore be zero:</p><p>\[\nabla f\cdot\mathbf{t}=0.\]</p><p>Thus the objective gradient is perpendicular to the feasible tangent. Where the constraint gradient is non-zero, it is also perpendicular to that tangent. In two dimensions, the vectors perpendicular to a non-zero tangent form a single normal direction. Consequently,</p><p>\[\nabla f=\lambda\nabla g\]</p><p>for some scalar \(\lambda\). This includes the case \(\nabla f=\mathbf{0}\), where \(\lambda=0\).</p><h3 class="util-md-heading util-md-heading--source-3">Check the two rectangle points</h3><p>At \((4,6)\),</p><p>\[\nabla A=(6,4),\qquad \nabla A\cdot(1,-1)=6-4=2.\]</p><p>A small positive feasible movement increases area to first order. The objective and constraint gradients are not scalar multiples there.</p><p>At \((5,5)\),</p><p>\[\nabla A=(5,5),\qquad \nabla A\cdot(1,-1)=5-5=0.\]</p><p>The objective gradient is a scalar multiple of the constraint gradient:</p><p>\[\nabla A(5,5)=(5,5)=5(1,1)=5\nabla g.\]</p><p>The objective level curve and constraint line share a tangent direction at this point. In geometric terms, their normal directions align. There is no first-order area change along the feasible tangent.</p><h3 class="util-md-heading util-md-heading--source-3">What the calculation establishes</h3><p>This is a first-order necessary condition for a differentiable constrained local optimum under the regularity assumption \(\nabla g\ne\mathbf{0}\). It is not, by itself, proof of a maximum or minimum. A stationary candidate may require further investigation.</p><p>For this particular rectangle, a separate algebraic argument establishes the global maximum:</p><p>\[A=x(10-x)=25-(x-5)^2\leq25\]</p><p>for \(0&lt;x&lt;10\), with equality at \(x=5\), hence \(y=5\). That conclusion uses the objective and feasible domain, not merely the parallel-gradient equation.</p><h3 class="util-md-heading util-md-heading--source-3">Closure</h3><p>The multiplier equation describes a relationship between normals at a regular stationary candidate. The next activity asks you to explain that relationship independently and investigate what happens when the same constraint is written differently.</p></article></div></details></div></div></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c2--activity-A4" data-journey-section="true" data-activity-id="A4" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Explain and test gradient alignment</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A4"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The previous investigation established the connection between feasible tangents, gradient normals and first-order stationarity. This activity consolidates that reasoning into an independent explanation and tests whether it remains valid when the same constraint is expressed differently.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have investigated feasible stationarity and its geometric explanation. Now construct a concise independent account and apply the same reasoning to a changed representation of the constraint.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Build the explanation from the constraint and feasible tangent rather than beginning with the multiplier equation alone. Treat a multiplier relationship as a necessary first-order condition under regularity, not as a general certificate of optimality.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which parts of your argument depend on the geometric constraint itself, and which depend on the particular equation used to represent it? Identify one condition you would check before applying the argument elsewhere.</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c2--learner-task-a4" data-composition-moment="do" data-activity-id="A4" aria-labelledby="lj-c2--learner-task-a4-heading"><h3 class="util-composition-moment-heading" id="lj-c2--learner-task-a4-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c2--learner-revision-reminder-a4" hidden data-revision-reminder="true" data-activity-id="A4" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c2--learner-revision-guidance-a4" hidden data-revision-guidance="true" data-activity-id="A4" aria-labelledby="lj-c2--learner-revision-guidance-a4-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c2--learner-revision-guidance-a4-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Write an independent geometric explanation of why the objective and constraint gradients satisfy a scalar-multiple relationship at a regular constrained local optimum.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M2" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Independent explanation and application workspace</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>State how the sign of the scalar affects the orientation of non-zero gradients and why satisfying the relationship alone does not prove an optimum.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M5" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Transfer judgement and evidence workspace</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Apply the reasoning to the equivalent rectangle constraint \(2x+2y=20\): determine its gradient, express the proportionality relationship at the candidate point, and explain which geometric properties remain unchanged.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A4-M1" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Simulated equivalent constraints at the candidate point</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-2">One rectangle, two constraint equations</h3><p>This is a simulated mathematical teaching example.</p><p>Consider the rectangle with objective</p><p>\[A(x,y)=xy\]</p><p>at the candidate point \((5,5)\).</p><p>The original perimeter constraint is</p><p>\[g_1(x,y)=x+y=10.\]</p><p>An alternative equation describing the same permitted rectangles is</p><p>\[g_2(x,y)=2x+2y=20.\]</p><p>The objective gradient is given by</p><p>\[\nabla A(x,y)=(y,x).\]</p><p>For the original constraint,</p><p>\[\nabla g_1=(1,1).\]</p><p>The constraint-gradient regularity requirement is that the relevant gradient is not the zero vector. Both constraint representations can be checked against that requirement.</p><p>Use these particulars to construct your own geometric explanation of first-order stationarity. Then derive the gradient for the alternative representation and compare the two scalar-multiple equations. Keep separate the feasible set described by an equation and the numerical components of its gradient.</p><p>All values can be inspected algebraically; no diagram is required.</p></article></li></ol></article><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A4-M4" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Simulated claim for mathematical evaluation</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-2">Claim to evaluate</h3><p>This is a simulated instructional claim, not an established mathematical conclusion.</p><p>&gt; If two equations describe the same feasible constraint, the Lagrange multiplier must have the same numerical value in both equations.</p><p>Conditions for the comparison:</p><ul><li>The objective is \(A(x,y)=xy\).</li><li>The candidate point is \((5,5)\).</li><li>The first constraint is \(x+y=10\).</li><li>The second constraint is \(2x+2y=20\).</li><li>Both equations describe the same set of positive side lengths.</li><li>Use the proportionality form \(\nabla A=\lambda\nabla g\), with a multiplier corresponding to each constraint representation.</li></ul><p>Evaluate the stated claim using these particulars. Do not assume that equivalence of the feasible sets determines every quantity appearing in the two gradient equations.</p></article></li></ol></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A coherent learner-produced explanation connecting feasible tangents, first-order objective change, non-zero constraint normals and scalar-multiple gradients, with an accurate necessary-versus-sufficient distinction. The response should correctly interpret gradient orientation, apply the reasoning to an equivalent constraint representation, and defend a judgement about multiplier scaling using relevant mathematical components. The transfer response must go beyond repeating the original explanation.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m2-section-feasible-tangent-reasoning-1" data-response-part-id="A4-template-section-a4-m2-section-feasible-tangent-reasoning-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-feasible-tangent-reasoning-1-label" for="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-feasible-tangent-reasoning-1">Feasible tangent reasoning</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-feasible-tangent-reasoning-1-desc">Record your response for Feasible tangent reasoning.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-feasible-tangent-reasoning-1" name="learner-workspace-a4-a4-template-section-a4-m2-section-feasible-tangent-reasoning-1" rows="6" aria-describedby="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-feasible-tangent-reasoning-1-desc"></textarea></div><div class="ut
