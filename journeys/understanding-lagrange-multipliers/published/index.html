plication-5-desc lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-equivalent-constraint-application-5-math-hint"></textarea><p class="util-math-entry__hint" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-equivalent-constraint-application-5-math-hint">Enter your mathematical expression. Use the maths keyboard for symbols and structures.</p><p class="util-math-entry__hint util-math-entry__hint--fallback-only">If the maths editor is unavailable, enter mathematical notation in this field.</p></div></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c2--learner-check-a4" data-check-sidebar-open aria-controls="lj-c2--learner-check-a4" aria-expanded="false" aria-label="Check your work: Explain and test gradient alignment">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c2--learner-check-a4" data-composition-moment="check" data-activity-id="A4" data-check-sidebar="available" aria-labelledby="lj-c2--learner-check-a4-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c2--learner-check-a4-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c2--learner-check-a4-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c2--learner-task-a4">Back to your task (Explain and test gradient alignment)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A4-M7" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a4-a4-m7" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a4-m7-c-0" data-revision-criterion-id="a4-m7-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you constructed the complete geometric argument from feasible movement to gradient proportionality?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A multiplier equation without its tangent-and-normal reasoning does not demonstrate why the relationship is necessary at a regular constrained optimum.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your explanation identifies feasible tangent directions through the constraint.</li><li><span class="util-guided-review__feature-key">B.</span> Zero first-order objective change is linked to a normal-direction relationship.</li><li><span class="util-guided-review__feature-key">C.</span> The scalar-multiple conclusion follows from the shared normal direction.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Start from the requirement that a small feasible movement preserve the constraint to first order.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain what the objective directional derivative must be at a constrained local optimum and what that implies about the objective gradient.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Connect the objective normal and the non-zero constraint normal to the same feasible tangent before writing the multiplier equation.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a4-a4-m7-item-0" data-checklist-item-id="checklist-a4-a4-m7-item-0"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a4-a4-m7-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m7-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a4-m7-c-1" data-revision-criterion-id="a4-m7-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you stated the regularity assumption and the limits of the first-order conclusion?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without these qualifications, the response may treat a necessary stationarity equation as a general test proving optimality.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The constraint gradient is explicitly required to be non-zero.</li><li><span class="util-guided-review__feature-key">B.</span> The multiplier relationship is described as a necessary first-order condition.</li><li><span class="util-guided-review__feature-key">C.</span> Optimality is not inferred from proportionality alone.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State the regularity condition and explain why it matters for identifying a constraint normal.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Qualify your conclusion to the differentiable, regular constrained local-optimum setting.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Separate the stationary-candidate conclusion from any independent argument that establishes a maximum or minimum.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a4-a4-m7-item-1" data-checklist-item-id="checklist-a4-a4-m7-item-1"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a4-a4-m7-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m7-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a4-m7-c-2" data-revision-criterion-id="a4-m7-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you interpreted the multiplier sign and gradient orientation accurately?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confusing proportionality with identical direction would exclude valid negative or zero multiplier cases.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Positive and negative multipliers are distinguished geometrically.</li><li><span class="util-guided-review__feature-key">B.</span> The zero-multiplier possibility is treated consistently with the non-zero constraint gradient.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Explain how the sign of a non-zero scalar affects whether the gradients point in the same or opposite directions.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Consider what the proportionality equation implies for the objective gradient when the scalar is zero.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a4-a4-m7-item-2" data-checklist-item-id="checklist-a4-a4-m7-item-2"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a4-a4-m7-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m7-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a4-m7-c-3" data-revision-criterion-id="a4-m7-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you justified your transfer judgement using both constraint representations?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The claim concerns numerical invariance, which cannot be evaluated from geometric equivalence alone.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your mathematical evidence includes gradients for both constraint equations.</li><li><span class="util-guided-review__feature-key">B.</span> You compare the multiplier relationships at the same candidate point.</li><li><span class="util-guided-review__feature-key">C.</span> Your conclusion separates unchanged feasible geometry from representation-dependent quantities.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Differentiate each constraint representation and compare the resulting vectors component by component.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Use the same objective gradient in both scalar-multiple equations, then determine how each coefficient must relate to its constraint gradient.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain which tangent or feasible-set properties are preserved and which coefficient is tied to the chosen constraint equation.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a4-a4-m7-item-3" data-checklist-item-id="checklist-a4-a4-m7-item-3"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a4-a4-m7-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m7-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Review the example response</summary><div class="util-composition-reveal__body"><article class="util-material-block util-sample-output util-prose-measure" data-material-id="A4-M6" data-material-type="sample_output" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><span class="util-semantic-icon__label">Reveal after both responses: model explanation and multiplier scaling</span></p><h3 class="util-md-heading util-md-heading--source-2">Model geometric explanation</h3><p>Open this model only after completing the independent explanation and transfer judgement.</p><p>At an interior constrained local optimum of a differentiable objective, the first-order objective change along every feasible tangent direction must be zero. For a regular equality constraint, its non-zero gradient is normal to the feasible tangent. The objective gradient must also be normal to that tangent, so in the two-dimensional rectangle problem the gradients are proportional:</p><p>\[\nabla A=\lambda\nabla g.\]</p><p>A positive multiplier means the non-zero objective and constraint gradients point in the same direction. A negative multiplier means they point in opposite directions. A zero multiplier corresponds to a zero objective gradient when the constraint gradient is non-zero. Thus, gradient proportionality does not require the two gradients to point the same way.</p><p>The relationship is a necessary first-order condition under the stated regularity assumptions. Satisfying it does not alone prove that the point is a local or global optimum.</p><h3 class="util-md-heading util-md-heading--source-2">Verify the rectangle equations</h3><p>At \((5,5)\), the objective gradient is</p><p>\[\nabla A(5,5)=(5,5).\]</p><p>For the original constraint \(g_1(x,y)=x+y\),</p><p>\[\nabla g_1=(1,1),\]</p><p>so</p><p>\[\nabla A(5,5)=(5,5)=5(1,1)=5\nabla g_1.\]</p><p>The corresponding multiplier is \(\lambda_1=5\).</p><p>For the alternative constraint \(g_2(x,y)=2x+2y\),</p><p>\[\nabla g_2=(2,2),\]</p><p>so</p><p>\[\nabla A(5,5)=(5,5)=\frac{5}{2}(2,2)=\frac{5}{2}\nabla g_2.\]</p><p>The corresponding multiplier is \(\lambda_2=\frac{5}{2}\).</p><h3 class="util-md-heading util-md-heading--source-2">Model transfer judgement</h3><p>The claim that equivalent constraint equations must give the same numerical multiplier is false in this example. Both equations describe exactly the same feasible line and therefore have the same feasible tangent directions. Multiplying the constraint equation by two also doubles its gradient. The proportionality coefficient must then be halved to represent the unchanged objective gradient.</p><p>The geometric condition remains the same, but the numerical multiplier depends on the scaling of the constraint representation. The comparison concerns the same objective and candidate point; it does not establish a universal multiplier value independent of how the constraint is written.</p><p>For this particular rectangle, global optimality can be established separately using \(A=25-(x-5)^2\leq25\) on the positive feasible domain. That argument is distinct from the first-order multiplier relationship.</p><h3 class="util-md-heading util-md-heading--source-3">Closure</h3><p>The geometric interpretation is more informative than memorising the multiplier equation. Identify the feasible tangent, explain why the relevant gradients are normal to it, check regularity, and keep the necessary-condition conclusion separate from any independent proof of optimality.</p></article></div></details></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A4"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M3" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Evaluate a claim about changing constraint equations</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-transfer-prompt-a4-m3-910" data-response-part-id="A4-transfer-prompt-a4-m3-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a4-a4-transfer-prompt-a4-m3-910-label" for="lj-c2--learner-workspace-a4-a4-transfer-prompt-a4-m3-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="lj-c2--learner-workspace-a4-a4-transfer-prompt-a4-m3-910-desc"><p>Imagine you are checking a short mathematical explanation prepared for another student. Its author argues that because two equations describe exactly the same feasible rectangles, the numerical Lagrange multiplier must be unchanged when one equation replaces the other.</p><p>Judge whether that claim is justified for the original constraint \(x+y=10\) and the rescaled constraint \(2x+2y=20\), using the same area objective and candidate point \((5,5)\).</p><p>Write a brief mathematical response that:</p><ol><li>States whether you accept the claim.</li><li>Uses the gradients and scalar-multiple equations as evidence.</li><li>Distinguishes what remains unchanged geometrically from what may depend on the chosen equation.</li></ol><p>Treat this as a claim-evaluation task rather than another general explanation of tangency. Record your judgement and supporting calculation in the separate transfer workspace before opening the model response.</p></div><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a4-a4-transfer-prompt-a4-m3-910" name="learner-workspace-a4-a4-transfer-prompt-a4-m3-910" rows="5" aria-describedby="lj-c2--learner-workspace-a4-a4-transfer-prompt-a4-m3-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><aside class="util-study-tips" data-region="study-tips" id="lj-c2--journey-study-tips" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--study-tips" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg></span><span class="util-semantic-icon__label">Study tips</span></h2><div class="util-study-tips__content util-prose-measure"><ul><li>Distinguish the direction of unrestricted objective increase from movement that preserves the constraint.</li><li>Use directional derivatives to explain why gradients are normal to regular level curves and why feasible stationarity leads to gradient proportionality.</li><li>Treat the multiplier equation as a necessary first-order condition, not an independent proof of optimality.</li><li>When a constraint is rescaled, compare the feasible geometry and the numerical multiplier separately.</li></ul></div></aside><style id="lj-c2--prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{di  class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">From a feasible rectangle to a mathematical condition</span><p class="util-journey-position" aria-label="Section 1 of 6"><span class="util-journey-position__visible" aria-hidden="true">1 of 6</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c3--exposition-S2" aria-label="Next section: Turning parallel gradients into three equations"><span class="util-journey-adjacent__title">Turning parallel gradients into three equations</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c3--exposition-S1" aria-current="location">From a feasible rectangle to a mathematical condition</a></li><li><a class="util-journey-all-link" href="#lj-c3--exposition-S2">Turning parallel gradients into three equations</a></li><li><a class="util-journey-all-link" href="#lj-c3--exposition-S3">Differentiating the rectangle and constructing its system</a></li><li><a class="util-journey-all-link" href="#lj-c3--exposition-S4">Solving the equations and checking feasibility</a></li><li><a class="util-journey-all-link" href="#lj-c3--exposition-S5">What the calculation establishes</a></li><li><a class="util-journey-all-link" href="#lj-c3--exposition-S6">A method that transfers beyond the rectangle</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c3/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-exposition-sections" data-region="exposition"><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S1" data-section-id="S1" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">From a feasible rectangle to a mathematical condition</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>A rectangle has perimeter 20 units. Its side lengths, x and y, must both be positive. We want to find the dimensions that give the largest possible area.</p><p>The area is A(x,y)=xy. The perimeter condition is 2x+2y=20, which we can simplify to x+y=10. This equation restricts the possible dimensions: increasing one side requires decreasing the other by the same amount. We are not free to choose x and y independently.</p><p>If you completed &#39;Why the constraint matters&#39;, revisit your prediction about the rectangle&#39;s dimensions and your explanation of which choices were feasible. If you completed &#39;Seeing gradients and tangency&#39;, revisit your interpretation of gradients and why they become parallel at a regular constrained optimum. Use your earlier reasoning to connect the perimeter restriction with the geometric condition that we will now turn into equations.</p><p>A useful comparison is between (4,6) and (6,6). The first pair satisfies x+y=10 and gives area 24 square units. The second gives area 36 square units, but its side lengths sum to 12. It is not a possible rectangle under the stated perimeter restriction. An objective value is relevant to the optimisation only when its dimensions are feasible.</p><p>The constraint x+y=10 describes a straight line in the xy-plane. The positive dimensions occupy the part of that line where x&gt;0 and y&gt;0. Curves of constant area have equations xy=k, where k is the chosen area value. We are interested in how large k can become while an area level curve still meets the feasible line.</p><p>At a regular constrained local optimum, the objective cannot increase to first order by moving along the feasible constraint curve. The gradient of the objective is therefore a scalar multiple of the gradient of the constraint. We express this as ∇A=λ∇g, where g(x,y)=x+y and λ is a scalar called a Lagrange multiplier. More generally, for an objective f and a smooth equality constraint g=c, this necessary condition applies at a regular constrained local optimum when ∇g is non-zero.</p><p>The gradient relationship tells us something about the directions of change of two functions. It does not yet give us the dimensions of the rectangle. To calculate those dimensions, we need to express the vector relationship as ordinary equations and combine it with x+y=10.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S2" data-section-id="S2" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Turning parallel gradients into three equations</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Suppose we want to optimise a differentiable function f(x,y) subject to an equality constraint g(x,y)=c. Here, c is a fixed number. The variables x and y may change, but only in ways that satisfy the constraint.</p><p>The gradient of a function is the vector formed from its first partial derivatives. For the objective, ∇f=(f<em>x,f</em>y). For the constraint function, ∇g=(g<em>x,g</em>y). The subscripts indicate which variable we differentiate with respect to: f<em>x means the partial derivative of f with respect to x, and f</em>y means the partial derivative with respect to y.</p><p>At a regular constrained local optimum, the necessary first-order condition is ∇f=λ∇g, provided ∇g≠(0,0). The multiplier λ is a number that scales the constraint gradient to give the objective gradient. If λ=2, for example, the objective gradient is twice the constraint gradient; if λ is negative, the vectors point in opposite directions. The multiplier need not be positive, and the equation can also hold with λ=0 when the objective gradient is zero.</p><p>We can now translate the vector equation into scalar equations. Substitute the definitions of the gradients:</p><p>∇f=λ∇g</p><p>(f<em>x,f</em>y)=λ(g<em>x,g</em>y)</p><p>(f<em>x,f</em>y)=(λg<em>x,λg</em>y).</p><p>Two vectors are equal when their corresponding components are equal. Comparing the first components gives f<em>x=λg</em>x. Comparing the second gives f<em>y=λg</em>y.</p><p>These are the two component equations of the multiplier method. They are not additional assumptions. They are the original geometric condition written in a form that we can calculate with.</p><p>However, they are not the complete optimisation problem. The equations f<em>x=λg</em>x and f<em>y=λg</em>y describe the required gradient relationship; neither states which constraint level we are working on. The equality g(x,y)=c supplies that missing information. The complete system is therefore:</p><p>f<em>x=λg</em>x</p><p>f<em>y=λg</em>y</p><p>g(x,y)=c.</p><p>There are three unknown quantities to determine: x, y and λ. The first two equations express the relationship between the gradients. The third ensures that the point belongs to the required constraint. In the rectangle problem, it will be the equation x+y=10 that connects the gradient relationship to the specified perimeter.</p><p>This separation of roles is useful whenever you construct a multiplier system. Differentiation supplies the first two equations; the original restriction supplies the third. Omitting the constraint would mean solving a different, incomplete problem.</p><p>The equations are necessary conditions under the regularity assumption. They help identify candidate optima, but they do not by themselves establish that any solution is a maximum or minimum. We will keep that qualification in view when interpreting the rectangle calculation.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-S2-01" data-material-kind="Vector-to-component correspondence" data-material-type="expository_structured_table" data-section-id="S2" data-expository-structured="table"><h3>How one vector equation becomes three equations</h3><p>The parallel-gradient condition is a vector equation. Each component of the objective gradient must equal the corresponding component of the constraint gradient multiplied by the same scalar λ.</p><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Part of the system</th><th scope="col">Objective expression</th><th scope="col">Constraint expression</th><th scope="col">Resulting equation</th><th scope="col">Mathematical role</th></tr></thead><tbody><tr><td>First vector component: x-direction</td><td>f_x</td><td>λg_x</td><td>f_x=λg_x</td><td>Matches the first components of the two gradients.</td></tr><tr><td>Second vector component: y-direction</td><td>f_y</td><td>λg_y</td><td>f_y=λg_y</td><td>Matches the second components of the two gradients.</td></tr><tr><td>Original equality constraint</td><td>The point (x,y)</td><td>The specified constraint level c</td><td>g(x,y)=c</td><td>Requires the candidate point to belong to the feasible set.</td></tr></tbody></table></div><section><h4>Vector relationship</h4><dl><div><dt>Condition</dt><dd>∇f=λ∇g</dd></div><div><dt>Objective gradient</dt><dd>∇f=(f_x,f_y)</dd></div><div><dt>Constraint gradient</dt><dd>∇g=(g_x,g_y)</dd></div><div><dt>Expanded equality</dt><dd>(f_x,f_y)=(λg_x,λg_y)</dd></div></dl></section><section><h4>Complete system</h4><ul><li>f_x=λg_x</li><li>f_y=λg_y</li><li>g(x,y)=c</li></ul></section><p>The first two equations come from matching vector components. The third does not come from another gradient component: it is the original equality constraint. Together, the three equations connect the gradient relationship to the required feasible set.</p></article></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--section-after-content" data-visual-slot="section-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-s2-component-correspondence-01-section-s2-section-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c3/section-after-content.png" alt="Mathematical correspondence diagram. The vector equation ∇f=λ∇g expands to (f_x,f_y)=(λg_x,λg_y). Its first components give f_x=λg_x and its second components give f_y=λg_y. The separate original constraint g(x,y)=c completes the three-equation system in x, y and λ." aria-describedby="lj-c3--figure-description-asset-vb-38-4-va-s2-component-correspondence-01-section-s2-section-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> The two gradient components produce two derivative equations; the original constraint completes the multiplier system.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c3--figure-description-asset-vb-38-4-va-s2-component-correspondence-01-section-s2-section-after-content">A compact, high-legibility mathematical layout. At the top, show the vector condition \(\nabla f=\lambda\nabla g\) with the definitions \(\nabla f=(f_x,f_y)\) and \(\nabla g=(g_x,g_y)\). Beneath it, show the expanded equality \((f_x,f_y)=(\lambda g_x,\lambda g_y)\). Two explicitly labelled correspondence paths lead from the first and second vector components to \(f_x=\lambda g_x\) and \(f_y=\lambda g_y\). A visually distinct but equally legible third entry, labelled &#39;Original equality constraint&#39;, contains \(g(x,y)=c\). The three equations are then presented together as the complete multiplier system. Any connecting arrows are labelled with their mathematical meaning. The original constraint joins the system independently rather than appearing to follow from the vector equality. All information is expressed through symbols and text labels, with colour used only as optional reinforcement.</p></figure></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S3" data-section-id="S3" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Differentiating the rectangle and constructing its system</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>We can now use the general method to calculate the dimensions of the rectangle. The objective is A(x,y)=xy and the equality constraint is g(x,y)=x+y=10. The side lengths must also satisfy x&gt;0 and y&gt;0.</p><p>First, differentiate the area function. To calculate A<em>x, treat y as a constant and differentiate xy with respect to x. The result is A</em>x=y. To calculate A<em>y, treat x as a constant and differentiate with respect to y. The result is A</em>y=x.</p><p>Consequently, ∇A=(A<em>x,A</em>y)=(y,x).</p><p>Notice the order. The first component is y because it measures the rate of change of area when x changes and y is held fixed. The second component is x because it measures the rate of change when y changes and x is held fixed. Writing ∇A=(x,y) would copy the original variables rather than differentiate the function correctly.</p><p>Next, differentiate the constraint function g(x,y)=x+y. With respect to x, the derivative is g<em>x=1. With respect to y, the derivative is g</em>y=1. Thus ∇g=(1,1).</p><p>This constraint gradient is non-zero everywhere, so the regularity requirement for the standard multiplier condition is satisfied at every point on the feasible line.</p><p>The geometric relationship ∇A=λ∇g now becomes:</p><p>(y,x)=λ(1,1).</p><p>Multiplying the constraint gradient by λ gives (y,x)=(λ,λ). Comparing corresponding components produces two equations:</p><p>y=λ</p><p>x=λ.</p><p>These equations express the parallel-gradient condition for this particular objective and constraint. We must also retain the perimeter restriction:</p><p>x+y=10.</p><p>The complete multiplier system for the rectangle is therefore:</p><p>y=λ</p><p>x=λ</p><p>x+y=10.</p><p>Each equation has a clear origin. The first comes from differentiating with respect to x, the second from differentiating with respect to y, and the third from the original perimeter restriction. The multiplier is not another side length. It is the scalar that relates the two gradient vectors, although its numerical value may happen to equal a side length in this example.</p><p>The system is now ready to solve. Before doing so, observe that the first two equations already tell us something about the dimensions: both x and y equal the same scalar. They therefore imply x=y. But they do not yet tell us what that common value is. The perimeter restriction will supply it.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S4" data-section-id="S4" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Solving the equations and checking feasibility</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>We have obtained three equations for x, y and λ:</p><p>y=λ</p><p>x=λ</p><p>x+y=10.</p><p>The first two equations show that x and y are equal, because each is equal to λ. We can therefore write x=y.</p><p>Substitute y=x into the constraint equation. This gives x+x=10, or 2x=10. Dividing by 2 gives x=5. Since x=y, we also have y=5.</p><p>To find the multiplier, substitute either dimension into one of the derivative equations. From x=λ, we obtain λ=5. The simultaneous solution is therefore x=5, y=5 and λ=5.</p><p>Notice how the three equations worked together. The gradient relationship established that the dimensions must be equal at this candidate. The perimeter restriction established what their common value must be. Without x+y=10, the equations x=λ and y=λ would allow any common value and would not determine the rectangle.</p><p>A calculated solution must now be checked against the original problem. Both side lengths are positive, so x&gt;0 and y&gt;0 hold. Their sum is 5+5=10, giving perimeter 2(5)+2(5)=20 units. The point is feasible.</p><p>We can also check the gradient relationship. At (5,5), the area gradient is ∇A=(5,5). The constraint gradient is ∇g=(1,1). Multiplying the constraint gradient by λ=5 gives 5(1,1)=(5,5). The required relationship holds.</p><p>The area of this rectangle is A(5,5)=5×5=25 square units. We have therefore found a feasible stationary candidate with area 25 square units and multiplier 5.</p><p>It would be premature to conclude that this calculation alone proves a maximum. The multiplier equations describe a necessary first-order condition at a regular constrained local optimum. Finding a point that satisfies a necessary condition does not establish that it is an optimum. We still need an argument showing that no other feasible rectangle has a larger area.</p><p>The checks also reveal different kinds of mathematical error. If the gradient had been written incorrectly, the component equations could have been wrong from the start. If the equations had been manipulated incorrectly, the candidate dimensions could have been wrong even with correct derivatives. If the perimeter restriction had been omitted, the solution would not have been tied to the feasible set. Finally, if we called the candidate a maximum solely because it satisfied the multiplier equations, the error would be in interpreting the result rather than calculating it.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S5" data-section-id="S5" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">What the calculation establishes</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The multiplier equations gave us the feasible candidate (5,5), with λ=5 and area 25 square units. We can now establish whether this candidate really gives the largest possible area.</p><p>The constraint x+y=10 allows us to express y in terms of x: y=10-x. Substitute this into the area function A=xy:</p><p>A(x,10-x)=x(10-x)=10x-x².</p><p>Completing the square gives:</p><p>A(x,10-x)=25-(x-5)².</p><p>For every real x, the squared quantity (x-5)² is non-negative. Subtracting it from 25 can never produce a value greater than 25. Therefore A(x,10-x)≤25 for every feasible rectangle.</p><p>Equality occurs precisely when (x-5)²=0, which means x=5. The constraint then gives y=5. These dimensions are positive and satisfy the perimeter restriction, so the upper bound is attained within the feasible set.</p><p>We can now conclude that the rectangle has a unique global maximum area of 25 square units at (5,5). This conclusion rests on the completed-square argument, not merely on the fact that the point satisfies the multiplier equations.</p><p>The two calculations have different logical roles. The multiplier system identifies a feasible stationary candidate by using a necessary first-order condition. The substitution argument considers every feasible rectangle and establishes an upper bound that is attained at the candidate. One calculation locates a possible optimum; the other proves the claimed global maximum.</p><p>There is another distinction worth making about the multiplier itself. We represented the perimeter restriction using g(x,y)=x+y with g=10. Its gradient is (1,1), so at the optimum ∇A=(5,5)=5(1,1), giving λ=5.</p><p>We could instead retain the original perimeter expression and write g(x,y)=2x+2y with g=20. This describes exactly the same feasible rectangles, but the constraint gradient is now (2,2). At the same optimum, the gradient relationship is (5,5)=λ(2,2). The multiplier is therefore λ=5/2.</p><p>Nothing about the rectangle has changed. The optimal dimensions are still (5,5), and the maximum area is still 25 square units. Only the numerical multiplier has changed because the constraint function has been scaled. The multiplier is defined relative to the chosen constraint representation; it is not a fixed numerical property of the rectangle independent of that representation.</p><p>These qualifications are part of interpreting the method correctly. A solution of the multiplier equations is a candidate, not an automatic proof of an optimum. The standard necessary condition also assumes a non-zero constraint gradient. &#39;What does the calculation prove?&#39; examines the limits of first-order conditions more closely, while &#39;Diagnosing mathematical claims&#39; develops the judgement needed to distinguish valid mathematical conclusions from claims that go beyond the calculation.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-S5-01" data-material-kind="Calculation-versus-justification comparison" data-material-type="expository_structured_table" data-section-id="S5" data-expository-structured="table"><h3>Finding a candidate and proving a maximum</h3><p>Two different mathematical arguments are used in the rectangle problem. The multiplier calculation identifies a point worth investigating; the completed-square argument establishes what happens across the entire feasible set.</p><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Question</th><th scope="col">Multiplier calculation</th><th scope="col">Completed-square argument</th></tr></thead><tbody><tr><td>What mathematical relationship is used?</td><td>The necessary first-order condition ∇A=λ∇g, together with x+y=10.</td><td>The area along the constraint: A(x,10-x)=25-(x-5)^2.</td></tr><tr><td>What does the calculation establish?</td><td>A feasible stationary candidate at (5,5), with λ=5.</td><td>Every feasible rectangle has area at most 25 square units.</td></tr><tr><td>What is its logical status?</td><td>Necessary first-order condition; not sufficient to prove a maximum.</td><td>Proof of the global upper bound, attained only when x=5 and y=5.</td></tr><tr><td>What conclusion is justified?</td><td>The point (5,5) satisfies the multiplier system and merits further investigation.</td><td>The unique global maximum is 25 square units at (5,5).</td></tr></tbody></table></div><p>A stationary candidate is not automatically an optimum. In this problem, the completed-square expression supplies the additional justification: because (x-5)^2 is non-negative, the area cannot exceed 25, and equality is attained at the feasible point (5,5).</p></article></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--section-after-content" data-visual-slot="section-after-content" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-s5-candidate-proof-01-section-s5-section-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c3/section-after-content-vb-38-4-va-s5-candidate-.png" alt="Two-part mathematical comparison. The multiplier equations y=λ, x=λ and x+y=10 identify the feasible stationary candidate (5,5), with λ=5, but do not prove a maximum. The completed-square identity A(x,10-x)=25-(x-5)^2 establishes that every feasible rectangle has area at most 25 square units, with equality only at (5,5)." aria-describedby="lj-c3--figure-description-asset-vb-38-4-va-s5-candidate-proof-01-section-s5-section-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption" id="lj-c3--figure-description-asset-vb-38-4-va-s5-candidate-proof-01-section-s5-section-after-content"><strong>Figure 2.</strong> The multiplier equations locate a feasible stationary candidate; a separate inequality proves the rectangle&#39;s global maximum.</figcaption></figure></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S6" data-section-id="S6" data-expository-section-role="terminal-close" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">A method that transfers beyond the rectangle</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation" data-expository-closure="terminal"><p>The rectangle calculation illustrates a method that applies to other differentiable objectives subject to smooth equality constraints. What transfers is not the particular pair of equations x=λ and y=λ, but the reasoning used to obtain them.</p><p>For a new objective f(x,y) subject to g(x,y)=c, first identify the function to optimise and the restriction that defines the feasible points. Calculate the partial derivatives to obtain ∇f and ∇g. At a regular constrained local optimum, where ∇g is non-zero, the necessary first-order relationship is ∇f=λ∇g.</p><p>Write that vector relationship as two component equations, f<em>x=λg</em>x and f<em>y=λg</em>y. Include the original constraint g(x,y)=c. Solve the three equations simultaneously for x, y and λ, and check any additional restrictions on the variables. The resulting feasible solutions are stationary candidates. To establish an optimum, consider what further argument is needed to justify the claim.</p><p>The rectangle made this procedure manageable because its derivatives were simple. The objective A=xy gave ∇A=(y,x), while g=x+y gave ∇g=(1,1). Those particular derivatives produced y=λ and x=λ. A different objective will generally produce different component equations, even when the equality constraint has the same form. Copying the rectangle equations into another problem would therefore be a conceptual error: the equations must come from differentiating the new functions.</p><p>The method also offers a way to locate errors. A derivative error changes the gradient before the multiplier equations are formed. A conceptual error changes how the vector relationship is translated or omits the constraint. An algebraic error occurs when solving the simultaneous equations. A feasibility error accepts values that violate the original restrictions. An interpretation error treats a stationary candidate as a proven optimum without sufficient justification. These are different failures, so they require different corrections.</p><p>In &#39;Independent constrained optimisation&#39;, you will encounter a new illustrative problem. Two non-negative allocations x and y share 12 resource units, with x+y=12. The performance function to maximise is P(x,y)=20x+16y-x²-y². Its coefficients are part of a synthetic teaching model, not empirically validated performance data. The problem uses the same general multiplier structure, but its objective has different derivatives. The equations and numerical solution are for you to establish independently in that resource.</p><p>The complete mathematical argument can now be seen as a connected sequence. Geometry explains why a regular constrained optimum must satisfy a parallel-gradient relationship. Differentiation expresses the gradients in components. The multiplier turns that relationship into two scalar equations, and the original constraint supplies the third. Solving the system identifies feasible stationary candidates. Mathematical justification then determines whether a candidate is genuinely an optimum.</p><p>For the rectangle, this sequence led from ∇A=λ∇g to the candidate (5,5), and a separate completed-square argument established its unique global maximum area of 25 square units. The general method is useful because it preserves the same chain of reasoning when the objective, constraint and numerical answer change. Its power comes from connecting geometric meaning, algebraic calculation, feasibility and proof without confusing the role of any one of them.</p></div></section></section></article></template><template id="lj-resource-c4"><article class="util-learner-page util-page util-learner-renderer-vnext util-page--expository" data-renderer="vnext" data-page-kind="expository" data-persistence-page-key="v1::c96731df-f429-49a1-839c-f99edaf37dfd::learner-page::2.0.0::no-activities::from-candidate-to-proof" data-persistence-storage-key="learner-renderer-vnext:draft:v1::c96731df-f429-49a1-839c-f99edaf37dfd::learner-page::2.0.0::no-activities::from-candidate-to-proof" data-composition-mode="moments" data-composed-activity-count="0" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">What does the calculation prove?</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="6"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">A solution to the equations is not yet a proof</span><p class="util-journey-position" aria-label="Section 1 of 6"><span class="util-journey-position__visible" aria-hidden="true">1 of 6</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c4--exposition-S2" aria-label="Next section: What the multiplier theorem actually says"><span class="util-journey-adjacent__title">What the multiplier theorem actually says</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c4--exposition-S1" aria-current="location">A solution to the equations is not yet a proof</a></li><li><a class="util-journey-all-link" href="#lj-c4--exposition-S2">What the multiplier theorem actually says</a></li><li><a class="util-journey-all-link" href="#lj-c4--exposition-S3">What completes the rectangle proof?</a></li><li><a class="util-journey-all-link" href="#lj-c4--exposition-S4">When the equations hold but there is no optimum</a></li><li><a class="util-journey-all-link" href="#lj-c4--exposition-S5">When an optimum does not satisfy the equations</a></li><li><a class="util-journey-all-link" href="#lj-c4--exposition-S6">Judging what a calculation establishes</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c4/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-exposition-sections" data-region="exposition"><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S1" data-section-id="S1" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">A solution to the equations is not yet a proof</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Consider the rectangle with perimeter 20 units and positive side lengths x and y. Its area is A(x,y)=xy, and the perimeter constraint can be written as x+y=10, with x&gt;0 and y&gt;0.</p><p>If you completed &#39;From geometry to the multiplier equations&#39;, revisit your calculation that used the parallel-gradient condition to find the rectangle&#39;s candidate dimensions. Keep that calculation in mind as you consider what its result actually establishes. You can also follow the explanation here using the established candidate (5,5).</p><p>With g(x,y)=x+y, the multiplier equations give x=y=5 and λ=5. The point (5,5) satisfies the perimeter constraint and the positivity restrictions, so it is feasible. Its area is 25 square units.</p><p>We can now make two different statements. First, (5,5) is a feasible point satisfying the multiplier equations. Second, (5,5) gives the largest possible area among all feasible rectangles. The calculation establishes the first statement. It does not, by itself, establish the second.</p><p>This distinction is about the strength of a mathematical conclusion. Finding a point that meets a necessary condition is not the same as showing that no other feasible point can do better.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S2" data-section-id="S2" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">What the multiplier theorem actually says</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Suppose we want to maximise or minimise a differentiable function f(x,y) subject to a smooth equality constraint g(x,y)=c.</p><p>At a constrained local maximum, the objective cannot increase at sufficiently nearby feasible points. At a constrained local minimum, it cannot decrease at sufficiently nearby feasible points. These comparisons concern the feasible set, not all points in the plane.</p><p>The standard Lagrange multiplier theorem says that, at such a local optimum, provided the constraint gradient is non-zero, there is a number λ for which</p><p>∇f(x,y)=λ∇g(x,y), with g(x,y)=c and ∇g(x,y)≠(0,0).</p><p>The condition ∇g≠(0,0) is called constraint regularity. It ensures that, near the point, the smooth equality constraint has a well-defined tangent direction.</p><p>Why should the gradients be parallel? A regular constraint curve allows movement along its tangent direction while remaining feasible. At a differentiable local optimum, the objective has zero first-order change along that direction. The objective gradient must therefore be perpendicular to the feasible tangent, just as the constraint gradient is. In two dimensions, the two gradients must be parallel, allowing ∇f=λ∇g.</p><p>This connects with the geometry considered in &#39;Seeing gradients and tangency&#39;. When both the constraint curve and the relevant objective level curve are regular, their tangent directions agree at a constrained optimum. If ∇f=(0,0), however, the multiplier equation may hold with λ=0 even though the objective level curve does not have a regular tangent there.</p><p>The theorem is a necessary-condition statement: if a regular constrained local optimum exists at a point, the multiplier equations must hold there. It does not say that every solution of those equations is an optimum. That reverse implication would require further justification.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material util-exposition-structured-fallback" data-material-id="XM-S2-01" data-material-kind="logical implication diagram" data-material-type="expository_structured_fallback" data-section-id="S2" data-expository-structured="fallback" data-representation-spec-suppressed="section-figure"><h3>What the multiplier theorem guarantees</h3><p>If a differentiable objective has a constrained local maximum or minimum at a point where the smooth equality constraint has a non-zero gradient, then that point must satisfy the Lagrange multiplier equations. This is a one-way implication: satisfying the equations does not, by itself, establish a local maximum or minimum.</p></article></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--section-after-content" data-visual-slot="section-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-s2-implication-01-section-s2-section-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c4/section-after-content.png" alt="One-way implication diagram. Assumptions: a differentiable objective, a smooth equality constraint, a constrained local optimum and a non-zero constraint gradient. These necessarily imply the multiplier equations and feasibility. The reverse implication is not guaranteed." aria-describedby="lj-c4--figure-description-asset-vb-38-4-va-s2-implication-01-section-s2-section-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption" id="lj-c4--figure-description-asset-vb-38-4-va-s2-implication-01-section-s2-section-after-content"><strong>Figure 1.</strong> The standard multiplier theorem gives a necessary condition at a regular constrained local optimum. Its implication runs in one direction only.</figcaption></figure></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S3" data-section-id="S3" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">What completes the rectangle proof?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The rectangle calculation identified (5,5), but we still need to establish that its area is the largest possible.</p><p>The constraint x+y=10 lets us write y=10-x. Because both side lengths must be positive, the feasible values of x satisfy 0&lt;x&lt;10. Substituting into the area function gives</p><p>A(x,10-x)=x(10-x)=25-(x-5)^2.</p><p>A square cannot be negative, so (x-5)^2≥0. Consequently,</p><p>A(x,10-x)=25-(x-5)^2≤25.</p><p>This inequality applies to every feasible rectangle, not just the rectangles we happen to inspect. Equality occurs exactly when x=5, which also gives y=5. Therefore, the unique global maximum area is 25 square units at (5,5).</p><p>Compare the two parts of the reasoning. The multiplier equations identify the feasible candidate. The completed-square identity proves that no feasible rectangle has a greater area.</p><p>Checking individual rectangles would provide less evidence. For example, (2,8) has area 16 and (4,6) has area 24, both smaller than 25. But a finite collection of comparisons does not cover every possible positive pair satisfying x+y=10. The pair (6,6) has area 36, yet it cannot challenge the conclusion because its side lengths add to 12 rather than 10: it is infeasible.</p><p>The proof establishes a global maximum because it compares the candidate with the entire feasible set. A local maximum requires comparison only with sufficiently nearby feasible points. Every global maximum is also local, but a local conclusion alone would not establish the global claim.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S4" data-section-id="S4" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">When the equations hold but there is no optimum</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The rectangle might suggest that solving the multiplier equations normally produces a maximum. A second example shows why that conclusion is not justified by the equations alone.</p><p>Consider f(x,y)=x^3 subject to y=0. The feasible points lie on the horizontal line where y is zero. Write the constraint as g(x,y)=y, so ∇g=(0,1). This gradient is non-zero everywhere, meaning the constraint is regular.</p><p>The objective gradient is ∇f=(3x^2,0). At the origin,</p><p>∇f(0,0)=(0,0), and ∇g(0,0)=(0,1).</p><p>The multiplier equation is satisfied with λ=0 because (0,0)=0(0,1). The point also satisfies y=0. Thus (0,0) is a feasible candidate that meets the standard first-order equations.</p><p>But what happens to the objective at nearby feasible points? Along the constraint, f(x,0)=x^3. When x is positive, x^3 is positive and therefore greater than f(0,0)=0. When x is negative, x^3 is negative and therefore smaller than zero. Both kinds of feasible point can be chosen arbitrarily close to the origin.</p><p>The origin is therefore neither a local maximum nor a local minimum. It satisfies the multiplier equations, and the constraint is regular, but the objective takes both larger and smaller values nearby.</p><p>There is no contradiction with the theorem. The theorem says that regular constrained local optima must satisfy the equations. It does not say that every point satisfying the equations must be an optimum. The example also shows why ∇f=(0,0) is not enough to establish an extremum: a zero first derivative does not determine the behaviour of nearby feasible values.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S5" data-section-id="S5" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">When an optimum does not satisfy the equations</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The cubic example showed that satisfying the multiplier equations does not guarantee an optimum. A different question is whether every constrained optimum must satisfy those equations.</p><p>Consider f(x,y)=x subject to x^2+y^2=0. Since the square of a real number is non-negative, the sum x^2+y^2 can equal zero only when both x and y are zero. The feasible set therefore contains exactly one point: (0,0).</p><p>That point is both a global maximum and a global minimum relative to the feasible set. There is no other feasible point with a larger or smaller objective value. This conclusion follows directly from the constraint.</p><p>Now examine the multiplier equations. With g(x,y)=x^2+y^2,</p><p>∇f(0,0)=(1,0), and ∇g(0,0)=(0,0).</p><p>For the multiplier condition to hold, we would need</p><p>(1,0)=λ(0,0).</p><p>No value of λ can make this true, because multiplying the zero vector by any scalar still gives the zero vector.</p><p>Does this disprove the multiplier theorem? No. Its necessary-condition conclusion applies at regular constrained local optima, where ∇g is non-zero. Here the constraint gradient vanishes. The point is singular, so the theorem&#39;s assumption is not satisfied.</p><p>Compare the two counterexamples carefully. In the cubic example, the constraint is regular and the equations hold, but the point is not optimal. In this singular example, the point is optimal, but the standard equations need not hold because the regularity assumption fails. The examples reveal different limits of what the calculation can establish.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S6" data-section-id="S6" data-expository-section-role="terminal-close" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Judging what a calculation establishes</span></h2><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-S6-01" data-material-kind="three-case mathematical comparison table" data-material-type="expository_structured_table" data-section-id="S6" data-expository-structured="table"><h3>Three cases, three different conclusions</h3><p>Compare what is known about each point before deciding whether the multiplier calculation supports an optimality claim.</p><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Example</th><th scope="col">Candidate or feasible point</th><th scope="col">Constraint regularity</th><th scope="col">Multiplier equations</th><th scope="col">Optimality</th><th scope="col">Justified conclusion</th></tr></thead><tbody><tr><td>Rectangle</td><td>(5,5), feasible under x+y=10 with x&gt;0 and y&gt;0.</td><td>Regular: ∇g=(1,1)≠(0,0).</td><td>Satisfied: ∇A(5,5)=(5,5)=5∇g, so λ=5 for g=x+y.</td><td>Unique global maximum.</td><td>The multiplier equations identify the candidate. The separate identity A(x,10-x)=25-(x-5)^2≤25 proves that its area of 25 square units is the unique global maximum.</td></tr><tr><td>Cubic objective</td><td>(0,0), feasible under y=0.</td><td>Regular: ∇g=(0,1)≠(0,0).</td><td>Satisfied: ∇f(0,0)=(0,0)=0∇g, so λ=0.</td><td>Neither a local maximum nor a local minimum.</td><td>Nearby feasible points have both larger and smaller values of x^3. The first-order equations are not sufficient to establish an optimum.</td></tr><tr><td>Singular constraint</td><td>(0,0), the sole feasible point under x^2+y^2=0.</td><td>Singular: ∇g(0,0)=(0,0).</td><td>Not satisfied: no λ makes (1,0)=λ(0,0).</td><td>Both a global maximum and a global minimum relative to the singleton feasible set.</td><td>Optimality follows from the feasible set containing only (0,0). The standard multiplier theorem does not apply because its regularity assumption fails.</td></tr></tbody></table></div><p>The three cases separate two different limits of the method: satisfying the equations is not sufficient for optimality, and the equations are not guaranteed to hold at singular constrained optima.</p><section><h4>Accessibility</h4><div><p><strong>Table caption</strong></p><p>Comparison of feasibility, constraint regularity, multiplier-equation status and optimality for the rectangle, cubic objective and singular constraint.</p></div><div><p><strong>Reading order</strong></p><p>Read the column headings first. Then read each example across its row, from the proposed point through regularity and multiplier status to the justified conclusion.</p></div><section><h4>Linear alternative</h4><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Example</th><th scope="col">Summary</th></tr></thead><tbody><tr><td>Rectangle</td><td>The point (5,5) is feasible and regular. The multiplier equations hold with λ=5 when g=x+y. A separate completed-square argument proves a unique global maximum area of 25 square units.</td></tr><tr><td>Cubic objective</td><td>The point (0,0) is feasible and regular. The multiplier equations hold with λ=0. Nevertheless, arbitrarily close feasible points have objective values above and below zero, so the point is neither a local maximum nor a local minimum.</td></tr><tr><td>Singular constraint</td><td>The point (0,0) is the only feasible point and is both a global maximum and a global minimum. The constraint gradient vanishes, and no multiplier satisfies the equations. The standard theorem&#39;s regularity assumption is absent.</td></tr></tbody></table></div></section><div><p><strong>Non visual equivalence</strong></p><p>Every status is stated explicitly in words and mathematical notation. No distinction depends on colour, icons or spatial position.</p></div><section><h4>Notation support</h4><ul><li>Regular means that the constraint gradient is non-zero at the point.</li><li>Singular means that the constraint gradient vanishes at the point.</li><li>A local optimum is determined by sufficiently nearby feasible points.</li><li>A global optimum is determined by comparison with all feasible points.</li><li>A necessary condition must hold when the theorem&#39;s assumptions and optimality conclusion hold; it need not be sufficient to prove optimality.</li></ul></section></section></article></div><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation" data-expository-closure="terminal"><p>The three examples show why the validity of an optimisation claim cannot be judged simply by checking whether a multiplier has been found.</p><p>The rectangle gives a successful calculation followed by a separate global proof. The cubic example shows that a regular candidate can satisfy the equations without being a local optimum. The singular example shows that an optimum may exist where the standard theorem&#39;s assumptions fail and no multiplier can be found.</p><p>These are different mathematical situations. A solution of the multiplier equations is evidence that a point meets a first-order condition. It is not evidence, on its own, that the point has t
