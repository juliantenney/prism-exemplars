ditable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c6--a2-a2-m3-input-r2-c1" name="a2-a2-m3-input-r2-c1" data-learner-cell="a2-a2-m3-input-r2-c1" rows="3" aria-labelledby="lj-c6--a2-a2-m3-row-2 lj-c6--a2-a2-m3-col-evidential-status-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c6--a2-a2-m3-input-r2-c2" name="a2-a2-m3-input-r2-c2" data-learner-cell="a2-a2-m3-input-r2-c2" rows="3" aria-labelledby="lj-c6--a2-a2-m3-row-2 lj-c6--a2-a2-m3-col-supporting-source-detail-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c6--a2-a2-m3-input-r2-c3" name="a2-a2-m3-input-r2-c3" data-learner-cell="a2-a2-m3-input-r2-c3" rows="3" aria-labelledby="lj-c6--a2-a2-m3-row-2 lj-c6--a2-a2-m3-col-limitation-or-uncertainty-3" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A2-M2" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Three candidate claims</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><p>These are three separate claims for evaluation, not findings. Consider each claim&#39;s exact wording before assigning an evidential status.</p><ol><li>Claim 1 — Recovery: The Aster Notebook was found undamaged in the secure preparation room at 08:15 on 15 May 2026.</li><li>Claim 2 — Removal: Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.</li><li>Claim 3 — Intention: Mara Vale stole the Aster Notebook or acted with dishonest intention.</li></ol><p>For each claim, choose the most defensible status: directly established by an observation; strongly supported through inference; or not established by the available evidence. Use source details and a limitation to justify your choice. The three claims need not receive the same status.</p></article></li></ol></article><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A2-M4" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Your overall assessment of proposition P</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><p>Write approximately two or three sentences assessing the strength of the combined evidence for this proposition:</p><p>&gt; Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.</p><p>Identify at least one relationship between sources that strengthens or qualifies the case. Also state one important limit: what does the evidence not establish merely because it supports the proposition?</p><p>Your response:</p><p>This is an assessment of the evidence for P. You are not being asked to reconsider your earlier personal judgement in this activity.</p></article></li></ol></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A three-claim evaluation that applies consistent evidential criteria, cites relevant source particulars, distinguishes direct observations from corroborated inferences, and identifies a meaningful limitation for each judgement. The concluding assessment should address P specifically, distinguish it from allegations of theft or dishonesty, and avoid equating strong support with absolute certainty.</p></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-task-step-step-2-2" data-response-part-id="A2-task-step-step-2-2"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c6--learner-workspace-a2-a2-task-step-step-2-2-label" for="lj-c6--learner-workspace-a2-a2-task-step-step-2-2">Your response</label><p class="util-learner-workspace__prompt" id="lj-c6--learner-workspace-a2-a2-task-step-step-2-2-desc">Write a brief overall assessment of the evidential support for proposition P, keeping removal separate from theft or dishonest intention.</p><textarea class="util-learner-workspace__input" id="lj-c6--learner-workspace-a2-a2-task-step-step-2-2" name="learner-workspace-a2-a2-task-step-step-2-2" rows="6" aria-describedby="lj-c6--learner-workspace-a2-a2-task-step-step-2-2-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c6--learner-check-a2" data-check-sidebar-open aria-controls="lj-c6--learner-check-a2" aria-expanded="false" aria-label="Check your work: What can the evidence establish?">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c6--learner-check-a2" data-composition-moment="check" data-activity-id="A2" data-check-sidebar="available" aria-labelledby="lj-c6--learner-check-a2-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c6--learner-check-a2-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c6--learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c6--learner-task-a2">Back to your task (What can the evidence establish?)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m5-c-0" data-revision-criterion-id="a2-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you distinguished a directly observed finding from a conclusion inferred from several sources?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>If observation and inference receive the same treatment without justification, the evidential status assigned to each claim loses its meaning.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The recovery claim is evaluated in relation to the observation of the notebook&#39;s location and condition.</li><li><span class="util-guided-review__feature-key">B.</span> The removal claim is assessed through the relationship between documentary records, statements and other observations.</li><li><span class="util-guided-review__feature-key">C.</span> The evidential status matches the type and scope of support offered.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify which source records the recovery and distinguish the observation at recovery from claims about earlier events.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain how the sources relate to the alleged earlier action, rather than describing the action as though it had been directly witnessed in the supplied dossier.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Reconsider any classification that treats a source&#39;s assertion or a later observation as direct verification of an earlier unobserved event.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c6--checklist-a2-a2-m5-item-0" data-checklist-item-id="checklist-a2-a2-m5-item-0"><label class="util-interactive-checklist__label" for="lj-c6--checklist-a2-a2-m5-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c6--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m5-c-1" data-revision-criterion-id="a2-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you justified your classifications with identifiable source particulars?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A status without supporting particulars cannot be tested against the case record or compared with alternative interpretations.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each table row refers to a relevant attributed record, statement or observation.</li><li><span class="util-guided-review__feature-key">B.</span> The overall assessment identifies a relationship between at least two sources.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Add a source name and a concrete detail, such as the record time, message wording, witness observation or recovery location.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain how two relevant pieces of evidence corroborate, qualify or constrain one another in relation to P.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c6--checklist-a2-a2-m5-item-1" data-checklist-item-id="checklist-a2-a2-m5-item-1"><label class="util-interactive-checklist__label" for="lj-c6--checklist-a2-a2-m5-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c6--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m5-c-2" data-revision-criterion-id="a2-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you identified limitations that genuinely affect the strength of each judgement?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without claim-specific limitations, corroborating evidence can be mistaken for complete proof of every associated detail.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each table row identifies a limitation relevant to that particular claim.</li><li><span class="util-guided-review__feature-key">B.</span> Your overall assessment distinguishes strong evidential support from absolute certainty.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Ask what the cited source did not observe or verify and record the resulting uncertainty in the final column.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Qualify the conclusion by naming a source dependency, an unobserved stage or another limit that prevents a stronger assertion.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c6--checklist-a2-a2-m5-item-2" data-checklist-item-id="checklist-a2-a2-m5-item-2"><label class="util-interactive-checklist__label" for="lj-c6--checklist-a2-a2-m5-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c6--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m5-c-3" data-revision-criterion-id="a2-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you kept removal separate from theft or dishonest intention?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A conclusion about an action does not, by itself, establish the mental state or wrongdoing alleged in a different proposition.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The removal claim is assessed independently of the allegation of theft.</li><li><span class="util-guided-review__feature-key">B.</span> Your reasoning distinguishes Mara&#39;s stated purpose from independently established intention.</li><li><span class="util-guided-review__feature-key">C.</span> The overall assessment does not convert support for P into a finding of wrongdoing.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Evaluate the evidence for the physical removal first, then separately ask what evidence bears on dishonest intention.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify whether a claim about motive rests on her message, the humidity context or another source, and avoid treating a stated explanation as direct access to her mental state.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Remove or qualify any allegation of theft that is presented as following automatically from removal.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c6--checklist-a2-a2-m5-item-3" data-checklist-item-id="checklist-a2-a2-m5-item-3"><label class="util-interactive-checklist__label" for="lj-c6--checklist-a2-a2-m5-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c6--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Review the example response</summary><div class="util-composition-reveal__body"><article class="util-material-block util-sample-output util-prose-measure" data-material-id="A2-M6" data-material-type="sample_output" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><span class="util-semantic-icon__label">Reveal after your assessment: Weighing the three claims</span></p><h3 class="util-md-heading util-md-heading--source-3">Review after completing both responses</h3><p>The following is a reasoned evaluation of the available simulated evidence. It is not a claim that records or witness statements are infallible.</p><table><thead><tr><th>Claim</th><th>Defensible evidential status</th><th>Reasoning and limitation</th></tr></thead><tbody><tr><td>Claim 1 — The notebook was found undamaged in the secure preparation room at 08:15 on 15 May.</td><td>Directly established by an observation, within the supplied case record.</td><td>The recovery observation records the notebook&#39;s location, protective case and undamaged condition at 08:15. This directly concerns the stated recovery claim. It does not directly observe how the notebook reached that location.</td></tr><tr><td>Claim 2 — Mara removed the notebook from its display cabinet before 18:00 on 14 May.</td><td>Strongly supported through inference.</td><td>The 17:16 conservation record bears Mara&#39;s staff identifier and describes transfer of the notebook to a protective case. Her 17:40 message acknowledges moving it. The earlier cabinet checks, access information and later recovery provide further context. These sources converge on the proposition, but the supplied dossier does not include a direct observation of Mara physically lifting the notebook from the display cabinet.</td></tr><tr><td>Claim 3 — Mara stole the notebook or acted with dishonest intention.</td><td>Not established by the available evidence.</td><td>Removal and dishonest intention are different claims. Mara&#39;s message gives a protective explanation, Dr Bell confirms an unusual humidity reading, and the notebook was recovered undamaged in a secure preparation room. Those details matter when evaluating the allegation, but they do not provide direct access to Mara&#39;s intention. The evidence for removal cannot, on its own, establish theft.</td></tr></tbody></table><h3 class="util-md-heading util-md-heading--source-3">Example overall assessment of P</h3><p>The combined evidence strongly supports the proposition that Mara removed the Aster Notebook before 18:00: the 17:16 conservation record and Mara&#39;s 17:40 message are mutually relevant, while the cabinet checks and recovery observation provide additional context. However, these sources do not amount to direct observation of every step in the removal, and support for P does not itself establish theft or dishonest intention.</p><h3 class="util-md-heading util-md-heading--source-3">Why the claims receive different treatment</h3><p>The recovery claim concerns an observed state of affairs at a specified time. The removal claim concerns an earlier action reconstructed from records and statements. The intention claim adds a further proposition about wrongdoing that cannot be read directly from the fact of removal.</p><p>Corroboration matters because distinct sources can make an account more defensible. Yet a staff-identified record, a person&#39;s own message and a later recovery observation each have different evidential roles and limits. The appropriate judgement follows from their content and relationships, not from the number of documents alone.</p><h3 class="util-md-heading util-md-heading--source-3">Debrief</h3><p>A strong evidential case for one proposition does not automatically support every related allegation. The next activity asks what this distinction tells us about truth, belief and justification.</p></article></div></details></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c6--activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Truth, justification and changing evidence</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Explain changing justification in relation to stable truth conditions and transfer the distinction to public communication.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The source-based judgements now provide a concrete basis for philosophical analysis. This final activity connects the changing strength of justification with the stable truth conditions of P, then applies that distinction to a different claim made for a different audience.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have distinguished new evidence from reinterpretation and evaluated the strength of different claims. Now explain how an investigator&#39;s reasons for believing a proposition can change while the proposition continues to concern the same events.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Distinguish what would make a proposition true from what currently justifies believing it. Use at least one of the correspondence, coherence or pragmatic approaches accurately. In the transfer task, apply the same distinction to a public statement rather than repeating the investigation&#39;s evidential classifications.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Can you state separately what would make the proposition true, what supports believing it now, and what remains open to further enquiry?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A3"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><article class="util-material-block util-material-table-block" data-material-id="A3-M2" data-material-type="reference_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Three approaches to truth: A concise reference</span></p><p>These approaches were introduced earlier in the learning journey. Use this reference to select a relevant philosophical lens for your explanation.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Approach</th><th>Central concern</th><th>Caution against oversimplification</th></tr></thead><tbody><tr><td>Correspondence — associated with Aristotle and Bertrand Russell</td><td>The relationship between a proposition and reality: whether things are as the proposition states.</td><td>Evidence that someone believes a proposition is not itself what makes the proposition correspond to reality.</td></tr><tr><td>Coherence — associated with F. H. Bradley and idealist traditions</td><td>The systematic relations among beliefs or propositions within a wider account.</td><td>A plausible or internally consistent story is not automatically a sufficient account of truth; different coherent accounts may compete.</td></tr><tr><td>Pragmatic approaches — associated with Charles Sanders Peirce, William James and John Dewey</td><td>Enquiry, experience and the practical consequences of beliefs and their testing.</td><td>Pragmatic truth is not simply whatever is convenient or produces an immediately desirable result.</td></tr></tbody></table></div><p>You may use one approach or compare more than one. Whichever you choose, distinguish the truth of a proposition from the evidence and reasoning that support believing it.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c6--learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="lj-c6--learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="lj-c6--learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c6--learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c6--learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="lj-c6--learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c6--learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>First, write a concise explanation of how the newly disclosed evidence could change an investigator&#39;s justification for believing P without changing what would make P true. Use at least one philosophical approach and one relevant source detail.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A3-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated case reference: An unchanged proposition</span></p><h3 class="util-md-heading util-md-heading--source-2">The proposition and the available sources</h3><p>This is a fictional, simulated case reference. The proposition remains exactly the same:</p><p>&gt; Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.</p><p>The following source details were disclosed in the earlier activities.</p><table><thead><tr><th>Source</th><th>Source detail</th></tr></thead><tbody><tr><td>Electronic Archive Room door log</td><td>Mara&#39;s exit from the Archive Room is recorded at 17:21 on 14 May 2026.</td></tr><tr><td>Elias Reed&#39;s original written note</td><td>Elias described seeing Mara leave the &quot;Archive Room&quot; at approximately 17:25, although his sighting concerned the wider archive corridor.</td></tr><tr><td>Conservation preparation record</td><td>Created at 17:16 on 14 May 2026, bearing Mara&#39;s staff identifier: &quot;Aster Notebook transferred to protective case; secure preparation room pending humidity review.&quot;</td></tr><tr><td>Mara Vale&#39;s internal message to Dr Rowan Bell</td><td>Sent at 17:40 on 14 May 2026: &quot;Moved Aster for protection. Will explain when we speak.&quot;</td></tr><tr><td>Dr Rowan Bell&#39;s environmental confirmation</td><td>Dr Bell confirmed an unusual humidity reading in the Archive Room earlier that afternoon.</td></tr><tr><td>Recovery observation</td><td>At 08:15 on 15 May 2026, the notebook was found undamaged inside its protective case in the secure preparation room.</td></tr></tbody></table><p>Use the proposition and the source details when writing your explanation. Do not assume that the wording of the proposition changes when new information becomes available.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Consider a short fictional public-information statement about the investigation. Write a two-sentence correction for its audience that distinguishes an evidential update from a change in historical truth, without claiming more than the evidence warrants.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A3-M4" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated public-information draft</span></p><h3 class="util-md-heading util-md-heading--source-2">Bellwether Institute: Draft public update</h3><p>This is a fictional, simulated draft statement prepared after the new evidence became available. Its intended audience is readers of a public update about the Aster Notebook investigation.</p><p>&gt; The new records have changed the truth about whether Mara Vale removed the Aster Notebook.</p><p>The statement has not yet been issued. Read its wording closely before producing a revised version for the public audience.</p></article><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A3-M3" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Explain changing justification</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><p>Write approximately three or four sentences addressing this question:</p><p>How could the newly disclosed evidence change an investigator&#39;s justification for believing proposition P without changing what would make P true?</p><p>Your explanation should distinguish truth, belief and justification; identify at least one relevant source detail; and apply at least one approach from the philosophical reference table accurately. Explain how the approach helps you reason about the case rather than merely naming a philosopher.</p><p>Your explanation:</p><p>Do not use the later public-information statement as a substitute for this philosophical explanation. That is a separate application.</p></article></li></ol></article><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A3-M6" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Your two-sentence public correction</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><p>Write exactly two sentences for readers of the fictional Bellwether Institute public update. Replace the misleading draft with a more defensible account of what has changed and what the evidence can support.</p><p>Your corrected public statement:</p><p>Keep the correction distinct from your earlier philosophical explanation: this response is intended for a public audience.</p></article></li></ol></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A concise philosophical explanation that accurately distinguishes truth, belief and justification, uses a relevant source detail and applies at least one philosophical approach without reducing truth to coherence alone or practical convenience. A separate two-sentence public-facing correction should transfer the same distinction to a different communicative purpose, identify the misleading implication in the supplied statement and offer a more defensible formulation without overstating certainty or introducing new facts.</p></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="960" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-expected-output-expected-output-960" data-response-part-id="A3-expected-output-expected-output-960"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c6--learner-workspace-a3-a3-expected-output-expected-output-960-label" for="lj-c6--learner-workspace-a3-a3-expected-output-expected-output-960">Your response</label><p class="util-learner-workspace__prompt" id="lj-c6--learner-workspace-a3-a3-expected-output-expected-output-960-desc">A concise philosophical explanation that accurately distinguishes truth, belief and justification, uses a relevant source detail and applies at least one philosophical approach without reducing truth to coherence alone or practical convenience. A separate two-sentence public-facing correction should transfer the same distinction to a different communicative purpose, identify the misleading implication in the supplied statement and offer a more defensible formulation without overstating certainty or introducing new facts.</p><textarea class="util-learner-workspace__input" id="lj-c6--learner-workspace-a3-a3-expected-output-expected-output-960" name="learner-workspace-a3-a3-expected-output-expected-output-960" rows="8" aria-describedby="lj-c6--learner-workspace-a3-a3-expected-output-expected-output-960-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c6--learner-check-a3" data-check-sidebar-open aria-controls="lj-c6--learner-check-a3" aria-expanded="false" aria-label="Check your work: Truth, justification and changing evidence">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c6--learner-check-a3" data-composition-moment="check" data-activity-id="A3" data-check-sidebar="available" aria-labelledby="lj-c6--learner-check-a3-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c6--learner-check-a3-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c6--learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c6--learner-task-a3">Back to your task (Truth, justification and changing evidence)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M7" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m7" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m7-c-0" data-revision-criterion-id="a3-m7-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you distinguished the proposition&#39;s truth from an investigator&#39;s belief and justification?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without this distinction, the explanation risks treating a change in available evidence as a change in the historical event itself.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your philosophical explanation identifies what the proposition is about independently of the investigator&#39;s current evidence.</li><li><span class="util-guided-review__feature-key">B.</span> Your explanation identifies how reasons for accepting the proposition can change.</li><li><span class="util-guided-review__feature-key">C.</span> Your public correction does not describe historical truth as altered by the arrival of records.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State what the proposition would require of the events on 14 May, separately from what investigators know about those events.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Distinguish a person&#39;s belief from the evidence and reasoning that now support that belief.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Revise the public wording to distinguish a change in available information or evidential support from a change in what happened.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c6--checklist-a3-a3-m7-item-0" data-checklist-item-id="checklist-a3-a3-m7-item-0"><label class="util-interactive-checklist__label" for="lj-c6--checklist-a3-a3-m7-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c6--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m7-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m7-c-1" data-revision-criterion-id="a3-m7-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you applied at least one philosophical approach accurately?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Merely naming a theory does not explain how it contributes to the distinction between truth and justification.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The selected approach is connected to its central philosophical concern.</li><li><span class="util-guided-review__feature-key">B.</span> Your application avoids reducing the theory to a slogan.</li><li><span class="util-guided-review__feature-key">C.</span> The theory is used to illuminate the question rather than replace source evaluation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> For correspondence, address reality and propositions; for coherence, address systematic relations among beliefs; or for pragmatism, address enquiry and experience.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Check that you have not equated coherence with any plausible story, pragmatism with convenience, or correspondence with whatever a witness currently believes.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain what the chosen approach helps distinguish while retaining the need to examine the case evidence.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c6--checklist-a3-a3-m7-item-1" data-checklist-item-id="checklist-a3-a3-m7-item-1"><label class="util-interactive-checklist__label" for="lj-c6--checklist-a3-a3-m7-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c6--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m7-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m7-c-2" data-revision-criterion-id="a3-m7-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you connected the philosophical reasoning to a specific evidential development?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An abstract distinction alone would not explain why the investigator&#39;s justification changes in this particular case.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your explanation identifies at least one newly disclosed source detail.</li><li><span class="util-guided-review__feature-key">B.</span> You explain the relationship between that detail and the investigator&#39;s reasons for believing P.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Select a specific detail from the conservation record, message, humidity confirmation or recovery observation.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Add a reasoning step showing how the selected information affects the support available for the unchanged proposition.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c6--checklist-a3-a3-m7-item-2" data-checklist-item-id="checklist-a3-a3-m7-item-2"><label class="util-interactive-checklist__label" for="lj-c6--checklist-a3-a3-m7-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c6--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m7-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m7-c-3" data-revision-criterion-id="a3-m7-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Does your public correction communicate responsibly without overstating the case?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Public readers may mistake an evidential update for proof of additional allegations if the correction exceeds the sources.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The correction is written as two accessible sentences for a public audience.</li><li><span class="util-guided-review__feature-key">B.</span> The wording differentiates evidence about removal from any allegation about intention.</li><li><span class="util-guided-review__feature-key">C.</span> The correction communicates the strength of the evidence without claiming absolute certainty.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Replace theory-specific terminology with a concise explanation of what new information changes for the investigation.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Remove or qualify claims about theft, dishonesty or motive unless you can identify separate evidence warranting them.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Use a defensible evidential formulation rather than treating corroborating records as infallible proof of every detail.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c6--checklist-a3-a3-m7-item-3" data-checklist-item-id="checklist-a3-a3-m7-item-3"><label class="util-interactive-checklist__label" for="lj-c6--checklist-a3-a3-m7-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c6--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m7-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Review the example response</summary><div class="util-composition-reveal__body"><article class="util-material-block util-sample-output util-prose-measure" data-material-id="A3-M8" data-material-type="sample_output" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><span class="util-semantic-icon__label">Reveal after both responses: Truth and justification</span></p><h3 class="util-md-heading util-md-heading--source-3">Review after completing both written responses</h3><p>The following examples illustrate defensible answers. They are not the only possible philosophical explanations or public formulations.</p><h3 class="util-md-heading util-md-heading--source-3">Example philosophical explanation</h3><p>The truth of P depends on whether Mara actually removed the Aster Notebook from its cabinet before 18:00 on 14 May, not on how much evidence investigators possess at a particular moment. The 17:16 conservation record and Mara&#39;s 17:40 message give investigators additional reasons to believe P, so their justification can strengthen without changing the earlier event. On a correspondence approach, the proposition is true if it matches what happened, while the records are evidence used to judge that correspondence. The evidence strongly supports the proposition, but its existence does not make every recorded claim infallible.</p><h3 class="util-md-heading util-md-heading--source-3">Other defensible philosophical connections</h3><p>A coherence-focused explanation could examine how the conservation record, message, humidity information and recovery observation relate to one another and to earlier testimony. It would need to distinguish systematic fit from the mistaken assumption that any consistent narrative must be true.</p><p>A pragmatic explanation could consider how enquiry develops through checking records, testing interpretations against experience and revising warranted conclusions. It should not equate truth with whichever interpretation seems most useful to the Institute.</p><p>These approaches raise different philosophical questions. The Aster Notebook case provides an opportunity to apply them; it does not settle the wider disagreements between theories of truth.</p><h3 class="util-md-heading util-md-heading--source-3">Example two-sentence public correction</h3><p>&gt; Newly available records have strengthened the evidence about whether Mara Vale removed the Aster Notebook; they have not changed what happened on 14 May. The combined evidence strongly supports her removal of the notebook before 18:00, but that conclusion does not itself establish theft or dishonest intention.</p><p>The correction replaces a claim about changing truth with a claim about changing evidential support. It also separates the historical action under investigation from a more serious allegation requiring its own justification.</p><h3 class="util-md-heading util-md-heading--source-3">Debrief</h3><p>You have examined newly disclosed evidence, distinguished it from reinterpretation, assessed the strength of different claims and explained how justification can change while a proposition&#39;s truth conditions remain fixed. In &quot;Reconsidering your judgement&quot;, you will use this analysis to revisit your own earlier judgement. That personal reconsideration has deliberately not been completed here.</p><h3 class="util-md-heading util-md-heading--source-3">Page learner-resource closure</h3><ul><li>Keep three questions separate when studying the case: What does a source record? What interpretation does it support? What remains uncertain?</li><li>Evaluate propositions individually. Evidence strongly supporting removal does not automatically establish theft or dishonest intention.</li><li>Revisit the correspondence, coherence and pragmatic approaches by asking what each contributes to understanding truth, enquiry and justification without treating them as interchangeable.</li><li>Keep your evidence comparisons and philosophical explanation available for &quot;Reconsidering your judgement&quot;, where you will independently revisit your earlier position.</li></ul></article></div></details></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A3"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M5" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Apply the distinction to public communication</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-transfer-prompt-a3-m5-910" data-response-part-id="A3-transfer-prompt-a3-m5-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c6--learner-workspace-a3-a3-transfer-prompt-a3-m5-910-label" for="lj-c6--learner-workspace-a3-a3-transfer-prompt-a3-m5-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="lj-c6--learner-workspace-a3-a3-transfer-prompt-a3-m5-910-desc"><p>You are now writing for readers of a Bellwether Institute public update rather than for an investigator evaluating records or a philosophy tutor assessing an argument.</p><p>Using the draft statement provided, write a two-sentence public-facing correction. Your first sentence should replace the draft&#39;s misleading implication about what the new records have changed. Your second should communicate the evidential position responsibly, without making unsupported claims about Mara&#39;s intention or theft.</p><p>Use language that a reader unfamiliar with the philosophical theories can understand. Do not add events, witnesses or findings beyond the evidence already supplied.</p></div><textarea class="util-learner-workspace__input" id="lj-c6--learner-workspace-a3-a3-transfer-prompt-a3-m5-910" name="learner-workspace-a3-a3-transfer-prompt-a3-m5-910" rows="5" aria-describedby="lj-c6--learner-workspace-a3-a3-transfer-prompt-a3-m5-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><aside class="util-study-tips" data-region="study-tips" id="lj-c6--journey-study-tips" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--study-tips" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg></span><span class="util-semantic-icon__label">Study tips</span></h2><div class="util-study-tips__content util-prose-measure"><ul><li>Keep three questions separate when studying the case: What does a source record? What interpretation does it support? What remains uncertain?</li><li>Evaluate propositions individually. Evidence strongly supporting removal does not automatically establish theft or dishonest intention.</li><li>Revisit the correspondence, coherence and pragmatic approaches by asking what each contributes to understanding truth, enquiry and justification without treating them as interchangeable.</li><li>Keep your evidence comparisons and philosophical explanation available for &quot;Reconsidering your judgement&quot;, where you will independently revisit your earlier position.</li></ul></div></aside><style id="lj-c6--prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;position:fixed;top:var(--learner-sticky-nav-height,0px);left:0;right:0;z-index:40;margin:0 auto;max-width:42rem;width:calc(100% - 1.5rem);padding:.45rem .75rem;border:1px solid #cbd5e1;border-left:3px solid #64748b;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.12)}.util-learner-renderer-vnext .util-revision-reminder__chrome{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.35rem .75rem;margin:0 0 .2rem}.util-learner-renderer-vnext .util-revision-reminder__label{margin:0;font-size:.75rem;font-weight:650;color:#64748b}.util-learner-renderer-vnext .util-revision-reminder__statement{margin:0;font-size:.9rem;line-height:1.4;font-weight:600;color:#0f172a}.util-learner-renderer-vnext .util-revision-reminder__view{font:inherit;font-size:.9rem;color:#1d4ed8;background:transparent;border:0;padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}.util-learner-renderer-vnext .util-revision-reminder__view:focus{outline:2px solid #2563eb;outline-offset:2px}</style><style id="lj-c6--prism-check-sidebar-css">.util-learner-renderer-vnext{--lea
