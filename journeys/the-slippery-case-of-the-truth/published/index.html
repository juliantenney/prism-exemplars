body></table></div><dl><div><dt>Accessible text</dt><dd>Peirce emphasises sustained self-correcting enquiry. Applied to P, the discrepancy between the electronic Archive Room door log recording Mara&#39;s departure at 17:21 and Elias&#39;s written note describing her departure at 17:25 illustrates the need to reconsider interpretations. His ideal of convergence through continued enquiry must not be mistaken for present consensus or certainty.

James emphasises experiential verification and practical consequences. Applied to P, the hypothesis that Mara removed the notebook can direct attention to access, timing and testimony. Such direction may be useful even if the hypothesis is mistaken; usefulness alone does not establish truth.

Dewey emphasises disciplined enquiry and warranted assertibility. Applied to P, investigators must identify what the available records justify asserting while recognising unresolved matters such as the contents of the grey case. A warranted assertion remains open to revision and is not the same as infallible knowledge.</dd></div></dl><p>The perspectives overlap in treating enquiry seriously, but they foreground different relationships between testing beliefs, learning from experience and justifying assertions. None independently settles P.</p></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c5--exposition-S6" data-section-id="S6" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Three accounts of truth, one disputed proposition</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The three pragmatic thinkers can now be considered alongside the correspondence and coherence approaches encountered earlier. All three families of ideas can illuminate P, but they do not ask exactly the same philosophical question.</p><p>Correspondence concerns the relationship between a proposition and reality. For P, the question is whether Mara actually removed the Aster Notebook from its display cabinet before 18:00 on 14 May. What happened determines whether the proposition corresponds to reality. The investigator&#39;s present uncertainty does not make the underlying event uncertain in the same sense. However, stating that truth involves correspondence does not itself tell investigators which records to examine or how to evaluate conflicting testimony.</p><p>Coherence concerns the systematic relationships among beliefs or propositions. P must be considered in relation to other claims, including the timing of Mara&#39;s access and the accounts of people near the Archive Room. A coherent account is more than a story without obvious contradictions: the relationships among its claims must form an appropriately organised and mutually supporting system. Even then, a coherent set of beliefs may fail to match reality. Different systems may also appear coherent while supporting incompatible conclusions.</p><p>Pragmatic approaches direct attention to enquiry, experience and practical consequences. Peirce highlights the correction of belief through sustained investigation; James examines how ideas connect with experience and verification; Dewey considers what disciplined enquiry warrants asserting. These perspectives help explain how investigators can improve their understanding and qualify their conclusions. They do not establish that a belief is true merely because following it proves useful.</p><p>The three approaches are therefore not interchangeable investigative methods. Checking the electronic door log is a procedure for obtaining or examining evidence. Comparing Elias&#39;s testimony with that record is a procedure for evaluating an account. Developing and testing a hypothesis is part of investigation. None of those procedures is identical to a philosophical theory of truth.</p><p>An investigator might use all these procedures while considering the philosophical questions raised by correspondence, coherence and pragmatism. The theories illuminate different aspects of the same problem; they do not require investigators to choose one exclusive technique for determining what happened.</p><p>Nor do they produce different historical events. P retains the same meaning throughout the comparison. Its truth is not altered by changing philosophical perspectives, and its current evidential support remains limited by what has been disclosed. The value of the comparison lies in understanding what each theory explains, what it leaves open and why the distinctions should be preserved.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-M02" data-material-kind="Three-way philosophical comparison table" data-material-type="expository_structured_table" data-section-id="S6" data-expository-structured="table"><h3>Correspondence, coherence and pragmatic approaches compared</h3><p>Each approach illuminates a different philosophical aspect of P. The comparison concerns their explanatory focus and limitations, not three competing versions of what happened.</p><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Philosophical approach</th><th scope="col">Central concern</th><th scope="col">Application to P</th><th scope="col">Relevant limitation</th></tr></thead><tbody><tr><td>Correspondence</td><td>Whether a proposition agrees with the reality it describes.</td><td>P is true if Mara Vale actually removed the Aster Notebook from its display cabinet before 18:00 on 14 May.</td><td>The account identifies a relationship between truth and reality but does not itself provide a complete method for investigating what occurred.</td></tr><tr><td>Coherence</td><td>How a proposition fits within a systematic, mutually supporting set of beliefs or propositions.</td><td>Consider how P relates to claims about Mara&#39;s authorised access, the available testimony and the distinction between the Archive Room door and the wider corridor.</td><td>A system of beliefs may be internally coherent yet fail to describe reality accurately. Coherence is more demanding than a merely plausible story.</td></tr><tr><td>Pragmatic approaches</td><td>The relationships among enquiry, experience, practical consequences and justified assertion: Peirce emphasises sustained correction, James experiential verification, and Dewey warranted assertibility.</td><td>Keep interpretations open to correction, examine the experiential implications of P, and distinguish conclusions supported by competent enquiry from those that remain uncertain.</td><td>Practical success, useful hypotheses and current investigative warrant must not be treated automatically as proof of truth.</td></tr></tbody></table></div><dl><div><dt>Accessible text</dt><dd>Correspondence concerns whether a proposition matches reality. For P, the question is whether Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May. Correspondence identifies what the truth of the proposition depends upon, but it does not provide a complete investigative procedure for establishing what happened.

Coherence concerns the systematic relationships among beliefs or propositions. For P, investigators can examine how claims about Mara&#39;s access, witness testimony and the difference between the Archive Room and corridor fit together. A coherent account requires more than a plausible narrative, and even a systematically coherent set of beliefs may fail to correspond to reality.

Pragmatic approaches concern enquiry, experience and practical consequences. Peirce highlights sustained correction of belief, James the experiential verification and consequences of ideas, and Dewey the conditions under which enquiry warrants assertion. Applied to P, these perspectives illuminate how investigators test and qualify beliefs. A useful hypothesis, successful line of enquiry or currently warranted conclusion is not automatically a guarantee of truth.</dd></div></dl><p>Checking a door log, comparing testimony and testing hypotheses are investigative procedures. Correspondence, coherence and pragmatic approaches are philosophical perspectives that help explain what truth, consistency and warranted belief involve. They are not interchangeable procedures, and they do not alter the historical event described by P.</p></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c5--exposition-S7" data-section-id="S7" data-expository-section-role="terminal-close" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">What the comparison allows us to conclude</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation" data-expository-closure="terminal"><p>The investigation at Bellwether now illustrates several different questions that can easily become confused.</p><p>One question concerns truth: did Mara remove the notebook from its display cabinet before the specified time? Another concerns evidence: what information is available about that event? A third concerns justification: how strongly does the available information support accepting P? Further questions concern certainty, the practical value of an investigative hypothesis and the reliability of the methods used to examine it.</p><p>These questions are related, but answering one does not automatically answer the others. An investigator may have useful reasons to pursue P without knowing that it is true. A set of claims may fit together coherently without accurately describing reality. A conclusion may be responsibly asserted on the basis of competent enquiry while remaining open to revision.</p><p>Correspondence, coherence and pragmatic approaches help explain these different relationships. Their central concerns are not interchangeable, and their limitations do not require the conclusion that all philosophical theories are equally satisfactory or that no justified judgement is possible. Instead, the comparison provides a more precise vocabulary for examining what an investigator knows, what remains uncertain and what further enquiry could establish.</p><p>The Bellwether evidence remains as it was at the start of this resource. The difference between the electronic door log and Elias&#39;s written note requires careful interpretation, but it does not settle P. The contents of the grey case have not been established, and a claim about removal must not be silently converted into an allegation of theft.</p><p>In &quot;The case changes: Evidence or interpretation?&quot;, these distinctions will help you consider how further information may affect what investigators are justified in believing. A change in the evidence can change the strength of a judgement; it does not change what happened on 14 May.</p><p>The philosophical comparison therefore ends without a verdict. Its conclusion is a more discriminating understanding of truth and enquiry: propositions have truth conditions, beliefs can be supported or corrected, enquiry can be productive without guaranteeing truth, and philosophical theories illuminate different aspects of these relationships. That understanding makes it possible to evaluate competing explanations more carefully without mistaking confidence, coherence or convenience for proof.</p></div></section></section></article></template><template id="lj-resource-c6"><article class="util-learner-page util-page util-learner-renderer-vnext" data-renderer="vnext" data-page-kind="interactive" data-persistence-page-key="v1::b6dac91d-5f02-4db8-8241-57f43abc7f99::learner-page::2.0.0::a1-a2-a3::the-case-changes:-evidence-or-interpretation" data-persistence-storage-key="learner-renderer-vnext:draft:v1::b6dac91d-5f02-4db8-8241-57f43abc7f99::learner-page::2.0.0::a1-a2-a3::the-case-changes:-evidence-or-interpretation" data-composition-mode="moments" data-composed-activity-count="3" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">The case changes: Evidence or interpretation?</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="5"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 5"><span class="util-journey-position__visible" aria-hidden="true">1 of 5</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c6--activity-A1" aria-label="Next section: New clues, changing interpretations"><span class="util-journey-adjacent__title">New clues, changing interpretations</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c6--journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#lj-c6--activity-A1">New clues, changing interpretations</a></li><li><a class="util-journey-all-link" href="#lj-c6--activity-A2">What can the evidence establish?</a></li><li><a class="util-journey-all-link" href="#lj-c6--activity-A3">Truth, justification and changing evidence</a></li><li><a class="util-journey-all-link" href="#lj-c6--journey-study-tips">Study tips</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c6/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="lj-c6--journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>Detective Ada Mercer has received further information about the missing Aster Notebook at the fictional Bellwether Institute. The central question concerns what happened before 18:00 on 14 May 2026, and how investigators should interpret the evidence available to them.</p><p>Begin with the new disclosures, then evaluate the combined evidence and consider what the investigation reveals about truth and justification. Work through the three activities in order, completing your own responses before revealing the explanatory feedback. You may consult your earlier case notes, but you will not be asked to reconsider your original personal judgement until a later resource.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>This encounter develops the reasoning needed to distinguish a newly available fact from a revised interpretation, evaluate the strength and limitations of evidence, and explain why a person&#39;s justification for believing a proposition can change without changing what would make that proposition true.</p><p>The emphasis is on defensible reasoning: identifying sources, distinguishing observation from inference, recognising uncertainty and applying philosophical ideas without treating them as substitutes for evidence.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><h3 class="util-md-heading util-md-heading--source-2">Truth, belief and justification</h3><p>A proposition is a claim that can be true or false. Its truth concerns whether things are as the proposition states. A belief is someone&#39;s acceptance of a proposition. Justification concerns the reasons available for accepting it. These are related but distinct: people may believe something without adequate justification, and the evidence supporting a belief may change as an investigation develops.</p><p>The proposition examined in this resource is: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot; Keep its wording fixed while examining the sources. A claim about removal is not identical to a claim about theft or dishonest intention. Each requires evidence appropriate to what it asserts.</p><h3 class="util-md-heading util-md-heading--source-2">Evidence and interpretation</h3><p>Evidence includes observations, records, testimony and other information that may bear on a claim. A source&#39;s content is not necessarily the same as the conclusion drawn from it. A witness might observe someone carrying a case without knowing its contents. An investigator could use that observation alongside other information to develop an interpretation, but the additional reasoning must remain identifiable.</p><p>New evidence introduces information that was not previously available. Reinterpretation changes the significance assigned to information already known. New evidence may prompt reinterpretation, but the two are not interchangeable. When comparing sources, identify what each actually records before considering what their combination might support.</p><h3 class="util-md-heading util-md-heading--source-2">Evaluating evidential strength</h3><p>A useful distinction separates what is directly established by an observation, what is strongly supported through inference, and what remains uncertain or unestablished. Direct observation is limited to what was actually observed. An inference extends beyond those observations through reasoning. Several relevant sources may corroborate one another, strengthening an inference without making every associated detail certain.</p><p>Source reliability, timing, attribution, consistency and scope all matter. An apparent discrepancy may call for closer examination of what was observed, where it happened and how it was recorded. Agreement between sources can strengthen an interpretation, but a coherent account should not be mistaken for independent verification of every claim within it.</p><p>Consider a separate example: a laboratory technician records that a sample container was sealed at 10:00, and another technician observes it sealed at 11:00. The observations provide information about the container at those times. They do not, without further evidence, directly establish every event between the observations. This distinction between recorded information and inferred history also matters in the notebook investigation.</p><h3 class="util-md-heading util-md-heading--source-2">Three philosophical approaches</h3><p>Correspondence approaches, associated with Aristotle and Bertrand Russell, concern whether a proposition matches reality. The evidence used to assess a proposition is not identical to the reality that determines whether it is true.</p><p>Coherence approaches, associated with F. H. Bradley and idealist traditions, consider systematic relationships among beliefs or propositions. Coherence involves more than constructing a plausible story, and the possibility of competing coherent accounts creates questions about how their claims should be assessed.</p><p>Pragmatic approaches, associated with Charles Sanders Peirce, William James and John Dewey, emphasise enquiry, experience and the consequences of testing beliefs. They should not be reduced to the claim that whatever is convenient must be true.</p><p>These approaches offer different ways of thinking about truth and enquiry. As you investigate, use them to clarify the relationship between a proposition, the evidence available for it and the reasons an investigator may have for believing it. The activities will ask you to develop and test those connections using the case itself.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c6/knowledge-summary-after-content.png" alt="Concept map separating truth conditions from evidence, interpretation and justification; detailed description follows." aria-describedby="lj-c6--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> How propositions, evidence, belief and justification relate without becoming interchangeable.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c6--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">The map distinguishes two connected areas. One concerns a proposition and the reality to which its truth conditions refer. The other concerns evidence, interpretation, justification and an investigator&#39;s belief. Evidence informs interpretation and can provide reasons for belief, but it does not alter the historical state of affairs. Three philosophical perspectives are identified separately: correspondence considers propositions and reality; coherence considers systematic relationships among beliefs or propositions; pragmatic approaches consider enquiry, experience and testing. No case-specific conclusions appear.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Distinguish newly disclosed evidence from reinterpretations of previously available evidence in the Aster Notebook investigation, explaining how each can affect the assessment of a proposition. <span class="util-outcome-id">(LO1)</span></li><li>Evaluate the combined evidence relating to proposition P, distinguishing what individual sources establish, what the evidence strongly supports and what remains uncertain. <span class="util-outcome-id">(LO2)</span></li><li>Explain how new evidence can change the justification for a belief without changing the truth conditions of the proposition, using at least one philosophical approach to support the analysis. <span class="util-outcome-id">(LO3)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="lj-c6--journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="lj-c6--activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">New clues, changing interpretations</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Distinguish newly disclosed evidence from reinterpretations of earlier observations.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The enquiry has already distinguished a proposition from the evidence offered for it and examined a discrepancy between testimony and a door record. This activity uses that foundation to separate genuinely new information from changes in the significance of earlier observations.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Detective Ada Mercer has received new information about the Aster Notebook. The central proposition remains: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot; If you completed &quot;The case opens: Your first judgement&quot; and &quot;A witness, a record and a contradiction&quot;, revisit your own notes about the original evidence and the witness-record discrepancy. Use those notes to identify what was already available and what the new disclosures might change. Draw on the philosophical distinctions developed in &quot;What makes a claim true?&quot;, &quot;Reality and coherence: Two accounts of truth&quot; and &quot;Pragmatism and the problem of competing theories&quot;. You do not need to change your earlier judgement here.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Treat each source as evidence with a particular origin and content. Distinguish information that has become newly available from an inference that changes because of it. Do not assume that an interpretation is itself a newly discovered fact.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which part of your analysis comes directly from a source, and which part is your inference about what that source means?</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c6--learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="lj-c6--learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="lj-c6--learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c6--learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c6--learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="lj-c6--learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c6--learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a1-evidence-interpretation-01-activity-a1-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c6/activity-a1-materials-entry.png" alt="Contrast between a recorded temperature observation and a possible interpretation; detailed description follows." aria-describedby="lj-c6--figure-description-asset-vb-38-4-va-a1-evidence-interpretation-01-activity-a1-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 2.</strong> A recorded observation and an interpretation of it are different kinds of claim.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c6--figure-description-asset-vb-38-4-va-a1-evidence-interpretation-01-activity-a1-materials-entry">Two linked areas distinguish source information from interpretation. The first identifies a room-temperature observation recorded by an instrument. The second presents a possible explanation concerning the room&#39;s environmental conditions. A connection shows that the recorded observation may inform the explanation, while a qualification states that further information is needed to establish its cause. The figure does not use any Aster Notebook evidence or supply an answer to the learner&#39;s comparison table.</p></figure><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A1-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated case dossier: The new disclosures</span></p><h3 class="util-md-heading util-md-heading--source-2">Bellwether Institute: Aster Notebook investigation</h3><p>This is a fictional, simulated evidence dossier. The information is presented as records, statements and observations. Read the sources before drawing conclusions about what they mean.</p><p>The proposition under investigation is: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot;</p><h3 class="util-md-heading util-md-heading--source-3">Part 1: Evidence available earlier</h3><table><thead><tr><th>Source</th><th>Recorded information</th></tr></thead><tbody><tr><td>Dr Rowan Bell, cabinet checks</td><td>Dr Bell confirmed that the Aster Notebook was in its display cabinet at 16:40 on 14 May 2026. At 18:20, Dr Bell found the cabinet empty.</td></tr><tr><td>Access information</td><td>Mara Vale had authorised access to the Archive Room.</td></tr><tr><td>Elias Reed, security officer</td><td>Elias reported seeing Mara leaving the wider archive corridor at approximately 17:25 carrying a rectangular grey case. His original written note described her as leaving the &quot;Archive Room&quot; at 17:25.</td></tr><tr><td>Electronic Archive Room door log</td><td>The log records Mara exiting the Archive Room at 17:21. The Archive Room and the wider archive corridor are different locations.</td></tr><tr><td>Mara Vale, earlier statement</td><td>Mara denied stealing the notebook.</td></tr><tr><td>Nina Shah, witness</td><td>Nina reported seeing an unidentified person in a dark jacket at approximately 17:32. She did not reliably identify that person.</td></tr><tr><td>Initial case status</td><td>The notebook&#39;s whereabouts had not yet been established. The earlier observation of a grey case did not identify its contents.</td></tr></tbody></table><h3 class="util-md-heading util-md-heading--source-3">Part 2: Four newly disclosed items</h3><p>These four items are being disclosed to you for the first time in this activity.</p><h3 class="util-md-heading util-md-heading--source-4">New item 1: Conservation preparation record</h3><p>Source: Bellwether Institute conservation preparation record, created at 17:16 on 14 May 2026, bearing Mara Vale&#39;s staff identifier.</p><p>&gt; Aster Notebook transferred to protective case; secure preparation room pending humidity review.</p><h3 class="util-md-heading util-md-heading--source-4">New item 2: Internal message</h3><p>Source: Message sent by Mara Vale to Dr Rowan Bell at 17:40 on 14 May 2026.</p><p>&gt; Moved Aster for protection. Will explain when we speak.</p><h3 class="util-md-heading util-md-heading--source-4">New item 3: Environmental information</h3><p>Source: Dr Rowan Bell&#39;s subsequent confirmation.</p><p>Dr Bell confirmed that the Archive Room had experienced an unusual humidity reading earlier that afternoon.</p><h3 class="util-md-heading util-md-heading--source-4">New item 4: Recovery observation</h3><p>Source: Record of the notebook&#39;s recovery on 15 May 2026.</p><p>At 08:15 the following morning, the Aster Notebook was found undamaged inside its protective case in the secure preparation room.</p><h3 class="util-md-heading util-md-heading--source-3">Your investigation</h3><p>Compare the newly disclosed source content with what was already known. For each earlier observation in the next table, identify a relevant new detail and explain how it might affect interpretation. A source&#39;s words, an observed event and your inference about either are not the same thing.</p></article><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a1-a1-m2" data-material-source-id="A1-M2" data-activity-id="A1"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A1-M2" data-material-type="analysis_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">New evidence or revised interpretation?</span></p><p class="util-learner-table-workspace__guidance">Enter your responses in the table below. Your draft is saved on this device when possible. It is not submitted.</p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="lj-c6--a1-a1-m2-col-earlier-observation-0">Earlier observation</th><th scope="col" id="lj-c6--a1-a1-m2-col-newly-disclosed-source-detail-1">Newly disclosed source detail</th><th scope="col" id="lj-c6--a1-a1-m2-col-what-this-changes-in-my-interpretation-2">What this changes in my interpretation</th></tr></thead><tbody><tr><th scope="row" id="lj-c6--a1-a1-m2-row-0" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Elias&#39;s observation of a grey case</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c6--a1-a1-m2-input-r0-c1" name="a1-a1-m2-input-r0-c1" data-learner-cell="a1-a1-m2-input-r0-c1" rows="3" aria-labelledby="lj-c6--a1-a1-m2-row-0 lj-c6--a1-a1-m2-col-newly-disclosed-source-detail-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c6--a1-a1-m2-input-r0-c2" name="a1-a1-m2-input-r0-c2" data-learner-cell="a1-a1-m2-input-r0-c2" rows="3" aria-labelledby="lj-c6--a1-a1-m2-row-0 lj-c6--a1-a1-m2-col-what-this-changes-in-my-interpretation-2" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="lj-c6--a1-a1-m2-row-1" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Mara&#39;s earlier denial of theft</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c6--a1-a1-m2-input-r1-c1" name="a1-a1-m2-input-r1-c1" data-learner-cell="a1-a1-m2-input-r1-c1" rows="3" aria-labelledby="lj-c6--a1-a1-m2-row-1 lj-c6--a1-a1-m2-col-newly-disclosed-source-detail-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c6--a1-a1-m2-input-r1-c2" name="a1-a1-m2-input-r1-c2" data-learner-cell="a1-a1-m2-input-r1-c2" rows="3" aria-labelledby="lj-c6--a1-a1-m2-row-1 lj-c6--a1-a1-m2-col-what-this-changes-in-my-interpretation-2" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="lj-c6--a1-a1-m2-row-2" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">The notebook&#39;s previously unknown whereabouts</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c6--a1-a1-m2-input-r2-c1" name="a1-a1-m2-input-r2-c1" data-learner-cell="a1-a1-m2-input-r2-c1" rows="3" aria-labelledby="lj-c6--a1-a1-m2-row-2 lj-c6--a1-a1-m2-col-newly-disclosed-source-detail-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c6--a1-a1-m2-input-r2-c2" name="a1-a1-m2-input-r2-c2" data-learner-cell="a1-a1-m2-input-r2-c2" rows="3" aria-labelledby="lj-c6--a1-a1-m2-row-2 lj-c6--a1-a1-m2-col-what-this-changes-in-my-interpretation-2" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>Three concise, evidence-referenced comparisons that accurately identify newly disclosed information, distinguish it from an interpretation of previously available evidence, and explain the reasoning connecting the two. The response should preserve uncertainty where an inference goes beyond what a source directly records.</p></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c6--learner-check-a1" data-check-sidebar-open aria-controls="lj-c6--learner-check-a1" aria-expanded="false" aria-label="Check your work: New clues, changing interpretations">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c6--learner-check-a1" data-composition-moment="check" data-activity-id="A1" data-check-sidebar="available" aria-labelledby="lj-c6--learner-check-a1-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c6--learner-check-a1-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c6--learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c6--learner-task-a1">Back to your task (New clues, changing interpretations)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Read the four newly disclosed items and the short reminder of the earlier evidence. For each of three supplied comparisons, identify the newly available information and explain how it might change the interpretation of an earlier observation. Refer to the relevant source details. Do not decide whether to revise your original judgement.</p></span></div><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M3" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m3" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m3-c-0" data-revision-criterion-id="a1-m3-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you identified genuinely new source information in each comparison?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>If an earlier observation or your own inference is presented as a new disclosure, the comparison cannot distinguish a change in available evidence from a change in interpretation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each middle-column entry identifies information from one of the four newly disclosed items.</li><li><span class="util-guided-review__feature-key">B.</span> The source detail is recognisable through its wording, time, attribution or observed particulars.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Locate the conservation record, internal message, humidity confirmation or recovery observation and identify a specific detail that was not available in the earlier evidence.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Add the relevant source and a distinctive feature, such as a recorded time, quoted phrase or recovery location, rather than a general claim about the case.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c6--checklist-a1-a1-m3-item-0" data-checklist-item-id="checklist-a1-a1-m3-item-0"><label class="util-interactive-checklist__label" for="lj-c6--checklist-a1-a1-m3-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c6--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m3-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m3-c-1" data-revision-criterion-id="a1-m3-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you separated what a source says from what you infer?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Conflating records with conclusions can make an interpretation appear to have the authority of a direct observation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The middle column reports source content rather than asserting a conclusion about its meaning.</li><li><span class="util-guided-review__feature-key">B.</span> The final column identifies an inference as a possible or supported interpretation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Move statements about motive, case contents or credibility into the interpretation column and retain only the source&#39;s reported information in the middle column.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain the reasoning connecting the new detail to the interpretation, using language that reflects whether the conclusion is observed or inferred.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c6--checklist-a1-a1-m3-item-1" data-checklist-item-id="checklist-a1-a1-m3-item-1"><label class="util-interactive-checklist__label" for="lj-c6--checklist-a1-a1-m3-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c6--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m3-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m3-c-2" data-revision-criterion-id="a1-m3-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you explained how each new detail relates to the specific earlier observation?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An isolated source detail does not show why an investigator might understand earlier evidence differently.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each final-column explanation explicitly refers back to its earlier observation.</li><li><span class="util-guided-review__feature-key">B.</span> Each explanation identifies the change in interpretation rather than merely repeating the new source.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the earlier grey-case sighting, denial of theft or uncertainty about whereabouts and explain the relevance of the new detail to that observation.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Add a reasoning step describing how the new information affects the significance of the earlier observation.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c6--checklist-a1-a1-m3-item-2" data-checklist-item-id="checklist-a1-a1-m3-item-2"><label class="util-interactive-checklist__label" for="lj-c6--checklist-a1-a1-m3-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c6--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m3-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m3-c-3" data-revision-criterion-id="a1-m3-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you recognised what the evidence still does not directly establish?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An interpretation becomes overstated if it treats an unobserved case contents, intention or sequence as directly verified.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The grey-case comparison does not assume that Elias saw what was inside the case.</li><li><span class="util-guided-review__feature-key">B.</span> Claims about Mara&#39;s intention distinguish her stated reason from independently observed behaviour.</li><li><span class="util-guided-review__feature-key">C.</span> The recovery observation is not treated as direct observation of every earlier movement.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Distinguish Elias&#39;s observation of the case from any inference about its contents.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify whether your claim relies on Mara&#39;s own message, the humidity information or another source, and qualify what those sources can establish.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Separate the notebook&#39;s observed location the following morning from inferences about the route and actions that preceded recovery.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c6--checklist-a1-a1-m3-item-3" data-checklist-item-id="checklist-a1-a1-m3-item-3"><label class="util-interactive-checklist__label" for="lj-c6--checklist-a1-a1-m3-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c6--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m3-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Review the example response</summary><div class="util-composition-reveal__body"><article class="util-material-block util-sample-output util-prose-measure" data-material-id="A1-M4" data-material-type="sample_output" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><span class="util-semantic-icon__label">Reveal after your comparison: How the evidence changes</span></p><h3 class="util-md-heading util-md-heading--source-3">Review after completing your table</h3><p>These comparisons illustrate one defensible analysis. Your wording may differ if you make the same distinctions and support your reasoning from the sources.</p><table><thead><tr><th>Earlier observation</th><th>New source information</th><th>Reasoned reinterpretation</th></tr></thead><tbody><tr><td>Elias saw Mara carrying a rectangular grey case at approximately 17:25.</td><td>A conservation record created at 17:16 describes the Aster Notebook being transferred to a protective case. The notebook was later recovered inside its protective case.</td><td>The earlier grey-case observation can now be considered alongside records of protective handling. It is more plausible that the observation relates to conservation activity than it appeared from the sighting alone. However, Elias did not identify the case&#39;s contents, and the sources do not directly establish that the case he saw was the recovered protective case.</td></tr><tr><td>Mara denied theft.</td><td>Her 17:40 message says, &quot;Moved Aster for protection. Will explain when we speak.&quot; Dr Bell also confirmed an unusual humidity reading.</td><td>The denial can now be interpreted in light of a stated protective purpose and a reported environmental concern. These details offer context for her statement; they do not make her account automatically infallible or turn a claim about intention into a directly observed fact.</td></tr><tr><td>The notebook&#39;s whereabouts were unknown.</td><td>The recovery record places the notebook undamaged inside its protective case in the secure preparation room at 08:15 the following morning.</td><td>The notebook&#39;s location and condition at recovery are now known. This changes how the earlier empty cabinet might be understood, but the recovery observation alone does not directly record every action that took place on the previous afternoon.</td></tr></tbody></table><h3 class="util-md-heading util-md-heading--source-3">A further distinction: Room and corridor</h3><p>The electronic log records Mara leaving the Archive Room at 17:21, while Elias&#39;s original note says &quot;Archive Room&quot; at 17:25. His account concerns a sighting in the wider archive corridor. Distinguishing the room from the corridor allows a possible explanation of the different times without requiring the conclusion that either source was deliberately falsified. The distinction does not make the sources identical or remove the need to examine their reliability.</p><h3 class="util-md-heading util-md-heading--source-3">Debrief</h3><p>New evidence is additional information that was not previously available. Reinterpretation is a change in what an investigator reasonably takes existing information to mean. The two can occur together, but they are not interchangeable. This activity is about analysing that relationship, not yet about revising your own earlier judgement.</p></article></div></details></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c6--activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">What can the evidence establish?</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Evaluate what the combined evidence directly establishes, strongly supports or does not establish.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The distinctions made between new information and reinterpretation now provide the basis for judging the evidential strength of different claims. This activity moves from identifying changes in meaning to weighing what the combined sources justify.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>The new disclosures now sit alongside the earlier testimony and door record. Your task is to evaluate the strength of the combined evidence without treating every supported inference as an established fact.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Use three standards: what a source directly establishes, what the combined evidence strongly supports, and what remains uncertain. Evaluate each claim on its own terms, particularly where an action and an alleged intention are different propositions.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which conclusion can you defend most strongly, and what prevents you from making a stronger claim?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A2"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Examine the evidence dossier and the three candidate claims in the decision card. For each claim, judge whether it is directly established by the available observations, strongly supported through inference, or not established on the available evidence. Justify each classification using at least one source detail and identify a relevant limitation.</p></span></div></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c6--learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="lj-c6--learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="lj-c6--learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c6--learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c6--learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="lj-c6--learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c6--learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Write a brief overall assessment of the evidential support for proposition P, keeping removal separate from theft or dishonest intention.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A2-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated consolidated evidence dossier</span></p><h3 class="util-md-heading util-md-heading--source-2">Bellwether Institute: Evidence available for evaluation</h3><p>This is a fictional, simulated dossier. It brings together the evidence already disclosed; it does not introduce further case events. Evaluate each claim against what the sources actually record.</p><table><thead><tr><th>Source</th><th>Directly available record, statement or observation</th></tr></thead><tbody><tr><td>Dr Rowan Bell, cabinet checks</td><td>The Aster Notebook was present in its display cabinet at 16:40 on 14 May 2026. Dr Bell found the cabinet empty at 18:20.</td></tr><tr><td>Access information</td><td>Mara Vale had authorised access to the Archive Room.</td></tr><tr><td>Elias Reed, security officer</td><td>Elias reported seeing Mara leaving the wider archive corridor at approximately 17:25 carrying a rectangular grey case. His original written note said she was leaving the &quot;Archive Room&quot; at 17:25. He did not identify the case&#39;s contents.</td></tr><tr><td>Electronic Archive Room door log</td><td>The recorded time of Mara&#39;s exit from the Archive Room was 17:21. The room and wider archive corridor are distinct locations.</td></tr><tr><td>Mara Vale, earlier statement</td><td>Mara denied stealing the notebook.</td></tr><tr><td>Nina Shah, witness</td><td>Nina reported an unidentified person in a dark jacket at approximately 17:32; she did not reliably identify that person.</td></tr><tr><td>Conservation preparation record</td><td>Created at 17:16 on 14 May 2026, bearing Mara&#39;s staff identifier: &quot;Aster Notebook transferred to protective case; secure preparation room pending humidity review.&quot;</td></tr><tr><td>Mara Vale, internal message to Dr Rowan Bell</td><td>Sent at 17:40 on 14 May 2026: &quot;Moved Aster for protection. Will explain when we speak.&quot;</td></tr><tr><td>Dr Rowan Bell, environmental confirmation</td><td>Dr Bell confirmed an unusual humidity reading in the Archive Room earlier that afternoon.</td></tr><tr><td>Recovery observation</td><td>At 08:15 on 15 May 2026, the Aster Notebook was found undamaged inside its protective case in the secure preparation room.</td></tr></tbody></table><p>The contents of records and statements are evidence to evaluate. Their existence does not make every claim within them independently verified. Likewise, an observation of the notebook&#39;s later location does not directly show every preceding action.</p></article><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a2-a2-m3" data-material-source-id="A2-M3" data-activity-id="A2"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A2-M3" data-material-type="decision_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Evaluate the strength of the evidence</span></p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="lj-c6--a2-a2-m3-col-claim-0">Claim</th><th scope="col" id="lj-c6--a2-a2-m3-col-evidential-status-1">Evidential status</th><th scope="col" id="lj-c6--a2-a2-m3-col-supporting-source-detail-2">Supporting source detail</th><th scope="col" id="lj-c6--a2-a2-m3-col-limitation-or-uncertainty-3">Limitation or uncertainty</th></tr></thead><tbody><tr><th scope="row" id="lj-c6--a2-a2-m3-row-0" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Claim 1 — The notebook was found undamaged in the secure preparation room at 08:15 on 15 May.</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c6--a2-a2-m3-input-r0-c1" name="a2-a2-m3-input-r0-c1" data-learner-cell="a2-a2-m3-input-r0-c1" rows="3" aria-labelledby="lj-c6--a2-a2-m3-row-0 lj-c6--a2-a2-m3-col-evidential-status-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c6--a2-a2-m3-input-r0-c2" name="a2-a2-m3-input-r0-c2" data-learner-cell="a2-a2-m3-input-r0-c2" rows="3" aria-labelledby="lj-c6--a2-a2-m3-row-0 lj-c6--a2-a2-m3-col-supporting-source-detail-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c6--a2-a2-m3-input-r0-c3" name="a2-a2-m3-input-r0-c3" data-learner-cell="a2-a2-m3-input-r0-c3" rows="3" aria-labelledby="lj-c6--a2-a2-m3-row-0 lj-c6--a2-a2-m3-col-limitation-or-uncertainty-3" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="lj-c6--a2-a2-m3-row-1" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Claim 2 — Mara removed the notebook from its display cabinet before 18:00 on 14 May.</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c6--a2-a2-m3-input-r1-c1" name="a2-a2-m3-input-r1-c1" data-learner-cell="a2-a2-m3-input-r1-c1" rows="3" aria-labelledby="lj-c6--a2-a2-m3-row-1 lj-c6--a2-a2-m3-col-evidential-status-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c6--a2-a2-m3-input-r1-c2" name="a2-a2-m3-input-r1-c2" data-learner-cell="a2-a2-m3-input-r1-c2" rows="3" aria-labelledby="lj-c6--a2-a2-m3-row-1 lj-c6--a2-a2-m3-col-supporting-source-detail-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c6--a2-a2-m3-input-r1-c3" name="a2-a2-m3-input-r1-c3" data-learner-cell="a2-a2-m3-input-r1-c3" rows="3" aria-labelledby="lj-c6--a2-a2-m3-row-1 lj-c6--a2-a2-m3-col-limitation-or-uncertainty-3" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="lj-c6--a2-a2-m3-row-2" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Claim 3 — Mara stole the notebook or acted with dishonest intention.</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--e
