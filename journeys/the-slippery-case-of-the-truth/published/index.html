ditorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c7/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-assessment-intro" data-region="assessment-intro" data-journey-section="true"><p>At the Bellwether Institute, the investigation of the missing Aster Notebook has developed since you first considered the evidence. This short formative assessment invites you to examine your own reasoning: what you initially judged, what you now judge, and why. You do not have to change your conclusion to demonstrate genuine reconsideration. The quality of your explanation matters more than whether your position has changed.</p><p>Allow approximately 9 minutes for this activity.

1. Spend about 2 minutes revisiting your initial judgement and considering the later evidence and philosophical distinctions.
2. Spend about 5 minutes writing one reflection of approximately 180–250 words. Compare your initial and current judgements, explain the developments that influenced your reasoning, and justify your position using relevant evidence and philosophical ideas.
3. Spend about 2 minutes reviewing your response against Conceptual accuracy, Evidential support and Genuine reconsideration. Refine the existing response if you identify a gap.

You may maintain, revise or qualify your initial conclusion. There is no automatic grade or single required personal response. Your constructed reflection contributes to your Learning Journal, so you do not need to write a separate journal entry.</p></section><section class="util-assessment-guidance util-assessment-section" data-region="assessment" id="lj-c7--journey-assessment" data-journey-section="true" data-assessment-product="assessment_pack" data-feedback-timing="per_component"><section class="util-assessment-orientation" data-region="assessment-orientation" id="lj-c7--journey-assessment-briefing" data-journey-section="true"><h3>What to bring with you</h3><ul><li><p>If you completed &#39;The case opens: Your first judgement&#39;, revisit your own initial judgement of whether Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May, including your strongest reason and any uncertainty. If you cannot consult your original response, identify what you can recall rather than treating your recollection as an exact record.</p><p>Use that earlier judgement as the starting point for comparing your original and current reasoning. Draw on your analysis in &#39;The case changes: Evidence or interpretation?&#39; and relevant distinctions from &#39;What makes a claim true?&#39;, &#39;Reality and coherence: Two accounts of truth&#39; and &#39;Pragmatism and the problem of competing theories&#39; to explain what has changed, what remains defensible and why.</p></li></ul></section><article id="journey-assessment-judgement" class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" data-elicitation-id="E1" data-journey-section="true"><h3>Reconsidering your judgement</h3><p>Reconsider the fictional Bellwether Institute investigation. The proposition remains: P: &#39;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&#39; This is a claim about removal, not necessarily theft or dishonest intention. Initially, the notebook was known to have been present at 16:40 and its cabinet was found empty at 18:20. Mara had authorised access. Elias Reed reported seeing her leaving the archive corridor at approximately 17:25 carrying a rectangular grey case, although its contents were unknown. Mara said she was dealing with conservation preparations and had not stolen the notebook. Nina Shah could not identify the person she saw near the corridor. A subsequent electronic door log recorded Mara leaving the Archive Room at 17:21, whereas Elias&#39;s written note described her leaving the Archive Room at 17:25; the distinction between the room and the wider corridor matters when interpreting that discrepancy. Later, a conservation preparation record created at 17:16, bearing Mara&#39;s staff identifier, stated: &#39;Aster Notebook transferred to protective case; secure preparation room pending humidity review.&#39; Mara&#39;s 17:40 message to Dr Rowan Bell stated: &#39;Moved Aster for protection. Will explain when we speak.&#39; Dr Bell confirmed an unusual humidity reading, and the notebook was found undamaged in the secure preparation room at 08:15 the following morning. These later records and observations strongly support an account of the notebook&#39;s movement but should still be assessed as evidence rather than treated as logically infallible guarantees. Consider what the evidence warrants about P without automatically extending that judgement to theft.</p><p>You have now considered additional evidence about the Aster Notebook and different philosophical approaches to truth. Your task is to examine how your own judgement has developed, rather than to produce a predetermined verdict.</p><p>Write a reflection on proposition P: &#39;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&#39; Begin with the judgement you originally made, or what you can reliably recall of it. State whether you now maintain, revise or qualify that conclusion, and explain why. Compare your earlier and current reasons using specific evidence from the investigation. Distinguish the influence of new evidence, reinterpretation of existing evidence, recognised assumptions and conceptual development; explain which of these genuinely affected your reasoning rather than claiming that all four necessarily did. Apply at least one relevant philosophical approach or distinction to clarify your judgement. Keep the question of removal separate from the allegation of theft.</p><p>Produce one coherent reflection that identifies your earlier position, explains your current position, evaluates relevant evidence and makes your reasoning visible. An unchanged conclusion is entirely acceptable if you can explain why it remains defensible. Use the criteria Conceptual accuracy, Evidential support and Genuine reconsideration when reviewing your response. This same reflection contributes to your Learning Journal; no separate journal entry is needed.</p><p>Approximately 180–250 words.</p><p>Approximately 5 minutes to draft, within a 9-minute activity that also includes reviewing your earlier judgement and self-review.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-E1" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c7--assessment-constructed-E1">Your response</label><p>Write in connected prose. Make your earlier and current reasons explicit, identify the developments that mattered to you, and use the three named criteria to check your draft before finishing.</p><textarea class="util-learner-workspace__input" id="lj-c7--assessment-constructed-E1" name="assessment-constructed-E1" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="lj-c7--assessment-constructed-E1-review">Review your response</button></p><div id="lj-c7--assessment-constructed-E1-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="E1-FR1"><h4>Conceptual accuracy</h4><p>Read your reflection and check whether you have kept the proposition about removal separate from any allegation of theft or dishonest intention. Have you distinguished what would make P true from what the available evidence justifies you in believing? If you have used correspondence, coherence or a pragmatic approach, check that you have applied it accurately: correspondence concerns propositions and reality; coherence concerns systematic relationships among beliefs or propositions; pragmatic approaches emphasise enquiry, experience and practical consequences rather than convenience. You do not need to use every approach. A useful revision would clarify any sentence that treats evidence as identical to truth, assumes certainty, or moves from removal to theft without separate justification.</p></article><article class="util-formative-material" data-material-id="E1-FR2"><h4>Evidential support</h4><p>Identify the evidence supporting your main conclusion and explain what each selected detail contributes. The 17:16 conservation preparation record, Mara&#39;s 17:40 message, the humidity concern and the notebook&#39;s recovery provide substantial evidence about its movement, but no single record should be treated as logically infallible. Consider whether you have interpreted the 17:21 Archive Room door log and Elias&#39;s 17:25 account carefully, distinguishing the room from the wider corridor. Check that you have not assumed the contents of the grey case were established by the initial testimony. If a claim goes beyond what the evidence warrants, qualify it or explain the remaining uncertainty.</p></article><article class="util-formative-material" data-material-id="E1-FR3"><h4>Genuine reconsideration</h4><p>Compare your opening and closing positions. Can a reader tell what you initially judged, what you judge now and why? Have you explained whether the decisive development was new evidence, a reinterpretation of existing evidence, recognition of an assumption, conceptual development, or a combination? These categories are not interchangeable, and you do not need to claim that all four influenced you. If your conclusion has remained unchanged, show how you reconsidered its justification rather than simply repeating your original claim. If it has changed or become more qualified, explain the reasoning behind that development. If your original response was unavailable, distinguish what you recall from what you can verify.</p></article><article class="util-formative-material" data-material-id="E1-FR4"><h4>Using your self-review</h4><p>Use Conceptual accuracy, Evidential support and Genuine reconsideration as three lenses for reviewing the same reflection. Look for one place where your reasoning is particularly clear and one place that would benefit from greater precision, stronger evidence or a more explicit comparison. You can improve the existing response without changing your conclusion. These criteria guide your judgement of the work; they do not generate an automatic score or determine a single required answer.</p></article></section><section class="util-assessment-revision" data-region="assessment-revision" data-automated-judgement="false"><p class="util-revision-offer" data-revision-offered="true">If your self-review identifies a gap, revise the relevant part of your existing reflection. You might clarify the difference between removal and theft, explain why a particular piece of evidence matters, distinguish new evidence from reinterpretation, or make the comparison with your initial reasoning more explicit. Keep the conclusion you find defensible; revision does not require changing your position.</p><p><a href="#lj-c7--assessment-constructed-E1" data-assessment-return-to-response="assessment-constructed-E1">Return to your response</a></p></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Your reflection now records how your judgement and its justification have developed. It can serve as your Learning Journal contribution and as a starting point for &#39;The philosophical case for your conclusion&#39;, where you can develop the most defensible parts of your reasoning into a sustained argument.</p></section></article><section class="util-pack-forward" data-region="pack-forward" id="lj-c7--journey-assessment-pack-forward" data-journey-section="true"><h2>What to take forward</h2><p>You have completed a formative reconsideration of proposition P by comparing your initial judgement with your current reasoning. The value of the reflection lies in the quality of the comparison, the treatment of evidence and the philosophical distinctions you apply, not in whether you changed your mind. Your constructed response is the contribution to your Learning Journal; no separate journal entry is required. When developing &#39;The philosophical case for your conclusion&#39;, use this reflection to identify the evidence, qualifications and philosophical arguments you can defend most clearly.</p></section></section></article></template><template id="lj-resource-c8"><article class="util-learner-page util-page util-learner-renderer-vnext util-page--assessment" data-renderer="vnext" data-page-kind="assessment" data-persistence-page-key="v1::05012990-aa7e-470f-a5b5-b68e7d46bc4c::learner-page::2.0.0::no-activities::the-philosophical-case-for-your-conclusion" data-persistence-storage-key="learner-renderer-vnext:draft:v1::05012990-aa7e-470f-a5b5-b68e7d46bc4c::learner-page::2.0.0::no-activities::the-philosophical-case-for-your-conclusion" data-composition-mode="moments" data-composed-activity-count="0" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">The philosophical case for your conclusion</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="3"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Briefing</span><p class="util-journey-position" aria-label="Section 1 of 3"><span class="util-journey-position__visible" aria-hidden="true">1 of 3</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c8--journey-assessment-judgement" aria-label="Next section: Judgement"><span class="util-journey-adjacent__title">Judgement</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c8--journey-assessment-briefing" aria-current="location">Briefing</a></li><li><a class="util-journey-all-link" href="#lj-c8--journey-assessment-judgement">Judgement</a></li><li><a class="util-journey-all-link" href="#lj-c8--journey-assessment-pack-forward">Take forward</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c8/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-assessment-intro" data-region="assessment-intro" data-journey-section="true"><p>You have reached the final stage of the fictional Aster Notebook investigation. This formative assessment invites you to bring together the case evidence, philosophical approaches to truth and your own developing judgement. Your aim is not to identify a culprit, but to construct an independent argument about what it means to regard a proposition as true and how belief in it can be justified. You will produce one connected written argument and review it against six criteria: conceptual accuracy, application, comparison, evaluation, justification and reflection. There is no automatic grading of your writing.</p><p>Allow approximately 15 minutes for the complete assessment.

1. Preparation — approximately 2 minutes. Read the final case evidence and consider the reasoning you developed earlier in the Learning Journey. Identify your present position on proposition P and the evidence and philosophical ideas most relevant to defending it.

2. Composition — approximately 10 minutes. Write one coherent philosophical argument of approximately 300–400 words. Address truth, belief, evidence and justification; engage meaningfully with correspondence, coherence and pragmatic approaches; evaluate at least one substantive difference, limitation or objection; apply relevant case evidence; reach a qualified conclusion; and reflect on how your reasoning has developed since your initial judgement.

3. Self-review — approximately 3 minutes. Review your argument using the six criteria: conceptual accuracy, application, comparison, evaluation, justification and reflection. Identify the most useful improvement and revise your argument if you wish.

The assessment is formative. Your response is not automatically judged, scored or graded. Your own completed argument is the contribution to the journey-level Learning Journal.</p></section><section class="util-assessment-guidance util-assessment-section" data-region="assessment" id="lj-c8--journey-assessment" data-journey-section="true" data-assessment-product="assessment_pack" data-feedback-timing="per_component"><section class="util-assessment-orientation" data-region="assessment-orientation" id="lj-c8--journey-assessment-briefing" data-journey-section="true"><h3>What to bring with you</h3><ul><li><p>If you completed &#39;The case opens: Your first judgement&#39; and &#39;Reconsidering your judgement&#39;, revisit your own initial and reconsidered positions, including the reasons and uncertainties you recorded. Draw on your work with the concepts in &#39;What makes a claim true?&#39;, the philosophical comparisons in &#39;Reality and coherence: Two accounts of truth&#39; and &#39;Pragmatism and the problem of competing theories&#39;, and your examination of the complete evidence in &#39;The case changes: Evidence or interpretation?&#39;.</p><p>Use these earlier judgements, concepts and evidence to develop one independent philosophical argument about P. Explain what supports your present position, how the three approaches illuminate or challenge it, and how your reasoning has developed or remained justified since your initial judgement.</p></li></ul></section><article class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" id="lj-c8--elicitation-E1" data-elicitation-id="E1" data-journey-section="true"><h3>The philosophical case for your conclusion</h3><section id="lj-c8--journey-assessment-judgement" class="util-assessment-stimulus" data-region="assessment-stimulus" data-stimulus-kind="prose" data-journey-section="true"><p>THE MISSING ASTER NOTEBOOK — FINAL CASE EVIDENCE</p><p>This is an entirely fictional educational investigation at the Bellwether Institute. The proposition under consideration is P: &#39;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&#39; The question is whether P is true and what justifies believing it, not whether Mara committed theft.</p><p>Dr Rowan Bell confirmed that the notebook was in its locked display cabinet at 16:40 on 14 May 2026. Mara, a collections assistant authorised to enter the Archive Room and assist with conservation preparations, had access that afternoon. The cabinet was found empty at 18:20.</p><p>Security officer Elias Reed reported seeing Mara leave the archive corridor at approximately 17:25 carrying a rectangular grey case. His original incident note described her as leaving the Archive Room at 17:25. The electronic Archive Room door log instead recorded Mara entering at 17:05 and leaving at 17:21. The difference concerns the Archive Room doorway and the wider archive corridor. The discrepancy does not itself establish dishonesty, and the observation alone does not establish what was inside the grey case. Visiting researcher Nina Shah also reported seeing someone in a dark jacket near the corridor but could not reliably identify the person.</p><p>Later evidence included a conservation preparation record created at 17:16 under Mara&#39;s staff identifier: &#39;Aster Notebook transferred to protective case; secure preparation room pending humidity review.&#39; Dr Bell also received Mara&#39;s 17:40 message: &#39;Moved Aster for protection. Will explain when we speak.&#39; Dr Bell confirmed an unusual humidity reading in the Archive Room earlier that afternoon. At 08:15 the following morning, the notebook was found undamaged inside its protective case in the adjoining secure preparation room.</p><p>Taken together, the later evidence strongly supports P and a protective explanation for the notebook&#39;s movement. Nevertheless, records and messages remain evidence to interpret rather than logically infallible guarantees. Removing the notebook is not equivalent to stealing it, and evidence about an action must be distinguished from claims about intention.</p><p>For philosophical analysis, correspondence concerns the relationship between a proposition and reality; coherence concerns systematic relationships among beliefs or propositions; and pragmatic approaches emphasise enquiry, experience and practical consequences. These perspectives do not change the underlying event. Changes in available evidence can change what a person is justified in believing without changing what happened.</p></section><p>You have reached the final stage of the fictional Aster Notebook investigation. The available evidence supports a reasoned judgement about proposition P, but the philosophical question goes beyond deciding what happened. Your task is to explain what it means to regard P as true, why belief in it is or is not justified, and what the different approaches to truth contribute to that judgement.</p><p>Write one coherent philosophical argument responding to this question: What does it mean to regard proposition P as true, and how far is belief in P justified by the available evidence? Develop and defend your own position. Distinguish truth, belief, evidence and justification, and explain why a change in what someone is justified in believing need not change the underlying event. Apply correspondence, coherence and pragmatic approaches meaningfully to P, comparing their contributions and examining at least one substantive difference, limitation or objection. Use relevant evidence from the case, distinguishing the proposition that Mara removed the notebook from the separate allegation that she stole it. Reach a qualified conclusion that reflects the strength and limitations of your reasons. Include a brief reflection on how your reasoning has developed, remained stable or become more qualified since your initial judgement. The aim is philosophical reasoning, not identifying or blaming a culprit.</p><p>Present a connected argument in your own words, rather than separate answers to individual questions. Make your position identifiable, use evidence and philosophical concepts to support it, consider a meaningful challenge, and explain the degree of confidence your conclusion warrants. Your argument will be reviewed using six criteria: conceptual accuracy, application, comparison, evaluation, justification and reflection. These criteria describe qualities of reasoning, not a predetermined correct position.</p><p>Approximately 300–400 words.</p><p>Approximately 15 minutes in total: 2 minutes to review the evidence and your earlier reasoning, 10 minutes to compose your argument, and 3 minutes to review and refine it.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-E1" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c8--assessment-constructed-E1">Your response</label><p>Write in connected prose. You may use paragraphs to organise your reasoning, but keep the response as one argument. Include your own position, philosophical comparison, relevant evidence, a substantive evaluation, a qualified conclusion and reflection on your earlier judgement.</p><textarea class="util-learner-workspace__input" id="lj-c8--assessment-constructed-E1" name="assessment-constructed-E1" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="lj-c8--assessment-constructed-E1-review">Review your response</button></p><div id="lj-c8--assessment-constructed-E1-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="E1_SELF_REVIEW"><p>Review your argument against the six criteria below. These are prompts for examining your own reasoning, not an automatic assessment or a checklist that determines a correct verdict.

Conceptual accuracy: Have you distinguished truth, belief, evidence and justification? Is it clear that a proposition can be true independently of someone&#39;s belief, and that strong justification does not require certainty? Have you described the philosophical approaches without reducing coherence to a convincing story or pragmatism to convenience?

Application: Have you applied your concepts to P itself? Identify where you explain what the relevant records, observations and recovery support, and where you distinguish those facts from your interpretation. Check that you have not treated removal as equivalent to theft or inferred intention solely from the act of removal.

Comparison: Have you used correspondence, coherence and pragmatic approaches to illuminate the same proposition? Look for an explicit comparison showing what each approach emphasises and how those emphases relate to your argument, rather than three unrelated summaries.

Evaluation: Have you examined at least one substantive difference, limitation or objection? Ask whether you have explained why it matters. For example, does the consistency of several records guarantee that they correspond to reality, or does the practical value of an explanation establish its truth? You need not use these examples if another challenge is more relevant to your argument.

Justification: Can a reader trace a clear line from the evidence and philosophical reasons to your conclusion? Does your degree of confidence match the strength of that support? Have you acknowledged an important uncertainty without treating every possibility as equally plausible?

Reflection: Have you compared your present reasoning with your own initial judgement? Explain what you maintained, changed or qualified, and identify the evidence or philosophical consideration responsible. A justified decision to maintain your position can demonstrate reflection as well as a change of mind.

Finally, read the response as a whole. Does it make one connected philosophical case, with a recognisable position, meaningful evaluation and a qualified conclusion? Identify the single revision that would most improve its reasoning.</p></article><article class="util-formative-material" data-material-id="E1_INTERPRETATION_BOUNDARIES"><p>Keep three distinctions in view as you assess your argument. First, what happened is not identical to what someone believes happened. Second, evidence that supports a proposition is not the same as an infallible guarantee of it. Third, the proposition that Mara removed the notebook is not the proposition that she stole it. The later conservation record, message, humidity information and recovery provide strong support for removal and a protective explanation, but they do not make these distinctions unnecessary. Correspondence, coherence and pragmatic approaches offer different philosophical ways of examining truth and enquiry; none changes the event itself. The quality of your argument depends on how carefully you reason with these distinctions, not on assigning blame.</p></article></section><section class="util-assessment-revision" data-region="assessment-revision" data-automated-judgement="false"><p class="util-revision-offer" data-revision-offered="true">If you choose to revise your argument, focus on the most significant issue revealed by your self-review. You might clarify a conceptual distinction, strengthen the link between evidence and conclusion, develop a philosophical objection, or make your reflection more specific. Preserve your own position and the unity of the argument rather than adding disconnected responses to the criteria.</p><div class="util-learner-workspace" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-E1-weakness" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c8--assessment-constructed-E1-weakness">What is the most important weakness you identified in your argument?</label><textarea class="util-learner-workspace__input" id="lj-c8--assessment-constructed-E1-weakness" name="assessment-constructed-E1-weakness" rows="3"></textarea></div><p>Revision is yours to make. It is not marked correct or incorrect.</p><p><a href="#lj-c8--assessment-constructed-E1" data-assessment-return-to-response="assessment-constructed-E1">Revise your written judgement</a></p></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Your completed argument is your contribution to the Learning Journal. It records both your present philosophical position and the reasoning that supports it. As you review it, notice which philosophical distinction or piece of evidence most influenced your conclusion, and whether your final degree of confidence is justified. You may refine the argument before treating it as your final account of this enquiry.</p></section></article><section class="util-pack-forward" data-region="pack-forward" id="lj-c8--journey-assessment-pack-forward" data-journey-section="true"><h2>What to take forward</h2><p>You have brought together the evidence from the fictional Aster Notebook case, three philosophical approaches to truth, and your own developing judgement. Your independent argument is the Learning Journal contribution for &#39;The philosophical case for your conclusion&#39;. Use it as a record of how you distinguished truth from justified belief, evaluated competing philosophical perspectives and reached a qualified position. The self-review criteria can help you identify what your reasoning does well and what you would strengthen in future philosophical enquiries. This formative assessment does not assign a grade, certify mastery or determine your next learning activity.</p></section></section></article></template><template id="lj-resource-journal"><article class="lj-shell-journal" data-lj-journal="true" role="region" aria-labelledby="lj-shell-journal-heading"><h2 id="lj-shel
