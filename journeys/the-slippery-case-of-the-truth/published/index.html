. <span class="util-outcome-id">(LO2)</span></li><li>Evaluate whether the newly disclosed evidence changes the justification for their provisional judgement about proposition P, supporting their position with reasons and identifying remaining uncertainty. <span class="util-outcome-id">(LO3)</span></li><li>Explain why a change in evidential justification or confidence does not necessarily establish that a proposition is true or false, using the unresolved investigation to illustrate the distinction. <span class="util-outcome-id">(LO4)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="lj-c2--journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="lj-c2--activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Compare the conflicting records</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Identify the apparent discrepancy between the electronic Archive Room door log and Elias Reed&#39;s original written incident note without prematurely resolving it.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The investigation begins with an uncertain proposition supported by incomplete witness accounts and observations. Comparing a new electronic record with an existing witness statement provides an opportunity to examine how apparently conflicting evidence should be interpreted before deciding what it means for the central claim.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Detective Ada Mercer has obtained a new security record from the fictional Bellwether Institute. The investigation still concerns proposition P: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot; The notebook was confirmed present at 16:40 and the cabinet was found empty at 18:20. The investigator does not yet know where the notebook is. If you completed &#39;The case opens: Your first judgement&#39;, revisit your provisional judgement, the reasons you gave and any uncertainty you identified. Keep that reasoning in mind as you examine the new evidence and consider whether your justification changes. The proposition concerns removal, not theft.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Treat each document as evidence with a particular scope. Attend to the exact wording, time, location and action described. Do not resolve the apparent discrepancy before completing your initial comparison.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Identify which part of the two accounts appears most difficult to reconcile and explain why it matters to the investigation.</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A1"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Read the electronic Archive Room door log and Elias Reed&#39;s original incident note. Complete the comparison workspace by identifying the source, recorded or reported time, location, action and evidential limit of each account.</p></span></div></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c2--learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="lj-c2--learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="lj-c2--learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c2--learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c2--learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="lj-c2--learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c2--learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify the apparent discrepancy in your own words. Separate what each source explicitly states from any conclusion you might infer about Mara or the notebook.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A1-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated evidence: Two accounts of departure</span></p><h3 class="util-md-heading util-md-heading--source-2">New evidence from Bellwether Institute</h3><p>The following documents are fictional records created for this investigation. They are not authentic historical evidence.</p><p>The disputed proposition remains:</p><p>P: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot;</p><h3 class="util-md-heading util-md-heading--source-3">Document A: Electronic Archive Room door log</h3><p>Source: Bellwether Institute electronic Archive Room door log, Thursday 14 May 2026.</p><table><thead><tr><th>Person</th><th>Recorded action</th><th>Time</th></tr></thead><tbody><tr><td>Mara Vale</td><td>Entered Archive Room</td><td>17:05</td></tr><tr><td>Mara Vale</td><td>Left Archive Room</td><td>17:21</td></tr></tbody></table><h3 class="util-md-heading util-md-heading--source-3">Document B: Original written incident note</h3><p>Source: Elias Reed, security officer, original written incident note.</p><p>&gt; I saw Mara leave the Archive Room at 17:25 carrying a grey case.</p><h3 class="util-md-heading util-md-heading--source-3">Examine the documents</h3><p>Read both sources before deciding what their apparent disagreement means.</p><p>Pay attention to the recorded times, the locations named, the actions described and the difference between an electronic record and a witness&#39;s written account.</p><p>Neither document identifies the contents of the grey case.</p><p>Record your comparison before moving to an explanation of the discrepancy.</p></article><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a1-a1-m2" data-material-source-id="A1-M2" data-activity-id="A1"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A1-M2" data-material-type="comparison_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Source comparison workspace</span></p><p class="util-learner-table-workspace__guidance">Enter your responses in the table below. Your draft is saved on this device when possible. It is not submitted.</p><p>Use the two documents to complete the table. Record what each source actually says before interpreting the apparent conflict. In the final column, identify a conclusion that the source does not establish.</p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="lj-c2--a1-a1-m2-t0-col-source-0">Source</th><th scope="col" id="lj-c2--a1-a1-m2-t0-col-time-1">Time</th><th scope="col" id="lj-c2--a1-a1-m2-t0-col-location-2">Location</th><th scope="col" id="lj-c2--a1-a1-m2-t0-col-action-described-3">Action described</th><th scope="col" id="lj-c2--a1-a1-m2-t0-col-what-this-source-does-not-establish-4">What this source does not establish</th></tr></thead><tbody><tr><th scope="row" id="lj-c2--a1-a1-m2-t0-row-0" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Electronic Archive Room door log</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c2--a1-a1-m2-t0-input-r0-c1" name="a1-a1-m2-t0-input-r0-c1" data-learner-cell="a1-a1-m2-t0-input-r0-c1" rows="3" aria-labelledby="lj-c2--a1-a1-m2-t0-row-0 lj-c2--a1-a1-m2-t0-col-time-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c2--a1-a1-m2-t0-input-r0-c2" name="a1-a1-m2-t0-input-r0-c2" data-learner-cell="a1-a1-m2-t0-input-r0-c2" rows="3" aria-labelledby="lj-c2--a1-a1-m2-t0-row-0 lj-c2--a1-a1-m2-t0-col-location-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c2--a1-a1-m2-t0-input-r0-c3" name="a1-a1-m2-t0-input-r0-c3" data-learner-cell="a1-a1-m2-t0-input-r0-c3" rows="3" aria-labelledby="lj-c2--a1-a1-m2-t0-row-0 lj-c2--a1-a1-m2-t0-col-action-described-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c2--a1-a1-m2-t0-input-r0-c4" name="a1-a1-m2-t0-input-r0-c4" data-learner-cell="a1-a1-m2-t0-input-r0-c4" rows="3" aria-labelledby="lj-c2--a1-a1-m2-t0-row-0 lj-c2--a1-a1-m2-t0-col-what-this-source-does-not-establish-4" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="lj-c2--a1-a1-m2-t0-row-1" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Elias Reed&#39;s original written incident note</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c2--a1-a1-m2-t0-input-r1-c1" name="a1-a1-m2-t0-input-r1-c1" data-learner-cell="a1-a1-m2-t0-input-r1-c1" rows="3" aria-labelledby="lj-c2--a1-a1-m2-t0-row-1 lj-c2--a1-a1-m2-t0-col-time-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c2--a1-a1-m2-t0-input-r1-c2" name="a1-a1-m2-t0-input-r1-c2" data-learner-cell="a1-a1-m2-t0-input-r1-c2" rows="3" aria-labelledby="lj-c2--a1-a1-m2-t0-row-1 lj-c2--a1-a1-m2-t0-col-location-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c2--a1-a1-m2-t0-input-r1-c3" name="a1-a1-m2-t0-input-r1-c3" data-learner-cell="a1-a1-m2-t0-input-r1-c3" rows="3" aria-labelledby="lj-c2--a1-a1-m2-t0-row-1 lj-c2--a1-a1-m2-t0-col-action-described-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c2--a1-a1-m2-t0-input-r1-c4" name="a1-a1-m2-t0-input-r1-c4" data-learner-cell="a1-a1-m2-t0-input-r1-c4" rows="3" aria-labelledby="lj-c2--a1-a1-m2-t0-row-1 lj-c2--a1-a1-m2-t0-col-what-this-source-does-not-establish-4" autocomplete="off"></textarea></div></td></tr></tbody></table></div><h3 class="util-md-heading util-md-heading--source-3">Describe the apparent discrepancy</h3><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="lj-c2--a1-a1-m2-t1-col-question-0">Question</th><th scope="col" id="lj-c2--a1-a1-m2-t1-col-your-response-1">Your response</th></tr></thead><tbody><tr><th scope="row" id="lj-c2--a1-a1-m2-t1-row-0" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">What appears difficult to reconcile between the two accounts?</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c2--a1-a1-m2-t1-input-r0-c1" name="a1-a1-m2-t1-input-r0-c1" data-learner-cell="a1-a1-m2-t1-input-r0-c1" rows="3" aria-labelledby="lj-c2--a1-a1-m2-t1-row-0 lj-c2--a1-a1-m2-t1-col-your-response-1" autocomplete="off"></textarea></div></td></tr></tbody></table></div><p>Use the exact wording of the documents where it matters. Do not assume that an apparent disagreement proves either source was fabricated.</p></article></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A completed comparison that accurately extracts the relevant particulars from both records, identifies the apparent conflict in their accounts and distinguishes direct evidence from inference. The response should identify at least one important limitation of each source without assuming that either source establishes the contents of the grey case or proves proposition P.</p></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c2--learner-check-a1" data-check-sidebar-open aria-controls="lj-c2--learner-check-a1" aria-expanded="false" aria-label="Check your work: Compare the conflicting records">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c2--learner-check-a1" data-composition-moment="check" data-activity-id="A1" data-check-sidebar="available" aria-labelledby="lj-c2--learner-check-a1-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c2--learner-check-a1-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c2--learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c2--learner-task-a1">Back to your task (Compare the conflicting records)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M3" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m3" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m3-c-0" data-revision-criterion-id="a1-m3-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you extracted the relevant particulars accurately from both sources?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A mistaken time, location or attribution can create a conflict that the documents themselves do not contain.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Both source rows contain the times reported or recorded in their respective documents.</li><li><span class="util-guided-review__feature-key">B.</span> The location and action columns reflect the wording of each source.</li><li><span class="util-guided-review__feature-key">C.</span> The electronic record and the written testimony are attributed to different sources.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Return to each document and enter its stated times in the appropriate row, keeping the electronic entries distinct from the witness&#39;s written account.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Replace any assumed location or action with the words supported by that particular document.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify which information comes from the door-recording system and which comes from Elias&#39;s written statement.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a1-a1-m3-item-0" data-checklist-item-id="checklist-a1-a1-m3-item-0"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a1-a1-m3-item-0">My comparison accurately represents both sources</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m3-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m3-c-1" data-revision-criterion-id="a1-m3-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you identified the apparent discrepancy rather than merely listing the records?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The investigation requires an explanation of what seems incompatible, not simply a transcription of two documents.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response identifies the particular recorded and reported departures being compared.</li><li><span class="util-guided-review__feature-key">B.</span> The response specifies the aspect of the accounts that appears inconsistent.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the departure described by each source and explain why a reader might initially regard the accounts as conflicting.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify the relevant difference in timing, location wording or description of the event instead of writing only that the records disagree.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a1-a1-m3-item-1" data-checklist-item-id="checklist-a1-a1-m3-item-1"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a1-a1-m3-item-1">I have described the apparent conflict</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m3-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m3-c-2" data-revision-criterion-id="a1-m3-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you separated the documents&#39; statements from your own inferences?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A source can support an inference without directly recording the event that the inference concerns.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The comparison distinguishes an electronically recorded movement from an event reported by a witness.</li><li><span class="util-guided-review__feature-key">B.</span> The response does not treat an inferred explanation as a fact stated in either document.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the action each source directly records or reports before drawing any conclusion about other events.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Move any proposed explanation out of the source-description cells and present it separately as an interpretation.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a1-a1-m3-item-2" data-checklist-item-id="checklist-a1-a1-m3-item-2"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a1-a1-m3-item-2">My comparison distinguishes evidence from inference</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m3-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m3-c-3" data-revision-criterion-id="a1-m3-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you recognised the limits of what each source can establish?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Overstating a source&#39;s scope could turn a narrow observation into an unsupported conclusion about the missing notebook.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each source row identifies at least one conclusion not established by that source.</li><li><span class="util-guided-review__feature-key">B.</span> The response does not claim that either document identifies the contents of the grey case.</li><li><span class="util-guided-review__feature-key">C.</span> The response does not equate an apparent discrepancy with proof of deliberate deception.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> For each document, ask what additional event or detail would need separate evidence and record that limitation.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Remove any claim about the case&#39;s contents unless it is explicitly supported by a disclosed observation.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Distinguish the presence of conflicting wording from evidence about whether someone intended to mislead.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a1-a1-m3-item-3" data-checklist-item-id="checklist-a1-a1-m3-item-3"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a1-a1-m3-item-3">I have stated the sources&#39; evidential limits</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m3-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c2--activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Explain the apparent contradiction</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Construct and evaluate alternative explanations before receiving the canonical clarification, then reconsider the initial interpretation.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your comparison established what the sources actually say and where they appear to disagree. You can now move from identifying a discrepancy to constructing and evaluating explanations, using the same source particulars rather than treating the discrepancy itself as proof of dishonesty.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>The records appear to describe incompatible departures. Before receiving Detective Mercer&#39;s explanation, investigate how this disagreement might have arisen. An inaccurate statement may reflect a mistake, ambiguity or deliberate deception, but these possibilities require different kinds of support.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Consider whether the sources necessarily describe the same event and whether their language is equally precise. Treat proposed explanations as hypotheses until their fit with the disclosed evidence has been examined.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">After revealing the explanation, record what you initially thought, which distinction or evidence confirmed or challenged that view, and what you now conclude about the reliability and interpretation of Elias&#39;s account.</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A2"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Examine the two records and the initial report of Elias&#39;s observation. Develop at least two plausible explanations for the apparent discrepancy. For each, explain how it could account for the evidence and identify what remains unsupported. Decide which explanation is best supported by the available information, distinguishing possible error or ambiguity from deliberate fabrication. Record your reasoning before revealing the explanatory feedback. After reading the feedback, briefly identify what your initial interpretation captured or missed.</p></span></div></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c2--learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="lj-c2--learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="lj-c2--learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c2--learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c2--learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="lj-c2--learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c2--learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A2-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated evidence: Three descriptions to examine</span></p><h3 class="util-md-heading util-md-heading--source-2">Investigating the apparent contradiction</h3><p>These are fictional case records and reports from Bellwether Institute. The three items below contain information already disclosed in the investigation.</p><h3 class="util-md-heading util-md-heading--source-3">Source 1: Electronic Archive Room door log</h3><p>Source: Bellwether Institute electronic Archive Room door log, Thursday 14 May 2026.</p><table><thead><tr><th>Person</th><th>Recorded action</th><th>Time</th></tr></thead><tbody><tr><td>Mara Vale</td><td>Entered Archive Room</td><td>17:05</td></tr><tr><td>Mara Vale</td><td>Left Archive Room</td><td>17:21</td></tr></tbody></table><h3 class="util-md-heading util-md-heading--source-3">Source 2: Elias Reed&#39;s original written incident note</h3><p>Source: Elias Reed, security officer.</p><p>&gt; I saw Mara leave the Archive Room at 17:25 carrying a grey case.</p><h3 class="util-md-heading util-md-heading--source-3">Source 3: Initially disclosed witness report</h3><p>Source: Elias Reed&#39;s observation as reported to the investigator during the initial investigation.</p><p>Elias reported seeing Mara leaving the archive corridor at approximately 17:25 carrying a rectangular grey case.</p><h3 class="util-md-heading util-md-heading--source-3">Your investigation</h3><p>Compare the locations and times described by the three sources.</p><p>Consider more than one possible explanation for the apparent disagreement. For each explanation, identify which particulars it accommodates and what evidence would still be missing.</p><p>Record your own interpretation before revealing Detective Mercer&#39;s explanatory feedback. Do not assume that a mistaken description must be deliberately dishonest.</p></article><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-card-grid-after" data-visual-slot="materials-card-grid-after" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a2-location-distinction-01-activity-a2-materials-card-grid-after"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/activity-a2-materials-card-grid-after.png" alt="Post-feedback diagram distinguishing the Archive Room doorway from the archive corridor; detailed description follows." aria-describedby="lj-c2--figure-description-asset-vb-38-4-va-a2-location-distinction-01-activity-a2-materials-card-grid-after" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 2.</strong> Post-feedback clarification: leaving the Archive Room and leaving the wider archive corridor refer to different boundaries.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c2--figure-description-asset-vb-38-4-va-a2-location-distinction-01-activity-a2-materials-card-grid-after">The diagram distinguishes an enclosed Archive Room from the wider archive corridor outside it. A doorway marks the boundary of the room, while the corridor extends beyond that doorway. The electronic door log is associated with crossing the room&#39;s doorway. The initial witness report is associated with leaving the wider corridor. Elias&#39;s original written note names the Archive Room, but its wording is distinguished from the electronic record. The two departure locations are therefore not interchangeable. No complete route, case contents or conclusion about the notebook is represented.</p></figure><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A2-M2" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Competing explanations workspace</p></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A reasoned comparison of at least two possible explanations, each connected to specific source particulars and accompanied by an evidential limitation. The learner identifies a defensible interpretation, explains why an inaccurate statement alone is insufficient to establish dishonesty, and records how the subsequent explanation confirms or challenges their original reasoning. The initial response must not be supplied with the intended reconciliation in advance.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m2-section-first-possible-explanation-1" data-response-part-id="A2-template-section-a2-m2-section-first-possible-explanation-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-first-possible-explanation-1-label" for="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-first-possible-explanation-1">First possible explanation</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-first-possible-explanation-1-desc">Describe one way the apparent disagreement could have arisen.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-first-possible-explanation-1" name="learner-workspace-a2-a2-template-section-a2-m2-section-first-possible-explanation-1" rows="6" aria-describedby="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-first-possible-explanation-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m2-section-evidence-and-limitation-for-the-first-explanation-2" data-response-part-id="A2-template-section-a2-m2-section-evidence-and-limitation-for-the-first-explanation-2"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-evidence-and-limitation-for-the-first-explanation-2-label" for="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-evidence-and-limitation-for-the-first-explanation-2">Evidence and limitation for the first explanation</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-evidence-and-limitation-for-the-first-explanation-2-desc">Identify the source particulars this explanation accommodates and at least one point it does not establish.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-evidence-and-limitation-for-the-first-explanation-2" name="learner-workspace-a2-a2-template-section-a2-m2-section-evidence-and-limitation-for-the-first-explanation-2" rows="6" aria-describedby="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-evidence-and-limitation-for-the-first-explanation-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m2-section-second-possible-explanation-3" data-response-part-id="A2-template-section-a2-m2-section-second-possible-explanation-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-second-possible-explanation-3-label" for="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-second-possible-explanation-3">Second possible explanation</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-second-possible-explanation-3-desc">Describe a different possible explanation. It may involve imprecise wording, mistaken recollection or another hypothesis, but do not present an unproven allegation as fact.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-second-possible-explanation-3" name="learner-workspace-a2-a2-template-section-a2-m2-section-second-possible-explanation-3" rows="6" aria-describedby="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-second-possible-explanation-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m2-section-evidence-and-limitation-for-the-second-explanation-4" data-response-part-id="A2-template-section-a2-m2-section-evidence-and-limitation-for-the-second-explanation-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-evidence-and-limitation-for-the-second-explanation-4-label" for="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-evidence-and-limitation-for-the-second-explanation-4">Evidence and limitation for the second explanation</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-evidence-and-limitation-for-the-second-explanation-4-desc">Identify the source particulars relevant to this alternative and what additional evidence would be needed to support it.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-evidence-and-limitation-for-the-second-explanation-4" name="learner-workspace-a2-a2-template-section-a2-m2-section-evidence-and-limitation-for-the-second-explanation-4" rows="6" aria-describedby="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-evidence-and-limitation-for-the-second-explanation-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m2-section-my-provisional-interpretation-and-reasons-5" data-response-part-id="A2-template-section-a2-m2-section-my-provisional-interpretation-and-reasons-5"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-my-provisional-interpretation-and-reasons-5-label" for="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-my-provisional-interpretation-and-reasons-5">My provisional interpretation and reasons</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-my-provisional-interpretation-and-reasons-5-desc">Which explanation currently fits the available evidence best? Explain your reasoning and distinguish possibility from proof.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-my-provisional-interpretation-and-reasons-5" name="learner-workspace-a2-a2-template-section-a2-m2-section-my-provisional-interpretation-and-reasons-5" rows="6" aria-describedby="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-my-provisional-interpretation-and-reasons-5-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="6" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m2-section-my-interpretation-after-feedback-6" data-response-part-id="A2-template-section-a2-m2-section-my-interpretation-after-feedback-6"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-my-interpretation-after-feedback-6-label" for="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-my-interpretation-after-feedback-6">My interpretation after feedback</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-my-interpretation-after-feedback-6-desc">After revealing the explanation, record what you initially thought, what confirmed or challenged that view, and what you now conclude about the accounts.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-my-interpretation-after-feedback-6" name="learner-workspace-a2-a2-template-section-a2-m2-section-my-interpretation-after-feedback-6" rows="6" aria-describedby="lj-c2--learner-workspace-a2-a2-template-section-a2-m2-section-my-interpretation-after-feedback-6-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c2--learner-check-a2" data-check-sidebar-open aria-controls="lj-c2--learner-check-a2" aria-expanded="false" aria-label="Check your work: Explain the apparent contradiction">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c2--learner-check-a2" data-composition-moment="check" data-activity-id="A2" data-check-sidebar="available" aria-labelledby="lj-c2--learner-check-a2-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c2--learner-check-a2-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c2--learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c2--learner-task-a2">Back to your task (Explain the apparent contradiction)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m4-c-0" data-revision-criterion-id="a2-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you grounded both explanations in the disclosed records?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An explanation that cannot account for the actual source particulars is speculation rather than an interpretation of the evidence.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each explanation refers to a specific time, location or wording from the sources.</li><li><span class="util-guided-review__feature-key">B.</span> The two explanations differ in how they account for the apparent disagreement.</li><li><span class="util-guided-review__feature-key">C.</span> The provisional interpretation explains why one account fits the available particulars better.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> For each explanation, identify the particular recorded or reported detail it is intended to explain.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Rework one explanation so that it proposes a genuinely different account of why the sources appear to conflict.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Compare how each explanation handles the recorded movements and witness wording, rather than selecting one without reasons.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a2-a2-m4-item-0" data-checklist-item-id="checklist-a2-a2-m4-item-0"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a2-a2-m4-item-0">Both explanations are grounded in the evidence</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m4-c-1" data-revision-criterion-id="a2-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you identified what remains unsupported in each explanation?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Recognising evidential limits prevents a possible explanation from being mistaken for an established fact.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each explanation includes a limitation tied to a missing observation or uncertain detail.</li><li><span class="util-guided-review__feature-key">B.</span> Any suggested additional event or motive is clearly presented as hypothetical.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name a detail the available records do not directly establish and explain why that matters to the explanation.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Qualify any event or intention that is not documented and identify the evidence that would be needed to support it.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a2-a2-m4-item-1" data-checklist-item-id="checklist-a2-a2-m4-item-1"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a2-a2-m4-item-1">I have identified the limits of both explanations</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m4-c-2" data-revision-criterion-id="a2-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you distinguished inaccurate wording from deliberate fabrication?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Treating every error as dishonesty would attribute an intention that the evidence may not support.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response allows for mistakes or ambiguous descriptions without automatically alleging deception.</li><li><span class="util-guided-review__feature-key">B.</span> Any allegation of deliberate deception is treated as requiring independent support.</li><li><span class="util-guided-review__feature-key">C.</span> The response does not assume that an imprecise description makes every part of the observation worthless.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Separate a possible error in reporting from a claim about the witness&#39;s intention.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify what evidence about intentional misleading would be necessary before treating dishonesty as established.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Consider which reported details might remain relevant even if another detail needs qualification.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a2-a2-m4-item-2" data-checklist-item-id="checklist-a2-a2-m4-item-2"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a2-a2-m4-item-2">My interpretation distinguishes error from dishonesty</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m4-c-3" data-revision-criterion-id="a2-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you compared your initial interpretation with the revealed explanation?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An explicit comparison makes it possible to see whether the evidence changed your reasoning rather than simply replacing one answer with another.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The post-feedback field records the interpretation you held before revealing the explanation.</li><li><span class="util-guided-review__feature-key">B.</span> The response identifies the evidence or distinction that confirmed or challenged that interpretation.</li><li><span class="util-guided-review__feature-key">C.</span> The response states a current conclusion about the discrepancy without claiming the whole case is solved.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Briefly restate your own provisional interpretation as you originally understood it.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name the specific feature of the records or their interpretation that made you retain or revise your view.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain what you now think the records can be taken to describe, and keep the question of the notebook&#39;s removal separate.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a2-a2-m4-item-3" data-checklist-item-id="checklist-a2-a2-m4-item-3"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a2-a2-m4-item-3">I have explained how my interpretation developed</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><div class="util-verified-review" data-verified-review><button type="button" class="util-verified-review__toggle" data-verified-review-toggle data-verified-review-label="View verified feedback" data-verified-review-back="Back to review" aria-expanded="false" aria-controls="lj-c2--verified-review-a2">View verified feedback</button><div class="util-verified-review__panel" id="lj-c2--verified-review-a2" data-verified-review-panel><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Reveal verified feedback</summary><div class="util-composition-reveal__body"><article class="util-material-block util-prose-measure" data-material-id="A2-M3" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Reveal the explanation: Room and corridor</span></p><p>Reveal after recording your interpretation.</p><h3 class="util-md-heading util-md-heading--source-3">Two locations, two departures</h3><p>The electronic door log records Mara leaving the Archive Room through its door at 17:21.</p><p>Elias&#39;s observation concerns Mara leaving the wider archive corridor at approximately 17:25, carrying a rectangular grey case.</p><p>These are different locations. A person can leave a room and subsequently leave the corridor outside it. The two times therefore do not have to describe the same departure.</p><p>Elias&#39;s original written note says that he saw Mara leave the Archive Room at 17:25. In this fictional case, that wording conflates the Archive Room with the wider archive corridor. His original note is imprecise about the location of the departure he observed.</p><h3 class="util-md-heading util-md-heading--source-3">Why the interpretation changes</h3><p>If both sources are treated as descriptions of the same departure through the same doorway, the different times appear incompatible.</p><p>If the electronic record is understood as recording passage through the Archive Room door, while Elias&#39;s observation is understood as concerning the wider corridor, the apparent contradiction can be reconciled. The records concern different movements, and the original written note uses the location imprecisely.</p><p>This distinction matters because evidence has a scope. The electronic log records movement through a particular door. Elias reports an observation of Mara carrying a case. Neither source, on its own, records Mara removing the Aster Notebook from its cabinet.</p><h3 class="util-md-heading util-md-heading--source-3">Mistake, ambiguity and dishonesty</h3><p>An inaccurate description can arise in several ways:</p><ul><li>A mistake occurs when someone reports a detail incorrectly.</li><li>Ambiguity occurs when wording permits more than one interpretation or fails to distinguish relevant locations clearly.</li><li>Dishonesty involves an intention to mislead. Establishing that intention requires evidence beyond the mere presence of inaccurate wording.</li></ul><p>Elias&#39;s original note is inaccurate about the location of the observed departure. That does not establish that he fabricated his observation or intended to deceive anyone.</p><p>Nor does reconciling the records establish what was inside the grey case. The notebook&#39;s whereabouts remain unknown at this stage.</p><h3 class="util-md-heading util-md-heading--source-3">What this means for P</h3><p>P remains: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot;</p><p>The discrepancy may change how you interpret or weigh Elias&#39;s testimony. It does not, by itself, demonstrate that P is false or establish that P is true.</p><p>Return to your response and record how this explanation affects your original interpretation.</p></article></div></details></div></div></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c2--activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Reconsider your judgement about P</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Evaluate whether the new evidence changes the justification for the learner&#39;s earlier provisional judgement while maintaining the distinction between removal and theft.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">You have distinguished the records&#39; claims and examined how apparently conflicting accounts can be interpreted. The remaining challenge is to determine what that analysis means for your own provisional judgement about P, while separating the reliability of a witness&#39;s wording from the truth of the central proposition.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>The discrepancy has now been examined, but the investigation remains unresolved. Return to the exact proposition: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot; Your task is to decide what the available evidence justifies believing, not whether Mara committed theft.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Evaluate the evidential contribution of each source rather than simply counting sources. Consider whether an imprecise statement loses all evidential value or whether only a particular interpretation of it is weakened.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Record what you previously thought, which evidence or reasoning challenged or confirmed your position, and what you now conclude about P and why.</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c2--learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="lj-c2--learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="lj-c2--learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c2--learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c2--learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="lj-c2--learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c2--learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Consult your earlier provisional judgement and reasons, where available, alongside the disclosed evidence. Identify which reasons still carry weight, which require qualification and what remains uncertain. Decide whether your confidence in P has increased, decreased or remained unchanged, and justify that position using the evidence. Record your earlier view, the evidence or reasoning that challenged or confirmed it, and your current conclusion. If you did not form an earlier judgement, state that and give a current provisional judgement without inventing a previous response.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A3-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated evidence dossier: The case so far</span></p><h3 class="util-md-heading util-md-heading--source-2">Bellwether Institute: Evidence available so far</h3><p>This is a fictional investigation. The records and testimony below are simulated educational evidence.</p><p>The disputed proposition is:</p><p>P: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot;</p><p>The question is whether Mara removed the notebook. It is not a claim that she stole it.</p><h3 class="util-md-heading util-md-heading--source-3">Cabinet observations</h3><p>Source: Dr Rowan Bell, curator.</p><ul><li>At 16:40 on Thursday 14 May 2026, Dr Bell confirmed that the Aster Notebook was present in its locked display cabinet.</li><li>At 18:20, Dr Bell found the display cabinet empty.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Authorised access</h3><p>Source: Institute access information disclosed during the initial investigation.</p><p>Mara Vale, a collections assistant, had authorised access to the Archive Room that afternoon.</p><h3 class="util-md-heading util-md-heading--source-3">Security officer&#39;s observation</h3><p>Source: Elias Reed, initial report of his observation.</p><p>Elias reported seeing Mara leaving the archive corridor at approximately 17:25 carrying a rectangular grey case.</p><h3 class="util-md-heading util-md-heading--source-3">Mara Vale&#39;s statement</h3><p>Source: Mara Vale.</p><p>&gt; I was dealing with conservation preparations. I did not steal the notebook.</p><h3 class="util-md-heading util-md-heading--source-3">Visiting researcher&#39;s observation</h3><p>Source: Nina Shah.</p><p>Nina reported seeing someone wearing a dark jacket near the archive corridor at approximately 17:32. She could not reliably identify the person.</p><h3 class="util-md-heading util-md-heading--source-3">Electronic Archive Room door log</h3><p>Source: Bellwether Institute electronic Archive Room door log, Thursday 14 May 2026.</p><table><thead><tr><th>Person</th><th>Recorded action</th><th>Time</th></tr></thead><tbody><tr><td>Mara Vale</td><td>Entered Archive Room</td><td>17:05</td></tr><tr><td>Mara Vale</td><td>Left Archive Room</td><td>17:21</td></tr></tbody></table><h3 class="util-md-heading util-md-heading--source-3">Original written incident note</h3><p>Source: Elias Reed, security officer.</p><p>&gt; I saw Mara leave the Archive Room at 17:25 carrying a grey case.</p><h3 class="util-md-heading util-md-heading--source-3">Clarification already established</h3><p>The electronic log concerns departure through the Archive Room door. Elias&#39;s observation concerns departure from the wider archive corridor. His original written note conflates these locations. The different departure times can therefore describe different movements.</p><p>This clarification does not establish the contents of the grey case or whether Mara removed the notebook from its cabinet.</p><h3 class="util-md-heading util-md-heading--source-3">What remains unknown</h3><p>The investigator does not yet know where the Aster Notebook is. The contents of the grey case have not been established.</p><p>Use this dossier to decide what the available evidence justifies believing about P. You may reach a provisional conclusion, but distinguish that judgement from certainty about what happened.</p></article><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M2" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Reassessing your judgement</p></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A concise evidence-based judgement about P that identifies the learner&#39;s earlier position where available, evaluates the effect of the new evidence on the original r
