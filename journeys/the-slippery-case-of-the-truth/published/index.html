ria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Three approaches to truth, not three ways to investigate</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>We have been asking two different questions: what would make P true, and how could an investigator become justified in believing P? Philosophical theories of truth address the first question at a deeper level. Investigative procedures, such as examining records and comparing testimony, help us address the second.</p><p>One influential approach is correspondence, associated with philosophers including Aristotle and Bertrand Russell. Correspondence concerns the relationship between a proposition and reality. Applied to P, the question is whether Mara actually removed the notebook from its display cabinet before 18:00 on 14 May. The electronic door log may help an investigator assess that claim, but the log is evidence about reality, not reality itself.</p><p>A different approach is coherence, associated with idealist traditions including F. H. Bradley. Coherence theories emphasise the systematic relationships among beliefs or propositions within an appropriately integrated system. This is more demanding than asking whether a detective&#39;s explanation sounds plausible. The fact that the door-log accounts can be reconciled is relevant to assessing their consistency, but checking a pair of records is not itself a complete coherence theory of truth.</p><p>Pragmatic approaches, associated with Charles Sanders Peirce, William James and John Dewey, connect truth with enquiry, experience and practical consequences. Their emphases differ. Peirce gives particular importance to sustained, self-correcting enquiry. James explores the practical significance of truth in experience. Dewey emphasises testing and revising judgements as enquiry addresses problematic situations. None of these approaches should be reduced to the claim that whatever is convenient to believe must be true.</p><p>The three approaches do not change the event under investigation. They offer different philosophical accounts of truth and its relationship to reality, systems of belief and enquiry.</p><p>This also explains why theories of truth are not simply alternative investigative techniques. Reading the door log, checking what a witness meant and considering possible explanations are ways of evaluating evidence. Correspondence, coherence and pragmatic approaches ask more fundamental questions about what truth involves.</p><p>Reality and coherence: Two accounts of truth develops the contrast between correspondence and coherence, building on the difference between factual accuracy and systematic consistency. Pragmatism and the problem of competing theories examines the role of enquiry and practical consequences, building on the distinction between usefulness and truth. The conceptual differences established here make those comparisons possible without confusing a philosophical theory with an evidence-checking procedure.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-S5-01" data-material-kind="Three-approach philosophical comparison" data-material-type="expository_structured_table" data-section-id="S5" data-expository-structured="table"><h3>Three philosophical approaches to truth</h3><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Philosophical approach</th><th scope="col">Associated thinkers</th><th scope="col">Central concern</th><th scope="col">How it illuminates P</th><th scope="col">Not the same as</th></tr></thead><tbody><tr><td>Correspondence</td><td>Aristotle and Bertrand Russell</td><td>The relationship between a proposition and reality.</td><td>Directs attention to whether the removal described by P actually occurred.</td><td>Checking the electronic door log or comparing witness accounts. Those procedures provide evidence about events; they are not themselves a theory of correspondence.</td></tr><tr><td>Coherence</td><td>F. H. Bradley and idealist traditions</td><td>The systematic consistency and mutual support of beliefs or propositions within a wider, integrated system.</td><td>Directs attention to how P relates to other propositions and whether those relationships form a coherent system.</td><td>Simply finding a plausible explanation for the two departure times. Reconciling records is a limited consistency check, not a complete coherence theory of truth.</td></tr><tr><td>Pragmatic approaches</td><td>Charles Sanders Peirce, William James and John Dewey</td><td>The relationship between truth, enquiry, experience and practical consequences, with different emphases among the thinkers.</td><td>Directs attention to how claims are examined, tested and reconsidered through enquiry and experience.</td><td>Choosing a hypothesis merely because it is convenient or helps an investigation proceed. Practical usefulness alone does not establish truth.</td></tr></tbody></table></div><section><h4>Linear text equivalent</h4><ul><li>Correspondence: Associated with Aristotle and Bertrand Russell. Its central concern is the relationship between propositions and reality. Applied to P, it directs attention to whether Mara actually removed the Aster Notebook before 18:00 on 14 May. Examining the door log is an investigative procedure that may provide evidence about the event, not a correspondence theory.</li><li>Coherence: Associated with F. H. Bradley and idealist traditions. Its central concern is the systematic consistency and mutual support of propositions or beliefs within an integrated system. Applied to P, it directs attention to the relationships between P and other propositions. Reconciling the departure times is a limited consistency check, not a complete coherence theory.</li><li>Pragmatic approaches: Associated with Charles Sanders Peirce, William James and John Dewey. These approaches connect truth with enquiry, experience and practical consequences, although the philosophers differ in emphasis. Applied to P, they direct attention to how claims are investigated, tested and revised. A useful hypothesis does not become true merely because it is convenient.</li></ul></section><div><p><strong>Closing text</strong></p><p>The approaches offer different philosophical perspectives on truth, not different versions of the events at the Bellwether Institute. Investigative procedures help us assess the evidence for P; philosophical theories address what truth involves. The comparison does not establish which approach is preferable or whether P is true.</p></div></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S6" data-section-id="S6" data-expository-section-role="terminal-close" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">What changes when our reasons change?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation" data-expository-closure="terminal"><p>Consider the central proposition once more:</p><p>P: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot;</p><p>Whether P is true depends on what happened, not on how confident an investigator feels or how convincing an explanation appears. The proposition&#39;s truth condition remains the same throughout the investigation.</p><p>What can change is the investigator&#39;s position. The available evidence may expand. An earlier observation may be interpreted more carefully. A witness&#39;s wording may prove less precise than it first appeared. These developments can strengthen or weaken the justification for a belief without changing the event being investigated.</p><p>The door-log discrepancy illustrates this distinction. The electronic record places Mara&#39;s departure from the Archive Room at 17:21. Elias&#39;s written note places her departure at 17:25, but conflates the Archive Room with the wider archive corridor. Recognising the difference between those locations helps explain the apparent inconsistency. It does not establish what was in the grey case or whether P is true.</p><p>A useful way to organise the reasoning is to keep four elements separate. The proposition states what is being claimed. Its truth condition specifies what would make it true. Evidence provides information relevant to evaluating the claim. Justification concerns whether the available evidence, interpreted responsibly, supports believing it.</p><p>Coherence and usefulness can contribute to this evaluation, but they do not remove the distinction between truth and justified belief. A coherent explanation may still be inaccurate, and a useful hypothesis may still be false. Correspondence, coherence and pragmatic approaches offer different philosophical accounts of truth; they do not alter the underlying events or replace careful investigation.</p><p>You can now reconsider the reasons behind your own earlier judgement about P without assuming that your initial conclusion must change. The question is not simply whether you feel more or less certain. It is whether you can distinguish what the evidence establishes, what you have inferred and what remains unresolved.</p><p>The Aster Notebook investigation remains open at this point. Yet the philosophical question has become more precise: what makes a claim true is not identical to what makes us believe it, what justifies that belief or how useful the belief may be. Understanding those differences makes it possible to evaluate competing accounts of truth while remaining appropriately cautious about the evidence.</p></div></section></section></article></template><template id="lj-resource-c4"><article class="util-learner-page util-page util-learner-renderer-vnext util-page--expository" data-renderer="vnext" data-page-kind="expository" data-persistence-page-key="v1::21d66d1b-2127-4ecb-8e25-9e4e9a9dcd3c::learner-page::2.0.0::no-activities::truth:-reality-or-coherence" data-persistence-storage-key="learner-renderer-vnext:draft:v1::21d66d1b-2127-4ecb-8e25-9e4e9a9dcd3c::learner-page::2.0.0::no-activities::truth:-reality-or-coherence" data-composition-mode="moments" data-composed-activity-count="0" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Reality and coherence: Two accounts of truth</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="6"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">One proposition, two questions about truth</span><p class="util-journey-position" aria-label="Section 1 of 6"><span class="util-journey-position__visible" aria-hidden="true">1 of 6</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c4--exposition-S2" aria-label="Next section: Correspondence: When a proposition matches reality"><span class="util-journey-adjacent__title">Correspondence: When a proposition matches reality</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c4--exposition-S1" aria-current="location">One proposition, two questions about truth</a></li><li><a class="util-journey-all-link" href="#lj-c4--exposition-S2">Correspondence: When a proposition matches reality</a></li><li><a class="util-journey-all-link" href="#lj-c4--exposition-S3">From individual claims to connected beliefs</a></li><li><a class="util-journey-all-link" href="#lj-c4--exposition-S4">Coherence: Truth within a comprehensive system</a></li><li><a class="util-journey-all-link" href="#lj-c4--exposition-S5">When coherent explanations disagree</a></li><li><a class="util-journey-all-link" href="#lj-c4--exposition-S6">Two accounts, one unresolved investigation</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c4/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-exposition-sections" data-region="exposition"><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S1" data-section-id="S1" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">One proposition, two questions about truth</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>At the fictional Bellwether Institute, the disappearance of the Aster Notebook has prompted an investigation. The notebook was confirmed to be in its locked display cabinet at 16:40 on 14 May 2026. When Dr Rowan Bell checked the cabinet at 18:20, it was empty.</p><p>The proposition at the centre of the investigation is:</p><p>P: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot;</p><p>P is a specific claim. It identifies a person, an action, an object, a location and a time boundary. It does not say that Mara stole the notebook, intended to keep it or acted dishonestly. Those would be different propositions requiring their own justification.</p><p>If you completed &quot;The case opens: Your first judgement&quot;, revisit your own initial judgement about P and the reasons you gave for it. If you also considered the conflicting records in &quot;A witness, a record and a contradiction&quot;, revisit how you interpreted that discrepancy. Use those earlier judgements alongside the distinctions introduced in &quot;What makes a claim true?&quot; to separate what you believed, what supported your belief and what would actually make P true. You need not assume that your earlier judgement was correct or incorrect.</p><p>The available evidence leaves room for uncertainty. Mara was authorised to enter the Archive Room. Security officer Elias Reed reported seeing her leave the archive corridor at approximately 17:25 carrying a rectangular grey case. The contents of that case have not been established. Mara said, &quot;I was dealing with conservation preparations. I did not steal the notebook.&quot; Visiting researcher Nina Shah saw someone in a dark jacket near the archive corridor but could not identify the person. The notebook&#39;s whereabouts remain unknown to the investigator.</p><p>There is also a discrepancy between two records. The electronic Archive Room door log shows Mara entering at 17:05 and leaving at 17:21. Elias&#39;s original written note says, &quot;I saw Mara leave the Archive Room at 17:25 carrying a grey case.&quot; The distinction between the Archive Room and the wider corridor helps explain the difference. Elias&#39;s wording conflates those locations; it does not establish that he fabricated his observation.</p><p>Two questions can now be separated. First, what would make P true? The answer concerns what actually happened: Mara would have had to remove the notebook from the display cabinet before 18:00. Second, what reasons do we currently have for believing P? That question concerns the evidence and how reliably it supports the claim.</p><p>A proposition&#39;s truth and our justification for believing it are not the same thing. Evidence may be incomplete, misleading or open to interpretation. Confidence may increase or decrease as records are examined. None of these changes, by itself, changes the past event being investigated.</p><p>Correspondence and coherence theories offer different philosophical accounts of truth. Correspondence directs attention to the relationship between a proposition and reality. Coherence directs attention to the relationships among propositions within a sufficiently comprehensive system of beliefs. Both can be applied to P, but neither should be confused with a simple method for identifying a culprit.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material util-exposition-structured-fallback" data-material-id="XM-S1-01" data-material-kind="Compact conceptual distinction" data-material-type="expository_structured_fallback" data-section-id="S1" data-expository-structured="fallback"><h3>What makes a proposition true, and what supports believing it?</h3><div><p><strong>Proposition</strong></p><p>P: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot;</p></div><section><h4>Comparison</h4><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Question</th><th scope="col">Focus</th><th scope="col">Answer</th><th scope="col">Boundary</th></tr></thead><tbody><tr><td>What would make P true?</td><td>The event described by the proposition</td><td>Mara actually removed the Aster Notebook from its display cabinet before 18:00 on 14 May.</td><td>This concerns removal, not theft, dishonesty or intention. It does not depend on whether anyone witnessed the removal.</td></tr><tr><td>What currently supports believing P?</td><td>The evidence available to investigators</td><td>The notebook was present at 16:40 and the cabinet was empty at 18:20. Mara had authorised access. The Archive Room door log records her entering at 17:05 and leaving at 17:21. Elias observed her leaving the wider archive corridor at approximately 17:25 carrying a rectangular grey case.</td><td>These observations are relevant to P but do not directly establish that Mara removed the notebook. The contents of the grey case are unknown.</td></tr></tbody></table></div></section><p>The first question concerns what happened. The second concerns the reasons available for judging what happened. Stronger evidence may change how justified a belief is without changing the event that makes the proposition true or false.</p></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S2" data-section-id="S2" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Correspondence: When a proposition matches reality</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The correspondence theory of truth begins with a relationship between what is said and what is the case. A proposition is true when reality is as the proposition represents it. If reality is otherwise, the proposition is false.</p><p>This approach has a long philosophical history. Aristotle provides an important starting point through his account of truthful assertion as describing what is and what is not the case accurately. Much later, Bertrand Russell developed influential accounts of truth involving relationships between beliefs or judgements and facts. Their philosophical positions are not identical, but both help explain why truth cannot simply be reduced to what someone happens to believe.</p><p>Consider P again: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot;</p><p>On a correspondence account, P is true if the event it describes actually occurred. If Mara did not remove the notebook from the cabinet before that time, P is false. The relevant state of affairs is the removal itself, not an investigator&#39;s confidence, a witness&#39;s testimony or the apparent strength of an explanation.</p><p>This gives P a truth condition: the circumstance that must obtain for the proposition to be true. It does not yet tell us whether that circumstance obtained.</p><p>The distinction becomes clearer when we examine the door log. The electronic record shows Mara entering the Archive Room at 17:05 and leaving at 17:21. Those entries provide evidence about access and movement through the room&#39;s entrance. They do not directly record the opening of the display cabinet or the removal of its contents. A person could enter and leave a room without removing an object. Consequently, the door log is relevant to P without being equivalent to the fact that would make P true.</p><p>Elias&#39;s observation has a similar limitation. Seeing Mara carrying a grey case might be relevant to the investigation, but it does not establish what was inside the case. The difference between his original wording and the electronic record also requires interpretation. These evidential limitations do not tell us whether P is true or false; they tell us what the current evidence can and cannot establish.</p><p>Suppose, purely hypothetically, that Mara had removed the notebook but no reliable witness or record captured the action. P would still be true on a correspondence account. Conversely, imagine that several witnesses mistakenly agreed that she had removed it when someone else had done so. Their agreement would not make P true.</p><p>Correspondence therefore separates truth from certainty. Certainty concerns the strength or security of our knowledge or confidence. Truth concerns whether the proposition accurately represents reality. A true proposition may remain uncertain to investigators, while a confidently held proposition may be false.</p><p>This distinction also prevents a common misunderstanding: correspondence theory is not simply an instruction to collect more evidence. Evidence helps us investigate whether a proposition corresponds to reality, but the theory addresses what makes the proposition true. The conditions for truth and the means of discovering truth are related without being identical.</p><p>Correspondence has its own philosophical difficulties. Philosophers can disagree about what counts as a fact, how propositions represent facts and how the correspondence relationship should be understood. A simple statement such as P makes the basic idea accessible, but the full theory is more demanding than comparing two sentences for matching words.</p><p>For the Aster investigation, correspondence establishes a clear distinction. The removal described by P either occurred or did not occur. The current evidence may justify different degrees of confidence, but uncertainty about what happened is not itself a change in what happened.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material util-exposition-structured-fallback" data-material-id="XM-S2-01" data-material-kind="Text-accessible relationship diagram" data-material-type="expository_structured_fallback" data-section-id="S2" data-expository-structured="fallback" data-representation-spec-suppressed="section-figure"><h3>Correspondence: A proposition, reality and evidence</h3></article></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--section-after-content" data-visual-slot="section-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-s2-correspondence-01-section-s2-section-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c4/section-after-content.png" alt="Concept map distinguishing proposition P, the possible removal it describes, and the evidence used to investigate whether that removal occurred. Correspondence connects P with reality, while evidence supports assessment rather than determining truth." aria-describedby="lj-c4--figure-description-asset-vb-38-4-va-s2-correspondence-01-section-s2-section-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption" id="lj-c4--figure-description-asset-vb-38-4-va-s2-correspondence-01-section-s2-section-after-content"><strong>Figure 1.</strong> Correspondence relates P to what actually occurred; evidence provides a separate route for investigating that relationship.</figcaption></figure></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S3" data-section-id="S3" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">From individual claims to connected beliefs</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Correspondence asks whether a proposition accurately represents reality. But investigators rarely consider a proposition entirely on its own. They compare statements, records and interpretations, looking for agreements, contradictions and explanations that accommodate the evidence.</p><p>Consider three claims available in the Aster investigation:</p><ol><li>The electronic Archive Room door log records Mara leaving the room at 17:21.</li><li>Elias&#39;s original incident note says that he saw Mara leave the Archive Room at 17:25 carrying a grey case.</li><li>Elias observed Mara leaving the wider archive corridor at approximately 17:25 carrying a rectangular grey case.</li></ol><p>At first, the door log and the original incident note appear to disagree about the time Mara left the Archive Room. If both refer to the same doorway and the same departure, their descriptions cannot both be accurate in that respect.</p><p>The distinction between locations changes the interpretation. The Archive Room is not identical to the wider archive corridor. Leaving the room at 17:21 and leaving the corridor at approximately 17:25 can describe different moments in a sequence of movement. Elias&#39;s original wording conflates the locations.</p><p>This explanation allows the relevant statements to fit together more satisfactorily. It does not require treating Elias as dishonest, and it does not require rejecting the electronic record. The apparent contradiction can be understood through a more precise account of what each statement refers to.</p><p>There are two levels of reasoning here. Logical consistency concerns whether propositions can be true together without contradiction. Explanatory coherence asks something further: whether the propositions form a connected account in which the relationships between them make sense.</p><p>Distinguishing the room from the corridor improves the explanatory relationship between the records. Yet the resulting account still has limits. The door log does not record what Mara did inside the room. Elias&#39;s observation does not establish the contents of the case. The notebook was later found absent from its cabinet, but that observation does not by itself identify who removed it.</p><p>A consistent explanation of the records is therefore not the same as a demonstrated explanation of the notebook&#39;s removal.</p><p>This is where the philosophical comparison becomes more demanding. We can use consistency and explanatory fit as reasons for preferring one interpretation over another. Doing so helps us assess justification. But coherence theory of truth makes a stronger claim. It asks whether systematic relationships among beliefs or propositions are part of what truth itself consists in.</p><p>To understand that stronger claim, we need to move beyond the correction of a single witness statement and consider what makes an entire system of beliefs coherent.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S4" data-section-id="S4" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Coherence: Truth within a comprehensive system</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>A coherence theory of truth gives a central role to the relationships among beliefs or propositions. Rather than explaining truth primarily through the correspondence of an individual proposition with a separate fact, it understands truth through systematic integration within an appropriately comprehensive and consistent body of beliefs.</p><p>F. H. Bradley is an important figure in this tradition. His idealist philosophy treats truth in relation to the systematic character of thought and experience. The wider idealist traditions associated with coherence theories do not all take exactly the same position, but they share an interest in how individual judgements belong within a connected whole.</p><p>The word coherence can be misleading because it is also used in everyday speech. A detective might call an explanation coherent simply because it sounds reasonable and contains no obvious contradiction. Philosophical coherence demands more.</p><p>Logical consistency is one requirement. If a system contains both a proposition and its direct negation in the same respect, it has a contradiction. But avoiding contradictions is only a beginning. Two unrelated claims might be consistent without explaining anything together.</p><p>Explanatory coherence concerns the relationships among claims. Do they support one another? Can apparent conflicts be understood without arbitrary exceptions? Does the explanation make sense of the observations rather than simply place them side by side?</p><p>Comprehensiveness adds another demand. A system cannot claim strong coherence merely by ignoring inconvenient information. It must accommodate relevant propositions and their relationships as fully as possible. A narrative that explains one witness&#39;s observation but neglects conflicting records remains limited, however persuasive it sounds.</p><p>Consider a hypothetical interpretation of the Aster evidence. Someone might reason that Mara had access to the Archive Room, Elias saw her carrying a grey case, and the notebook was later missing. They might then assume that the grey case contained the notebook and conclude that Mara removed it.</p><p>The interpretation may sound plausible. Its statements could form a consistent story. But the crucial claim about the case&#39;s contents has not been established. Nor does the story, by itself, show that all relevant evidence has been adequately considered. Its apparent coherence partly depends on treating a possibility as though it were an observed fact.</p><p>Now imagine a different hypothetical explanation that gives more weight to the uncertainty about the case&#39;s contents and the possibility that someone else removed the notebook. That account might also be made consistent with several known observations. Neither imagined account becomes true merely because it can be narrated convincingly.</p><p>These examples reveal why sophisticated coherence theories are not equivalent to the claim that any consistent story is true. A comprehensive system requires more than a small collection of mutually compatible assertions. Its propositions must be systematically connected and adequately integrated with the wider body of relevant beliefs.</p><p>There is also a distinction between two uses of coherence. First, coherence may be a criterion of justification. We might reasonably prefer an explanation because it fits more of the evidence, introduces fewer unsupported assumptions and resolves apparent contradictions. A correspondence theorist can accept all of these considerations while maintaining that truth ultimately depends on reality.</p><p>Second, coherence may be understood as constitutive of truth. This is the stronger philosophical position: the systematic coherence of a proposition within an appropriately comprehensive system is part of what makes it true. Coherence is no longer merely a useful sign that we may be approaching the truth; it belongs to the account of truth itself.</p><p>This distinction preserves the philosophical identities of the two theories. Correspondence and coherence are not simply rival investigative habits. They offer different explanations of the relationship in virtue of which a proposition is true.</p><p>Yet the stronger coherence claim faces a difficult question. If more than one coherent system can be constructed, and those systems disagree about P, how could coherence determine which proposition is true?</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-S4-01" data-material-kind="Progressive conceptual comparison" data-material-type="expository_structured_table" data-section-id="S4" data-expository-structured="table"><h3>From consistency to systematic coherence</h3><p>An account can avoid contradiction without explaining much. It can also explain several observations while leaving important evidence or assumptions unexamined. These distinctions help clarify the demands of philosophical coherence.</p><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Level</th><th scope="col">Question</th><th scope="col">Aster Notebook illustration</th><th scope="col">What this does not establish</th></tr></thead><tbody><tr><td>Logical consistency</td><td>Can these propositions be true together without contradiction?</td><td>The door log records Mara leaving the Archive Room at 17:21. Elias observed her leaving the wider archive corridor at approximately 17:25. Because the locations differ, these claims can both be accurate.</td><td>That the records explain the notebook&#39;s disappearance or that P is true.</td></tr><tr><td>Explanatory coherence</td><td>Do the propositions fit together in an account that explains their relationships?</td><td>Distinguishing the Archive Room from the corridor explains why Elias&#39;s original note appeared to conflict with the door log. The interpretation makes the records more intelligible together.</td><td>What Mara did inside the Archive Room or what was inside the grey case.</td></tr><tr><td>Comprehensive systematic coherence</td><td>Are the relevant propositions integrated into a sufficiently wide, consistent and explanatory system of beliefs?</td><td>A more comprehensive account would need to consider the cabinet observations, Mara&#39;s authorised access, the door log, Elias&#39;s testimony, Mara&#39;s statement and Nina&#39;s uncertain identification, without treating unsupported assumptions as established facts.</td><td>That the limited evidence already forms a complete system, or that an apparently comprehensive interpretation has achieved the philosophical ideal of coherence.</td></tr></tbody></table></div><p>The three levels identify increasingly demanding relationships among propositions. They are not a mechanical procedure for proving truth, and they do not exhaust F. H. Bradley&#39;s philosophical position. Coherence as a theory of truth concerns systematic integration within an appropriately comprehensive whole, not simply a successful explanation of one incident.</p></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S5" data-section-id="S5" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">When coherent explanations disagree</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The requirement of comprehensiveness helps distinguish a philosophical coherence theory from an attractive detective story. It also reveals a deeper problem: different systems of beliefs may each appear coherent while supporting incompatible conclusions.</p><p>Consider two hypothetical interpretations of the available Aster evidence.</p><p>In the first, Mara removed the notebook. This interpretation might connect her authorised access, Elias&#39;s observation of the grey case and the later discovery of the empty cabinet. It would still need to explain what supports the claim that she removed the notebook, rather than merely establishing that she had an opportunity to do so.</p><p>In the second, someone else removed the notebook. This interpretation might emphasise that the grey case&#39;s contents are unknown, that Nina could not identify the person she saw and that the available records do not directly show the cabinet being opened. It would still need to explain who removed the notebook and how the known observations fit together.</p><p>These are hypothetical alternatives, not newly discovered evidence. Neither is being presented as the correct account of the investigation.</p><p>The two interpretations disagree about P. The first affirms it; the second denies it. They cannot both accurately describe the same removal event in the same respect. Yet each might be developed into an internally consistent account that accommodates some of the observations.</p><p>If truth were simply consistency within any system of beliefs, this would be troubling. One system could contain P, while another contained its negation. Both could avoid internal contradiction, but they would assign incompatible truth values to the same proposition.</p><p>The difficulty is not that investigators can imagine several stories. The philosophical challenge concerns whether coherence alone can uniquely determine truth when incompatible systems appear to satisfy its requirements.</p><p>A sophisticated coherence theorist need not accept that any limited consistent system counts as true. Some coherence approaches appeal instead to a maximally comprehensive or ideal system: a system in which the relevant propositions are integrated as fully and consistently as possible. On this approach, a partial system may appear coherent only because it leaves important relationships or information unresolved.</p><p>That response makes the theory more demanding. It also creates a further question. How could an investigator recognise that a system is sufficiently comprehensive? Our evidence may be incomplete. We may misunderstand relationships among observations. A system that seems highly coherent today may require revision when additional information becomes available.</p><p>The appeal to an ideal system therefore addresses the problem of competing limited accounts without making it disappear. It distinguishes the philosophical standard of coherence from our imperfect ability to determine whether that standard has been met.</p><p>Correspondence approaches frame the difficulty differently. The actual event remains the condition against which P is evaluated. Even if two investigators develop equally persuasive but incompatible explanations, their disagreement does not produce two different histories. At most one of P and its negation accurately describes the relevant event in the same respect.</p><p>This does not mean correspondence automatically tells investigators which explanation to accept. The evidence may still be insufficient. Correspondence offers a clear account of what would settle the proposition&#39;s truth, while leaving open the practical and philosophical difficulties of finding out what happened.</p><p>Both approaches therefore face questions that deserve attention. Correspondence must explain the relationship between propositions and reality and how that relationship can be understood. Coherence must explain how systematic integration can determine truth without allowing incompatible systems to be equally true. Neither difficulty is settled by the limited Aster evidence.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material util-exposition-structured-fallback" data-material-id="XM-S5-01" data-material-kind="Contrasting hypothetical interpretations" data-material-type="expository_structured_fallback" data-section-id="S5" data-expository-structured="fallback"><h3>Two incompatible interpretations of the same evidence</h3><p>The following interpretations are hypothetical. They are not additional evidence and neither has been established. They illustrate how different explanations can accommodate some of the same observations while disagreeing about P.</p><div><p><strong>Proposition</strong></p><p>P: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot;</p></div><section><h4>Interpretations</h4><section class="util-exposition-comparison-section"><h4>Hypothetical interpretation A: Mara removed the notebook</h4><div><p><strong>Position on p</strong></p><p>Affirms P.</p></div><section><h4>Observations it can accommodate</h4><ul><li>Mara had authorised access to the Archive Room.</li><li>The door log records her entering at 17:05 and leaving at 17:21.</li><li>Elias observed her leaving the wider archive corridor at approximately 17:25 carrying a rectangular grey case.</li><li>The notebook was present at 16:40 and the cabinet was empty at 18:20.</li></ul></section><div><p><strong>Assumption not established</strong></p><p>The interpretation may assume that Mara removed the notebook, possibly by treating the grey case as containing it. Neither the removal nor the case&#39;s contents has been directly established by the available evidence.</p></div><div><p><strong>Remaining difficulty</strong></p><p>Access, opportunity and possession of a case do not, on their own, demonstrate the action specified in P.</p></div></section><section class="util-exposition-comparison-section"><h4>Hypothetical interpretation B: Someone else removed the notebook</h4><div><p><strong>Position on p</strong></p><p>Denies P.</p></div><section><h4>Observations it can accommodate</h4><ul><li>The contents of Mara&#39;s grey case are unknown.</li><li>The door log records Mara&#39;s movements through the Archive Room entrance but does not record the cabinet being opened.</li><li>Nina saw a person in a dark jacket near the archive corridor but could not identify them.</li><li>The cabinet was found empty at 18:20.</li></ul></section><div><p><strong>Assumption not established</strong></p><p>The interpretation assumes that someone other than Mara removed the notebook. Nina&#39;s observation does not identify such a person as the remover, and no available evidence directly establishes this alternative.</p></div><div><p><strong>Remaining difficulty</strong></p><p>Uncertainty about Mara&#39;s involvement is not positive proof that another person removed the notebook.</p></div></section></section><section><h4>Comparison</h4><dl><div><dt>Shared evidence</dt><dd>Both interpretations must account for the same established observations and the distinction between the Archive Room and the wider corridor.</dd></div><div><dt>Incompatibility</dt><dd>Interpretation A affirms P, while interpretation B denies P. They cannot both accurately describe the same removal event in the same respect.</dd></div><div><dt>Limited coherence</dt><dd>Each interpretation might be internally consistent and accommodate selected observations. That does not establish that either is sufficiently comprehensive or philosophically coherent.</dd></div><div><dt>Philosophical challenge</dt><dd>If different internally coherent systems support incompatible propositions, consistency alone cannot determine truth.</dd></div><div><dt>Possible coherence response</dt><dd>A coherence theorist may require a maximally comprehensive or ideal system rather than accepting either limited interpretation as true.</dd></div><div><dt>Remaining question</dt><dd>How could investigators recognise that they had achieved such a comprehensive system when their evidence and understanding remain incomplete?</dd></div></dl></section><p>The existence of competing interpretations exposes a difficulty for coherence theories without refuting them automatically. Their disagreement concerns how the same event should be understood; it does not create two different histories.</p></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c4--exposition-S6" data-section-id="S6" data-expository-section-role="terminal-close" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Two accounts, one unresolved investigation</span></h2><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-S6-01" data-material-kind="Qualified philosophical comparison table" data-material-type="expository_structured_table" data-section-id="S6" data-expository-structured="table"><h3>Correspondence and coherence: A qualified comparison</h3><p>The two theories address the same proposition but identify different relationships as central to truth. Neither theory, by itself, establishes what happened in the Aster investigation.</p><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Question</th><th scope="col">Correspondence</th><th scope="col">Coherence</th></tr></thead><tbody><tr><td>What relationship is central to truth?</td><td>The relationship between a proposition and the relevant fact or state of affairs.</td><td>The systematic relationship of a proposition to an appropriately comprehensive and consistent system of beliefs or propositions.</td></tr><tr><td>What does the theory say about P?</td><td>P is true if Mara actually removed the notebook from its display cabinet before 18:00 on 14 May.</td><td>The truth of P is understood through its integration into a sufficiently comprehensive and systematically coherent body of propositions, rather than through the consistency of a single detective narrative.</td></tr><tr><td>What role does the available evidence play?</td><td>Evidence helps investigators assess whether the removal occurred. It does not itself constitute the event that makes P true.</td><td>Evidence supplies propositions whose consistency, explanatory relationships and integration can be examined. A coherent interpretation of limited evidence is not necessarily a comprehensive system.</td></tr><tr><td>What is a central philosophical difficulty?</td><td>Explaining the relationship between propositions and facts, and distinguishing that relationship from our ability to discover or establish the facts.</td><td>Explaining how coherence determines truth when incompatible limited systems appear coherent, and how a maximally comprehensive system could be recognised.</td></tr></tbody></table></div><p>The door-log discrepancy can improve the coherence of an evidential explanation without proving P. Equally, uncertainty about P does not determine whether it corresponds to reality. The philosophical disagreement concerns what truth consists in, while the historical event under investigation remains the same.</p></article></div><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation" data-expository-closure="terminal"><p>The Aster investigation has remained the same throughout this comparison. The central proposition is still:</p><p>P: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot;</p><p>The available evidence has not changed. We know that the notebook was present at 16:40 and that the cabinet was empty at 18:20. We know that Mara had authorised access, that Elias observed her carrying a grey case in the archive corridor, and that the electronic door log records her leaving the Archive Room at 17:21. We also know that Elias&#39;s original written note conflated the room with the corridor. These observations do not establish the contents of the case or conclusively settle P.</p><p>What has changed is the range of philosophical questions we can ask about that evidence.</p><p>Correspondence theory asks whether P accurately represents reality. Its central relationship is between the proposition and the event it describes. The truth of P depends on whether Mara actually removed the notebook before the specified time, not on whether an investigator can establish that fact with certainty.</p><p>Coherence theory asks how P belongs within an appropriately comprehensive and systematically connected body of beliefs or propositions. Its central relationship is among propositions. A coherent system must do more than avoid contradiction: it must integrate relevant information and explanatory relationships. The philosophical theory makes a stronger claim than simply recommending coherent reasoning as a useful investigative practice.</p><p>These accounts can illuminate the same evidence without making the same claim about the nature of truth. An investigator might use consistency and explanatory fit to judge which interpretation is better justified while also believing that truth ultimately depends on correspondence with reality. Coherence as a criterion for accepting a belief is not identical to coherence as a theory of what makes that belief true.</p><p>The door-log discrepancy demonstrates the distinction. Recognising that the Archive Room and archive corridor are different locations helps the records fit together. It may improve the justification for accepting Elias&#39;s observation as broadly accurate. But it does not establish that Mara removed the notebook. A better integrated explanation of testimony remains different from proof of the event described by P.</p><p>The comparison also reveals different philosophical difficulties. Correspondence raises questions about how propositions relate to facts and how those facts can be known. Coherence faces the challenge of incompatible systems that each appear internally consistent. Requiring a maximally comprehensive system is one response, but identifying such a system remains difficult.</p><p>A short conceptual check brings these distinctions together. Suppose someone says, &quot;The door log and Elias&#39;s observation can be reconciled, so P must be true.&quot; The first part concerns consistency and interpretation. The conclusion goes further than the evidence permits. Reconciling the records removes an apparent conflict but does not establish the notebook&#39;s removal by Mara.</p><p>Now consider a different claim: &quot;Unless we can prove P with certainty, P cannot be true.&quot; This confuses truth with our ability to establish truth. On a correspondence account, P&#39;s truth depends on the event, even if the evidence remains incomplete.</p><p>Finally, consider the claim, &quot;A convincing story about Mara is enough to make P true.&quot; This misrepresents coherence theory. Philosophical coherence requires systematic integration within an appropriately comprehensive system; it is not equivalent to narrative plausibility.</p><p>The investigation also retains an important boundary. P concerns removal from the display cabinet. Mara&#39;s statement that she did not steal the notebook is not a direct denial of that proposition. Even if evidence eventually supported P, the distinct allegations of theft, dishonesty and intention would require separate consideration.</p><p>Correspondence and coherence therefore provide two different ways of understanding the nature of truth while leaving the historical question unchanged. The available evidence may justify a provisional judgement, but the judgement should not be mistaken for the event itself. Nor should an internally persuasive explanation be mistaken for a complete philosophical account of truth.</p><p>&quot;Pragmatism and the problem of competing theories&quot; extends this comparison by examining how enquiry, experience and practical consequences enter philosophical accounts of truth. That further perspective can be considered without reducing truth to whatever happens to be useful or convenient.</p></div></section></section></article></template><template id="lj-resource-c5"><article class="util-learner-page util-page util-learner-renderer-vnext util-page--expository" data-renderer="vnext" data-page-kind="expository" data-persistence-page-key="v1::d176f97d-4fce-44e5-8fe6-3ee994e77191::learner-page::2.0.0::no-activities::pragmatism:-truth-enquiry-and-competing-theories" data-persistence-storage-key="learner-renderer-vnext:draft:v1::d176f97d-4fce-44e5-8fe6-3ee994e77191::learner-page::2.0.0::no-activities::pragmatism:-truth-enquiry-and-competing-theories" data-composition-mode="moments" data-composed-activity-count="0" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Pragmatism and the problem of competing theories</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="7"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">The question remains: What makes a claim true?</span><p class="util-journey-position" aria-label="Section 1 of 7"><span class="util-journey-position__visible" aria-hidden="true">1 of 7</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c5--exposition-S2" aria-label="Next section: Peirce: Truth and sustained enquiry"><span class="util-journey-adjacent__title">Peirce: Truth and sustained enquiry</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c5--exposition-S1" aria-current="location">The question remains: What makes a claim true?</a></li><li><a class="util-journey-all-link" href="#lj-c5--exposition-S2">Peirce: Truth and sustained enquiry</a></li><li><a class="util-journey-all-link" href="#lj-c5--exposition-S3">James: Verification and practical consequences</a></li><li><a class="util-journey-all-link" href="#lj-c5--exposition-S4">Dewey: From uncertainty to warranted assertion</a></li><li><a class="util-journey-all-link" href="#lj-c5--exposition-S5">One tradition, three distinct emphases</a></li><li><a class="util-journey-all-link" href="#lj-c5--exposition-S6">Three accounts of truth, one disputed proposition</a></li><li><a class="util-journey-all-link" href="#lj-c5--exposition-S7">What the comparison allows us to conclude</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c5/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-exposition-sections" data-region="exposition"><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c5--exposition-S1" data-section-id="S1" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">The question remains: What makes a claim true?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>At the fictional Bellwether Institute, the Aster Notebook has disappeared from its locked display cabinet. The investigation continues to focus on one proposition:</p><p>P: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot;</p><p>P concerns removal, not theft. Even if someone established that Mara removed the notebook, that would not by itself establish that she stole it, acted dishonestly or intended to keep it.</p><p>The evidence available so far gives investigators reasons to consider P, but does not settle it. The notebook was confirmed present at 16:40 and the cabinet was found empty at 18:20. Mara had authorised access to the Archive Room. Security officer Elias Reed reported seeing her leaving the archive corridor at approximately 17:25 carrying a rectangular grey case, although the contents of that case have not been established. Mara said that she was dealing with conservation preparations and denied stealing the notebook. Visiting researcher Nina Shah saw someone in a dark jacket near the corridor but could not identify the person.</p><p>A subsequent comparison of records complicated the testimony. The electronic Archive Room door log records Mara entering at 17:05 and leaving at 17:21, while Elias&#39;s original written note describes her leaving the Archive Room at 17:25. His note conflates the Archive Room with the wider archive corridor. This qualifies how the account should be interpreted; it does not establish that Elias fabricated his observation or that P is false.</p><p>If you completed &quot;What makes a claim true?&quot;, revisit your own distinction between truth and justification. If you also worked through &quot;Reality and coherence: Two accounts of truth&quot;, bring forward your understanding of how correspondence and coherence approach P. These earlier distinctions provide the basis for comparing a third family of philosophical approaches.</p><p>A proposition&#39;s truth and the evidence available for believing it are different matters. Whether Mara removed the notebook depends on what happened, while investigators&#39; reasons for accepting or rejecting P depend on what they currently know. Better evidence could change their judgement without changing the event itself.</p><p>Pragmatic approaches bring enquiry into sharper focus. They ask how beliefs are tested, how ideas connect with experience, and what makes a conclusion responsibly assertible. These concerns illuminate the investigation, but they do not replace the question of what actually occurred.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c5--exposition-S2" data-section-id="S2" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Peirce: Truth and sustained enquiry</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Charles Sanders Peirce placed sustained enquiry at the centre of his pragmatic approach. People form beliefs to resolve doubt, but they can become attached to beliefs for reasons that have little to do with their reliability. Confidence, habit, authority and agreement may make a belief feel secure without establishing that it is true.</p><p>Enquiry offers a way to correct such beliefs. Investigators can compare accounts, examine records, test expectations and reconsider conclusions when difficulties emerge. Peirce&#39;s approach is therefore closely connected with fallibilism: the recognition that even a well-supported belief may be mistaken and may need correction.</p><p>The Bellwether discrepancy illustrates the need for this openness. Elias&#39;s written note initially appears to place Mara leaving the Archive Room at 17:25. The electronic log records her departure from that room at 17:21. If investigators treated the written note as beyond question, they might conclude that one record must be false or that Elias had fabricated his account. A more careful interpretation distinguishes the Archive Room door from the wider corridor. The initial reading of the testimony requires qualification, but the observation need not be discarded.</p><p>This is not proof that P is true or false. It shows how investigation can improve an interpretation without immediately settling the disputed proposition.</p><p>Peirce also connected truth with an ideal outcome of enquiry. His account looks towards the conclusion on which an adequately sustained community of investigators would ultimately converge through continued testing and correction. The emphasis is on what unrestricted, responsible enquiry would establish, not on what investigators happen to believe today.</p><p>Ideal convergence is therefore different from a majority vote. Ten investigators agreeing about P would not make it true simply through their agreement. Nor does Peirce&#39;s ideal imply that Detective Ada Mercer could obtain certainty within the time and evidence available to her. Actual investigations may remain incomplete.</p><p>Peirce&#39;s contribution is to direct attention beyond the immediate state of belief. A claim should remain open to criticism, and a responsible investigator should distinguish the evidence currently available from what sustained enquiry might eventually establish. The possibility of correction is a strength of enquiry, not a reason to abandon judgement altogether.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c5--exposition-S3" data-section-id="S3" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">James: Verification and practical consequences</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>William James also connected truth with experience and enquiry, but he placed particular emphasis on what happens when people put ideas to work. A belief does not merely sit in isolation. It shapes expectations, connects experiences and influences what someone looks for or does next.</p><p>Consider P as an investigative hypothesis. If investigators suspect that Mara removed the notebook, they may examine information about her access, the relevant times and the accounts of people near the Archive Room. The hypothesis gives their enquiry direction. They can then consider whether experience and evidence support the expectations associated with it.</p><p>This illustrates James&#39;s interest in verification. An idea is examined through its connections with experience rather than accepted solely because it sounds convincing. Practical consequences matter because beliefs make a difference to how people understand and navigate the world.</p><p>However, a distinction is needed between a belief helping an investigation and that belief being true. Suppose, as a purely hypothetical example, that investigators follow a mistaken hypothesis and consequently discover a previously overlooked inconsistency in a witness account. Their investigation has benefited from the hypothesis, but its usefulness would not establish its truth. Equally, a true conclusion could be inconvenient, uncomfortable or difficult to act upon.</p><p>The simplified claim that pragmatism means &#39;whatever works is true&#39; is therefore misleading. If &#39;works&#39; means producing immediate satisfaction, avoiding embarrassment or obtaining a convenient result, it is not an adequate account of James&#39;s position. His concern with practical consequences belongs within a wider discussion of experience and verification, not a licence to call personally advantageous beliefs true.</p><p>At Bellwether, believing P might help investigators organise their enquiries. Rejecting P might direct attention towards alternative explanations. Either possibility could be productive. The practical value of following an investigative line does not settle whether Mara removed the notebook.</p><p>James draws attention to a feature of belief that a purely abstract discussion can overlook: accepting a proposition affects expectations and experience. Yet those consequences must themselves be examined. A belief&#39;s capacity to guide enquiry is not the same as confirmation that it accurately describes what happened.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c5--exposition-S4" data-section-id="S4" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Dewey: From uncertainty to warranted assertion</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>John Dewey approached enquiry through the situations that make it necessary. An enquiry begins when an existing understanding no longer provides a satisfactory basis for judgement or action. Something is uncertain, incomplete or problematic, and the difficulty calls for investigation.</p><p>The Bellwether case presents such a situation. The notebook is absent from its display cabinet, several pieces of testimony are available, and the records do not initially fit together as straightforwardly as they might appear to. Investigators need more than a confident opinion. They need to clarify the problem, consider possible explanations and assess those explanations against the evidence.</p><p>In Dewey&#39;s account, enquiry develops through connected stages. A problematic situation is identified; possible explanations are formulated; their implications are examined; and evidence is used to test and refine them. A reasoned resolution becomes possible when the investigation provides sufficient grounds for a conclusion.</p><p>Dewey used the term &#39;warranted assertibility&#39; to direct attention to what can responsibly be asserted as the outcome of competent enquiry. The question is not simply whether someone believes P, but whether the investigation provides adequate grounds for asserting it.</p><p>For example, the door log warrants the assertion that the electronic record shows Mara leaving the Archive Room at 17:21. Elias&#39;s original written note warrants reporting that he described her leaving the Archive Room at 17:25. Understanding the difference between the room and the corridor helps explain why the records should not automatically be treated as evidence of fabrication. None of these statements, considered alone, warrants a definitive conclusion about the contents of the grey case.</p><p>Warranted assertibility is not a promise of infallibility. A conclusion can be responsibly supported by the available enquiry and still require revision if relevant evidence or a better interpretation emerges. Nor should it be confused with personal certainty. An investigator may feel completely certain while lacking adequate grounds, or may reach a well-supported conclusion while recognising remaining uncertainty.</p><p>Dewey&#39;s distinctive emphasis is on how enquiry transforms an unsettled situation into one in which responsible judgement becomes possible. That makes his approach particularly useful for understanding the difference between merely having an explanation and having investigated it sufficiently to justify an assertion.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c5--exposition-S5" data-section-id="S5" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">One tradition, three distinct emphases</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Peirce, James and Dewey belong to a related philosophical tradition, but they should not be treated as though they gave the same account of truth using different words.</p><p>Peirce emphasises the long-term correction of belief through sustained enquiry. James explores the verification of ideas through experience and the significance of their practical consequences. Dewey examines how disciplined enquiry resolves problematic situations and provides grounds for warranted assertion.</p><p>These positions overlap. All three resist treating an unsupported declaration as sufficient. All direct attention towards the ways beliefs are examined and tested. Yet they emphasise different relationships between investigation and what can responsibly be believed or asserted.</p><p>The distinction becomes clearer when each is considered in relation to P. A Peircean perspective highlights the need to keep interpretations open to correction. A Jamesian perspective considers how the proposition guides expectations and how those expectations might be checked through experience. A Deweyan perspective asks what the investigation has established sufficiently for an assertion to be warranted.</p><p>These are conceptual perspectives, not three new pieces of evidence. None establishes the contents of Mara&#39;s grey case or resolves whether she removed the notebook.</p><p>The comparison also shows why practical success must not be confused with truth. An investigation can become more productive through a hypothesis that later proves mistaken. Investigators can also possess good reasons for a conclusion without having eliminated every possibility of error. Pragmatic approaches make these relationships between enquiry, experience and judgement philosophically significant, but they do not make immediate convenience a substitute for truth.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-M01" data-material-kind="Compact comparative table" data-material-type="expository_structured_table" data-section-id="S5" data-expository-structured="table"><h3>Three pragmatic perspectives on the same proposition</h3><p>Peirce, James and Dewey share an interest in enquiry, but each brings a different emphasis to the question of whether P can be responsibly accepted.</p><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Thinker</th><th scope="col">Principal emphasis</th><th scope="col">Application to P</th><th scope="col">Essential qualification</th></tr></thead><tbody><tr><td>Charles Sanders Peirce</td><td>Sustained, self-correcting enquiry and the ideal convergence of investigation.</td><td>The difference between the 17:21 door log and Elias&#39;s 17:25 written note illustrates why interpretations must remain open to criticism and correction.</td><td>Ideal convergence is not present agreement or majority opinion. The current investigation may remain incomplete.</td></tr><tr><td>William James</td><td>Experiential verification and the practical consequences of accepting a belief.</td><td>Treating P as a hypothesis directs attention towards Mara&#39;s access, the recorded times and the available testimony, whose implications can be examined.</td><td>A hypothesis may guide productive enquiry without being true. Convenience or immediate usefulness does not establish truth.</td></tr><tr><td>John Dewey</td><td>Disciplined enquiry into a problematic situation and the development of warranted assertibility.</td><td>Investigators must distinguish what the records warrant asserting from what remains uncertain, including the contents of Mara&#39;s grey case.</td><td>Warranted assertibility depends on adequate enquiry; it is neither personal certainty nor an infallible guarantee.</td></tr></t
