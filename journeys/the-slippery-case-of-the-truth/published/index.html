easons, states a current position with an appropriately qualified confidence judgement, and identifies remaining uncertainty. The response distinguishes removal from theft and does not treat the discrepancy as proof that P is false.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-my-earlier-judgement-and-reasons-if-available-1" data-response-part-id="A3-template-section-a3-m2-section-my-earlier-judgement-and-reasons-if-available-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-my-earlier-judgement-and-reasons-if-available-1-label" for="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-my-earlier-judgement-and-reasons-if-available-1">My earlier judgement and reasons, if available</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-my-earlier-judgement-and-reasons-if-available-1-desc">State your original view about P and the evidence or reasoning you relied on. If no earlier response is available, record that here.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-my-earlier-judgement-and-reasons-if-available-1" name="learner-workspace-a3-a3-template-section-a3-m2-section-my-earlier-judgement-and-reasons-if-available-1" rows="5" aria-describedby="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-my-earlier-judgement-and-reasons-if-available-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-evidence-that-confirms-or-challenges-my-reasoning-2" data-response-part-id="A3-template-section-a3-m2-section-evidence-that-confirms-or-challenges-my-reasoning-2"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-evidence-that-confirms-or-challenges-my-reasoning-2-label" for="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-evidence-that-confirms-or-challenges-my-reasoning-2">Evidence that confirms or challenges my reasoning</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-evidence-that-confirms-or-challenges-my-reasoning-2-desc">Identify the relevant observations and records. Explain how their scope, accuracy and limitations affect the reasons for your view. Consider both supporting and competing interpretations.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-evidence-that-confirms-or-challenges-my-reasoning-2" name="learner-workspace-a3-a3-template-section-a3-m2-section-evidence-that-confirms-or-challenges-my-reasoning-2" rows="6" aria-describedby="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-evidence-that-confirms-or-challenges-my-reasoning-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-my-current-judgement-about-p-3" data-response-part-id="A3-template-section-a3-m2-section-my-current-judgement-about-p-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-my-current-judgement-about-p-3-label" for="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-my-current-judgement-about-p-3">My current judgement about P</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-my-current-judgement-about-p-3-desc">State your present provisional position and explain how the evidence supports it. Keep the claim about removal distinct from any claim about theft or motive.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-my-current-judgement-about-p-3" name="learner-workspace-a3-a3-template-section-a3-m2-section-my-current-judgement-about-p-3" rows="5" aria-describedby="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-my-current-judgement-about-p-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-my-confidence-and-whether-it-has-changed-4" data-response-part-id="A3-template-section-a3-m2-section-my-confidence-and-whether-it-has-changed-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-my-confidence-and-whether-it-has-changed-4-label" for="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-my-confidence-and-whether-it-has-changed-4">My confidence and whether it has changed</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-my-confidence-and-whether-it-has-changed-4-desc">Describe your current level of confidence and whether it has increased, decreased or remained unchanged. Explain which evidence or reasoning accounts for that position.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-my-confidence-and-whether-it-has-changed-4" name="learner-workspace-a3-a3-template-section-a3-m2-section-my-confidence-and-whether-it-has-changed-4" rows="6" aria-describedby="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-my-confidence-and-whether-it-has-changed-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-what-remains-uncertain-5" data-response-part-id="A3-template-section-a3-m2-section-what-remains-uncertain-5"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-what-remains-uncertain-5-label" for="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-what-remains-uncertain-5">What remains uncertain</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-what-remains-uncertain-5-desc">Identify the unresolved facts that limit how strongly the available evidence can justify your conclusion.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-what-remains-uncertain-5" name="learner-workspace-a3-a3-template-section-a3-m2-section-what-remains-uncertain-5" rows="6" aria-describedby="lj-c2--learner-workspace-a3-a3-template-section-a3-m2-section-what-remains-uncertain-5-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c2--learner-check-a3" data-check-sidebar-open aria-controls="lj-c2--learner-check-a3" aria-expanded="false" aria-label="Check your work: Reconsider your judgement about P">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c2--learner-check-a3" data-composition-moment="check" data-activity-id="A3" data-check-sidebar="available" aria-labelledby="lj-c2--learner-check-a3-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c2--learner-check-a3-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c2--learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c2--learner-task-a3">Back to your task (Reconsider your judgement about P)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M3" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m3" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m3-c-0" data-revision-criterion-id="a3-m3-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you made your earlier reasoning and any change in judgement observable?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without a comparison between positions, the response cannot demonstrate how new evidence affected the learner&#39;s justification.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response records the earlier judgement and reasons if available, or explicitly notes their absence.</li><li><span class="util-guided-review__feature-key">B.</span> The response identifies evidence or reasoning that confirmed or challenged the earlier position.</li><li><span class="util-guided-review__feature-key">C.</span> The response explains whether the current judgement differs from the earlier one.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Consult your own earlier work if available and state the position and reasons you actually gave; otherwise note that no earlier response is available.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect at least one newly examined source detail to a reason you previously accepted or questioned.</li><li><span class="util-guided-review__feature-key">Missing C:</span> State whether you retained, qualified or changed your position and explain the evidential basis for that development.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a3-a3-m3-item-0" data-checklist-item-id="checklist-a3-a3-m3-item-0"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a3-a3-m3-item-0">My response makes my reasoning development clear</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m3-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m3-c-1" data-revision-criterion-id="a3-m3-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you used the disclosed evidence to justify your current position?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A conclusion about P needs support from evidence relevant to removal, not simply an impression of which character seems credible.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The judgement refers to specific cabinet observations, access information, witness testimony or door-log entries.</li><li><span class="util-guided-review__feature-key">B.</span> The response distinguishes what a source directly establishes from what must be inferred.</li><li><span class="util-guided-review__feature-key">C.</span> The response weighs evidence that supports the position against a limitation or competing interpretation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the particular source details on which your judgement depends and state their relevance to the proposed removal.</li><li><span class="util-guided-review__feature-key">Missing B:</span> For a key piece of evidence, state its direct content and then explain the additional inference needed to connect it to P.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify a relevant uncertainty or alternative reading and explain why your current judgement remains defensible, or needs qualification, in light of it.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a3-a3-m3-item-1" data-checklist-item-id="checklist-a3-a3-m3-item-1"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a3-a3-m3-item-1">My judgement is supported by relevant evidence</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m3-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m3-c-2" data-revision-criterion-id="a3-m3-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you kept removal, theft and intention distinct?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confusing these claims changes the proposition under investigation and can make the reasoning appear stronger than the evidence warrants.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The current judgement directly addresses whether Mara removed the notebook before 18:00.</li><li><span class="util-guided-review__feature-key">B.</span> The response does not treat Mara&#39;s denial of theft as a direct denial of every possible removal.</li><li><span class="util-guided-review__feature-key">C.</span> Any discussion of motive or dishonesty is clearly separated from evidence about removal.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Restate your conclusion in relation to the exact proposition P rather than a broader allegation.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Distinguish the action described in P from the separate question of whether that action would constitute theft.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify which part of your response concerns an action and which concerns an intention, then qualify any intention not established by the evidence.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a3-a3-m3-item-2" data-checklist-item-id="checklist-a3-a3-m3-item-2"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a3-a3-m3-item-2">I have kept the disputed propositions distinct</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m3-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m3-c-3" data-revision-criterion-id="a3-m3-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you calibrated your confidence to what is known and unknown?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A defensible provisional judgement can be undermined by claiming certainty that the available sources do not support.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response states a current confidence level or degree of uncertainty.</li><li><span class="util-guided-review__feature-key">B.</span> The response identifies unresolved facts relevant to the conclusion.</li><li><span class="util-guided-review__feature-key">C.</span> The response does not treat the reconciliation of the departure records as a complete resolution of P.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Describe how strongly you currently hold your judgement and relate that strength to the available evidence.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name an important missing observation or unestablished detail that would affect the strength of your inference.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain which issue the clarified records address and which question about the notebook remains open.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a3-a3-m3-item-3" data-checklist-item-id="checklist-a3-a3-m3-item-3"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a3-a3-m3-item-3">My confidence matches the evidential limits</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m3-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c2--activity-A4" data-journey-section="true" data-activity-id="A4" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Separate truth from justified belief</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A4"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Consolidate the distinction between truth, evidence, inference, justification and confidence, then transfer it independently to a different fictional investigation.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your reassessment of P required you to distinguish the strength of the available evidence from the event being investigated. You can now express that distinction as a general principle and test whether you can apply it independently when the proposition and evidential context change.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>The investigation has shown that new evidence can change how reasonable a belief appears without changing what actually happened. Use that distinction to explain the philosophical problem raised by the case, then apply the same reasoning to a different claim.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Separate three matters: the event that would make a proposition true, the information currently available about that event, and the confidence justified by that information. Apply the distinction to the new claim without importing facts from the Bellwether Institute investigation.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Identify the distinction you can now apply to a new claim and one uncertainty that would still require further evidence. Carry this reasoning into &#39;What makes a claim true?&#39;, where the relationship between truth and justified belief will be examined more closely.</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A4"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Examine a separate fictional situation: a university equipment-room access record shows that a staff member entered a room, while a witness reports seeing that person carrying a closed equipment case nearby. The disputed claim is that the staff member removed a particular instrument from its storage cabinet. Apply the same evidential reasoning to this different claim. Identify what the observations establish, what would remain an inference, and why confidence in the claim could change without changing the underlying event.</p></span></div></div><div class="util-composition-learn-item util-composition-learn-item--example" data-composition-role="example"><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A4-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated evidence: A different missing instrument</span></p><h3 class="util-md-heading util-md-heading--source-2">A separate university equipment-room enquiry</h3><p>This is a fictional scenario created for learning. It is not connected to Bellwether Institute or the Aster Notebook investigation.</p><p>A university department is investigating whether a particular scientific instrument was removed from its storage cabinet.</p><p>The disputed proposition is:</p><p>Q: &quot;A staff member removed the scientific instrument from its storage cabinet.&quot;</p><h3 class="util-md-heading util-md-heading--source-3">Source A: Equipment-room access record</h3><p>The university&#39;s access record shows that the staff member entered the equipment room.</p><h3 class="util-md-heading util-md-heading--source-3">Source B: Witness observation</h3><p>A witness reports seeing the same staff member carrying a closed equipment case nearby.</p><h3 class="util-md-heading util-md-heading--source-3">Limits of the available records</h3><p>The contents of the closed equipment case have not been established.</p><p>Neither available observation directly records the instrument being removed from its storage cabinet.</p><p>Use these particulars to examine what can be justified about Q. Do not assume an outcome or introduce additional facts.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c2--learner-task-a4" data-composition-moment="do" data-activity-id="A4" aria-labelledby="lj-c2--learner-task-a4-heading"><h3 class="util-composition-moment-heading" id="lj-c2--learner-task-a4-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c2--learner-revision-reminder-a4" hidden data-revision-reminder="true" data-activity-id="A4" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c2--learner-revision-guidance-a4" hidden data-revision-guidance="true" data-activity-id="A4" aria-labelledby="lj-c2--learner-revision-guidance-a4-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c2--learner-revision-guidance-a4-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>First, write a short explanation using P to distinguish the truth of a proposition from evidence, justification and confidence. Explain why resolving an apparent contradiction does not automatically establish whether P is true or false.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M2" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Truth, evidence and transfer workspace</p></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>Two concise, connected explanations. The first distinguishes the truth of P from the reasons currently available for believing it and explains why reconciliation of the records does not settle the investigation. The second independently applies the distinction to the new equipment-room claim, separating observed access and possession of a closed case from an unsupported conclusion about the instrument. Both explanations should acknowledge uncertainty without treating uncertainty as proof of falsity.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m2-section-truth-evidence-and-justification-in-p-1" data-response-part-id="A4-template-section-a4-m2-section-truth-evidence-and-justification-in-p-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-truth-evidence-and-justification-in-p-1-label" for="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-truth-evidence-and-justification-in-p-1">Truth, evidence and justification in P</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-truth-evidence-and-justification-in-p-1-desc">Explain what would make P true, what the currently available evidence contributes, and how justification for believing P differs from the event itself.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-truth-evidence-and-justification-in-p-1" name="learner-workspace-a4-a4-template-section-a4-m2-section-truth-evidence-and-justification-in-p-1" rows="6" aria-describedby="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-truth-evidence-and-justification-in-p-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m2-section-what-resolving-the-discrepancy-does-and-does-not-establish-2" data-response-part-id="A4-template-section-a4-m2-section-what-resolving-the-discrepancy-does-and-does-not-establish-2"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-what-resolving-the-discrepancy-does-and-does-not-establish-2-label" for="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-what-resolving-the-discrepancy-does-and-does-not-establish-2">What resolving the discrepancy does and does not establish</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-what-resolving-the-discrepancy-does-and-does-not-establish-2-desc">Explain what changes when the two departure records are interpreted more clearly and what remains unresolved about P.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-what-resolving-the-discrepancy-does-and-does-not-establish-2" name="learner-workspace-a4-a4-template-section-a4-m2-section-what-resolving-the-discrepancy-does-and-does-not-establish-2" rows="6" aria-describedby="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-what-resolving-the-discrepancy-does-and-does-not-establish-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m2-section-what-the-equipment-room-evidence-establishes-3" data-response-part-id="A4-template-section-a4-m2-section-what-the-equipment-room-evidence-establishes-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-what-the-equipment-room-evidence-establishes-3-label" for="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-what-the-equipment-room-evidence-establishes-3">What the equipment-room evidence establishes</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-what-the-equipment-room-evidence-establishes-3-desc">Identify the observations directly supplied by the access record and witness report. Keep the recorded or reported actions separate from the disputed removal.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-what-the-equipment-room-evidence-establishes-3" name="learner-workspace-a4-a4-template-section-a4-m2-section-what-the-equipment-room-evidence-establishes-3" rows="6" aria-describedby="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-what-the-equipment-room-evidence-establishes-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m2-section-what-remains-an-inference-in-the-new-claim-4" data-response-part-id="A4-template-section-a4-m2-section-what-remains-an-inference-in-the-new-claim-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-what-remains-an-inference-in-the-new-claim-4-label" for="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-what-remains-an-inference-in-the-new-claim-4">What remains an inference in the new claim</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-what-remains-an-inference-in-the-new-claim-4-desc">Explain which additional conclusion about Q would require further evidence and why the available observations do not directly establish it.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-what-remains-an-inference-in-the-new-claim-4" name="learner-workspace-a4-a4-template-section-a4-m2-section-what-remains-an-inference-in-the-new-claim-4" rows="5" aria-describedby="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-what-remains-an-inference-in-the-new-claim-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m2-section-why-confidence-can-change-without-changing-the-event-5" data-response-part-id="A4-template-section-a4-m2-section-why-confidence-can-change-without-changing-the-event-5"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-why-confidence-can-change-without-changing-the-event-5-label" for="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-why-confidence-can-change-without-changing-the-event-5">Why confidence can change without changing the event</label><p class="util-learner-workspace__prompt" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-why-confidence-can-change-without-changing-the-event-5-desc">Compare the relationship between evidence, justification and confidence in the two investigations. Explain why a change in what an investigator reasonably believes does not itself change what happened.</p><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-why-confidence-can-change-without-changing-the-event-5" name="learner-workspace-a4-a4-template-section-a4-m2-section-why-confidence-can-change-without-changing-the-event-5" rows="6" aria-describedby="lj-c2--learner-workspace-a4-a4-template-section-a4-m2-section-why-confidence-can-change-without-changing-the-event-5-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c2--learner-check-a4" data-check-sidebar-open aria-controls="lj-c2--learner-check-a4" aria-expanded="false" aria-label="Check your work: Separate truth from justified belief">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c2--learner-check-a4" data-composition-moment="check" data-activity-id="A4" data-check-sidebar="available" aria-labelledby="lj-c2--learner-check-a4-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c2--learner-check-a4-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c2--learner-check-a4-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c2--learner-task-a4">Back to your task (Separate truth from justified belief)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A4-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a4-a4-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a4-m4-c-0" data-revision-criterion-id="a4-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you distinguished the truth of a proposition from the justification for believing it?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confusing the event with our knowledge of it makes changing evidence appear to change what happened.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response identifies the event that would make P true.</li><li><span class="util-guided-review__feature-key">B.</span> The response explains the role of available evidence in supporting or limiting belief.</li><li><span class="util-guided-review__feature-key">C.</span> The response distinguishes a change in justified confidence from a change in the underlying event.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State what must have occurred for P to correspond to reality, without treating the investigator&#39;s current belief as the event.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Describe how the disclosed observations provide grounds for judgement while leaving some aspects of the event unobserved.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain how an investigator&#39;s grounds for belief can change while the historical event under investigation remains fixed.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a4-a4-m4-item-0" data-checklist-item-id="checklist-a4-a4-m4-item-0"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a4-a4-m4-item-0">I have separated truth from justification</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a4-m4-c-1" data-revision-criterion-id="a4-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you accurately explained the significance of the Bellwether discrepancy?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The conceptual distinction depends on understanding what the clarified records establish and what they leave unresolved.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response recognises that the electronic record and the witness observation concern differently located departures.</li><li><span class="util-guided-review__feature-key">B.</span> The response does not treat reconciliation as proof that P is true or false.</li><li><span class="util-guided-review__feature-key">C.</span> The response distinguishes clearer interpretation from new evidence about the notebook itself.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Distinguish the Archive Room door from the wider corridor when explaining why the accounts can be reconciled.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify the narrow question resolved by the location distinction and separate it from the unresolved question of removal.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain what changed in the understanding of the records without claiming that the contents of the grey case became known.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a4-a4-m4-item-1" data-checklist-item-id="checklist-a4-a4-m4-item-1"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a4-a4-m4-item-1">My explanation respects the limits of the discrepancy</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a4-m4-c-2" data-revision-criterion-id="a4-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you applied the reasoning independently to the equipment-room claim?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Transfer requires using the distinction in a new situation rather than repeating the conclusion of the original investigation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response identifies the direct observations supplied by the equipment-room access record and witness.</li><li><span class="util-guided-review__feature-key">B.</span> The response identifies the additional inference required to reach Q.</li><li><span class="util-guided-review__feature-key">C.</span> The response offers a qualified judgement about evidential support rather than an unsupported verdict.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State separately what the record reports about room access and what the witness reports about the closed case.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain which claimed action goes beyond the recorded entry and observed case, and what kind of further evidence would bear on that action.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Assess how far the supplied observations support Q while acknowledging that the disputed removal was not directly recorded.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a4-a4-m4-item-2" data-checklist-item-id="checklist-a4-a4-m4-item-2"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a4-a4-m4-item-2">I have applied the reasoning to the new claim</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a4-m4-c-3" data-revision-criterion-id="a4-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you acknowledged uncertainty without treating it as falsity?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An unresolved claim can still have a definite truth value even when the available evidence does not justify certainty about it.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response identifies at least one material uncertainty in the equipment-room enquiry.</li><li><span class="util-guided-review__feature-key">B.</span> The response avoids claiming that insufficient evidence proves the disputed proposition false.</li><li><span class="util-guided-review__feature-key">C.</span> The response explains how new evidence could affect confidence without altering the past event.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name a missing fact that would matter to deciding whether the instrument was removed.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Distinguish the limits of current justification from a conclusion about what did not happen.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Connect a possible improvement in the evidence to a change in justified belief, while keeping the underlying occurrence conceptually separate.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c2--checklist-a4-a4-m4-item-3" data-checklist-item-id="checklist-a4-a4-m4-item-3"><label class="util-interactive-checklist__label" for="lj-c2--checklist-a4-a4-m4-item-3">My conclusion is appropriately qualified</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c2--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A4"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M3" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Apply the distinction to another claim</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-transfer-prompt-a4-m3-910" data-response-part-id="A4-transfer-prompt-a4-m3-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c2--learner-workspace-a4-a4-transfer-prompt-a4-m3-910-label" for="lj-c2--learner-workspace-a4-a4-transfer-prompt-a4-m3-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="lj-c2--learner-workspace-a4-a4-transfer-prompt-a4-m3-910-desc"><p>Imagine that you are advising the university department investigating proposition Q in the separate equipment-room scenario.</p><p>Write a short evidence-based explanation for the department that:</p><ol><li>Identifies what the access record and witness observation actually establish.</li><li>Distinguishes those observations from the claim that the instrument was removed from its storage cabinet.</li><li>Explains how far the available evidence justifies belief in Q and what remains uncertain.</li><li>Explains why later changes in confidence or justification would not, by themselves, change the event that actually occurred.</li></ol><p>Use the equipment-room evidence rather than importing facts from the Aster Notebook case. Do not assert that the instrument was or was not removed when the supplied evidence does not establish that outcome.</p><p>Record your explanation in the equipment-room fields of the response workspace.</p></div><textarea class="util-learner-workspace__input" id="lj-c2--learner-workspace-a4-a4-transfer-prompt-a4-m3-910" name="learner-workspace-a4-a4-transfer-prompt-a4-m3-910" rows="5" aria-describedby="lj-c2--learner-workspace-a4-a4-transfer-prompt-a4-m3-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><style id="lj-c2--prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;position:fixed;top:var(--learner-sticky-nav-height,0px);left:0;right:0;z-index:40;margin:0 auto;max-width:42rem;width:calc(100% - 1.5rem);padding:.45rem .75rem;border:1px solid #cbd5e1;border-left:3px solid #64748b;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.12)}.util-learner-renderer-vnext .util-revision-reminder__chrome{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.35rem .75rem;margin:0 0 .2rem}.util-learner-renderer-vnext .util-revision-reminder__label{margin:0;font-size:.75rem;font-weight:650;color:#64748b}.util-learner-renderer-vnext .util-revision-reminder__statement{margin:0;font-size:.9rem;line-height:1.4;font-weight:600;color:#0f172a}.util-learner-renderer-vnext .util-revision-reminder__view{font:inherit;font-size:.9rem;color:#1d4ed8;background:transparent;border:0;padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}.util-learner-renderer-vnext .util-revision-reminder__view:focus{outline:2px solid #2563eb;outline-offset:2px}</style><style id="lj-c2--prism-check-sidebar-css">.util-learner-renderer-vnext{--learner-reading-width:70ch;--learner-page-gutter:1rem}.util-learner-page.util-learner-renderer-vnext{width:min(calc(100% - 2 * var(--learner-page-gutter)),var(--learner-reading-width));margin-inline:auto;box-sizing:border-box}.util-check-sidebar-launch{margin:var(--learner-space-3,1rem) 0 0}.util-check-sidebar-launch__control{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.55rem 1rem;border:1px solid #93c5fd;border-radius:8px;background:#eff6ff;color:#1d4ed8;f width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-exposition-sections" data-region="exposition"><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S1" data-section-id="S1" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">One claim, two different questions</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>At the Bellwether Institute, the Aster Notebook has disappeared from its display cabinet. Investigators have testimony, an electronic security record and several possible interpretations of what happened. But before considering which explanation is most convincing, we need to be precise about the claim being investigated.</p><p>The central proposition is:</p><p>P: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot;</p><p>A proposition is something that can be true or false. It makes a claim about how things are or what happened. The truth condition of a proposition is what would have to be the case for that proposition to be true.</p><p>For P to be true, Mara must have removed the Aster Notebook from its display cabinet before 18:00 on 14 May. If she did not do that, P is false. This is a question about the event itself, not about how persuasive the available evidence appears.</p><p>Notice what P does not say. It does not claim that Mara stole the notebook, acted dishonestly or intended to keep it. Removing an object and stealing it are different claims. Mara&#39;s statement, &quot;I was dealing with conservation preparations. I did not steal the notebook,&quot; addresses theft, but it does not by itself settle whether she removed the notebook.</p><p>We can now separate two questions. First, what would make P true? The answer concerns what actually happened. Second, what would justify believing P? That answer concerns the evidence available to an investigator and the reasoning used to interpret it.</p><p>If you completed The case opens: Your first judgement and A witness, a record and a contradiction, revisit your own initial judgement, the reasons you gave and your interpretation of the conflicting departure times. Keep those earlier ideas in mind as you read. They provide a way to examine the difference between a conclusion and the reasons supporting it, regardless of whether you accepted P, rejected it or remained uncertain.</p><p>The investigation therefore involves two related but different tasks: understanding what would make the proposition true and deciding what the available evidence gives us reason to believe.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S2" data-section-id="S2" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Being right is not the same as having good reasons</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>A belief is something a person accepts as true. Someone might believe P because Mara had authorised access to the Archive Room and Elias reported seeing her carrying a rectangular grey case. Another person might remain unconvinced because nobody has established what was inside the case.</p><p>Evidence is information relevant to assessing a claim. Justification concerns whether the available evidence provides adequate reasons for believing it. These are not the same as truth. Truth concerns whether the proposition is true; justification concerns whether accepting it is reasonable on the information available.</p><p>Consider Mara&#39;s authorised access. It establishes that she could enter the Archive Room. That is relevant evidence because it concerns opportunity. But being able to perform an action does not establish that the action occurred. The inference from &quot;Mara had access&quot; to &quot;Mara removed the notebook&quot; needs further support.</p><p>Two possibilities reveal why truth and justification must be distinguished.</p><p>First, suppose a proposition is true but the investigator has very little evidence for it. The investigator may have no adequate reason to believe the proposition, even though it correctly describes reality. In the Aster Notebook case, we can consider the conditional possibility that P is true while the initially available evidence remains insufficient to establish it. This is a conceptual possibility, not a disclosure of what happened.</p><p>Second, imagine a different, entirely hypothetical investigation in which a witness makes a careful identification under apparently reliable conditions. An investigator reasonably accepts the identification. Later, it turns out that the witness was mistaken. The investigator&#39;s belief may have been justified by the evidence available at the time, yet the belief was false.</p><p>These examples show why a responsible judgement and a correct judgement are not always the same achievement.</p><p>Certainty introduces another distinction. A person can feel completely certain and still be wrong. This is subjective certainty: the strength of someone&#39;s conviction. Evidential confidence, by contrast, concerns how strongly the available reasons support a conclusion. Logical certainty is stronger still: a conclusion follows necessarily from accepted premises through valid reasoning. Ordinary investigative evidence rarely provides that kind of guarantee.</p><p>Several pieces of evidence may increase confidence, but their quality matters more than their number. Repeated versions of one mistaken observation do not necessarily provide independent confirmation. Nor does a confident witness automatically provide conclusive evidence.</p><p>An investigator can therefore have good reasons without having proof, or reach the correct conclusion without having adequate reasons. The task is to assess what the evidence supports while recognising that evidence and interpretation can be fallible.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-S2-01" data-material-kind="Conceptual contrast matrix" data-material-type="expository_structured_table" data-section-id="S2" data-expository-structured="table"><h3>Truth and justification: Four possibilities</h3><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Is the proposition true?</th><th scope="col">Is believing it justified?</th><th scope="col">What this means</th></tr></thead><tbody><tr><td>True</td><td>Justified</td><td>The proposition accurately describes reality, and the available evidence provides adequate reasons for believing it.</td></tr><tr><td>True</td><td>Unjustified</td><td>The proposition accurately describes reality, but the person believing it lacks adequate supporting reasons. The belief is correct without being adequately justified.</td></tr><tr><td>False</td><td>Justified</td><td>The proposition does not accurately describe reality, but the available evidence provides reasonable grounds for accepting it. The person has good reasons but reaches a mistaken conclusion.</td></tr><tr><td>False</td><td>Unjustified</td><td>The proposition does not accurately describe reality, and the person lacks adequate reasons for believing it.</td></tr></tbody></table></div><section><h4>Linear text equivalent</h4><ul><li>Possibility 1: True and justified. A proposition describes what actually happened, and the available evidence adequately supports believing it.</li><li>Possibility 2: True but unjustified. A proposition describes what actually happened, but the person believing it does not have adequate evidence. Being right does not necessarily mean having good reasons.</li><li>Possibility 3: False but justified. A proposition does not describe what actually happened, but the available evidence reasonably supports believing it. A responsible judgement can still be mistaken.</li><li>Possibility 4: False and unjustified. A proposition does not describe what actually happened, and there are no adequate reasons for accepting it.</li></ul></section><div><p><strong>Closing text</strong></p><p>The four combinations are logically possible because truth concerns the proposition&#39;s relationship to reality, while justification concerns the reasons available to a believer. A person&#39;s certainty does not determine either dimension. The table does not identify which combination applies to proposition P.</p></div></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S3" data-section-id="S3" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">What did the witness and the record actually establish?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The difference between observation and interpretation becomes clearer when we examine the two accounts of Mara&#39;s departure.</p><p>The electronic Archive Room door log records Mara entering at 17:05 and leaving at 17:21.</p><p>Elias Reed&#39;s original written incident note states: &quot;I saw Mara leave the Archive Room at 17:25 carrying a grey case.&quot;</p><p>At first, these accounts appear inconsistent. The electronic record places Mara&#39;s departure at 17:21, while Elias&#39;s note places it at 17:25. If both descriptions referred to the same doorway and the same departure, the difference would require explanation.</p><p>But the Archive Room and the wider archive corridor are not the same location. The door log records Mara leaving the Archive Room. Elias observed her leaving the wider archive corridor at approximately 17:25. His written note conflated the two locations.</p><p>This distinction explains how both timings can be compatible. Mara could leave the Archive Room at 17:21 and be observed leaving the archive corridor at approximately 17:25. We do not need to conclude that Elias invented his observation to understand the discrepancy.</p><p>The example also reveals different layers of reasoning. An observation or record provides information: a recorded door event, or a witness&#39;s report of someone carrying a case. Interpretation concerns what that information means. An inference moves from the information towards a conclusion, such as whether Mara removed the notebook.</p><p>The electronic log establishes recorded entry and exit times, not whether Mara opened the display cabinet. Elias&#39;s observation concerns Mara carrying a grey case, not its contents. Neither source, considered alone, establishes P.</p><p>It would therefore be a mistake to reason that the door log proves Elias was lying. It would also be a mistake to reason that the grey case must have contained the notebook. Both conclusions go beyond what the evidence establishes.</p><p>Resolving the apparent contradiction improves our interpretation of the evidence. It does not settle the investigation. Several possible accounts remain compatible with what has been disclosed. Philosophers sometimes describe this situation as underdetermination: the available evidence does not uniquely determine which explanation is correct.</p><p>This is how an investigator&#39;s justification can change without any change in the underlying event. A record may initially seem to undermine a witness. A more precise understanding of locations may reduce that concern. The evidence has not changed, but the interpretation of its significance has become more careful.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-S3-01" data-material-kind="Source-and-inference comparison" data-material-type="expository_structured_table" data-section-id="S3" data-expository-structured="table"><h3>Two departure times: What the evidence supports</h3><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Source</th><th scope="col">Recorded or reported information</th><th scope="col">What it supports</th><th scope="col">What it does not establish</th></tr></thead><tbody><tr><td>Electronic Archive Room door log</td><td>Mara Vale entered the Archive Room at 17:05 and left at 17:21.</td><td>The electronic record places Mara&#39;s departure from the Archive Room at 17:21.</td><td>The log does not establish whether Mara opened the display cabinet, removed the Aster Notebook or carried it away.</td></tr><tr><td>Elias Reed&#39;s original written incident note</td><td>&quot;I saw Mara leave the Archive Room at 17:25 carrying a grey case.&quot;</td><td>Elias reported seeing Mara carrying a grey case at 17:25. The location in his written note conflates the Archive Room with the wider archive corridor, where he observed her leaving.</td><td>His observation does not establish what was inside the case. The imprecise location description does not, by itself, establish that he fabricated his account.</td></tr></tbody></table></div><section><h4>Why the two times need not conflict</h4><section><h4>Steps</h4><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Sequence</th><th scope="col">Location</th><th scope="col">Time</th><th scope="col">Description</th></tr></thead><tbody><tr><td>1</td><td>Archive Room</td><td>17:21</td><td>The log records Mara leaving the Archive Room.</td></tr><tr><td>2</td><td>Wider archive corridor</td><td>Approximately 17:25</td><td>Elias observes Mara leaving the archive corridor carrying a rectangular grey case.</td></tr></tbody></table></div></section><div><p><strong>Explanation</strong></p><p>Leaving the Archive Room and leaving the wider archive corridor are different events. The location distinction explains how the two departure times can be compatible. Elias&#39;s written description of the location was imprecise; that does not require his reported observation to have been invented.</p></div></section><section><h4>Reasoning boundaries</h4><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Inference</th><th scope="col">Evaluation</th><th scope="col">Reason</th></tr></thead><tbody><tr><td>The electronic record contradicts Elias&#39;s observation, so Elias must have lied.</td><td>Not established.</td><td>The apparent contradiction is explained by the difference between the Archive Room door and the wider archive corridor. An imprecise description does not prove deliberate fabrication.</td></tr><tr><td>Elias saw Mara carrying a grey case, so the case contained the Aster Notebook.</td><td>Not established.</td><td>Elias reported seeing the case, not its contents. The contents remain unknown.</td></tr><tr><td>The departure-time discrepancy can be reconciled, so proposition P has been proved.</td><td>Not established.</td><td>Explaining the timing discrepancy improves the interpretation of the testimony. It does not establish whether Mara removed the notebook from its display cabinet.</td></tr></tbody></table></div></section><section><h4>Linear text equivalent</h4><ul><li>Electronic record: The Archive Room door log shows Mara entering at 17:05 and leaving at 17:21. This records entry and exit at the Archive Room, not removal of the notebook.</li><li>Witness note: Elias Reed wrote, &quot;I saw Mara leave the Archive Room at 17:25 carrying a grey case.&quot; His note describes the Archive Room, but his observation concerned Mara leaving the wider archive corridor.</li><li>Location distinction: The Archive Room and the wider archive corridor are separate locations. A departure from the Archive Room at 17:21 is compatible with an observation in the corridor at approximately 17:25.</li><li>First limit: The discrepancy does not prove that Elias fabricated his account.</li><li>Second limit: Seeing Mara carrying a grey case does not establish what the case contained.</li><li>Third limit: Reconciling the two accounts does not determine whether proposition P is true.</li></ul></section><div><p><strong>Closing text</strong></p><p>A more accurate interpretation of the locations reduces the apparent inconsistency between the sources. It does not add evidence about the contents of the case or settle the central proposition. The improvement is in the investigator&#39;s understanding of the existing evidence.</p></div></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S4" data-section-id="S4" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">A convincing explanation can still be wrong</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The door-log discrepancy can be explained without treating either recorded time as false. The two accounts fit together more successfully once we distinguish the Archive Room from the archive corridor. This is an improvement in coherence.</p><p>Coherence concerns how beliefs or propositions relate to one another. A coherent set of claims is not simply a story that sounds convincing. Its parts must be consistent and support one another within a wider system of beliefs or propositions.</p><p>But coherence is not the same as accuracy. Consider a hypothetical explanation: suppose an investigator assumes that the grey case contained the Aster Notebook. That assumption could be combined with Mara&#39;s authorised access and Elias&#39;s observation to produce an apparently consistent account of the disappearance.</p><p>The difficulty is that the contents of the case have not been established. The explanation may fit together while relying on an unsupported assumption. Even a highly coherent account can misrepresent reality.</p><p>A related distinction concerns usefulness. An investigator might provisionally consider the hypothesis that the case contained the notebook. This could be useful because it suggests what further evidence might be relevant. But the hypothesis does not become true simply because it gives the investigation a direction.</p><p>The same applies outside detective work. A proposed explanation may help someone organise observations or decide what to examine next, yet later turn out to be mistaken. Practical value and factual accuracy are different properties.</p><p>Coherence and usefulness therefore have legitimate roles in enquiry. Coherence helps us identify inconsistencies and examine relationships among claims. Usefulness helps us decide which questions or possibilities may be productive to investigate. Neither, by itself, establishes what happened.</p><p>These distinctions prepare us to consider philosophical theories that give coherence and practical consequences a more fundamental role in understanding truth. Those theories are more demanding than the simple claims that a convincing story must be true or that whatever works is true.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c3--exposition-S5" data-section-id="S5" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" a
