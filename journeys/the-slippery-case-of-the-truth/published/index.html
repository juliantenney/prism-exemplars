</div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c1--a2-a2-m2-input-r1-c1" name="a2-a2-m2-input-r1-c1" data-learner-cell="a2-a2-m2-input-r1-c1" rows="3" aria-label="Response field, row 2, column What is directly reported?" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c1--a2-a2-m2-input-r1-c2" name="a2-a2-m2-input-r1-c2" data-learner-cell="a2-a2-m2-input-r1-c2" rows="3" aria-label="Response field, row 2, column What might this suggest about P?" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c1--a2-a2-m2-input-r1-c3" name="a2-a2-m2-input-r1-c3" data-learner-cell="a2-a2-m2-input-r1-c3" rows="3" aria-label="Response field, row 2, column What remains uncertain?" autocomplete="off"></textarea></div></td></tr><tr><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c1--a2-a2-m2-input-r2-c0" name="a2-a2-m2-input-r2-c0" data-learner-cell="a2-a2-m2-input-r2-c0" rows="3" aria-label="Response field, row 3, column Source or evidence" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c1--a2-a2-m2-input-r2-c1" name="a2-a2-m2-input-r2-c1" data-learner-cell="a2-a2-m2-input-r2-c1" rows="3" aria-label="Response field, row 3, column What is directly reported?" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c1--a2-a2-m2-input-r2-c2" name="a2-a2-m2-input-r2-c2" data-learner-cell="a2-a2-m2-input-r2-c2" rows="3" aria-label="Response field, row 3, column What might this suggest about P?" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c1--a2-a2-m2-input-r2-c3" name="a2-a2-m2-input-r2-c3" data-learner-cell="a2-a2-m2-input-r2-c3" rows="3" aria-label="Response field, row 3, column What remains uncertain?" autocomplete="off"></textarea></div></td></tr><tr><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c1--a2-a2-m2-input-r3-c0" name="a2-a2-m2-input-r3-c0" data-learner-cell="a2-a2-m2-input-r3-c0" rows="3" aria-label="Response field, row 4, column Source or evidence" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c1--a2-a2-m2-input-r3-c1" name="a2-a2-m2-input-r3-c1" data-learner-cell="a2-a2-m2-input-r3-c1" rows="3" aria-label="Response field, row 4, column What is directly reported?" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c1--a2-a2-m2-input-r3-c2" name="a2-a2-m2-input-r3-c2" data-learner-cell="a2-a2-m2-input-r3-c2" rows="3" aria-label="Response field, row 4, column What might this suggest about P?" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c1--a2-a2-m2-input-r3-c3" name="a2-a2-m2-input-r3-c3" data-learner-cell="a2-a2-m2-input-r3-c3" rows="3" aria-label="Response field, row 4, column What remains uncertain?" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify which evidence you would give most weight to at this stage, without making your final judgement yet.</p></span></div><article class="util-prompt-set util-prose-measure" data-material-id="A2-M3" data-material-type="prompt_set" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-prompt-set-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"></path></svg></span><span class="util-semantic-icon__label">Weigh two accounts</span></p><p>Choose at least two items from the initial dossier, including evidence from different sources where possible.</p><p>Write a short comparison explaining which item you currently give more weight when considering P and why. Refer to the particular observations or statements rather than relying on general impressions of the people involved.</p><p>In your comparison, distinguish having an opportunity to remove the notebook from evidence that the removal actually occurred. Explain one limitation that prevents your preferred item from settling the question on its own.</p><p>Your comparison:</p></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>An evidence analysis containing at least three accurately attributed entries. Each entry distinguishes reported information from an inference about P and identifies a relevant limitation or missing fact. The analysis compares the strength of the accounts rather than merely repeating them, and identifies a defensible reason for giving particular evidence greater or lesser weight. It does not treat the grey case&#39;s contents or the unidentified person&#39;s identity as established.</p></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c1--learner-check-a2" data-check-sidebar-open aria-controls="lj-c1--learner-check-a2" aria-expanded="false" aria-label="Check your work: Examine the opening evidence">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c1--learner-check-a2" data-composition-moment="check" data-activity-id="A2" data-check-sidebar="available" aria-labelledby="lj-c1--learner-check-a2-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c1--learner-check-a2-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c1--learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c1--learner-task-a2">Back to your task (Examine the opening evidence)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m4-c-0" data-revision-criterion-id="a2-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you attributed the evidence accurately to its source?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Misattribution can make a second-hand report appear to be a direct observation or assign a witness knowledge they have not claimed.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each selected dossier item is linked to the correct person or evidential status.</li><li><span class="util-guided-review__feature-key">B.</span> Reported times, places and descriptions retain their original limits.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Match each entry to the named source in the dossier and distinguish the access-status information from a witness&#39;s statement.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Check the exact time and location in each selected item; retain qualifications such as &#39;approximately&#39; and avoid changing a corridor observation into an observation inside the Archive Room.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a2-a2-m4-item-0" data-checklist-item-id="checklist-a2-a2-m4-item-0"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a2-a2-m4-item-0">My evidence is accurately attributed</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m4-c-1" data-revision-criterion-id="a2-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you kept reported observations separate from inferences about P?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An inference may be reasonable without being directly observed; confusing the two overstates what the available evidence establishes.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The direct-report column contains what the source actually reports rather than my conclusion about removal.</li><li><span class="util-guided-review__feature-key">B.</span> My inference column explains how a reported detail could bear on the action specified by P.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Move any statement about what the notebook&#39;s disappearance means into the inference column unless that statement was itself directly reported.</li><li><span class="util-guided-review__feature-key">Missing B:</span> For each inference, connect the particular observation to the question of removal from the cabinet before 18:00 rather than merely repeating the evidence.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a2-a2-m4-item-1" data-checklist-item-id="checklist-a2-a2-m4-item-1"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a2-a2-m4-item-1">My observations and inferences are distinct</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m4-c-2" data-revision-criterion-id="a2-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you identified meaningful uncertainty rather than filling gaps with assumptions?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The credibility of a provisional interpretation depends partly on recognising what the initial reports do not establish.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My analysis identifies at least one material fact that the selected evidence does not settle.</li><li><span class="util-guided-review__feature-key">B.</span> I have not treated authorised access as a direct observation of removal.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name a specific unknown relevant to your inference, such as the contents of an observed object or the identity of a person who was not recognised.</li><li><span class="util-guided-review__feature-key">Missing B:</span> If your analysis moves from access to removal, identify the additional evidential step that would be needed.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a2-a2-m4-item-2" data-checklist-item-id="checklist-a2-a2-m4-item-2"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a2-a2-m4-item-2">My analysis recognises evidential limits</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m4-c-3" data-revision-criterion-id="a2-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you justified the relative weight you give the accounts?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A comparison that merely names a preferred witness does not show why one item is more informative about the disputed proposition.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My comparison names at least two specific dossier items.</li><li><span class="util-guided-review__feature-key">B.</span> I explain how relevance or directness affects the weight I assign.</li><li><span class="util-guided-review__feature-key">C.</span> I acknowledge a limitation of the item I favour.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the two observations or statements you are weighing and cite the details relevant to P.</li><li><span class="util-guided-review__feature-key">Missing B:</span> State why a particular detail bears more or less closely on removal from the cabinet, rather than relying on a general impression of a witness.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify one unanswered question or alternative interpretation that prevents the preferred item from establishing P by itself.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a2-a2-m4-item-3" data-checklist-item-id="checklist-a2-a2-m4-item-3"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a2-a2-m4-item-3">My comparison gives evidence-based reasons</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c1--activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Record your provisional judgement</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">You have defined the precise claim and examined how the available accounts support different inferences. Now bring those two capabilities together: decide what the evidence currently justifies, identify the strongest reason for your position and record a question that could matter when you reconsider the case.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Detective Mercer asks for your first judgement. You have only the opening evidence, and some important facts remain unknown. Your responsibility is to reach a reasoned provisional position, not to solve the disappearance or prove a particular person dishonest. A carefully justified uncertain judgement is as legitimate as a cautiously supported one. Allow approximately 5 minutes.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Weigh relevance, reliability and limitations together. You do not need certainty to make a provisional judgement, but you should be able to explain why the available evidence warrants your chosen degree of confidence. The correctness of your reasoning is not determined by whether you happen to guess the underlying event.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">What is the strongest reason for your present position, what is the most important thing you still do not know, and how might learning it affect your confidence?</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c1--learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="lj-c1--learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="lj-c1--learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c1--learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c1--learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="lj-c1--learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c1--learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Re-examine the initial evidence and your analysis. Choose whether P is supported, not supported or remains uncertain on the information currently available.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A3-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated evidence for your judgement</span></p><h3 class="util-md-heading util-md-heading--source-2">Initial evidence reference</h3><p>This simulated evidence belongs to the fictional Bellwether Institute investigation. It contains the same six opening items, with no additional findings.</p><ol><li>Dr Rowan Bell, curator: Dr Bell confirmed the Aster Notebook present in its locked display cabinet at 16:40 on 14 May and found the cabinet empty at 18:20.</li><li>Access status: Mara Vale had authorised access to the Archive Room that afternoon.</li><li>Elias Reed, security officer: Elias reports seeing Mara leaving the archive corridor at approximately 17:25 carrying a rectangular grey case. The contents of the case are not established.</li><li>Mara Vale: &quot;I was dealing with conservation preparations. I did not steal the notebook.&quot;</li><li>Nina Shah, visiting researcher: Nina reports seeing someone in a dark jacket near the archive corridor but cannot identify the person.</li><li>Investigative status: The notebook&#39;s whereabouts are unknown to the investigator at this point.</li></ol><p>The proposition under consideration remains:</p><p>&gt; Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.</p><p>Use this reference to support your own provisional judgement. No conclusion is supplied.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Write your own provisional judgement in a short paragraph, explaining your strongest evidential reason and identifying at least one limitation or alternative interpretation.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M2" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Your first judgement</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>State one specific unresolved question whose answer could strengthen or challenge your judgement.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M5" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Your public-facing alternative</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Briefly indicate your confidence and explain why it is not necessarily the same as certainty.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A3-M4" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Simulated headline and source details</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-2">A hypothetical headline</h3><p>The following headline is invented for this learning activity. It is not an authentic publication or an additional report about the investigation.</p><p>&gt; Mara was seen with a grey case, so she stole the Aster Notebook.</p><h3 class="util-md-heading util-md-heading--source-2">Initial evidence relevant to the headline</h3><h3 class="util-md-heading util-md-heading--source-3">Elias Reed, security officer</h3><p>Elias reports seeing Mara leaving the archive corridor at approximately 17:25 carrying a rectangular grey case.</p><p>The contents of the case are not established.</p><h3 class="util-md-heading util-md-heading--source-3">Mara Vale&#39;s statement</h3><p>&gt; I was dealing with conservation preparations. I did not steal the notebook.</p><p>Compare the headline with these attributed particulars. Consider which words describe what Elias reports and which words make a further allegation. Use only the supplied information when drafting your alternative.</p></article></li></ol></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Apply the same distinction between a reported action and an allegation of wrongdoing to a separate short claim about the case, without changing your judgement about P.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A meaningful learner-authored initial judgement that explicitly states a defensible position on P, identifies and accurately uses the strongest relevant initial evidence, acknowledges a material evidential limitation or alternative interpretation, and formulates a specific unresolved investigative question. The response distinguishes confidence from certainty and avoids asserting theft or intention without support. A brief separate application correctly distinguishes a claim about an observable action from an additional allegation about wrongdoing. The judgement remains provisional and suitable for later reconsideration.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-constructed-E1" data-response-part-id="E1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-constructed-E1-label" for="lj-c1--learner-constructed-E1">My provisional position</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-constructed-E1-desc">State your current position on P in your own words. Keep the claim about removal separate from any allegation of theft.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-constructed-E1" name="learner-constructed-E1" rows="6" aria-describedby="lj-c1--learner-constructed-E1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m5-section-what-the-headline-adds-1" data-response-part-id="A3-template-section-a3-m5-section-what-the-headline-adds-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-what-the-headline-adds-1-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-what-the-headline-adds-1">What the headline adds</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-what-the-headline-adds-1-desc">Identify the further allegation and explain how it goes beyond what Elias reports. Refer to the limits of the available information.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-what-the-headline-adds-1" name="learner-workspace-a3-a3-template-section-a3-m5-section-what-the-headline-adds-1" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-what-the-headline-adds-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-my-strongest-evidential-reason-2" data-response-part-id="A3-template-section-a3-m2-section-my-strongest-evidential-reason-2"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-my-strongest-evidential-reason-2-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-my-strongest-evidential-reason-2">My strongest evidential reason</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-my-strongest-evidential-reason-2-desc">Identify the source and particular detail you consider most relevant. Explain how it bears on the action and time specified in P, and why you give it weight.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-my-strongest-evidential-reason-2" name="learner-workspace-a3-a3-template-section-a3-m2-section-my-strongest-evidential-reason-2" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-my-strongest-evidential-reason-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m5-section-my-evidence-bounded-alternative-2" data-response-part-id="A3-template-section-a3-m5-section-my-evidence-bounded-alternative-2"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-my-evidence-bounded-alternative-2-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-my-evidence-bounded-alternative-2">My evidence-bounded alternative</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-my-evidence-bounded-alternative-2-desc">Write a replacement headline or single sentence suitable for readers who have not seen the case file. Preserve relevant reported information and avoid introducing an unsupported fact or intention.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-my-evidence-bounded-alternative-2" name="learner-workspace-a3-a3-template-section-a3-m5-section-my-evidence-bounded-alternative-2" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m5-section-my-evidence-bounded-alternative-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-an-important-limitation-or-alternative-3" data-response-part-id="A3-template-section-a3-m2-section-an-important-limitation-or-alternative-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-an-important-limitation-or-alternative-3-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-an-important-limitation-or-alternative-3">An important limitation or alternative</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-an-important-limitation-or-alternative-3-desc">Identify a missing fact, a possible alternative interpretation or a reason the evidence may be less decisive than it first appears. Explain how this limits your position.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-an-important-limitation-or-alternative-3" name="learner-workspace-a3-a3-template-section-a3-m2-section-an-important-limitation-or-alternative-3" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-an-important-limitation-or-alternative-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-my-unresolved-question-4" data-response-part-id="A3-template-section-a3-m2-section-my-unresolved-question-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-my-unresolved-question-4-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-my-unresolved-question-4">My unresolved question</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-my-unresolved-question-4-desc">Write one specific question that further investigation could answer. Explain briefly how the answer might strengthen or challenge your current view.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-my-unresolved-question-4" name="learner-workspace-a3-a3-template-section-a3-m2-section-my-unresolved-question-4" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-my-unresolved-question-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-my-confidence-and-why-5" data-response-part-id="A3-template-section-a3-m2-section-my-confidence-and-why-5"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-my-confidence-and-why-5-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-my-confidence-and-why-5">My confidence and why</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-my-confidence-and-why-5-desc">Describe how confident you are in your provisional position. Connect that confidence to the strength and limitations of the available evidence, without treating confidence as certainty.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-my-confidence-and-why-5" name="learner-workspace-a3-a3-template-section-a3-m2-section-my-confidence-and-why-5" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m2-section-my-confidence-and-why-5-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c1--learner-check-a3" data-check-sidebar-open aria-controls="lj-c1--learner-check-a3" aria-expanded="false" aria-label="Check your work: Record your provisional judgement">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c1--learner-check-a3" data-composition-moment="check" data-activity-id="A3" data-check-sidebar="available" aria-labelledby="lj-c1--learner-check-a3-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c1--learner-check-a3-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c1--learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c1--learner-task-a3">Back to your task (Record your provisional judgement)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M6" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m6" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m6-c-0" data-revision-criterion-id="a3-m6-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Does your first judgement state a defensible, appropriately bounded position on P?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without an explicit position tied to the actual proposition, the response cannot show what you currently judge the initial evidence to justify.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My position identifies P as the claim about Mara removing the notebook before 18:00 on 14 May.</li><li><span class="util-guided-review__feature-key">B.</span> My response makes clear whether I regard P as supported, not supported or uncertain.</li><li><span class="util-guided-review__feature-key">C.</span> My stated position is proportionate to the evidence I discuss.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State your position in relation to that precise removal claim rather than an accusation of theft or a general question about who is responsible.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name your provisional position explicitly and ensure that the wording does not imply a firmer conclusion than your reasons justify.</li><li><span class="util-guided-review__feature-key">Missing C:</span> If your reasons contain substantial unresolved gaps, reconsider whether your wording or confidence should acknowledge those limits more clearly.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a3-a3-m6-item-0" data-checklist-item-id="checklist-a3-a3-m6-item-0"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a3-a3-m6-item-0">My position is explicit and appropriately bounded</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m6-c-1" data-revision-criterion-id="a3-m6-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you used the strongest relevant evidence accurately and explained its weight?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A judgement needs a traceable evidential basis; simply naming a witness or repeating an observation does not explain why the conclusion is warranted.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My strongest reason identifies a specific source and reported detail.</li><li><span class="util-guided-review__feature-key">B.</span> I connect that detail to the removal action and time boundary in P.</li><li><span class="util-guided-review__feature-key">C.</span> I explain why the selected detail deserves the weight I assign it.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the person or evidential status and the particular observation or statement on which your reason depends.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain how the cited detail bears on removal from the cabinet before 18:00, distinguishing that connection from evidence of access or a different allegation.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Give a reason based on the observation&#39;s relevance or limits rather than relying solely on the witness&#39;s identity or your impression of the account.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a3-a3-m6-item-1" data-checklist-item-id="checklist-a3-a3-m6-item-1"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a3-a3-m6-item-1">My strongest reason is evidence-based</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m6-c-2" data-revision-criterion-id="a3-m6-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you acknowledged a material limitation, asked an investigable question and calibrated your confidence?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>These elements make the judgement genuinely provisional and create a reasoned basis for reconsidering it when further evidence becomes available.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My response identifies a specific uncertainty or alternative interpretation.</li><li><span class="util-guided-review__feature-key">B.</span> My unresolved question could be answered by further investigation and would matter to P.</li><li><span class="util-guided-review__feature-key">C.</span> My confidence statement reflects both evidential support and unresolved limits.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name a missing fact or plausible alternative reading that could affect the inference from your chosen evidence.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Turn a broad request for &#39;more evidence&#39; into a specific question about an unknown fact and indicate how its answer could affect your position.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain why the available observations warrant your chosen confidence level while distinguishing confidence from certainty.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a3-a3-m6-item-2" data-checklist-item-id="checklist-a3-a3-m6-item-2"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a3-a3-m6-item-2">My judgement is appropriately provisional</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m6-c-3" data-revision-criterion-id="a3-m6-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Does your public-facing alternative distinguish a reported observation from an allegation of wrongdoing?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A public statement can mislead readers if it converts a limited witness report into an established accusation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> I identify the allegation added by the hypothetical headline.</li><li><span class="util-guided-review__feature-key">B.</span> My replacement retains the attribution and relevant limits of the observation.</li><li><span class="util-guided-review__feature-key">C.</span> My replacement does not invent facts or treat intention as established.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Point to the claim of theft and distinguish it from the narrower observation attributed to Elias.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Check that the revised wording makes clear who reported the observation and does not claim knowledge of the grey case&#39;s contents.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Remove any assertion about the notebook&#39;s location, what the case contained or Mara&#39;s intentions unless the supplied particulars establish it.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a3-a3-m6-item-3" data-checklist-item-id="checklist-a3-a3-m6-item-3"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a3-a3-m6-item-3">My public-facing statement stays within the evidence</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><div class="util-verified-review" data-verified-review><button type="button" class="util-verified-review__toggle" data-verified-review-toggle data-verified-review-label="View verified feedback" data-verified-review-back="Back to review" aria-expanded="false" aria-controls="lj-c1--verified-review-a3">View verified feedback</button><div class="util-verified-review__panel" id="lj-c1--verified-review-a3" data-verified-review-panel><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Reveal verified feedback</summary><div class="util-composition-reveal__body"><article class="util-material-block util-prose-measure" data-material-id="A3-M7" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Review after your first judgement</span></p><h3 class="util-md-heading util-md-heading--source-2">Review after completing your judgement</h3><p>Detective Mercer responds:</p><p>&quot;Your first judgement is a record of what you think the evidence currently justifies. It is not a test of whether you can guess an undisclosed outcome.</p><p>&quot;A provisional judgement may favour P, question it or remain uncertain. What matters is whether you can identify the evidence you relied on, explain its relevance and recognise where the available accounts leave room for other interpretations.</p><p>&quot;Notice how different questions require different evidence. Whether someone removed the notebook, whether that action amounted to theft and what the person intended are not the same proposition. A witness&#39;s reported observation may be relevant without establishing every conclusion someone draws from it.</p><p>&quot;You may later have good reasons to change your view. New evidence can alter what it is reasonable to believe without changing what actually happened.&quot;</p><h3 class="util-md-heading util-md-heading--source-3">Debrief</h3><p>Compare your judgement with the evidence you cited. If your strongest reason depends on an unknown detail, make that dependence explicit. If you chose uncertainty, check that you have identified the particular uncertainty rather than using it to avoid evaluating the evidence.</p><p>Keep your own wording available for comparison in &#39;Reconsidering your judgement&#39;. There, you will be able to examine what you initially thought, which later evidence or reasoning challenges or confirms that view, and what you then conclude. The value of the comparison lies in explaining any change or continuity in your reasoning, not in pretending that your initial judgement was more certain than it was.</p><h3 class="util-md-heading util-md-heading--source-3">Page learner-resource closure</h3><ul><li>Keep proposition P precise: it concerns removal from the display cabinet before 18:00 on 14 May, not an automatic allegation of theft.</li><li>Separate what a source reports from what you infer. Identify the missing information whenever an inference goes beyond the observation.</li><li>Make your provisional judgement proportionate to the evidence: give your strongest reason, acknowledge a limitation and explain your confidence.</li><li>Retain your initial reasoning as a point of comparison when the investigation develops; changing a justified belief is different from changing the past.</li></ul></article></div></details></div></div></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A3"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M3" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Reframe a public accusation</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-transfer-prompt-a3-m3-910" data-response-part-id="A3-transfer-prompt-a3-m3-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-transfer-prompt-a3-m3-910-label" for="lj-c1--learner-workspace-a3-a3-transfer-prompt-a3-m3-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="lj-c1--learner-workspace-a3-a3-transfer-prompt-a3-m3-910-desc"><p>Imagine that a public-facing headline about the fictional investigation reads:</p><p>&gt; Mara was seen with a grey case, so she stole the Aster Notebook.</p><p>A headline addresses readers who may not have examined the evidence. Your task is different from deciding whether proposition P is supported: you must decide what can responsibly be communicated to that audience.</p><p>Using the attributed details on the accompanying task card, identify the allegation the headline adds beyond the reported observation. Explain why the observation alone does not establish that allegation. Then write a replacement headline or single sentence that keeps the relevant reported information without presenting an unsupported conclusion as fact.</p><p>Use the separate response fields for your analysis and replacement wording. Do not add new facts.</p></div><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-transfer-prompt-a3-m3-910" name="learner-workspace-a3-a3-transfer-prompt-a3-m3-910" rows="5" aria-describedby="lj-c1--learner-workspace-a3-a3-transfer-prompt-a3-m3-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><style id="lj-c1--prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;position:fixed;top:var(--learner-sticky-nav-height,0px);left:0;right:0;z-index:40;margin:0 auto;max-width:42rem;width:calc(100% - 1.5rem);padding:.45rem .75rem;border:1px solid #cbd5e1;border-left:3px solid #64748b;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.12)}.util-learner-renderer-vnext .util-revision-reminder__chrome{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.35rem .75rem;margin:0 0 .2rem}.util-learner-renderer-vnext .util-revision-reminder__label{margin:0;font-size:.75rem;font-weight:650;color:#64748b}.util-learner-renderer-vnext .util-revision-reminder__statement{margin:0;font-size:.9rem;line-height:1.4;font-weight:600;color:#0f172a}.util-learner-renderer-vnext .util-revision-reminder__view{font:inherit;font-size:.9rem;color:#1d4ed8;background:transparent;border:0;padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}.util-learner-renderer-vnext .util-revision-reminder__view:focus{outline:2px solid #2563eb;outline-offset:2px}</style><style id="lj-c1--prism-check-sidebar-css">.util-learner-renderer-vnext{--learner-reading-width:70ch;--learner-page-gutter:1rem}.util-learner-page.util-learner-renderer-vnext{width:min(calc(100% - 2 * var(--learner-page-gutter)),var(--learner-reading-width));margin-inline:auto;box-sizing:border-box}.util-check-sidebar-launch{margin:var(--learner-space-3,1rem) 0 0}.util-check-sidebar-launch__control{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.55rem 1rem;border:1px solid #93c5fd;border-radius:8px;background:#eff6ff;color:#1d4ed8;font:inherit;font-size:var(--learner-text-sm,.8 ourney-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 5"><span class="util-journey-position__visible" aria-hidden="true">1 of 5</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c2--activity-A1" aria-label="Next section: Compare the conflicting records"><span class="util-journey-adjacent__title">Compare the conflicting records</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c2--journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#lj-c2--activity-A1">Compare the conflicting records</a></li><li><a class="util-journey-all-link" href="#lj-c2--activity-A2">Explain the apparent contradiction</a></li><li><a class="util-journey-all-link" href="#lj-c2--activity-A3">Reconsider your judgement about P</a></li><li><a class="util-journey-all-link" href="#lj-c2--activity-A4">Separate truth from justified belief</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="lj-c2--journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>The investigation at Bellwether Institute continues. You have already considered whether Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May. Now two records appear to disagree about her movements.</p><p>Begin by examining the records yourself. Compare what they actually say, develop possible explanations and record your interpretation before revealing the explanatory feedback. You will then reconsider your earlier judgement and apply the same reasoning to a different fictional investigation.</p><p>If you recorded a judgement in The case opens: Your first judgement, have your own response available. If you did not, you can still complete this resource without inventing an earlier position.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>An apparent contradiction can change how convincing evidence seems, but it does not automatically establish what happened. Investigating such disagreements requires careful attention to the source of a claim, what was actually observed or recorded, and what has been inferred.</p><p>You will practise distinguishing direct evidence from interpretation, evaluating competing explanations without assuming dishonesty, and making a provisional judgement whose confidence reflects the available grounds. The central philosophical challenge is to separate whether a proposition is true from whether you currently have sufficient justification for believing it.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><h3 class="util-md-heading util-md-heading--source-3">The proposition under investigation</h3><p>The central proposition is:</p><p>P: &quot;Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.&quot;</p><p>A proposition is a claim that can be true or false. P concerns removal from a particular cabinet before a particular time. It does not itself claim that Mara stole the notebook, intended to steal it or took it away from the Institute. These are different claims and would require their own supporting evidence.</p><h3 class="util-md-heading util-md-heading--source-3">Truth, evidence and justification</h3><p>Truth concerns whether the event described by a proposition actually occurred. Evidence consists of information that may help us determine what happened. Justification concerns whether the available evidence and reasoning provide adequate grounds for believing a proposition.</p><p>These concepts are related but not interchangeable. A proposition can be true even when an investigator has little evidence for it. An investigator can also have apparently good reasons for a belief that later turns out to be false. Greater confidence expresses a stronger degree of belief; it does not, by itself, make the proposition more likely to correspond to reality.</p><p>When evidence changes, or when an existing source is interpreted more carefully, the justification for a belief may change. The underlying event does not change merely because the investigator revises their view.</p><h3 class="util-md-heading util-md-heading--source-3">What different sources can establish</h3><p>An electronic access record can establish that a recorded entry or exit occurred according to that system. Its evidential scope depends on which door or location the system monitors. It does not necessarily establish everything a person did before or after passing through that door.</p><p>A witness account can provide evidence of what someone reports observing. The wording of an account, however, may contain an imprecise description, a mistaken recollection or an inference that goes beyond the observation itself. An inaccurate statement is not automatically evidence of deliberate dishonesty.</p><p>Consider a separate example: a building entry record places a technician inside a laboratory, and a witness reports seeing the technician carrying a closed bag nearby. Those observations may be relevant to a claim about missing equipment, but neither directly establishes what the bag contained. Treating the bag&#39;s contents as known would add an inference not supplied by either source.</p><h3 class="util-md-heading util-md-heading--source-3">Comparing apparently conflicting accounts</h3><p>When sources seem to disagree, begin by identifying the exact claim made by each one. Compare their times, locations, actions and forms of evidence. Ask whether they describe the same event, whether their wording could have different meanings, and whether an observation has been confused with an interpretation.</p><p>Several explanations may initially remain possible. One source could be mistaken; a description could be ambiguous; or an account could be deliberately misleading. These possibilities should be tested against the particulars rather than assumed from the existence of a discrepancy.</p><p>Even when an apparent contradiction can be explained, the resulting agreement does not guarantee that every statement is true. Consistency between accounts and correspondence with what actually happened are different questions.</p><h3 class="util-md-heading util-md-heading--source-3">Reasoning provisionally</h3><p>A defensible provisional judgement identifies the evidence relevant to the precise proposition, distinguishes direct support from inference, considers competing interpretations and acknowledges important unknowns.</p><p>You do not need certainty to reach a reasoned position. You do need to avoid treating a possibility as an established fact or interpreting missing information as proof that a proposition is false.</p><p>The activities will let you apply these distinctions before you receive the explanation of the new Bellwether records. The wider philosophical question of what makes a proposition true will be developed in What makes a claim true?</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/knowledge-summary-after-content.png" alt="Concept map distinguishing truth from evidence, justification and confidence; detailed description follows." aria-describedby="lj-c2--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> Truth concerns what happened; evidence and interpretation inform justification and confidence.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c2--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">A concept map places a proposition alongside the event it describes. One relationship connects the event to the proposition&#39;s truth: whether the proposition is true depends on what actually happened. A separate pathway connects available evidence to interpretation, then to justification for believing the proposition. Direct observation and inference are distinguished within that pathway. Justification is connected to confidence, which may increase, decrease or remain unchanged as evidence is reassessed. The underlying event remains separate and unchanged throughout these revisions. No conclusion about the fictional investigation appears.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Compare Elias Reed&#39;s written testimony with the electronic Archive Room door log, identifying the apparent discrepancy, what each source establishes and the limits of the evidence. <span class="util-outcome-id">(LO1)</span></li><li>Construct and evaluate plausible explanations for the discrepancy between the two records, distinguishing possible mistakes or ambiguities from claims of deliberate dishonesty
