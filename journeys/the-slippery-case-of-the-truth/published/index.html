-page-export--vnext" data-lj-shell="unified" data-lj-journey-key="lj:title:the-slippery-case-of-the-truth"><a class="lj-shell__skip-link" href="#lj-shell-main" data-lj-skip-main="true">Skip to main content</a><div class="lj-shell"><aside class="lj-shell__sidebar" id="lj-shell-sidebar" aria-label="Journey navigation" data-lj-sidebar-state="expanded"><div class="lj-shell__sidebar-chrome"><button type="button" class="lj-shell__icon-btn lj-shell__sidebar-toggle" id="lj-shell-sidebar-toggle" aria-expanded="true" aria-controls="lj-shell-toc-panel" aria-label="Hide journey contents" title="Hide journey contents"><svg class="lj-shell__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.25" y="4.25" width="17.5" height="15.5" rx="2.25" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M9 4.25v15.5" fill="none" stroke="currentColor" stroke-width="1.75"/></svg><span class="lj-shell__sr-only">Hide journey contents</span></button><header class="lj-shell__brand"><h1>The Slippery Case of the Truth</h1></header></div><div class="lj-shell__sidebar-panel" id="lj-shell-toc-panel"><div class="lj-shell__toc-wrap"><p class="lj-shell__toc-label" id="lj-shell-toc-label">Contents</p><nav aria-labelledby="lj-shell-toc-label"><ol class="lj-shell__toc"><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="overview" aria-current="page">Overview</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c1">The case opens: Your first judgement</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c2">A witness, a record and a contradiction</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c3">What makes a claim true?</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c4">Reality and coherence: Two accounts of truth</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c5">Pragmatism and the problem of competing theories</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c6">The case changes: Evidence or interpretation?</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c7">Reconsidering your judgement</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c8">The philosophical case for your conclusion</button></li></ol></nav><p class="lj-shell__toc-label lj-shell__toc-label--journal" id="lj-shell-journal-label">Learning Journal</p><nav aria-labelledby="lj-shell-journal-label"><ol class="lj-shell__toc lj-shell__toc--journal"><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="journal" data-lj-journal-nav="true" data-lj-journal-title="Your Philosophical Learning Journal" aria-label="Your Philosophical Learning Journal"><span class="lj-shell__toc-link-text">Your Philosophical Learning Journal</span><span class="lj-shell__toc-link-count" data-lj-journal-count hidden></span></button></li></ol></nav></div></div></aside><div class="lj-shell__workspace"><div id="lj-shell-live" class="lj-shell__live" aria-live="polite" aria-atomic="true"></div><main id="lj-shell-main" class="lj-shell__main" data-lj-role="active-resource" aria-label="Learning content" tabindex="-1"></main></div></div><div class="lj-shell__templates" hidden aria-hidden="true"><template id="lj-resource-overview"><article class="lj-shell-overview" data-lj-overview="true" role="region" aria-labelledby="lj-shell-overview-heading"><h2 id="lj-shell-overview-heading" class="lj-shell-overview__title" data-lj-resource-title="true" tabindex="-1">Overview</h2><div class="util-editorial-opening" data-region="editorial-opening"><figure class="util-visual-asset util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-figure-number="1"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/editorial-opening.png" alt="" loading="lazy" decoding="async" /></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> A quiet archive room containing a locked glass display cabinet and a detective&#39;s desk with carefully arranged papers.</figcaption></figure></div><div class="lj-shell-overview__body"><p>A valuable notebook has disappeared from a locked cabinet. Witnesses disagree, records appear to contradict one another, and the evidence does not tell a straightforward story.</p><p>You are about to investigate <strong>The Slippery Case of the Truth</strong>. But this is not an ordinary detective mystery. Your real challenge is to consider what makes a claim true, how evidence supports a belief, and why a convincing explanation might still be mistaken.</p><p>As the case unfolds, you will encounter three influential philosophical approaches to truth: <strong>correspondence</strong>, <strong>coherence</strong> and <strong>pragmatism</strong>. Each raises different questions about reality, belief and enquiry. You will use these ideas to reconsider your own judgements and develop a philosophical argument.</p><p>You do not need any previous experience of philosophy. The investigation introduces the concepts as you need them.</p><p><strong>What you will develop:</strong> the ability to distinguish truth from belief and justification, explain and compare philosophical approaches, evaluate competing interpretations, and construct a reasoned conclusion that acknowledges uncertainty and objections.</p><p><strong>How the journey works:</strong> Begin with the evidence and make an initial judgement. A complication will challenge your reasoning. You will then explore philosophical perspectives, reconsider the investigation and produce a final argument showing how your thinking has developed.</p><p>The journey takes approximately <strong>90 minutes</strong> and can be completed independently over <strong>one week</strong>. You may pause between experiences. Keep your earlier judgements in mind because later experiences will ask you to reconsider them.</p><p><strong>The important question is not simply who did what. It is what you can reasonably claim to be true, and why.</strong></p></div></article></template><template id="lj-resource-c1"><article class="util-learner-page util-page util-learner-renderer-vnext" data-renderer="vnext" data-page-kind="interactive" data-persistence-page-key="v1::210cc551-6ca7-4cc7-b2e8-5650aa4be6b6::learner-page::2.0.0::a1-a2-a3::the-case-opens:-your-first-judgement" data-persistence-storage-key="learner-renderer-vnext:draft:v1::210cc551-6ca7-4cc7-b2e8-5650aa4be6b6::learner-page::2.0.0::a1-a2-a3::the-case-opens:-your-first-judgement" data-composition-mode="moments" data-composed-activity-count="3" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">The case opens: Your first judgement</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="4"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 4"><span class="util-journey-position__visible" aria-hidden="true">1 of 4</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c1--activity-A1" aria-label="Next section: What exactly is being investigated?"><span class="util-journey-adjacent__title">What exactly is being investigated?</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c1--journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#lj-c1--activity-A1">What exactly is being investigated?</a></li><li><a class="util-journey-all-link" href="#lj-c1--activity-A2">Examine the opening evidence</a></li><li><a class="util-journey-all-link" href="#lj-c1--activity-A3">Record your provisional judgement</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="lj-c1--journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>A historically significant notebook has disappeared from a locked display cabinet at the fictional Bellwether Institute. Detective Ada Mercer invites you to examine a precise claim about what happened.</p><p>Begin by interpreting the claim carefully. You will then examine six pieces of initial evidence before recording your own provisional judgement. Work through the activities in order, and make your judgement before reading the concluding feedback. You can revisit the evidence whenever you need to.</p><p>The case is fictional, and all information needed for this encounter is provided in text.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>Investigating a claim requires more than deciding whether an account sounds convincing. You need to establish exactly what is being claimed, identify which observations are relevant, distinguish those observations from your interpretations, and judge how far the available evidence supports a conclusion.</p><p>Your aim is to make a defensible first judgement, not to guess the eventual outcome. A supported position, a position that the evidence does not yet support, or a reasoned expression of uncertainty can each be appropriate when accompanied by careful explanation. You will also practise recognising when a public allegation goes beyond what a witness actually reports.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><p>A proposition is a statement that makes a particular claim about the world. To investigate one, begin with its exact wording: who is said to have done what, involving which object, and within what time boundary? Changing any of these details may change the proposition being considered.</p><p>A claim that someone removed an object is different from a claim that they stole it. Theft introduces an allegation of wrongdoing that cannot simply be read into the physical action. Questions about intention also require their own grounds. Keep these claims separate even when they concern the same person and object.</p><p>Evidence is information that may count for or against a proposition. It can include observations, witness testimony and information about access or opportunity. The source matters: a witness&#39;s report tells you what that person says they observed, but it does not automatically establish every conclusion that might be drawn from the report.</p><p>An observation and an inference play different roles. For example, if a witness reports seeing someone carry a closed container, the reported observation concerns the person and the container. A claim about what was inside would be an additional inference unless its contents were independently established. The inference may be worth investigating without being treated as an observed fact.</p><p>Justification concerns the reasons available for believing a proposition. Truth concerns whether the proposition actually matches what happened. A belief may be carefully justified without being certain, and further evidence may change how reasonable that belief is. New evidence does not itself change the past event.</p><p>When weighing evidence, ask how directly each item bears on the precise proposition, what its source could reasonably know, what alternative interpretations remain possible, and which missing information would make the greatest difference. Your confidence should reflect the strength and limitations of your reasons rather than a desire to reach a definite verdict.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/knowledge-summary-after-content.png" alt="Concept map distinguishing propositions, evidence, inference, justification and truth; detailed description follows." aria-describedby="lj-c1--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> How claims, evidence, inference, justification and truth relate without becoming interchangeable.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c1--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">The map places a proposition at the centre as a claim with a defined scope. Removal, theft and intention appear as distinct claims. Source-attributed observations and testimony connect to evidence, which can inform inferences; missing information can limit those inferences. Evidence and reasoning connect to justification and qualified confidence. Truth occupies a separate position, referring to what actually happened rather than what is currently believed. A final relationship indicates that new evidence may change justification without changing the past event.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Identify the precise claim made by proposition P and distinguish whether Mara Vale removed the Aster Notebook from the separate questions of theft and intention. <span class="util-outcome-id">(LO1)</span></li><li>Analyse the initial case evidence by distinguishing reported observations from inferences and identifying assumptions or gaps that limit what can reasonably be concluded about P. <span class="util-outcome-id">(LO2)</span></li><li>Construct and justify a provisional judgement about whether the available evidence supports P, explaining the strongest evidential reason for that position and identifying an unresolved question that affects confidence in the conclusion. <span class="util-outcome-id">(LO3)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="lj-c1--journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="lj-c1--activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">What exactly is being investigated?</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The investigation begins with a distinction between an event and the claims people make about it. Establishing precisely what proposition P asserts will help you avoid treating evidence about access, removal, theft and intention as though it answered the same question.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Detective Ada Mercer invites you to examine a fictional investigation at the Bellwether Institute. On Thursday 14 May 2026, the Aster Notebook is discovered missing from its locked display cabinet in the Archive Room. Your task is not to identify a culprit. It is to decide what a particular claim means before considering whether the evidence supports it. Allow approximately 3 minutes.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Begin with the wording of the proposition, not with a theory about who is responsible. Separate the physical action being investigated from possible explanations or intentions.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which words in proposition P would you need to change to turn it into an allegation of theft, and why would that create a different question?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A1"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A1-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">One claim is not every claim</span></p><h3 class="util-md-heading util-md-heading--source-2">Reading a proposition carefully</h3><p>A proposition is a claim about how things are or were. We can ask whether it is true and whether the evidence available to us gives us good reasons to believe it.</p><p>The exact wording matters. A claim that someone moved an object describes an action. A claim that someone stole an object adds an allegation of wrongdoing. A claim that someone intended to keep an object introduces a further question about intention.</p><p>These claims may concern the same person and object, but they are not interchangeable. Evidence relevant to one may leave another unresolved.</p><p>When examining P, first identify who is named, what action is asserted, which object is involved, where the action is said to have occurred and the time boundary. Do not silently add a motive or substitute a more serious allegation.</p><p>You do not yet need to decide whether P is true. Your first task is to understand exactly what would have to be established.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c1--learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="lj-c1--learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="lj-c1--learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c1--learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c1--learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="lj-c1--learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c1--learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Read Detective Mercer&#39;s case introduction and the exact wording of proposition P.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A1-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Detective Mercer&#39;s opening briefing</span></p><h3 class="util-md-heading util-md-heading--source-2">The case opens</h3><p>Detective Ada Mercer addresses you:</p><p>&quot;Welcome to the Bellwether Institute. This is a fictional investigation, and I need you to examine the evidence carefully rather than jump to an accusation.</p><p>&quot;On Thursday 14 May 2026, the Aster Notebook, a historically significant handwritten notebook, was discovered missing from its locked display cabinet in the Institute&#39;s Archive Room.</p><p>&quot;Our investigation begins with one precise proposition. We will call it P:</p><p>&gt; Mara Vale removed the Aster Notebook from its display cabinet before 18:00 on 14 May.</p><p>&quot;I am not asking you to identify a culprit. I am asking whether the information available to us justifies believing this particular claim.</p><p>&quot;Be careful with the wording. Removing an object and stealing it are different propositions. Even if we established that somebody removed the notebook, we would still need to consider separately whether that person stole it or acted with a particular intention.</p><p>&quot;Before looking at the witness accounts, tell me exactly what P claims. Then explain what would be added if someone accused Mara of theft.&quot;</p><p>The investigation is fictional. Its people, institution and events have been created for learning purposes.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>In your own words, identify the action, person and time boundary specified by P.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A1-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Define the disputed claim</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain how the claim that Mara removed the notebook differs from the claim that she stole it.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A concise learner-authored interpretation that accurately identifies Mara Vale, removal of the Aster Notebook from its display cabinet and the deadline of before 18:00 on 14 May. The response distinguishes removal from theft without assuming that either action establishes a particular motive. It preserves the proposition&#39;s scope rather than replacing it with an accusation of dishonesty.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-what-p-claims-1" data-response-part-id="A1-template-section-a1-m3-section-what-p-claims-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-what-p-claims-1-label" for="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-what-p-claims-1">What P claims</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-what-p-claims-1-desc">Record your response for What P claims.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-what-p-claims-1" name="learner-workspace-a1-a1-template-section-a1-m3-section-what-p-claims-1" rows="5" aria-describedby="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-what-p-claims-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-how-removal-differs-from-theft-2" data-response-part-id="A1-template-section-a1-m3-section-how-removal-differs-from-theft-2"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-how-removal-differs-from-theft-2-label" for="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-how-removal-differs-from-theft-2">How removal differs from theft</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-how-removal-differs-from-theft-2-desc">Record your response for How removal differs from theft.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-how-removal-differs-from-theft-2" name="learner-workspace-a1-a1-template-section-a1-m3-section-how-removal-differs-from-theft-2" rows="6" aria-describedby="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-how-removal-differs-from-theft-2-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c1--learner-check-a1" data-check-sidebar-open aria-controls="lj-c1--learner-check-a1" aria-expanded="false" aria-label="Check your work: What exactly is being investigated?">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c1--learner-check-a1" data-composition-moment="check" data-activity-id="A1" data-check-sidebar="available" aria-labelledby="lj-c1--learner-check-a1-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c1--learner-check-a1-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c1--learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c1--learner-task-a1">Back to your task (What exactly is being investigated?)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m4-c-0" data-revision-criterion-id="a1-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you identified the person and action actually named in P?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Changing the person or action would mean evaluating a different proposition from the one Detective Mercer is investigating.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My interpretation names Mara Vale as the person specified.</li><li><span class="util-guided-review__feature-key">B.</span> My interpretation identifies removal of the Aster Notebook from its display cabinet as the claimed action.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Check that your explanation identifies Mara Vale rather than an unnamed person or everyone with access to the Archive Room.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Distinguish the act of removing the notebook from the cabinet from merely entering the room, carrying a case or causing the notebook to be missing.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a1-a1-m4-item-0" data-checklist-item-id="checklist-a1-a1-m4-item-0"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a1-a1-m4-item-0">My interpretation identifies the correct person and action</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m4-c-1" data-revision-criterion-id="a1-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you preserved the date and time boundary of P?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A claim about an event before a specified time is not equivalent to an unrestricted claim that the event happened at some point.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My explanation retains 14 May as the relevant date.</li><li><span class="util-guided-review__feature-key">B.</span> My explanation preserves the requirement that removal occurred before 18:00.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Add the date 14 May to your interpretation so that the claim is not left open to events on another day.</li><li><span class="util-guided-review__feature-key">Missing B:</span> State the before-18:00 boundary rather than describing an unspecified time or treating 18:00 as a confirmed time of removal.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a1-a1-m4-item-1" data-checklist-item-id="checklist-a1-a1-m4-item-1"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a1-a1-m4-item-1">My interpretation preserves the time boundary</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m4-c-2" data-revision-criterion-id="a1-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you distinguished removal from theft?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Treating these as the same claim would allow evidence about physical movement to be mistaken for evidence of wrongdoing.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My response treats removal as an action involving the notebook and its display cabinet.</li><li><span class="util-guided-review__feature-key">B.</span> My response recognises that theft is a separate allegation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Describe the physical action specified by P without building an allegation of theft into its definition.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain that an accusation of stealing would require consideration beyond whether the notebook was moved.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a1-a1-m4-item-2" data-checklist-item-id="checklist-a1-a1-m4-item-2"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a1-a1-m4-item-2">My response distinguishes the two propositions</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m4-c-3" data-revision-criterion-id="a1-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you avoided adding an unsupported intention or motive?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A conclusion about why someone acted cannot be established merely by defining a proposition about what they did.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My interpretation does not assume dishonesty or a plan to keep the notebook.</li><li><span class="util-guided-review__feature-key">B.</span> Any discussion of intention is clearly identified as a separate question.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Remove any assertion about dishonesty or permanent possession that you have treated as part of P.</li><li><span class="util-guided-review__feature-key">Missing B:</span> If you mention why Mara might have acted, identify that as something requiring its own evidence rather than a fact contained in P.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a1-a1-m4-item-3" data-checklist-item-id="checklist-a1-a1-m4-item-3"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a1-a1-m4-item-3">My interpretation does not add a motive</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c1--activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Examine the opening evidence</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">You have established that P concerns removal rather than theft. You can now apply that distinction to the available accounts, examining whether each observation bears directly on removal, merely establishes an opportunity, or leaves an important question unanswered.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Detective Mercer now provides the information available at the beginning of the investigation. Several accounts may appear relevant, but each has limits. Examine what each source actually reports before deciding what it might suggest about proposition P. Allow approximately 4 minutes.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Treat testimony as evidence about what someone reports, not automatic proof of every interpretation that could follow. Ask what an observation establishes, what it suggests and what additional information would be needed to strengthen the inference.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which part of your analysis depends most heavily on an assumption rather than something a witness directly reported?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A2"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Read the source-attributed case evidence.</p></span></div></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c1--learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="lj-c1--learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="lj-c1--learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c1--learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c1--learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="lj-c1--learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c1--learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Select at least three pieces of evidence, including Elias Reed&#39;s observation and at least one other person&#39;s account.</p></span></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a2-evidence-reasoning-01-activity-a2-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/activity-a2-materials-entry.png" alt="Generic example separating a witness report, a possible inference and an unresolved question; detailed description follows." aria-describedby="lj-c1--figure-description-asset-vb-38-4-va-a2-evidence-reasoning-01-activity-a2-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 2.</strong> A report and an inference are different stages of evidential reasoning.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c1--figure-description-asset-vb-38-4-va-a2-evidence-reasoning-01-activity-a2-materials-entry">The figure begins with a generic witness report: a person was seen carrying a closed parcel. A separate area contains a possible inference about what the parcel holds, connected to the report by a conditional reasoning link rather than an implication of proof. A third area identifies the unresolved question of the parcel&#39;s contents and shows how this limits the inference. The figure distinguishes attributed information from interpretation without classifying any evidence from the Bellwether Institute case.</p></figure><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A2-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated initial case dossier</span></p><h3 class="util-md-heading util-md-heading--source-2">Evidence available at the opening of the case</h3><p>This is a simulated dossier from the fictional Bellwether Institute investigation. The following six items are the information available to Detective Mercer at this stage. Each item identifies its source or evidential status. No interpretation of proposition P has yet been established.</p><h3 class="util-md-heading util-md-heading--source-3">Item 1 — Dr Rowan Bell, curator</h3><p>Dr Rowan Bell confirmed that the Aster Notebook was present in its locked display cabinet at 16:40 on 14 May. At 18:20, Dr Bell found the display cabinet empty.</p><h3 class="util-md-heading util-md-heading--source-3">Item 2 — Mara Vale&#39;s access status</h3><p>Mara Vale, a collections assistant, had authorised access to the Archive Room that afternoon.</p><h3 class="util-md-heading util-md-heading--source-3">Item 3 — Elias Reed, security officer</h3><p>Elias Reed reports seeing Mara leaving the archive corridor at approximately 17:25, carrying a rectangular grey case.</p><p>The reported location is the archive corridor. The contents of the grey case are not established.</p><h3 class="util-md-heading util-md-heading--source-3">Item 4 — Mara Vale&#39;s statement</h3><p>Mara states:</p><p>&gt; I was dealing with conservation preparations. I did not steal the notebook.</p><h3 class="util-md-heading util-md-heading--source-3">Item 5 — Nina Shah, visiting researcher</h3><p>Nina Shah reports seeing someone wearing a dark jacket near the archive corridor. She cannot identify the person.</p><h3 class="util-md-heading util-md-heading--source-3">Item 6 — Current investigative status</h3><p>The notebook&#39;s whereabouts are unknown to the investigator at this point.</p><p>Use the reported particulars rather than assuming what any witness must have meant. You may find that an item is relevant without being decisive.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>For each, identify what is directly reported, what might reasonably be inferred about P and what remains unestablished.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a2-a2-m2" data-material-source-id="A2-M2" data-activity-id="A2"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A2-M2" data-material-type="analysis_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Evidence, inference and uncertainty</span></p><p class="util-learner-table-workspace__guidance">Enter your responses in the table below. Your draft is saved on this device when possible. It is not submitted.</p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="lj-c1--a2-a2-m2-col-source-or-evidence-0">Source or evidence</th><th scope="col" id="lj-c1--a2-a2-m2-col-what-is-directly-reported-1">What is directly reported?</th><th scope="col" id="lj-c1--a2-a2-m2-col-what-might-this-suggest-about-p-2">What might this suggest about P?</th><th scope="col" id="lj-c1--a2-a2-m2-col-what-remains-uncertain-3">What remains uncertain?</th></tr></thead><tbody><tr><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--edita
