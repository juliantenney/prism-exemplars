ditable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a3-a3-m3-input-r5-c2" name="a3-a3-m3-input-r5-c2" data-learner-cell="a3-a3-m3-input-r5-c2" rows="3" aria-labelledby="a3-a3-m3-row-5 a3-a3-m3-col-evidence-from-candidate-3b-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a3-a3-m3-input-r5-c3" name="a3-a3-m3-input-r5-c3" data-learner-cell="a3-a3-m3-input-r5-c3" rows="3" aria-labelledby="a3-a3-m3-row-5 a3-a3-m3-col-significance-of-the-difference-3" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a3-a3-m3-row-6" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed"><strong>Overall preference, decisive reasons and competing strength acknowledged</strong></th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a3-a3-m3-input-r6-c1" name="a3-a3-m3-input-r6-c1" data-learner-cell="a3-a3-m3-input-r6-c1" rows="3" aria-labelledby="a3-a3-m3-row-6 a3-a3-m3-col-evidence-from-candidate-3a-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a3-a3-m3-input-r6-c2" name="a3-a3-m3-input-r6-c2" data-learner-cell="a3-a3-m3-input-r6-c2" rows="3" aria-labelledby="a3-a3-m3-row-6 a3-a3-m3-col-evidence-from-candidate-3b-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a3-a3-m3-input-r6-c3" name="a3-a3-m3-input-r6-c3" data-learner-cell="a3-a3-m3-input-r6-c3" rows="3" aria-labelledby="a3-a3-m3-row-6 a3-a3-m3-col-significance-of-the-difference-3" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Weigh the significance of those differences for a non-specialist reader, distinguishing evidential requirements from legitimate editorial choices.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A3-M2" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Evaluate two defensible explanations</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><p><strong>Simulated candidate explanations for evaluation.</strong> Both describe the same fictional survey. Neither is presented as the preferred version.</p><p><strong>Candidate explanation 3A</strong></p><p>&gt; In a survey of 200 undergraduates, 72% of students who reported taking regular short study breaks also reported good concentration, compared with 58% of those who did not. That is a difference of 14 percentage points. The figures show a connection between reported study habits and concentration, but they do not establish that taking breaks causes better concentration.</p><p><strong>Candidate explanation 3B</strong></p><p>&gt; An observational survey of 200 undergraduate students compared two groups of 100 according to whether they reported taking regular short study breaks. Good concentration was reported by 72% of students in the regular-break group and 58% in the other group, a difference of 14 percentage points. The responses were self-reported, students were not randomly assigned, and sleep, motivation, workload and study environment were uncontrolled. The association cannot establish a causal effect or be assumed to represent undergraduates generally.</p><h3 class="util-md-heading util-md-heading--source-3">Make a contextual judgement</h3><p>Both candidates report the same observed percentages and distinguish the association from a demonstrated causal effect. Their wording differs in what it makes prominent and how much research context it provides.</p><p>Consider a non-specialist reader who wants to understand the principal finding without being led to an unsupported conclusion. Examine how each candidate communicates the numerical comparison, what its wording permits the reader to infer, and whether its length makes the main point more or less accessible. Weigh the value of additional methodological context against the effort required to read it. An explanation can communicate the essential result efficiently without naming every limitation; additional context can also protect readers from overinterpreting a result.</p><p>Use the six-dimension comparison table to identify evidence from <strong>both actual texts</strong>. Decide which explanation better serves the reader in this context and why. Your judgement should acknowledge at least one genuine advantage of the candidate you do not select. A defensible preference must follow from the consequences of the wording, not simply from counting dimensions or favouring whichever candidate is longer.</p></article></li></ol></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Record and justify an overall preference, acknowledging a competing strength of the alternative.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A structured evaluation applying the six dimensions accurately to the supplied explanations, identifying meaningful differences, explaining how dimensions interact, and defending a proportionate overall judgement. The response should recognise defensible trade-offs rather than mechanically count favourable features or assume one universally correct ranking.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-task-step-step-4-4" data-response-part-id="A3-task-step-step-4-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-task-step-step-4-4-label" for="learner-workspace-a3-a3-task-step-step-4-4">Your response</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-task-step-step-4-4-desc">Weigh the significance of those differences for a non-specialist reader, distinguishing evidential requirements from legitimate editorial choices.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-task-step-step-4-4" name="learner-workspace-a3-a3-task-step-step-4-4" rows="6" aria-describedby="learner-workspace-a3-a3-task-step-step-4-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-task-step-step-5-5" data-response-part-id="A3-task-step-step-5-5"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-task-step-step-5-5-label" for="learner-workspace-a3-a3-task-step-step-5-5">Your response</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-task-step-step-5-5-desc">Record and justify an overall preference, acknowledging a competing strength of the alternative.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-task-step-step-5-5" name="learner-workspace-a3-a3-task-step-step-5-5" rows="6" aria-describedby="learner-workspace-a3-a3-task-step-step-5-5-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#learner-check-a3" data-check-sidebar-open aria-controls="learner-check-a3" aria-expanded="false" aria-label="Check your work: Weigh six dimensions of quality">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a3" data-composition-moment="check" data-activity-id="A3" data-check-sidebar="available" aria-labelledby="learner-check-a3-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="learner-check-a3-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a3">Back to your task (Weigh six dimensions of quality)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m4-c-0" data-revision-criterion-id="a3-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you applied the six dimensions to what the candidates actually communicate?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Naming dimensions without examining their effects does not establish whether an explanation serves its reader.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your comparison distinguishes correct numerical representation from the strength of the conclusion drawn.</li><li><span class="util-guided-review__feature-key">B.</span> Your response addresses clarity, relevance, context and proportionality as communication choices.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Assess the percentages and percentage-point difference separately from whether the candidate makes only claims supported by the observational survey.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify how each candidate presents the principal finding and methodological limits, then describe the consequences for a non-specialist reader.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m4-item-0" data-checklist-item-id="checklist-a3-a3-m4-item-0"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m4-c-1" data-revision-criterion-id="a3-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you supported your evaluation with wording from both candidates?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without identifiable textual evidence, a comparison may become a general opinion about concise or detailed writing.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your entries refer to particular phrases, figures or omissions in candidate 3A.</li><li><span class="util-guided-review__feature-key">B.</span> Your entries refer to particular phrases, figures or omissions in candidate 3B.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the relevant wording or information in 3A and connect it to the dimension you are evaluating.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify the corresponding wording or information in 3B so the contrast is grounded in both texts.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m4-item-1" data-checklist-item-id="checklist-a3-a3-m4-item-1"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m4-c-2" data-revision-criterion-id="a3-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you recognised interactions and legitimate trade-offs between dimensions?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A mechanical score can obscure why brevity and fuller qualification may each help a reader in different ways.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your judgement explains a relationship between accessibility and the amount of context supplied.</li><li><span class="util-guided-review__feature-key">B.</span> Your response distinguishes acceptable editorial variation from evidential misrepresentation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Describe how the additional or reduced methodological detail affects the reader&#39;s effort and understanding.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain whether a difference concerns presentation and emphasis or changes what the evidence warrants.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m4-item-2" data-checklist-item-id="checklist-a3-a3-m4-item-2"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m4-c-3" data-revision-criterion-id="a3-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you reached a justified preference without assuming one universally correct ranking?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A sound evaluative judgement depends on the communication purpose and the significance of competing strengths.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your overall preference identifies the decisive consideration for the intended reader.</li><li><span class="util-guided-review__feature-key">B.</span> Your conclusion acknowledges a defensible advantage of the alternative.</li><li><span class="util-guided-review__feature-key">C.</span> Your preferred explanation remains within the survey&#39;s evidential limits.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State which dimension or combination of dimensions most influences your choice and why its effect matters in this context.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify what the other candidate does effectively and explain why that advantage does not outweigh your decisive consideration.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Check that your justification does not turn a reported association into a causal effect or a finding about unmeasured performance.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m4-item-3" data-checklist-item-id="checklist-a3-a3-m4-item-3"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A4" data-journey-section="true" data-activity-id="A4" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Reconsider and transfer your judgement</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A4"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">You have moved from independent preferences to checking evidential claims and applying explicit quality dimensions. This final activity brings those capabilities together: first by making the development of your own reasoning visible, and then by applying that reasoning to a changed communication purpose.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Return to a comparison you judged earlier. Use the feedback and quality dimensions to decide whether your original preference remains defensible or whether your reasoning should change. Then apply the same evaluative approach to a different communication decision involving the fictional survey. Your purpose is to strengthen your judgement, not to reproduce a prescribed answer.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Reconsideration is not synonymous with changing your answer. A defensible retained judgement supported by improved reasoning can demonstrate progress. In the transfer task, distinguish communication choices appropriate for a study-skills audience from claims the research cannot establish.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">What has become more precise in your reasoning, and how does that change the way you evaluate a claim intended to inform students?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A4"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A4-M1" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Feedback: What the comparisons reveal</span></p><p>Read this feedback <strong>after completing your initial comparisons and claim analysis</strong>. Compare its reasoning with your own; you are not required to change a defensible preference simply because another interpretation is possible.</p><h3 class="util-md-heading util-md-heading--source-3">Numerical meaning and evidential boundaries</h3><p>The fictional survey reported good concentration among 72% of students in the regular-break group and 58% in the no-regular-break group. The difference is <strong>14 percentage points</strong>. Saying the difference is simply &#39;14%&#39; can confuse the difference between two percentages with a relative percentage change.</p><p>The survey was observational and relied on self-reports. It did not randomly assign students to break-taking conditions or control sleep, motivation, workload and study environment. It therefore cannot establish that taking breaks caused better concentration. Nor did it establish objectively measured concentration, academic performance or representativeness across undergraduates generally.</p><h3 class="util-md-heading util-md-heading--source-3">Feedback on the three explanation pairs</h3><p><strong>Pair 1:</strong> Candidate 1A accurately identifies the 14-percentage-point difference and explicitly limits its conclusion to an association. Candidate 1B uses the phrase &#39;improves students&#39; concentration by 14%&#39; and predicts that introducing breaks &#39;will improve concentration&#39;. These claims go beyond the evidence and alter the meaning communicated to readers. Confident or accessible wording does not compensate for an unsupported causal conclusion.</p><p><strong>Pair 2:</strong> Candidate 2A foregrounds the comparison and uses accessible wording, while acknowledging that the figures do not establish whether breaks made the difference. Candidate 2B supplies the counts, observational design, self-reporting and uncontrolled factors. Both can be defended. Their relative value depends on whether the reader primarily needs an accessible summary or enough methodological context to examine the limits of the finding. A strong justification explains that trade-off rather than automatically rewarding the longer explanation.</p><p><strong>Pair 3:</strong> Candidate 3A gives prominence to the reported percentages and quickly identifies the association as non-causal. Candidate 3B makes group sizes and methodological limitations more explicit and also guards against extending the finding to academic performance. Both preserve the essential evidential boundaries. The choice depends on which communication advantages are most important for the intended reader; neither should be dismissed simply because it has a different emphasis.</p><h3 class="util-md-heading util-md-heading--source-3">Feedback on the four claims</h3><p><strong>Claim 1:</strong> The 72% and 58% values match the survey, but the wording &#39;the difference ... was 14%&#39; misstates or obscures the unit of comparison. The appropriate description is a <strong>14-percentage-point difference</strong>.</p><p><strong>Claim 2:</strong> The verbs &#39;causes&#39; and &#39;will improve&#39; imply a causal or intervention effect. The observed association, without random assignment or control of other relevant factors, does not support those claims.</p><p><strong>Claim 3:</strong> The survey measured students&#39; reported concentration, not academic performance. It also did not establish that the results represent university students generally. Both extensions require evidence not supplied here.</p><p><strong>Claim 4:</strong> The statement correctly reports the group percentages, identifies the observational context and avoids claiming causation. It remains a bounded description of the association rather than a demonstration that breaks improve concentration.</p><h3 class="util-md-heading util-md-heading--source-3">Using feedback to strengthen judgement</h3><p>A materially inaccurate number or unsupported inference is different from a defensible editorial choice about brevity, emphasis or contextual completeness. In the first case, the reader may be led to a conclusion the evidence does not warrant. In the second, two explanations may both be accurate while serving readers differently.</p><p>Return to your own comparison record. Identify the particular reasoning you would now retain, qualify or change. This feedback concerns the supplied candidates; it does not rewrite your initial explanation from &#39;Write your first explanation&#39;.</p></article></div><div class="util-composition-learn-item util-composition-learn-item--example" data-composition-role="example"><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A4-M2" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Fictional editorial decision: A university study-skills page</span></p><p><strong>Simulated editorial scenario.</strong> This is a fictional communication decision, not a real university publication or an authoritative research recommendation.</p><p>A university team is preparing a study-skills information page for undergraduate students. The page is intended to help students understand research that may be relevant to their independent study habits. The team wants a short, accessible statement about study breaks and concentration.</p><p>An editor proposes the following wording:</p><p><strong>Candidate communication claim — proposed page text</strong></p><p>&gt; Research shows that taking regular short breaks improves concentration for university students. In a survey of 200 undergraduates, 72% of those taking regular breaks reported good concentration, compared with 58% of those who did not. Students should therefore take regular breaks to improve their concentration.</p><p>The only evidence available to the team is the fictional observational survey used in these activities: two groups of 100 students, 72% and 58% reporting good concentration, self-reported measures, no random assignment, and uncontrolled sleep, motivation, workload and study environment. No objectively measured improvement or broader population effect was established.</p><p>Your role is to advise whether the proposed wording is suitable for the page and what editorial action, if any, is justified. The proposed claim is a candidate for evaluation, not an established finding.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a4" data-composition-moment="do" data-activity-id="A4" aria-labelledby="learner-task-a4-heading"><h3 class="util-composition-moment-heading" id="learner-task-a4-heading" on.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Record how your judgement developed</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Consult the formative feedback and six quality dimensions, identifying specific evidence or guidance that supports or challenges your reasoning.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M5" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Your editorial recommendation</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>State whether you retain or revise your preference and explain why.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Apply the same evaluative approach to a short, newly presented communication claim intended for a university study-skills information page.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify whether the new claim is suitable for that purpose and formulate a brief evidence-grounded editorial recommendation. Do not rewrite your own initial explanation from &#39;Write your first explanation&#39;; that work belongs in &#39;Diagnose your explanation&#39; and &#39;Revise your explanation&#39;.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A visible record of an original judgement, the specific feedback or evidence reconsidered, and a retained or revised judgement supported by stronger reasoning. The response also includes a compact editorial recommendation for the changed communication context, identifying relevant strengths or weaknesses of the supplied claim and explaining what should be retained, qualified or changed. Both productions should remain grounded in the fictional survey and avoid unsupported conclusions.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-original-preference-and-justification-1" data-response-part-id="A4-template-section-a4-m3-section-original-preference-and-justification-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-template-section-a4-m3-section-original-preference-and-justification-1-label" for="learner-workspace-a4-a4-template-section-a4-m3-section-original-preference-and-justification-1">Original preference and justification</label><p class="util-learner-workspace__prompt" id="learner-workspace-a4-a4-template-section-a4-m3-section-original-preference-and-justification-1-desc">Record your response for Original preference and justification.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-template-section-a4-m3-section-original-preference-and-justification-1" name="learner-workspace-a4-a4-template-section-a4-m3-section-original-preference-and-justification-1" rows="6" aria-describedby="learner-workspace-a4-a4-template-section-a4-m3-section-original-preference-and-justification-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-ste template-section-a4-m5-section-reason-for-the-recommendation-4">Reason for the recommendation</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a4-a4-template-section-a4-m5-section-reason-for-the-recommendation-4-desc"><h3 class="util-md-heading util-md-heading--source-3">Page learner-resource closure</h3><ul><li><strong>Compare before deciding:</strong> Identify what each explanation actually says, then justify your preference through consequential differences in wording and evidential meaning.</li><li><strong>Keep the evidence in view:</strong> The survey reports 72% and 58% reporting good concentration, a difference of 14 percentage points. It establishes an observed association, not a causal improvement in concentration.</li><li><strong>Weigh connected dimensions:</strong> Numerical accuracy and evidential support constrain acceptable claims; clarity, relevance, context, qualification and proportionality shape how effectively those claims serve a reader.</li><li><strong>Use judgement beyond the comparison:</strong> Revisit your reasoning after feedback, and apply the same evaluative approach when deciding whether research claims are suitable for a different audience or communication purpose.</li></ul></div><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-template-section-a4-m5-section-reason-for-the-recommendation-4" name="learner-workspace-a4-a4-template-section-a4-m5-section-reason-for-the-recommendation-4" rows="5" aria-describedby="learner-workspace-a4-a4-template-section-a4-m5-section-reason-for-the-recommendation-4-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#learner-check-a4" data-check-sidebar-open aria-controls="learner-check-a4" aria-expanded="false" aria-label="Check your work: Reconsider and transfer your judgement">Check your work</a></p></div></section><section class="util-composition-mome why.</p></span></div><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A4-M6" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a4-a4-m6" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a4-m6-c-0" data-revision-criterion-id="a4-m6-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you preserved your original judgement so that reconsideration is visible?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without an identifiable starting position, your response cannot show how your evaluative reasoning developed.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your record identifies the earlier pair and your original preferred candidate.</li><li><span class="util-guided-review__feature-key">B.</span> Your original justification is distinguishable from your later reasoning.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Retrieve the relevant comparison row and record the candidate you originally selected.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Keep your initial reason in its own section rather than replacing it with the conclusion reached after feedback.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a4-a4-m6-item-0" data-checklist-item-id="checklist-a4-a4-m6-item-0"><label class="util-interactive-checklist__label" for="checklist-a4-a4-m6-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m6-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a4-m6-c-1" data-revision-criterion-id="a4-m6-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you engaged with specific feedback or evidence when reconsidering your decision?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A changed or retained preference is more meaningful when it responds to identifiable evidence rather than to the existence of feedback alone.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your response identifies a particular numerical, inferential or communication issue raised by feedback.</li><li><span class="util-guided-review__feature-key">B.</span> Your response connects that issue to the wording of the earlier candidates.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the exact issue you reconsidered, such as percentage-point wording, causal strength or the balance between brevity and context.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify the relevant phrase or omission and explain how the feedback affects your interpretation of it.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a4-a4-m6-item-1" data-checklist-item-id="checklist-a4-a4-m6-item-1"><label class="util-interactive-checklist__label" for="checklist-a4-a4-m6-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m6-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a4-m6-c-2" data-revision-criterion-id="a4-m6-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you justified retaining or revising your preference through stronger reasoning?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The quality of reconsideration lies in the improved justification, not in whether the selected candidate changes.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your final position explicitly states whether the original preference was retained or revised.</li><li><span class="util-guided-review__feature-key">B.</span> Your final justification weighs an important strength against a limitation or competing strength.</li><li><span class="util-guided-review__feature-key">C.</span> Your reasoning respects the survey&#39;s evidential boundaries.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State the status of your original choice before giving the final justification.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain why one consequence for the intended reader matters more than the relevant advantage of the alternative.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Where necessary, distinguish the observed association from a causal effect and self-reported concentration from unmeasured performance.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a4-a4-m6-item-2" data-checklist-item-id="checklist-a4-a4-m6-item-2"><label class="util-interactive-checklist__label" for="checklist-a4-a4-m6-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m6-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a4-m6-c-3" data-revision-criterion-id="a4-m6-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you made an evidence-grounded editorial recommendation for the changed communication context?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The transfer task requires a usable publication decision that considers both what the research supports and how students may interpret the wording.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your suitability judgement identifies a consequential feature of the proposed study-skills claim.</li><li><span class="util-guided-review__feature-key">B.</span> Your recommendation identifies a concrete editorial action.</li><li><span class="util-guided-review__feature-key">C.</span> Your reason connects the proposed action to the survey and the student audience.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Locate a specific phrase whose strength, qualification or emphasis affects the meaning communicated to student readers.</li><li><span class="util-guided-review__feature-key">Missing B:</span> State whether the editor should retain, qualify or change the identified wording, rather than offering only a general evaluation.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain how the action would help students understand the observed comparison without drawing conclusions beyond the evidence.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a4-a4-m6-item-3" data-checklist-item-id="checklist-a4-a4-m6-item-3"><label class="util-interactive-checklist__label" for="checklist-a4-a4-m6-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m6-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A4"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M4" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Advise the study-skills editor</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-transfer-prompt-a4-m4-910" data-response-part-id="A4-transfer-prompt-a4-m4-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-transfer-prompt-a4-m4-910-label" for="learner-workspace-a4-a4-transfer-prompt-a4-m4-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a4-a4-transfer-prompt-a4-m4-910-desc"><p>You have compared research explanations and reconsidered one of your own judgements. Now apply the same evaluative approach to a <strong>publication decision</strong> rather than a choice between two explanations.</p><p>Read the proposed university study-skills claim in the accompanying editorial scenario. Decide whether it is suitable for a page intended to inform undergraduate students.</p><p>Produce a short editorial recommendation that:</p><ol><li>States whether the proposed claim is suitable as written.</li><li>Identifies a specific consequential feature of its wording.</li><li>Explains how that feature could affect a student&#39;s understanding of the fictional survey.</li><li>Recommends whether the editor should retain, qualify or change the claim, with an evidence-grounded reason.</li></ol><p>Use the six dimensions of explanation quality where relevant. Your response should advise the editor on a bounded communication decision, not produce a complete new research explanation or a general recommendation about how students should study.</p></div><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-transfer-prompt-a4-m4-910" name="learner-workspace-a4-a4-transfer-prompt-a4-m4-910" rows="5" aria-describedby="learner-workspace-a4-a4-transfer-prompt-a4-m4-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><aside class="util-study-tips" data-region="study-tips" id="journey-study-tips" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--study-tips" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg></span><span class="util-semantic-icon__label">Study tips</span></h2><div class="util-study-tips__content util-prose-measure"><ul><li><strong>Compare before deciding:</strong> Identify what each explanation actually says, then justify your preference through consequential differences in wording and evidential meaning.</li><li><strong>Keep the evidence in view:</strong> The survey reports 72% and 58% reporting good concentration, a difference of 14 percentage points. It establishes an observed association, not a causal improvement in concentration.</li><li><strong>Weigh connected dimensions:</strong> Numerical accuracy and evidential support constrain acceptable claims; clarity, relevance, context, qualification and proportionality shape how effectively those claims serve a reader.</li><li><strong>Use judgement beyond the comparison:</strong> Revisit your reasoning after feedback, and apply the same evaluative approach when deciding whether research claims are suitable for a different audience or communication purpose.</li></ul></div></aside><style id="prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="tru
