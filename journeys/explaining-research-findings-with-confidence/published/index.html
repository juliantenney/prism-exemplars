feature-key">C.</span> Each percentage matches its group&#39;s reported concentration figure.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Compare the group-size cells with the &#39;Number of students&#39; column and correct any transcription error.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Copy the counts from the outcome column, keeping them separate from the total number surveyed.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Check the percentage column in the source and correct any figure entered as a count or assigned to the wrong group.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c01--checklist-a2-a2-m4-item-1" data-checklist-item-id="checklist-a2-a2-m4-item-1"><label class="util-interactive-checklist__label" for="lj-c01--checklist-a2-a2-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c01--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m4-c-2" data-revision-criterion-id="a2-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you calculated the difference using the two reported percentages?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Subtracting incompatible quantities or reversing the intended operation can produce a misleading comparison.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The working subtracts one group&#39;s concentration percentage from the other group&#39;s percentage.</li><li><span class="util-guided-review__feature-key">B.</span> The arithmetic result agrees with the difference between the percentages.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Use the two values in the percentage row as the operands and write out the subtraction.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Recalculate the subtraction from the source percentages and correct the final numerical entry if necessary.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c01--checklist-a2-a2-m4-item-2" data-checklist-item-id="checklist-a2-a2-m4-item-2"><label class="util-interactive-checklist__label" for="lj-c01--checklist-a2-a2-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c01--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m4-c-3" data-revision-criterion-id="a2-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you used percentage-point terminology without treating the difference as a causal effect?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The unit describes the size of the observed gap, while the study design limits what can be inferred from that gap.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The calculated difference is labelled in percentage points.</li><li><span class="util-guided-review__feature-key">B.</span> The table does not describe the difference as the amount by which breaks improved concentration.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Replace a bare percent sign or ambiguous unit with &#39;percentage points&#39; for the subtraction of two percentages.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Describe the result as a difference between reported proportions, not a measured improvement caused by breaks.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c01--checklist-a2-a2-m4-item-3" data-checklist-item-id="checklist-a2-a2-m4-item-3"><label class="util-interactive-checklist__label" for="lj-c01--checklist-a2-a2-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c01--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c01--activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Test the limits of inference</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The numerical comparison established how the two groups&#39; reported outcomes differ. The next intellectual demand is to decide what kinds of claims those observations can support, using the study design and limitations as grounds for your judgement.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>A numerical difference is not the same as an explanation for why that difference occurred. Examine the study&#39;s methodological limitations and consider which statements describe recorded evidence and which go beyond it.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">For each statement, locate the evidence that could support it. Consider whether the statement describes a recorded result, interprets a relationship or claims an effect or generalisation that the research design cannot establish.</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A3"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="3" data-figure-id="asset-vb-38-4-va-a3-claim-strength-01-activity-a3-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C01/activity-a3-materials-entry.png" alt="Decision framework for classifying research claims by evidential support; detailed description follows." aria-describedby="lj-c01--figure-description-asset-vb-38-4-va-a3-claim-strength-01-activity-a3-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 3.</strong> Questions to ask before deciding what a research statement establishes.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c01--figure-description-asset-vb-38-4-va-a3-claim-strength-01-activity-a3-materials-entry">The framework begins by asking what a statement claims. One route checks whether its content can be located directly in recorded observations. A second route examines whether the statement cautiously interprets a relationship and whether the evidence supports that wording. A third route checks stronger assertions about causes, outcomes not measured or populations beyond the sample. Each route returns to the research account and relevant limitations before reaching one of three judgement categories: recorded observation, qualified interpretation or not established by the evidence. No candidate statements are classified.</p></figure><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A3-M3" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Observation, inference and causation</span></p><h3 class="util-md-heading util-md-heading--source-3">Observation</h3><p>An observation is information recorded during a study. In a survey, an observation may be a count, percentage or participant response. A statement that reports an observation should remain close to what was actually recorded.</p><h3 class="util-md-heading util-md-heading--source-3">Inference</h3><p>An inference is an interpretation made using observations. It may describe a relationship or propose an explanation. The wording of an inference needs to reflect how much support the evidence provides.</p><h3 class="util-md-heading util-md-heading--source-3">Causation</h3><p>Causation means that one factor produces a change in another. Establishing a causal effect requires evidence that can distinguish the proposed cause from other plausible influences.</p><p>An observational study may identify a relationship between recorded characteristics without establishing why that relationship exists. Factors that were not controlled, the method of measurement and the participants included can all affect the scope of a conclusion.</p><p>When classifying a statement, examine both the kind of claim being made and the specific evidence needed to support it.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c01--learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="lj-c01--learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="lj-c01--learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c01--learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c01--learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="lj-c01--learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c01--learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Revisit the study&#39;s method and complete set of limitations.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A3-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Research account: Method and limitations</span></p><h3 class="util-md-heading util-md-heading--source-2">Study breaks and concentration among undergraduate students</h3><p>This is the same fictional, illustrative study introduced earlier. The figures are not findings from actual research.</p><h3 class="util-md-heading util-md-heading--source-3">Research question and method</h3><p>Research question: Is there a relationship between taking regular short study breaks and reporting good concentration among undergraduate students?</p><p>Researchers conducted an observational survey of 200 undergraduate students. Students reported their break-taking habits and whether they experienced good concentration while studying. Researchers did not randomly assign students to break-taking conditions.</p><h3 class="util-md-heading util-md-heading--source-3">Recorded group findings</h3><table><thead><tr><th>Group</th><th>Reported break-taking</th><th>Students in group</th><th>Students reporting good concentration</th><th>Percentage reporting good concentration</th></tr></thead><tbody><tr><td>A</td><td>Regular short breaks</td><td>100</td><td>72</td><td>72%</td></tr><tr><td>B</td><td>No regular short breaks</td><td>100</td><td>58</td><td>58%</td></tr></tbody></table><p>The observed difference between the reported percentages was 14 percentage points.</p><h3 class="util-md-heading util-md-heading--source-3">Recorded methodological boundaries</h3><ul><li>The study was observational rather than randomised; there was no random assignment.</li><li>Break-taking habits and concentration were self-reported.</li><li>Sleep, motivation, workload and study environment were not controlled.</li><li>The study did not establish correspondence between reported concentration and objectively measured concentration or academic performance.</li><li>The participants cannot automatically be assumed to represent all undergraduate students.</li><li>Statistical significance and confidence intervals were not established by the information supplied.</li><li>A causal effect of breaks on concentration was not established.</li><li>An optimal frequency or duration of breaks was not established.</li></ul><p>Use the numerical observations and these methodological particulars when examining each candidate statement.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the supplied candidate statements about the study.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a3-a3-m4" data-material-source-id="A3-M4" data-activity-id="A3"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A3-M4" data-material-type="classification_table" data-body-format="markdown" data-render-mode="table_workspace"><p cla a-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Simulated candidate statements for evaluation</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><p>These four statements are simulated candidate interpretations written for this learning activity. They are not additional findings from the fictional research study. Their wording is deliberately varied.</p><h3 class="util-md-heading util-md-heading--source-3">Candidate S1</h3><p>&#39;Taking regular short study breaks causes undergraduate students to concentrate better.&#39;</p><h3 class="util-md-heading util-md-heading--source-3">Candidate S2</h3><p>&#39;In Group B, 58 of the 100 students reported good concentration while studying.&#39;</p><h3 class="util-md-heading util-md-heading--source-3">Candidate S3</h3><p>&#39;The survey suggests an association between reported regular short study breaks and reported good concentration among the students surveyed.&#39;</p><h3 class="util-md-heading util-md-heading--source-3">Candidate S4</h3><p>&#39;The results establish that regular short breaks improve academic performance for all undergraduate students.&#39;</p><p>For each statement, decide whether it is a recorded observation, a qualified interpretation or a claim not established by the evidence. Support your decision using the research account. Do not assume that every candidate statement is reliable.</p></article></li></ol></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Select relevant methodological evidence to justify each classification.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Review feedback on the classifications and supporting reasons.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A completed classification of the candidate statements, with a concise justification for each judgement grounded in the study&#39;s numerical evidence, observational design or methodological limitations. The response distinguishes directly recorded information from possible inference and identifies when a statement exceeds the evidence available.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-task-step-step-3-3" data-response-part-id="A3-task-step-step-3-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c01--learner-workspace-a3-a3-task-step-step-3-3-label" for="lj-c01--learner-workspace-a3-a3-task-step-step-3-3">Your response</label><p class="util-learner-workspace__prompt" id="lj-c01--learner-workspace-a3-a3-task-step-step-3-3-desc">For each statement, classify whether it reports an observation, offers a qualified interpretation or makes a claim that the evidence does not establish.</p><textarea class="util-learner-workspace__input" id="lj-c01--learner-workspace-a3-a3-task-step-step-3-3" name="learner-workspace-a3-a3-task-step-step-3-3" rows="6" aria-describedby="lj-c01--learner-workspace-a3-a3-task-step-step-3-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-task-step-step-4-4" data-response-part-id="A3-task-step-step-4-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c01--learner-workspace-a3-a3-task-step-step-4-4-label" for="lj-c01--learner-workspace-a3-a3-task-step-step-4-4">Your response</label><p class="util-learner-workspace__prompt" id="lj-c01--learner-workspace-a3-a3-task-step-step-4-4-desc">Select relevant methodological evidence to justify each classification.</p><textarea class="util-learner-workspace__input" id="lj-c01--learne Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c01--learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c01--learner-task-a3">Back to your task (Test the limits of inference)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m5-c-0" data-revision-criterion-id="a3-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Does each classification match the strength and type of claim in its candidate statement?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A statement that records a count demands a different judgement from one that asserts an effect or offers a cautious interpretation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Statements confined to directly recorded data are distinguished from statements interpreting a relationship.</li><li><span class="util-guided-review__feature-key">B.</span> Qualified wording is considered separately from wording that asserts proof or certainty.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Locate the wording that reports a source value and distinguish it from wording that goes beyond recording that value.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Compare the strength of the candidate&#39;s verbs with the study design and decide whether its classification should change.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c01--checklist-a3-a3-m5-item-0" data-checklist-item-id="checklist-a3-a3-m5-item-0"><label class="util-interactive-checklist__label" for="lj-c01--checklist-a3-a3-m5-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c01--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m5-c-1" data-revision-criterion-id="a3-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you grounded your reasons in identifiable study evidence?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A judgement supported by a specific source detail can be checked, whereas a general opinion about research cannot.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Numerical claims are checked against the recorded group figures.</li><li><span class="util-guided-review__feature-key">B.</span> Claims about the research method refer to how the survey was conducted.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the relevant group, count or percentage in the source and connect it explicitly to your judgement.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name the relevant methodological feature, such as self-reporting or the absence of random assignment, and explain its relevance.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c01--checklist-a3-a3-m5-item-1" data-checklist-item-id="checklist-a3-a3-m5-item-1"><label class="util-interactive-checklist__label" for="lj-c01--checklist-a3-a3-m5-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c01--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m5-c-2" data-revision-criterion-id="a3-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you considered the methodological limitation relevant to each disputed inference?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A limitation matters when it affects the particular conclusion being considered, not simply because it appears in a list.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your reasons distinguish self-reported concentration from objectively measured outcomes.</li><li><span class="util-guided-review__feature-key">B.</span> Where appropriate, your reasons consider uncontrolled factors or the surveyed population.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify which outcome the researchers recorded and which outcome a candidate statement would additionally require.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect the specific uncontrolled factor or sampling boundary to the claim it could affect.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c01--checklist-a3-a3-m5-item-2" data-checklist-item-id="checklist-a3-a3-m5-item-2"><label class="util-interactive-checklist__label" for="lj-c01--checklist-a3-a3-m5-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c01--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m5-c-3" data-revision-criterion-id="a3-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you tested causal, performance and population-wide assertions against what was established?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Accepting claims beyond the design and measurements would turn a limited survey comparison into an unsupported conclusion.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Claims that breaks produced a change are assessed against the observational design.</li><li><span class="util-guided-review__feature-key">B.</span> Claims about academic performance are checked against the outcome actually recorded.</li><li><span class="util-guided-review__feature-key">C.</span> Claims about all students are checked against the study&#39;s participant scope.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Check whether the study assigned conditions or controlled alternative influences before accepting an asserted cause.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Distinguish reported concentration from academic-performance measures and reconsider any conclusion that treats them as equivalent.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify the population actually surveyed and reconsider whether the evidence supports a universal statement.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c01--checklist-a3-a3-m5-item-3" data-checklist-item-id="checklist-a3-a3-m5-item-3"><label class="util-interactive-checklist__label" for="lj-c01--checklist-a3-a3-m5-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c01--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c01--activity-A4" data-journey-section="true" data-activity-id="A4" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Prepare your independent interpretation</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A4"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The earlier work established the research context, numerical comparison and boundaries of interpretation. You can now decide which evidence and uncertainties need your attention when preparing to communicate the finding to someone unfamiliar with research methods.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have examined the study design, compared the numerical findings and considered the limits of inference. Bring these strands together by identifying the evidence you will need when communicating the main finding independently. This is preparation, not the explanation itself.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Select the evidence that matters for an accurate account, consider what remains uncertain and apply the same reasoning to a public-facing claim with a different communication purpose. Preserve the distinction between evidence preparation and writing the full explanation.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which part of the study can you now interpret confidently, and which aspect would you check again before writing your own explanation? Identify the evidence or reasoning behind your judgement.</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A4"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Review the complete fictional research account and your earlier responses.</p></span></div></div><div class="util-composition-learn-item util-composition-learn-item--example" data-composition-role="example"><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A4-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Complete research account for your final review</span></p><h3 class="util-md-heading util-md-heading--source-2">Study breaks and concentration among undergraduate students</h3><p>This is the complete fictional, illustrative research account. The study and its numerical results were created for educational purposes; they do not represent an actual investigation.</p><h3 class="util-md-heading util-md-heading--source-3">Research question</h3><p>Is there a relationship between taking regular short study breaks and reporting good concentration among undergraduate students?</p><h3 class="util-md-heading util-md-heading--source-3">Research method</h3><p>Researchers conducted an observational survey of 200 undergraduate students. Students self-reported their study habits and whether they experienced good concentration while studying. The researchers compared students who reported taking regular short study breaks with those who reported not taking regular short breaks. Participants were not randomly assigned to conditions.</p><h3 class="util-md-heading util-md-heading--source-3">Findings</h3><table><thead><tr><th>Group</th><th>Reported break-taking</th><th>Number of students</th><th>Students reporting good concentration</th><th>Percentage reporting good concentration</th></tr></thead><tbody><tr><td>A</td><td>Regular short breaks</td><td>100</td><td>72</td><td>72%</td></tr><tr><td>B</td><td>No regular short breaks</td><td>100</td><td>58</td><td>58%</td></tr></tbody></table><p>The observed difference was 14 percentage points.</p><h3 class="util-md-heading util-md-heading--source-3">Methodological limitations</h3><ul><li>The design was observational, not randomised, and students were not randomly assigned to break-taking conditions.</li><li>Study habits and concentration were self-reported rather than independently measured.</li><li>Sleep, motivation, workload and study environment were not controlled.</li><li>The study did not establish whether reported concentration corresponded to objectively measured concentration or academic performance.</li><li>The participants cannot automatically be treated as representative of all undergraduate students.</li><li>Statistical significance and confidence intervals were not established by the supplied information.</li><li>No causal effect of taking breaks was established.</li><li>The findings do not establish an optimal frequency or duration for breaks.</li></ul><p>Use this account to identify the evidence you would rely on and the uncertainties you would need to recognise when communicating the study.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c01--learner-task-a4" data-composition-moment="do" data-activity-id="A4" aria-labelledby="lj-c01--learner-task-a4-heading"><h3 class="util-composition-moment-heading" id="lj-c01--learner-task-a4-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c01--learner-revision-reminder-a4" hidden data-revision-reminder="true" data-activity-id="A4" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c01--learner-revision-guidance-a4" hidden data-revision-guidance="true" data-activity-id="A4" aria-labelledby="lj-c01--learner-revision-guidance-a4-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c01--learner-revision-guidance-a4-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Record the source details you expect to draw on when explaining the principal finding, including the relevant numerical evidence.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Independent interpretation readiness record</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify methodological uncertainties that affect what can be concluded.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A4-M2" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Simulated study-support webpage claim</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-3">Communication situation</h3><p>A university study-support team is preparing a short webpage for students looking for advice about study habits. A hypothetical draft includes this proposed claim:</p><p>&gt; This survey proves that all students will concentrate better if they take regular short breaks.</p><p>This is a simulated communication claim for evaluation, not a finding established by the research.</p><p>Your role is to advise the webpage team about the claim&#39;s evidential support. Use the fictional study account as your only research source. You do not need to write replacement webpage copy.</p></article></li></ol></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Consider a new communication situation: a university study-support webpage is considering a short claim that the survey proves all students will concentrate better if they take regular short breaks. Identify which parts of that claim require qualification and which study evidence you would consult before deciding how to communicate it.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Record one aspect of the evidence you feel confident interpreting and one aspect you may need to revisit before &#39;Write your first explanation&#39;.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A concise evidence-readiness record identifying accurate source particulars, relevant methodological uncertainties and a reasoned response to a new public-facing claim. The learner distinguishes evidence that can be reported from assertions requiring further support, and identifies a specific confidence or uncertainty point. The response does not need to contain a completed explanation of the principal finding.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-evidence-i-would-use-1" data-response-part-id="A4-template-section-a4-m3-section-evidence-i-would-use-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-evidence-i-would-use-1-label" for="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-evidence-i-would-use-1">Evidence I would use</label><p class="util-learner-workspace__prompt" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-evidence-i-would-use-1-desc">Identify the source details and numerical observations you would need when explaining the study&#39;s main finding.</p><textarea class="util-learner-workspace__input" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-evidence-i-would-use-1" name="learner-workspace-a4-a4-template-section-a4-m3-section-evidence-i-would-use-1" rows="6" aria-describedby="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-evidence-i-would-use-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-uncertainties-i-must-consider-2" data-response-part-id="A4-template-section-a4-m3-section-uncertainties-i-must-consider-2"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-uncertainties-i-must-consider-2-label" for="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-uncertainties-i-must-consider-2">Uncertainties I must consider</label><p class="util-learner-workspace__prompt" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-uncertainties-i-must-consider-2-desc">Record the methodological boundaries that affect what can reasonably be concluded.</p><textarea class="util-learner-workspace__input" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-uncertainties-i-must-consider-2" name="learner-workspace-a4-a4-template-section-a4-m3-section-uncertainties-i-must-consider-2" rows="6" aria-describedby="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-uncertainties-i-must-consider-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-my-judgement-about-the-webpage-claim-3" data-response-part-id="A4-template-section-a4-m3-section-my-judgement-about-the-webpage-claim-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-my-judgement-about-the-webpage-claim-3-label" for="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-my-judgement-about-the-webpage-claim-3">My judgement about the webpage claim</label><p class="util-learner-workspace__prompt" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-my-judgement-about-the-webpage-claim-3-desc">State briefly whether the proposed wording is justified and identify the part or parts that need examination.</p><textarea class="util-learner-workspace__input" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-my-judgement-about-the-webpage-claim-3" name="learner-workspace-a4-a4-template-section-a4-m3-section-my-judgement-about-the-webpage-claim-3" rows="5" aria-describedby="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-my-judgement-about-the-webpage-claim-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-evidence-supporting-my-judgement-4" data-response-part-id="A4-template-section-a4-m3-section-evidence-supporting-my-judgement-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-evidence-supporting-my-judgement-4-label" for="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-evidence-supporting-my-judgement-4">Evidence supporting my judgement</label><p class="util-learner-workspace__prompt" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-evidence-supporting-my-judgement-4-desc">Identify the particular recorded observations or methodological limitations that support your decision about the webpage wording.</p><textarea class="util-learner-workspace__input" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-evidence-supporting-my-judgement-4" name="learner-workspace-a4-a4-template-section-a4-m3-section-evidence-supporting-my-judgement-4" rows="5" aria-describedby="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-evidence-supporting-my-judgement-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-what-i-can-interpret-confidently-5" data-response-part-id="A4-template-section-a4-m3-section-what-i-can-interpret-confidently-5"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-what-i-can-interpret-confidently-5-label" for="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-what-i-can-interpret-confidently-5">What I can interpret confidently</label><p class="util-learner-workspace__prompt" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-what-i-can-interpret-confidently-5-desc">Name one aspect of the study that you can now interpret and explain why you feel confident about it.</p><textarea class="util-learner-workspace__input" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-what-i-can-interpret-confidently-5" name="learner-workspace-a4-a4-template-section-a4-m3-section-what-i-can-interpret-confidently-5" rows="6" aria-describedby="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-what-i-can-interpret-confidently-5-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="6" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-what-i-need-to-revisit-6" data-response-part-id="A4-template-section-a4-m3-section-what-i-need-to-revisit-6"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-what-i-need-to-revisit-6-label" for="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-what-i-need-to-revisit-6">What I need to revisit</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-what-i-need-to-revisit-6-desc"><p>Identify one specific uncertainty, concept or source detail to check before writing your independent explanation.</p><p>Keep your entries concise. This workspace prepares you for the next stage; it is not a request to write the completed explanation.</p></div><textarea class="util-learner-workspace__input" id="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-what-i-need-to-revisit-6" name="learner-workspace-a4-a4-template-section-a4-m3-section-what-i-need-to-revisit-6" rows="6" aria-describedby="lj-c01--learner-workspace-a4-a4-template-section-a4-m3-section-what-i-need-to-revisit-6-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c01--learner-check-a4" data-check-sidebar-open aria-controls="lj-c01--learner-check-a4" aria-expanded="false" aria-label="Check your work: Prepare your independent interpretation">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c01--learner-check-a4" data-composition-moment="check" data-activity-id="A4" data-check-sidebar="available" aria-labelledby="lj-c01--learner-check-a4-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c01--learner-check-a4-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c01--learner-check-a4-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c01--learner-task-a4">Back to your task (Prepare your independent interpretation)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A4-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a4-a4-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a4-m5-c-0" data-revision-criterion-id="a4-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you selected accurate and relevant evidence for your future explanation?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An independent explanation needs identifiable observations and a clear account of how the data were collected.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your evidence selection includes the two comparison groups and their reported concentration figures.</li><li><span class="util-guided-review__feature-key">B.</span> Your selection distinguishes the numerical observations from the research method.</li><li><span class="util-guided-review__feature-key">C.</span> Any numerical difference you include uses the correct unit.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify both groups and extract the corresponding outcome figures from the research account.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Separate what students reported from how researchers gathered and compared the reports.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Check whether you are describing a percentage within a group or the arithmetic gap between two percentages, then label it accordingly.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c01--checklist-a4-a4-m5-item-0" data-checklist-item-id="checklist-a4-a4-m5-item-0"><label class="util-interactive-checklist__label" for="lj-c01--checklist-a4-a4-m5-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c01--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a4-m5-c-1" data-revision-criterion-id="a4-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you identified uncertainties that genuinely limit interpretation of this study?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Relevant uncertainty prevents an account of reported survey results from becoming an unwarranted explanation of cause or performance.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> You identify the observational design or lack of random assignment where relevant.</li><li><span class="util-guided-review__feature-key">B.</span> You distinguish self-reported concentration from outcomes that were not objectively measured.</li><li><span class="util-guided-review__feature-key">C.</span> You identify at least one uncontrolled factor or a limit on representativeness.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Add the feature of the design that affects whether an observed relationship can be treated as an effect.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name the recorded outcome and identify the additional kind of measurement that would be needed for any broader outcome claim.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Select a specific factor or population boundary from the source and connect it to the uncertainty it creates.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c01--checklist-a4-a4-m5-item-1" data-checklist-item-id="checklist-a4-a4-m5-item-1"><label class="util-interactive-checklist__label" for="lj-c01--checklist-a4-a4-m5-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c01--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a4-m5-c-2" data-revision-criterion-id="a4-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Does your judgement about the webpage claim follow from the study evidence?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Public-facing advice needs wording whose strength and scope are defensible from the research supplied.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> You examine the strength of the proposed claim rather than accepting its wording at face value.</li><li><span class="util-guided-review__feature-key">B.</span> You consider whether the claim&#39;s intended audience is broader than the study participants.</li><li><span class="util-guided-review__feature-key">C.</span> Your judgement cites at least two source particulars and explains their relevance.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the words that express certainty or an effect and compare them with what the study design establishes.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Compare the people addressed by the webpage with the participant population described in the research account.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Choose two distinct observations or limitations and state how each supports or constrains the proposed communication.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c01--checklist-a4-a4-m5-item-2" data-checklist-item-id="checklist-a4-a4-m5-item-2"><label class="util-interactive-checklist__label" for="lj-c01--checklist-a4-a4-m5-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c01--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a4-m5-c-3" data-revision-criterion-id="a4-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you identified a specific area of confidence and a specific point to revisit before independent writing?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A targeted readiness judgement helps you use the next stage to explain the evidence independently rather than repeat uncertain or unsupported claims.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your confidence statement names a particular interpretation skill or source feature.</li><li><span class="util-guided-review__feature-key">B.</span> Your confidence statement explains what supports that confidence.</li><li><span class="util-guided-review__feature-key">C.</span> Your point to revisit identifies a particular concept, calculation or limitation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Replace a general statement of confidence with one concrete aspect, such as identifying the method, comparing proportions or recognising an inference boundary.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect the named skill to a source detail or reasoning operation you can carry out accurately.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Specify the exact issue you would check before writing, rather than saying only that you need more practice.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c01--checklist-a4-a4-m5-item-3" data-checklist-item-id="checklist-a4-a4-m5-item-3"><label class="util-interactive-checklist__label" for="lj-c01--checklist-a4-a4-m5-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c01--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A4"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M4" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Apply your evidence judgement to public communication</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-transfer-prompt-a4-m4-910" data-response-part-id="A4-transfer-prompt-a4-m4-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c01--learner-workspace-a4-a4-transfer-prompt-a4-m4-910-label" for="lj-c01--learner-workspace-a4-a4-transfer-prompt-a4-m4-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="lj-c01--learner-workspace-a4-a4-transfer-prompt-a4-m4-910-desc"><p>The earlier classification activity asked you to judge individual research statements. Here, the purpose changes: a university team wants to publish advice that students may act upon.</p><p>Read the proposed webpage claim in the task card and consider the responsibilities of communicating survey evidence to this audience.</p><p>In the sections &#39;My judgement about the webpage claim&#39; and &#39;Evidence supporting my judgement&#39; of your readiness record:</p><ol><li>Identify which assertions in the proposed claim you would challenge or qualify before publication.</li><li>Refer to at least two specific details from the fictional research account that inform your judgement.</li><li>Briefly explain why those details matter for wording intended as general advice to students.</li></ol><p>Do not write a replacement webpage statement or a complete explanation of the study&#39;s main finding. Make a short, evidence-grounded communication judgement.</p></div><textarea class="util-learner-workspace__input" id="lj-c01--learner-workspace-a4-a4-transfer-prompt-a4-m4-910" name="learner-workspace-a4-a4-transfer-prompt-a4-m4-910" rows="5" aria-describedby="lj-c01--learner-workspace-a4-a4-transfer-prompt-a4-m4-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><style id="lj-c01--prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;position:fixed;top:var(--learner-sticky-nav-height,0px);left:0;right:0;z-index:40;margin:0 auto;max-width:42rem;width:calc(100% - 1.5rem);padding:.45rem .75rem;border:1px solid #cbd5e1;border-left:3px solid #64748b;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.12)}.util-learner-renderer-vnext .util-revision-reminder__chrome{display:flex ="0" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Write your first explanation</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="3"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Briefing</span><p class="util-journey-position" aria-label="Section 1 of 3"><span class="util-journey-position__visible" aria-hidden="true">1 of 3</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c02--journey-assessment-judgement" aria-label="Next section: Judgement"><span class="util-journey-adjacent__title">Judgement</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All se
