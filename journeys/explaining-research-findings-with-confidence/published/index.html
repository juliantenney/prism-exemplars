data-lj-nav-id="C05">Revise your explanation</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="C06">Explain what changed and why</button></li></ol></nav><p class="lj-shell__toc-label lj-shell__toc-label--journal" id="lj-shell-journal-label">Learning Journal</p><nav aria-labelledby="lj-shell-journal-label"><ol class="lj-shell__toc lj-shell__toc--journal"><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="journal" data-lj-journal-nav="true" data-lj-journal-title="Your Learning Journal" aria-label="Your Learning Journal"><span class="lj-shell__toc-link-text">Your Learning Journal</span><span class="lj-shell__toc-link-count" data-lj-journal-count hidden></span></button></li></ol></nav></div></div></aside><div class="lj-shell__workspace"><div id="lj-shell-live" class="lj-shell__live" aria-live="polite" aria-atomic="true"></div><main id="lj-shell-main" class="lj-shell__main" data-lj-role="active-resource" aria-label="Learning content" tabindex="-1"></main></div></div><div class="lj-shell__templates" hidden aria-hidden="true"><template id="lj-resource-overview"><article class="lj-shell-overview" data-lj-overview="true" role="region" aria-labelledby="lj-shell-overview-heading"><h2 id="lj-shell-overview-heading" class="lj-shell-overview__title" data-lj-resource-title="true" tabindex="-1">Overview</h2><div class="util-editorial-opening" data-region="editorial-opening"><figure class="util-visual-asset util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-figure-number="1"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/editorial-opening.png" alt="" loading="lazy" decoding="async" /></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> An undergraduate student considering research evidence before writing an explanation.</figcaption></figure></div><div class="lj-shell-overview__body"><p>Research findings often sound straightforward until you try to explain what they really mean. A percentage may be easy to repeat, but harder to interpret. A confident explanation may be persuasive without being justified by the evidence.</p><p>In this learning journey, you will work with a fictional research study about study breaks and concentration among undergraduate students. You will interpret the evidence, write your own explanation for a non-specialist reader, compare contrasting explanations and improve your original work.</p><p>The emphasis is not on finding one perfect answer. You will develop your ability to recognise quality, make informed communication decisions and explain why some ways of presenting research are more effective than others.</p><p>The journey takes approximately <strong>90 minutes of learning time across one week</strong>. You can complete it in more than one sitting. Keep your written responses because later experiences ask you to return to your earlier work.</p><p>You will begin by interpreting the study and producing an independent explanation. Only after that will you encounter worked examples and more detailed guidance. You will then use what you have learned to diagnose and revise your explanation, before reflecting on the reasoning behind your changes.</p><p>You do not need specialist statistical knowledge or external research materials. Everything required to understand the illustrative study is supplied within the journey.</p></div></article></template><template id="lj-resource-C01"><article class="util-learner-page util-page util-learner-renderer-vnext" data-renderer="vnext" data-page-kind="interactive" data-persistence-page-key="v1::0ca423ea-a9af-460b-ad3e-25cf261b805f::learner-page::2.0.0::a1-a2-a3::understanding-research-evidence" data-persistence-storage-key="learner-renderer-vnext:draft:v1::0ca423ea-a9af-460b-ad3e-25cf261b805f::learner-page::2.0.0::a1-a2-a3::understanding-research-evidence" data-composition-mode="moments" data-composed-activity-count="3" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Interpret the research evidence</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="4"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 4"><span class="util-journey-position__visible" aria-hidden="true">1 of 4</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#activity-A1" aria-label="Next section: Investigate the study design"><span class="util-journey-adjacent__title">Investigate the study design</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#activity-A1">Investigate the study design</a></li><li><a class="util-journey-all-link" href="#activity-A2">Compare the concentration figures</a></li><li><a class="util-journey-all-link" href="#activity-A3">Examine the limits of inference</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C01/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This self-study resource explores a fictional investigation of study breaks and concentration among undergraduate students. Begin by examining the research account, then compare the recorded figures and consider the limits of what the evidence can establish. Work through the three activities in order, returning to the study whenever you need to check a detail.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The activities move from identifying how the evidence was collected, through comparing numerical observations, to distinguishing observations from possible inferences. You will use this preparation in <strong>Write your first explanation</strong>, where you will independently communicate the study&#39;s principal finding.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><p>Research evidence becomes meaningful when we understand <strong>what was investigated, how information was collected, what was recorded and what conclusions the evidence can support</strong>. These are related questions, but they are not interchangeable.</p><h3 class="util-md-heading util-md-heading--source-3">Research questions and methods</h3><p>A <strong>research question</strong> identifies the relationship, experience or phenomenon an investigation seeks to examine. The research method determines what kind of evidence can be collected to address that question.</p><p>An <strong>observational survey</strong> gathers information about participants&#39; existing experiences, characteristics or behaviours without assigning them to experimental conditions. A <strong>randomised experiment</strong>, by contrast, assigns participants to conditions using a random procedure. These designs support different kinds of conclusions, particularly when considering cause and effect.</p><p><strong>Self-reported information</strong> comes from participants&#39; descriptions of their own experiences or behaviour. It can provide useful evidence about what people report, but it should not automatically be treated as an independently measured outcome.</p><h3 class="util-md-heading util-md-heading--source-3">Reading comparisons</h3><p>Researchers sometimes compare groups defined by different characteristics or behaviours. Before comparing their outcomes, identify how each group was formed, how many participants it contains and whether the same outcome was recorded for both groups.</p><p>A <strong>percentage</strong> expresses a proportion out of 100. When comparing two percentages, subtracting one from the other gives a <strong>percentage-point difference</strong>. For example, if 40% of one fictional group and 25% of another report an outcome, the difference is 15 percentage points. This describes a difference between the group proportions; it does not establish that individual participants changed by that amount.</p><h3 class="util-md-heading util-md-heading--source-3">Observations and inferences</h3><p>An <strong>observation</strong> describes information actually recorded in an investigation. An <strong>inference</strong> is a conclusion drawn from observations. Inferences can be reasonable, but their strength depends on the evidence and research design.</p><p>An <strong>association</strong> is an observed relationship between characteristics. <strong>Causation</strong> is a stronger claim: that one factor produces a change in another. An observed association alone does not establish causation. Other potentially relevant factors may help explain an observed pattern.</p><h3 class="util-md-heading util-md-heading--source-3">Considering methodological limitations</h3><p>A <strong>methodological limitation</strong> is a feature of a study that restricts what can reasonably be concluded from its findings. Relevant considerations include whether participants were randomly assigned, whether outcomes were self-reported or independently measured, whether other potentially relevant factors were controlled, and whether the sample represents a wider population.</p><p>Statistical uncertainty is another consideration. Without an appropriate analysis, an observed numerical difference should not be described as statistically significant or assigned a confidence interval.</p><p>These distinctions provide a way to examine evidence carefully without assuming that every observed pattern has one explanation. Use them to investigate the fictional study, keeping the recorded information separate from conclusions that would require further evidence.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C01/knowledge-summary-after-content.png" alt="Concept map linking research questions, methods, observations, inferences and limitations; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> How research methods, observations and methodological limitations shape the conclusions evidence can support.</figcaption><p class="util-visual-asset-detailed-description" id="figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">A concept map begins with a research question connected to the research method used to investigate it. An observational survey leads to information collected from participants, with self-report identified as one measurement characteristic. Comparison groups and percentages organise recorded observations. Observations provide a basis for possible inferences, while methodological limitations restrict their strength and scope. A separate distinction identifies association as an observed relationship and causation as a stronger claim requiring additional evidence. No findings from the fictional study are classified or interpreted.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Identify the research question, observational survey method, participants, comparison groups and self-reported outcome in the fictional study. <span class="util-outcome-id">(LO1)</span></li><li>Compare the reported concentration outcomes in the two groups and calculate the observed difference using the correct numerical values and units. <span class="util-outcome-id">(LO2)</span></li><li>Distinguish recorded observations from possible inferences and identify methodological limitations that restrict conclusions about the relationship between reported study breaks and concentration. <span class="util-outcome-id">(LO3)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Investigate the study design</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Identify the research question, observational survey design, participants, comparison groups and self-reported outcome.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Interpreting research begins with identifying what was investigated and how the evidence was obtained. Your existing ability to read and compare information provides the starting point for examining this study&#39;s research design, participants and reported outcomes.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You are investigating a fictional research study called &#39;Study breaks and concentration among undergraduate students&#39;. Its findings are synthetic and are provided for educational purposes, not as results of an actual investigation. Your aim is to examine the evidence before independently communicating its main finding in &#39;Write your first explanation&#39;. Begin by exploring what the researchers wanted to investigate, who participated and how the information was collected.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Locate the relevant information in the research account before entering it into the table. Distinguish the behaviour used to form the groups from the outcome recorded for each group.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which details tell you how the researchers obtained their information, rather than what the researchers might have wanted to establish?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A1"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A1-M3" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Research terminology</span></p><h3 class="util-md-heading util-md-heading--source-3">Terms to help you read the study</h3><p><strong>Observational survey:</strong> A study in which researchers collect information about participants&#39; existing experiences, characteristics or behaviour without assigning them to experimental conditions. Observational findings can describe patterns, but do not by themselves establish cause and effect.</p><p><strong>Self-report:</strong> Information provided by participants about themselves, such as their habits, experiences or perceptions. It is different from a measurement independently recorded by an instrument or observer.</p><p><strong>Comparison group:</strong> One set of participants whose recorded characteristics or outcomes can be compared with those of another set. Comparison groups do not have to be created through random assignment.</p><p><strong>Research outcome:</strong> The characteristic or result that researchers record and examine in relation to their research question.</p><p><strong>Association:</strong> A relationship or pattern observed between two characteristics. An association does not, on its own, establish that one characteristic causes the other.</p><p>Use these definitions to interpret the study&#39;s method. They do not replace the details you need to locate in the research account.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explore the complete fictional study account, including its research question, method, participants, comparison groups, numerical findings and methodological limitations.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A1-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Study breaks and concentration: research account</span></p><h3 class="util-md-heading util-md-heading--source-2">Study breaks and concentration among undergraduate students</h3><p><strong>Fictional illustrative research study.</strong> This study and its findings are synthetic, created for educational purposes. They are not results from an actual investigation.</p><h3 class="util-md-heading util-md-heading--source-3">Research question</h3><p>Is taking regular short breaks during independent study associated with students reporting good concentration?</p><h3 class="util-md-heading util-md-heading--source-3">Context and method</h3><p>A university research team conducted an <strong>observational survey</strong> of 200 undergraduate students. Students reported their own study habits and concentration. The researchers divided respondents into two groups according to whether they reported taking regular short breaks during independent study.</p><p>The survey was observational, not a randomised experiment. Students were not randomly assigned to take or avoid breaks.</p><h3 class="util-md-heading util-md-heading--source-3">Recorded findings</h3><table><thead><tr><th>Group</th><th>Reported study habit</th><th>Number of students</th><th>Students reporting good concentration</th><th>Percentage reporting good concentration</th></tr></thead><tbody><tr><td>Group A</td><td>Regular short breaks</td><td>100</td><td>72</td><td>72%</td></tr><tr><td>Group B</td><td>No regular short breaks</td><td>100</td><td>58</td><td>58%</td></tr></tbody></table><p>The recorded difference between the group percentages was <strong>14 percentage points</strong> (72% minus 58%).</p><h3 class="util-md-heading util-md-heading--source-3">Methodological limitations</h3><ul><li>The study was observational rather than a randomised experiment.</li><li>Students reported their own study habits and concentration.</li><li>Students were not randomly assigned to take or avoid breaks.</li><li>Potentially relevant factors such as sleep, motivation, workload and study environment were not controlled.</li><li>The study does not establish whether reported concentration corresponds to objectively measured concentration or academic performance.</li><li>The sample cannot automatically be assumed to represent all undergraduate students.</li><li>No statistical significance, confidence interval or causal effect has been established.</li></ul><p>The study did not establish the best frequency or duration of study breaks.</p><h3 class="util-md-heading util-md-heading--source-3">Using the account</h3><p>Keep this full research account available while completing the activities. Locate the exact source details needed for each response. Your task is to examine the evidence before writing your own explanation in <strong>Write your first explanation</strong>.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Complete the study identification table: (1) identify the research question; (2) identify the research method and whether students were randomly assigned; (3) identify the participants and how the two groups were formed; and (4) identify the outcome recorded and how it was measured. Use information from the study rather than assumptions about how research is usually conducted. Check your entries against the source and use any factual feedback to correct misunderstandings.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a1-a1-m2" data-material-source-id="A1-M2" data-activity-id="A1"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A1-M2" data-material-type="analysis_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Identify the research design</span></p><p class="util-learner-table-workspace__guidance">Enter your responses in the table below. Your draft is saved on this device when possible. It is not submitted.</p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="a1-a1-m2-col-study-feature-0">Study feature</th><th scope="col" id="a1-a1-m2-col-your-evidence-based-identification-1">Your evidence-based identification</th></tr></thead><tbody><tr><th scope="row" id="a1-a1-m2-row-0" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Research question</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r0-c1" name="a1-a1-m2-input-r0-c1" data-learner-cell="a1-a1-m2-input-r0-c1" rows="3" aria-labelledby="a1-a1-m2-row-0 a1-a1-m2-col-your-evidence-based-identification-1" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a1-a1-m2-row-1" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Research method and assignment</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r1-c1" name="a1-a1-m2-input-r1-c1" data-learner-cell="a1-a1-m2-input-r1-c1" rows="3" aria-labelledby="a1-a1-m2-row-1 a1-a1-m2-col-your-evidence-based-identification-1" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a1-a1-m2-row-2" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Participants and comparison groups</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r2-c1" name="a1-a1-m2-input-r2-c1" data-learner-cell="a1-a1-m2-input-r2-c1" rows="3" aria-labelledby="a1-a1-m2-row-2 a1-a1-m2-col-your-evidence-based-identification-1" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a1-a1-m2-row-3" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Recorded outcome and measurement</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r3-c1" name="a1-a1-m2-input-r3-c1" data-learner-cell="a1-a1-m2-input-r3-c1" rows="3" aria-labelledby="a1-a1-m2-row-3 a1-a1-m2-col-your-evidence-based-identification-1" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A completed study identification table accurately identifying the research question, observational design, participants, group definitions and self-reported outcome. Entries should distinguish information collected from participants from experimental assignment or objective measurement, and should be traceable to the supplied study account.</p></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#learner-check-a1" data-check-sidebar-open aria-controls="learner-check-a1" aria-expanded="false" aria-label="Check your work: Investigate the study design">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a1" data-composition-moment="check" data-activity-id="A1" data-check-sidebar="available" aria-labelledby="learner-check-a1-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="learner-check-a1-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a1">Back to your task (Investigate the study design)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m4-c-0" data-revision-criterion-id="a1-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you identified the research question as it is stated in the study?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Changing the question can change the relationship you think the study investigated.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My entry identifies the study habit being investigated.</li><li><span class="util-guided-review__feature-key">B.</span> My entry identifies the concentration outcome in the terms used by the study.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Return to the research question and name the particular study habit rather than referring generally to learning strategies.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Check the wording of the research question and distinguish the outcome participants reported from any objective measure of performance.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-0" data-checklist-item-id="checklist-a1-a1-m4-item-0"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m4-c-1" data-revision-criterion-id="a1-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you accurately identified the method and assignment arrangements?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confusing an observational survey with an experiment would change what conclusions the research design can support.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My entry names the type of study conducted.</li><li><span class="util-guided-review__feature-key">B.</span> My entry accurately describes whether the researchers assigned students to groups.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Find the description of how the researchers collected information and record the stated study design.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Check the method paragraph for how the groups were formed and whether assignment was random.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-1" data-checklist-item-id="checklist-a1-a1-m4-item-1"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m4-c-2" data-revision-criterion-id="a1-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you described the participants and both comparison groups accurately?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The meaning of the numerical comparison depends on knowing who was included and how the groups differed.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My entry includes the participant population and total number surveyed.</li><li><span class="util-guided-review__feature-key">B.</span> My entry distinguishes the two groups by the reported study habit.</li><li><span class="util-guided-review__feature-key">C.</span> My entry records the size of each group.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Locate the sample description and add both the participant type and the recorded total.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Use the group descriptions in the research account to identify the behaviour that distinguishes the groups.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Check the &#39;Number of students&#39; column and add the relevant size for each group.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-2" data-checklist-item-id="checklist-a1-a1-m4-item-2"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m4-c-3" data-revision-criterion-id="a1-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you identified what outcome was recorded and how it was measured?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A response that substitutes a different outcome would misrepresent the evidence available for interpretation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My entry names the recorded concentration outcome.</li><li><span class="util-guided-review__feature-key">B.</span> My entry identifies who supplied the outcome information.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Find the outcome wording in the research question and results table, and use that rather than an assumed learning outcome.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Return to the method description and specify whether the information came from students&#39; reports or an independent measurement.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-3" data-checklist-item-id="checklist-a1-a1-m4-item-3"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Compare the concentration figures</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Compare the recorded concentration outcomes and calculate the difference between the group percentages using the correct units.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Identifying the two groups and the self-reported outcome establishes what the numbers refer to. You can now use those distinctions to compare the recorded results without confusing group proportions with changes in individual concentration.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have identified how the study was conducted and what its participants reported. Now focus on the numerical evidence. Examine the figures for both groups, record the proportions reporting good concentration and calculate the difference between them.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Work from the recorded counts and group sizes to the percentages, then subtract the two percentages. Keep the outcome label attached to each value and distinguish a difference between percentages from a percentage change.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">What exactly is being compared when you subtract the two group percentages?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A2"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a2-comparison-01-activity-a2-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C01/activity-a2-materials-entry.png" alt="Two proportional strips compare reported good concentration in groups of 100; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-a2-comparison-01-activity-a2-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 2.</strong> Compare the recorded proportions reporting good concentration using the same scale for both groups.</figcaption><p class="util-visual-asset-detailed-description" id="figure-description-asset-vb-38-4-va-a2-comparison-01-activity-a2-materials-entry">Two proportional strips share a scale from 0% to 100%. Group A represents 100 students who reported taking regular short breaks; 72 of the 100 reported good concentration, occupying 72% of its strip, while the remaining 28% forms the other segment. Group B represents 100 students who did not report regular short breaks; 58 of the 100 reported good concentration, occupying 58% of its strip, while the remaining 42% forms the other segment. Both strips describe self-reported outcomes. The difference between the percentages is left for learners to calculate.</p></figure><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A2-M3" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Percentages and percentage points</span></p><h3 class="util-md-heading util-md-heading--source-3">Two different numerical ideas</h3><p>A <strong>percentage</strong> describes a proportion out of 100. For example, 30 out of 100 people corresponds to 30%.</p><p>A <strong>percentage-point difference</strong> describes the subtraction of one percentage from another. For example, the difference between 30% and 20% is 10 percentage points.</p><p>This is not the same as saying there was a 10% relative increase. You do not need to calculate relative percentage change in this activity.</p><p>For your study comparison, subtract the two recorded percentages, then label the result with the appropriate unit. The subtraction describes a difference between groups, not a measured change within individual students.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Use the numerical data from the fictional study to complete the comparison table. (1) Record the number of students in each group and the number reporting good concentration. (2) Record the corresponding percentage for each group. (3) Calculate the difference between the two percentages. (4) State the correct unit for the difference and identify which group has the higher reported proportion. Check your calculation and units before continuing.</p></span></div><article class="util-material-block util-material-table-block" data-material-id="A2-M1" data-material-type="data_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Recorded concentration data</span></p><p>These are the <strong>synthetic observations</strong> from the fictional survey <em>Study breaks and concentration among undergraduate students</em>.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Group</th><th>Reported break-taking habit</th><th>Number of students</th><th>Number reporting good concentration</th><th>Percentage reporting good concentration</th></tr></thead><tbody><tr><td>Group A</td><td>Regular short breaks</td><td>100</td><td>72</td><td>72%</td></tr><tr><td>Group B</td><td>No regular short breaks</td><td>100</td><td>58</td><td>58%</td></tr></tbody></table></div><p>The percentages describe students <strong>reporting good concentration</strong>. They are not measurements of academic performance.</p><p>Use the recorded values to complete your own comparison. The difference is intentionally not calculated in this table.</p></article><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a2-a2-m2" data-material-source-id="A2-M2" data-activity-id="A2"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A2-M2" data-material-type="comparison_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Your numerical comparison</span></p><p class="util-learner-table-workspace__guidance">Enter your responses in the table below. Your draft is saved on this device when possible. It is not submitted.</p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="a2-a2-m2-col-comparison-entry-0">Comparison entry</th><th scope="col" id="a2-a2-m2-col-number-of-students-1">Number of students</th><th scope="col" id="a2-a2-m2-col-number-reporting-good-concentration-2">Number reporting good concentration</th><th scope="col" id="a2-a2-m2-col-percentage-reporting-good-concentration-3">Percentage reporting good concentration</th><th scope="col" id="a2-a2-m2-col-comparison-notes-or-units-4">Comparison notes or units</th></tr></thead><tbody><tr><th scope="row" id="a2-a2-m2-row-0" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Group A</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r0-c1" name="a2-a2-m2-input-r0-c1" data-learner-cell="a2-a2-m2-input-r0-c1" rows="3" aria-labelledby="a2-a2-m2-row-0 a2-a2-m2-col-number-of-students-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r0-c2" name="a2-a2-m2-input-r0-c2" data-learner-cell="a2-a2-m2-input-r0-c2" rows="3" aria-labelledby="a2-a2-m2-row-0 a2-a2-m2-col-number-reporting-good-concentration-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r0-c3" name="a2-a2-m2-input-r0-c3" data-learner-cell="a2-a2-m2-input-r0-c3" rows="3" aria-labelledby="a2-a2-m2-row-0 a2-a2-m2-col-percentage-reporting-good-concentration-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r0-c4" name="a2-a2-m2-input-r0-c4" data-learner-cell="a2-a2-m2-input-r0-c4" rows="3" aria-labelledby="a2-a2-m2-row-0 a2-a2-m2-col-comparison-notes-or-units-4" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a2-a2-m2-row-1" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Group B</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r1-c1" name="a2-a2-m2-input-r1-c1" data-learner-cell="a2-a2-m2-input-r1-c1" rows="3" aria-labelledby="a2-a2-m2-row-1 a2-a2-m2-col-number-of-students-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r1-c2" name="a2-a2-m2-input-r1-c2" data-learner-cell="a2-a2-m2-input-r1-c2" rows="3" aria-labelledby="a2-a2-m2-row-1 a2-a2-m2-col-number-reporting-good-concentration-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r1-c3" name="a2-a2-m2-input-r1-c3" data-learner-cell="a2-a2-m2-input-r1-c3" rows="3" aria-labelledby="a2-a2-m2-row-1 a2-a2-m2-col-percentage-reporting-good-concentration-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r1-c4" name="a2-a2-m2-input-r1-c4" data-learner-cell="a2-a2-m2-input-r1-c4" rows="3" aria-labelledby="a2-a2-m2-row-1 a2-a2-m2-col-comparison-notes-or-units-4" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a2-a2-m2-row-2" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Calculated difference</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r2-c1" name="a2-a2-m2-input-r2-c1" data-learner-cell="a2-a2-m2-input-r2-c1" rows="3" aria-labelledby="a2-a2-m2-row-2 a2-a2-m2-col-number-of-students-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r2-c2" name="a2-a2-m2-input-r2-c2" data-learner-cell="a2-a2-m2-input-r2-c2" rows="3" aria-labelledby="a2-a2-m2-row-2 a2-a2-m2-col-number-reporting-good-concentration-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r2-c3" name="a2-a2-m2-input-r2-c3" data-learner-cell="a2-a2-m2-input-r2-c3" rows="3" aria-labelledby="a2-a2-m2-row-2 a2-a2-m2-col-percentage-reporting-good-concentration-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m2-input-r2-c4" name="a2-a2-m2-input-r2-c4" data-learner-cell="a2-a2-m2-input-r2-c4" rows="3" aria-labelledby="a2-a2-m2-row-2 a2-a2-m2-col-comparison-notes-or-units-4" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A completed numerical comparison showing accurate extraction of both group sizes, counts and percentages; a correctly calculated difference between the group percentages; appropriate use of percentage-point units; and accurate identification of the group with the higher proportion reporting good concentration. The response must remain a comparison of recorded group outcomes rather than an assertion about individual improvement.</p></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#learner-check-a2" data-check-sidebar-open aria-controls="learner-check-a2" aria-expanded="false" aria-label="Check your work: Compare the concentration figures">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a2" data-composition-moment="check" data-activity-id="A2" data-check-sidebar="available" aria-labelledby="learner-check-a2-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="learner-check-a2-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a2">Back to your task (Compare the concentration figures)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m4-c-0" data-revision-criterion-id="a2-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you transferred the group sizes and counts accurately?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Incorrect source values would make the numerical comparison unreliable even if the subsequent arithmetic were correct.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each row records the correct number of students for its group.</li><li><span class="util-guided-review__feature-key">B.</span> Each row records the correct number reporting good concentration.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Compare the &#39;Number of students&#39; entries with the fixed data table and correct any swapped or mistyped values.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Check the outcome-count column in the source table and transfer the count for the corresponding group.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-0" data-checklist-item-id="checklist-a2-a2-m4-item-0"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m4-c-1" data-revision-criterion-id="a2-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you associated each percentage with the correct group and outcome?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Reversing the percentages or losing the outcome label would change the meaning of the observed comparison.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each percentage appears alongside the group from which it was recorded.</li><li><span class="util-guided-review__feature-key">B.</span> My comparison identifies the percentages as proportions reporting good concentration.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Match each percentage to its row in the fixed data table before interpreting the difference.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Add the recorded outcome label and avoid describing these figures as measured academic performance.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-1" data-checklist-item-id="checklist-a2-a2-m4-item-1"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m4-c-2" data-revision-criterion-id="a2-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you calculated the difference between the two percentages correctly?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The size and direction of the comparison depend on subtracting the correct values in a consistent order.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My calculation subtracts the smaller recorded percentage from the larger recorded percentage.</li><li><span class="util-guided-review__feature-key">B.</span> My calculated difference is consistent with the values I entered for both groups.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the higher and lower percentages in the source table, then repeat the subtraction using those two values.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Recalculate using the percentages in your own table and correct either the transferred values or the arithmetic if they disagree.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-2" data-checklist-item-id="checklist-a2-a2-m4-item-2"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m4-c-3" data-revision-criterion-id="a2-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you used the correct unit and identified the direction of the difference?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A numerical difference without its correct unit or direction can be mistaken for a causal effect or an individual improvement.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My difference is labelled in percentage points.</li><li><span class="util-guided-review__feature-key">B.</span> My comparison correctly identifies which group has the higher reported proportion.</li><li><span class="util-guided-review__feature-key">C.</span> My wording describes a group comparison rather than an individual change.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Replace a bare percent sign on the subtracted result with the unit used for differences between percentages.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Compare the two recorded percentages and identify the group associated with the larger value.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Refer to the proportions reported by the two groups rather than claiming that individual students&#39; concentration increased.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-3" data-checklist-item-id="checklist-a2-a2-m4-item-3"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Examine the limits of inference</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Distinguish observations from inferences, connect methodological limitations to restricted conclusions and apply that reasoning to a different communication context.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type=
