le-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r2-c4" name="a1-a1-m3-input-r2-c4" data-learner-cell="a1-a1-m3-input-r2-c4" rows="3" aria-labelledby="a1-a1-m3-row-2 a1-a1-m3-col-evidence-or-wording-supporting-the-decision-4" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r2-c5" name="a1-a1-m3-input-r2-c5" data-learner-cell="a1-a1-m3-input-r2-c5" rows="3" aria-labelledby="a1-a1-m3-row-2 a1-a1-m3-col-consequence-for-a-non-specialist-reader-5" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify a specific strength and weakness in the alternatives, referring to their wording and the underlying evidence.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A1-M2" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Three pairs of candidate explanations</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><p><strong>Simulated candidate explanations for evaluation.</strong> These are deliberately contrasting pieces of writing about the fictional survey. They are not authoritative statements of its findings. Some contain wording that may mislead readers.</p><p>Read both candidates in each pair. Decide which you would prefer for a non-specialist reader and record your reasoning in the comparison table. Make your judgements before consulting the detailed feedback.</p><h3 class="util-md-heading util-md-heading--source-3">Pair 1</h3><p><strong>Candidate explanation 1A</strong></p><p>&gt; In a survey of 200 undergraduate students, 72% of those reporting regular short study breaks also reported good concentration, compared with 58% of those without regular breaks. That is a difference of 14 percentage points. Because students reported their own habits and concentration, the figures describe an association rather than showing that breaks caused better concentration.</p><p><strong>Candidate explanation 1B</strong></p><p>&gt; Taking regular short breaks improves students&#39; concentration by 14%. In the survey, 72% of students who took regular breaks reported good concentration, compared with 58% of students who did not. These results show that introducing regular breaks will improve concentration for undergraduates, making breaks an effective way to increase their ability to focus while studying.</p><h3 class="util-md-heading util-md-heading--source-3">Pair 2</h3><p><strong>Candidate explanation 2A</strong></p><p>&gt; Students who reported taking regular short breaks were more likely to report good concentration than students who did not: 72% compared with 58%. The difference is 14 percentage points. The survey suggests a connection between study-break habits and how students describe their concentration, but it does not show whether breaks themselves make the difference.</p><p><strong>Candidate explanation 2B</strong></p><p>&gt; Among 200 undergraduates surveyed, 72 of the 100 who reported regular short breaks also reported good concentration, compared with 58 of the 100 who reported no regular short breaks. This 14-percentage-point difference is an observed association. Because the survey was observational and self-reported, and factors such as sleep, motivation, workload and study environment were uncontrolled, the findings cannot establish that breaks caused the difference.</p><h3 class="util-md-heading util-md-heading--source-3">Pair 3</h3><p><strong>Candidate explanation 3A</strong></p><p>&gt; The clearest finding is a difference in students&#39; reports: 72% of those who regularly took short study breaks reported good concentration, compared with 58% of those who did not. The 14-percentage-point gap describes an association, not proof that breaks improve concentration. It is a useful comparison, provided readers understand that the responses were self-reported.</p><p><strong>Candidate explanation 3B</strong></p><p>&gt; This fictional survey compared two groups of 100 undergraduates. Good concentration was reported by 72 students in the regular-break group and 58 in the no-regular-break group, a difference of 14 percentage points. The groups were not randomly assigned, and other influences were uncontrolled. The result concerns reported concentration among these participants; it does not establish a causal effect or a finding about academic performance.</p><p>For each pair, identify a consequential difference in the wording, acknowledge a strength or limitation of the alternative, and explain what matters most for the intended reader.</p></article></li></ol></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain why the differences matter for the reader and justify your preference.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Record any uncertainty or competing strength that makes the decision difficult. Complete your judgements before viewing fuller feedback or detailed quality guidance.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A completed comparison record containing a clear preference for each pair, evidence-grounded reasons for the choice, identifiable strengths and weaknesses of the alternatives, and an explanation of the consequences for a non-specialist reader. Where both candidates have defensible strengths, the justification should explain the trade-off rather than assume one universally correct wording.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-task-step-step-3-3" data-response-part-id="A1-task-step-step-3-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-task-step-step-3-3-label" for="learner-workspace-a1-a1-task-step-step-3-3">Your response</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-task-step-step-3-3-desc">Identify a specific strength and weakness in the alternatives, referring to their wording and the underlying evidence.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-task-step-step-3-3" name="learner-workspace-a1-a1-task-step-step-3-3" rows="6" aria-describedby="learner-workspace-a1-a1-task-step-step-3-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-task-step-step-4-4" data-response-part-id="A1-task-step-step-4-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-task-step-step-4-4-label" for="learner-workspace-a1-a1-task-step-step-4-4">Your response</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-task-step-step-4-4-desc">Explain why the differences matter for the reader and justify your preference.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-task-step-step-4-4" name="learner-workspace-a1-a1-task-step-step-4-4" rows="6" aria-describedby="learner-workspace-a1-a1-task-step-step-4-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-task-step-step-5-5" data-response-part-id="A1-task-step-step-5-5"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-task-step-step-5-5-label" for="learner-workspace-a1-a1-task-step-step-5-5">Your response</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-task-step-step-5-5-desc">Record any uncertainty or competing strength that makes the decision difficult. Complete your judgements before viewing fuller feedback or detailed quality guidance.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-task-step-step-5-5" name="learner-workspace-a1-a1-task-step-step-5-5" rows="6" aria-describedby="learner-workspace-a1-a1-task-step-step-5-5-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#learner-check-a1" data-check-sidebar-open aria-controls="learner-check-a1" aria-expanded="false" aria-label="Check your work: Choose the stronger explanation">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a1" data-composition-moment="check" data-activity-id="A1" data-check-sidebar="available" aria-labelledby="learner-check-a1-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="learner-check-a1-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check- ils"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without a stated preference and comparative reasoning, a reader cannot tell how you weighed the alternatives.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each pair has an identifiable preferred candidate.</li><li><span class="util-guided-review__feature-key">B.</span> The preference is supported by a difference between the two candidates.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the candidate you favour in the relevant row before explaining your reasons.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify one contrasting feature of their actual wording and explain why it influenced your choice.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-0" data-checklist-item-id="checklist-a1-a1-m4-item-0"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m4-c-1" data-revision-criterion-id="a1-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you supported your judgements with inspectable wording or survey evidence?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A preference based only on tone or confidence may overlook whether the explanation represents the research faithfully.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your justification identifies a specific phrase, figure or claim from the candidates.</li><li><span class="util-guided-review__feature-key">B.</span> Relevant numerical or methodological claims are checked against the survey.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Quote or identify the precise wording that affected your judgement instead of describing an explanation as simply good or clear.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect the disputed wording to the reported group values, outcome definition or observational design.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-1" data-checklist-item-id="checklist-a1-a1-m4-item-1"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m4-c-2" data-revision-criterion-id="a1-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you recognised meaningful strengths and weaknesses in both alternatives?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Comparative judgement becomes superficial when it ignores genuine advantages of the explanation not selected.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your response identifies a substantive strength of the preferred candidate.</li><li><span class="util-guided-review__feature-key">B.</span> Your response acknowledges a limitation or competing strength of the alternative.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Specify whether its advantage concerns the reported finding, the strength of the claim, accessibility or necessary context.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify something the alternative communicates effectively, or a particular weakness that matters, rather than dismissing it wholesale.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-2" data-checklist-item-id="checklist-a1-a1-m4-item-2"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m4-c-3" data-revision-criterion-id="a1-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you explained why your comparison matters for a non-specialist reader?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The purpose of the explanation is to support a warranted interpretation, not merely to satisfy a stylistic preference.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your justification describes a likely reader interpretation.</li><li><span class="util-guided-review__feature-key">B.</span> Your judgement connects that consequence to the purpose of explaining research evidence.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Explain what a reader might understand or mistakenly conclude from the feature you identified.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Show how the wording affects the reader&#39;s ability to understand the observed difference without overstating its implications.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-3" data-checklist-item-id="checklist-a1-a1-m4-item-3"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Test claims against the evidence</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your initial comparisons required you to weigh competing explanations. This activity concentrates on the evidential boundaries underlying those judgements, distinguishing weaknesses that change the meaning of the research from differences that are primarily matters of communication.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>A convincing explanation is not necessarily an accurate one. Examine how particular claims represent the survey&#39;s numerical findings and what they imply about the relationship between study breaks and concentration. Use the evidence to identify consequential differences without relying on a preferred answer being supplied.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Separate what the survey directly reports from what a candidate explanation infers. Check numerical language, the measured outcome and the methodological basis for each conclusion.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">What specific part of the evidence supports or limits the claim, and how would changing the wording affect its meaning?</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the supplied candidate claims and the survey evidence.</p></span></div><article class="util-material-block util-material-table-block" data-material-id="A2-M1" data-material-type="data_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Survey evidence for checking claims</span></p><p><strong>Fictional, synthetic survey evidence for educational use.</strong> The following values are illustrative, not findings from an authentic study.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Survey group</th><th>Number of students</th><th>Number reporting good concentration</th><th>Percentage reporting good concentration</th></tr></thead><tbody><tr><td>Reported regular short study breaks</td><td>100</td><td>72</td><td>72%</td></tr><tr><td>Reported no regular short study breaks</td><td>100</td><td>58</td><td>58%</td></tr><tr><td><strong>Observed difference</strong></td><td>—</td><td><strong>14 students between equally sized groups</strong></td><td><strong>14 percentage points</strong></td></tr></tbody></table></div><p><strong>Study design and scope</strong></p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Feature</th><th>Recorded information</th></tr></thead><tbody><tr><td>Study type</td><td>Observational survey of 200 undergraduate students</td></tr><tr><td>Group assignment</td><td>No random assignment</td></tr><tr><td>Break-taking measure</td><td>Student self-report</td></tr><tr><td>Concentration measure</td><td>Student self-report of good concentration</td></tr><tr><td>Uncontrolled factors</td><td>Sleep, motivation, workload and study environment</td></tr><tr><td>Objective concentration or academic performance</td><td>Not established by the survey</td></tr><tr><td>Representativeness</td><td>Not established for undergraduates more generally</td></tr></tbody></table></div><p>Use the table to examine the wording and implications of each candidate claim. The table supplies evidence, not judgements about those claims.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>For each claim, identify the specific numerical or inferential feature that requires evaluation.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a2-a2-m3" data-material-source-id="A2-M3" data-activity-id="A2"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A2-M3" data-material-type="analysis_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span c 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Four candidate claims to investigate</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><p><strong>Simulated candidate claims for evaluation.</strong> The following statements are proposed descriptions of the fictional survey, not authoritative conclusions. Some may contain deliberate errors or unsupported inferences.</p><p><strong>Candidate claim 1</strong></p><p>&gt; In the survey, 72% of undergraduates reporting regular short study breaks said they had good concentration, compared with 58% of those without regular breaks. The difference between the two groups was 14%.</p><p><strong>Candidate claim 2</strong></p><p>&gt; The survey shows that taking regular short study breaks causes better concentration. Since 72% of students taking breaks reported good concentration, compared with 58% of students not taking regular breaks, students can improve their concentration by introducing regular breaks.</p><p><strong>Candidate claim 3</strong></p><p>&gt; The survey establishes that undergraduates who take regular short breaks perform better academically. The 72% and 58% figures demonstrate that this approach works for university students generally, not just the students who completed the survey.</p><p><strong>Candidate claim 4</strong></p><p>&gt; In this observational survey of 200 undergraduates, students reporting regular short study breaks were more likely to report good concentration than those reporting no regular breaks: 72% compared with 58%. The observed association does not establish that taking breaks caused the difference.</p><p>For each claim, identify the feature that requires scrutiny, judge its evidential status, and explain what correction or qualification, if any, would be necessary. Base your reasoning on the survey table rather than on assumptions about the benefits of taking breaks.</p></article></li></ol></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain your judgement using the relevant values, outcome definition or methodological limitation.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify the correction or qualification needed where a claim exceeds the evidence. Complete the analysis before consulting fuller explanatory feedback.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A claim-by-claim analysis that identifies consequential numerical and inferential features, makes defensible evidence-based judgements, and explains the corrections or qualifications required where claims are misleading. Strong responses di 4" name="learner-workspace-a2-a2-task-step-step-4-4" rows="6" aria-describedby="learner-workspace-a2-a2-task-step-step-4-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-task-step-step-5-5" data-response-part-id="A2-task-step-step-5-5"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-task-step-step-5-5-label" for="learner-workspace-a2-a2-task-step-step-5-5">Your response</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-task-step-step-5-5-desc">Identify the correction or qualification needed where a claim exceeds the evidence. Complete the analysis before consulting fuller explanatory feedback.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-task-step-step-5-5" name="learner-workspace-a2-a2-task-step-step-5-5" rows="6" aria-describedby="learner-workspace-a2-a2-task-step-step-5-5-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#learner-check-a2" data-check-sidebar-open aria-controls="learner-check-a2" aria-expanded="false" aria-label="Check your work: Test claims against the evidence">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a2" data-composition-moment="check" data-activity-id="A2" data-check-sidebar="available" aria-labelledby="learner-check-a2-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="learner-check-a2-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a2">Back to your task (Test claims against the evidence)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m4-c-0" data-revision-criterion-id="a2-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you checked the numerical meaning of each relevant claim?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confusing a percentage-point difference with a percentage change alters the quantitative message communicated to readers.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your analysis distinguishes the reported group percentages from the difference between them.</li><li><span class="util-guided-review__feature-key">B.</span> Your judgement refers to the actual group sizes or reported counts where useful.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the two reported percentages and separately describe the unit used for the difference.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Use the two groups of 100 and their reported counts to check whether the candidate&#39;s numerical description matches the table.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-0" data-checklist-item-id="checklist-a2-a2-m4-item-0"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m4-c-1" data-revision-criterion-id="a2-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you identified what the survey actually measured?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Treating reported concentration as observed performance can make an explanation appear to support outcomes that were never measured.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your response distinguishes self-reported concentration from objective concentration or academic performance.</li><li><span class="util-guided-review__feature-key">B.</span> Your assessment respects the scope of the surveyed participants.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the survey&#39;s reported outcome and identify any different outcome introduced by the candidate wording.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Where a candidate extends its claim to all undergraduates, distinguish the surveyed students from the wider population whose representativeness was not established.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-1" data-checklist-item-id="checklist-a2-a2-m4-item-1"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m4-c-2" data-revision-criterion-id="a2-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you distinguished observed association from a demonstrated causal effect?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An observational difference between groups cannot by itself show that changing study-break habits would produce the observed difference.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your response identifies wording that implies a causal or intervention effect.</li><li><span class="util-guided-review__feature-key">B.</span> Your explanation connects the inferential limit to the observational design.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Locate verbs such as causes, improves or will produce and assess whether the study design supports that level of inference.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Refer to the absence of random assignment and the uncontrolled factors when explaining why a causal conclusion would need qualification.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-2" data-checklist-item-id="checklist-a2-a2-m4-item-2"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m4-c-3" data-revision-criterion-id="a2-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you justified any proposed correction or qualification using the evidence?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A correction is useful only when it addresses the precise gap between what the candidate says and what the survey supports.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each problematic claim has a specific identified feature requiring change.</li><li><span class="util-guided-review__feature-key">B.</span> Your proposed change preserves the supported part of the finding.</li><li><span class="util-guided-review__feature-key">C.</span> Any claim judged supportable has a reasoned explanation rather than an unexplained label.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State whether the problem concerns numerical language, causal strength, measured outcome or population scope before proposing a change.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Retain the relevant observed values or group comparison while narrowing only the claim that exceeds the available evidence.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify the survey detail and limiting language that make the claim&#39;s interpretation defensible.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-3" data-checklist-item-id="checklist-a2-a2-m4-item-3"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Weigh six dimensions of quality</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The earlier comparisons exposed differences in quality, while the claim analysis clarified the evidential boundaries that explanations must respect. These experiences now provide concrete reference points for applying six connected dimensions and weighing legitimate communication trade-offs.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have made comparative judgements and examined the limits of the evidence. Now use a more explicit framework to explain why particular communication choices strengthen or weaken an explanation. The framework helps you articulate your reasoning without requiring every reader to prefer the same wording.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Use the dimensions as connected lenses rather than independent scores. Consider whether a weakness changes the evidential meaning of the explanation or reflects a defensible choice about emphasis and presentation.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which dimensions matter most in this comparison, how do they interact, and why does your chosen balance serve the intended reader?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A3"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Study the six dimensions of explanation quality and the explanation of their relationships.</p></span></div></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a3-quality-framework-01-activity-a3-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C03/activity-a3-materials-entry.png" alt="Framework distinguishing evidential constraints and communication trade-offs; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-a3-quality-framework-01-activity-a3-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 2.</strong> Distinguishing evidential requirements from communication choices when judging an explanation.</figcaption><p class="util-visual-asset-detailed-description" id="figure-description-asset-vb-38-4-va-a3-quality-framework-01-activity-a3-materials-entry">The framework connects six dimensions to a holistic judgement. Numerical accuracy concerns correct figures and units; evidential support concerns warranted claims; proportionality concerns the strength of conclusions. These form an area of evidential constraints. Clarity concerns understandable wording, relevance concerns the principal finding, and context and qualification concern information needed for responsible interpretation. These form an area of communication considerations. Both areas connect to judgement for a non-specialist reader. The distinction helps separate misleading claims from defensible differences in presentation; it does not rank the candidate explanations.</p></figure><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A3-M1" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Six connected dimensions of explanation quality</span></p><p>An explanation of research evidence does more than repeat a result. It helps a reader understand <strong>what was observed, how confidently it can be interpreted, and why it matters</strong>. Six dimensions work together to shape that understanding.</p><p><strong>Numerical accuracy</strong> means representing quantities and comparisons correctly. In the fictional survey, 72% of students in one group and 58% in the other reported good concentration. Their difference is <strong>14 percentage points</strong>, not a 14% increase. Accurate figures provide the foundation for trustworthy interpretation, but correct arithmetic alone does not make every conclusion defensible.</p><p><strong>Evidential support</strong> concerns the relationship between the claim and the available research. The survey reports an association between students&#39; break-taking habits and their reported concentration. Because students were not randomly assigned and other factors were uncontrolled, the findings do not establish that breaks caused the difference. A numerically accurate explanation can still be misleading if it makes a causal claim that the design does not support.</p><p><strong>Clarity</strong> concerns whether a reader can follow the explanation without unnecessary effort. Clear wording identifies the groups, the outcome and the comparison in accessible language. <strong>Relevance</strong> concerns whether the explanation keeps the central finding and its significance for the reader in view. These dimensions interact: a brief statement may communicate the main comparison efficiently, while excessive compression can hide the information needed to interpret it responsibly.</p><p><strong>Context and qualification</strong> supply information that changes how a finding should be understood. Here, the self-reported measures, observational design, lack of random assignment and uncontrolled factors matter because they limit the conclusions available. Qualification is not a ritual list of caveats. It should make the relevant limits visible without obscuring the observed result.</p><p><strong>Proportionality</strong> means matching the strength of the explanation to the strength of the evidence. It depends on numerical accuracy, evidential support and appropriate qualification. A statement can be easy to read and contain the correct percentages yet remain disproportionate if it claims that regular breaks will improve concentration. Equally, an explanation that dwells on every limitation without making the observed group difference understandable may fail its communication purpose.</p><h3 class="util-md-heading util-md-heading--source-3">How the dimensions work together</h3><p>Imagine two accurate explanations of the same survey. One states the group difference plainly and briefly, with a short indication that it is an association. Another includes the same finding alongside fuller information about self-reporting, uncontrolled factors and the limits of generalisation. The first may make the main result easier to grasp; the second may better support readers who need to evaluate the research design. Neither advantage automatically settles the judgement.</p><p>The governing boundary is that <strong>communication choices must preserve numerical meaning and stay within the evidence</strong>. Within that boundary, there can be reasonable disagreement about brevity, emphasis and how much methodological detail a particular audience needs. The most useful judgement therefore asks not how many dimensions an explanation appears to satisfy, but what consequences its particular strengths and weaknesses have for the intended reader.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify how the candidates differ across relevant dimensions.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a3-a3-m3" data-material-source-id="A3-M3" data-activity-id="A3"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A3-M3" data-material-type="comparison_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Apply the six dimensions and weigh the trade-offs</span></p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="a3-a3-m3-col-dimension-0">Dimension</th><th scope="col" id="a3-a3-m3-col-evidence-from-candidate-3a-1">Evidence from candidate 3A</th><th scope="col" id="a3-a3-m3-col-evidence-from-candidate-3b-2">Evidence from candidate 3B</th><t
