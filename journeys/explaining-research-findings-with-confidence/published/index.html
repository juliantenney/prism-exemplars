sistence-page-key="v1::6cceaf64-a4f6-402e-922f-e7a4a16d8986::learner-page::2.0.0::no-activities::diagnose-your-explanation" data-persistence-storage-key="learner-renderer-vnext:draft:v1::6cceaf64-a4f6-402e-922f-e7a4a16d8986::learner-page::2.0.0::no-activities::diagnose-your-explanation" data-composition-mode="moments" data-composed-activity-count="0" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Diagnose your explanation</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="3"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Briefing</span><p class="util-journey-position" aria-label="Section 1 of 3"><span class="util-journey-position__visible" aria-hidden="true">1 of 3</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#journey-assessment-judgement" aria-label="Next section: Judgement"><span class="util-journey-adjacent__title">Judgement</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#journey-assessment-briefing" aria-current="location">Briefing</a></li><li><a class="util-journey-all-link" href="#journey-assessment-judgement">Judgement</a></li><li><a class="util-journey-all-link" href="#journey-assessment-pack-forward">Take forward</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C04/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-assessment-intro" data-region="assessment-intro" data-journey-section="true"><p>Before revising your explanation of the study, examine how effectively it communicates the evidence to a non-specialist reader. This formative assessment asks you to make and justify your own judgements about what works, what needs attention and which improvements matter most. There is no single correct diagnosis, and your writing will not be automatically graded. Allow approximately 10 minutes. No external research is needed.</p><p>Read the illustrative research account and reconsider your original explanation against its findings and limitations.

Identify meaningful strengths and any consequential weaknesses in your explanation. Explain why they matter for someone unfamiliar with the study.

Use relevant quality dimensions, including accuracy, clarity, relevance, context, qualification and proportionality. Distinguish changes that affect the reader&#39;s interpretation from changes that are mainly cosmetic.

Choose and justify your most important improvement priorities. Write a diagnostic self-evaluation rather than a revised explanation.

After completing your diagnosis, use the reflective guidance to check your reasoning. You may refine your diagnosis if you wish.</p></section><section class="util-assessment-guidance util-assessment-section" data-region="assessment" id="journey-assessment" data-journey-section="true" data-assessment-product="assessment_pack" data-feedback-timing="per_component"><section class="util-assessment-orientation" data-region="assessment-orientation" id="journey-assessment-briefing" data-journey-section="true"><h3>What to bring with you</h3><ul><li><p>If you completed &#39;Write your first explanation&#39;, revisit your original explanation of the study. Also consider the judgements you developed in &#39;Compare explanations and judge their quality&#39;, particularly the qualities that made explanations more or less convincing.</p><p>Use your original explanation as the work you are evaluating, and apply your comparative insights to identify what it communicates effectively, what could mislead a non-specialist reader and which improvements would matter most before you revise it.</p></li></ul></section><article id="journey-assessment-judgement" class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" data-elicitation-id="E1" data-journey-section="true"><h3>Diagnose your explanation</h3><p>Study breaks and concentration among undergraduate students is a fictional, illustrative research study created for educational purposes; its findings are synthetic and are not results of an actual investigation. The research question was whether taking regular short breaks during independent study was associated with students reporting good concentration. In the illustrative study, a university research team conducted an observational survey of 200 undergraduate students. Students reported their own study habits and concentration, and researchers divided respondents into two groups according to whether they reported taking regular short breaks. In the group reporting regular short breaks, 72 of 100 students (72%) reported good concentration. In the group not reporting regular short breaks, 58 of 100 students (58%) reported good concentration. The observed difference was 14 percentage points, not 14%. Students reporting regular short breaks were therefore more likely to report good concentration in this survey. The study was observational, not a randomised experiment, and students were not randomly assigned to take or avoid breaks. Potentially relevant factors such as sleep, motivation, workload and study environment were not controlled. Both study habits and concentration were self-reported; the survey does not establish whether reported concentration corresponds to objectively measured concentration or performance. The sample cannot automatically be assumed to represent all undergraduate students. The findings do not establish that taking breaks causes improved concentration, that introducing breaks would produce a 14-percentage-point improvement, that academic performance improves, or that any particular frequency or duration of breaks is best. No statistical significance, confidence interval or causal effect has been established. Your diagnosis should distinguish what this illustrative evidence shows from claims it cannot support.</p><p>You are evaluating your own explanation of the study for a non-specialist reader. Your aim is to decide what already works, what matters most to improve, and why. This is a diagnosis, not a request to rewrite your explanation.</p><p>Reread your original explanation and compare its claims and omissions with the study evidence above. Use whichever of the quality dimensions you explored in &#39;Compare explanations and judge their quality&#39; are most relevant: accuracy, clarity, relevance, context, qualification and proportionality. Write a reasoned self-evaluation that identifies at least one meaningful strength and explains how it helps the reader. Identify any consequential weaknesses, pointing to specific wording, omissions or implications and explaining why they matter. Consider whether a problem concerns an inaccurate figure, unsupported inference, missing context, inadequate qualification or difficulty understanding the finding, rather than merely a cosmetic wording change. Then select the improvements you would prioritise and justify your choices. If your explanation already handles a particular issue effectively, recognise that strength rather than inventing a weakness.</p><p>Organise your response around: (1) strengths and why they matter; (2) weaknesses or limitations and their consequences for the reader; (3) your highest-priority improvements and reasons for choosing them; and (4) a brief statement of what you intend to focus on in &#39;Revise your explanation&#39;. Refer to features of your own writing and to the study evidence where relevant. Make your own judgements; there is no single required diagnosis or prescribed replacement wording. Do not write the revised explanation here.</p><p>A concise diagnostic account of approximately 150–250 words, or an equivalently focused response organised under the four suggested headings.</p><p>Allow approximately 10 minutes in total, including rereading your original explanation, checking the evidence, writing your diagnosis and identifying your priorities.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-E1" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="assessment-constructed-E1">Your response</label><p>Use your own explanation as evidence. Be specific about what works or needs attention, and explain why it matters for someone unfamiliar with the study. Choose the priorities you consider most consequential; you do not need to rewrite your explanation.</p><textarea class="util-learner-workspace__input" id="assessment-constructed-E1" name="assessment-constructed-E1" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="assessment-constructed-E1-review">Review your response</button></p><div id="assessment-constructed-E1-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="E1_SELF_CHECK"><p>Review your diagnosis against your original explanation. Have you identified a genuine strength and explained how it helps a non-specialist reader? For each weakness you identified, can you point to something you actually wrote or omitted and explain its consequence? Check any numerical or interpretative judgement against the study evidence: 72% and 58% of the respective groups reported good concentration, a difference of 14 percentage points. The survey shows an association between reported breaks and reported concentration, not a proven causal effect. Its observational design, self-reporting and uncontrolled factors limit what can be concluded. These are checks on your reasoning, not a list of faults you must find in your writing.</p></article><article class="util-formative-material" data-material-id="E1_PRIORITY_CHECK"><p>Look again at your proposed improvements. Which would most change what a non-specialist reader understands or concludes? A correction to an inaccurate figure, an unsupported causal claim or a consequential omission may matter more than polishing a sentence. Equally, a clearer expression can be important when the existing wording obscures the finding. Your priorities should follow from the particular strengths and weaknesses of your own explanation. Can you explain why each chosen improvement deserves attention before a less consequential edit?</p></article><article class="util-formative-material" data-material-id="E1_INDEPENDENT_JUDGEMENT"><p>There is no single required diagnosis. Different explanations can communicate the finding effectively in different ways, provided their claims remain accurate, evidence-grounded and appropriately qualified. You do not need to manufacture weaknesses or adopt a prescribed replacement sentence. The value of your diagnosis lies in how specifically and convincingly you justify your judgements about your own writing.</p></article></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Use the priorities you have justified to guide your decisions in &#39;Revise your explanation&#39;. Keep the strengths you want to preserve in mind alongside the changes you consider most consequential. Your diagnosis is a basis for making revision decisions, not a fixed set of required edits.</p></section></article><section class="util-pack-forward" data-region="pack-forward" id="journey-assessment-pack-forward" data-journey-section="true"><h2>What to take forward</h2><p>Your diagnostic self-evaluation identifies what is already effective in your explanation and what you have reason to improve. In &#39;Revise your explanation&#39;, use those judgements to make deliberate changes that improve accuracy, clarity and appropriate qualification for a non-specialist reader. You remain responsible for deciding which changes are warranted; this formative assessment does not assign a grade or determine your subsequent pathway.</p></section><section class="util-assessment-output" data-assessment-output-region="true" data-assessment-output-mode="assemble" data-assessment-output-spec="{&quot;specification_id&quot;:&quot;C04.E1&quot;,&quot;artefact_title&quot;:&quot;My explanation diagnosis&quot;,&quot;audience&quot;:&quot;Learner&quot;,&quot;purpose&quot;:&quot;Keep your own reasoned diagnosis available to guide decisions when you revise your explanation.&quot;,&quot;action_label&quot;:&quot;Review my diagnosis&quot;,&quot;missing_response_text&quot;:&quot;Complete your diagnosis to review your written response.&quot;,&quot;sections&quot;:[{&quot;section_id&quot;:&quot;C04.E1-E1&quot;,&quot;order&quot;:1,&quot;heading&quot;:&quot;My diagnosis&quot;,&quot;contributions&quot;:[{&quot;contribution_id&quot;:&quot;C04.E1-E1-response&quot;,&quot;label&quot;:&quot;My diagnosis&quot;,&quot;elicitation_id&quot;:&quot;E1&quot;,&quot;response_part&quot;:&quot;response_text&quot;}]}]}"><p><button type="button" class="util-assessment-check" data-assessment-assemble="true">Review my diagnosis</button></p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-output-C04.E1" data-assessment-output="true" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="assessment-output-C04.E1">My explanation diagnosis</label><textarea class="util-learner-workspace__input" id="assessment-output-C04.E1" name="assessment-output-C04.E1" rows="12"></textarea></div><p><button type="button" class="util-assessment-check" data-assessment-output-copy="true">Copy</button> <button type="button" class="util-assessment-check" data-assessment-output-replace="true">Replace with current responses</button></p><p class="util-assessment-output-status" aria-live="polite" data-assessment-output-status></p></section></section></article></template><template id="lj-resource-C05"><article class="util-learner-page util-page util-learner-renderer-vnext util-page--assessment" data-renderer="vnext" data-page-kind="assessment" data-persistence-page-key="v1::ff18a600-3203-4f3c-bc34-9101600baa68::learner-page::2.0.0::no-activities::revise-your-explanation" data-persistence-storage-key="learner-renderer-vnext:draft:v1::ff18a600-3203-4f3c-bc34-9101600baa68::learner-page::2.0.0::no-activities::revise-your-explanation" data-composition-mode="moments" data-composed-activity-count="0" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Revise your explanation</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="3"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Revise your explanation</span><p class="util-journey-position" aria-label="Section 1 of 3"><span class="util-journey-position__visible" aria-hidden="true">1 of 3</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#elicitation-E2" aria-label="Next section: E2"><span class="util-journey-adjacent__title">E2</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#elicitation-E1" aria-current="location">Revise your explanation</a></li><li><a class="util-journey-all-link" href="#elicitation-E2">E2</a></li><li><a class="util-journey-all-link" href="#elicitation-E3">E3</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C05/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-assessment-intro" data-region="assessment-intro" data-journey-section="true"><p>In this formative assessment, you will use your earlier judgements about explanation quality to revise your own account of an illustrative research study. The main outcome is a concise, evidence-grounded explanation for a non-specialist audience. You will also complete two brief checks on numerical interpretation and the limits of the evidence. The activity takes approximately 20 minutes, with most of that time devoted to independent writing and checking. Your explanation will not be automatically graded, and there is no single required wording.</p><p>1. Read the research account and revisit your earlier explanation and judgements.

2. Spend approximately 15 minutes independently revising your explanation for the same non-specialist audience. Address consequential weaknesses rather than making only cosmetic changes. You may reconsider your earlier priorities as you write.

3. Use the self-review prompts to check your revised explanation against the evidence and the qualities of accuracy, clarity, relevance, context, qualification and proportionality. Make any further changes you judge necessary.

4. Complete the two short formative checks. Read the explanatory feedback and consider whether the same distinctions are communicated accurately in your own writing.

5. Retain your unchanged original explanation and your completed revised explanation for &#39;Explain what changed and why&#39;. No external materials are required.</p></section><section class="util-assessment-guidance util-assessment-section" data-region="assessment" id="journey-assessment" data-journey-section="true" data-assessment-product="assessment_pack" data-feedback-timing="per_component"><section class="util-assessment-orientation" data-region="assessment-orientation" id="journey-assessment-briefing" data-journey-section="true"><h3>What to bring with you</h3><ul><li><p>If you completed &#39;Write your first explanation&#39;, revisit your original explanation. Also consult your diagnostic judgement from &#39;Diagnose your explanation&#39; and the quality judgements you developed in &#39;Compare explanations and judge their quality&#39;.</p><p>Use your original explanation as the starting point for revision, your diagnostic judgement to identify consequential weaknesses and priorities, and your comparative judgements to guide decisions about effective research communication. You may reconsider your earlier priorities as you write. Your aim is to produce a clearer, more accurate and appropriately qualified explanation in your own words.</p></li></ul></section><article class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" id="elicitation-E1" data-elicitation-id="E1" data-journey-section="true"><h3>Revise your explanation</h3><p>Study breaks and concentration among undergraduate students. This is a fictional, illustrative research study created for educational purposes. Its findings are synthetic and must not be presented as results of an actual investigation. The research question was: Is taking regular short breaks during independent study associated with students reporting good concentration? In the illustrative study, a university research team conducted an observational survey of 200 undergraduate students. Students reported their own study habits and concentration. The researchers divided respondents into two groups according to whether they reported taking regular short breaks during independent study. Group A comprised 100 students reporting regular short breaks; 72 reported good concentration (72%). Group B comprised 100 students not reporting regular short breaks; 58 reported good concentration (58%). The observed difference was 72% minus 58%, or 14 percentage points. The proportion reporting good concentration was therefore 14 percentage points higher among students reporting regular short breaks. The survey was observational, not a randomised experiment. Students were not randomly assigned to take or avoid breaks. Potentially relevant factors including sleep, motivation, workload and study environment were not controlled. Both study habits and concentration were self-reported. The study does not establish whether reported concentration corresponds to objectively measured concentration or performance, and the sample cannot automatically be assumed to represent all undergraduate students. The supported interpretation is that students reporting regular short study breaks were more likely to report good concentration than students not reporting regular short breaks. The evidence does not establish that taking breaks causes improved concentration, that introducing breaks would produce a 14-percentage-point improvement, that academic performance improved, or that any particular frequency or duration of breaks is best. No statistical significance, confidence interval or causal effect has been established. Do not introduce additional findings or methodological details.</p><p>You have already had opportunities to write an explanation, compare the quality of different explanations and diagnose your own work. Your task now is to use those judgements to improve how you communicate the finding from the illustrative study.</p><p>Write a revised version of your original explanation for the same non-specialist audience. Use your earlier diagnostic priorities and comparative quality judgements to decide which changes matter most. Check your claims against the research account. Make substantive improvements where needed to accuracy, clarity, relevance, context, qualification and proportionality. You may reconsider your earlier priorities as you write. Distinguish the observed association from unsupported causal conclusions, and ensure that the numerical findings and self-reported outcome are represented accurately. Write the explanation in your own words rather than imitating a model response.</p><p>Produce one complete, coherent explanation of the principal finding, not a list of corrections or a commentary on your writing decisions. Your explanation should be concise, evidence-grounded and understandable to a non-specialist reader. Different formulations and emphases are acceptable where they remain accurate and appropriately qualified. Keep your original explanation unchanged and retain both versions for &#39;Explain what changed and why&#39;.</p><p>One short paragraph, or two brief paragraphs if needed to communicate the finding and its limitations clearly.</p><p>Approximately 15 minutes for independent revision, within the 20-minute activity.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-E1" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="assessment-constructed-E1">Your response</label><p>Write your revised explanation here. Focus on communicating the research finding clearly and responsibly in your own words.</p><textarea class="util-learner-workspace__input" id="assessment-constructed-E1" name="assessment-constructed-E1" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="assessment-constructed-E1-review">Review your response</button></p><div id="assessment-constructed-E1-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="E1.M1"><p>Review your revised explanation against the research account. Does it identify the comparison accurately: 72% of students reporting regular short breaks and 58% of students not reporting regular breaks reported good concentration? If you describe the difference, is it 14 percentage points rather than 14%? Check that you have not changed the figures, reversed the groups or introduced findings that were not reported.</p></article><article class="util-formative-material" data-material-id="E1.M2"><p>Check the strength of your claims. The study was an observational survey, and both study habits and concentration were self-reported. Students were not randomly assigned, and factors such as sleep, motivation, workload and study environment were not controlled. Does your explanation communicate an observed association without implying that breaks caused improved concentration? Does it avoid claiming objectively measured concentration, improved academic performance or a result that necessarily applies to all undergraduate students?</p></article><article class="util-formative-material" data-material-id="E1.M3"><p>Read your explanation as someone unfamiliar with the study. Is the principal finding easy to identify? Have you included enough context for the reader to interpret it responsibly? Consider whether your wording is clear, your details are relevant and your qualifications are proportionate. A concise explanation does not need to list every limitation, but it should not leave the reader with a misleading impression of what the evidence establishes.</p></article><article class="util-formative-material" data-material-id="E1.M4"><p>Compare your revised explanation with your original and revisit the weaknesses you identified in &#39;Diagnose your explanation&#39;. Have you addressed the issues that mattered most, rather than merely changing individual words? You may have discovered a more important weakness while writing or decided that an earlier priority was less consequential. Different choices of emphasis and wording are defensible when they communicate the evidence accurately and with appropriate qualification. These questions support your own judgement; they do not constitute an automatic assessment of your writing.</p></article></section><section class="util-assessment-revision" data-region="assessment-revision" data-automated-judgement="false"><p class="util-revision-offer" data-revision-offered="true">If your review identifies a consequential weakness, return to your explanation and make the change you judge necessary. Keep the wording and organisation your own. When you are satisfied that the explanation is accurate, clear and appropriately qualified, retain the completed version alongside your unchanged original.</p><div class="util-learner-workspace" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-E1-weakness" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="assessment-constructed-E1-weakness">What is the most important weakness you identified in your argument?</label><textarea class="util-learner-workspace__input" id="assessment-constructed-E1-weakness" name="assessment-constructed-E1-weakness" rows="3"></textarea></div><p>Revision is yours to make. It is not marked correct or incorrect.</p><p><a href="#assessment-constructed-E1" data-assessment-return-to-response="assessment-constructed-E1">Revise your written judgement</a></p></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Your revised explanation is the main outcome of this activity. Retain it alongside the original explanation from &#39;Write your first explanation&#39;. In &#39;Explain what changed and why&#39;, you will use both versions to examine the consequential changes you made and the judgements behind them. You do not need to justify every change here.</p></section></article><article class="util-assessment-elicitation" data-assessment-mode="determinate" id="elicitation-E2" data-elicitation-id="E2" data-journey-section="true"><article data-assessment-correct="B" class="util-task-block util-assessment-item util-assessment-item--formative util-assessment-item--interactive" data-assessment-mode="interactive" data-assessment-form="single_answer_mcq" data-workspace-kind="assessment_selection" data-workspace-id="assessment-e2-i1" data-assessment-item-id="e2-i1" data-assessment-rationale="The difference between 72% and 58% is 14 percentage points. This describes the gap between two observed proportions, not a 14% increase and not an improvement caused by taking breaks. The higher proportion was among students who reported regular short breaks. When checking your explanation, make sure the numerical comparison, its direction and its meaning are all accurate."><header class="util-assessment-item-header"><h3 class="util-assessment-title util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg></span><span class="util-semantic-icon__label">Question 1</span></h3></header><div class="util-assessment-item-body"><fieldset class="util-assessment-fieldset"><legend class="util-assessment-legend">In the illustrative survey, 72% of students reporting regular short breaks and 58% of students not reporting regular breaks reported good concentration. Which statement describes the numerical difference accurately without claiming a causal effect?</legend><div class="util-assessment-choices"><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="assessment-e2-i1-opt-1" name="assessment-group-e2-i1" value="A" data-assessment-option="A"><label class="util-assessment-option__label" for="assessment-e2-i1-opt-1">Students reporting regular short breaks were 14% more likely to report good concentration.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="assessment-e2-i1-opt-2" name="assessment-group-e2-i1" value="B" data-assessment-option="B"><label class="util-assessment-option__label" for="assessment-e2-i1-opt-2">The proportion reporting good concentration was 14 percentage points higher among students reporting regular short breaks.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="assessment-e2-i1-opt-3" name="assessment-group-e2-i1" value="C" data-assessment-option="C"><label class="util-assessment-option__label" for="assessment-e2-i1-opt-3">Taking regular short breaks increased good concentration by 14 percentage points.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="assessment-e2-i1-opt-4" name="assessment-group-e2-i1" value="D" data-assessment-option="D"><label class="util-assessment-option__label" for="assessment-e2-i1-opt-4">The proportion reporting good concentration was 14 percentage points higher among students not reporting regular short breaks.</label></div></div></fieldset><button type="button" class="util-assessment-check" data-assessment-check>Check answer</button><div class="util-assessment-result" data-assessment-result aria-live="polite" hidden></div></div></article><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Use this numerical distinction to check your own revised explanation. Recognising the correct difference in a question is useful, but the more important test is whether you have communicated it accurately and naturally in your writing.</p></section></article><article class="util-assessment-elicitation" data-assessment-mode="determinate" id="elicitation-E3" data-elicitation-id="E3" data-journey-section="true"><article data-assessment-correct="B" class="util-task-block util-assessment-item util-assessment-item--formative util-assessment-item--interactive" data-assessment-mode="interactive" data-assessment-form="single_answer_mcq" data-workspace-kind="assessment_selection" data-workspace-id="assessment-e3-i1" data-assessment-item-id="e3-i1" data-assessment-rationale="The survey supports an association between reporting regular short breaks and reporting good concentration. It does not establish that breaks caused the difference. Students were not randomly assigned, other potentially relevant factors were not controlled, and the outcome was self-reported. The findings therefore do not demonstrate improved academic performance or establish a benefit for every undergraduate student. A responsible explanation communicates the observed relationship while keeping its claims within these evidential limits."><header class="util-assessment-item-header"><h3 class="util-assessment-title util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg></span><span class="util-semantic-icon__label">Question 2</span></h3></header><div class="util-assessment-item-body"><fieldset class="util-assessment-fieldset"><legend class="util-assessment-legend">The illustrative study was an observational survey in which students reported their own study-break habits and concentration. Students were not randomly assigned to take or avoid breaks, and potentially relevant factors such as sleep, motivation, workload and study environment were not controlled. Which conclusion is best supported by this evidence?</legend><div class="util-assessment-choices"><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="assessment-e3-i1-opt-1" name="assessment-group-e3-i1" value="A" data-assessment-option="A"><label class="util-assessment-option__label" for="assessment-e3-i1-opt-1">Regular short study breaks have been shown to cause better concentration among undergraduate students.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="assessment-e3-i1-opt-2" name="assessment-group-e3-i1" value="B" data-assessment-option="B"><label class="util-assessment-option__label" for="assessment-e3-i1-opt-2">Students reporting regular short breaks were more likely to report good concentration, but the survey does not establish that taking breaks caused the difference.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="assessment-e3-i1-opt-3" name="assessment-group-e3-i1" value="C" data-assessment-option="C"><label class="util-assessment-option__label" for="assessment-e3-i1-opt-3">The survey demonstrates that taking regular short breaks improves students&#39; academic performance.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="assessment-e3-i1-opt-4" name="assessment-group-e3-i1" value="D" data-assessment-option="D"><label class="util-assessment-option__label" for="assessment-e3-i1-opt-4">The observed difference establishes that all undergraduate students would benefit from introducing regular short breaks.</label></div></div></fieldset><button type="button" class="util-assessment-check" data-assessment-check>Check answer</button><div class="util-assessment-result" data-assessment-result aria-live="polite" hidden></div></div></article><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Check whether your revised explanation makes the distinction between association and causation clear to a non-specialist reader. You can acknowledge the study&#39;s limitations in different ways; what matters is that your wording does not claim more than the evidence establishes.</p></section></article><section class="util-pack-forward" data-region="pack-forward" id="journey-assessment-pack-forward" data-journey-section="true"><h2>What to take forward</h2><p>You have produced your own revised explanation and checked two important aspects of the research evidence: the 14-percentage-point difference and the limits of causal inference. The checks offer focused feedback, but they do not automatically assess the quality of your written explanation. Use the self-review questions to decide whether any further changes would make your account more accurate, clearer or better qualified. Different evidence-grounded formulations are legitimate, so retain responsibility for your own wording and emphasis. Keep both your unchanged original explanation from &#39;Write your first explanation&#39; and your completed revised explanation, &#39;My revised research explanation&#39;. In &#39;Explain what changed and why&#39;, you will use these two versions to examine what changed, which improvements mattered most and how your evaluative judgements informed your decisions.</p></section><section class="util-assessment-output" data-assessment-output-region="true" data-assessment-output-mode="direct_copy" data-assessment-output-spec="{&quot;specification_id&quot;:&quot;revised-research-explanation&quot;,&quot;artefact_title&quot;:&quot;My revised research explanation&quot;,&quot;audience&quot;:&quot;You, for later reflection and comparison&quot;,&quot;purpose&quot;:&quot;Retain your complete revised explanation in your own words so that you can review it, copy it and compare it with your unchanged original explanation in &#39;Explain what changed and why&#39;. The artefact reproduces your writing without generating a summary, replacement explanation or automatic judgement.&quot;,&quot;action_label&quot;:&quot;Copy my revised explanation&quot;,&quot;missing_response_text&quot;:&quot;Not yet written.&quot;,&quot;sections&quot;:[{&quot;section_id&quot;:&quot;revised-explanation&quot;,&quot;order&quot;:1,&quot;heading&quot;:&quot;My revised research explanation&quot;,&quot;contributions&quot;:[{&quot;contribution_id&quot;:&quot;revised-explanation-text&quot;,&quot;label&quot;:&quot;Revised explanation&quot;,&quot;elicitation_id&quot;:&quot;E1&quot;,&quot;response_part&quot;:&quot;response_text&quot;}]}]}"><p class="util-assessment-output-purpose" data-assessment-output-purpose="true">Retain your complete revised explanation in your own words so that you can review it, copy it and compare it with your unchanged original explanation in &#39;Explain what changed and why&#39;. The artefact reproduces your writing without generating a summary, replacement explanation or automatic judgement.</p><p class="util-assessment-output-help" data-assessment-output-help="true" data-assessment-output-delivery="standalone">A draft of your response is kept on this page only. Later activities will not retrieve it automatically — copy the wording you want to keep for later use.</p><p><button type="button" class="util-assessment-check" data-assessment-output-copy="true">Copy my revised explanation</button></p><p class="util-assessment-output-status" aria-live="polite" data-assessment-output-status></p></section></section></article></template><template id="lj-resource-C06"><article class="util-learner-page util-page util-learner-renderer-vnext util-page--expository" data-renderer="vnext" data-page-kind="expository" data-persistence-page-key="v1::e345a2ce-ed6c-4985-b2ec-685b3ae46bc3::learner-page::2.0.0::no-activities::what-changed-and-why-it-matters" data-persistence-storage-key="learner-renderer-vnext:draft:v1::e345a2ce-ed6c-4985-b2ec-685b3ae46bc3::learner-page::2.0.0::no-activities::what-changed-and-why-it-matters" data-composition-mode="moments" data-composed-activity-count="0" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Explain what changed and why</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="5"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">What does it mean to explain a revision?</span><p class="util-journey-position" aria-label="Section 1 of 5"><span class="util-journey-position__visible" aria-hidden="true">1 of 5</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#exposition-S2" aria-label="Next section: Judging changes against the evidence"><span class="util-journey-adjacent__title">Judging changes against the evidence</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#exposition-S1" aria-current="location">What does it mean to explain a revision?</a></li><li><a class="util-journey-all-link" href="#exposition-S2">Judging changes against the evidence</a></li><li><a class="util-journey-all-link" href="#exposition-S3">Why a better explanation is not always a simple judgement</a></li><li><a class="util-journey-all-link" href="#exposition-S4">Independent reflection: What changed in your explanation, and why?</a></li><li><a class="util-journey-all-link" href="#exposition-S5">What will you take into your next explanation?</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C06/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-exposition-sections" data-region="exposition"><section class="util-exposition-section" data-region-item="exposition-section" id="exposition-S1" data-section-id="S1" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">What does it mean to explain a revision?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>When you revise an explanation, some changes are easy to identify. You might replace a phrase, add a qualification, remove unnecessary detail or rearrange a sentence. But describing these edits does not necessarily explain why you made them or whether they helped communicate the research.</p><p>Consider the difference between saying that you changed a numerical expression and explaining that you changed it because the original wording could give readers a misleading impression of the size of a finding. The first statement identifies an edit. The second connects that edit to a possible consequence for understanding.</p><p>A consequential revision is one that affects how the reader is likely to understand the evidence, interpret its significance or recognise its limitations. A small change in terminology may be more consequential than rewriting an entire paragraph. Equally, a substantial rewrite may alter the style without meaningfully improving the explanation.</p><p>To examine your own decisions, you will need your earlier work. If you completed &#39;Write your first explanation&#39; and &#39;Revise your explanation&#39;, bring your initial and revised explanations together so you can compare how you communicated the same finding. Your judgements from &#39;Compare explanations and judge their quality&#39; can help you explain why particular changes matter. If useful, revisit your improvement priorities from &#39;Diagnose your explanation&#39; to consider how they influenced your revision. These are your own explanations and judgements: there is no assumption that particular changes were made or that every revision was successful.</p><p>As you compare the versions, distinguish three things: what changed, how that change might affect the reader, and why that effect matters. This turns a record of editing into an explanation of your communication decisions.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="exposition-S2" data-section-id="S2" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Judging changes against the evidence</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The research evidence has not changed between your two explanations. What may have changed is how you selected, organised and interpreted it for a non-specialist reader.</p><p>In the fictional illustrative survey, 200 undergraduate students reported their study habits and concentration. Among the 100 students reporting regular short breaks, 72 reported good concentration (72%). Among the 100 not reporting regular short breaks, 58 reported good concentration (58%). The observed difference was 14 percentage points.</p><p>These figures describe an association between reported study habits and self-reported good concentration. The survey was observational, students were not randomly assigned to groups, and potentially relevant factors such as sleep, motivation, workload and study environment were not controlled. The findings therefore do not establish that taking breaks caused better concentration. Nor do they demonstrate objectively measured concentration or improved academic performance.</p><p>These boundaries help explain why some revisions may be more consequential than others. Replacing an ambiguous description of the numerical difference with &#39;14 percentage points&#39; may improve accuracy. Making clear that concentration was self-reported may prevent readers from assuming that it was objectively measured. Changing language that implies a causal effect may bring the conclusion into closer alignment with the observational evidence.</p><p>Other changes may concern how the finding is presented rather than what it claims. A clearer opening sentence might help a non-specialist reader identify the comparison between groups. Removing repetition might make the explanation easier to follow. Reorganising the discussion of limitations might help readers understand both the observation and the uncertainty surrounding its interpretation.</p><p>Accuracy, clarity and appropriate qualification are connected, but they are not interchangeable. A statement can be easy to understand while overstating the evidence. It can also be technically accurate but unnecessarily difficult to follow. When explaining a revision, consider which aspect of communication it was intended to address and whether it preserved the essential meaning of the research.</p><p>The strongest justification is grounded in a specific communication consequence. Rather than assuming that more detail, shorter wording or greater caution is automatically better, consider how the change may help readers understand what was observed and what cannot be concluded.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="exposition-S3" data-section-id="S3" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Why a better explanation is not always a simple judgement</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>It can be tempting to treat the revised explanation as the better one simply because it was written after you had considered feedback and alternative approaches. But revision does not guarantee improvement.</p><p>Suppose you shortened an explanation to make the main finding easier to identify. That change might benefit a non-specialist reader. However, if the shorter version omitted the fact that concentration was self-reported, it could also make the evidence appear stronger than it is. A decision intended to improve clarity may therefore introduce a problem of accuracy or qualification.</p><p>The reverse is also possible. Adding more methodological detail may help readers recognise uncertainty, but too much detail can obscure the central comparison. The challenge is not to maximise every desirable feature independently. It is to make defensible choices about how those features work together for a particular audience and purpose.</p><p>Different explanations can also place their emphasis in different places. One may foreground the 14-percentage-point difference before discussing the limitations of the survey. Another may establish the observational nature of the evidence earlier. Neither arrangement is automatically preferable. Both can be defensible if the numerical findings remain accurate and the language does not imply conclusions the survey cannot support.</p><p>Your reflection can therefore acknowledge uncertainty about the quality of a change. You may have good reasons to believe that a revision made your explanation clearer or more proportionate, but that does not mean its effect on readers has been objectively measured. You may also recognise that a change solved one problem without solving another.</p><p>A thoughtful account of revision does not need to defend every decision. Recognising a remaining weakness, a questionable edit or a legitimate alternative can demonstrate the same evaluative judgement as identifying a likely improvement.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="exposition-S4" data-section-id="S4" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Independent reflection: What changed in your explanation, and why?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Allow approximately 10 minutes to examine your two explanations and consider what your revision decisions reveal about communicating research.</p><p>Read your initial explanation and revised explanation alongside one another. Both concern the same fictional survey, but they may differ in what they emphasise, how they express the numerical finding, how they acknowledge uncertainty or how they address a non-specialist audience.</p><p>Begin by identifying the changes that seem most consequential. You do not need to account for every edit. Concentrate on differences that may affect what a reader understands about the evidence or the conclusions that can reasonably be drawn from it.</p><p>For each significant change, consider what was different and why you made that decision. Did the revision make the numerical comparison more precise? Did it clarify that the outcome was self-reported good concentration? Did it distinguish the observed association from a causal claim? Did it help the reader follow the explanation, or change the balance between the main finding and its limitations?</p><p>Go beyond identifying the feature that changed. Explain the likely consequence for the reader and why that consequence matters. For instance, the significance of a numerical clarification lies in reducing the possibility of misunderstanding the finding, not simply in using different terminology. The significance of a methodological qualification lies in helping readers recognise the limits of the evidence, not simply in making the explanation sound more cautious.</p><p>Consider how your earlier evaluative judgements informed your choices. You may recognise that a concern identified during comparison or diagnosis influenced a particular revision. You may also find that you retained a feature of your initial explanation because it already served the audience and evidence appropriately.</p><p>Finally, consider what remains uncertain or imperfect. Perhaps a change improved precision but made the explanation less concise. Perhaps you still find it difficult to balance the main observation with its limitations. You might also recognise that an alternative arrangement or emphasis would have been equally defensible.</p><p>Your reflection does not need to prove that the revised explanation is better in every respect. Its purpose is to make your reasoning visible: which changes you consider significant, why they may matter, and how your understanding of evidence and communication informed those decisions. Use your own versions as the basis for these judgements rather than trying to reconstruct a preferred answer.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="exposition-S5" data-section-id="S5" data-expository-section-role="terminal-close" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">What will you take into your next explanation?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation" data-expository-closure="terminal"><p>The value of examining your revisions extends beyond this particular explanation. The decisions you made may reveal principles that could guide how you communicate other research findings.</p><p>For example, you may have become more attentive to the distinction between what researchers measured and what an explanation claims. You may have recognised the importance of expressing numerical differences precisely, separating observation from causal interpretation, or ensuring that necessary qualifications do not obscure the main finding.</p><p>These are not fixed wording rules. Their application depends on the evidence and the audience. A different study may involve different measurements, limitations or communication priorities. What transfers is the habit of making choices deliberately and being able to explain the reasons for them.</p><p>Drawing on your comparison, articulate at least one principle you would want to apply when explaining a different research finding. Consider what prompted that principle in your own revision experience and why it could be useful elsewhere. You can also recognise where your judgement remains uncertain or where you would approach a similar decision differently in future.</p><p>Across this Learning Journey, the focus has moved from independently explaining a finding to evaluating explanations, reconsidering your own decisions and reflecting on their consequences. The final insight is not that every revision necessarily produces a better text. It is that you can increasingly account for the relationship between evidence, audience and communication choices.</p><p>Being able to explain what changed and why gives you a basis for making future revisions more deliberate, more defensible and more sensitive to the limits of the evidence.</p></div></section></section></article></template><template id="lj-resource-journal"><article class="lj-shell-journal" data-lj-journal="true" role="region" aria-labelledby="lj-shell-journal-heading"><h2 id="lj-shell-journal-heading" class="lj-shell-journal__title" data-lj-resource-title="true" tabindex="-1">Your Learning Journal</h2><ol class="lj-shell-journal__entries"><li class="lj-shell-journal__entry" data-lj-journal-entry="initial_explanation" data-lj-journal-artefact="C02.E1" aria-labelledby="lj-journal-entry-initial-explanation-title"><h3 class="lj-shell-journal__entry-title" id="lj-journal-entry-initial-explanation-title">Your first explanation</h3><div class="lj-shell-journal__framing"><p>This is the explanation you produced before comparing examples or receiving detailed guidance.
