"intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The research design tells you how the evidence was obtained, while the numerical comparison tells you what was recorded. Bringing these together allows you to distinguish observations from interpretations and identify where a conclusion would extend beyond the available evidence.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have investigated the research design and compared the numerical findings. Now examine what the evidence can and cannot establish. Use the study&#39;s method, measurements and limitations to distinguish recorded observations from possible inferences. You will then apply the same distinction to a different communication situation before preparing to write your own explanation.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Ask whether each statement describes something recorded in the survey or draws a conclusion beyond those observations. For limitations, connect the feature of the research method or measurement to the type of conclusion it restricts. In the advisory note, apply that distinction to the team&#39;s proposed claim rather than repeating the original analysis.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which feature of the study most clearly limits a conclusion you considered, and how does that feature affect what can reasonably be claimed?</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Complete two connected tasks. First, inspect the study evidence and complete the analysis table: (1) identify two directly recorded observations; (2) identify two possible inferences or claims that would require further evidence; and (3) identify at least three methodological limitations, explaining briefly what each prevents the study from establishing. Keep your analysis within the fictional survey&#39;s evidence. Second, imagine a university student-support team is considering whether to recommend regular short breaks as a proven way to improve academic performance. Using the same study, write a brief evidence-based note identifying what the team should be cautious about claiming and why. Do not write a full explanation of the study&#39;s principal finding; that independent writing task belongs to &#39;Write your first explanation&#39;.</p></span></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="3" data-figure-id="asset-vb-38-4-va-a3-classification-01-activity-a3-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C01/activity-a3-materials-entry.png" alt="Conceptual contrast between recorded observations, possible inferences and methodological limits; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-a3-classification-01-activity-a3-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 3.</strong> Use the distinction between recorded information and further claims when examining the study&#39;s evidence.</figcaption><p class="util-visual-asset-detailed-description" id="figure-description-asset-vb-38-4-va-a3-classification-01-activity-a3-materials-entry">Two conceptual categories distinguish observations from inferences. Observations contain information directly recorded or documented, such as participant reports, numerical values and study procedures. Inferences extend beyond those records and may include explanations of causes, claims about objective performance or generalisations to wider populations. A methodological-limitation boundary connects research design, measurement and sampling to the strength of possible inferences. The figure distinguishes association from demonstrated causation without classifying any statements from the fictional study.</p></figure><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A3-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Study evidence and methodological limits</span></p><h3 class="util-md-heading util-md-heading--source-2">Study breaks and concentration among undergraduate students</h3><p><strong>Fictional illustrative research study.</strong> All findings are synthetic and were created for educational purposes, not collected in an actual investigation.</p><h3 class="util-md-heading util-md-heading--source-3">Research question</h3><p>Is taking regular short breaks during independent study associated with students reporting good concentration?</p><h3 class="util-md-heading util-md-heading--source-3">Method</h3><p>A university research team conducted an observational survey of 200 undergraduate students. Students reported their own study habits and concentration. Respondents were divided into two groups according to whether they reported taking regular short breaks during independent study.</p><p>Students were not randomly assigned to take or avoid breaks. This was not a randomised experiment.</p><h3 class="util-md-heading util-md-heading--source-3">Recorded results</h3><table><thead><tr><th>Group</th><th>Reported study habit</th><th>Number of students</th><th>Number reporting good concentration</th><th>Percentage reporting good concentration</th></tr></thead><tbody><tr><td>Group A</td><td>Regular short breaks</td><td>100</td><td>72</td><td>72%</td></tr><tr><td>Group B</td><td>No regular short breaks</td><td>100</td><td>58</td><td>58%</td></tr></tbody></table><p>The observed difference between the group percentages was 14 percentage points.</p><h3 class="util-md-heading util-md-heading--source-3">Recorded methodological limitations</h3><ul><li>Study habits and concentration were self-reported.</li><li>The research was observational, not experimental.</li><li>Students were not randomly assigned to take or avoid breaks.</li><li>Sleep, motivation, workload and study environment were not controlled.</li><li>The study did not establish whether reported concentration corresponds to objectively measured concentration or academic performance.</li><li>The sample cannot automatically be assumed to represent all undergraduate students.</li><li>No statistical significance, confidence interval or causal effect has been established.</li><li>The study did not establish the best frequency or duration of study breaks.</li></ul><p>Use the recorded findings and methodological details as evidence. Your task is to decide which statements describe observations, which go beyond those observations, and how the study&#39;s limitations affect interpretation.</p></article><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a3-a3-m3" data-material-source-id="A3-M3" data-activity-id="A3"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A3-M3" data-material-type="analysis_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Separate observations and inferences</span></p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="a3-a3-m3-col-evidence-or-study-feature-0">Evidence or study feature</th><th scope="col" -m3-input-r7-c1" name="a3-a3-m3-input-r7-c1" data-learner-cell="a3-a3-m3-input-r7-c1" rows="3" aria-label="Response field, row 8, column Observation, inference or limitation" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a3-a3-m3-input-r7-c2" name="a3-a3-m3-input-r7-c2" data-learner-cell="a3-a3-m3-input-r7-c2" rows="3" aria-label="Response field, row 8, column Reason or boundary on interpretation" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M5" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Your advisory note</p></article><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A3-M2" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Fictional student-support communication</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-3">Fictional communication scenario</h3><p>A university student-support team is preparing advice for students about independent study habits. The team has access to the fictional survey <em>Study breaks and concentration among undergraduate students</em> and is considering the following statement for its student-facing guidance:</p><p>&gt; <strong>Proposed claim for review:</strong> Taking regular short study breaks is proven to improve academic performance.</p><p>This is a <strong>candidate statement</strong>, not a research finding or an endorsed recommendation. The situation is fictional, and the team has no additional evidence beyond the survey account provided in this resource.</p><p>Examine the proposed claim alongside the study&#39;s recorded outcome, method and limitations before preparing your advice.</p></article></li></ol></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>An analysis table that accurately separates directly recorded observations from possible inferences, identifies at least three genuine methodological limitations and connects each limitation to an appropriate boundary on interpretation. A separate short advisory note should apply those boundaries to the student-support team&#39;s proposed communication, identifying why the available survey evidence does not warrant an unrestricted causal or academic-performance claim. Both productions should rely on inspectable study particulars without introducing new findings.</p></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m5-section-advice-to-the-student-support-team-1" data-response-part-id="A3-template-section-a3-m5-section-advice-to-the-student-support-team-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m5-section-advice-to-the-student-support-team-1-label" for="learner-workspace-a3-a3-template-section-a3-m5-section-advice-to-the-student-support-team-1">Advice to the student-support team</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m5-section-advice-to-the-student-support-team-1-desc">Write your own concise note here. Refer to the proposed communication and the fictional survey evidence. Explain the relevant limitation without assuming additional findings.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m5-section-advice-to-the-student-support-team-1" name="learner-workspace-a3-a3-template-section-a3-m5-section-advice-to-the-student-support-team-1" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m5-section-advice-to-the-student-support-team-1-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#learner-check-a3" data-check-sidebar-open aria-controls="learner-check-a3" aria-expanded="false" aria-label="Check your work: Examine the limits of inference">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a3" data-composition-moment="check" data-activity-id="A3" data-check-sidebar="available" aria-labelledby="learner-check-a3-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="learner-check-a3-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a3">Back to your task (Examine the limits of inference)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M6" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m6" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m6-c-0" data-revision-criterion-id="a3-m6-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you distinguished directly recorded observations from inferences that require further evidence?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Treating an inference as an observation would make the analysis claim that the researchers measured or established something they did not.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> At least two entries identify particulars directly recorded in the survey.</li><li><span class="util-guided-review__feature-key">B.</span> At least two entries identify claims that go beyond what the survey directly recorded.</li><li><span class="util-guided-review__feature-key">C.</span> Each classification has a reason connected to the source.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Locate two specific recorded values or method details in the study account and enter them as observations without adding an explanation of why they occurred.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify two possible conclusions that would need information beyond the recorded survey results, and label them as inferences rather than observations.</li><li><span class="util-guided-review__feature-key">Missing C:</span> For an uncertain entry, state whether the relevant information was actually collected or whether an additional measurement, comparison or assumption would be needed.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m6-item-0" data-checklist-item-id="checklist-a3-a3-m6-item-0"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m6-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m6-c-1" data-revision-criterion-id="a3-m6-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you identified methodological limitations that genuinely apply to this study?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A limitation must arise from the actual research design or measurement, not from an invented weakness or an unrelated concern.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My analysis includes at least three distinct limitations recorded in the account.</li><li><span class="util-guided-review__feature-key">B.</span> My limitations are grounded in what the researchers did or did not measure or control.</li><li><span class="util-guided-review__feature-key">C.</span> My analysis does not invent missing research procedures or findings.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Return to the methodological limitations section and select three different features of the study rather than repeating the same concern in different words.</li><li><span class="util-guided-review__feature-key">Missing B:</span> For each limitation, identify the relevant feature of the observational design, self-reporting, uncontrolled factors or sampling information.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Remove any claim about unreported tests, measures, assignments or participant characteristics unless the study account explicitly supplies it.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m6-item-1" data-checklist-item-id="checklist-a3-a3-m6-item-1"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m6-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m6-c-2" data-revision-criterion-id="a3-m6-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you explained how the limitations restrict the conclusions that can be drawn?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Listing limitations alone does not show how research design and measurement affect the strength of an interpretation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each selected limitation is linked to a particular type of conclusion it affects.</li><li><span class="util-guided-review__feature-key">B.</span> My reasoning distinguishes an observed group association from an established causal effect.</li><li><span class="util-guided-review__feature-key">C.</span> My analysis does not assume that the sample or outcome measures establish more than the account reports.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Add a short connection between the study feature and the claim it limits, such as whether the conclusion concerns causation, objective performance or a wider population.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Check whether your interpretation attributes a change to break-taking itself, and qualify that attribution in light of the observational design.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Qualify any claim about all undergraduate students or measured performance by identifying the relevant sampling or measurement boundary.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m6-item-2" data-checklist-item-id="checklist-a3-a3-m6-item-2"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m6-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m6-c-3" data-revision-criterion-id="a3-m6-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Does your advisory note apply the study evidence appropriately to the proposed student-support communication?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The transfer task requires a justified communication judgement for a different audience, not simply another list of study features.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> My note addresses the team&#39;s specific proposed claim.</li><li><span class="util-guided-review__feature-key">B.</span> My note uses at least one concrete detail from the survey.</li><li><span class="util-guided-review__feature-key">C.</span> My advice connects a relevant limitation to the strength of the team&#39;s proposed wording.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Refer directly to the proposed student-facing statement and explain which part of its claim needs evidential consideration.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Add a recorded value, outcome description or methodological feature that is relevant to the communication decision.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain why the chosen methodological or measurement limitation matters for the proposed claim, and advise on an appropriately bounded communication without inventing new evidence.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m6-item-3" data-checklist-item-id="checklist-a3-a3-m6-item-3"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m6-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A3"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M4" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Advise a student-support team</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910" data-response-part-id="A3-transfer-prompt-a3-m4-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910-label" for="learner-workspace-a3-a3-transfer-prompt-a3-m4-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910-desc"><p>The fictional student-support team is considering the proposed statement in <strong>Fictional student-support communication</strong>.</p><p>Write a short advisory note for the team. Your note should:</p><ul><li>Address whether the proposed student-facing claim is justified by the available survey evidence.</li><li>Refer to at least one specific recorded detail from the fictional study.</li><li>Explain at least one relevant methodological or measurement limitation.</li><li>Advise the team on the appropriate strength or scope of a statement based on this evidence.</li></ul><p>Aim for approximately <strong>60–90 words</strong>. You are advising a team about communication to students, rather than repeating your observation-and-inference table. Do not introduce new findings or assume that additional research has been conducted.</p><p>Use the response space provided for your note.</p></div><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910" name="learner-workspace-a3-a3-transfer-prompt-a3-m4-910" rows="5" aria-describedby="learner-workspace-a3-a3-transfer-prompt-a3-m4-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><style id="prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;positi 1ec2e21-af31-4a20-adb6-5e3cfb614dab::learner-page::2.0.0::no-activities::write-your-first-explanation" data-persistence-storage-key="learner-renderer-vnext:draft:v1::d1ec2e21-af31-4a20-adb6-5e3cfb614dab::learner-page::2.0.0::no-activities::write-your-first-explanation" data-composition-mode="moments" data-composed-activity-count="0" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Write your first explanation</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="3"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Briefing</span><p class="util-journey-position" aria-label="Section 1 of 3"><span class="util-journey-position__visible" aria-hidden="true">1 of 3</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#journey-assessment-judgement" aria-label="Next section: Judgement"><span class="util-journey-adjacent__title">Judgement</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#journey-assessment-briefing" aria-current="location">Briefing</a></li><li><a class="util-journey-all-link" href="#journey-assessment-judgement">Judgement</a></li><li><a class="util-journey-all-link" href="#journey-assessment-pack-forward">Take forward</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C02/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-assessment-intro" data-region="assessment-intro" data-journey-section="true"><p>In this activity, you will write your first independent explanation of a fictional research study for someone who has not seen the research account. Your aim is to communicate the principal finding in your own words. This is a formative starting point, not a graded assessment. You will return to your original explanation in later activities to examine your choices, revise your writing and reflect on what changed.</p><p>Allow approximately 12 minutes, including time to read the research account and write your explanation.

Read the complete fictional study provided with the writing task. You may refer to it while writing, but no external research or tools are needed.

Write independently for a non-specialist reader. Approximately 80–120 words is suggested as guidance, not a strict limit. Decide for yourself which evidence and context to include, how to communicate the numerical findings and how confidently to express your conclusions.

Keep your original explanation unchanged for later diagnosis, revision and reflection. You will not receive an automatic grade or detailed corrective feedback at this stage.</p></section><section class="util-assessment-guidance util-assessment-section" data-region="assessment" id="journey-assessment" data-journey-section="true" data-assessment-product="assessment_pack" data-feedback-timing="per_component"><section class="util-assessment-orientation" data-region="assessment-orientation" id="journey-assessment-briefing" data-journey-section="true"><h3>What to bring with you</h3><ul><li><p>If you completed &#39;Interpret the research evidence&#39;, revisit your own interpretation of the study&#39;s findings and the distinction you made between what the researchers observed and what might be inferred.</p><p>Use that earlier thinking to inform your first independent explanation for a non-specialist reader. You do not need an earlier written response; draw on your interpretation while making your own decisions about what evidence and context to communicate.</p></li></ul></section><article class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" id="elicitation-E1" data-elicitation-id="E1" data-journey-section="true"><h3>Write your first explanation</h3><section id="journey-assessment-judgement" class="util-assessment-stimulus" data-region="assessment-stimulus" data-stimulus-kind="prose" data-journey-section="true"><p>Study breaks and concentration among undergraduate students</p><p>This is a fictional, illustrative research study created for educational purposes. The findings are synthetic, not results from an actual investigation.</p><p>Research question: Is taking regular short breaks during independent study associated with students reporting good concentration?</p><p>Method: A university research team conducted an observational survey of 200 undergraduate students. Students reported their own study habits and concentration. Researchers divided respondents into two groups according to whether they reported taking regular short breaks during independent study. Students were not randomly assigned to take or avoid breaks.</p><p>Findings:<br>Regular short breaks: 100 students; 72 reporting good concentration; (72%).<br>No regular short breaks: 100 students; 58 reporting good concentration; (58%).</p><p>Observed difference: 72% minus 58% equals 14 percentage points. The proportion reporting good concentration was 14 percentage points higher among students reporting regular short breaks.</p><p>Methodological limitations: The survey was observational rather than a randomised experiment. Both study habits and concentration were self-reported. Students were not randomly assigned to groups. Potentially relevant factors such as sleep, motivation, workload and study environment were not controlled. The study does not establish whether reported concentration corresponds to objectively measured concentration or performance. The sample cannot automatically be assumed to represent all undergraduate students.</p><p>Evidence boundary: The study reports an association between reported study habits and reported concentration. It does not establish a causal effect. No statistical significance or confidence interval has been established, and the study does not identify an optimal frequency or duration of breaks.</p></section><p>Imagine you are explaining this illustrative study to someone who has not seen the research account and has no specialist knowledge of research methods.</p><p>Write your own short explanation of the study&#39;s principal finding for that reader. Use the research account provided above. Decide for yourself which evidence and context to include, how to communicate the numerical findings and how confidently to express your conclusions.</p><p>Write a concise explanation in your own words. This is your first independent attempt, so there is no model explanation to follow. Keep your original wording for use in &#39;Diagnose your explanation&#39;, &#39;Revise your explanation&#39; and &#39;Explain what changed and why&#39;.</p><p>Approximately 80–120 words, as a guide rather than a strict limit.</p><p>Allow approximately 12 minutes for the activity, including writing. No external research or tools are needed.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-E1" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="assessment-constructed-E1">Your response</label><p>Write your explanation here in your own words. You can refer to the research account while writing. The suggested word count is guidance only.</p><textarea class="util-learner-workspace__input" id="assessment-constructed-E1" name="assessment-constructed-E1" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="assessment-constructed-E1-review">Review your response</button></p><div id="assessment-constructed-E1-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="E1_completion_acknowledgement"><p>You have written your first explanation. This is a record of how you chose to communicate the study at this point in your learning. It has not been automatically marked or assessed for correctness.</p></article><article class="util-formative-material" data-material-id="E1_self_evaluation_orientation"><p>Keep your original explanation unchanged. When you return to it in &#39;Diagnose your explanation&#39;, you will be able to examine the decisions you made about what to include and how to communicate the findings. There is no need to evaluate or rewrite it now.</p></article><article class="util-formative-material" data-material-id="E1_original_response_reminder"><p>Keep a copy of your first explanation in your own words. You will use this original version in &#39;Diagnose your explanation&#39;, &#39;Revise your explanation&#39; and &#39;Explain what changed and why&#39; to consider how your explanation develops.</p></article></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Your first explanation is now a starting point for further learning. In &#39;Compare explanations and judge their quality&#39;, you can explore different ways of communicating the same research evidence. Keep your original explanation available so that, in &#39;Diagnose your explanation&#39;, you can examine your own communication choices before developing a revised version.</p></section></article><section class="util-pack-forward" data-region="pack-forward" id="journey-assessment-pack-forward" data-journey-section="true"><h2>What to take forward</h2><p>Keep a copy of &#39;My first explanation&#39; exactly as you originally wrote it. This first version provides a baseline for exploring explanation quality in &#39;Compare explanations and judge their quality&#39;, examining your choices in &#39;Diagnose your explanation&#39;, developing an improved version in &#39;Revise your explanation&#39;, and reflecting on the differences in &#39;Explain what changed and why&#39;. Your response has not been automatically graded or rewritten, and there is no requirement to revise it at this stage.</p></section><section class="util-assessment-output" data-assessment-output-region="true" data-assessment-output-mode="direct_copy" data-assessment-output-spec="{&quot;specification_id&quot;:&quot;initial-explanation&quot;,&quot;artefact_title&quot;:&quot;My first explanation&quot;,&quot;audience&quot;:&quot;You, for later revision and comparison&quot;,&quot;purpose&quot;:&quot;Retain your original explanation in your own words so that you can return to it during later diagnosis, revision and reflection. This artefact reproduces what you wrote; it does not generate a summary, correction or evaluation.&quot;,&quot;action_label&quot;:&quot;Keep a copy of my first explanation&quot;,&quot;missing_response_text&quot;:&quot;Not yet written.&quot;,&quot;sections&quot;:[{&quot;section_id&quot;:&quot;original-explanation&quot;,&quot;order&quot;:1,&quot;heading&quot;:&quot;My first explanation&quot;,&quot;contributions&quot;:[{&quot;contribution_id&quot;:&quot;initial-explanation-text&quot;,&quot;label&quot;:&quot;My original explanation&quot;,&quot;elicitation_id&quot;:&quot;E1&quot;,&quot;response_part&quot;:&quot;response_text&quot;}]}]}"><p class="util-assessment-output-purpose" data-assessment-output-purpose="true">Retain your original explanation in your own words so that you can return to it during later diagnosis, revision and reflection. This artefact reproduces what you wrote; it does not generate a summary, correction or evaluation.</p><p class="util-assessment-output-help" data-assessment-output-help="true" data-assessment-output-delivery="standalone">A draft of your response is kept on this page only. Later activities will not retrieve it automatically — copy the wording you want to keep for later use.</p><p><button type="button" class="util-assessment-check" data-assessment-output-copy="true">Keep a copy of my first explanation</button></p><p class="util-assessment-output-status" aria-live="polite" data-assessment-output-status></p></section></section></article></template><template id="lj-resource-C03"><article class="util-learner-page util-page util-learner-renderer-vnext" data-renderer="vnext" data-page-kind="interactive" data-persistence-page-key="v1::98742594-8881-4836-879b-2df087e2b704::learner-page::2.0.0::a1-a2-a3-a4::judging-the-quality-of-research-expl ></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This self-study resource explores how different explanations of the same research finding can vary in accuracy, clarity and usefulness. Begin by comparing candidate explanations of a fictional undergraduate survey and recording your judgements. You will then examine individual claims, apply a framework for evaluating explanation quality, and reconsider your reasoning in light of feedback.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The activities move from independent judgement to explicit guidance and reconsideration. Make and record your initial decisions before consulting the detailed feedback. Your comparisons will provide a basis for evaluating the quality of your own explanation in a later learning activity.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><p>Research explanations help readers understand what evidence shows and how far its implications extend. Two explanations can describe the same finding yet differ substantially in how effectively they communicate its meaning.</p><h3 class="util-md-heading util-md-heading--source-3">Evaluative judgement and comparison</h3><p><strong>Evaluative judgement</strong> is the ability to recognise and explain differences in quality. <strong>Comparative judgement</strong> develops this ability by asking you to examine alternatives, decide which better serves a purpose, and justify that decision using identifiable features of the work.</p><p>A useful comparison considers both explanations rather than assessing each in isolation. It identifies consequential differences, explains why those differences matter, and recognises strengths that may favour the alternative not selected.</p><p>There is not always one universally correct ranking. Two explanations may both represent the evidence faithfully while making different choices about detail, accessibility and emphasis. A defensible preference depends on the intended reader and communication purpose.</p><h3 class="util-md-heading util-md-heading--source-3">What counts as a good research explanation?</h3><p>Six connected dimensions provide a framework for judgement:</p><ul><li><strong>Numerical accuracy:</strong> Are quantities, comparisons and units represented correctly?</li><li><strong>Evidential support:</strong> Does the available research justify the claims being made?</li><li><strong>Clarity:</strong> Can the intended reader follow the explanation without unnecessary difficulty?</li><li><strong>Relevance:</strong> Does the explanation foreground the finding and information that matter for its purpose?</li><li><strong>Context and qualification:</strong> Does it provide the research information needed to interpret the finding responsibly?</li><li><strong>Proportionality:</strong> Is the strength of the conclusion appropriate to the strength of the evidence?</li></ul><p>These dimensions interact. An explanation can be numerically accurate but make an unsupported inference. Another may be thoroughly qualified yet make the principal finding difficult to identify. The task is to weigh these consequences rather than award an equal number of marks for each dimension.</p><h3 class="util-md-heading util-md-heading--source-3">Reading numerical comparisons</h3><p>Percentages describe proportions within groups. A <strong>percentage-point difference</strong> describes the arithmetic difference between two percentages. A <strong>relative percentage change</strong> uses one value as a reference point and answers a different question.</p><p>For example, if 40% of one group and 50% of another report an outcome, the difference is 10 percentage points. Relative to the first group&#39;s 40%, the second group&#39;s percentage is 25% higher. These are different numerical descriptions and should not be substituted for one another.</p><p>When evaluating an explanation, identify the group being described, the outcome being measured and the unit of comparison. Correct arithmetic matters, but so does the meaning attached to the numbers.</p><h3 class="util-md-heading util-md-heading--source-3">Association, causation and measurement</h3><p>An <strong>association</strong> means that two characteristics occur together in the observed evidence. A <strong>causal claim</strong> goes further: it states that one characteristic produces a change in another.</p><p>Observational studies can identify associations, but differences between observed groups do not by themselves establish what caused those differences. Other characteristics may influence the outcome, and the groups may differ in ways that have not been measured or controlled.</p><p>The type of measurement also matters. A person&#39;s report of their concentration is not the same as an objective concentration test or a measure of academic performance. An explanation should preserve the distinction between what researchers recorded and what a reader might be tempted to infer.</p><p><strong>Generalisability</strong> is a further consideration. Findings from a particular group of participants do not automatically establish what is true of a wider population. The evidence needed to support a broader claim depends on how the participants were selected and how well they represent that population.</p><h3 class="util-md-heading util-md-heading--source-3">Balancing accuracy and accessibility</h3><p>The intended audience influences how much detail an explanation needs. A non-specialist reader may benefit from a direct statement of the main comparison, followed by a concise qualification. A reader examining the research design may need fuller information about the methods and limitations.</p><p>These are legitimate communication choices only while the explanation preserves the numerical meaning and stays within the evidence. Brevity does not justify an unsupported conclusion, and additional detail does not automatically improve quality.</p><h3 class="util-md-heading util-md-heading--source-3">Building an evidence-grounded judgement</h3><p>A strong justification connects three elements: a <strong>specific feature</strong> of the explanation, the <strong>evidence or quality dimension</strong> relevant to that feature, and the <strong>consequence for the intended reader</strong>.</p><p>For example, identifying that an explanation uses a causal verb is only the beginning. The evaluation must consider whether the research design warrants that verb and what a reader might incorrectly conclude from it.</p><p>After making an initial judgement, feedback can help you reconsider the importance of particular features. Reconsideration does not require changing your preference. Retaining a choice with a stronger, more precise justification can demonstrate evaluative development just as clearly as revising it.</p><p>You will use these ideas to examine competing explanations and claims. The specific judgements remain yours to make from the supplied evidence.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C03/knowledge-summary-after-content.png" alt="Concept map connecting research evidence, six explanation-quality dimensions and comparative judgement; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> How evidence, six quality dimensions and reader consequences inform a justified comparison.</figcaption><p class="util-visual-asset-detailed-description" id="figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">The map connects research evidence to the evaluation of an explanation. Observed quantities, study design, measurement and limitations provide the evidential basis. Numerical accuracy concerns correct representation of quantities; evidential support concerns warranted claims; proportionality connects the strength of a conclusion to the strength of the evidence. Clarity and relevance concern accessibility and focus, while context and qualification support responsible interpretation. These six dimensions feed into comparative judgement, where specific wording is considered alongside its consequences for a reader. The map distinguishes evidential boundaries from legitimate choices about brevity, emphasis and detail.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Compare contrasting explanations of the illustrative survey and justify a preference by identifying specific strengths, weaknesses and consequences for a non-specialist reader. <span class="util-outcome-id">(LO1)</span></li><li>Evaluate whether candidate explanations represent the survey findings accurately and draw conclusions proportionate to the evidence, distinguishing the observed association from unsupported causal claims. <span class="util-outcome-id">(LO2)</span></li><li>Apply six dimensions of explanation quality to explain the relative merits of candidate explanations, including defensible trade-offs between clarity, relevance, contextual completeness and appropriate qualification. <span class="util-outcome-id">(LO3)</span></li><li>Reconsider an earlier comparative judgement in light of formative feedback and explain whether, and why, the original preference or justification should be retained or revised. <span class="util-outcome-id">(LO4)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Choose the stronger explanation</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your interpretation of the survey in &#39;Interpret the research evidence&#39; and your experience of writing an independent explanation provide a starting point for judging how effectively other explanations communicate the same findings. Comparing alternatives makes the consequences of different communication decisions visible.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have already encountered the fictional survey about study breaks and concentration. If you completed &#39;Write your first explanation&#39;, revisit your initial wording and the communication decisions you made. Keep that explanation available for later diagnosis and revision, but do not change it yet. In this activity, you will compare explanations written by others. Decide which better serves a non-specialist reader and explain your reasoning before receiving detailed guidance.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Judge what each explanation enables a reader to conclude and whether that conclusion is warranted. Consider the significance of the differences between candidates rather than relying on which one initially sounds more convincing.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which feature of the explanations most influenced your preference, and what difference would it make to a reader&#39;s interpretation?</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Read each pair of candidate explanations alongside the fictional survey evidence.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A1-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Fictional survey: Study breaks and concentration among undergraduate students</span></p><h3 class="util-md-heading util-md-heading--source-2">Study breaks and concentration among undergraduate students</h3><p><strong>Fictional, synthetic educational evidence.</strong> This illustrative survey is not a report of an authentic investigation.</p><p>An observational survey involved 200 undergraduate students. Students were grouped according to whether they reported taking regular short breaks during independent study. They also reported whether they experienced good concentration.</p><table><thead><tr><th>Reported study-break pattern</th><th>Students in group</th><th>Students reporting good concentration</th><th>Percentage reporting good concentration</th></tr></thead><tbody><tr><td>Regular short breaks</td><td>100</td><td>72</td><td>72%</td></tr><tr><td>No regular short breaks</td><td>100</td><td>58</td><td>58%</td></tr></tbody></table><p>The observed difference between the group percentages was <strong>14 percentage points</strong>.</p><h3 class="util-md-heading util-md-heading--source-3">Research information</h3><ul><li>The study was <strong>observational</strong>: students were not randomly assigned to take or avoid breaks.</li><li>Both study-break habits and concentration were <strong>self-reported</strong>.</li><li>Sleep, motivation, workload and study environment were not controlled.</li><li>Concentration was not objectively measured, and academic performance was not established by these findings.</li><li>The survey does not establish whether its participants represent undergraduate students more generally.</li></ul><p>Use this evidence when comparing the candidate explanations. Treat the explanations as statements to evaluate, not as additional research findings.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>For each pair, select the explanation you consider more effective for a non-specialist reader.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a1-a1-m3" data-material-source-id="A1-M3" data-activity-id="A1"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A1-M3" data-material-type="comparison_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Record your comparative judgements</span></p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="a1-a1-m3-col-pair-0">Pair</th><th scope="col" id="a1-a1-m3-col-preferred-candidate-1">Preferred candidate</th><th scope="col" id="a1-a1-m3-col-strength-of-preferred-candidate-2">Strength of preferred candidate</th><th scope="col" id="a1-a1-m3-col-limitation-or-competing-strength-of-alternative-3">Limitation or competing strength of alternative</th><th scope="col" id="a1-a1-m3-col-evidence-or-wording-supporting-the-decision-4">Evidence or wording supporting the decision</th><th scope="col" id="a1-a1-m3-col-consequence-for-a-non-specialist-reader-5">Consequence for a non-specialist reader</th></tr></thead><tbody><tr><th scope="row" id="a1-a1-m3-row-0" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Pair 1</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__c
