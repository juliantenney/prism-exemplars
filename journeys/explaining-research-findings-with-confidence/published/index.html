ass="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Diagnose your explanation</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="3"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Briefing</span><p class="util-journey-position" aria-label="Section 1 of 3"><span class="util-journey-position__visible" aria-hidden="true">1 of 3</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#journey-assessment-judgement" aria-label="Next section: Judgement"><span class="util-journey-adjacent__title">Judgement</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c04--journey-assessment-briefing" aria-current="location">Briefing</a></li><li><a class="util-journey-all-link" href="#journey-assessment-judgement">Judgement</a></li><li><a class="util-journey-all-link" href="#lj-c04--journey-assessment-pack-forward">Take forward</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C04/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-assessment-intro" data-region="assessment-intro" data-journey-section="true"><p>Before revising your explanation of the study, examine how effectively it communicates the evidence to a non-specialist reader. This formative assessment asks you to make and justify your own judgements about what works, what needs attention and which improvements matter most. There is no single correct diagnosis, and your writing will not be automatically graded. Allow approximately 10 minutes. No external research is needed.</p><p>Read the illustrative research account and reconsider your original explanation against its findings and limitations.

Identify meaningful strengths and any consequential weaknesses in your explanation. Explain why they matter for someone unfamiliar with the study.

Use relevant quality dimensions, including accuracy, clarity, relevance, context, qualification and proportionality. Distinguish changes that affect the reader&#39;s interpretation from changes that are mainly cosmetic.

Choose and justify your most important improvement priorities. Write a diagnostic self-evaluation rather than a revised explanation.

After completing your diagnosis, use the reflective guidance to check your reasoning. You may refine your diagnosis if you wish.</p></section><section class="util-assessment-guidance util-assessment-section" data-region="assessment" id="lj-c04--journey-assessment" data-journey-section="true" data-assessment-product="assessment_pack" data-feedback-timing="per_component"><section class="util-assessment-orientation" data-region="assessment-orientation" id="lj-c04--journey-assessment-briefing" data-journey-section="true"><h3>What to bring with you</h3><ul><li><p>If you completed &#39;Write your first explanation&#39;, revisit your original explanation of the study. Also consider the judgements you developed in &#39;Compare explanations and judge their quality&#39;, particularly the qualities that made explanations more or less convincing.</p><p>Use your original explanation as the work you are evaluating, and apply your comparative insights to identify what it communicates effectively, what could mislead a non-specialist reader and which improvements would matter most before you revise it.</p></li></ul></section><article id="journey-assessment-judgement" class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" data-elicitation-id="E1" data-journey-section="true"><h3>Diagnose your explanation</h3><p>Study breaks and concentration among undergraduate students is a fictional, illustrative research study created for educational purposes; its findings are synthetic and are not results of an actual investigation. The research question was whether taking regular short breaks during independent study was associated with students reporting good concentration. In the illustrative study, a university research team conducted an observational survey of 200 undergraduate students. Students reported their own study habits and concentration, and researchers divided respondents into two groups according to whether they reported taking regular short breaks. In the group reporting regular short breaks, 72 of 100 students (72%) reported good concentration. In the group not reporting regular short breaks, 58 of 100 students (58%) reported good concentration. The observed difference was 14 percentage points, not 14%. Students reporting regular short breaks were therefore more likely to report good concentration in this survey. The study was observational, not a randomised experiment, and students were not randomly assigned to take or avoid breaks. Potentially relevant factors such as sleep, motivation, workload and study environment were not controlled. Both study habits and concentration were self-reported; the survey does not establish whether reported concentration corresponds to objectively measured concentration or performance. The sample cannot automatically be assumed to represent all undergraduate students. The findings do not establish that taking breaks causes improved concentration, that introducing breaks would produce a 14-percentage-point improvement, that academic performance improves, or that any particular frequency or duration of breaks is best. No statistical significance, confidence interval or causal effect has been established. Your diagnosis should distinguish what this illustrative evidence shows from claims it cannot support.</p><p>You are evaluating your own explanation of the study for a non-specialist reader. Your aim is to decide what already works, what matters most to improve, and why. This is a diagnosis, not a request to rewrite your explanation.</p><p>Reread your original explanation and compare its claims and omissions with the study evidence above. Use whichever of the quality dimensions you explored in &#39;Compare explanations and judge their quality&#39; are most relevant: accuracy, clarity, relevance, context, qualification and proportionality. Write a reasoned self-evaluation that identifies at least one meaningful strength and explains how it helps the reader. Identify any consequential weaknesses, pointing to specific wording, omissions or implications and explaining why they matter. Consider whether a problem concerns an inaccurate figure, unsupported inference, missing context, inadequate qualification or difficulty understanding the finding, rather than merely a cosmetic wording change. Then select the improvements you would prioritise and justify your choices. If your explanation already handles a particular issue effectively, recognise that strength rather than inventing a weakness.</p><p>Organise your response around: (1) strengths and why they matter; (2) weaknesses or limitations and their consequences for the reader; (3) your highest-priority improvements and reasons for choosing them; and (4) a brief statement of what you intend to focus on in &#39;Revise your explanation&#39;. Refer to features of your own writing and to the study evidence where relevant. Make your own judgements; there is no single required diagnosis or prescribed replacement wording. Do not write the revised explanation here.</p><p>A concise diagnostic account of approximately 150–250 words, or an equivalently focused response organised under the four suggested headings.</p><p>Allow approximately 10 minutes in total, including rereading your original explanation, checking the evidence, writing your diagnosis and identifying your priorities.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-E1" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c04--assessment-constructed-E1">Your response</label><p>Use your own explanation as evidence. Be specific about what works or needs attention, and explain why it matters for someone unfamiliar with the study. Choose the priorities you consider most consequential; you do not need to rewrite your explanation.</p><textarea class="util-learner-workspace__input" id="lj-c04--assessment-constructed-E1" name="assessment-constructed-E1" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="lj-c04--assessment-constructed-E1-review">Review your response</button></p><div id="lj-c04--assessment-constructed-E1-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="E1_SELF_CHECK"><p>Review your diagnosis against your original explanation. Have you identified a genuine strength and explained how it helps a non-specialist reader? For each weakness you identified, can you point to something you actually wrote or omitted and explain its consequence? Check any numerical or interpretative judgement against the study evidence: 72% and 58% of the respective groups reported good concentration, a difference of 14 percentage points. The survey shows an association between reported breaks and reported concentration, not a proven causal effect. Its observational design, self-reporting and uncontrolled factors limit what can be concluded. These are checks on your reasoning, not a list of faults you must find in your writing.</p></article><article class="util-formative-material" data-material-id="E1_PRIORITY_CHECK"><p>Look again at your proposed improvements. Which would most change what a non-specialist reader understands or concludes? A correction to an inaccurate figure, an unsupported causal claim or a consequential omission may matter more than polishing a sentence. Equally, a clearer expression can be important when the existing wording obscures the finding. Your priorities should follow from the particular strengths and weaknesses of your own explanation. Can you explain why each chosen improvement deserves attention before a less consequential edit?</p></article><article class="util-formative-material" data-material-id="E1_INDEPENDENT_JUDGEMENT"><p>There is no single required diagnosis. Different explanations can communicate the finding effectively in different ways, provided their claims remain accurate, evidence-grounded and appropriately qualified. You do not need to manufacture weaknesses or adopt a prescribed replacement sentence. The value of your diagnosis lies in how specifically and convincingly you justify your judgements about your own writing.</p></article></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Use the priorities you have justified to guide your decisions in &#39;Revise your explanation&#39;. Keep the strengths you want to preserve in mind alongside the changes you consider most consequential. Your diagnosis is a basis for making revision decisions, not a fixed set of required edits.</p></section></article><section class="util-pack-forward" data-region="pack-forward" id="lj-c04--journey-assessment-pack-forward" data-journey-section="true"><h2>What to take forward</h2><p>Your diagnostic self-evaluation identifies what is already effective in your explanation and what you have reason to improve. In &#39;Revise your explanation&#39;, use those judgements to make deliberate changes that improve accuracy, clarity and appropriate qualification for a non-specialist reader. You remain responsible for deciding which changes are warranted; this formative assessment does not assign a grade or determine your subsequent pathway.</p></section><section class="util-assessment-output" data-assessment-output-region="true" data-assessment-output-mode="assemble" data-assessment-output-spec="{&quot;specification_id&quot;:&quot;C04.E1&quot;,&quot;artefact_title&quot;:&quot;My explanation diagnosis&quot;,&quot;audience&quot;:&quot;Learner&quot;,&quot;purpose&quot;:&quot;Keep your own reasoned diagnosis available to guide decisions when you revise your explanation.&quot;,&quot;action_label&quot;:&quot;Review my diagnosis&quot;,&quot;missing_response_text&quot;:&quot;Complete your diagnosis to review your written response.&quot;,&quot;sections&quot;:[{&quot;section_id&quot;:&quot;C04.E1-E1&quot;,&quot;order&quot;:1,&quot;heading&quot;:&quot;My diagnosis&quot;,&quot;contributions&quot;:[{&quot;contribution_id&quot;:&quot;C04.E1-E1-response&quot;,&quot;label&quot;:&quot;My diagnosis&quot;,&quot;elicitation_id&quot;:&quot;E1&quot;,&quot;response_part&quot;:&quot;response_text&quot;}]}]}"><p><button type="button" class="util-assessment-check" data-assessment-assemble="true">Review my diagnosis</button></p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-output-C04.E1" data-assessment-output="true" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c04--assessment-output-C04.E1">My explanation diagnosis</label><textarea class="util-learner-workspace__input" id="lj-c04--assessment-output-C04.E1" name="assessment-output-C04.E1" rows="12"></textarea></div><p><button type="button" class="util-assessment-check" data-assessment-output-copy="true">Copy</button> <button type="button" class="util-assessment-check" data-assessment-output-replace="true">Replace with current responses</button></p><p class="util-assessment-output-status" aria-live="polite" data-assessment-output-status></p></section></section></article></template><template id="lj-resource-C05"><article class="util-learner-page util-page util-learner-renderer-vnext util-page--assessment" data-renderer="vnext" data-page-kind="assessment" data-persistence-page-key="v1::ff18a600-3203-4f3c-bc34-9101600baa68::learner-page::2.0.0::no-activities::revise-your-explanation" data-persistence-storage-key="learner-renderer-vnext:draft:v1::ff18a600-3203-4f3c-bc34-9101600baa68::learner-page::2.0.0::no-activities::revise-your-explanation" data-composition-mode="moments" data-composed-activity-count="0" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Revise your explanation</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="3"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Revise your explanation</span><p class="util-journey-position" aria-label="Section 1 of 3"><span class="util-journey-position__visible" aria-hidden="true">1 of 3</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c05--elicitation-E2" aria-label="Next section: E2"><span class="util-journey-adjacent__title">E2</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c05--elicitation-E1" aria-current="location">Revise your explanation</a></li><li><a class="util-journey-all-link" href="#lj-c05--elicitation-E2">E2</a></li><li><a class="util-journey-all-link" href="#lj-c05--elicitation-E3">E3</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C05/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-assessment-intro" data-region="assessment-intro" data-journey-section="true"><p>In this formative assessment, you will use your earlier judgements about explanation quality to revise your own account of an illustrative research study. The main outcome is a concise, evidence-grounded explanation for a non-specialist audience. You will also complete two brief checks on numerical interpretation and the limits of the evidence. The activity takes approximately 20 minutes, with most of that time devoted to independent writing and checking. Your explanation will not be automatically graded, and there is no single required wording.</p><p>1. Read the research account and revisit your earlier explanation and judgements.

2. Spend approximately 15 minutes independently revising your explanation for the same non-specialist audience. Address consequential weaknesses rather than making only cosmetic changes. You may reconsider your earlier priorities as you write.

3. Use the self-review prompts to check your revised explanation against the evidence and the qualities of accuracy, clarity, relevance, context, qualification and proportionality. Make any further changes you judge necessary.

4. Complete the two short formative checks. Read the explanatory feedback and consider whether the same distinctions are communicated accurately in your own writing.

5. Retain your unchanged original explanation and your completed revised explanation for &#39;Explain what changed and why&#39;. No external materials are required.</p></section><section class="util-assessment-guidance util-assessment-section" data-region="assessment" id="lj-c05--journey-assessment" data-journey-section="true" data-assessment-product="assessment_pack" data-feedback-timing="per_component"><section class="util-assessment-orientation" data-region="assessment-orientation" id="lj-c05--journey-assessment-briefing" data-journey-section="true"><h3>What to bring with you</h3><ul><li><p>If you completed &#39;Write your first explanation&#39;, revisit your original explanation. Also consult your diagnostic judgement from &#39;Diagnose your explanation&#39; and the quality judgements you developed in &#39;Compare explanations and judge their quality&#39;.</p><p>Use your original explanation as the starting point for revision, your diagnostic judgement to identify consequential weaknesses and priorities, and your comparative judgements to guide decisions about effective research communication. You may reconsider your earlier priorities as you write. Your aim is to produce a clearer, more accurate and appropriately qualified explanation in your own words.</p></li></ul></section><article class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" id="lj-c05--elicitation-E1" data-elicitation-id="E1" data-journey-section="true"><h3>Revise your explanation</h3><p>Study breaks and concentration among undergraduate students. This is a fictional, illustrative research study created for educational purposes. Its findings are synthetic and must not be presented as results of an actual investigation. The research question was: Is taking regular short breaks during independent study associated with students reporting good concentration? In the illustrative study, a university research team conducted an observational survey of 200 undergraduate students. Students reported their own study habits and concentration. The researchers divided respondents into two groups according to whether they reported taking regular short breaks during independent study. Group A comprised 100 students reporting regular short breaks; 72 reported good concentration (72%). Group B comprised 100 students not reporting regular short breaks; 58 reported good concentration (58%). The observed difference was 72% minus 58%, or 14 percentage points. The proportion reporting good concentration was therefore 14 percentage points higher among students reporting regular short breaks. The survey was observational, not a randomised experiment. Students were not randomly assigned to take or avoid breaks. Potentially relevant factors including sleep, motivation, workload and study environment were not controlled. Both study habits and concentration were self-reported. The study does not establish whether reported concentration corresponds to objectively measured concentration or performance, and the sample cannot automatically be assumed to represent all undergraduate students. The supported interpretation is that students reporting regular short study breaks were more likely to report good concentration than students not reporting regular short breaks. The evidence does not establish that taking breaks causes improved concentration, that introducing breaks would produce a 14-percentage-point improvement, that academic performance improved, or that any particular frequency or duration of breaks is best. No statistical significance, confidence interval or causal effect has been established. Do not introduce additional findings or methodological details.</p><p>You have already had opportunities to write an explanation, compare the quality of different explanations and diagnose your own work. Your task now is to use those judgements to improve how you communicate the finding from the illustrative study.</p><p>Write a revised version of your original explanation for the same non-specialist audience. Use your earlier diagnostic priorities and comparative quality judgements to decide which changes matter most. Check your claims against the research account. Make substantive improvements where needed to accuracy, clarity, relevance, context, qualification and proportionality. You may reconsider your earlier priorities as you write. Distinguish the observed association from unsupported causal conclusions, and ensure that the numerical findings and self-reported outcome are represented accurately. Write the explanation in your own words rather than imitating a model response.</p><p>Produce one complete, coherent explanation of the principal finding, not a list of corrections or a commentary on your writing decisions. Your explanation should be concise, evidence-grounded and understandable to a non-specialist reader. Different formulations and emphases are acceptable where they remain accurate and appropriately qualified. Keep your original explanation unchanged and retain both versions for &#39;Explain what changed and why&#39;.</p><p>One short paragraph, or two brief paragraphs if needed to communicate the finding and its limitations clearly.</p><p>Approximately 15 minutes for independent revision, within the 20-minute activity.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-E1" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c05--assessment-constructed-E1">Your response</label><p>Write your revised explanation here. Focus on communicating the research finding clearly and responsibly in your own words.</p><textarea class="util-learner-workspace__input" id="lj-c05--assessment-constructed-E1" name="assessment-constructed-E1" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="lj-c05--assessment-constructed-E1-review">Review your response</button></p><div id="lj-c05--assessment-constructed-E1-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="E1.M1"><p>Review your revised explanation against the research account. Does it identify the comparison accurately: 72% of students reporting regular short breaks and 58% of students not reporting regular breaks reported good concentration? If you describe the difference, is it 14 percentage points rather than 14%? Check that you have not changed the figures, reversed the groups or introduced findings that were not reported.</p></article><article class="util-formative-material" data-material-id="E1.M2"><p>Check the strength of your claims. The study was an observational survey, and both study habits and concentration were self-reported. Students were not randomly assigned, and factors such as sleep, motivation, workload and study environment were not controlled. Does your explanation communicate an observed association without implying that breaks caused improved concentration? Does it avoid claiming objectively measured concentration, improved academic performance or a result that necessarily applies to all undergraduate students?</p></article><article class="util-formative-material" data-material-id="E1.M3"><p>Read your explanation as someone unfamiliar with the study. Is the principal finding easy to identify? Have you included enough context for the reader to interpret it responsibly? Consider whether your wording is clear, your details are relevant and your qualifications are proportionate. A concise explanation does not need to list every limitation, but it should not leave the reader with a misleading impression of what the evidence establishes.</p></article><article class="util-formative-material" data-material-id="E1.M4"><p>Compare your revised explanation with your original and revisit the weaknesses you identified in &#39;Diagnose your explanation&#39;. Have you addressed the issues that mattered most, rather than merely changing individual words? You may have discovered a more important weakness while writing or decided that an earlier priority was less consequential. Different choices of emphasis and wording are defensible when they communicate the evidence accurately and with appropriate qualification. These questions support your own judgement; they do not constitute an automatic assessment of your writing.</p></article></section><section class="util-assessment-revision" data-region="assessment-revision" data-automated-judgement="false"><p class="util-revision-offer" data-revision-offered="true">If your review identifies a consequential weakness, return to your explanation and make the change you judge necessary. Keep the wording and organisation your own. When you are satisfied that the explanation is accurate, clear and appropriately qualified, retain the completed version alongside your unchanged original.</p><div class="util-learner-workspace" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-E1-weakness" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c05--assessment-constructed-E1-weakness">What is the most important weakness you identified in your argument?</label><textarea class="util-learner-workspace__input" id="lj-c05--assessment-constructed-E1-weakness" name="assessment-constructed-E1-weakness" rows="3"></textarea></div><p>Revision is yours to make. It is not marked correct or incorrect.</p><p><a href="#lj-c05--assessment-constructed-E1" data-assessment-return-to-response="assessment-constructed-E1">Revise your written judgement</a></p></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Your revised explanation is the main outcome of this activity. Retain it alongside the original explanation from &#39;Write your first explanation&#39;. In &#39;Explain what changed and why&#39;, you will use both versions to examine the consequential changes you made and the judgements behind them. You do not need to justify every change here.</p></section></article><article class="util-assessment-elicitation" data-assessment-mode="determinate" id="lj-c05--elicitation-E2" data-elicitation-id="E2" data-journey-section="true"><article data-assessment-correct="B" class="util-task-block util-assessment-item util-assessment-item--formative util-assessment-item--interactive" data-assessment-mode="interactive" data-assessment-form="single_answer_mcq" data-workspace-kind="assessment_selection" data-workspace-id="assessment-e2-i1" data-assessment-item-id="e2-i1" data-assessment-rationale="The difference between 72% and 58% is 14 percentage points. This describes the gap between two observed proportions, not a 14% increase and not an improvement caused by taking breaks. The higher proportion was among students who reported regular short breaks. When checking your explanation, make sure the numerical comparison, its direction and its meaning are all accurate."><header class="util-assessment-item-header"><h3 class="util-assessment-title util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg></span><span class="util-semantic-icon__label">Question 1</span></h3></header><div class="util-assessment-item-body"><fieldset class="util-assessment-fieldset"><legend class="util-assessment-legend">In the illustrative survey, 72% of students reporting regular short breaks and 58% of students not reporting regular breaks reported good concentration. Which statement describes the numerical difference accurately without claiming a causal effect?</legend><div class="util-assessment-choices"><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c05--assessment-e2-i1-opt-1" name="assessment-group-e2-i1" value="A" data-assessment-option="A"><label class="util-assessment-option__label" for="lj-c05--assessment-e2-i1-opt-1">Students reporting regular short breaks were 14% more likely to report good concentration.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c05--assessment-e2-i1-opt-2" name="assessment-group-e2-i1" value="B" data-assessment-option="B"><label class="util-assessment-option__label" for="lj-c05--assessment-e2-i1-opt-2">The proportion reporting good concentration was 14 percentage points higher among students reporting regular short breaks.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c05--assessment-e2-i1-opt-3" name="assessment-group-e2-i1" value="C" data-assessment-option="C"><label class="util-assessment-option__label" for="lj-c05--assessment-e2-i1-opt-3">Taking regular short breaks increased good concentration by 14 percentage points.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c05--assessment-e2-i1-opt-4" name="assessment-group-e2-i1" value="D" data-assessment-option="D"><label class="util-assessment-option__label" for="lj-c05--assessment-e2-i1-opt-4">The proportion reporting good concentration was 14 percentage points higher among students not reporting regular short breaks.</label></div></div></fieldset><button type="button" class="util-assessment-check" data-assessment-check>Check answer</button><div class="util-assessment-result" data-assessment-result aria-live="polite" hidden></div></div></article><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Use this numerical distinction to check your own revised explanation. Recognising the correct difference in a question is useful, but the more important test is whether you have communicated it accurately and naturally in your writing.</p></section></article><article class="util-assessment-elicitation" data-assessment-mode="determinate" id="lj-c05--elicitation-E3" data-elicitation-id="E3" data-journey-section="true"><article data-assessment-correct="B" class="util-task-block util-assessment-item util-assessment-item--formative util-assessment-item--interactive" data-assessment-mode="interactive" data-assessment-form="single_answer_mcq" data-workspace-kind="assessment_selection" data-workspace-id="assessment-e3-i1" data-assessment-item-id="e3-i1" data-assessment-rationale="The survey supports an association between reporting regular short breaks and reporting good concentration. It does not establish that breaks caused the difference. Students were not randomly assigned, other potentially relevant factors were not controlled, and the outcome was self-reported. The findings therefore do not demonstrate improved academic performance or establish a benefit for every undergraduate student. A responsible explanation communicates the observed relationship while keeping its claims within these evidential limits."><header class="util-assessment-item-header"><h3 class="util-assessment-title util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg></span><span class="util-semantic-icon__label">Question 2</span></h3></header><div class="util-assessment-item-body"><fieldset class="util-assessment-fieldset"><legend class="util-assessment-legend">The illustrative study was an observational survey in which students reported their own study-break habits and concentration. Students were not randomly assigned to take or avoid breaks, and potentially relevant factors such as sleep, motivation, workload and study environment were not controlled. Which conclusion is best supported by this evidence?</legend><div class="util-assessment-choices"><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c05--assessment-e3-i1-opt-1" name="assessment-group-e3-i1" value="A" data-assessment-option="A"><label class="util-assessment-option__label" for="lj-c05--assessment-e3-i1-opt-1">Regular short study breaks have been shown to cause better concentration among undergraduate students.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c05--assessment-e3-i1-opt-2" name="assessment-group-e3-i1" value="B" data-assessment-option="B"><label class="util-assessment-option__label" for="lj-c05--assessment-e3-i1-opt-2">Students reporting regular short breaks were more likely to report good concentration, but the survey does not establish that taking breaks caused the difference.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c05--assessment-e3-i1-opt-3" name="assessment-group-e3-i1" value="C" data-assessment-option="C"><label class="util-assessment-option__label" for="lj-c05--assessment-e3-i1-opt-3">The survey demonstrates that taking regular short breaks improves students&#39; academic performance.</label></div><div class="util-assessment-option"><input type="radio" class="util-assessment-option__input" id="lj-c05--assessment-e3-i1-opt-4" name="assessment-group-e3-i1" value="D" data-assessment-option="D"><label class="util-assessment-option__label" for="lj-c05--assessment-e3-i1-opt-4">The observed difference establishes that all undergraduate students would benefit from introducing regular short breaks.</label></div></div></fieldset><button type="button" class="util-assessment-check" data-assessment-check>Check answer</button><div class="util-assessment-result" data-assessment-result aria-live="polite" hidden></div></div></article><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Check whether your revised explanation makes the distinction between association and causation clear to a non-specialist reader. You can acknowledge the study&#39;s limitations in different ways; what matters is that your wording does not claim more than the evidence establishes.</p></section></article><section class="util-pack-forward" data-region="pack-forward" id="lj-c05--journey-assessment-pack-forward" data-journey-section="true"><h2>What to take forward</h2><p>You have produced your own revised explanation and checked two important aspects of the research evidence: the 14-percentage-point difference and the limits of causal inference. The checks offer focused feedback, but they do not automatically assess the quality of your written explanation. Use the self-review questions to decide whether any further changes would make your account more accurate, clearer or better qualified. Different evidence-grounded formulations are legitimate, so retain responsibility for your own wording and emphasis. Keep both your unchanged original explanation from &#39;Write your first explanation&#39; and your completed revised explanation, &#39;My revised research explanation&#39;. In &#39;Explain what changed and why&#39;, you will use these two versions to examine what changed, which improvements mattered most and how your evaluative judgements informed your decisions.</p></section><section class="util-assessment-output" data-assessment-output-region="true" data-assessment-output-mode="direct_copy" data-assessment-output-spec="{&quot;specification_id&quot;:&quot;revised-research-explanation&quot;,&quot;artefact_title&quot;:&quot;My revised research explanation&quot;,&quot;audience&quot;:&quot;You, for later reflection and comparison&quot;,&quot;purpose&quot;:&quot;Retain your complete revised explanation in your own words so that you can review it, copy it and compare it with your unchanged original explanation in &#39;Explain what changed and why&#39;. The artefact reproduces your writing without generating a summary, replacement explanation or automatic judgement.&quot;,&quot;action_label&quot;:&quot;Copy my revised explanation&quot;,&quot;missing_response_text&quot;:&quot;Not yet written.&quot;,&quot;sections&quot;:[{&quot;section_id&quot;:&quot;revised-explanation&quot;,&quot;order&quot;:1,&quot;heading&quot;:&quot;My revised research explanation&quot;,&quot;contributions&quot;:[{&quot;contribution_id&quot;:&quot;revised-explanation-text&quot;,&quot;label&quot;:&quot;Revised explanation&quot;,&quot;elicitation_id&quot;:&quot;E1&quot;,&quot;response_part&quot;:&quot;response_text&quot;}]}]}"><p class="util-assessment-output-purpose" data-assessment-output-purpose="true">Retain your complete revised explanation in your own words so that you can review it, copy it and compare it with your unchanged original explanation in &#39;Explain what changed and why&#39;. The artefact reproduces your writing without generating a summary, replacement explanation or automatic judgement.</p><p class="util-assessment-output-help" data-assessment-output-help="true" data-assessment-output-delivery="unified">A draft of your response is kept on this device when you save it in this Learning Journey. It can appear for reference in the Learning Journal and in later resources that need it. Those later activities do not paste it into their answer fields for you. You can also copy the wording if you want your own backup.</p><p><button type="button" class="util-assessment-check" data-assessment-output-copy="true">Copy my revised explanation</button></p><p class="util-assessment-output-status" aria-live="polite" data-assessment-output-status></p></section></section></article></template><template id="lj-resource-C06"><article class="util-learner-page util-page util-learner-renderer-vnext util-page--expository" data-renderer="vnext" data-page-kind="expository" data-persistence-page-key="v1::e345a2ce-ed6c-4985-b2ec-685b3ae46bc3::learner-page::2.0.0::no-activities::explain-what-changed-and-why" data-persistence-storage-key="learner-renderer-vnext:draft:v1::e345a2ce-ed6c-4985-b2ec-685b3ae46bc3::learner-page::2.0.0::no-activities::explain-what-changed-and-why" data-composition-mode="moments" data-composed-activity-count="0" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Explain what changed and why</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="6"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Why does explaining a revision matter?</span><p class="util-journey-position" aria-label="Section 1 of 6"><span class="util-journey-position__visible" aria-hidden="true">1 of 6</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c06--exposition-S2" aria-label="Next section: From describing edits to explaining their significance"><span class="util-journey-adjacent__title">From describing edits to explaining their significance</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c06--exposition-S1" aria-current="location">Why does explaining a revision matter?</a></li><li><a class="util-journey-all-link" href="#lj-c06--exposition-S2">From describing edits to explaining their significance</a></li><li><a class="util-journey-all-link" href="#lj-c06--exposition-S3">What makes a change consequential?</a></li><li><a class="util-journey-all-link" href="#lj-c06--exposition-S4">Can a revision improve one thing while weakening another?</a></li><li><a class="util-journey-all-link" href="#lj-c06--exposition-S5">Compare your explanations and explain your decisions</a></li><li><a class="util-journey-all-link" href="#lj-c06--exposition-S6">What can you carry into your next explanation?</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C06/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-exposition-sections" data-region="exposition"><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c06--exposition-S1" data-section-id="S1" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Why does explaining a revision matter?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>You have worked with a fictional research finding, considered what makes an explanation effective and had an opportunity to revise your own explanation. The final step is to consider what changed and why.</p><p>A revised explanation is not necessarily a better explanation simply because it is different. A sentence might be shorter without becoming clearer. An added qualification might make a claim more accurate but also harder to follow. Understanding a revision means considering the reasons for the change and what it may mean for someone reading your explanation.</p><p>If you completed &#39;Write your first explanation&#39;, revisit the explanation you wrote there. Find your version from &#39;Revise your explanation&#39; and keep the two alongside each other for comparison. If useful, consult your earlier thinking from &#39;Diagnose your explanation&#39; to recall the changes you wanted to make and why. You can also draw on the communication-quality judgements you developed in &#39;Compare explanations and judge their quality&#39;. These are your own explanations and judgements; their differences provide the basis for the reflection in this resource.</p><p>You do not need to account for every alteration. The focus is on changes that may have affected how accurately, clearly or appropriately you communicated the research finding.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c06--exposition-S2" data-section-id="S2" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">From describing edits to explaining their significance</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>There is a difference between noticing an edit and explaining its significance.</p><p>Suppose you shortened a sentence in an explanation. Saying that the revised sentence is shorter identifies what changed, but it does not establish whether the change helped. You would need to consider what was removed, whether the main finding became easier to identify and whether any necessary information was lost.</p><p>A more informative reflection connects three things: the change itself, the reason for making it and its likely effect on the reader. For example, a shorter sentence may make the principal finding easier for a non-specialist audience to recognise. That is a reasoned possibility, not proof that the revision succeeded. If the shortened version omits an important limitation, the change may have made the explanation less faithful to the evidence.</p><p>This distinction also helps you decide which edits deserve attention. Changes to punctuation or individual words may matter little unless they affect meaning. A change that alters the numerical interpretation, the strength of a conclusion or the reader&#39;s understanding of the finding is more consequential. Explaining such changes reveals the judgement involved in communicating research, rather than simply recording that editing took place.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material util-exposition-structured-fallback" data-material-id="XM-M01" data-material-kind="compact_contrast" data-material-type="expository_structured_fallback" data-section-id="S2" data-expository-structured="fallback"><h3>Describing a change or explaining its significance?</h3><div><p><strong>Context</strong></p><p>Imagine that you shortened a sentence in a research explanation.</p></div><section><h4>Comparison</h4><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Label</th><th scope="col">Reflection</th><th scope="col">Focus</th></tr></thead><tbody><tr><td>Describing the change</td><td>I made the sentence shorter.</td><td>Identifies what was edited.</td></tr><tr><td>Explaining its significance</td><td>I shortened the sentence to make the main finding easier for a non-specialist reader to identify. This may improve clarity, provided I have not removed information needed to interpret the finding accurately.</td><td>Connects the edit to a reason, a possible benefit and a condition that limits the judgement.</td></tr></tbody></table></div></section><p>The second reflection offers a reasoned judgement rather than proof of improvement. Whether the change helped depends on what the revised sentence communicates and what it may have left out.</p></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c06--exposition-S3" data-section-id="S3" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">What makes a change consequential?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The significance of a revision depends partly on what the evidence allows you to say.</p><p>In the fictional observational survey, 72 of the 100 students who reported taking regular short study breaks also reported good concentration. Among the 100 students who did not report taking regular short breaks, 58 reported good concentration. The difference was 14 percentage points. These figures describe an association between reported study habits and self-reported concentration; they do not show that taking breaks caused better concentration.</p><p>A change from &#39;14%&#39; to &#39;14 percentage points&#39;, if that correction was needed, would affect numerical accuracy rather than merely style. Similarly, replacing a claim that breaks &#39;improved concentration&#39; with wording that describes an observed association would change the strength of the conclusion. That qualification reflects the observational design, the reliance on self-reporting and the absence of random assignment or control of potentially relevant factors. It does not make the finding meaningless; it keeps the interpretation within what the study supports.</p><p>Other consequential changes may concern the reader. Moving the principal finding nearer the beginning might help a non-specialist identify the result. Replacing technical or ambiguous language might make the explanation easier to understand. Including a brief qualification might prevent a reader from treating an association as proof of cause and effect.</p><p>These qualities are connected. An explanation that is easy to read but misstates the evidence is not effective research communication. Equally, an explanation that includes every possible caution may make its principal finding difficult to follow. The question is how a change affects both the evidence being communicated and the reader trying to understand it.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c06--exposition-S4" data-section-id="S4" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Can a revision improve one thing while weakening another?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Changes to an explanation do not always have a single, straightforward effect.</p><p>Adding a sentence about the limitations of self-reported data may help readers understand why a finding should be interpreted cautiously. Yet the additional detail could make a short explanation harder to follow. Removing that sentence might improve the flow while leaving readers with too little information about what the evidence establishes. Neither length nor detail alone determines quality.</p><p>Different explanations can also make different defensible choices about emphasis. One may foreground the 14-percentage-point difference. Another may give greater prominence to the uncertainty surrounding causation. Both approaches can be appropriate if they preserve the figures, distinguish the observed association from a causal conclusion and provide the intended audience with enough context to interpret the finding.</p><p>When reflecting on a revision, it is therefore reasonable to identify something that improved alongside something that remains difficult. You might judge that a qualification makes the explanation more accurate but less concise, or that a clearer opening still leaves some uncertainty insufficiently explained. Such observations do not mean the revision failed. They show that you are considering communication as a set of connected decisions rather than looking for a perfect version.</p><p>A convincing account of a change acknowledges what the evidence supports, what the reader needs and where those considerations may pull in different directions.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c06--exposition-S5" data-section-id="S5" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Compare your explanations and explain your decisions</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Allow approximately 10 minutes to examine your initial and revised explanations alongside each other. This is an opportunity to understand your own communication decisions, not another formal assessment. You are not looking for a predetermined ideal answer or trying to prove that every revision was successful.</p><p>Begin by reading the two versions as a non-specialist reader might. Notice where the explanation of the principal finding, the numerical information or the qualifications have changed. You may also notice differences in sentence structure, terminology or emphasis. Select the changes that seem most significant for how the research is communicated; there is no need to catalogue every edit.</p><p>For each selected change, consider what you altered, why you made that decision and what effect it is likely to have on a reader. Connect your reasoning to the evidence and the audience. Does the change preserve the reported figures and the distinction between association and causation? Does it make the principal finding easier to understand? Does it communicate uncertainty in a proportionate way? A change may address more than one of these considerations.</p><p>Then consider the limits of your revision. You may identify a remaining weakness, a compromise between clarity and precision, or a decision you would approach differently in another context. You can acknowledge uncertainty about whether a change helped; the aim is to justify your judgement, not to claim an improvement that has not been established.</p><p>Finally, identify at least one principle from your comparison that you could use when explaining a different research finding. Think beyond the particular topic of study breaks and concentration. What have your decisions shown you about presenting evidence, choosing an emphasis, considering an audience or qualifying a conclusion?</p><p>Use the following guide to keep your reflection focused. You can think through the points or make brief notes for yourself. No particular format or submission is required.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material util-exposition-structured-fallback" data-material-id="XM-M02" data-material-kind="concise_reflection_guide" data-material-type="expository_structured_fallback" data-section-id="S5" data-expository-structured="fallback"><h3>Your reflection: what changed and why?</h3><div><p><strong>Time guidance</strong></p><p>Allow approximately 10 minutes for independent comparison and reflection.</p></div><div><p><strong>Orientation</strong></p><p>Use your initial and revised explanations to consider the decisions behind the changes. Focus on the differences that seem most consequential rather than every edit.</p></div><section><h4>Reflection prompts</h4><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Label</th><th scope="col">Prompt</th></tr></thead><tbody><tr><td>Notice the differences</td><td>Which changes most affect what a non-specialist reader would understand?</td></tr><tr><td>Explain your reasoning</td><td>Why did you make those changes, and what effect might each have on the reader?</td></tr><tr><td>Consider the evidence</td><td>How do the changes affect numerical accuracy, clarity, uncertainty or the strength of your claims?</td></tr><tr><td>Recognise trade-offs</td><td>What may have improved, and what weakness or compromise might remain?</td></tr><tr><td>Carry a principle forward</td><td>What is one principle you could apply when explaining a different research finding?</td></tr></tbody></table></div></section><p>There is no predetermined ideal reflection. You can think through these questions or make brief notes for yourself; no particular response format or submission is required.</p></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c06--exposition-S6" data-section-id="S6" data-expository-section-role="terminal-close" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">What can you carry into your next explanation?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation" data-expository-closure="terminal"><p>Explaining a research finding involves more than selecting accurate words. It requires decisions about what to foreground, how much context a reader needs and how strongly the evidence allows a conclusion to be expressed.</p><p>Comparing your own explanations makes those decisions easier to examine. You can distinguish a surface edit from a change that affects meaning, explain the reasons behind a revision and recognise when greater clarity, precision or caution involves a trade-off. You can also identify what remains uncertain without treating that uncertainty as a failure.</p><p>The principle you take forward need not prescribe the same wording or structure for every future explanation. Different findings and audiences may require different choices. What transfers is the ability to connect a communication decision to the evidence, the reader and the limits of the claim, and to justify why that decision is appropriate in context.</p></div></section></section></article></template><template id="lj-resource-journal"><article class="lj-shell-journal" data-lj-journal="true" role="region" aria-labelledby="lj-shell-journal-heading"><h2 id="lj-shell-journal-heading" class="lj-shell-journal__title" data-lj-resource-title="true" tabindex="-1">Your Learning Journal</h2><ol class="lj-shell-journal__entries"><li class="lj-shell-journal__entry" data-lj-journal-entry="initial_explanation" data-lj-journal-artefact="C02.E1" aria-labelledby="lj-journal-entry-initial-explanation-title"><h3 class="lj-shell-journal__entry-title" id="lj-journal-entry-initial-explanation-title">Your first explanation</h3><div class="lj-shell-journal__framing"><p>This is the explanation you produced before comparing examples or receiving detailed guidance. Revisit the communication decisions you made at the beginning of the journey. Consider what you chose to emphasise and how you represented the evidence, without assuming that every initial choice was necessarily wrong.</p></div><div class="lj-shell-journal__artefact lj-shell-journal__artefact--missing" data-lj-journal-artefact-status="missing"><p class="lj-shell-journal__artefact-missing">Your work for this entry is not available yet.</p></div></li><li class="lj-shell-journal__entry" data-lj-journal-entry="diagnostic_judgement" data-lj-journal-artefact="C04.E1" aria-labelledby="lj-journal-entry-diagnostic-judgement-title"><h3 class="lj-shell-journal__entry-title" id="lj-journal-entry-diagnostic-judgement-title">Your evaluation of your own work</h3><div class="lj-shell-journal__framing"><p>This records the strengths, weaknesses and improvement priorities you identified after comparing contrasting explanations. Revisit the reasons for your judgements and consider which aspects of quality you regarded as most consequential.</p></div><div class="lj-shell-journal__artefact lj-shell-journal__artefact--missing" data-lj-journal-artefact-status="missing"><p class="lj-shell-journal__artefact-missing">Your work for this entry is not available yet.</p></div></li><li class="lj-shell-journal__entry" data-lj-journal-entry="revised_explanation" data-lj-journal-artefact="C05.E1" aria-labelledby="lj-journal-entry-revised-explanation-title"><h3 class="lj-shell-journal__entry-title" id="lj-journal-entry-revised-explanation-title">Your revised explanation</h3><div class="lj-shell-journal__framing"><p>Compare this version with your initial explanation and diagnosis. Notice which decisions changed and consider whether those changes make the evidence clearer, more accurate or more appropriately qualified. The aim is to understand and explain development, not simply to assume that the later version must be better in every respect.</p></div><div class="lj-shell-journal__artefact lj-shell-journal__artefact--missing" data-lj-journal-artefact-status="missing"><p class="lj-shell-journal__artefact-missing">Your work for this entry is not available yet.</p></div></li></ol></article></template></div><script type="application/json" id="lj-shell-manifest">[{"commissionId":"overview","title":"Overview","kind":"overview","pageKey":"","productId":""},{"commissionId":"C01","title":"Interpret the research evidence","kind":"resource","pageKey":"v1::0ca423ea-a9af-460b-ad3e-25cf261b805f::learner-page::2.0.0::a1-a2-a3-a4::interpret-the-research-evidence","productId":"interactive"},{"commissionId":"C02","title":"Write your first explanation","kind":"resource","pageKey":"v1::d1ec2e21-af31-4a20-adb6-5e3cfb614dab::learner-page::2.0.0::no-activities::write-your-first-explanation","productId":"assessment_pack"},{"commissionId":"C03","title":"Compare explanations and judge their quali
