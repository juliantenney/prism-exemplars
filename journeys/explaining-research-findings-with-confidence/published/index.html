ctions</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c02--journey-assessment-briefing" aria-current="location">Briefing</a></li><li><a class="util-journey-all-link" href="#lj-c02--journey-assessment-judgement">Judgement</a></li><li><a class="util-journey-all-link" href="#lj-c02--journey-assessment-pack-forward">Take forward</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C02/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-assessment-intro" data-region="assessment-intro" data-journey-section="true"><p>In this activity, you will write your first independent explanation of a fictional research study for someone who has not seen the research account. Your aim is to communicate the principal finding in your own words. This is a formative starting point, not a graded assessment. You will return to your original explanation in later activities to examine your choices, revise your writing and reflect on what changed.</p><p>Allow approximately 12 minutes, including time to read the research account and write your explanation.

Read the complete fictional study provided with the writing task. You may refer to it while writing, but no external research or tools are needed.

Write independently for a non-specialist reader. Approximately 80–120 words is suggested as guidance, not a strict limit. Decide for yourself which evidence and context to include, how to communicate the numerical findings and how confidently to express your conclusions.

Keep your original explanation unchanged for later diagnosis, revision and reflection. You will not receive an automatic grade or detailed corrective feedback at this stage.</p></section><section class="util-assessment-guidance util-assessment-section" data-region="assessment" id="lj-c02--journey-assessment" data-journey-section="true" data-assessment-product="assessment_pack" data-feedback-timing="per_component"><section class="util-assessment-orientation" data-region="assessment-orientation" id="lj-c02--journey-assessment-briefing" data-journey-section="true"><h3>What to bring with you</h3><ul><li><p>If you completed &#39;Interpret the research evidence&#39;, revisit your own interpretation of the study&#39;s findings and the distinction you made between what the researchers observed and what might be inferred.</p><p>Use that earlier thinking to inform your first independent explanation for a non-specialist reader. You do not need an earlier written response; draw on your interpretation while making your own decisions about what evidence and context to communicate.</p></li></ul></section><article class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" id="lj-c02--elicitation-E1" data-elicitation-id="E1" data-journey-section="true"><h3>Write your first explanation</h3><section id="lj-c02--journey-assessment-judgement" class="util-assessment-stimulus" data-region="assessment-stimulus" data-stimulus-kind="prose" data-journey-section="true"><p>Study breaks and concentration among undergraduate students</p><p>This is a fictional, illustrative research study created for educational purposes. The findings are synthetic, not results from an actual investigation.</p><p>Research question: Is taking regular short breaks during independent study associated with students reporting good concentration?</p><p>Method: A university research team conducted an observational survey of 200 undergraduate students. Students reported their own study habits and concentration. Researchers divided respondents into two groups according to whether they reported taking regular short breaks during independent study. Students were not randomly assigned to take or avoid breaks.</p><p>Findings:<br>Regular short breaks: 100 students; 72 reporting good concentration; (72%).<br>No regular short breaks: 100 students; 58 reporting good concentration; (58%).</p><p>Observed difference: 72% minus 58% equals 14 percentage points. The proportion reporting good concentration was 14 percentage points higher among students reporting regular short breaks.</p><p>Methodological limitations: The survey was observational rather than a randomised experiment. Both study habits and concentration were self-reported. Students were not randomly assigned to groups. Potentially relevant factors such as sleep, motivation, workload and study environment were not controlled. The study does not establish whether reported concentration corresponds to objectively measured concentration or performance. The sample cannot automatically be assumed to represent all undergraduate students.</p><p>Evidence boundary: The study reports an association between reported study habits and reported concentration. It does not establish a causal effect. No statistical significance or confidence interval has been established, and the study does not identify an optimal frequency or duration of breaks.</p></section><p>Imagine you are explaining this illustrative study to someone who has not seen the research account and has no specialist knowledge of research methods.</p><p>Write your own short explanation of the study&#39;s principal finding for that reader. Use the research account provided above. Decide for yourself which evidence and context to include, how to communicate the numerical findings and how confidently to express your conclusions.</p><p>Write a concise explanation in your own words. This is your first independent attempt, so there is no model explanation to follow. Keep your original wording for use in &#39;Diagnose your explanation&#39;, &#39;Revise your explanation&#39; and &#39;Explain what changed and why&#39;.</p><p>Approximately 80–120 words, as a guide rather than a strict limit.</p><p>Allow approximately 12 minutes for the activity, including writing. No external research or tools are needed.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-E1" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c02--assessment-constructed-E1">Your response</label><p>Write your explanation here in your own words. You can refer to the research account while writing. The suggested word count is guidance only.</p><textarea class="util-learner-workspace__input" id="lj-c02--assessment-constructed-E1" name="assessment-constructed-E1" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="lj-c02--assessment-constructed-E1-review">Review your response</button></p><div id="lj-c02--assessment-constructed-E1-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="E1_completion_acknowledgement"><p>You have written your first explanation. This is a record of how you chose to communicate the study at this point in your learning. It has not been automatically marked or assessed for correctness.</p></article><article class="util-formative-material" data-material-id="E1_self_evaluation_orientation"><p>Keep your original explanation unchanged. When you return to it in &#39;Diagnose your explanation&#39;, you will be able to examine the decisions you made about what to include and how to communicate the findings. There is no need to evaluate or rewrite it now.</p></article><article class="util-formative-material" data-material-id="E1_original_response_reminder"><p>Keep a copy of your first explanation in your own words. You will use this original version in &#39;Diagnose your explanation&#39;, &#39;Revise your explanation&#39; and &#39;Explain what changed and why&#39; to consider how your explanation develops.</p></article></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Your first explanation is now a starting point for further learning. In &#39;Compare explanations and judge their quality&#39;, you can explore different ways of communicating the same research evidence. Keep your original explanation available so that, in &#39;Diagnose your explanation&#39;, you can examine your own communication choices before developing a revised version.</p></section></article><section class="util-pack-forward" data-region="pack-forward" id="lj-c02--journey-assessment-pack-forward" data-journey-section="true"><h2>What to take forward</h2><p>Keep a copy of &#39;My first explanation&#39; exactly as you originally wrote it. This first version provides a baseline for exploring explanation quality in &#39;Compare explanations and judge their quality&#39;, examining your choices in &#39;Diagnose your explanation&#39;, developing an improved version in &#39;Revise your explanation&#39;, and reflecting on the differences in &#39;Explain what changed and why&#39;. Your response has not been automatically graded or rewritten, and there is no requirement to revise it at this stage.</p></section><section class="util-assessment-output" data-assessment-output-region="true" data-assessment-output-mode="direct_copy" data-assessment-output-spec="{&quot;specification_id&quot;:&quot;initial-explanation&quot;,&quot;artefact_title&quot;:&quot;My first explanation&quot;,&quot;audience&quot;:&quot;You, for later revision and comparison&quot;,&quot;purpose&quot;:&quot;Retain your original explanation in your own words so that you can return to it during later diagnosis, revision and reflection. This artefact reproduces what you wrote; it does not generate a summary, correction or evaluation.&quot;,&quot;action_label&quot;:&quot;Keep a copy of my first explanation&quot;,&quot;missing_response_text&quot;:&quot;Not yet written.&quot;,&quot;sections&quot;:[{&quot;section_id&quot;:&quot;original-explanation&quot;,&quot;order&quot;:1,&quot;heading&quot;:&quot;My first explanation&quot;,&quot;contributions&quot;:[{&quot;contribution_id&quot;:&quot;initial-explanation-text&quot;,&quot;label&quot;:&quot;My original explanation&quot;,&quot;elicitation_id&quot;:&quot;E1&quot;,&quot;response_part&quot;:&quot;response_text&quot;}]}]}"><p class="util-assessment-output-purpose" data-assessment-output-purpose="true">Retain your original explanation in your own words so that you can return to it during later diagnosis, revision and reflection. This artefact reproduces what you wrote; it does not generate a summary, correction or evaluation.</p><p class="util-assessment-output-help" data-assessment-output-help="true" data-assessment-output-delivery="unified">A draft of your response is kept on this device when you save it in this Learning Journey. It can appear for reference in the Learning Journal and in later resources that need it. Those later activities do not paste it into their answer fields for you. You can also copy the wording if you want your own backup.</p><p><button type="button" class="util-assessment-check" data-assessment-output-copy="true">Keep a copy of my first explanation</button></p><p class="util-assessment-output-status" aria-live="polite" data-assessment-output-status></p></section></section></article></template><template id="lj-resource-C03"><article class="util-learner-page util-page util-learner-renderer-vnext" data-renderer="vnext" data-page-kind="interactive" data-persistence-page-key="v1::98742594-8881-4836-879b-2df087e2b704::learner-page::2.0.0::a1-a2-a3-a4::compare-explanations-and-judge-their-quality" data-persistence-storage-key="learner-renderer-vnext:draft:v1::98742594-8881-4836-879b-2df087e2b704::learner-page::2.0.0::a1-a2-a3-a4::compare-explanations-and-judge-their-quality" data-composition-mode="moments" data-composed-activity-count="4" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Compare explanations and judge their quality</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="6"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 6"><span class="util-journey-position__visible" aria-hidden="true">1 of 6</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c03--activity-A1" aria-label="Next section: Choose the stronger explanation"><span class="util-journey-adjacent__title">Choose the stronger explanation</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c03--journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#lj-c03--activity-A1">Choose the stronger explanation</a></li><li><a class="util-journey-all-link" href="#lj-c03--activity-A2">Test claims against the evidence</a></li><li><a class="util-journey-all-link" href="#lj-c03--activity-A3">Weigh six dimensions of quality</a></li><li><a class="util-journey-all-link" href="#lj-c03--activity-A4">Reconsider and transfer your judgement</a></li><li><a class="util-journey-all-link" href="#lj-c03--journey-study-tips">Study tips</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C03/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="lj-c03--journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This self-study resource explores how different explanations of the same research finding can vary in accuracy, clarity and usefulness. Begin by comparing candidate explanations of a fictional undergraduate survey and recording your judgements. You will then examine individual claims, apply a framework for evaluating explanation quality, and reconsider your reasoning in light of feedback.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The activities move from independent judgement to explicit guidance and reconsideration. Make and record your initial decisions before consulting the detailed feedback. Your comparisons will provide a basis for evaluating the quality of your own explanation in a later learning activity.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><p>Research explanations help readers understand what evidence shows and how far its implications extend. Two explanations can describe the same finding yet differ substantially in how effectively they communicate its meaning.</p><h3 class="util-md-heading util-md-heading--source-3">Evaluative judgement and comparison</h3><p><strong>Evaluative judgement</strong> is the ability to recognise and explain differences in quality. <strong>Comparative judgement</strong> develops this ability by asking you to examine alternatives, decide which better serves a purpose, and justify that decision using identifiable features of the work.</p><p>A useful comparison considers both explanations rather than assessing each in isolation. It identifies consequential differences, explains why those differences matter, and recognises strengths that may favour the alternative not selected.</p><p>There is not always one universally correct ranking. Two explanations may both represent the evidence faithfully while making different choices about detail, accessibility and emphasis. A defensible preference depends on the intended reader and communication purpose.</p><h3 class="util-md-heading util-md-heading--source-3">What counts as a good research explanation?</h3><p>Six connected dimensions provide a framework for judgement:</p><ul><li><strong>Numerical accuracy:</strong> Are quantities, comparisons and units represented correctly?</li><li><strong>Evidential support:</strong> Does the available research justify the claims being made?</li><li><strong>Clarity:</strong> Can the intended reader follow the explanation without unnecessary difficulty?</li><li><strong>Relevance:</strong> Does the explanation foreground the finding and information that matter for its purpose?</li><li><strong>Context and qualification:</strong> Does it provide the research information needed to interpret the finding responsibly?</li><li><strong>Proportionality:</strong> Is the strength of the conclusion appropriate to the strength of the evidence?</li></ul><p>These dimensions interact. An explanation can be numerically accurate but make an unsupported inference. Another may be thoroughly qualified yet make the principal finding difficult to identify. The task is to weigh these consequences rather than award an equal number of marks for each dimension.</p><h3 class="util-md-heading util-md-heading--source-3">Reading numerical comparisons</h3><p>Percentages describe proportions within groups. A <strong>percentage-point difference</strong> describes the arithmetic difference between two percentages. A <strong>relative percentage change</strong> uses one value as a reference point and answers a different question.</p><p>For example, if 40% of one group and 50% of another report an outcome, the difference is 10 percentage points. Relative to the first group&#39;s 40%, the second group&#39;s percentage is 25% higher. These are different numerical descriptions and should not be substituted for one another.</p><p>When evaluating an explanation, identify the group being described, the outcome being measured and the unit of comparison. Correct arithmetic matters, but so does the meaning attached to the numbers.</p><h3 class="util-md-heading util-md-heading--source-3">Association, causation and measurement</h3><p>An <strong>association</strong> means that two characteristics occur together in the observed evidence. A <strong>causal claim</strong> goes further: it states that one characteristic produces a change in another.</p><p>Observational studies can identify associations, but differences between observed groups do not by themselves establish what caused those differences. Other characteristics may influence the outcome, and the groups may differ in ways that have not been measured or controlled.</p><p>The type of measurement also matters. A person&#39;s report of their concentration is not the same as an objective concentration test or a measure of academic performance. An explanation should preserve the distinction between what researchers recorded and what a reader might be tempted to infer.</p><p><strong>Generalisability</strong> is a further consideration. Findings from a particular group of participants do not automatically establish what is true of a wider population. The evidence needed to support a broader claim depends on how the participants were selected and how well they represent that population.</p><h3 class="util-md-heading util-md-heading--source-3">Balancing accuracy and accessibility</h3><p>The intended audience influences how much detail an explanation needs. A non-specialist reader may benefit from a direct statement of the main comparison, followed by a concise qualification. A reader examining the research design may need fuller information about the methods and limitations.</p><p>These are legitimate communication choices only while the explanation preserves the numerical meaning and stays within the evidence. Brevity does not justify an unsupported conclusion, and additional detail does not automatically improve quality.</p><h3 class="util-md-heading util-md-heading--source-3">Building an evidence-grounded judgement</h3><p>A strong justification connects three elements: a <strong>specific feature</strong> of the explanation, the <strong>evidence or quality dimension</strong> relevant to that feature, and the <strong>consequence for the intended reader</strong>.</p><p>For example, identifying that an explanation uses a causal verb is only the beginning. The evaluation must consider whether the research design warrants that verb and what a reader might incorrectly conclude from it.</p><p>After making an initial judgement, feedback can help you reconsider the importance of particular features. Reconsideration does not require changing your preference. Retaining a choice with a stronger, more precise justification can demonstrate evaluative development just as clearly as revising it.</p><p>You will use these ideas to examine competing explanations and claims. The specific judgements remain yours to make from the supplied evidence.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C03/knowledge-summary-after-content.png" alt="Concept map connecting research evidence, six explanation-quality dimensions and comparative judgement; detailed description follows." aria-describedby="lj-c03--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> How evidence, six quality dimensions and reader consequences inform a justified comparison.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c03--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">The map connects research evidence to the evaluation of an explanation. Observed quantities, study design, measurement and limitations provide the evidential basis. Numerical accuracy concerns correct representation of quantities; evidential support concerns warranted claims; proportionality connects the strength of a conclusion to the strength of the evidence. Clarity and relevance concern accessibility and focus, while context and qualification support responsible interpretation. These six dimensions feed into comparative judgement, where specific wording is considered alongside its consequences for a reader. The map distinguishes evidential boundaries from legitimate choices about brevity, emphasis and detail.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Compare contrasting explanations of the illustrative survey and justify a preference by identifying specific strengths, weaknesses and consequences for a non-specialist reader. <span class="util-outcome-id">(LO1)</span></li><li>Evaluate whether candidate explanations represent the survey findings accurately and draw conclusions proportionate to the evidence, distinguishing the observed association from unsupported causal claims. <span class="util-outcome-id">(LO2)</span></li><li>Apply six dimensions of explanation quality to explain the relative merits of candidate explanations, including defensible trade-offs between clarity, relevance, contextual completeness and appropriate qualification. <span class="util-outcome-id">(LO3)</span></li><li>Reconsider an earlier comparative judgement in light of formative feedback and explain whether, and why, the original preference or justification should be retained or revised. <span class="util-outcome-id">(LO4)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="lj-c03--journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="lj-c03--activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Choose the stronger explanation</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your interpretation of the survey in &#39;Interpret the research evidence&#39; and your experience of writing an independent explanation provide a starting point for judging how effectively other explanations communicate the same findings. Comparing alternatives makes the consequences of different communication decisions visible.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have already encountered the fictional survey about study breaks and concentration. If you completed &#39;Write your first explanation&#39;, revisit your initial wording and the communication decisions you made. Keep that explanation available for later diagnosis and revision, but do not change it yet. In this activity, you will compare explanations written by others. Decide which better serves a non-specialist reader and explain your reasoning before receiving detailed guidance.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Judge what each explanation enables a reader to conclude and whether that conclusion is warranted. Consider the significance of the differences between candidates rather than relying on which one initially sounds more convincing.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which feature of the explanations most influenced your preference, and what difference would it make to a reader&#39;s interpretation?</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c03--learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="lj-c03--learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="lj-c03--learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c03--learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c03--learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="lj-c03--learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c03--learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Read each pair of candidate explanations alongside the fictional survey evidence.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A1-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Fictional survey: Study breaks and concentration among undergraduate students</span></p><h3 class="util-md-heading util-md-heading--source-2">Study breaks and concentration among undergraduate students</h3><p><strong>Fictional, synthetic educational evidence.</strong> This illustrative survey is not a report of an authentic investigation.</p><p>An observational survey involved 200 undergraduate students. Students were grouped according to whether they reported taking regular short breaks during independent study. They also reported whether they experienced good concentration.</p><table><thead><tr><th>Reported study-break pattern</th><th>Students in group</th><th>Students reporting good concentration</th><th>Percentage reporting good concentration</th></tr></thead><tbody><tr><td>Regular short breaks</td><td>100</td><td>72</td><td>72%</td></tr><tr><td>No regular short breaks</td><td>100</td><td>58</td><td>58%</td></tr></tbody></table><p>The observed difference between the group percentages was <strong>14 percentage points</strong>.</p><h3 class="util-md-heading util-md-heading--source-3">Research information</h3><ul><li>The study was <strong>observational</strong>: students were not randomly assigned to take or avoid breaks.</li><li>Both study-break habits and concentration were <strong>self-reported</strong>.</li><li>Sleep, motivation, workload and study environment were not controlled.</li><li>Concentration was not objectively measured, and academic performance was not established by these findings.</li><li>The survey does not establish whether its participants represent undergraduate students more generally.</li></ul><p>Use this evidence when comparing the candidate explanations. Treat the explanations as statements to evaluate, not as additional research findings.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>For each pair, select the explanation you consider more effective for a non-specialist reader.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a1-a1-m3" data-material-source-id="A1-M3" data-activity-id="A1"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A1-M3" data-material-type="comparison_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Record your comparative judgements</span></p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="lj-c03--a1-a1-m3-col-pair-0">Pair</th><th scope="col" id="lj-c03--a1-a1-m3-col-preferred-candidate-1">Preferred candidate</th><th scope="col" id="lj-c03--a1-a1-m3-col-strength-of-preferred-candidate-2">Strength of preferred candidate</th><th scope="col" id="lj-c03--a1-a1-m3-col-limitation-or-competing-strength-of-alternative-3">Limitation or competing strength of alternative</th><th scope="col" id="lj-c03--a1-a1-m3-col-evidence-or-wording-supporting-the-decision-4">Evidence or wording supporting the decision</th><th scope="col" id="lj-c03--a1-a1-m3-col-consequence-for-a-non-specialist-reader-5">Consequence for a non-specialist reader</th></tr></thead><tbody><tr><th scope="row" id="lj-c03--a1-a1-m3-row-0" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Pair 1</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c03--a1-a1-m3-input-r0-c1" name="a1-a1-m3-input-r0-c1" data-learner-cell="a1-a1-m3-input-r0-c1" rows="3" aria-labelledby="lj-c03--a1-a1-m3-row-0 lj-c03--a1-a1-m3-col-preferred-candidate-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c03--a1-a1-m3-input-r0-c2" name="a1-a1-m3-input-r0-c2" data-learner-cell="a1-a1-m3-input-r0-c2" rows="3" aria-labelledby="lj-c03--a1-a1-m3-row-0 lj-c03--a1-a1-m3-col-strength-of-preferred-candidate-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c03--a1-a1-m3-input-r0-c3" name="a1-a1-m3-input-r0-c3" data-learner-cell="a1-a1-m3-input-r0-c3" rows="3" aria-labelledby="lj-c03--a1-a1-m3-row-0 lj-c03--a1-a1-m3-col-limitation-or-competing-strength-of-alternative-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c03--a1-a1-m3-input-r0-c4" name="a1-a1-m3-input-r0-c4" data-learner-cell="a1-a1-m3-input-r0-c4" rows="3" aria-labelledby="lj-c03--a1-a1-m3-row-0 lj-c03--a1-a1-m3-col-evidence-or-wording-supporting-the-decision-4" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c03--a1-a1-m3-input-r0-c5" name="a1-a1-m3-input-r0-c5" data-learner-cell="a1-a1-m3-input-r0-c5" rows="3" aria-labelledby="lj-c03--a1-a1-m3-row-0 lj-c03--a1-a1-m3-col-consequence-for-a-non-specialist-reader-5" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="lj-c03--a1-a1-m3-row-1" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Pair 2</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c03--a1-a1-m3-input-r1-c1" name="a1-a1-m3-input-r1-c1" data-learner-cell="a1-a1-m3-input-r1-c1" rows="3" aria-labelledby="lj-c03--a1-a1-m3-row-1 lj-c03--a1-a1-m3-col-preferred-candidate-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c03--a1-a1-m3-input-r1-c2" name="a1-a1-m3-input-r1-c2" data-learner-cell="a1-a1-m3-input-r1-c2" rows="3" aria-labelledby="lj-c03--a1-a1-m3-row-1 lj-c03--a1-a1-m3-col-strength-of-preferred-candidate-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c03--a1-a1-m3-input-r1-c3" name="a1-a1-m3-input-r1-c3" data-learner-cell="a1-a1-m3-input-r1-c3" rows="3" aria-labelledby="lj-c03--a1-a1-m3-row-1 lj-c03--a1-a1-m3-col-limitation-or-competing-strength-of-alternative-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c03--a1-a1-m3-input-r1-c4" name="a1-a1-m3-input-r1-c4" data-learner-cell="a1-a1-m3-input-r1-c4" rows="3" aria-labelledby="lj-c03--a1-a1-m3-row-1 lj-c03--a1-a1-m3-col-evidence-or-wording-supporting-the-decision-4" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c03--a1-a1-m3-input-r1-c5" name="a1-a1-m3-input-r1-c5" data-learner-cell="a1-a1-m3-input-r1-c5" rows="3" aria-labelledby="lj-c03--a1-a1-m3-row-1 lj-c03--a1-a1-m3-col-consequence-for-a-non-specialist-reader-5" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="lj-c03--a1-a1-m3-row-2" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Pair 3</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c03--a1-a1-m3-input-r2-c1" name="a1-a1-m3-input-r2-c1" data-learner-cell="a1-a1-m3-input-r2-c1" rows="3" aria-labelledby="lj-c03--a1-a1-m3-row-2 lj-c03--a1-a1-m3-col-preferred-candidate-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c03--a1-a1-m3-input-r2-c2" name="a1-a1-m3-input-r2-c2" data-learner-cell="a1-a1-m3-input-r2-c2" rows="3" aria-labelledby="lj-c03--a1-a1-m3-row-2 lj-c03--a1-a1-m3-col-strength-of-preferred-candidate-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c03--a1-a1-m3-input-r2-c3" name="a1-a1-m3-input-r2-c3" data-learner-cell="a1-a1-m3-input-r2-c3" rows="3" aria-labelledby="lj-c03--a1-a1-m3-row-2 lj-c03--a1-a1-m3-col-limitation-or-competing-strength-of-alternative-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c03--a1-a1-m3-input-r2-c4" name="a1-a1-m3-input-r2-c4" data-learner-cell="a1-a1-m3-input-r2-c4" rows="3" aria-labelledby="lj-c03--a1-a1-m3-row-2 lj-c03--a1-a1-m3-col-evidence-or-wording-supporting-the-decision-4" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c03--a1-a1-m3-input-r2-c5" name="a1-a1-m3-input-r2-c5" data-learner-cell="a1-a1-m3-input-r2-c5" rows="3" aria-labelledby="lj-c03--a1-a1-m3-row-2 lj-c03--a1-a1-m3-col-consequence-for-a-non-specialist-reader-5" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify a specific strength and weakness in the alternatives, referring to their wording and the underlying evidence.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A1-M2" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Three pairs of candidate explanations</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><p><strong>Simulated candidate explanations for evaluation.</strong> These are deliberately contrasting pieces of writing about the fictional survey. They are not authoritative statements of its findings. Some contain wording that may mislead readers.</p><p>Read both candidates in each pair. Decide which you would prefer for a non-specialist reader and record your reasoning in the comparison table. Make your judgements before consulting the detailed feedback.</p><h3 class="util-md-heading util-md-heading--source-3">Pair 1</h3><p><strong>Candidate explanation 1A</strong></p><p>&gt; In a survey of 200 undergraduate students, 72% of those reporting regular short study breaks also reported good concentration, compared with 58% of those without regular breaks. That is a difference of 14 percentage points. Because students reported their own habits and concentration, the figures describe an association rather than showing that breaks caused better concentration.</p><p><strong>Candidate explanation 1B</strong></p><p>&gt; Taking regular short breaks improves students&#39; concentration by 14%. In the survey, 72% of students who took regular breaks reported good concentration, compared with 58% of students who did not. These results show that introducing regular breaks will improve concentration for undergraduates, making breaks an effective way to increase their ability to focus while studying.</p><h3 class="util-md-heading util-md-heading--source-3">Pair 2</h3><p><strong>Candidate explanation 2A</strong></p><p>&gt; Students who reported taking regular short breaks were more likely to report good concentration than students who did not: 72% compared with 58%. The difference is 14 percentage points. The survey suggests a connection between study-break habits and how students describe their concentration, but it does not show whether breaks themselves make the difference.</p><p><strong>Candidate explanation 2B</strong></p><p>&gt; Among 200 undergraduates surveyed, 72 of the 100 who reported regular short breaks also reported good concentration, compared with 58 of the 100 who reported no regular short breaks. This 14-percentage-point difference is an observed association. Because the survey was observational and self-reported, and factors such as sleep, motivation, workload and study environment were uncontrolled, the findings cannot establish that breaks caused the difference.</p><h3 class="util-md-heading util-md-heading--source-3">Pair 3</h3><p><strong>Candidate explanation 3A</strong></p><p>&gt; The clearest finding is a difference in students&#39; reports: 72% of those who regularly took short study breaks reported good concentration, compared with 58% of those who did not. The 14-percentage-point gap describes an association, not proof that breaks improve concentration. It is a useful comparison, provided readers understand that the responses were self-reported.</p><p><strong>Candidate explanation 3B</strong></p><p>&gt; This fictional survey compared two groups of 100 undergraduates. Good concentration was reported by 72 students in the regular-break group and 58 in the no-regular-break group, a difference of 14 percentage points. The groups were not randomly assigned, and other influences were uncontrolled. The result concerns reported concentration among these participants; it does not establish a causal effect or a finding about academic performance.</p><p>For each pair, identify a consequential difference in the wording, acknowledge a strength or limitation of the alternative, and explain what matters most for the intended reader.</p></article></li></ol></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain why the differences matter for the reader and justify your preference.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Record any uncertainty or competing strength that makes the decision difficult. Complete your judgements before viewing fuller feedback or detailed quality guidance.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A completed comparison record containing a clear preference for each pair, evidence-grounded reasons for the choice, identifiable strengths and weaknesses of the alternatives, and an explanation of the consequences for a non-specialist reader. Where both candidates have defensible strengths, the justification should explain the trade-off rather than assume one universally correct wording.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-task-step-step-3-3" data-response-part-id="A1-task-step-step-3-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c03--learner-workspace-a1-a1-task-step-step-3-3-label" for="lj-c03--learner-workspace-a1-a1-task-step-step-3-3">Your response</label><p class="util-learner-workspace__prompt" id="lj-c03--learner-workspace-a1-a1-task-step-step-3-3-desc">Identify a specific strength and weakness in the alternatives, referring to their wording and the underlying evidence.</p><textarea class="util-learner-workspace__input" id="lj-c03--learner-workspace-a1-a1-task-step-step-3-3" name="learner-workspace-a1-a1-task-step-step-3-3" rows="6" aria-describedby="lj-c03--learner-workspace-a1-a1-task-step-step-3-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-task-step-step-4-4" data-response-part-id="A1-task-step-step-4-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c03--learner-workspace-a1-a1-task-step-step-4-4-label" for="lj-c03--learner-workspace-a1-a1-task-step-step-4-4">Your response</label><p class="util-learner-workspace__prompt" id="lj-c03--learner-workspace-a1-a1-task-step-step-4-4-desc">Explain why the differences matter for the reader and justify your preference.</p><textarea class="util-learner-workspace__input" id="lj-c03--learner-workspace-a1-a1-task-step-step-4-4" name="learner-workspace-a1-a1-task-step-step-4-4" rows="6" aria-describedby="lj-c03--learner-workspace-a1-a1-task-step-step-4-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-task-step-step-5-5" data-response-part-id="A1-task-step-step-5-5"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c03--learner-workspace-a1-a1-task-step-step-5-5-label" for="lj-c03--learner-workspace-a1-a1-task-step-step-5-5">Your response</label><p class="util-learner-workspace__prompt" id="lj-c03--learner-workspace-a1-a1-task-step-step-5-5-desc">Record any uncertainty or competing strength that makes the decision difficult. Complete your judgements before viewing fuller feedback or detailed quality guidance.</p><textarea class="util-learner-workspace__input" id="lj-c03--learner-workspace-a1-a1-task-step-step-5-5" name="learner-workspace-a1-a1-task-step-step-5-5" rows="6" aria-describedby="lj-c03--learner-workspace-a1-a1-task-step-step-5-5-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c03--learner-check-a1" data-check-sidebar-open aria-controls="lj-c03--learner-check-a1" aria-expanded="false" aria-label="Check your work: Choose the stronger explanation">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c03--learner-check-a1" data-composition-moment="check" data-activity-id="A1" data-check-sidebar="available" aria-labelledby="lj-c03--learner-check-a1-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c03--learner-check-a1-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c03--learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c03--learner-task-a1">Back to your task (Choose the stronger explanation)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m4-c-0" data-revision-criterion-id="a1-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you made an explicit comparative judgement for each pair?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without a stated preference and comparative reasoning, a reader cannot tell how you weighed the alternatives.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each pair has an identifiable preferred candidate.</li><li><span class="util-guided-review__feature-key">B.</span> The preference is supported by a difference between the two candidates.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the candidate you favour in the relevant row before explaining your reasons.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify one contrasting feature of their actual wording and explain why it influenced your choice.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c03--checklist-a1-a1-m4-item-0" data-checklist-item-id="checklist-a1-a1-m4-item-0"><label class="util-interactive-checklist__label" for="lj-c03--checklist-a1-a1-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c03--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m4-c-1" data-revision-criterion-id="a1-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you supported your judgements with inspectable wording or survey evidence?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A preference based only on tone or confidence may overlook whether the explanation represents the research faithfully.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your justification identifies a specific phrase, figure or claim from the candidates.</li><li><span class="util-guided-review__feature-key">B.</span> Relevant numerical or methodological claims are checked against the survey.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Quote or identify the precise wording that affected your judgement instead of describing an explanation as simply good or clear.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect the disputed wording to the reported group values, outcome definition or observational design.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c03--checklist-a1-a1-m4-item-1" data-checklist-item-id="checklist-a1-a1-m4-item-1"><label class="util-interactive-checklist__label" for="lj-c03--checklist-a1-a1-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c03--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m4-c-2" data-revision-criterion-id="a1-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you recognised meaningful strengths and weaknesses in both alternatives?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Comparative judgement becomes superficial when it ignores genuine advantages of the explanation not selected.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your response identifies a substantive strength of the preferred candidate.</li><li><span class="util-guided-review__feature-key">B.</span> Your response acknowledges a limitation or competing strength of the alternative.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Specify whether its advantage concerns the reported finding, the strength of the claim, accessibility or necessary context.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify something the alternative communicates effectively, or a particular weakness that matters, rather than dismissing it wholesale.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c03--checklist-a1-a1-m4-item-2" data-checklist-item-id="checklist-a1-a1-m4-item-2"><label class="util-interactive-checklist__label" for="lj-c03--checklist-a1-a1-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c03--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m4-c-3" data-revision-criterion-id="a1-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you explained why your comparison matters for a non-specialist reader?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The purpose of the explanation is to support a warranted interpretation, not merely to satisfy a stylistic preference.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your justification describes a likely reader interpretation.</li><li><span class="util-guided-review__feature-key">B.</span> Your judgement connects that consequence to the purpose of explaining research evidence.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Explain what a reader might understand or mistakenly conclude from the feature you identified.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Show how the wording affects the reader&#39;s ability to understand the observed difference without overstating its implications.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c03--checklist-a1-a1-m4-item-3" data-checklist-item-id="checklist-a1-a1-m4-item-3"><label class="util-interactive-checklist__label" for="lj-c03--checklist-a1-a1-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c03--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c03--activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Test claims against the evidence</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your initial comparisons required you to weigh competing explanations. This activity concentrates on the evidential boundaries underlying those judgements, distinguishing weaknesses that change the meaning of the research from differences that are primarily matters of communication.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>A convincing explanation is not necessarily an accurate one. Examine how particular claims represent the survey&#39;s numerical findings and what they imply about the relationship between study breaks and concentration. Use the evidence to identify consequential differences without relying on a preferred answer being supplied.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Separate what the survey directly reports from what a candidate explanation infers. Check numerical language, the measured outcome and the methodological basis for each conclusion.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">What specific part of the evidence supports or limits the claim, and how would changing the wording affect its meaning?</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c03--learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="lj-c03--learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="lj-c03--learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c03--learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c03--learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="lj-c03--learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c03--learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the supplied candidate claims and the survey evidence.</p></span></div><article class="util-material-block util-material-table-block" data-material-id="A2-M1" data-material-type="data_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Survey evidence for checking claims</span></p><p><strong>Fictional, synthetic survey evidence for educational use.</strong> The following values are illustrative, not findings from an authentic study.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Survey group</th><th>Number of students</th><th>Number reporting good concentration</th><th>Percentage reporting good concentration</th></tr></thead><tbody><tr><td>Reported regular short study breaks</td><td>100</td><td>72</td><td>72%</td></tr><tr><td>Reported no regular short study breaks</td><td>100</td><td>58</td><td>58%</td></tr><tr><td><strong>Observed difference</strong></td><td>—</td><td><strong>14 students between equally sized groups</strong></td><td><strong>14 percentage points</strong></td></tr></tbody></table></div><p><strong>Study design and scope</strong></p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Feature</th><th>Recorded information</th></tr></thead><tbody><tr><td>Study type</td><td>Observational survey of 200 undergraduate students</td></tr><tr><td>Group assignment</td><td>No random assignment</td></tr><tr><td>Break-taking measure</td><td>Student self-report</td></tr><tr><td>Concentration measure</td><td>Student self-report of good concentration</td></tr><tr><td>Uncontrolled factors</td><td>Sleep, motivation, workload and study environment</td></tr><tr><td>Objective concentration or academic performance</td><td>Not established by the survey</td></tr><tr><td>Representativeness</td><td>Not established for undergraduates more generally</td></tr></tbody></table></div><p>Use the table to examine the wording and implications of each candidate claim. The table supplies evidence, not judgements about those claims.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measur
