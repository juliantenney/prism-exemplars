button" class="lj-shell__toc-link" data-lj-nav-id="C01">Interpret the research evidence</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="C02">Write your first explanation</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="C03">Compare explanations and judge their quality</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="C04">Diagnose your explanation</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="C05">Revise your explanation</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="C06">Explain what changed and why</button></li></ol></nav><p class="lj-shell__toc-label lj-shell__toc-label--journal" id="lj-shell-journal-label">Learning Journal</p><nav aria-labelledby="lj-shell-journal-label"><ol class="lj-shell__toc lj-shell__toc--journal"><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="journal" data-lj-journal-nav="true" data-lj-journal-title="Your Learning Journal" aria-label="Your Learning Journal"><span class="lj-shell__toc-link-text">Your Learning Journal</span><span class="lj-shell__toc-link-count" data-lj-journal-count hidden></span></button></li></ol></nav></div></div></aside><div class="lj-shell__workspace"><div id="lj-shell-live" class="lj-shell__live" aria-live="polite" aria-atomic="true"></div><main id="lj-shell-main" class="lj-shell__main" data-lj-role="active-resource" aria-label="Learning content" tabindex="-1"></main></div></div><div class="lj-shell__templates" hidden aria-hidden="true"><template id="lj-resource-overview"><article class="lj-shell-overview" data-lj-overview="true" role="region" aria-labelledby="lj-shell-overview-heading"><h2 id="lj-shell-overview-heading" class="lj-shell-overview__title" data-lj-resource-title="true" tabindex="-1">Overview</h2><div class="util-editorial-opening" data-region="editorial-opening"><figure class="util-visual-asset util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-figure-number="1"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/editorial-opening.png" alt="" loading="lazy" decoding="async" /></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> An undergraduate student considering research evidence before writing an explanation.</figcaption></figure></div><div class="lj-shell-overview__body"><p>Research findings often sound straightforward until you try to explain what they really mean. A percentage may be easy to repeat, but harder to interpret. A confident explanation may be persuasive without being justified by the evidence.</p><p>In this learning journey, you will work with a fictional research study about study breaks and concentration among undergraduate students. You will interpret the evidence, write your own explanation for a non-specialist reader, compare contrasting explanations and improve your original work.</p><p>The emphasis is not on finding one perfect answer. You will develop your ability to recognise quality, make informed communication decisions and explain why some ways of presenting research are more effective than others.</p><p>The journey takes approximately <strong>90 minutes of learning time across one week</strong>. You can complete it in more than one sitting. Keep your written responses because later experiences ask you to return to your earlier work.</p><p>You will begin by interpreting the study and producing an independent explanation. Only after that will you encounter worked examples and more detailed guidance. You will then use what you have learned to diagnose and revise your explanation, before reflecting on the reasoning behind your changes.</p><p>You do not need specialist statistical knowledge or external research materials. Everything required to understand the illustrative study is supplied within the journey.</p></div></article></template><template id="lj-resource-C01"><article class="util-learner-page util-page util-learner-renderer-vnext" data-renderer="vnext" data-page-kind="interactive" data-persistence-page-key="v1::0ca423ea-a9af-460b-ad3e-25cf261b805f::learner-page::2.0.0::a1-a2-a3-a4::interpret-the-research-evidence" data-persistence-storage-key="learner-renderer-vnext:draft:v1::0ca423ea-a9af-460b-ad3e-25cf261b805f::learner-page::2.0.0::a1-a2-a3-a4::interpret-the-research-evidence" data-composition-mode="moments" data-composed-activity-count="4" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">Interpret the research evidence</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="5"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 5"><span class="util-journey-position__visible" aria-hidden="true">1 of 5</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c01--activity-A1" aria-label="Next section: Investigate the study design"><span class="util-journey-adjacent__title">Investigate the study design</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c01--journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#lj-c01--activity-A1">Investigate the study design</a></li><li><a class="util-journey-all-link" href="#lj-c01--activity-A2">Compare the reported results</a></li><li><a class="util-journey-all-link" href="#lj-c01--activity-A3">Test the limits of inference</a></li><li><a class="util-journey-all-link" href="#lj-c01--activity-A4">Prepare your independent interpretation</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C01/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="lj-c01--journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This short self-study resource introduces a fictional investigation into undergraduate study breaks and concentration. You will work with the complete research account, examine the reported figures and consider how confidently different claims can be made from the evidence.</p><p>Begin with &#39;Investigate the study design&#39; and work through the four activities in order. Record your own responses before using the review checklists. You can return to the research account whenever you need to check a detail.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The activities build from identifying research evidence to comparing reported results, judging the limits of interpretation and preparing for independent communication. Your completed workspaces provide a foundation for &#39;Write your first explanation&#39;, where you will explain the principal finding in your own words before comparing explanations.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><h3 class="util-md-heading util-md-heading--source-3">Reading a research account</h3><p>A research question identifies what investigators want to find out. To understand the evidence collected in response, distinguish the participants, the research design, the information recorded and the outcome being examined. These features are related but answer different questions: who was studied, how the study was conducted, what was reported and what can reasonably be inferred.</p><h3 class="util-md-heading util-md-heading--source-3">Observational surveys and self-reports</h3><p>An observational survey collects information about participants&#39; existing characteristics, behaviours or experiences. Researchers may compare groups defined by those reports without assigning people to different conditions. This differs from an experiment in which researchers deliberately introduce or assign conditions.</p><p>Self-reported data describe what participants say about their experiences or behaviour. They can provide useful evidence about reported experiences, but they should not automatically be treated as equivalent to independent measurement. A survey about perceived concentration, for example, does not by itself measure academic performance.</p><h3 class="util-md-heading util-md-heading--source-3">Comparing numerical evidence</h3><p>A count tells you how many participants reported an outcome. A percentage expresses a proportion out of 100 and allows comparisons between groups, including groups of different sizes.</p><p>When comparing two percentages by subtraction, the result is expressed in percentage points. For example, if 40% of one group and 30% of another report a characteristic, the difference is 10 percentage points. This is distinct from a relative percentage change.</p><p>Keep each count or percentage connected to its group and to the outcome actually recorded. A numerical difference describes a comparison; the arithmetic alone does not establish why the difference occurred.</p><h3 class="util-md-heading util-md-heading--source-3">Observations, interpretations and explanations</h3><p>An observation is information recorded in a study, such as a participant response, count or percentage. An inference is an interpretation made using observations. The wording of an inference should reflect how strongly the research design and evidence support it.</p><p>An association means that two recorded characteristics occur together in a pattern. Causation is a stronger claim: one factor produces a change in another. An observational comparison can provide evidence of a relationship without establishing that one characteristic caused the other.</p><h3 class="util-md-heading util-md-heading--source-3">Evaluating the limits of evidence</h3><p>When judging a claim, consider whether participants were randomly assigned, whether potentially relevant alternative factors were controlled, how the outcome was measured and which population the participants represent. These questions help establish the boundaries of an interpretation rather than automatically making the recorded observations worthless.</p><p>Do not assume that an observed difference is statistically significant, that a causal effect has been demonstrated or that a result applies to everyone unless the supplied research evidence establishes those claims. The appropriate conclusion depends on the particular design, measurements and information available.</p><p>Use these distinctions as tools for examining the fictional study. The activities will ask you to make the case-specific comparisons and judgements yourself.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C01/knowledge-summary-after-content.png" alt="Concept map connecting observational survey evidence with interpretation limits; detailed description follows." aria-describedby="lj-c01--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> How research design, observations and limitations shape the claims that evidence can support.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c01--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">The map begins with a research question and connects it to participants, comparison groups and an observational survey. The survey produces self-reported observations that can be expressed as counts and percentages and compared between groups. A separate branch distinguishes a possible association from the stronger claim of causation. Four considerations—random assignment, uncontrolled factors, measurement and representativeness—connect to the interpretation stage because they affect which claims the evidence can support. No study-specific results or completed conclusions are displayed.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Identify the research question, observational method, participants, comparison groups and self-reported outcome in the fictional study. <span class="util-outcome-id">(LO1)</span></li><li>Compare the reported concentration outcomes of the two groups and calculate the difference between their percentages using the correct numerical unit. <span class="util-outcome-id">(LO2)</span></li><li>Distinguish observations supported by the study from interpretations that would require additional evidence, using the research design and methodological limitations to justify the distinction. <span class="util-outcome-id">(LO3)</span></li><li>Identify the evidence and remaining uncertainties they will need to consider when independently communicating the study&#39;s principal finding to a non-specialist audience. <span class="util-outcome-id">(LO4)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="lj-c01--journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="lj-c01--activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Investigate the study design</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The purpose of this learning experience is to establish what the research evidence can support before attempting to explain it. Identifying the research question, participants, method and outcome provides the foundation for interpreting the numerical comparison and considering its limitations.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You are investigating a fictional study called &#39;Study breaks and concentration among undergraduate students&#39;. Its findings were created for educational purposes and do not come from an actual investigation. Begin by examining what the researchers wanted to find out, who participated and how information was collected. You will use this evidence later in &#39;Write your first explanation&#39;, where you will communicate the main finding independently.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Begin with what the research account explicitly states. Distinguish the question being investigated, the way information was collected and the characteristics used to form the comparison groups.</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A1"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Read the complete fictional research account, including its method, findings and limitations.</p></span></div></div><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A1-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Understanding the research terminology</span></p><h3 class="util-md-heading util-md-heading--source-3">Research question</h3><p>A research question identifies what investigators want to find out. It guides which information they collect and compare.</p><h3 class="util-md-heading util-md-heading--source-3">Observational survey</h3><p>In an observational survey, researchers collect information about people&#39;s existing experiences, characteristics or behaviours. They do not necessarily change what participants do. This differs from an experiment in which researchers deliberately assign conditions or interventions.</p><h3 class="util-md-heading util-md-heading--source-3">Participant</h3><p>A participant is a person whose information contributes to a study. The number of participants tells you how many people supplied data, not necessarily how widely the findings apply.</p><h3 class="util-md-heading util-md-heading--source-3">Comparison group</h3><p>A comparison group is a set of participants considered alongside another set. Groups may differ in a characteristic that researchers want to investigate.</p><h3 class="util-md-heading util-md-heading--source-3">Self-reported data</h3><p>Self-reported data come from what participants say about their own experiences or behaviours. Such reports can be useful, but they are not identical to independent observation or objective measurement.</p><p>As you read the research account, distinguish the actions taken by researchers from the information reported by participants.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c01--learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="lj-c01--learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="lj-c01--learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c01--learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c01--learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="lj-c01--learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c01--learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify the research question, total participants, two comparison groups, observational method and reported outcome.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A1-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Research account: Study breaks and concentration among undergraduate students</span></p><h3 class="util-md-heading util-md-heading--source-2">Study breaks and concentration among undergraduate students</h3><p>This is a fictional, illustrative research study created for learning purposes. The figures are not findings from an actual investigation.</p><h3 class="util-md-heading util-md-heading--source-3">Research question</h3><p>Is there a relationship between taking regular short study breaks and reporting good concentration among undergraduate students?</p><h3 class="util-md-heading util-md-heading--source-3">Method</h3><p>Researchers conducted an observational survey of 200 undergraduate students. Students reported their study habits, including whether they took regular short breaks, and whether they experienced good concentration while studying.</p><p>The researchers compared two groups formed from students&#39; reported break-taking habits:</p><ul><li>Group A: 100 students who reported taking regular short study breaks.</li><li>Group B: 100 students who reported not taking regular short study breaks.</li></ul><p>Students were not randomly assigned to take breaks or avoid breaks. The researchers recorded existing reports rather than introducing an experimental intervention.</p><h3 class="util-md-heading util-md-heading--source-3">Reported findings</h3><table><thead><tr><th>Group</th><th>Reported break-taking</th><th>Students in group</th><th>Students reporting good concentration</th><th>Percentage reporting good concentration</th></tr></thead><tbody><tr><td>A</td><td>Regular short breaks</td><td>100</td><td>72</td><td>72%</td></tr><tr><td>B</td><td>No regular short breaks</td><td>100</td><td>58</td><td>58%</td></tr></tbody></table><p>The observed difference between the reported percentages was 14 percentage points.</p><h3 class="util-md-heading util-md-heading--source-3">Methodological limitations</h3><ul><li>The study was observational rather than randomised. There was no random assignment to break-taking conditions.</li><li>Study habits and concentration were self-reported.</li><li>Other potentially relevant factors, including sleep, motivation, workload and study environment, were not controlled.</li><li>The study did not establish whether students&#39; reports of concentration corresponded to objectively measured concentration or academic performance.</li><li>The 200 participants cannot automatically be assumed to represent all undergraduate students.</li><li>The information supplied does not establish statistical significance, confidence intervals or a causal effect.</li><li>The study does not establish an optimal frequency or duration for study breaks.</li></ul><p>Keep this research account available as your reference throughout the activities. Your task is to work from the reported information rather than assume additional measurements or procedures.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Record these features in the evidence-identification workspace, distinguishing what students reported from what the researchers did.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a1-a1-m3" data-material-source-id="A1-M3" data-activity-id="A1"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A1-M3" data-material-type="analysis_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Evidence-identification workspace</span></p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="lj-c01--a1-a1-m3-col-study-feature-0">Study feature</th><th scope="col" id="lj-c01--a1-a1-m3-col-evidence-from-the-research-account-1">Evidence from the research account</th><th scope="col" id="lj-c01--a1-a1-m3-col-what-this-describes-2">What this describes</th></tr></thead><tbody><tr><th scope="row" id="lj-c01--a1-a1-m3-row-0" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Research question</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c01--a1-a1-m3-input-r0-c1" name="a1-a1-m3-input-r0-c1" data-learner-cell="a1-a1-m3-input-r0-c1" rows="3" aria-labelledby="lj-c01--a1-a1-m3-row-0 lj-c01--a1-a1-m3-col-evidence-from-the-research-account-1" autocomplete input-r2-c1" rows="3" aria-labelledby="lj-c01--a1-a1-m3-row-2 lj-c01--a1-a1-m3-col-evidence-from-the-research-account-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c01--a1-a1-m3-input-r2-c2" name="a1-a1-m3-input-r2-c2" data-learner-cell="a1-a1-m3-input-r2-c2" rows="3" aria-labelledby="lj-c01--a1-a1-m3-row-2 lj-c01--a1-a1-m3-col-what-this-describes-2" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="lj-c01--a1-a1-m3-row-3" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Research method</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c01--a1-a1-m3-input-r3-c1" name="a1-a1-m3-input-r3-c1" data-learner-cell="a1-a1-m3-input-r3-c1" rows="3" aria-labelledby="lj-c01--a1-a1-m3-row-3 lj-c01--a1-a1-m3-col-evidence-from-the-research-account-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c01--a1-a1-m3-input-r3-c2" name="a1-a1-m3-input-r3-c2" data-learner-cell="a1-a1-m3-input-r3-c2" rows="3" aria-labelledby="lj-c01--a1-a1-m3-row-3 lj-c01--a1-a1-m3-col-what-this-describes-2" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="lj-c01--a1-a1-m3-row-4" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Reported outcome</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c01--a1-a1-m3-input-r4-c1" name="a1-a1-m3-input-r4-c1" data-learner-cell="a1-a1-m3-input-r4-c1" rows="3" aria-labelledby="lj-c01--a1-a1-m3-row-4 lj-c01--a1-a1-m3-col-evidence-from-the-research-account-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c01--a1-a1-m3-input-r4-c2" name="a1-a1-m3-input-r4-c2" data-learner-cell="a1-a1-m3-input-r4-c2" rows="3" aria-labelledby="lj-c01--a1-a1-m3-row-4 lj-c01--a1-a1-m3-col-what-this-describes-2" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>An accurate identification of the research question, participant population and total, group definitions, observational survey method and self-reported outcome. The response distinguishes participants&#39; reported behaviours and experiences from researchers&#39; procedures, without attempting to explain the principal finding.</p></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-task-step-step-3-3" data-response-part-id="A1-task-step-step-3-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c01--learner-workspace-a1-a1-task-step-step-3-3-label" for="lj-c01--learner-workspace-a1-a1-task-step-step-3-3">Your response</label><p class="util-learner-workspace__prompt" id="lj-c01--learner-workspace-a1-a1-task-step-step-3-3-desc">Record these features in the evidence-identification workspace, distinguishing what students reported from what the researchers did.</p><textarea class="util-learner-workspace__input" id="lj-c01--learner-workspace-a1-a1-task-step-step-3-3" name="learner-workspace-a1-a1-task-step-step-3-3" rows="6" aria-describedby="lj-c01--learner-workspace-a1-a1-task-step-step-3-3-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c01--learner-check-a1" data-check-sidebar-open aria-controls="lj-c01--learner-check-a1" aria-expanded="false" aria-label="Check your work: Investigate the study design">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c01--learner-check-a1" data-composition-moment="check" data-activity-id="A1" data-check-sidebar="available" aria-labelledby="lj-c01--learner-check-a1-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c01--learner-check-a1-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c01--learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c01--learner-task-a1">Back to your task (Investigate the study design)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m4-c-0" data-revision-criterion-id="a1-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you identified the research question as a question about the relationship investigated?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confusing the research question with a conclusion makes the study appear to have established something before its evidence has been examined.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The research-question row identifies both the break-taking characteristic and the concentration outcome.</li><li><span class="util-guided-review__feature-key">B.</span> The row presents what researchers investigated rather than what they supposedly proved.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Return to the question stated in the source and identify the two characteristics it asks about.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Change any statement of a proven effect into a description of the question the researchers set out to investigate.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c01--checklist-a1-a1-m4-item-0" data-checklist-item-id="checklist-a1-a1-m4-item-0"><label class="util-interactive-checklist__label" for="lj-c01--checklist-a1-a1-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c01--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m4-c-1" data-revision-criterion-id="a1-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you correctly identified the participants and how the comparison groups were formed?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The meaning of a group comparison depends on knowing who supplied the data and which reported characteristic distinguished the groups.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The participant entry gives the correct total and identifies the participants as undergraduates.</li><li><span class="util-guided-review__feature-key">B.</span> The comparison-group entry distinguishes the two reported break-taking habits and gives the group sizes.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Check the method section and record both the participant population and the total number surveyed.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify each group by the break-taking behaviour students reported, then add the number of students in each group.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c01--checklist-a1-a1-m4-item-1" data-checklist-item-id="checklist-a1-a1-m4-item-1"><label class="util-interactive-checklist__label" for="lj-c01--checklist-a1-a1-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c01--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m4-c-2" data-revision-criterion-id="a1-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you distinguished an observational survey from an experiment with assigned conditions?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Misidentifying the method could lead to unsupported claims about what the researchers controlled or caused.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The method entry describes information collected through a survey.</li><li><span class="util-guided-review__feature-key">B.</span> The entry does not suggest that researchers randomly allocated students to take or avoid breaks.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State how researchers obtained information about students&#39; existing study habits and concentration.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Remove any reference to experimental assignment and check the source&#39;s description of how the groups were formed.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c01--checklist-a1-a1-m4-item-2" data-checklist-item-id="checklist-a1-a1-m4-item-2"><label class="util-interactive-checklist__label" for="lj-c01--checklist-a1-a1-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c01--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m4-c-3" data-revision-criterion-id="a1-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you identified the reported outcome without substituting an unmeasured outcome?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An account of the study must preserve what was recorded rather than replace it with a different measure.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The outcome is identified as students reporting good concentration.</li><li><span class="util-guided-review__feature-key">B.</span> The outcome entry does not claim that academic performance or objectively measured attention was assessed.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Use the wording of the outcome in the research account rather than treating concentration as independently tested.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Remove performance or objective-testing claims unless the source explicitly describes those measurements.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c01--checklist-a1-a1-m4-item-3" data-checklist-item-id="checklist-a1-a1-m4-item-3"><label class="util-interactive-checklist__label" for="lj-c01--checklist-a1-a1-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c01--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c01--activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Compare the reported results</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Having established how the participants were grouped and what outcome they reported, you can now examine the numerical evidence. The distinction between reported characteristics and measured effects remains important when interpreting the result of the calculation.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Now examine the numbers recorded for each group. Both groups contain the same number of students, so you can compare the reported proportions directly. Use the study&#39;s figures to calculate the difference and identify the appropriate unit.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Keep the numerator, group size and percentage together. Compare the two percentages using subtraction and identify the unit that describes a difference between percentages.</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A2"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a2-percentage-points-01-activity-a2-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/C01/activity-a2-materials-entry.png" alt="Percentage scale showing 30%, 40% and the 10-percentage-point gap; detailed description follows." aria-describedby="lj-c01--figure-description-asset-vb-38-4-va-a2-percentage-points-01-activity-a2-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 2.</strong> A difference between percentages is measured in percentage points.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c01--figure-description-asset-vb-38-4-va-a2-percentage-points-01-activity-a2-materials-entry">A common scale extends from 0% to 100%. Two marked positions indicate 30% and 40%. The segment between these positions is labelled as a difference of 10 percentage points. The percentages describe two separate proportions, while the segment describes the arithmetic gap between them. The example is independent of the fictional study and does not represent a measured effect or explain why two groups might differ.</p></figure><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A2-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Percentages and percentage points</span></p><p>A percentage expresses a proportion out of 100. For example, if 30 of 100 respondents select an option, the percentage is 30%.</p><p>A percentage-point difference compares two percentages by subtraction. In a separate illustrative example, if 45% of one group and 35% of another group select an option, the difference is:</p><p>\[45-35=10\]</p><p>The difference is 10 percentage points.</p><p>A percentage-point difference is not the same as a relative percentage increase. In this activity, calculate only the difference between the two reported percentages in the study.</p><p>The arithmetic tells you how far apart the reported proportions are. It does not, by itself, identify why they differ.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c01--learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="lj-c01--learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="lj-c01--learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c01--learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c01--learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="lj-c01--learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c01--learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the numerical findings for both groups in the research account.</p></span></div><article class="util-material-block util-material-table-block" data-material-id="A2-M1" data-material-type="data_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Fictional survey findings: Group comparison</span></p><p>The following values are taken from the fictional study, &#39;Study breaks and concentration among undergraduate students&#39;. They describe what students reported.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Group</th><th>Reported break-taking</th><th>Number of students</th><th>Students reporting good concentration</th><th>Percentage reporting good concentration</th></tr></thead><tbody><tr><td>Group A</td><td>Regular short breaks</td><td>100</td><td>72</td><td>72%</td></tr><tr><td>Group B</td><td>No regular short breaks</td><td>100</td><td>58</td><td>58%</td></tr></tbody></table></div><p>Use these observations to complete your own numerical comparison.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Record each group&#39;s size, number reporting good concentration and corresponding percentage.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a2-a2-m3" data-material-source-id="A2-M3" data-activity-id="A2"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A2-M3" data-material-type="comparison_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg
