eveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Misidentifying the groups changes what the reported figures can legitimately be used to compare.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Flagged, contacted and engaged students are treated as distinct recorded categories.</li><li><span class="util-guided-review__feature-key">B.</span> The enrolment comparison distinguishes engaged from non-engaged flagged students.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Reassign any count that has been attached to the wrong stage, using the definitions in the evaluation table.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Replace any comparison between contacted and uncontacted students with the groups actually used in the preliminary enrolment rows.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-0" data-checklist-item-id="checklist-a2-a2-m4-item-0"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m4-c-1" data-revision-criterion-id="a2-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you used the correct denominators and represented the numerical comparison accurately?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A percentage calculated from the wrong group size can misrepresent both participation and preliminary enrolment.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each percentage is linked to the population from which its numerator was drawn.</li><li><span class="util-guided-review__feature-key">B.</span> The two enrolment rates use their respective engaged and non-engaged group sizes.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> For any calculated percentage, identify the relevant group total before dividing the observed count by it.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Recalculate any enrolment rate that uses the total flagged population instead of the relevant comparison group.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-1" data-checklist-item-id="checklist-a2-a2-m4-item-1"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m4-c-2" data-revision-criterion-id="a2-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you expressed the difference between the two enrolment percentages in percentage points?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confusing percentage points with relative percentage change can exaggerate or misstate the observed difference.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The comparison subtracts one reported enrolment percentage from the other.</li><li><span class="util-guided-review__feature-key">B.</span> The result is labelled in percentage points, not as an unqualified percentage increase.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Use the two reported group rates directly to calculate the absolute difference between them.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Change the unit attached to your subtraction result and distinguish it from a relative change calculation.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-2" data-checklist-item-id="checklist-a2-a2-m4-item-2"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m4-c-3" data-revision-criterion-id="a2-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you separated the observed association from causal and final-continuation claims?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A comparison at one preliminary reporting point cannot establish either the effect of support or students&#39; eventual continuation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The interpretation describes a difference in observed preliminary enrolment rather than a proven effect of SSI.</li><li><span class="util-guided-review__feature-key">B.</span> The outcome is identified as preliminary enrolment rather than final continuation.</li><li><span class="util-guided-review__feature-key">C.</span> At least one plausible source of uncertainty about the comparison is acknowledged.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Replace wording such as &#39;SSI caused&#39; with an observation about the reported groups, and identify why the comparison alone cannot establish causation.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Locate any statement about final retention or second-year progression and restrict it to the reporting-point outcome actually recorded.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Consider whether students choosing to engage might differ from those not engaging, and explain how such differences could affect interpretation.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-3" data-checklist-item-id="checklist-a2-a2-m4-item-3"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Make Your Initial Case</h2><div class="util-badge-row"><span class="util-badge util-badge-time">3 min</span></div></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Move from evidence interpretation to a defensible provisional position on whether SSI appears worth continuing while further evidence is collected.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your interpretation of the March figures provides a factual basis for judgement. The challenge is to move from describing an encouraging association to deciding what action that limited evidence can reasonably support, without treating uncertainty as either proof of success or proof of failure.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have seen why Northbridge introduced SSI and what its first evaluation appears to show. Now make a provisional decision: on the evidence currently available, does SSI appear worth continuing while more evidence is collected? There is no prescribed position. What matters is how well your reasons match the evidence.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Consider the potential educational value of timely support, what the preliminary findings indicate, and what remains uncertain. A provisional decision can be justified without claiming certainty.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which part of the available evidence most influences your position, and which uncertainty most limits the conclusion you can draw?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A3"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><article class="util-material-block util-material-table-block" data-material-id="A3-M1" data-material-type="reference_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">March Evidence for Your Provisional Decision</span></p><h3 class="util-md-heading util-md-heading--source-3">NB-SSI-01 — Initial Evaluation Summary</h3><p><strong>Northbridge University, 12 March 2026</strong></p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Recorded measure</th><th>Count</th><th>Group or denominator</th><th>Reported preliminary rate</th></tr></thead><tbody><tr><td>Students flagged by SSI</td><td>500</td><td>All flagged students</td><td>—</td></tr><tr><td>Students receiving recorded personalised contact</td><td>400</td><td>Flagged students</td><td>—</td></tr><tr><td>Students attending at least one support conversation</td><td>240</td><td>Contacted students</td><td>—</td></tr><tr><td>Engaged flagged students still enrolled at the preliminary reporting point</td><td>216</td><td>240 engaged flagged students</td><td>90%</td></tr><tr><td>Non-engaged flagged students still enrolled at the preliminary reporting point</td><td>208</td><td>260 non-engaged flagged students</td><td>80%</td></tr></tbody></table></div><p>The enrolment rates refer to the <strong>preliminary reporting point</strong>, not final continuation. This record supplies the available March evaluation figures for your initial judgement.</p></article></div><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A3-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Weighing a Decision with Limited Evidence</span></p><p>Northbridge introduced SSI because it wanted to identify possible academic support needs early enough for staff to offer help. Continuing the initiative could preserve that opportunity, but the educational purpose alone does not establish that the system achieves it.</p><p>The March record provides information about how far students progressed through the support pathway and how preliminary enrolment differed between students who engaged and those who did not. Those observations are relevant to deciding whether the initiative merits further attention. However, the record does not isolate the effect of SSI or establish final continuation outcomes. Students who chose to participate may have differed from those who did not, independently of the support received.</p><p>The judgement therefore involves a genuine trade-off. Giving weight to the possibility of timely support may favour continued operation while further evidence is gathered. Giving greater weight to uncertainty about actual benefit may favour withholding support for continuation or remaining undecided. Neither direction follows automatically from the figures.</p><p>A defensible provisional judgement identifies which consideration carries more weight <strong>for now</strong>, links that weighting to the recorded evidence and explains what the evidence cannot settle. The appropriate conclusion at this stage is an initial position with an explicit limitation, not a definitive institutional recommendation.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Reinspect the March evaluation evidence.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Record Your Provisional Judgement</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>State whether you currently favour continuing SSI while gathering more evidence, do not favour continuing on the present evidence, or remain undecided.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Give at least one specific reason grounded in the evaluation or SSI&#39;s stated educational purpose.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify at least one uncertainty that limits how strongly the evidence supports your position.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain briefly why your reasons justify your provisional position rather than a definitive conclusion.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A clear provisional position supported by at least one accurate and relevant piece of March evaluation evidence or institutional-purpose reasoning, together with an explicitly identified evidential limitation. The justification should connect the evidence to the chosen position without asserting a causal benefit, assuming future outcomes or treating any particular continuation position as correct.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-my-provisional-position-1" data-response-part-id="A3-template-section-a3-m3-section-my-provisional-position-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m3-section-my-provisional-position-1-label" for="learner-workspace-a3-a3-template-section-a3-m3-section-my-provisional-position-1">My provisional position</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m3-section-my-provisional-position-1-desc">Record your response for My provisional position.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m3-section-my-provisional-position-1" name="learner-workspace-a3-a3-template-section-a3-m3-section-my-provisional-position-1" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m3-section-my-provisional-position-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-evidence-supporting-my-position-2" data-response-part-id="A3-template-section-a3-m3-section-evidence-supporting-my-position-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m3-section-evidence-supporting-my-position-2-label" for="learner-workspace-a3-a3-template-section-a3-m3-section-evidence-supporting-my-position-2">Evidence supporting my position</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m3-section-evidence-supporting-my-position-2-desc">Record your response for Evidence supporting my position.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m3-section-evidence-supporting-my-position-2" name="learner-workspace-a3-a3-template-section-a3-m3-section-evidence-supporting-my-position-2" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m3-section-evidence-supporting-my-position-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-an-important-uncertainty-3" data-response-part-id="A3-template-section-a3-m3-section-an-important-uncertainty-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m3-section-an-important-uncertainty-3-label" for="learner-workspace-a3-a3-template-section-a3-m3-section-an-important-uncertainty-3">An important uncertainty</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m3-section-an-important-uncertainty-3-desc">Record your response for An important uncertainty.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m3-section-an-important-uncertainty-3" name="learner-workspace-a3-a3-template-section-a3-m3-section-an-important-uncertainty-3" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m3-section-an-important-uncertainty-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-why-my-judgement-is-provisional-4" data-response-part-id="A3-template-section-a3-m3-section-why-my-judgement-is-provisional-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m3-section-why-my-judgement-is-provisional-4-label" for="learner-workspace-a3-a3-template-section-a3-m3-section-why-my-judgement-is-provisional-4">Why my judgement is provisional</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m3-section-why-my-judgement-is-provisional-4-desc">Record your response for Why my judgement is provisional.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m3-section-why-my-judgement-is-provisional-4" name="learner-workspace-a3-a3-template-section-a3-m3-section-why-my-judgement-is-provisional-4" rows="5" aria-describedby="learner-workspace-a3-a3-template-section-a3-m3-section-why-my-judgement-is-provisional-4-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#learner-check-a3" data-check-sidebar-open aria-controls="learner-check-a3" aria-expanded="false" aria-label="Check your work: Make Your Initial Case">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a3" data-composition-moment="check" data-activity-id="A3" data-check-sidebar="available" aria-labelledby="learner-check-a3-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="learner-check-a3-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a3">Back to your task (Make Your Initial Case)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m4-c-0" data-revision-criterion-id="a3-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you stated a recognisable provisional position on continuing SSI?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without an identifiable position, the reader cannot see what the evidence and reasons are intended to justify.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response indicates continuation, non-continuation or an undecided position.</li><li><span class="util-guided-review__feature-key">B.</span> The position concerns what appears justified on the currently available evidence.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Add an explicit statement of your present stance without changing it merely to sound more decisive.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Recast any unconditional final decision as a judgement about what the March evidence presently warrants.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m4-item-0" data-checklist-item-id="checklist-a3-a3-m4-item-0"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m4-c-1" data-revision-criterion-id="a3-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you connected accurate, relevant evidence to the position you have chosen?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A decision supported only by general enthusiasm or concern does not demonstrate reasoning from this institutional case.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> At least one specific March evaluation observation or stated SSI purpose is used.</li><li><span class="util-guided-review__feature-key">B.</span> The chosen evidence is connected to why the position seems warranted.</li><li><span class="util-guided-review__feature-key">C.</span> The supporting claim stays within what the evidence actually measures.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify a relevant recorded figure, group comparison or institutional objective and incorporate it into your reasoning.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain how the cited observation or purpose affects your judgement rather than leaving it as an isolated fact.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Qualify any claim that treats preliminary enrolment as a demonstrated causal benefit or final continuation result.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m4-item-1" data-checklist-item-id="checklist-a3-a3-m4-item-1"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m4-c-2" data-revision-criterion-id="a3-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you identified a limitation that genuinely affects your judgement?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A limitation matters only if it helps explain why the current evidence is not sufficient for an unrestricted conclusion.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response names an uncertainty relevant to the March evaluation.</li><li><span class="util-guided-review__feature-key">B.</span> The uncertainty is connected to the strength of the proposed decision.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify a specific unresolved issue, such as whether differences between participants and non-participants influence the comparison.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain how that unresolved issue limits the conclusion you can draw from the observed figures.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m4-item-2" data-checklist-item-id="checklist-a3-a3-m4-item-2"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m4-c-3" data-revision-criterion-id="a3-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Is your conclusion proportionate to the evidence without requiring a particular position?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Overstating certainty turns an initial interpretation into a claim the preliminary record cannot support.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The judgement distinguishes encouraging indications from demonstrated effectiveness.</li><li><span class="util-guided-review__feature-key">B.</span> The response explains why the decision remains open to reconsideration.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Reconsider wording that converts an observed difference into proof that the initiative works.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify what is not yet settled and connect that gap to the provisional nature of your stance.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m4-item-3" data-checklist-item-id="checklist-a3-a3-m4-item-3"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A4" data-journey-section="true" data-activity-id="A4" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">How Confident Is Your Judgement?</h2><div class="util-badge-row"><span class="util-badge util-badge-time">2 min</span></div></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A4"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Calibrate confidence in the provisional judgement and transfer evidence-sensitive reasoning to an explanation for a first-year student.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your provisional judgement now has supporting reasons and an acknowledged limitation. Evaluating confidence adds a further dimension: you must decide not only what you currently think, but how strongly the available evidence warrants that position. Communicating that distinction is important when others may act on a judgement.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>A reasoned position is not the same as certainty. Consider how confident you are in your provisional judgement and why. You will also apply the same distinction between a position and its evidential support to a short communication task for a different audience.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Separate the direction of your judgement from the strength of your confidence. Calibrate confidence to the preliminary evidence rather than to how attractive or important the initiative&#39;s objective seems.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">What makes your judgement more or less secure? How would you explain that uncertainty to someone who has not studied the evaluation?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A4"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A4-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Position and Confidence Are Different</span></p><p>Your <strong>position</strong> expresses what you currently think Northbridge should do about SSI. Your <strong>confidence</strong> expresses how securely the available evidence supports that position. These are separate judgements.</p><p>For example, someone might provisionally favour continuing an initiative while having low confidence that it is effective. Another person might remain undecided because the available evidence supports competing interpretations. Neither position automatically determines a confidence level.</p><p>Use <strong>low</strong>, <strong>moderate</strong> or <strong>high</strong> to describe your confidence. When choosing, weigh what the reported evidence allows you to say against what remains uncertain. A clear difference in recorded outcomes can be relevant, while uncertainty about why that difference exists may limit confidence in an explanation of the initiative&#39;s effect.</p><p>Confidence is not a measure of how strongly you value student support. It is a judgement about how far the evidence warrants the conclusion you are making. Your explanation should make that relationship visible.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a4" data-composition-moment="do" data-activity-id="A4" aria-labelledby="learner-task-a4-heading"><h3 class="util-composition-moment-heading" id="learner-task-a4-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a4" hidden data-revision-reminder="true" data-activity-id="A4" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a4" hidden data-revision-guidance="true" data-activity-id="A4" aria-labelledby="learner-revision-guidance-a4-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a4-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Revisit the provisional position and reasons you have just recorded.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Record Your Confidence and Student Explanation</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>State your confidence as low, moderate or high and justify that level using both a supporting feature of the evidence and a limitation.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A4-M1" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Evidence Card: Confidence and Communication</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-3">Northbridge University — NB-SSI-01</h3><p><strong>Initial Evaluation Summary, 12 March 2026</strong></p><table><thead><tr><th>Flagged student group</th><th>Still enrolled at the preliminary reporting point</th><th>Group total</th><th>Reported rate</th></tr></thead><tbody><tr><td>Students who engaged with support</td><td>216</td><td>240</td><td>90%</td></tr><tr><td>Students who did not engage with support</td><td>208</td><td>260</td><td>80%</td></tr></tbody></table><p><strong>Institutional context:</strong> SSI identifies possible academic support needs for review by authorised staff. Staff decide whether personalised contact is appropriate. Students can decline support, and engagement means attending at least one support conversation.</p><p><strong>Outcome boundary:</strong> The figures record enrolment at a preliminary reporting point. Final continuation outcomes are not established by this record.</p><p>Use these particulars to consider the strength of your confidence and to prepare an accurate explanation for a first-year student.</p></article></li></ol></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Review both responses against the diagnostic criteria.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Retain your position, reasons and confidence so that you can revisit them when examining the evidence more closely in Reading the Evidence Carefully.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>An explicit confidence level accompanied by a concise explanation connecting the strength of the preliminary findings and their limitations to that level. A separate short explanation for a student audience should communicate the difference between an encouraging observation and a proven causal benefit without introducing unsupported facts. The learner&#39;s initial position, reasons and confidence should remain identifiable for later reconsideration.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-my-confidence-level-1" data-response-part-id="A4-template-section-a4-m3-section-my-confidence-level-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-template-section-a4-m3-section-my-confidence-level-1-label" for="learner-workspace-a4-a4-template-section-a4-m3-section-my-confidence-level-1">My confidence level</label><p class="util-learner-workspace__prompt" id="learner-workspace-a4-a4-template-section-a4-m3-section-my-confidence-level-1-desc">Record your response for My confidence level.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-template-section-a4-m3-section-my-confidence-level-1" name="learner-workspace-a4-a4-template-section-a4-m3-section-my-confidence-level-1" rows="6" aria-describedby="learner-workspace-a4-a4-template-section-a4-m3-section-my-confidence-level-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-evidence-that-supports-my-confidence-2" data-response-part-id="A4-template-section-a4-m3-section-evidence-that-supports-my-confidence-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-template-section-a4-m3-section-evidence-that-supports-my-confidence-2-label" for="learner-workspace-a4-a4-template-section-a4-m3-section-evidence-that-supports-my-confidence-2">Evidence that supports my confidence</label><p class="util-learner-workspace__prompt" id="learner-workspace-a4-a4-template-section-a4-m3-section-evidence-that-supports-my-confidence-2-desc">Record your response for Evidence that supports my confidence.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-template-section-a4-m3-section-evidence-that-supports-my-confidence-2" name="learner-workspace-a4-a4-template-section-a4-m3-section-evidence-that-supports-my-confidence-2" rows="6" aria-describedby="learner-workspace-a4-a4-template-section-a4-m3-section-evidence-that-supports-my-confidence-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-what-limits-my-confidence-3" data-response-part-id="A4-template-section-a4-m3-section-what-limits-my-confidence-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-template-section-a4-m3-section-what-limits-my-confidence-3-label" for="learner-workspace-a4-a4-template-section-a4-m3-section-what-limits-my-confidence-3">What limits my confidence</label><p class="util-learner-workspace__prompt" id="learner-workspace-a4-a4-template-section-a4-m3-section-what-limits-my-confidence-3-desc">Record your response for What limits my confidence.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-template-section-a4-m3-section-what-limits-my-confidence-3" name="learner-workspace-a4-a4-template-section-a4-m3-section-what-limits-my-confidence-3" rows="6" aria-describedby="learner-workspace-a4-a4-template-section-a4-m3-section-what-limits-my-confidence-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-explanation-for-a-first-year-student-4" data-response-part-id="A4-template-section-a4-m3-section-explanation-for-a-first-year-student-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-template-section-a4-m3-section-explanation-for-a-first-year-student-4-label" for="learner-workspace-a4-a4-template-section-a4-m3-section-explanation-for-a-first-year-student-4">Explanation for a first-year student</label><p class="util-learner-workspace__prompt" id="learner-workspace-a4-a4-template-section-a4-m3-section-explanation-for-a-first-year-student-4-desc">Record your response for Explanation for a first-year student.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-template-section-a4-m3-section-explanation-for-a-first-year-student-4" name="learner-workspace-a4-a4-template-section-a4-m3-section-explanation-for-a-first-year-student-4" rows="6" aria-describedby="learner-workspace-a4-a4-template-section-a4-m3-section-explanation-for-a-first-year-student-4-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#learner-check-a4" data-check-sidebar-open aria-controls="learner-check-a4" aria-expanded="false" aria-label="Check your work: How Confident Is Your Judgement?">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a4" data-composition-moment="check" data-activity-id="A4" data-check-sidebar="available" aria-labelledby="learner-check-a4-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="learner-check-a4-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="learner-check-a4-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a4">Back to your task (How Confident Is Your Judgement?)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A4-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a4-a4-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a4-m5-c-0" data-revision-criterion-id="a4-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you stated a confidence level independently of your continuation position?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A confidence rating that merely repeats a preference cannot show how securely the available evidence supports that preference.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> A low, moderate or high confidence level is explicitly identified.</li><li><span class="util-guided-review__feature-key">B.</span> The explanation concerns evidential support rather than the desirability of helping students.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Choose one of the three confidence levels and record it separately from your continuation stance.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Replace a justification based only on the importance of support with a statement about the strength of the March evidence.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a4-a4-m5-item-0" data-checklist-item-id="checklist-a4-a4-m5-item-0"><label class="util-interactive-checklist__label" for="checklist-a4-a4-m5-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a4-m5-c-1" data-revision-criterion-id="a4-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you justified your confidence with an accurate feature of the preliminary findings?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confidence needs a visible connection to the recorded observations, otherwise it is only an expression of personal certainty.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> At least one specific comparison or observation from NB-SSI-01 is identified.</li><li><span class="util-guided-review__feature-key">B.</span> The observation is connected to the strength of the position rather than simply repeated.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Select a relevant reported count, group or preliminary rate and use it as a reason for your confidence assessment.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain why that particular observation makes your judgement more or less secure.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a4-a4-m5-item-1" data-checklist-item-id="checklist-a4-a4-m5-item-1"><label class="util-interactive-checklist__label" for="checklist-a4-a4-m5-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a4-m5-c-2" data-revision-criterion-id="a4-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you explained a limitation that affects the confidence you selected?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Ignoring unresolved causes or outcome boundaries can make confidence appear stronger than the evaluation warrants.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response recognises uncertainty about whether support caused the observed difference.</li><li><span class="util-guided-review__feature-key">B.</span> The response recognises the preliminary nature of the enrolment outcome where relevant.</li><li><span class="util-guided-review__feature-key">C.</span> The limitation is related to the selected confidence level.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify why comparing students who did and did not engage cannot isolate the effect of the support itself.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Distinguish the reported enrolment checkpoint from eventual continuation and connect that distinction to your confidence.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain how the unresolved issue constrains your certainty instead of listing it without consequence.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a4-a4-m5-item-2" data-checklist-item-id="checklist-a4-a4-m5-item-2"><label class="util-interactive-checklist__label" for="checklist-a4-a4-m5-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a4-m5-c-3" data-revision-criterion-id="a4-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Does your student-facing explanation accurately communicate what is observed and what remains unknown?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A student could mistake an encouraging preliminary comparison for established effectiveness if the explanation collapses observation, causation and final outcomes.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The explanation communicates the observed group comparison without claiming that SSI caused it.</li><li><span class="util-guided-review__feature-key">B.</span> Preliminary enrolment is not presented as final continuation.</li><li><span class="util-guided-review__feature-key">C.</span> The explanation addresses the student&#39;s question directly in accessible language.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify any causal wording and distinguish the recorded association from a demonstrated effect of the initiative.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Replace any claim about eventual continuation with wording that identifies the preliminary reporting point.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Remove unnecessary technical wording and make the distinction between current evidence and unresolved questions understandable without specialist knowledge.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a4-a4-m5-item-3" data-checklist-item-id="checklist-a4-a4-m5-item-3"><label class="util-interactive-checklist__label" for="checklist-a4-a4-m5-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A4"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M4" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Explain the Evidence to a Student</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-transfer-prompt-a4-m4-910" data-response-part-id="A4-transfer-prompt-a4-m4-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-transfer-prompt-a4-m4-910-label" for="learner-workspace-a4-a4-transfer-prompt-a4-m4-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a4-a4-transfer-prompt-a4-m4-910-desc"><p>A first-year student asks:</p><p>&gt; &quot;Does the university already know that SSI works?&quot;</p><p>Write <strong>two or three sentences</strong> answering the student in accessible language. Use the March evaluation evidence to distinguish the observed difference between the groups from proof that SSI caused it. Also distinguish preliminary enrolment from final continuation.</p><p>Your purpose is to help the student understand what the university currently knows and does not know, <strong>not</strong> to persuade them to agree with your own position on continuing SSI.</p><p>Write your response in <strong>Explanation for a first-year student</strong> in the confidence workspace.</p></div><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-transfer-prompt-a4-m4-910" name="learner-workspace-a4-a4-transfer-prompt-a4-m4-910" rows="5" aria-describedby="learner-workspace-a4-a4-transfer-prompt-a4-m4-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><style id="prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;position:fixed;top:var(--learner-sticky-nav-height,0px);left:0;right:0;z-index:40;margin:0 auto;max-width:42rem;width:calc(100% - 1.5rem);padding:.45rem .75rem;border:1px solid #cbd5e1;border-left:3px solid #64748b;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.12)}.util-learner-renderer-vnext .util-revision-reminder__chrome{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.35rem .75rem;margin:0 0 .2rem}.util-learner-renderer-vnext .util-revision-reminder__label{margin:0;font-size:.75rem;font-weight:650;color:#64748b}.util-learner-renderer-vnext .util-revision-reminder__statement{margin:0;font-size:.9rem;line-height:1.4;font-weight:600;color:#0f172a}.util-learner-renderer-vnext .util-revision-reminder__view{font:inherit;font-size:.9rem;color:#1d4ed8;background:transparent;border:0;padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}.util-learner-renderer-vnext .util-revision-reminder__view:focus{outline:2px solid #2563eb;outline-o
