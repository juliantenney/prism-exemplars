aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">A promising finding, but what does it show?</span><p class="util-journey-position" aria-label="Section 1 of 6"><span class="util-journey-position__visible" aria-hidden="true">1 of 6</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#exposition-S2" aria-label="Next section: Reading the numbers: who is being counted?"><span class="util-journey-adjacent__title">Reading the numbers: who is being counted?</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#exposition-S1" aria-current="location">A promising finding, but what does it show?</a></li><li><a class="util-journey-all-link" href="#exposition-S2">Reading the numbers: who is being counted?</a></li><li><a class="util-journey-all-link" href="#exposition-S3">From an observed difference to a causal claim</a></li><li><a class="util-journey-all-link" href="#exposition-S4">Why else might the groups differ?</a></li><li><a class="util-journey-all-link" href="#exposition-S5">What was measured, and what remains unknown?</a></li><li><a class="util-journey-all-link" href="#exposition-S6">Making a judgement that fits the evidence</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-exposition-sections" data-region="exposition"><section class="util-exposition-section" data-region-item="exposition-section" id="exposition-S1" data-section-id="S1" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">A promising finding, but what does it show?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Northbridge University is a fictional public university in England. In September 2025, it introduced Student Support Insight (SSI), an AI-assisted system intended to help staff identify first-year students who might benefit from additional academic support. SSI uses existing information about engagement with university learning systems, attendance where available and assignment submission patterns to generate support flags. Authorised staff review those flags and decide whether to offer support. Students may decline, and conventional academic support remains available. SSI does not diagnose students, award grades or automatically impose sanctions.</p><p>The university hoped that earlier conversations with students could help more of them remain on their courses. Its initial evaluation summary, NB-SSI-01, dated 12 March 2026, reported an encouraging difference. Among students flagged by SSI, 90% of those who engaged with support were still enrolled at the preliminary reporting point, compared with 80% of those who did not engage.</p><p>That difference invites a positive interpretation. It might suggest that support is reaching students in a useful way. But there is a difference between saying that students who engaged had a higher enrolment rate and saying that engagement caused the higher rate. The first statement describes what the evaluation recorded. The second offers an explanation for why it happened.</p><p>If you completed The Promising Pilot, revisit your initial judgement about SSI, the reasons you gave and how confident you felt. Keep that judgement in mind as you examine which reasons follow directly from the preliminary evidence and which depend on assumptions. You do not need to decide immediately whether your earlier position was right or wrong. The purpose is to make its evidential basis clearer.</p><p>The question throughout this resource is not whether encouraging evidence should be trusted or dismissed. It is how much that evidence can reasonably tell us. A finding can be accurate, relevant and promising while still leaving important questions unanswered.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="exposition-S2" data-section-id="S2" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Reading the numbers: who is being counted?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>A percentage is meaningful only when you know what is being counted and what total it is being compared with. The number being counted is the numerator. The relevant total is the denominator. A percentage expresses the numerator as a proportion of that denominator, multiplied by 100.</p><p>Northbridge&#39;s preliminary summary begins with 500 students flagged by SSI. A flag was an advisory indication that a student might benefit from support; it did not mean that the student had already received any. Of those 500 students, 400 received recorded personalised support contact. In this evaluation, contact meant a recorded personalised offer of academic support following a flag. Of the 400 contacted students, 240 attended at least one support conversation. This attendance was the evaluation&#39;s definition of support engagement.</p><p>The distinction between these stages matters. Being flagged, being contacted and engaging are three different recorded events. The 240 engaged students represent 60% of the 400 contacted students: 240 divided by 400, multiplied by 100. The same 240 students represent 48% of the 500 flagged students. Neither percentage is inherently wrong; each answers a different question because it uses a different denominator.</p><p>The preliminary enrolment comparison divides the 500 flagged students into two groups. The first contains the 240 students who engaged with support. Of these, 216 were still enrolled at the preliminary reporting point. Dividing 216 by 240 gives 0.90, or 90%.</p><p>The second group contains the 260 flagged students who did not engage. This group includes students who did not have a recorded engagement, whether or not they had received contact. Of those 260 students, 208 were still enrolled at the same preliminary reporting point. Dividing 208 by 260 gives 0.80, or 80%.</p><p>Notice that the number still enrolled was 216 in the engaged group and 208 in the non-engaged group. Comparing these counts alone could be misleading because the groups were not the same size. Rates allow us to compare the proportion remaining enrolled within each group.</p><p>Subtracting 80% from 90% gives a difference of ten percentage points. A percentage-point difference is the direct subtraction of two percentages. It is not the same as saying that enrolment increased by ten per cent relative to the lower rate, and it does not tell us what caused the difference.</p><p>The comparison is also narrower than a statement about all students at Northbridge. Both groups consist of students who were flagged by SSI. The 90% figure does not describe every flagged student, and neither rate represents the university&#39;s entire first-year population.</p><p>A careful numerical description therefore identifies four things together: the population being considered, the groups being compared, the outcome being measured and the point in time when it was measured. Here, the finding concerns preliminary enrolment among flagged students grouped according to recorded support engagement.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material util-exposition-structured-fallback" data-material-id="XM-S2-01" data-material-kind="Accessible numerical comparison table" data-material-type="expository_structured_fallback" data-section-id="S2" data-expository-structured="fallback"><h3>Reading the preliminary SSI figures</h3><p>Northbridge University, Initial Evaluation Summary NB-SSI-01, 12 March 2026. Fictional educational case.</p><div><p><strong>Introduction</strong></p><p>The preliminary evaluation follows students from an SSI support flag through recorded contact and engagement. It then compares preliminary enrolment rates for two groups within the flagged population. The tables separate these stages so that each count and percentage has a clear meaning.</p></div><section><h4>Support pathway</h4><div><p><strong>Title</strong></p><p>From support flag to support engagement</p></div><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Stage</th><th scope="col">Count</th><th scope="col">Meaning</th></tr></thead><tbody><tr><td>Flagged by SSI</td><td>500</td><td>Students identified by the advisory system as potentially benefiting from additional academic support.</td></tr><tr><td>Received support contact</td><td>400</td><td>Flagged students who received a recorded personalised offer of academic support.</td></tr><tr><td>Engaged with support</td><td>240</td><td>Contacted students who attended at least one support conversation.</td></tr></tbody></table></div><div><p><strong>Interpretation</strong></p><p>The stages are not interchangeable. All 240 students recorded as engaging were among the 400 contacted students and the 500 flagged students. Contact does not necessarily lead to engagement.</p></div><section><h4>Denominator examples</h4><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Question</th><th scope="col">Numerator</th><th scope="col">Denominator</th><th scope="col">Calculation</th><th scope="col">Result</th><th scope="col">Interpretation</th></tr></thead><tbody><tr><td>What percentage of contacted students engaged?</td><td>240</td><td>400</td><td>240 ÷ 400 × 100</td><td>60%</td><td>60% of the students who received recorded support contact engaged in at least one support conversation.</td></tr><tr><td>What percentage of all flagged students engaged?</td><td>240</td><td>500</td><td>240 ÷ 500 × 100</td><td>48%</td><td>48% of all SSI-flagged students engaged in at least one support conversation.</td></tr></tbody></table></div></section></section><section><h4>Enrolment comparison</h4><div><p><strong>Title</strong></p><p>Preliminary enrolment among SSI-flagged students</p></div><div><p><strong>Subtitle</strong></p><p>Both groups belong to the same population of 500 flagged students. The outcome is whether students were still enrolled at the preliminary reporting point.</p></div><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Group</th><th scope="col">Group size</th><th scope="col">Still enrolled</th><th scope="col">Rate</th></tr></thead><tbody><tr><td>Engaged with support</td><td>240</td><td>216</td><td>90%</td></tr><tr><td>Did not engage with support</td><td>260</td><td>208</td><td>80%</td></tr></tbody></table></div><div><p><strong>Group definition note</strong></p><p>The 260 students who did not engage include flagged students with no recorded engagement, whether or not they received recorded support contact. They must not be described simply as students who were never contacted.</p></div><section><h4>Worked calculations</h4><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Group</th><th scope="col">Calculation</th><th scope="col">Explanation</th></tr></thead><tbody><tr><td>Engaged with support</td><td>216 ÷ 240 × 100 = 90%</td><td>Of the 240 flagged students who engaged, 216 were still enrolled at the preliminary reporting point.</td></tr><tr><td>Did not engage with support</td><td>208 ÷ 260 × 100 = 80%</td><td>Of the 260 flagged students who did not engage, 208 were still enrolled at the same preliminary reporting point.</td></tr></tbody></table></div></section><section><h4>Observed difference</h4><dl><div><dt>Calculation</dt><dd>90% − 80% = 10 percentage points</dd></div><div><dt>Result</dt><dd>10 percentage points</dd></div><div><dt>Interpretation</dt><dd>The preliminary enrolment rate was ten percentage points higher in the engaged group than in the non-engaged group.</dd></div><div><dt>Qualification</dt><dd>This is an observed difference between groups. It does not establish that support engagement caused the difference.</dd></div></dl></section></section><div><p><strong>Reading guidance</strong></p><p>Read the support pathway first, then the enrolment comparison. In the comparison, read each row from the group name through its denominator, numerator and rate. The percentages describe proportions within different-sized groups, so the raw counts of 216 and 208 should not be compared without their denominators.</p></div><div><p><strong>Scope note</strong></p><p>These are provisional enrolment indicators from NB-SSI-01, not final continuation outcomes. The comparison concerns engagement among SSI-flagged students, not all first-year students at Northbridge University.</p></div><p>Northbridge&#39;s preliminary evaluation recorded 500 SSI-flagged students. Of these, 400 received recorded personalised support contact, and 240 attended at least one support conversation. Engagement therefore represented 60% of contacted students and 48% of all flagged students. Among the 240 engaged students, 216, or 90%, were still enrolled at the preliminary reporting point. Among the 260 flagged students who did not engage, 208, or 80%, were still enrolled. The observed difference was ten percentage points. The comparison does not establish that engagement caused the difference.</p></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="exposition-S3" data-section-id="S3" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">From an observed difference to a causal claim</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>We now know precisely what the figures describe. Among SSI-flagged students, those who engaged with support had a higher preliminary enrolment rate than those who did not. That is an observation: a description of what was recorded.</p><p>The finding also shows an association. An association exists when two measured characteristics occur together in a pattern. Here, engagement status and preliminary enrolment status are associated: the group recorded as engaging had a higher proportion still enrolled. Association describes a relationship in the data. It does not, on its own, explain why the relationship exists.</p><p>Causation is a stronger claim. To say that engagement caused higher enrolment is to say that engaging with support made a difference to whether students remained enrolled. That is a possible explanation, but the observed percentages do not establish it.</p><p>Imagine one of the 240 students who engaged with support. We know that this student attended at least one conversation. What we cannot directly observe is what would have happened to that same student, under otherwise comparable circumstances, if they had not engaged. That unobserved alternative is called a counterfactual. Causal reasoning asks whether the outcome would have been different under that alternative condition.</p><p>It may seem that the 260 non-engaged flagged students provide the answer. But they are different people, not the same students experiencing an alternative version of events. Their circumstances, motivations and existing sources of help might differ. Without addressing those possible differences, the outcome for the non-engaged group cannot simply be treated as what would have happened to the engaged group without support.</p><p>Compare three ways of describing the finding. &#39;Ninety per cent of engaged flagged students and eighty per cent of non-engaged flagged students were still enrolled at the preliminary reporting point&#39; is a direct observation. &#39;The higher enrolment rate among engaged students is consistent with the possibility that support was beneficial&#39; is a cautious interpretation. &#39;Engaging with support increased enrolment by ten percentage points&#39; asserts a causal effect that these figures have not established.</p><p>The university&#39;s preliminary summary described the difference as encouraging and recommended continuing the pilot while collecting more evidence. That recommendation is a judgement about what to do with the available information. It should not be confused with a further measurement or proof of causation.</p><p>Uncertainty about causation does not make the observed association disappear. The figures may point towards a useful intervention. Equally, the difference may have other explanations. A defensible reading keeps both possibilities in view rather than moving directly from a promising pattern to a certain explanation.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material util-exposition-structured-fallback" data-material-id="XM-S3-01" data-material-kind="Claim-strength comparison" data-material-type="expository_structured_fallback" data-section-id="S3" data-expository-structured="fallback"><h3>Three claims about the same finding</h3><div><p><strong>Introduction</strong></p><p>The same preliminary figures can support statements of different strengths. The distinction is not whether a statement sounds positive or negative, but whether its wording goes beyond what was observed.</p></div><section><h4>Comparison</h4><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Claim type</th><th scope="col">Statement</th><th scope="col">Evidential status</th></tr></thead><tbody><tr><td>Direct observation</td><td>Among SSI-flagged students, 90% of those who engaged with support and 80% of those who did not engage were still enrolled at the preliminary reporting point.</td><td>Supported by the recorded preliminary figures. It identifies the comparison groups, the observed rates and the reporting point.</td></tr><tr><td>Cautious interpretation</td><td>The ten-percentage-point difference in preliminary enrolment rates between engaged and non-engaged flagged students is encouraging and consistent with the possibility that support was beneficial.</td><td>A reasonable interpretation, provided that possible benefit is not treated as established causation. Other explanations remain possible.</td></tr><tr><td>Unsupported causal assertion</td><td>Support engagement caused the ten-percentage-point difference in preliminary enrolment rates between the two groups of flagged students.</td><td>Not established by the preliminary comparison. The groups were not randomly assigned, and other differences between students could have contributed to the observed pattern.</td></tr></tbody></table></div></section><section><h4>Conceptual distinctions</h4><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Concept</th><th scope="col">Meaning</th></tr></thead><tbody><tr><td>Observation</td><td>A statement about what was recorded or measured.</td></tr><tr><td>Association</td><td>A pattern in which two measured characteristics vary together. Here, recorded engagement status is associated with preliminary enrolment status.</td></tr><tr><td>Causation</td><td>A claim that one factor produced a change in an outcome. Establishing this requires more than observing that two groups have different outcomes.</td></tr><tr><td>Evaluative opinion</td><td>A judgement about the significance or implications of the evidence, such as describing the finding as encouraging. It should be distinguished from the recorded result itself.</td></tr></tbody></table></div></section><div><p><strong>Why the claims differ</strong></p><p>The first statement stays within the recorded evidence. The second adds an interpretation but signals that benefit is possible rather than proven. The third moves from association to causation without establishing that the engaged and non-engaged groups were otherwise comparable. Because the students were not randomly assigned to engage, differences in motivation, circumstances or existing support could have influenced both engagement and enrolment.</p></div><div><p><strong>Important qualification</strong></p><p>Rejecting the unsupported causal assertion does not mean rejecting the observed positive association. The preliminary result remains potentially informative even though its cause is uncertain.</p></div><p>A direct observation reports that 90% of engaged flagged students and 80% of non-engaged flagged students were still enrolled at the preliminary reporting point. A cautious interpretation describes this ten-percentage-point difference as encouraging and consistent with possible benefit. An unsupported causal assertion says that engagement caused the difference. The causal assertion exceeds the evidence because students were not randomly assigned to the groups and plausible alternative explanations remain.</p></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="exposition-S4" data-section-id="S4" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Why else might the groups differ?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Why might students who engaged with support have been more likely to remain enrolled even if engagement was not the only reason? The answer begins with how the two groups were formed.</p><p>The students were not randomly assigned to engage or not engage. Instead, engagement depended on whether students attended a support conversation after contact. This means that group membership could be related to other characteristics of the students. When those characteristics also influence the measured outcome, they can produce what is called a selection effect.</p><p>Consider a hypothetical explanation. Some students may have been especially motivated to resolve academic difficulties. That motivation could make them more likely to attend a support conversation when contacted. It could also make them more likely to remain enrolled because they were already taking steps to address difficulties, regardless of the particular conversation recorded by the evaluation.</p><p>The reasoning has two parts. First, a possible characteristic influences whether someone enters the engaged group. Second, the same characteristic could influence whether that person remains enrolled. If both pathways exist, some of the observed difference between groups might reflect that characteristic rather than the effect of support engagement itself.</p><p>This is not a claim that Northbridge measured student motivation or found it to explain the result. It is a plausible alternative explanation constructed to test the strength of a causal interpretation. Other possibilities could involve students&#39; personal circumstances or the support already available to them. The preliminary summary does not provide enough information to establish which explanation, or combination of explanations, accounts for the observed difference.</p><p>There is also no need to choose between &#39;support helped&#39; and &#39;the groups were different&#39; as if only one could be true. Support conversations might genuinely benefit some students, while differences in motivation or circumstances also contribute to the observed pattern. The figures alone cannot tell us how much of the difference, if any, should be attributed to engagement.</p><p>This is why a credible alternative explanation must do more than name a vague possibility. It should identify a characteristic that could differ between groups and explain how that characteristic might influence both engagement and enrolment. The explanation need not be proven to show why a stronger causal claim is not yet justified. But it must remain clearly hypothetical until supported by evidence.</p><p>The 90% versus 80% result is therefore compatible with more than one account of what happened. Recognising that plurality is part of careful interpretation, not a reason to disregard the finding.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material util-exposition-structured-fallback" data-material-id="XM-S4-01" data-material-kind="Hypothetical selection-effect relationship diagram" data-material-type="expository_structured_fallback" data-section-id="S4" data-expository-structured="fallback" data-representation-spec-suppressed="section-figure"><h3>How a selection effect could contribute to the difference</h3><p>Imagine that some flagged students were already more motivated to address academic difficulties than others. That motivation could make them more likely to attend a support conversation. It could independently make them more likely to remain enrolled. Because the same possible characteristic influences both engagement and enrolment, some of the observed difference between groups might reflect selection rather than the effect of engagement alone. This is a hypothetical explanation, not a measured Northbridge finding. Support could still have been beneficial.</p></article></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--section-after-content" data-visual-slot="section-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-s4-selection-effect-01-section-s4-section-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/section-after-content.png" alt="Hypothetical selection-effect diagram showing possible pre-existing motivation pointing separately towards recorded support engagement and preliminary enrolment." aria-describedby="figure-description-asset-vb-38-4-va-s4-selection-effect-01-section-s4-section-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> A possible pre-existing characteristic could influence both support engagement and preliminary enrolment, complicating causal interpretation of the observed difference.</figcaption><p class="util-visual-asset-detailed-description" id="figure-description-asset-vb-38-4-va-s4-selection-effect-01-section-s4-section-after-content">The diagram contains three labelled nodes. On the left is &#39;Possible pre-existing motivation to address academic difficulties&#39;, marked as hypothetical. Two separate arrows lead from this node. The upper arrow, labelled &#39;Might influence engagement&#39;, points to &#39;Recorded support engagement&#39;. The lower arrow, labelled &#39;Might influence remaining enrolled&#39;, points to &#39;Preliminary enrolment&#39;. Both arrows are explicitly hypothetical. There is no causal arrow between engagement and enrolment. A note explains that the pathways illustrate a possible selection effect rather than a finding established by Northbridge. The figure demonstrates how one possible student characteristic could influence both membership of the engaged group and the measured outcome, leaving the cause of the observed association uncertain.</p></figure></section><section class="util-exposition-section" data-region-item="exposition-section" id="exposition-S5" data-section-id="S5" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">What was measured, and what remains unknown?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>So far, we have considered whether the difference between the two groups was caused by support engagement. A separate question is whether the recorded measures tell us everything we might want to know about support and student success.</p><p>The evaluation defines support engagement as attendance at least once at a support conversation. This is an operational definition: a practical rule for deciding what will count as evidence of a broader concept. It allows the university to count engagement consistently. But it also sets a boundary around what the count means.</p><p>A student who attended one conversation meets the definition of engagement. The figure does not tell us whether the conversation lasted a short or long time, whether the advice was useful, whether the student acted on it or whether their circumstances improved. Those possibilities are not interchangeable with the recorded fact of attendance.</p><p>Similarly, support contact means a recorded personalised offer of academic support. It does not mean that the student accepted the offer or received an effective intervention. The distinction between 400 contacted students and 240 engaged students reflects that difference in what was recorded.</p><p>The enrolment outcome also has a specific meaning. The preliminary summary reports whether students were still enrolled at its reporting point. That is not the same as establishing that they continued into the following academic year. Nor does remaining enrolled tell us everything about how a student is learning or feeling. A student can be enrolled while experiencing difficulties, and a count of enrolled students does not directly measure confidence, wellbeing, satisfaction or educational achievement.</p><p>These are measurement limitations. They do not imply that the university&#39;s recorded figures are necessarily inaccurate. Instead, they tell us which questions the figures answer and which questions require different or additional evidence.</p><p>Incomplete information introduces a related difficulty. To understand why the engagement groups differed, we might want to know more about their circumstances and existing sources of support. To understand the value of a support conversation, we might want evidence beyond whether it occurred. The preliminary summary does not establish those wider matters.</p><p>An accurate statement therefore stays close to the measurement: &#39;Students recorded as engaging were more likely to be still enrolled at the preliminary reporting point.&#39; A broader statement such as &#39;Students who engaged were more successful because SSI improved their learning and wellbeing&#39; makes several additional claims that the available measures cannot support.</p><p>Careful interpretation does not demand that one dataset answer every question. It requires recognising the questions it can answer reliably, the questions it cannot resolve and the additional assumptions hidden in stronger claims.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="exposition-S6" data-section-id="S6" data-expository-section-role="terminal-close" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Making a judgement that fits the evidence</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation" data-expository-closure="terminal"><p>We can now bring the pieces together. The preliminary Northbridge evidence records a clear difference: among the 500 students flagged by SSI, 216 of 240 who engaged with support (90%) were still enrolled at the preliminary reporting point, compared with 208 of 260 who did not engage (80%). The observed difference is ten percentage points.</p><p>That statement is specific about the groups, the outcome and the reporting point. It is also informative. The higher enrolment rate among engaged students is consistent with the possibility that support conversations were beneficial. It gives the university a reason to take the pilot seriously and investigate further.</p><p>The same evidence does not establish that engagement produced the difference. Students were not randomly assigned to the two groups. They may have differed in characteristics that influenced both engagement and enrolment. The available information does not exclude those alternative explanations. Engagement also records attendance at least once, while the outcome records preliminary enrolment rather than final continuation or broader educational experience.</p><p>Consider the claim: &#39;SSI increased student retention by ten percentage points.&#39; It moves beyond the evidence in several ways. It attributes a causal effect to SSI, treats the observed difference as an improvement produced by the system and uses a broader outcome description than the preliminary measure warrants.</p><p>A more proportionate interpretation would be: &#39;In Northbridge&#39;s preliminary evaluation, SSI-flagged students who engaged with support had a higher enrolment rate at the reporting point than flagged students who did not engage, 90% compared with 80%. This is encouraging and consistent with possible benefit, but it does not establish that support engagement caused the difference. Other characteristics of the students may have contributed, and the figures do not describe final continuation or the wider quality of their educational experience.&#39;</p><p>This interpretation is not weaker because it contains qualifications. It is stronger as reasoning because each part is matched to what the evidence can support. The observed difference is retained, the possible benefit is acknowledged, and uncertainty is located precisely rather than expressed as a vague doubt about everything.</p><p>Confidence can also be more carefully calibrated. You might have substantial confidence that the preliminary summary reports a 90% versus 80% association, while having less confidence that engagement caused that difference. You might consider the finding promising without being ready to conclude how effective SSI is. These positions are compatible because they concern different claims.</p><p>Think again about the reasons behind the provisional judgement you brought from The Promising Pilot. If a reason depended on the observed difference, that evidence remains relevant. If it depended on treating the difference as proof of a causal effect, that part of the reasoning needs qualification. Your overall judgement may change, become more tentative or remain broadly similar for more carefully stated reasons. No particular response follows automatically from the preliminary figures.</p><p>Evidence-informed judgement involves making the strongest claim the evidence warrants, not the strongest claim that sounds persuasive. In this case, the finding is promising but provisional; the association is observed, while its explanation remains uncertain. That combination is the foundation for reading further evidence without either dismissing early positive results or allowing them to settle the matter prematurely.</p><p>In When the Evidence Changes, you will use these distinctions to consider additional findings and examine whether they support, challenge or qualify your initial interpretation. The aim is not to defend a first impression at all costs, but to keep the relationship between evidence, explanation and confidence clear as the available picture develops.</p></div></section></section></article></template><template id="lj-resource-c3"><article class="util-learner-page util-page util-learner-renderer-vnext" data-renderer="vnext" data-page-kind="interactive" data-persistence-page-key="v1::5709435c-6757-4d78-9226-160e83209ee7::learner-page::2.0.0::a1-a2-a3-a4::student-support-insight:-weighing-new-evidence" data-persistence-storage-key="learner-renderer-vnext:draft:v1::5709435c-6757-4d78-9226-160e83209ee7::learner-page::2.0.0::a1-a2-a3-a4::student-support-insight:-weighing-new-evidence" data-composition-mode="moments" data-composed-activity-count="4" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">When the Evidence Changes</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="6"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 6"><span class="util-journey-position__visible" aria-hidden="true">1 of 6</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#activity-A1" aria-label="Next section: Compare the Continuation Findings"><span class="util-journey-adjacent__title">Compare the Continuation Findings</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#activity-A1">Compare the Continuation Findings</a></li><li><a class="util-journey-all-link" href="#activity-A2">Weigh Benefits and Operational Concerns</a></li><li><a class="util-journey-all-link" href="#activity-A3">Reconcile the Evidence</a></li><li><a class="util-journey-all-link" href="#activity-A4">Reconsider Your Initial Judgement</a></li><li><a class="util-journey-all-link" href="#journey-study-tips">Study tips</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c3/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This self-study resource continues the Northbridge University Student Support Insight case. Begin with the comparison of preliminary and final findings, then examine operational evidence and student accounts. Use your completed comparisons to develop a qualified synthesis before revisiting your earlier judgement and confidence. The four activities are designed to be completed in order, but you can return to earlier evidence whenever you need to.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The sequence separates four connected stages of judgement: establishing what the records show, assessing the weight of different sources, reconciling apparently conflicting findings, and reconsidering a provisional position. Each stage includes a response workspace and diagnostic review. The final activity also asks you to communicate an evidence-based distinction to a student audience. You are not being asked to make the university&#39;s final policy decision.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><p>Northbridge University introduced Student Support Insight (SSI) in September 2025 as an AI-assisted, staff-reviewed process for identifying first-year students who might benefit from academic support. SSI flags do not diagnose students, determine grades or impose sanctions. Students can decline support, and conventional routes to support remain available.</p><p>The Student Success Committee is considering evidence about the system. Earlier in the case, <strong>The Promising Pilot</strong> introduced preliminary findings and invited a provisional judgement. <strong>Reading the Evidence Carefully</strong> examined how to interpret that evidence. This resource introduces later records, operational observations and selected student experiences. Your task is to examine how additional evidence affects the strength, scope and confidence of an interpretation.</p><h3 class="util-md-heading util-md-heading--source-3">Comparing evidence fairly</h3><p>A comparison is meaningful only when you know <strong>who is counted, what is measured and when it is measured</strong>. A numerator identifies the number meeting an outcome; a denominator identifies the group from which that number comes. A percentage without its denominator can conceal an important difference in population. Similarly, preliminary enrolment and final continuation refer to different reporting points. A historical comparison involves students from different academic years, not necessarily otherwise equivalent groups.</p><p>A <strong>percentage-point difference</strong> is the arithmetic difference between two percentages. It is not the same as a relative percentage change. For example, rates of 60% and 65% differ by five percentage points. That calculation describes a difference; it does not explain why the difference arose.</p><h3 class="util-md-heading util-md-heading--source-3">Association, causation and alternative explanations</h3><p>An <strong>association</strong> means that two recorded characteristics or outcomes occur together in a particular pattern. A <strong>causal claim</strong> goes further: it asserts that one factor produced a change in another. Students who choose to engage with support may differ from students who do not in motivation, circumstances or existing support networks. These differences are examples of possible <strong>selection effects</strong>. Changes occurring at the same time as SSI may also affect outcomes. Such possibilities matter when evaluating causal claims, although identifying a plausible explanation does not demonstrate that it actually caused an outcome.</p><p>An <strong>evaluation limitation</strong> identifies a boundary on what a source can establish. Relevant boundaries include incomplete records, non-equivalent comparison groups, limited outcome measures and the absence of a suitable comparison with alternative support provision. Limitations need not make evidence worthless; they determine which claims remain defensible.</p><h3 class="util-md-heading util-md-heading--source-3">Weighing different kinds of evidence</h3><p>Quantitative records can establish counts, rates and observed differences within defined populations. Operational records can illuminate whether a process reached students, relied on complete information or required additional staff effort. Individual accounts can reveal experiences that aggregate measures do not describe. These sources address related but different questions.</p><p>A selected group is not automatically representative of the wider student population. Similarly, an individual statement may be valuable evidence of one person&#39;s experience without establishing how frequently that experience occurs. <strong>False positives</strong> and <strong>false negatives</strong> concern whether a system incorrectly identifies or fails to identify cases against an appropriate reference standard. Neither an observed flag-rate difference between groups nor a selected set of students seeking support is, on its own, a reliable measure of overall classification error.</p><p>An observed difference between groups may warrant further investigation into fairness, support needs and outcomes. However, the difference alone does not establish discriminatory treatment, unequal identification accuracy or the cause of the pattern.</p><h3 class="util-md-heading util-md-heading--source-3">Synthesising evidence and calibrating confidence</h3><p><strong>Evidence synthesis</strong> involves more than adding up favourable and unfavourable findings. It asks whether apparently conflicting observations concern the same populations, outcomes, reporting points or kinds of evidence. Two findings may coexist because they answer different questions. A defensible synthesis identifies what is directly supported, what remains plausible but untested, and what additional evidence would help resolve uncertainty.</p><p>Your <strong>interpretation</strong> is what you currently judge the evidence to mean. Your <strong>confidence</strong> is how securely you hold that interpretation given the quality, completeness and limitations of the evidence. These judgements should be considered separately: an interpretation can remain unchanged while confidence rises or falls, and a changed interpretation is not automatically a better one. The aim is to make the reasoning behind either change or continuity inspectable.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c3/knowledge-summary-after-content.png" alt="Concept map linking evidence sources, inferential limits, qualified interpretation and confidence; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> How evidence types, limitations and alternative explanations inform a qualified interpretation and confidence.</figcaption><p class="util-visual-asset-detailed-description" id="figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">Three evidence-source categories are shown: quantitative outcome records, operational observations and individual accounts. Outcome records connect to populations, denominators, outcomes and reporting points; operational observations connect to completeness, reach and workload; individual accounts connect to reported experiences and limits on representativeness. These checks inform the scope of warranted inferences. A separate distinction identifies association as insufficient to establish causation. Alternative explanations and unresolved questions feed into qualified synthesis. Interpretation and confidence appear as separate, related judgements rather than a single automatic result.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Compare the preliminary enrolment findings and final continuation data for Northbridge University&#39;s Student Support Insight initiative, distinguishing observed associations from causal claims and explaining how reporting points, comparison groups and alternative explanations limit the conclusions that can be drawn. <span class="util-outcome-id">(LO1)</span></li><li>Evaluate the significance and limitations of quantitative operational findings and selected qualitative accounts, distinguishing evidence of possible educational benefit, implementation difficulties and equity concerns from conclusions that the available evidence cannot establish. <span class="util-outcome-id">(LO2)</span></li><li>Synthesise apparently conflicting findings into a balanced interpretation of SSI, explaining how differences in populations, measures, evidence sources and plausible alternative explanations affect the weight assigned to each finding. <span class="util-outcome-id">(LO3)</span></li><li>Reassess an earlier provisional judgement about SSI and justify whether that judgement and the confidence attached to it should change, remain or become more qualified, explicitly relating the revised position to the relative strength of the new evidence and unresolved uncertainties. <span class="util-outcome-id">(LO4)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Compare the Continuation Findings</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Establish an accurate understanding of the new continuation evidence and the limitations of comparisons across groups, reporting points and historical cohorts.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The initial evaluation suggested an encouraging relationship between support engagement and enrolment. This activity examines whether that interpretation remains proportionate when final continuation results and evaluation limitations become available.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>If you completed &#39;The Promising Pilot&#39;, revisit your provisional judgement and confidence. Draw also on the distinction between association and causation explored in &#39;Reading the Evidence Carefully&#39;. Use these as starting points for examining newly available evidence, rather than assuming your earlier interpretation was right or wrong.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Compare like with like before drawing conclusions. Identify the population, denominator, outcome definition and reporting point for each finding. Distinguish what the figures show from what they cannot establish.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which comparison most affects your interpretation of the earlier positive evaluation, and what can that comparison legitimately establish?</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the preliminary evaluation, final continuation records and evaluation limitations note.</p></span></div><article class="util-material-block util-material-table-block" data-material-id="A1-M1" data-material-type="data_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Preliminary Enrolment and Final Continuation Records</span></p><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-01 — Initial Evaluation Summary</h3><p><strong>Northbridge University | 12 March 2026 | Fictional institutional record</strong></p><p>Student Support Insight (SSI) is an AI-assisted, staff-reviewed process for identifying first-year students who may benefit from academic support.</p><h3 class="util-md-heading util-md-heading--source-3">Recorded support activity</h3><div class="util-table-scroll util-material-table"><table><thead><tr><th>Measure</th><th>Students</th></tr></thead><tbody><tr><td>First-year students flagged by SSI</td><td>500</td></tr><tr><td>Flagged students receiving recorded personalised support contact</td><td>400</td></tr><tr><td>Flagged students engaging in at least one support conversation</td><td>240</td></tr></tbody></table></div><h3 class="util-md-heading util-md-heading--source-3">Preliminary enrolment</h3><div class="util-table-scroll util-material-table"><table><thead><tr><th>Flagged student group</th><th>Enrolled at preliminary reporting point</th><th>Group total</th><th>Reported percentage</th></tr></thead><tbody><tr><td>Engaged with support</td><td>216</td><td>240</td><td>90.0%</td></tr><tr><td>Did not engage with support</td><td>208</td><td>260</td><td>80.0%</td></tr></tbody></table></div><p>These figures concern enrolment at the preliminary reporting point, not final continuation. The recorded group difference is an association; the record does not establish that SSI or engagement caused it.</p><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-02 — Final Continuation Data</h3><p><strong>Northbridge University | 5 June 2026 | Continuation cut-off: 31 May 2026 | Fictional institutional record</strong></p><h3 class="util-md-heading util-md-heading--source-3">Final continuation among flagged students</h3><div class="util-table-scroll util-material-table"><table><thead><tr><th>Flagged student group</th><th>Continued</th><th>Group total</th><th>Reported percentage</th></tr></thead><tbody><tr><td>Engaged with support</td><td>211</td><td>240</td><td>87.9%</td></tr><tr><td>Did not engage with support</td><td>205</td><td>260</td><td>78.8%</td></tr><tr><td>All flagged students</td><td>416</td><td>500</td><td>83.2%</td></tr></tbody></table></div><h3 class="util-md-heading util-md-heading--source-3">Final continuation across the first-year cohort</h3><div class="util-table-scroll util-material-table"><table><thead><tr><th>Student group</th><th>Continued</th><th>Group total</th><th>Reported percentage</th></tr></thead><tbody><tr><td>Flagged by SSI</td><td>416</td><td>500</td><td>83.2%</td></tr><tr><td>Not flagged by SSI</td><td>1365</td><td>1500</td><td>91.0%</td></tr><tr><td>All first-year students, 2025/26</td><td>1781</td><td>2000</td><td>89.1%</td></tr></tbody></table></div><h3 class="util-md-heading util-md-heading--source-3">Historical overall continuation</h3><div class="util-table-scroll util-material-table"><table><thead><tr><th>Academic year</th><th>Continued</th><th>Group total</th><th>Reported percentage</th></tr></thead><tbody><tr><td>2024/25</td><td>1720</td><td>2000</td><td>86.0%</td></tr><tr><td>2025/26</td><td>1781</td><td>2000</td><td>89.1%</td></tr></tbody></table></div><p>The reported difference between the rounded overall continuation rates is <strong>3.1 percentage points</strong>.</p><p>The preliminary and final records have different reporting points and outcome descriptions. Use their recorded populations, denominators and dates when constructing your comparisons. Neither a group difference nor a historical difference establishes an SSI causal effect.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Complete the comparison workspace for the engaged and non-engaged flagged groups, the flagged and unflagged groups, and the historical overall comparison.</p></span></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a1-comparison-boundaries-01-activity-a1-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c3/activity-a1-materials-entry.png" alt="Three comparison contexts showing distinct student groups and reporting points; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-a1-comparison-boundaries-01-activity-a1-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 2.</strong> Three different comparison contexts: check the population, outcome and reporting point before interpreting a difference.</figcaption><p class="util-visual-asset-detailed-description" id="figure-description-asset-vb-38-4-va-a1-comparison-boundaries-01-activity-a1-materials-entry">The first context concerns preliminary enrolment among flagged students, separating those who engaged with support from those who did not. The second concerns final continuation, comparing flagged and unflagged students at the 31 May 2026 cut-off. The third concerns overall continuation for the separate 2024/25 and 2025/26 first-year cohorts. Each context identifies its population and outcome boundary. No numerical results, difference magnitudes or causal conclusions are supplied.</p></figure><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a1-a1-m3" data-material-source-id="A1-M3" data-activity-id="A1"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A1-M3" data-material-type="comparison_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Evidence Comparison Workspace</span></p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="a1-a1-m3-col-comparison-0">Comparison</th><th scope="col" id="a1-a1-m3-col-groups-and-reporting-points-1">Groups and reporting points</th><th scope="col" id="a1-a1-m3-col-observed-finding-2">Observed finding</th><th scope="col" id="a1-a1-m3-col-what-it-supports-3">What it supports</th><th scope="col" id="a1-a1-m3-col-limitation-or-alternative-explanation-4">Limitation or alternative explanation</th></tr></thead><tbody><tr><th scope="row" id="a1-a1-m3-row-0" class="util-learner-table-workspace
