j-shell-live" class="lj-shell__live" aria-live="polite" aria-atomic="true"></div><main id="lj-shell-main" class="lj-shell__main" data-lj-role="active-resource" aria-label="Learning content" tabindex="-1"></main></div></div><div class="lj-shell__templates" hidden aria-hidden="true"><template id="lj-resource-overview"><article class="lj-shell-overview" data-lj-overview="true" role="region" aria-labelledby="lj-shell-overview-heading"><h2 id="lj-shell-overview-heading" class="lj-shell-overview__title" data-lj-resource-title="true" tabindex="-1">Overview</h2><div class="util-editorial-opening" data-region="editorial-opening"><figure class="util-visual-asset util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-figure-number="1"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/editorial-opening.png" alt="" loading="lazy" decoding="async" /></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> A quiet British university student support meeting room with a table, empty chairs, notebooks and an unopened folder labelled Student Support Insight.</figcaption></figure></div><div class="lj-shell-overview__body"><p>A university introduces a new way of identifying students who might benefit from academic support. The early findings look promising. But what happens when further evidence raises difficult questions?</p><p>In this fictional case, you will follow Northbridge University as it considers the future of an AI-assisted student support initiative. You will interpret institutional findings, examine competing explanations, consider the experiences of students and staff, and recommend what the university should do next.</p><p>The challenge is not to understand how an AI system is built. It is to decide what evidence can justify, what remains uncertain and how an institution should act when different considerations point in different directions.</p><p>The journey takes approximately <strong>90 minutes</strong> and can be completed independently in one day. You do not need specialist knowledge of AI, statistics or university management. Everything needed for the case is provided as you progress.</p><p>You will encounter the evidence in stages. At first, you will know only what the university knew when its initial evaluation appeared encouraging. Later experiences will introduce further findings and perspectives. Keep a note of your initial judgement and how confident you feel about it: you will return to both.</p><p>By the end, you should be able to distinguish findings from interpretations, assess limitations, weigh stakeholder consequences and justify a proportionate recommendation without pretending that all uncertainty has disappeared. There may be more than one defensible decision; what matters is the quality of your reasoning.</p></div></article></template><template id="lj-resource-c1"><article class="util-learner-page util-page util-learner-renderer-vnext" data-renderer="vnext" data-page-kind="interactive" data-persistence-page-key="v1::22413210-0d16-40e4-93bf-4abac348bfd6::learner-page::2.0.0::a1-a2-a3-a4::the-promising-pilot:-making-sense-of-early-evidence" data-persistence-storage-key="learner-renderer-vnext:draft:v1::22413210-0d16-40e4-93bf-4abac348bfd6::learner-page::2.0.0::a1-a2-a3-a4::the-promising-pilot:-making-sense-of-early-evidence" data-composition-mode="moments" data-composed-activity-count="4" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">The Promising Pilot</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="5"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 5"><span class="util-journey-position__visible" aria-hidden="true">1 of 5</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#activity-A1" aria-label="Next section: How SSI Offers Student Support"><span class="util-journey-adjacent__title">How SSI Offers Student Support</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#activity-A1">How SSI Offers Student Support</a></li><li><a class="util-journey-all-link" href="#activity-A2">What Do the Early Figures Show?</a></li><li><a class="util-journey-all-link" href="#activity-A3">Make Your Initial Case</a></li><li><a class="util-journey-all-link" href="#activity-A4">How Confident Is Your Judgement?</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This self-study resource introduces a fictional university&#39;s AI-assisted student support initiative and its first evaluation. Begin by exploring how the system operates, then examine the preliminary evidence before recording your own judgement and confidence. The four activities take approximately 12 minutes and are designed to be completed in order.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The first two activities establish the support pathway and the evidence needed for an informed interpretation. The final two activities use that interpretation to develop a provisional position, explain its limitations and communicate uncertainty to another audience. Your initial reasoning provides a point of comparison for later work in <em>Reading the Evidence Carefully</em>.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><p>Northbridge University is a fictional public university in England. Like many universities, it wants to help students who may encounter academic difficulties, particularly during the transition into their first year. In September 2025, it introduced <strong>Student Support Insight (SSI)</strong>, an AI-assisted initiative intended to help staff identify students who might benefit from timely academic support.</p><h3 class="util-md-heading util-md-heading--source-3">From information to support</h3><p>SSI uses information already held by the university, including engagement with learning systems, attendance where available and assignment submission patterns. The system identifies possible support needs, but <strong>identification is not intervention</strong>. A support flag indicates that a student may benefit from attention; authorised staff review that indication and decide whether personalised contact is appropriate. A student who receives an offer can choose whether to participate in a support conversation. Conventional academic support remains available independently of SSI.</p><p>These distinctions matter because a system can identify more students than staff subsequently contact, and not everyone contacted will engage. A flag does not diagnose a student, determine academic ability, award grades or impose sanctions. Human judgement and student choice remain part of the pathway.</p><h3 class="util-md-heading util-md-heading--source-3">Understanding the evidence</h3><p>An evaluation can report several different kinds of information. <strong>Process measures</strong> describe what happened along a support pathway, such as the number of students flagged, contacted or engaged. <strong>Outcome measures</strong> describe a subsequent condition, such as whether students are still enrolled at a particular reporting point. These measures answer different questions and should not be treated as interchangeable.</p><p>Percentages need careful reading because every percentage has a <strong>denominator</strong>: the group against which the count is measured. For example, if 30 out of 50 students participate in an unrelated workshop, the participation rate is 60% of that group. If two groups have different outcome rates, the absolute difference between their percentages is measured in <strong>percentage points</strong>. The groups and outcomes must be identified before that difference can be interpreted meaningfully.</p><p>A further distinction is between <strong>association</strong> and <strong>causation</strong>. An association describes a relationship observed in the available data. A causal claim goes further: it proposes that one event or intervention produced a change in another. When students choose whether to participate in support, those who engage may differ from those who do not for reasons unrelated to the support itself. A comparison of their outcomes does not automatically separate those possibilities.</p><p><strong>Timing also matters.</strong> Being enrolled at a preliminary reporting point is not necessarily the same as continuing into a subsequent academic year. The wording of an outcome should match what was actually measured.</p><h3 class="util-md-heading util-md-heading--source-3">From evidence to judgement</h3><p>Institutional decisions rarely depend on a single figure. The potential value of timely support must be considered alongside what an evaluation establishes and what remains uncertain. A <strong>provisional judgement</strong> is a reasoned position formed using the evidence currently available, with recognition that further evidence may justify reconsideration.</p><p>A judgement has two related but distinct dimensions: <strong>position</strong>, meaning what you currently favour, and <strong>confidence</strong>, meaning how securely the evidence supports that position. Someone can favour an initiative while having limited confidence in its demonstrated effectiveness, or remain undecided despite recognising encouraging observations. Neither position nor confidence should be treated as a substitute for reasons.</p><p>As you work through the activities, distinguish what the records report, what you infer from them and what remains unknown. Your task is not to discover a predetermined correct decision, but to develop an explanation whose strength matches the evidence.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/knowledge-summary-after-content.png" alt="Concept map linking SSI support stages, preliminary evidence and provisional judgement; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> Connect SSI&#39;s human-mediated support pathway to the interpretation of preliminary evidence and the formation of a qualified judgement.</figcaption><p class="util-visual-asset-detailed-description" id="figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">The map begins with existing student engagement information contributing to SSI support flags. A flag leads to possible staff review and personalised contact, not automatic intervention. Students may choose whether to engage; conventional support remains independently available. The stages of flagging, contact and engagement connect to process measures, while preliminary enrolment is a separate outcome measure. Observed comparisons lead to interpretation and recognition of evidence limitations, not directly to a causal conclusion. Supporting reasons and uncertainty connect to a provisional position and the confidence placed in it.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Describe the purpose of Student Support Insight (SSI) and distinguish between a support flag, a personalised support contact and engagement in a support conversation. <span class="util-outcome-id">(LO1)</span></li><li>Interpret the preliminary evaluation findings by identifying the groups compared, explaining the 90% and 80% enrolment rates, and distinguishing the observed association from a demonstrated causal effect. <span class="util-outcome-id">(LO2)</span></li><li>Form and justify a provisional judgement about whether SSI appears worth continuing, using the preliminary evidence and acknowledging at least one relevant uncertainty. <span class="util-outcome-id">(LO3)</span></li><li>Express and justify a level of confidence in the provisional judgement, identifying how the strength and limitations of the available evidence influence that confidence. <span class="util-outcome-id">(LO4)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">How SSI Offers Student Support</h2><div class="util-badge-row"><span class="util-badge util-badge-time">3 min</span></div></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Establish the institutional context and construct an accurate mental model of the SSI support pathway.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The central question in The Promising Pilot is whether encouraging early evidence makes an institutional initiative worth continuing. A sound judgement begins by distinguishing the technology&#39;s role from the actions of staff and students.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Northbridge University is a fictional public university in England. In September 2025, it introduced Student Support Insight (SSI) to help identify first-year students who might benefit from an academic support conversation. Before considering the early results, establish what the system actually does and what remains a human decision.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Follow the pathway from identifying a possible need to offering support and deciding whether to engage. Keep system-generated flags, staff decisions and student choices separate.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Explain why a flag, an offer of support and participation in a conversation represent different stages rather than three descriptions of the same event.</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A1"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Read the short institutional introduction and the explanation of SSI&#39;s support pathway.</p></span></div></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a1-support-pathway-01-activity-a1-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/activity-a1-materials-entry.png" alt="Conditional SSI pathway from support flag through staff review to optional student engagement; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-a1-support-pathway-01-activity-a1-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 2.</strong> Show where staff judgement and student choice separate identification, contact and participation.</figcaption><p class="util-visual-asset-detailed-description" id="figure-description-asset-vb-38-4-va-a1-support-pathway-01-activity-a1-materials-entry">Existing engagement information feeds into SSI, which may produce a support flag. The flag reaches authorised staff for review. Staff may decide to make personalised contact, but contact is not automatic. Where an offer is made, the student may choose to attend a support conversation or decline. The pathway therefore has two conditional transitions: staff judgement before contact and student choice before engagement. Conventional academic support remains available outside this pathway. No stage is presented as a diagnosis or sanction.</p></figure><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A1-M1" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Understanding Student Support Insight</span></p><p>Northbridge University is a fictional public university in England. It is concerned that some first-year undergraduates leave before beginning their second year, sometimes without receiving academic support that might have helped them.</p><p>In September 2025, Northbridge introduced Student Support Insight (SSI), an AI-assisted system intended to identify students who might benefit from a support conversation. SSI uses existing learning-system engagement information, attendance records where available, and assignment submission patterns to generate possible support flags.</p><p>A flag is not a decision about a student. Authorised staff review it and decide whether personalised contact would be appropriate. Contact offers an opportunity for support; students may decline. A student counts as engaging with support only after attending at least one support conversation. Conventional academic support remains available independently of SSI.</p><p>SSI does not automatically diagnose difficulties, grade work, determine academic ability, decide academic outcomes or impose sanctions. Being flagged and participating in support are therefore different situations, separated by staff judgement and student choice.</p></article></div><div class="util-composition-learn-item util-composition-learn-item--example" data-composition-role="example"><article class="util-worked-example util-prose-measure" data-material-id="A1-M2" data-material-type="worked_example" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><span class="util-semantic-icon__label">A Flag Is Not an Offer of Support</span></p><p>Imagine that a fictional student, Alex, has recently shown an unusual change in learning-system activity. SSI generates a flag indicating that Alex might benefit from academic support.</p><p>That flag does not establish why Alex&#39;s activity has changed. Nor does it automatically send Alex a message. An authorised member of staff reviews the indication and considers whether personalised contact would be appropriate.</p><p>The important distinction is between <strong>information produced by the system</strong> and <strong>a decision made by a person</strong>. A flag can exist without a subsequent offer of support. Whether Alex eventually participates is a separate matter for the learner&#39;s own pathway account.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Complete a three-stage account identifying what a support flag means, who decides whether to make personalised contact, and what counts as student engagement.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A1-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Your SSI Support Pathway</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain briefly why being flagged does not necessarily mean that a student receives or accepts support.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Use the explanatory feedback to check whether your account distinguishes the system&#39;s role from human decisions.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A concise, accurate three-stage account that distinguishes an SSI-generated indication of possible support need, a personalised offer made following staff review, and a student&#39;s attendance at a support conversation. The explanation should identify the roles of authorised staff and student choice without attributing automatic decisions, diagnoses or sanctions to SSI.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-support-flag-1" data-response-part-id="A1-template-section-a1-m3-section-support-flag-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m3-section-support-flag-1-label" for="learner-workspace-a1-a1-template-section-a1-m3-section-support-flag-1">Support flag</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-template-section-a1-m3-section-support-flag-1-desc">Record your response for Support flag.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m3-section-support-flag-1" name="learner-workspace-a1-a1-template-section-a1-m3-section-support-flag-1" rows="6" aria-describedby="learner-workspace-a1-a1-template-section-a1-m3-section-support-flag-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-personalised-contact-2" data-response-part-id="A1-template-section-a1-m3-section-personalised-contact-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m3-section-personalised-contact-2-label" for="learner-workspace-a1-a1-template-section-a1-m3-section-personalised-contact-2">Personalised contact</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-template-section-a1-m3-section-personalised-contact-2-desc">Record your response for Personalised contact.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m3-section-personalised-contact-2" name="learner-workspace-a1-a1-template-section-a1-m3-section-personalised-contact-2" rows="6" aria-describedby="learner-workspace-a1-a1-template-section-a1-m3-section-personalised-contact-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-support-engagement-3" data-response-part-id="A1-template-section-a1-m3-section-support-engagement-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m3-section-support-engagement-3-label" for="learner-workspace-a1-a1-template-section-a1-m3-section-support-engagement-3">Support engagement</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-template-section-a1-m3-section-support-engagement-3-desc">Record your response for Support engagement.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m3-section-support-engagement-3" name="learner-workspace-a1-a1-template-section-a1-m3-section-support-engagement-3" rows="6" aria-describedby="learner-workspace-a1-a1-template-section-a1-m3-section-support-engagement-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-why-the-stages-differ-4" data-response-part-id="A1-template-section-a1-m3-section-why-the-stages-differ-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m3-section-why-the-stages-differ-4-label" for="learner-workspace-a1-a1-template-section-a1-m3-section-why-the-stages-differ-4">Why the stages differ</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-template-section-a1-m3-section-why-the-stages-differ-4-desc">Record your response for Why the stages differ.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m3-section-why-the-stages-differ-4" name="learner-workspace-a1-a1-template-section-a1-m3-section-why-the-stages-differ-4" rows="6" aria-describedby="learner-workspace-a1-a1-template-section-a1-m3-section-why-the-stages-differ-4-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#learner-check-a1" data-check-sidebar-open aria-controls="learner-check-a1" aria-expanded="false" aria-label="Check your work: How SSI Offers Student Support">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a1" data-composition-moment="check" data-activity-id="A1" data-check-sidebar="available" aria-labelledby="learner-check-a1-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="learner-check-a1-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a1">Back to your task (How SSI Offers Student Support)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m4-c-0" data-revision-criterion-id="a1-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you described a support flag without treating it as a diagnosis or automatic academic decision?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>If a flag is mistaken for a diagnosis or decision, the account gives SSI more authority than it has in the institutional process.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The flag is described as an indication of a possible need for support.</li><li><span class="util-guided-review__feature-key">B.</span> The description distinguishes an indication from a judgement about academic ability or an imposed outcome.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Reframe any claim that the system knows a student is struggling as an indication that may warrant staff consideration.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify any wording that treats the flag as a grade, diagnosis or sanction and explain why that is not the flag&#39;s function.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-0" data-checklist-item-id="checklist-a1-a1-m4-item-0"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m4-c-1" data-revision-criterion-id="a1-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you identified the human decision involved in personalised contact?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The support pathway cannot be explained accurately if a system-generated flag is assumed to produce contact automatically.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Authorised staff are identified as reviewing a flag.</li><li><span class="util-guided-review__feature-key">B.</span> Contact is presented as a staff decision rather than an inevitable result of flagging.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Add the staff-review stage between the system&#39;s indication and any possible personalised contact.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Qualify wording that assumes every flagged student receives contact, and identify where staff judgement enters the pathway.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-1" data-checklist-item-id="checklist-a1-a1-m4-item-1"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m4-c-2" data-revision-criterion-id="a1-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you explained what student engagement means and where student choice enters?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confusing contact with participation makes the reported support activity appear more extensive than it may be.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Students are recognised as able to decline support.</li><li><span class="util-guided-review__feature-key">B.</span> Engagement is distinguished from merely receiving an offer.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Add the student&#39;s ability to accept or decline the offer, rather than presenting participation as compulsory.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Specify the participation threshold used in the case instead of equating a contact attempt with an attended conversation.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-2" data-checklist-item-id="checklist-a1-a1-m4-item-2"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m4-c-3" data-revision-criterion-id="a1-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Does your account distinguish all three stages and explain why they are not interchangeable?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A collapsed pathway would make later counts of flagged, contacted and engaged students difficult to interpret.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Flagging, personalised contact and engagement appear as separate stages.</li><li><span class="util-guided-review__feature-key">B.</span> Your explanation identifies why progression between stages is not guaranteed.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Separate any combined stages and identify the distinct event represented by each one.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect the transitions to staff discretion and student choice rather than assuming every flagged student completes the pathway.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-3" data-checklist-item-id="checklist-a1-a1-m4-item-3"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">What Do the Early Figures Show?</h2><div class="util-badge-row"><span class="util-badge util-badge-time">4 min</span></div></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Interpret the March evaluation by identifying the relevant groups, calculating the difference between reported enrolment rates and distinguishing association from causation.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">You have distinguished a support flag from contact and engagement. That distinction is essential for interpreting the evaluation: the number of students identified is not the number contacted or the number who participated, and the reported enrolment comparison concerns particular groups within the support pathway.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Northbridge&#39;s first evaluation summary, dated 12 March 2026, describes encouraging preliminary results. Examine the reported figures carefully. Your task is to establish what was observed, identify the groups being compared and decide how strongly the figures support a claim about the benefit of engagement.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Identify the denominator for each percentage, compare like with like, and distinguish a difference observed in the data from an effect proven to have been caused by support.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Explain why a difference between the enrolment rates of students who engaged and students who did not engage cannot, by itself, show that engagement produced the difference.</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A2"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A2-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Reading Percentages and Evidence</span></p><p>A percentage expresses a count relative to a particular group. Before interpreting a percentage, ask: <strong>Out of which students?</strong> Two percentages can only be compared meaningfully when their group definitions and measured outcomes are understood.</p><p>The difference between two percentages is expressed in <strong>percentage points</strong>. For an unrelated example, a change from 40% to 55% is a difference of 15 percentage points. This is different from saying there has been a 15% relative increase.</p><p>An <strong>association</strong> means two observations occur together in the reported data. It does not, by itself, establish <strong>causation</strong>: that one event produced the other. Students who participate in support may differ from those who do not in ways the figures do not describe.</p><p>Finally, being enrolled at a preliminary reporting point is not the same as having completed the academic year or continued into the next year. Interpret the outcome that was actually measured.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the March 2026 evaluation extract and its numerical table.</p></span></div><article class="util-material-block util-material-table-block" data-material-id="A2-M1" data-material-type="data_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">NB-SSI-01: Initial Evaluation Summary</span></p><h3 class="util-md-heading util-md-heading--source-3">Northbridge University — NB-SSI-01</h3><p><strong>Initial Evaluation Summary, 12 March 2026</strong></p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Recorded measure</th><th>Student count</th><th>Relevant group or denominator</th><th>Reported rate</th></tr></thead><tbody><tr><td>Students flagged by SSI</td><td>500</td><td>All SSI-flagged students</td><td>—</td></tr><tr><td>Students receiving recorded personalised support contact</td><td>400</td><td>SSI-flagged students</td><td>—</td></tr><tr><td>Contacted students attending at least one support conversation</td><td>240</td><td>Students receiving recorded personalised contact</td><td>—</td></tr><tr><td>Engaged flagged students still enrolled at the preliminary reporting point</td><td>216</td><td>240 flagged students who engaged</td><td>90%</td></tr><tr><td>Non-engaged flagged students still enrolled at the preliminary reporting point</td><td>208</td><td>260 flagged students who did not engage</td><td>80%</td></tr></tbody></table></div><p><strong>Outcome recorded:</strong> enrolment status at the preliminary reporting point. These figures are not final continuation outcomes.</p><p>Use the counts, group definitions and reported rates to complete your own interpretation. Keep the stages of the support pathway distinct.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify the numbers of flagged, contacted and engaged students and distinguish these stages.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a2-a2-m3" data-material-source-id="A2-M3" data-activity-id="A2"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A2-M3" data-material-type="analysis_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Your Evidence Interpretation Table</span></p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="a2-a2-m3-col-stage-or-comparison-group-0">Stage or comparison group</th><th scope="col" id="a2-a2-m3-col-relevant-total-or-denominator-1">Relevant total or denominator</th><th scope="col" id="a2-a2-m3-col-observed-count-or-status-2">Observed count or status</th><th scope="col" id="a2-a2-m3-col-rate-where-applicable-3">R
