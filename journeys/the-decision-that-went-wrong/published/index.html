"m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify one consequential uncertainty that the committee should not treat as resolved. Do not recommend an institutional option.</p></span></div><article class="util-prompt-set util-prose-measure" data-material-id="A2-M4" data-material-type="prompt_set" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-prompt-set-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"></path></svg></span><span class="util-semantic-icon__label">Weigh the Consequences and Uncertainty</span></p><h3 class="util-md-heading util-md-heading--source-2">Your evaluative judgement</h3><p>How strongly do the available findings support competing potential benefits and harms of SSI for different stakeholders?</p><p>Write a short, connected paragraph weighing at least two competing consequences. Use more than one source from NB-SSI-04 and NB-SSI-05. Explain how the evidence bears on access to timely support, fairness in identification and contact, reliability and staff review, student trust or autonomy, and staff capacity. You do not need to give each consideration equal weight, but explain why the considerations you prioritise matter more for the particular judgement you make.</p><p>Consider the tensions between earlier contact and inappropriate or missed contact; contextual oversight and the time required to provide it; and the importance of individual experiences and the uncertainty about how widely they are shared. Distinguish directly recorded conditions from possible future consequences. Reach a bounded judgement about the relative significance and evidential support of the consequences, not a recommendation about an institutional option.</p><p>Your evaluative paragraph:</p><h3 class="util-md-heading util-md-heading--source-2">A consequential uncertainty</h3><p>Identify one unresolved question that could materially affect how these benefits and harms are weighed. Explain which claim cannot yet be established, what evidence is missing and why the uncertainty matters for institutional judgement.</p><p>Your uncertainty response:</p></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A balanced, source-grounded consequence analysis identifying at least two potential benefits and two potential harms or burdens across different stakeholders. The written evaluation makes an explicit, justified comparison between competing consequences, uses quantitative findings and individual accounts at appropriate evidential strength, considers fairness, reliability, trust or autonomy and operational capacity, and identifies an unresolved uncertainty without inventing prevalence, causal effects or population-level error rates.</p></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-task-step-step-3-3" data-response-part-id="A2-task-step-step-3-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c4--learner-workspace-a2-a2-task-step-step-3-3-label" for="lj-c4--learner-workspace-a2-a2-task-step-step-3-3">Your response</label><p class="util-learner-workspace__prompt" id="lj-c4--learner-workspace-a2-a2-task-step-step-3-3-desc">Write a short evaluative judgement weighing at least two competing consequences. Explain which evidence carries greater or lesser weight for the particular claims being made and why, including implications for fairness, operational reliability, student trust or autonomy, and staff capacity.</p><textarea class="util-learner-workspace__input" id="lj-c4--learner-workspace-a2-a2-task-step-step-3-3" name="learner-workspace-a2-a2-task-step-step-3-3" rows="6" aria-describedby="lj-c4--learner-workspace-a2-a2-task-step-step-3-3-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c4--learner-check-a2" data-check-sidebar-open aria-controls="lj-c4--learner-check-a2" aria-expanded="false" aria-label="Check your work: Weigh Benefits, Harms and Uncertainty">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c4--learner-check-a2" data-composition-moment="check" data-activity-id="A2" data-check-sidebar="available" aria-labelledby="lj-c4--learner-check-a2-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c4--learner-check-a2-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c4--learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c4--learner-task-a2">Back to your task (Weigh Benefits, Harms and Uncertainty)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m5-c-0" data-revision-criterion-id="a2-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you examined potential benefits and harms across more than one stakeholder group?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An evaluation confined to a single experience or outcome cannot expose who might gain support, who might bear a burden or where those consequences compete.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The analysis contains at least two potential benefits and two potential harms or burdens.</li><li><span class="util-guided-review__feature-key">B.</span> Consequences are connected to identifiable, differing stakeholder groups.</li><li><span class="util-guided-review__feature-key">C.</span> Each consequence is linked to a source observation or attributed account.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the missing consequence type and add a source-grounded possibility rather than converting an existing consequence into an unsupported certainty.</li><li><span class="util-guided-review__feature-key">Missing B:</span> For each generic consequence, identify who might experience it and explain how their circumstances or responsibilities make it relevant.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Insert the relevant NB-SSI-04 quantity or NB-SSI-05 passage and explain the limited inference it supports.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c4--checklist-a2-a2-m5-item-0" data-checklist-item-id="checklist-a2-a2-m5-item-0"><label class="util-interactive-checklist__label" for="lj-c4--checklist-a2-a2-m5-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c4--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m5-c-1" data-revision-criterion-id="a2-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you used numerical findings and individual testimony at the evidential strength they warrant?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Misreading denominators or generalising testimony can make a potential concern appear proven, widespread or causally explained when the records do not support that conclusion.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Numerical claims preserve the relevant denominator and selection conditions.</li><li><span class="util-guided-review__feature-key">B.</span> Differences in flag rates are not treated as proof of discrimination or unequal accuracy.</li><li><span class="util-guided-review__feature-key">C.</span> Stakeholder accounts are treated as individual experiences rather than prevalence estimates.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify whether the figure refers to all students, flagged students, a registration-status group or a selected support-seeking sample; restore the appropriate denominator.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Distinguish the recorded group difference from the unmeasured support needs, accuracy and causes that would be required to interpret it.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Replace any generalisation about how commonly an experience occurs with a bounded account of what the named statement establishes.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c4--checklist-a2-a2-m5-item-1" data-checklist-item-id="checklist-a2-a2-m5-item-1"><label class="util-interactive-checklist__label" for="lj-c4--checklist-a2-a2-m5-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c4--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m5-c-2" data-revision-criterion-id="a2-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you weighed competing consequences using relevant institutional criteria?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Simply naming benefits and harms leaves the relative significance of access, fairness, reliability, trust and capacity unexplained.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> At least two consequences are explicitly compared rather than listed separately.</li><li><span class="util-guided-review__feature-key">B.</span> The evaluation connects fairness, reliability, trust or autonomy, support access and staff capacity to relevant evidence.</li><li><span class="util-guided-review__feature-key">C.</span> Relative evidential weight is justified rather than assumed.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Explain what makes one consequence more or less significant than another for the stakeholders and decision criteria involved.</li><li><span class="util-guided-review__feature-key">Missing B:</span> For each omitted consideration that materially affects your judgement, add the recorded condition or passage that makes it relevant and explain the relationship.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain whether a claim rests on a measured operational quantity, an individual account or an inference requiring additional evidence, and adjust its weight accordingly.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c4--checklist-a2-a2-m5-item-2" data-checklist-item-id="checklist-a2-a2-m5-item-2"><label class="util-interactive-checklist__label" for="lj-c4--checklist-a2-a2-m5-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c4--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m5-c-3" data-revision-criterion-id="a2-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you identified a consequential uncertainty without claiming that unresolved effects or error rates are established?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Institutional decisions must account for what remains unknown without treating possible harms, benefits or system errors as measured outcomes.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> One unresolved question is linked to a material stakeholder consequence.</li><li><span class="util-guided-review__feature-key">B.</span> Claims about causal effects, discrimination, prevalence and population error rates remain qualified.</li><li><span class="util-guided-review__feature-key">C.</span> The uncertainty is explained in terms of its significance for judgement.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Specify which potential benefit, harm or burden could be judged differently if the missing information became available.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Locate any unsupported definitive claim and identify the missing comparison, representative sample or accuracy evidence needed to establish it.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Add how different plausible answers to the unresolved question could alter the relative weight of the consequences you evaluated.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c4--checklist-a2-a2-m5-item-3" data-checklist-item-id="checklist-a2-a2-m5-item-3"><label class="util-interactive-checklist__label" for="lj-c4--checklist-a2-a2-m5-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c4--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c4--activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Compare the Committee&#39;s Four Choices</h2><div class="util-badge-row"><span class="util-badge util-badge-time">6 min</span></div></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The stakeholder analysis identified competing interests, while the consequence evaluation tested which benefits, harms and uncertainties the evidence can support. The institutional decision brief now turns those considerations into practical trade-offs among four defined choices, including the costs and capacities that constrain what the university can responsibly promise.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>The Student Success Committee must recommend a course of action for 2026/27. You have examined the people affected and the limits of the available evidence; now consider what each fixed option could mean for those people within the institution&#39;s actual constraints. Your task is to prepare a reasoned comparison, not to make the final recommendation.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Compare every option against consistent criteria rather than defending a favourite first. Separate established facts and resource constraints from conditional predictions about future effects. Consider who could benefit, who could bear a cost, what safeguards or review conditions might be relevant and which uncertainties could change the balance. All four options remain defensible in principle.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which trade-off would be most easily overlooked if the committee considered continuation rates alone? What evidence or resource assumption would need checking before anyone could claim that an option is certain to benefit students?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A3"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Read the committee decision brief, including the four fixed options, the annual SSI cost, staff workload implications and the support services that will remain available.</p></span></div></div><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><article class="util-material-block util-material-table-block" data-material-id="A3-M2" data-material-type="reference_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Simulated Cross-Source Evidence for the Four Options</span></p><h3 class="util-md-heading util-md-heading--source-2">Recorded evidence for institutional comparison</h3><p>These records belong to the fictional Northbridge University case. The table contains recorded findings and their interpretative boundaries, not a ranking of the committee&#39;s options.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Source</th><th>Recorded evidence or statement</th><th>Interpretation limit</th></tr></thead><tbody><tr><td>NB-SSI-02, 5 June 2026</td><td>Flagged students who engaged: 211 of 240 continued (87.9%) at the 31 May cut-off.</td><td>Engagement was not randomly assigned; the difference between engagement groups is not an established causal effect.</td></tr><tr><td>NB-SSI-02, 5 June 2026</td><td>Flagged students who did not engage: 205 of 260 continued (78.8%).</td><td>The groups may differ in motivation, circumstances or existing support.</td></tr><tr><td>NB-SSI-02, 5 June 2026</td><td>All flagged students: 416 of 500 continued (83.2%).</td><td>Flagged and unflagged students are not equivalent comparison groups.</td></tr><tr><td>NB-SSI-02, 5 June 2026</td><td>Unflagged students: 1,365 of 1,500 continued (91.0%).</td><td>The difference from the flagged group cannot establish the effectiveness of SSI.</td></tr><tr><td>NB-SSI-02, 5 June 2026</td><td>All 2025/26 first-year students: 1,781 of 2,000 continued (89.1% rounded).</td><td>The overall figure includes both flagged and unflagged students.</td></tr><tr><td>NB-SSI-02, 5 June 2026</td><td>Historical 2024/25 cohort: 1,720 of 2,000 continued (86.0%).</td><td>The 3.1-percentage-point difference between rounded cohort rates is observational, not an SSI causal effect.</td></tr><tr><td>NB-SSI-03, 8 June 2026</td><td>Students engaging with support may differ in motivation, circumstances or existing support networks.</td><td>Selection into engagement limits causal attribution.</td></tr><tr><td>NB-SSI-03, 8 June 2026</td><td>The historical cohort is not an equivalent control group; an expanded first-year academic adviser scheme began in September 2025.</td><td>SSI&#39;s contribution cannot be isolated from other institutional changes.</td></tr><tr><td>NB-SSI-03, 8 June 2026</td><td>Some attendance records were incomplete; continuation does not fully capture wellbeing, confidence or educational experience.</td><td>The evaluation does not establish the full range of student outcomes.</td></tr><tr><td>NB-SSI-03, 8 June 2026</td><td>The evaluation cannot establish whether SSI performs better than an equally resourced non-AI support approach.</td><td>Comparative effectiveness remains unknown.</td></tr><tr><td>NB-SSI-04, 10 June 2026</td><td>Students registered with a disability: 105 of 300 flagged (35.0%); students not registered with a disability: 395 of 1,700 flagged (23.2%).</td><td>The two categories are exhaustive and mutually exclusive at the cut-off. The difference alone does not establish discrimination, accuracy or cause.</td></tr><tr><td>NB-SSI-04, 10 June 2026</td><td>100 of 500 flagged students had no recorded personalised support contact.</td><td>Being flagged is not equivalent to receiving a recorded personalised support offer.</td></tr><tr><td>NB-SSI-04, 10 June 2026</td><td>Staff identified 40 flagged cases where incomplete attendance information may have contributed to a flag.</td><td>These are potentially affected cases, not confirmed errors.</td></tr><tr><td>NB-SSI-04, 10 June 2026</td><td>Of a selected group of 100 students who sought conventional support, 30 were unflagged.</td><td>The selected group cannot establish the population missed-identification or false-negative rate.</td></tr><tr><td>NB-SSI-04, 10 June 2026</td><td>Reviewing flags added approximately 25 staff hours per week across the academic support service at peak.</td><td>This is a peak-period workload observation, not an annual staffing forecast.</td></tr></tbody></table></div><p>The available review does not establish overall false-positive or false-negative rates.</p><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-05 — Full stakeholder statements</h3><p>11 June 2026 | Fictional individual accounts, not representative survey findings</p><h3 class="util-md-heading util-md-heading--source-3">Samira Khan — first-year student</h3><p>&gt; I was falling behind and didn&#39;t know who to ask. The message from my tutor made it easier to start a conversation. I probably wouldn&#39;t have contacted anyone myself.</p><h3 class="util-md-heading util-md-heading--source-3">Daniel Reed — first-year student</h3><p>&gt; I was told my engagement suggested I might be struggling, but I was working offline and keeping up. I felt as though the university had already made up its mind about me.</p><h3 class="util-md-heading util-md-heading--source-3">Bethan Hughes — first-year student</h3><p>&gt; I missed deadlines because things were difficult at home. Nobody contacted me through the new system. I found help later through my course administrator.</p><h3 class="util-md-heading util-md-heading--source-3">Tom Ellis — Head of Academic Support</h3><p>&gt; Some students have benefited from earlier contact, but the flags aren&#39;t always straightforward. Staff need time to check the context, and that has an impact on other support work.</p><h3 class="util-md-heading util-md-heading--source-3">Morgan Price — Students&#39; Union Education Officer</h3><p>&gt; Students want support, but they also want to understand how decisions about them are made. We shouldn&#39;t assume that a well-intentioned system automatically feels supportive.</p><h3 class="util-md-heading util-md-heading--source-3">Dr Aisha Rahman — Director of Student Success</h3><p>&gt; The early signs are encouraging. I would be reluctant to lose a potentially useful route to support before we&#39;ve had a fair opportunity to improve it.</p><h3 class="util-md-heading util-md-heading--source-3">Dr Priya Shah — Institutional Evaluation Lead</h3><p>&gt; The evidence is consistent with possible benefit, but we cannot yet isolate the effect of SSI from other changes or establish whether the benefits and risks are distributed fairly.</p><p>Use these findings and accounts to support your own conditional comparison. They do not determine which option the committee should choose.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c4--learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="lj-c4--learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="lj-c4--learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c4--learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c4--learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="lj-c4--learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c4--learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Complete the four-option decision table. For each option, identify plausible benefits, harms or burdens for different stakeholders; the evidence supporting those possibilities; significant uncertainty; and relevant financial or operational implications. Keep possible future effects conditional.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A3-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated Student Success Committee Decision Brief</span></p><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-06 — Decision Brief</h3><p>15 June 2026 | Northbridge University | Fictional institutional record</p><p>The Student Success Committee (SSC), chaired by Professor Helen Ward, must recommend a course of action for Student Support Insight (SSI) for the 2026/27 academic year by 18 June 2026.</p><p>SSI is an AI-assisted system that generates support flags for staff to review. Staff decide whether to offer support; students may decline. SSI does not automatically impose sanctions, award grades or diagnose students.</p><h3 class="util-md-heading util-md-heading--source-3">Fixed institutional conditions</h3><ul><li>Conventional academic support services and the expanded first-year academic adviser scheme will remain available.</li><li>SSI costs £48,000 per academic year in software licensing and associated administration, excluding additional staff time.</li><li>No additional recurring budget has been approved for 2026/27.</li><li>The committee must consider educational benefits, evidential limitations, fairness, reliability, student experience, staff capacity and financial implications.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Four fixed options</h3><table><thead><tr><th>Option</th><th>Defined course of action</th></tr></thead><tbody><tr><td>A — Continue unchanged</td><td>Retain SSI and current procedures for 2026/27.</td></tr><tr><td>B — Continue with safeguards and further evaluation</td><td>Retain SSI while improving oversight, communication, data quality and evaluation within available resources.</td></tr><tr><td>C — Restrict or temporarily suspend SSI</td><td>Limit use or pause flag-generated contacts while investigating specified concerns; retain conventional support routes.</td></tr><tr><td>D — Withdraw SSI</td><td>End the system and rely on conventional academic support and the expanded adviser scheme.</td></tr></tbody></table><p>Conditions, safeguards, review dates and evidence requirements may be recommended within any option. No unapproved funding or certain future outcomes may be assumed.</p><p>No option is designated correct. Compare the four defined choices without adding a fifth option or treating a possible safeguard as already implemented or effective.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Write a short justification identifying at least two consequential trade-offs, the criteria you believe should carry the greatest weight and one unresolved question that could materially affect a later recommendation. Explain your reasoning without selecting a final option.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a3-a3-m3" data-material-source-id="A3-M3" data-activity-id="A3"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A3-M3" data-material-type="decision_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Four-Option Decision Comparison</span></p><div class="util-table-scroll util 3-a3-m3-row-2 lj-c4--a3-a3-m3-col-consequential-uncertainty-or-condition-5" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="lj-c4--a3-a3-m3-row-3" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">D — Withdraw SSI</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c4--a3-a3-m3-input-r3-c1" name="a3-a3-m3-input-r3-c1" data-learner-cell="a3-a3-m3-input-r3-c1" rows="3" aria-labelledby="lj-c4--a3-a3-m3-row-3 lj-c4--a3-a3-m3-col-potential-stakeholder-benefit-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c4--a3-a3-m3-input-r3-c2" name="a3-a3-m3-input-r3-c2" data-learner-cell="a3-a3-m3-input-r3-c2" rows="3" aria-labelledby="lj-c4--a3-a3-m3-row-3 lj-c4--a3-a3-m3-col-potential-harm-or-burden-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c4--a3-a3-m3-input-r3-c3" name="a3-a3-m3-input-r3-c3" data-learner-cell="a3-a3-m3-input-r3-c3" rows="3" aria-labelledby="lj-c4--a3-a3-m3-row-3 lj-c4--a3-a3-m3-col-supporting-evidence-and-limitation-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c4--a3-a3-m3-input-r3-c4" name="a3-a3-m3-input-r3-c4" data-learner-cell="a3-a3-m3-input-r3-c4" rows="3" aria-labelledby="lj-c4--a3-a3-m3-row-3 lj- re" data-material-id="A3-M5" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated Committee Briefing Claim</span></p><h3 class="util-md-heading util-md-heading--source-2">A claim for scrutiny</h3><p>The following is a simulated, unverified statement constructed for this learning activity. It is not a quotation from an actual participant and is not an endorsed finding of Northbridge University&#39;s fictional committee.</p><p>&gt; One of these four choices will clearly be best for students, so the committee can select it without further questions about whose experiences count, what the evidence proves or what the university can afford.</p><p>The statement does not identify a preferred option. Examine the claim as written when preparing your briefing for a new student representative.</p></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A consistent comparison of all four specified options that identifies evidence-linked potential benefits, harms and stakeholder consequences, acknowledges the £48,000 annual SSI cost excluding additional staff time and the absence of approved additional recurring funding, and recognises that conventional support and the expanded adviser scheme remain available. A reasoned justification weighs at least two trade-offs, identifies consequential uncertainties and explains which decision criteria warrant attention without reaching the final recommendation. A separate, concise briefing note transfers this reasoning to an unfamiliar representative&#39;s scrutiny of an overconfident institutional claim, posing and justifying two useful questions rather than repeating the option table.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m4-section-first-consequential-trade-off-1" data-response-part-id="A3-template-section-a3-m4-section-first-consequential-trade-off-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-first-consequential-trade-off-1-label" for="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-first-consequential-trade-off-1">First consequential trade-off</label><p class="util-learner-workspace__prompt" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-first-consequential-trade-off-1-desc">Describe a tension between two potential stakeholder consequences. Explain which evidence makes each side relevant, what remains uncertain and why the tension matters.</p><textarea class="util-learner-workspace__input" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-first-consequential-trade-off-1" name="learner-workspace-a3-a3-template-section-a3-m4-section-first-consequential-trade-off-1" rows="6" aria-describedby="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-first-consequential-trade-off-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m4-section-second-consequential-trade-off-2" data-response-part-id="A3-template-section-a3-m4-section-second-consequential-trade-off-2"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-second-consequential-trade-off-2-label" for="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-second-consequential-trade-off-2">Second consequential trade-off</label><p class="util-learner-workspace__prompt" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-second-consequential-trade-off-2-desc">Identify a different tension involving stakeholders or institutional resources. Explain why an apparent improvement on one criterion could carry a cost on another.</p><textarea class="util-learner-workspace__input" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-second-consequential-trade-off-2" name="learner-workspace-a3-a3-template-section-a3-m4-section-second-consequential-trade-off-2" rows="6" aria-describedby="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-second-consequential-trade-off-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m4-section-criteria-deserving-greatest-weight-3" data-response-part-id="A3-template-section-a3-m4-section-criteria-deserving-greatest-weight-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-criteria-deserving-greatest-weight-3-label" for="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-criteria-deserving-greatest-weight-3">Criteria deserving greatest weight</label><p class="util-learner-workspace__prompt" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-criteria-deserving-greatest-weight-3-desc">State which decision criteria you believe warrant priority and explain why. Consider the implications for educational benefit and access, equitable treatment, reliability, trust and autonomy, staff capacity and the approved financial position.</p><textarea class="util-learner-workspace__input" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-criteria-deserving-greatest-weight-3" name="learner-workspace-a3-a3-template-section-a3-m4-section-criteria-deserving-greatest-weight-3" rows="6" aria-describedby="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-criteria-deserving-greatest-weight-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m4-section-evidence-supporting-that-weighting-4" data-response-part-id="A3-template-section-a3-m4-section-evidence-supporting-that-weighting-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-evidence-supporting-that-weighting-4-label" for="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-evidence-supporting-that-weighting-4">Evidence supporting that weighting</label><p class="util-learner-workspace__prompt" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-evidence-supporting-that-weighting-4-desc">Use specific recorded findings and attributed statements. Compare what the quantitative evidence, methodological limitations, operational observations and individual accounts can establish. Explain why some sources carry greater weight for particular claims than others.</p><textarea class="util-learner-workspace__input" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-evidence-supporting-that-weighting-4" name="learner-workspace-a3-a3-template-section-a3-m4-section-evidence-supporting-that-weighting-4" rows="6" aria-describedby="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-evidence-supporting-that-weighting-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m4-section-most-consequential-unresolved-question-5" data-response-part-id="A3-template-section-a3-m4-section-most-consequential-unresolved-question-5"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-most-consequential-unresolved-question-5-label" for="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-most-consequential-unresolved-question-5">Most consequential unresolved question</label><p class="util-learner-workspace__prompt" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-most-consequential-unresolved-question-5-desc">Identify one question whose answer could materially alter the balance among the four options. Do not assume the missing evidence already exists.</p><textarea class="util-learner-workspace__input" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-most-consequential-unresolved-question-5" name="learner-workspace-a3-a3-template-section-a3-m4-section-most-consequential-unresolved-question-5" rows="6" aria-describedby="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-most-consequential-unresolved-question-5-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="6" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m4-section-why-that-uncertainty-matters-for-the-later-decision-6" data-response-part-id="A3-template-section-a3-m4-section-why-that-uncertainty-matters-for-the-later-decision-6"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-why-that-uncertainty-matters-for-the-later-decision-6-label" for="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-why-that-uncertainty-matters-for-the-later-decision-6">Why that uncertainty matters for the later decision</label><p class="util-learner-workspace__prompt" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-why-that-uncertainty-matters-for-the-later-decision-6-desc">Explain how different plausible answers could change the importance of stakeholder consequences, feasibility or proposed conditions. Reserve the final choice for The Committee Recommendation.</p><textarea class="util-learner-workspace__input" id="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-why-that-uncertainty-matters-for-the-later-decision-6" name="learner-workspace-a3-a3-template-section-a3-m4-section-why-that-uncertainty-matters-for-the-later-decision-6" rows="6" aria-describedby="lj-c4--learner-workspace-a3-a3-template-section-a3-m4-section-why-that-uncertainty-matters-for-the-later-decision-6-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c4--learner-check-a3" data-check-sidebar-open aria-controls="lj-c4--learner-check-a3" aria-expanded="false" aria-label="Check your work: Compare the Committee&#39;s Four Choices">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c4--learner-check-a3" data-composition-moment="check" data-activity-id="A3" data-check-sidebar="available" aria-labelledby="lj-c4--learner-check-a3-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c4--learner-check-a3-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c4--learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c4--learner-task-a3">Back to your task (Compare the Committee&#39;s Four Choices)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M7" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m7" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m7-c-0" data-revision-criterion-id="a3-m7-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you compared all four fixed options faithfully, using evidence to support conditional stakeholder consequences?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Changing an option&#39;s meaning or presenting speculative outcomes as guaranteed would distort the choice the committee actually faces.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> All four options retain the definitions given in NB-SSI-06.</li><li><span class="util-guided-review__feature-key">B.</span> Each option considers potential consequences for at least two stakeholder groups.</li><li><span class="util-guided-review__feature-key">C.</span> Consequences are linked to identifiable findings or passages and expressed conditionally when future effects are unknown.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Compare each row with the decision brief and remove any added action that changes the option rather than specifying a possible condition within it.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify the missing stakeholder perspective in the affected row and explain a plausible benefit, harm or burden relevant to that group.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Add the relevant source observation and limitation; change any guaranteed outcome into a possibility where the records do not establish what would happen.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c4--checklist-a3-a3-m7-item-0" data-checklist-item-id="checklist-a3-a3-m7-item-0"><label class="util-interactive-checklist__label" for="lj-c4--checklist-a3-a3-m7-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c4--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m7-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m7-c-1" data-revision-criterion-id="a3-m7-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you accounted accurately for financial, staffing and continuing-support constraints?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A comparison that assumes unavailable funding, treats peak workload as an annual total or overlooks existing support routes may make an option appear more feasible or disruptive than the brief warrants.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The £48,000 annual SSI licensing and administration cost is distinguished from additional staff time.</li><li><span class="util-guided-review__feature-key">B.</span> No option relies on additional recurring funding that has not been approved.</li><li><span class="util-guided-review__feature-key">C.</span> The comparison recognises that conventional support and the expanded adviser scheme remain available.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Separate the stated annual software and administration expenditure from the observed staff workload; do not assign an invented monetary value to the latter.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify any proposed safeguard or expansion requiring new resources and describe its feasibility as unresolved within the existing budget.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Correct any claim that restricting or withdrawing SSI would automatically end all other academic support routes.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c4--checklist-a3-a3-m7-item-1" data-checklist-item-id="checklist-a3-a3-m7-item-1"><label class="util-interactive-checklist__label" for="lj-c4--checklist-a3-a3-m7-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c4--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m7-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m7-c-2" data-revision-criterion-id="a3-m7-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you justified consequential trade-offs and uncertainties without selecting the final institutional option?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The committee needs reasoning about competing values and feasibility before a recommendation; an early preference can conceal untested assumptions.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Two distinct trade-offs explain how different stakeholder consequences or institutional criteria compete.</li><li><span class="util-guided-review__feature-key">B.</span> The criteria assigned greatest weight are justified using specific evidence and its limitations.</li><li><span class="util-guided-review__feature-key">C.</span> One unresolved question is linked to how the later decision could change.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> For any trade-off currently expressed as a simple advantage or disadvantage, identify the competing consideration and explain why both matter.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect your priority criteria to relevant continuation, equity, operational, testimony or budget records, and explain why those records matter for the weighting.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain which possible answers to the missing question would alter a stakeholder consequence, the feasibility of a safeguard or the relative weight of a decision criterion.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c4--checklist-a3-a3-m7-item-2" data-checklist-item-id="checklist-a3-a3-m7-item-2"><label class="util-interactive-checklist__label" for="lj-c4--checklist-a3-a3-m7-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c4--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m7-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m7-c-3" data-revision-criterion-id="a3-m7-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you transferred your evaluation into two justified scrutiny questions suitable for a new student representative?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A useful briefing equips an unfamiliar representative to challenge an overconfident claim without substituting the writer&#39;s preferred answer for independent scrutiny.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The briefing contains exactly two substantive questions about the simulated claim.</li><li><span class="util-guided-review__feature-key">B.</span> Each question has a brief justification grounded in the fictional case.</li><li><span class="util-guided-review__feature-key">C.</span> The language is accessible to a newcomer and does not assume a preferred option.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Replace any generic or duplicate question with a distinct inquiry into a material assumption concerning stakeholder experience, evidential support or feasibility.</li><li><span class="util-guided-review__feature-key">Missing B:</span> After each question, explain which recorded consequence, evidence limit or resource constraint makes that inquiry necessary.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain any case-specific shorthand needed to understand the questions and remove wording that tells the representative which option must win.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c4--checklist-a3-a3-m7-item-3" data-checklist-item-id="checklist-a3-a3-m7-item-3"><label class="util-interactive-checklist__label" for="lj-c4--checklist-a3-a3-m7-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c4--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m7-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A3"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M6" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Brief a New Student Representative</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-transfer-prompt-a3-m6-910" data-response-part-id="A3-transfer-prompt-a3-m6-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c4--learner-workspace-a3-a3-transfer-prompt-a3-m6-910-label" for="lj-c4--learner-workspace-a3-a3-transfer-prompt-a3-m6-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="lj-c4--learner-workspace-a3-a3-transfer-prompt-a3-m6-910-desc"><p>A newly appointed student representative has not read the SSI evaluation or the committee&#39;s option comparison. They have encountered the simulated claim in A3-M5 and want to know how to scrutinise it before the meeting.</p><p>Write approximately 60–90 words addressed directly to that representative. Include exactly two substantive questions they should ask before accepting the claim, with a brief justification for each. Ground your reasoning in relevant stakeholder consequences, evidence limitations or institutional resource constraints. Use accessible language and explain why the questions matter to the representative&#39;s scrutiny of a confident assertion.</p><p>This is a briefing for a new audience, not another four-option comparison. Do not recommend an option or supply a definitive answer to either question.</p><p>Your briefing:</p></div><textarea class="util-learner-workspace__input" id="lj-c4--learner-workspace-a3-a3-transfer-prompt-a3-m6-910" name="learner-workspace-a3-a3-transfer-prompt-a3-m6-910" rows="5" aria-describedby="lj-c4--learner-workspace-a3-a3-transfer-prompt-a3-m6-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><style id="lj-c4--prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;position:fixed;top:var(--learner-sticky-nav-height,0px);left:0;right:0;z-index:40;margin:0 auto;max-width:42rem;width:calc(100% - 1.5rem);padding:.45rem .75rem;border:1px solid #cbd5e1;border-left:3px solid #64748b;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.12)}.util-learner-renderer-vnext .util-revision-reminder__chrome{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.35rem .75rem;margin:0 0 .2rem}.util-learner-renderer-vnext .util-revision-reminder__label{margin:0;font-size:.75rem;font-weight:650;color:#64748b}.util-learner-renderer-vnext .util-revision-reminder__statement{margin:0;font-size:.9rem;line-height:1.4;font-weight:600;color:#0f172a}.util-learner-renderer-vnext .util-revision-reminder__view{font:inherit;font-size:.9rem;color:#1d4ed8;background:transparent;border:0;padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}.util-learner-renderer-vnext .util-revision-reminder__view:focus{outline:2px solid #2563eb;outline-offset:2px}</style><style id="lj-c4--prism-check-sidebar-css">.util-learner-renderer-vnext{--learner-reading-width:70ch;--learner-page-gutter:1rem}.util-learner-page.util-learner-renderer-vnext{width:min(calc(100% - 2 * var(--learner-page-gutter)),var(--learner-reading-width));margin-inline:auto;box-sizing:border-box}.util-check-sidebar-launch{margin:var(--learner-space-3,1rem) 0 0}.util-check-sidebar-launch__control{display:inline-flex;align-items:center;justify-content:center;min-
