orkspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a3-a3-m2-input-r3-c4" name="a3-a3-m2-input-r3-c4" data-learner-cell="a3-a3-m2-input-r3-c4" rows="3" aria-labelledby="a3-a3-m2-row-3 a3-a3-m2-col-operational-or-financial-constraint-4" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a3-a3-m2-input-r3-c5" name="a3-a3-m2-input-r3-c5" data-learner-cell="a3-a3-m2-input-r3-c5" rows="3" aria-labelledby="a3-a3-m2-row-3 a3-a3-m2-col-supporting-source-detail-5" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify two trade-offs that most deserve attention in &#39;The Committee Recommendation&#39;, explaining why they matter and which uncertainties remain.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Two Trade-offs to Carry Forward</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>As a distinct application, draft a short briefing for a Students&#39; Union representative who must explain the committee&#39;s decision criteria to students without implying that SSI&#39;s benefits or harms have been conclusively established. Apply your evidence and stakeholder reasoning to that communication purpose, without selecting a final institutional option.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M5" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Students&#39; Union Briefing Workspace</p></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A balanced four-option comparison using consistent criteria and source-grounded consequences, including credible operational and financial implications. A brief synthesis identifies and justifies two consequential trade-offs while acknowledging uncertainty and the continuing availability of conventional support. A separate student-facing briefing accurately communicates the committee&#39;s decision criteria, distinguishes established findings from unresolved questions, and addresses trust and transparency without asserting a predetermined institutional choice.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-first-significant-trade-off-1" data-response-part-id="A3-template-section-a3-m3-section-first-significant-trade-off-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m3-section-first-significant-trade-off-1-label" for="learner-workspace-a3-a3-template-section-a3-m3-section-first-significant-trade-off-1">First significant trade-off</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m3-section-first-significant-trade-off-1-desc">Identify the competing benefits, harms or responsibilities. Specify which options or stakeholder groups make this trade-off relevant.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m3-section-first-significant-trade-off-1" name="learner-workspace-a3-a3-template-section-a3-m3-section-first-significant-trade-off-1" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m3-section-first-significant-trade-off-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m5-section-what-the-committee-must-weigh-1" data-response-part-id="A3-template-section-a3-m5-section-what-the-committee-must-weigh-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m5-section-what-the-committee-must-weigh-1-label" for="learner-workspace-a3-a3-template-section-a3-m5-section-what-the-committee-must-weigh-1">What the committee must weigh</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m5-section-what-the-committee-must-weigh-1-desc">Explain the main types of evidence, possible student consequences and practical constraints relevant to the decision.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m5-section-what-the-committee-must-weigh-1" name="learner-workspace-a3-a3-template-section-a3-m5-section-what-the-committee-must-weigh-1" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m5-section-what-the-committee-must-weigh-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-why-it-matters-2" data-response-part-id="A3-template-section-a3-m3-section-why-it-matters-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m3-section-why-it-matters-2-label" for="learner-workspace-a3-a3-template-section-a3-m3-section-why-it-matters-2">Why it matters</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m3-section-why-it-matters-2-desc">Use at least one source detail to explain the consequences at stake and why the committee should give this tension attention.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m3-section-why-it-matters-2" name="learner-workspace-a3-a3-template-section-a3-m3-section-why-it-matters-2" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m3-section-why-it-matters-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m5-section-what-the-evidence-does-not-yet-establish-2" data-response-part-id="A3-template-section-a3-m5-section-what-the-evidence-does-not-yet-establish-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m5-section-what-the-evidence-does-not-yet-establish-2-label" for="learner-workspace-a3-a3-template-section-a3-m5-section-what-the-evidence-does-not-yet-establish-2">What the evidence does not yet establish</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m5-section-what-the-evidence-does-not-yet-establish-2-desc">Identify a significant unresolved question about effectiveness, fairness or reliability, and distinguish it from the recorded findings.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m5-section-what-the-evidence-does-not-yet-establish-2" name="learner-workspace-a3-a3-template-section-a3-m5-section-what-the-evidence-does-not-yet-establish-2" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m5-section-what-the-evidence-does-not-yet-establish-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-second-significant-trade-off-3" data-response-part-id="A3-template-section-a3-m3-section-second-significant-trade-off-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m3-section-second-significant-trade-off-3-label" for="learner-workspace-a3-a3-template-section-a3-m3-section-second-significant-trade-off-3">Second significant trade-off</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m3-section-second-significant-trade-off-3-desc">Identify a different consequential tension. Avoid simply restating the first trade-off in other words.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m3-section-second-significant-trade-off-3" name="learner-workspace-a3-a3-template-section-a3-m3-section-second-significant-trade-off-3" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m3-section-second-significant-trade-off-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m5-section-how-student-concerns-are-represented-3" data-response-part-id="A3-template-section-a3-m5-section-how-student-concerns-are-represented-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m5-section-how-student-concerns-are-represented-3-label" for="learner-workspace-a3-a3-template-section-a3-m5-section-how-student-concerns-are-represented-3">How student concerns are represented</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a3-a3-template-section-a3-m5-section-how-student-concerns-are-represented-3-desc"><p>Explain how student experiences, trust, transparency or autonomy should inform the committee&#39;s reasoning and its communication of the eventual decision.</p><h3 class="util-md-heading util-md-heading--source-3">Page learner-resource closure</h3><ul><li><strong>From perspectives to consequences:</strong> Revisit the stakeholder accounts to distinguish reported experiences, potential benefits and harms, and the different responsibilities people bring to the decision.</li><li><strong>From observations to justified claims:</strong> Check denominators, comparison groups and evaluation limitations before treating continuation differences, flag-rate disparities or operational findings as grounds for an institutional conclusion.</li><li><strong>From evidence to feasible choices:</strong> Compare all four options using consistent criteria, acknowledging student experience, fairness, trust, staff capacity, the £48,000 annual SSI cost and the absence of approved additional recurring funding.</li><li><strong>For &#39;The Committee Recommendation&#39;:</strong> Carry forward your two most consequential trade-offs and a clearly stated uncertainty. These provide a basis for independent judgement without predetermining which option should be recommended.</li></ul></div><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m5-section-how-student-concerns-are-represented-3" name="learner-workspace-a3-a3-template-section-a3-m5-section-how-student-concerns-are-represented-3" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m5-section-how-student-concerns-are-represented-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-why-it-matters-4" data-response-part-id="A3-template-section-a3-m3-section-why-it-matters-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m3-section-why-it-matters-4-label" for="learner-workspace-a3-a3-template-section-a3-m3-section-why-it-matters-4">Why it matters</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m3-section-why-it-matters-4-desc">Explain the significance of the second tension using stakeholder, evaluation, operational or financial evidence.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m3-section-why-it-matters-4" name="learner-workspace-a3-a3-template-section-a3-m3-section-why-it-matters-4" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m3-section-why-it-matters-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-uncertainty-to-carry-forward-5" data-response-part-id="A3-template-section-a3-m3-section-uncertainty-to-carry-forward-5"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m3-section-uncertainty-to-carry-forward-5-label" for="learner-workspace-a3-a3-template-section-a3-m3-section-uncertainty-to-carry-forward-5">Uncertainty to carry forward</label><p class="util-learner-workspace__prompt" id="learner-workspace-a3-a3-template-section-a3-m3-section-uncertainty-to-carry-forward-5-desc">Identify an unresolved question that could affect how these trade-offs are judged in &#39;The Committee Recommendation&#39;. Explain what the current evidence cannot settle.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-template-section-a3-m3-section-uncertainty-to-carry-forward-5" name="learner-workspace-a3-a3-template-section-a3-m3-section-uncertainty-to-carry-forward-5" rows="6" aria-describedby="learner-workspace-a3-a3-template-section-a3-m3-section-uncertainty-to-carry-forward-5-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#learner-check-a3" data-check-sidebar-open aria-controls="learner-check-a3" aria-expanded="false" aria-label="Check your work: Weigh the Committee&#39;s Four Options">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a3" data-composition-moment="check" data-activity-id="A3" data-check-sidebar="available" aria-labelledby="learner-check-a3-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="learner-check-a3-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a3">Back to your task (Weigh the Committee&#39;s Four Options)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M6" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m6" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m6-c-0" data-revision-criterion-id="a3-m6-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you compared all four fixed options using the same substantive decision criteria without implying a predetermined winner?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An uneven comparison can make an option appear preferable because its costs or benefits were omitted rather than because its consequences were properly weighed.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each of Options A, B, C and D has an evidence-informed potential benefit and a potential harm or lost opportunity.</li><li><span class="util-guided-review__feature-key">B.</span> Fairness or trust and operational or financial implications are considered for every option.</li><li><span class="util-guided-review__feature-key">C.</span> The comparison distinguishes alternative courses of action without rankings or a final institutional recommendation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> For any one-sided row, identify a plausible consequence in the missing direction and explain whose educational interests it affects.</li><li><span class="util-guided-review__feature-key">Missing B:</span> For each incomplete option, connect the proposed course of action to a specific student concern and a relevant delivery or resource consideration.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Replace a premature verdict with a conditional comparison of consequences and the evidence or priorities that make the difference important.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m6-item-0" data-checklist-item-id="checklist-a3-a3-m6-item-0"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m6-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m6-c-1" data-revision-criterion-id="a3-m6-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you linked stakeholder consequences and your two prioritised trade-offs to evidence while acknowledging uncertainty?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The committee needs to understand both who might be affected and how confidently those consequences can be inferred from the case.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The comparison uses identifiable details from stakeholder testimony or institutional findings.</li><li><span class="util-guided-review__feature-key">B.</span> The two selected trade-offs involve genuinely different competing interests or consequences.</li><li><span class="util-guided-review__feature-key">C.</span> At least one uncertainty is linked to how the committee might weigh the competing consequences.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> For any unsupported consequence, identify the specific account, value, observation or limitation that makes it plausible.</li><li><span class="util-guided-review__feature-key">Missing B:</span> If the trade-offs duplicate one another, reconsider a different tension involving student experience, fairness, operational capacity, evaluation or resources.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Name the unresolved evidential question and explain how different plausible interpretations could affect the relative importance of a benefit or risk.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m6-item-1" data-checklist-item-id="checklist-a3-a3-m6-item-1"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m6-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m6-c-2" data-revision-criterion-id="a3-m6-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you respected the decision brief&#39;s financial and operational constraints?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A comparison that relies on resources or institutional changes not available in the case does not evaluate the committee&#39;s actual feasible choices.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The annual £48,000 SSI cost is distinguished from additional staff time.</li><li><span class="util-guided-review__feature-key">B.</span> Proposed safeguards or evaluation work do not depend on unapproved recurring funding.</li><li><span class="util-guided-review__feature-key">C.</span> Conventional support and the expanded adviser scheme are recognised as continuing under every option.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Separate the stated licensing and administration cost from the workload involved in reviewing flags, and avoid treating either as a complete measure of total resource use.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Where a proposal assumes new capacity, reconsider what could realistically be prioritised within existing resources or identify it as an unresolved feasibility issue.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Correct any claim that restriction or withdrawal would end all academic support, while still considering the potential loss of an SSI-specific support route.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m6-item-2" data-checklist-item-id="checklist-a3-a3-m6-item-2"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m6-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m6-c-3" data-revision-criterion-id="a3-m6-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Does your student-facing briefing explain the decision criteria transparently without overstating findings or announcing a choice?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Students need an understandable account of how their experiences and the evidence are being considered, rather than an unsupported assurance about the system or a decision that has not been made.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The briefing explains the types of evidence and student consequences the committee must weigh in accessible language.</li><li><span class="util-guided-review__feature-key">B.</span> At least one observed finding is distinguished from an unresolved causal, fairness or reliability question.</li><li><span class="util-guided-review__feature-key">C.</span> Trust, transparency or student autonomy is connected to how the decision should be communicated, without a predetermined option.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Replace unexplained evaluation terminology with a short account of what was measured, what students reported and which consequences matter.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify a documented observation, then state separately what the available evidence does not establish about its cause or wider meaning.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain what students should be able to understand about the committee&#39;s reasoning, and remove any sentence claiming that a final decision or guaranteed outcome already exists.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m6-item-3" data-checklist-item-id="checklist-a3-a3-m6-item-3"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m6-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m6-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A3"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M4" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Explain the Decision Criteria to Students</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910" data-response-part-id="A3-transfer-prompt-a3-m4-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910-label" for="learner-workspace-a3-a3-transfer-prompt-a3-m4-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910-desc"><p>A Students&#39; Union representative is preparing a short update for first-year students who want to understand <strong>how the Student Success Committee will approach its decision</strong> about SSI. The representative does not yet have a committee recommendation.</p><p>Write a <strong>90–130-word briefing</strong> for the representative to use. Your purpose is different from the four-option comparison: communicate the basis for a responsible decision to a student audience rather than evaluate each institutional option in detail.</p><p>Your briefing should:</p><ul><li>Explain which kinds of evidence and student or staff consequences the committee must consider.</li><li>Distinguish recorded findings from unresolved questions about SSI&#39;s causal contribution, fairness or reliability.</li><li>Acknowledge why transparency, trust and student autonomy matter to the way the decision is explained.</li><li>Avoid announcing a preferred option, inventing a committee decision or promising a particular outcome.</li></ul><p>Use the case evidence already available. Write for students who may not be familiar with evaluation terminology, while retaining the distinction between what is known and what remains uncertain.</p></div><textarea class="util-learner-workspace__input" id="learner-workspace-a3-a3-transfer-prompt-a3-m4-910" name="learner-workspace-a3-a3-transfer-prompt-a3-m4-910" rows="5" aria-describedby="learner-workspace-a3-a3-transfer-prompt-a3-m4-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><aside class="util-study-tips" data-region="study-tips" id="journey-study-tips" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--study-tips" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg></span><span class="util-semantic-icon__label">Study tips</span></h2><div class="util-study-tips__content util-prose-measure"><ul><li><strong>From perspectives to consequences:</strong> Revisit the stakeholder accounts to distinguish reported experiences, potential benefits and harms, and the different responsibilities people bring to the decision.</li><li><strong>From observations to justified claims:</strong> Check denominators, comparison groups and evaluation limitations before treating continuation differences, flag-rate disparities or operational findings as grounds for an institutional conclusion.</li><li><strong>From evidence to feasible choices:</strong> Compare all four options using consistent criteria, acknowledging student experience, fairness, trust, staff capacity, the £48,000 annual SSI cost and the absence of approved additional recurring funding.</li><li><strong>For &#39;The Committee Recommendation&#39;:</strong> Carry forward your two most consequential trade-offs and a clearly stated uncertainty. These provide a basis for independent judgement without predetermining which option should be recommended.</li></ul></div></aside><style id="prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;position:fixed;top:var(--learner-sticky-nav-height,0px);left:0;right:0;z-index:40;margin:0 auto;max-width:42rem;width:calc(100% - 1.5rem);padding:.45rem .75rem;border:1px solid #cbd5e1;border-left:3px solid #64748b;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.12)}.util-learner-renderer-vnext .util-revision-reminder__chrome{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.35rem .75rem;margin:0 0 .2rem}.util-learner-renderer-vnext .util-revision-reminder__label{margin:0;font-size:.75rem;font-weight:650;color:#64748b}.util-learner-renderer-vnext .util-revision-reminder__statement{margin:0;font-size:.9rem;line-height:1.4;font-weight:600;color:#0f172a}.util-learner-renderer-vnext .util-revision-reminder__view{font:inherit;font-size:.9rem;color:#1d4ed8;background:transparent;border:0;padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}.util-learner-renderer-vnext .util-revision-reminder__view:focus{outline:2px so ng sections" data-journey-total="2"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Your recommendation to the Student Success Committee</span><p class="util-journey-position" aria-label="Section 1 of 2"><span class="util-journey-position__visible" aria-hidden="true">1 of 2</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#elicitation-self_review" aria-label="Next section: Review your recommendation"><span class="util-journey-adjacent__title">Review your recommendation</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#elicitation-recommendation" aria-current="location">Your recommendation to the Student Success Committee</a></li><li><a class="util-journey-all-link" href="#elicitation-self_review">Review your recommendation</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c5/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-assessment-intro" data-region="assessment-intro" data-journey-section="true"><p>You are preparing a recommendation for the Student Success Committee at Northbridge University, an entirely fictional public university in England. The committee must decide what should happen to Student Support Insight (SSI), an AI-assisted student support system, in the 2026/27 academic year. You have the complete case evidence, including encouraging findings, methodological limitations, operational concerns, stakeholder perspectives and institutional constraints. Your task is to make an independent, defensible recommendation and then review the quality of your reasoning. All four committee options are defensible in principle; there is no predetermined correct recommendation. This is a formative assessment, not a graded examination.</p><p>Allow approximately 25 minutes in total.

1. Independent recommendation — approximately 19 minutes. Review the complete fictional evidence dossier and write your recommendation to the Student Success Committee. Choose one of the four fixed options. Support your decision with specific quantitative and qualitative evidence, critically appraise limitations, integrate conflicting findings, weigh stakeholder benefits and harms, compare at least one plausible alternative, and propose proportionate safeguards, conditions or further evidence. Explain what remains uncertain.

2. Criteria-based self-review — approximately 6 minutes. Review your completed recommendation against six criteria: accuracy, critical appraisal, integration, stakeholder evaluation, proportionality and uncertainty. Identify one specific strength and one remaining weakness or assumption. Compare your final position with your initial judgement and confidence where possible. Make a concise revision if it would improve your reasoning.

The complete evidence is supplied within this assessment. You do not need to recall figures from earlier activities. Complete your recommendation independently before reviewing it. No model conclusion will be provided beforehand. Your written argument and reflection will not receive automatic correctness judgements, scores or grades.</p></section><section class="util-assessment-guidance util-assessment-section" data-region="assessment" id="journey-assessment" data-journey-section="true" data-assessment-product="assessment_pack" data-feedback-timing="per_component"><section class="util-assessment-orientation" data-region="assessment-orientation" id="journey-assessment-briefing" data-journey-section="true"><h3>What to bring with you</h3><ul><li><p>If you completed the earlier activities, revisit your initial judgement and confidence from &#39;The Promising Pilot&#39;, your evidence appraisal from &#39;Reading the Evidence Carefully&#39;, your revised or defended interpretation from &#39;When the Evidence Changes&#39;, and your stakeholder analysis from &#39;The People Behind the Decision&#39;.</p><p>Use these earlier judgements and analyses to inform your independent committee recommendation, then compare your final reasoning with your initial position and identify what has strengthened, changed or remains uncertain.</p></li></ul></section><article class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" id="elicitation-recommendation" data-elicitation-id="recommendation" data-journey-section="true"><h3>Your recommendation to the Student Success Committee</h3><section class="util-assessment-stimulus" data-region="assessment-stimulus" data-stimulus-kind="structured"><section class="util-assessment-stimulus__scenario" data-stimulus-part="scenario"><h4>Scenario</h4><p>Northbridge University is an entirely fictional public university in England. All people, institutional records, statements and evaluation findings in this dossier are invented for this educational activity; they are not authentic research findings or evidence about an actual institution or AI system. Northbridge introduced Student Support Insight (SSI) in September 2025 because of concerns about first-year students leaving before their second year. SSI uses existing information about engagement with university learning systems, attendance records where available, and assignment submission patterns to identify students who may benefit from additional academic support. It generates advisory support flags for authorised staff to review. Staff decide whether to contact a student and what support to offer. Students may decline support. SSI does not diagnose students, determine academic ability, award grades or automatically impose sanctions. Conventional academic support routes remain available to all students. The institutional objective is to improve access to timely support and increase first-year continuation without undermining trust, autonomy or equitable treatment. The Student Success Committee must recommend action for 2026/27 by 18 June 2026.</p></section><section class="util-assessment-stimulus__alternatives" data-stimulus-part="alternatives"><h4>Alternatives</h4><ol><li data-alternative-id="A"><p><strong>Option A — Continue unchanged</strong></p><p>Retain SSI and current procedures for 2026/27.</p></li><li data-alternative-id="B"><p><strong>Option B — Continue with safeguards and further evaluation</strong></p><p>Retain SSI while improving oversight, communication, data quality and evaluation within available resources.</p></li><li data-alternative-id="C"><p><strong>Option C — Restrict or temporarily suspend SSI</strong></p><p>Limit use or pause flag-generated contacts while investigating specified concerns; retain conventional support routes.</p></li><li data-alternative-id="D"><p><strong>Option D — Withdraw SSI</strong></p><p>End the system and rely on conventional academic support and the expanded adviser scheme.</p></li></ol></section><section class="util-assessment-stimulus__evidence" data-stimulus-part="evidence"><h4>Evidence</h4><article class="util-assessment-stimulus__evidence-item"><h5>Population, definitions and comparison basis</h5><p>The 2025/26 evaluation population comprises 2,000 first-year undergraduates: 500 flagged by SSI and 1,500 not flagged. Support contact means a recorded personalised offer of academic support following an SSI flag. Support engagement means attending at least one support conversation after that contact. Continuation means remaining enrolled or formally progressing to the next academic year at the evaluation cut-off of 31 May 2026. The historical comparison is the previous academic year&#39;s overall first-year continuation rate using the same definition.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>The historical comparison is observational, not a randomised control group. Flagged and unflagged students must not be assumed to be equivalent comparison groups.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-01 — Initial Evaluation Summary, 12 March 2026</h5><p>The preliminary institutional summary drew on first-semester and early second-semester indicators. Of 500 flagged students, 400 received recorded personalised support contact. Of those contacted, 240 engaged in at least one support conversation. Among the 240 engaged students, 216 (90%) were still enrolled at the preliminary reporting point. Among the 260 flagged students who had not engaged, 208 (80%) were still enrolled. The ten-percentage-point difference was described as encouraging. The summary recommended continuing the pilot while collecting more evidence.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>The 90% versus 80% comparison is an association within the flagged group and does not establish that support engagement caused improved enrolment. These are provisional enrolment indicators, not final continuation outcomes.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-02 — Final Continuation Data, 5 June 2026</h5><p>At the evaluation cut-off of 31 May 2026, 211 of 240 flagged and engaged students continued (87.9%); 205 of 260 flagged students who did not engage continued (78.8%); 416 of all 500 flagged students continued (83.2%); and 1,365 of 1,500 unflagged students continued (91.0%). Overall, 1,781 of 2,000 first-year students continued (89.1% when rounded to one decimal place). In the historical 2024/25 cohort, 1,720 of 2,000 continued (86.0%). The reported overall improvement is 3.1 percentage points using the rounded rates.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>The historical cohorts were not randomly assigned and other institutional changes occurred between years. The 3.1-percentage-point difference does not establish how much, if any, of the improvement was caused by SSI. Flagged and unflagged students are not equivalent groups, and preliminary enrolment and final continuation refer to different reporting points.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-03 — Evaluation Limitations Note, 8 June 2026</h5><p>Dr Priya Shah, Institutional Evaluation Lead, identifies several limitations. Students who engage with support may differ from those who do not in motivation, circumstances or existing support networks. The previous cohort is not an equivalent control group. An expanded first-year academic adviser scheme was also introduced in September 2025. Some attendance records were incomplete. Continuation does not fully represent wellbeing, confidence or educational experience. The evaluation cannot establish whether SSI performs better than an equally resourced non-AI approach.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>These limitations constrain causal attribution, comparison with other approaches and conclusions about students&#39; wider educational experiences. They do not independently establish that SSI has no benefit.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-04 — Operational and Equity Review, 10 June 2026: flag rates</h5><p>Among 300 students registered with a disability, 105 were flagged (35.0%). Among 1,700 students not registered with a disability, 395 were flagged (23.2% when rounded to one decimal place). Across the full population of 2,000 students, 500 were flagged (25.0%). The two disability-registration-status categories are exhaustive and mutually exclusive for this table, and status is recorded at the evaluation cut-off.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>The flag-rate difference alone does not establish discriminatory treatment, unequal prediction accuracy or its cause. Information about underlying support needs, flag accuracy and outcomes is insufficient to determine why the rates differ.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-04 — Operational and Equity Review, 10 June 2026: delivery and reliability</h5><p>Of 500 flagged students, 100 had no recorded personalised support contact. Staff identified 40 flagged cases where incomplete attendance information may have contributed to the flag. A separate review of 100 students who sought support through conventional routes found 30 who had not been flagged. Reviewing flags added approximately 25 hours of work per week across the academic support service during the busiest period.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>The 100 conventional-support users form a selected group, not a representative sample of all unflagged students. The review cannot establish an overall missed-identification rate or overall false-positive and false-negative rates. The 40 cases indicate possible data-quality concerns rather than confirmed incorrect flags.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-05 — Stakeholder Evidence Digest, 11 June 2026: Samira Khan</h5><p>Samira Khan, a first-year student, said: &quot;I was falling behind and didn&#39;t know who to ask. The message from my tutor made it easier to start a conversation. I probably wouldn&#39;t have contacted anyone myself.&quot;</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>This fictional individual account illustrates a possible benefit of SSI-initiated contact but does not establish how frequently other students experience that benefit.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-05 — Stakeholder Evidence Digest, 11 June 2026: Daniel Reed</h5><p>Daniel Reed, a first-year student, said: &quot;I was told my engagement suggested I might be struggling, but I was working offline and keeping up. I felt as though the university had already made up its mind about me.&quot;</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>This fictional individual account illustrates possible misinterpretation and harm to trust but does not establish the overall frequency of inaccurate or unwelcome SSI-related contact.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-05 — Stakeholder Evidence Digest, 11 June 2026: Bethan Hughes</h5><p>Bethan Hughes, a first-year student, said: &quot;I missed deadlines because things were difficult at home. Nobody contacted me through the new system. I found help later through my course administrator.&quot;</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>This fictional individual account illustrates a possible missed support opportunity and the continuing importance of conventional support routes. It does not establish SSI&#39;s overall missed-identification rate.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-05 — Stakeholder Evidence Digest, 11 June 2026: Tom Ellis</h5><p>Tom Ellis, Head of Academic Support, said: &quot;Some students have benefited from earlier contact, but the flags aren&#39;t always straightforward. Staff need time to check the context, and that has an impact on other support work.&quot;</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>This fictional operational perspective identifies a potential trade-off between early contact and staff capacity. It does not quantify benefits or opportunity costs beyond the separately reported workload evidence.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-05 — Stakeholder Evidence Digest, 11 June 2026: Morgan Price</h5><p>Morgan Price, Students&#39; Union Education Officer, said: &quot;Students want support, but they also want to understand how decisions about them are made. We shouldn&#39;t assume that a well-intentioned system automatically feels supportive.&quot;</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>This fictional representative&#39;s perspective highlights transparency and trust concerns but is not a representative survey measurement of student attitudes.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-05 — Stakeholder Evidence Digest, 11 June 2026: Dr Aisha Rahman</h5><p>Dr Aisha Rahman, Director of Student Success, said: &quot;The early signs are encouraging. I would be reluctant to lose a potentially useful route to support before we&#39;ve had a fair opportunity to improve it.&quot;</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>This fictional stakeholder interpretation favours considering further development, but the early findings do not establish SSI&#39;s causal effectiveness or justify assuming future improvements.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-05 — Stakeholder Evidence Digest, 11 June 2026: Dr Priya Shah</h5><p>Dr Priya Shah, Institutional Evaluation Lead, said: &quot;The evidence is consistent with possible benefit, but we cannot yet isolate the effect of SSI from other changes or establish whether the benefits and risks are distributed fairly.&quot;</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>This fictional evaluation perspective identifies unresolved causal and equity questions. It does not determine which institutional option must be chosen.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-06 — Decision Brief, 15 June 2026</h5><p>The Student Success Committee, chaired by Professor Helen Ward, Pro-Vice-Chancellor (Education), must recommend a course of action for 2026/27 by 18 June 2026. Professor Ward is accountable for the decision and concerned with continuation, fairness, resources and institutional confidence. SSI costs £48,000 per academic year in software licensing and associated administration, excluding additional staff time. No additional recurring budget has been approved for 2026/27. Conventional academic support services and the expanded academic adviser scheme will remain available. The committee must consider educational benefits, evidential limitations, fairness, reliability, student experience, staff capacity and financial implications.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>Recommendations must remain feasible within available resources and must not assume unapproved funding or certain future outcomes. Conditions, safeguards, review dates and evidence requirements may accompany any of the four options. No option is designated correct.</p></article></section><section class="util-assessment-stimulus__boundary" data-stimulus-part="evidence-boundary"><p>All case information is fictional and synthetic. Use the evidence to make an institutional judgement, not to infer technical AI model properties that have not been evaluated. Associations do not establish causation; subgroup flag-rate differences do not establish discrimination or prediction accuracy; selected examples do not establish population error rates; and individual accounts do not establish prevalence. All four options remain defensible in principle.</p></section></section><p>It is 18 June 2026. Northbridge University&#39;s Student Success Committee, chaired by Professor Helen Ward, must decide what should happen to Student Support Insight (SSI) in 2026/27. You have the complete fictional case dossier below. The committee needs a reasoned recommendation, not a claim that the evidence proves one option is correct. All four options are open to you.</p><p>Write your independent recommendation to the committee. Select Option A, B, C or D and explain why you prefer it. Use specific quantitative findings and relevant stakeholder accounts from the dossier. Critically examine important limitations, including what the evidence cannot establish. Bring together findings that point in different directions and explain their implications. Weigh benefits and harms for students, staff and the institution, including fairness, trust, operational reliability and resources. Compare your preferred action with at least one plausible alternative. Recommend proportionate safeguards, conditions, a review arrangement or further evidence as appropriate. Explain the uncertainty that remains and why your choice is nevertheless defensible.</p><p>Produce a coherent committee recommendation in your own words. Make the preferred action explicit, support it with accurate evidence, explain your reasoning and trade-offs, and identify feasible conditions or evidence needs. You may choose any of the four options; the quality of your reasoning matters more than which option you select. Complete this recommendation independently before beginning your self-review.</p><p>Approximately 350–500 words. This is a flexible guide, not a strict limit.</p><p>Approximately 19 minutes, including reviewing the evidence and writing your recommendation.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-recommendation" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="assessment-constructed-recommendation">Your response</label><p>Write in connected prose, using short headings if helpful. Refer to specific evidence and explain why it matters. You may organise your recommendation around your preferred action, supporting evidence, limitations, stakeholder consequences, alternative options and conditions.</p><textarea class="util-learner-workspace__input" id="assessment-constructed-recommendation" name="assessment-constructed-recommendation" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="assessment-constructed-recommendation-review">Review your response</button></p><div id="assessment-constructed-recommendation-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="recommendation_criteria"><p>Your recommendation is not judged by whether you chose Option A, B, C or D. Each is defensible in principle. Review the reasoning you have written against six criteria: Accuracy — are the figures, definitions and reporting points correct? Critical appraisal — have you explained what the evidence cannot establish? Integration — have you brought together encouraging findings, conflicting evidence and stakeholder experiences? Stakeholder evaluation — have you weighed benefits and harms for students, staff and the institution? Proportionality — have you justified a feasible action against at least one alternative and identified appropriate conditions or evidence needs? Uncertainty — have you acknowledged unresolved questions without treating uncertainty as proof that action is impossible?</p></article><article class="util-formative-material" data-material-id="recommendation_evidence_boundaries"><p>Check the limits of your claims. The preliminary 90% versus 80% finding compares enrolment among flagged students who did and did not engage; it does not show that engagement caused the difference. The final overall continuation rate was 89.1%, compared with 86.0% historically, but the 3.1-percentage-point observed difference cannot be attributed to SSI alone. The 35.0% versus 23.2% disability-registration flag rates do not establish discrimination or prediction accuracy. The 30 unflagged students in the selected group of 100 conventional-support users do not establish an overall missed-identification rate. Individual accounts illuminate experiences without establishing their prevalence. These distinctions help you make a proportionate recommendation rather than an overconfident one.</p></article><article class="util-formative-material" data-material-id="recommendation_decision_check"><p>A defensible recommendation connects the evidence to a practical decision. Consider whether you have explained what your preferred option may preserve, improve, risk or give up; why at least one alternative is less suitable under your stated priorities; and how your proposed safeguards, conditions or evidence requirements fit the available resources. SSI costs £48,000 annually excluding additional staff time, no additional recurring budget is approved, and conventional support and the expanded adviser scheme remain available. A well-supported judgement may still acknowledge that important questions cannot yet be answered.</p></article></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Now review the recommendation you actually wrote. Use the six criteria to identify one strength and one remaining weakness or assumption, then consider how your final judgement compares with your initial position. You do not need to change your chosen option to demonstrate thoughtful reflection.</p></section></article><article class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" id="elicitation-self_review" data-elicitation-id="self_review" data-journey-section="true"><h3>Review your recommendation</h3><p>You have now written your independent recommendation to Northbridge University&#39;s Student Success Committee. Review the reasoning you actually used, rather than judging your work by whether you selected a supposedly correct option. All four committee options remain defensible in principle.</p><p>Read your recommendation against the six criteria below. Identify one specific strength in your reasoning and one remaining weakness, assumption or uncertainty. Explain how your final position compares with the provisional judgement and confidence you expressed in &#39;The Promising Pilot&#39;, if you completed that activity. Consider whether the evidence appraisal developed in &#39;Reading the Evidence Carefully&#39;, the conflicting findings considered in &#39;When the Evidence Changes&#39;, and the stakeholder perspectives examined in &#39;The People Behind the Decision&#39; strengthened, changed or qualified your reasoning. If you identify an important improvement, make one concise revision to your recommendation.</p><p>Write a brief, specific self-review referring to features of your own recommendation. Identify one strength, one remaining weakness or assumption, and how your judgement developed. You may retain your preferred option or revise it; a change of position is not required. Make a concise improvement if it would strengthen your reasoning.</p><p>Approximately 100–150 words, plus an optional concise revision.</p><p>Approximately 6 minutes.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-self_review" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="assessment-constructed-self_review">Your response</label><p>Be specific about your own argument. Identify one convincing feature and one point that remains uncertain or could be improved. Explain what influenced your judgement, then revise a sentence or short passage if useful.</p><textarea class="util-learner-workspace__input" id="assessment-constructed-self_review" name="assessment-constructed-self_review" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="assessment-constructed-self_review-review">Review your response</button></p><div id="assessment-constructed-self_review-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="self_review_quality"><p>A useful self-review identifies specific features of your own reasoning rather than simply declaring the recommendation strong or weak. A strength might be an accurate comparison, a carefully qualified inference, a convincing synthesis of competing evidence or a balanced consideration of stakeholder consequences. A remaining weakness might be an assumption you have not tested, an alternative you have not fully considered, an uncertain effect on students or an unresolved question about feasibility. Explain why the feature matters to the recommendation.</p></article><article class="util-formative-material" data-material-id="self_review_judgement_development"><p>Compare your final judgement with your initial position and confidence where you have an earlier response available. A change in preferred option may show that new evidence affected your priorities, but keeping the same option can also reflect careful reasoning if you can explain how your justification became more qualified or better supported. If you cannot refer to an earlier response, identify the assumptions and uncertainties that shaped your present judgement without inventing an earlier position.</p></article><article class="util-formative-material" data-material-id="self_review_revision"><p>If your self-review identifies a meaningful improvement, a concise revision is enough. You might correct a numerical interpretation, qualify an unsupported claim, make a stakeholder trade-off more explicit, strengthen the comparison with an alternative or specify a more feasible condition for review. A revision should make your own argument clearer or more defensible; it does not need to change the committee option you selected.</p></article></section><section class="util-assessment-revision" data-region="assessment-revision" data-automated-judgement="false"><p class="util-revision-offer" data-revision-offered="true">If your self-review identified an important weakness or assumption, revise one sentence or short passage of your recommendation to address it. You may retain your original preferred option. Make the change because it improves the reasoning, not because a particular answer is expected.</p><div class="util-learner-workspace" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-self_review-weakness" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="assessment-constructed-self_review-weakness">What is the most important weakness you identified in your argument?</label><textarea class="util-learner-workspace__input" id="assessment-constructed-self_review-weakness" name="assessment-constructed-self_review-weakness" rows="3"></textarea></div><p>Revision is yours to make. It is not marked correct or incorrect.</p><p><a href="#assessment-constructed-self_review" data-assessment-return-to-response="assessment-constructed-self_review">Revise your written judgement</a></p></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>You have completed the independent recommendation and its criteria-based review. Consider what this exercise shows about your approach to institutional decisions: which kinds of evidence you use confidently, where you remain cautious, and how you balance possible benefits against uncertainty and consequences. Keep your recommendation and reflection together as a record of your reasoning.</p></section></article><section class="util-pack-forward" data-region="pack-forward" id="journey-assessment-pack-forward" data-journey-section="true"><h2>What to take forward</h2><p>Your completed recommendation and self-review provide a record of how you made a consequential institutional judgement using incomplete and sometimes conflicting evidence. The value of this work lies in the accuracy, transparency, balance and proportionality of your reasoning, not in selecting a predetermined committee option. Retain both pieces together so you can revisit how your position developed, what evidence mattered most and which uncertainties would warrant further investigation. This is formative reflection, not an automated evaluation, grade or progression decision.</p></section></section></article></template></div><script type="application/json" id="lj-shell-manifest">[{"commissionId":"overview","title":"Overview","kind":"overview","pageKey":"","productId":""},{"commissionId":"c1","title":"The Promising Pilot","kind":"resource","pageKey":"v1::22413210-0d16-40e4-93bf-4abac348bfd6::learner-page::2.0.0::a1-a2-a3-a4::the-promising-pilot:-making-sense-of-early-evidence","productId":"interactive"},{"commissionId":"c2","title":"Reading the Evidence Carefully","kind":"resource","pageKey":"v1::ac3616c5-e047-49fb-9682-b9b23f61e2f6::learner-page::2.0.0::no-activities::reading-the-evidence-carefully","productId":"expository"},{"commissionId":"c3","title":"When the Evidence Changes","kind":"resource","pageKey":"v1::5709435c-6757-4d78-9226-160e83209ee7::learner-page::2.0.0::a1-a2-a3-a4::student-support-insight:-weighing-new-evidence","productId":"interactive"},{"commissionId":"c4","title":"The People Behind the Decision","kind":"resource","pageKey":"v1::f701b3d4-79f5-4cbb-a43c-5cdde345833e::learner-page::2.0.0::a1-a2-a3::student-support-insight:-evidence-people-and-choices","productId":"interactive"},{"commissionId":"c5","title":"The Committee Recommendation","kind":"resource","pageKey":"v1::d13fd7cd-9d85-459d-b5a2-1b7995175ad2::learner-page::2.0.0::no-activities::the-committee-recommendation","productId":"assessment_pack"}]</script><script type="application/json" id="lj-shell-artefact-contract">{"produces":[],"references":[],"conflicts":[]}</script><script src="runtime/learner-renderer-vnext-browser.js" data-lj-shell-runtime="external"></script><script data-lj-shell-controller="true">(function(){var api=window.PRISM_LEARNER_RENDERER_VNEXT;if(!api||typeof api.mountLearnerResource!=='function'){console.error('PRISM unified shell: mount API missing');return;}var manifestEl=document.getElementById('lj-shell-manifest');if(!manifestEl)return;var resources=[];try{resources=JSON.
