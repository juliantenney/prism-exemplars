nal continuation</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r1-c1" name="a1-a1-m3-input-r1-c1" data-learner-cell="a1-a1-m3-input-r1-c1" rows="3" aria-labelledby="a1-a1-m3-row-1 a1-a1-m3-col-groups-and-reporting-points-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r1-c2" name="a1-a1-m3-input-r1-c2" data-learner-cell="a1-a1-m3-input-r1-c2" rows="3" aria-labelledby="a1-a1-m3-row-1 a1-a1-m3-col-observed-finding-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r1-c3" name="a1-a1-m3-input-r1-c3" data-learner-cell="a1-a1-m3-input-r1-c3" rows="3" aria-labelledby="a1-a1-m3-row-1 a1-a1-m3-col-what-it-supports-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r1-c4" name="a1-a1-m3-input-r1-c4" data-learner-cell="a1-a1-m3-input-r1-c4" rows="3" aria-labelledby="a1-a1-m3-row-1 a1-a1-m3-col-limitation-or-alternative-explanation-4" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a1-a1-m3-row-2" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">Overall 2025/26 versus 2024/25 continuation</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r2-c1" name="a1-a1-m3-input-r2-c1" data-learner-cell="a1-a1-m3-input-r2-c1" rows="3" aria-labelledby="a1-a1-m3-row-2 a1-a1-m3-col-groups-and-reporting-points-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r2-c2" name="a1-a1-m3-input-r2-c2" data-learner-cell="a1-a1-m3-input-r2-c2" rows="3" aria-labelledby="a1-a1-m3-row-2 a1-a1-m3-col-observed-finding-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r2-c3" name="a1-a1-m3-input-r2-c3" data-learner-cell="a1-a1-m3-input-r2-c3" rows="3" aria-labelledby="a1-a1-m3-row-2 a1-a1-m3-col-what-it-supports-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m3-input-r2-c4" name="a1-a1-m3-input-r2-c4" data-learner-cell="a1-a1-m3-input-r2-c4" rows="3" aria-labelledby="a1-a1-m3-row-2 a1-a1-m3-col-limitation-or-alternative-explanation-4" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain which comparisons are informative, which are limited, and why differences between reporting points and groups matter.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A1-M2" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Evaluation Limitations Note</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-03 — Evaluation Limitations Note</h3><p><strong>Northbridge University | 8 June 2026 | Evaluation lead: Dr Priya Shah | Fictional institutional record</strong></p><p>The evaluation lead identifies six limitations of the available evidence:</p><ol><li><strong>Engagement-group selection:</strong> Students who engaged with support may differ from those who did not in motivation, personal circumstances and existing support networks.</li><li><strong>Historical cohort comparison:</strong> The 2024/25 and 2025/26 first-year cohorts are not equivalent comparison groups.</li><li><strong>Concurrent institutional change:</strong> An expanded first-year academic adviser scheme was introduced in September 2025, alongside SSI.</li><li><strong>Attendance information:</strong> Some attendance records used by the support process were incomplete.</li><li><strong>Outcome coverage:</strong> Continuation is an incomplete measure of student wellbeing, confidence and educational experience.</li><li><strong>Alternative support provision:</strong> The evaluation cannot establish whether SSI performs better than an equally resourced approach without AI-assisted flagging.</li></ol><p>Use these recorded limitations alongside the outcome tables. Decide which are relevant to each comparison and how far each comparison supports an inference. A possible alternative explanation is not itself a demonstrated cause.</p></article></li></ol></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify at least two plausible alternative explanations or limitations affecting claims about SSI&#39;s contribution to continuation.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A completed evidence comparison that accurately identifies relevant populations, denominators, reporting points and observed differences; distinguishes associations from causal claims; and explains at least two substantive limitations or alternative explanations without presenting them as proven causes.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-task-step-step-3-3" data-response-part-id="A1-task-step-step-3-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-task-step-step-3-3-label" for="learner-workspace-a1-a1-task-step-step-3-3">Your response</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-task-step-step-3-3-desc">Explain which comparisons are informative, which are limited, and why differences between reporting points and groups matter.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-task-step-step-3-3" name="learner-workspace-a1-a1-task-step-step-3-3" rows="6" aria-describedby="learner-workspace-a1-a1-task-step-step-3-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-task-step-step-4-4" data-response-part-id="A1-task-step-step-4-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-task-step-step-4-4-label" for="learner-workspace-a1-a1-task-step-step-4-4">Your response</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-task-step-step-4-4-desc">Identify at least two plausible alternative explanations or limitations affecting claims about SSI&#39;s contribution to continuation.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-task-step-step-4-4" name="learner-workspace-a1-a1-task-step-step-4-4" rows="6" aria-describedby="learner-workspace-a1-a1-task-step-step-4-4-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#learner-check-a1" data-check-sidebar-open aria-controls="learner-check-a1" aria-expanded="false" aria-label="Check your work: Compare the Continuation Findings">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a1" data-composition-moment="check" data-activity-id="A1" data-check-sidebar="available" aria-labelledby="learner-check-a1-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="learner-check-a1-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a1">Back to your task (Compare the Continuation Findings)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m4-c-0" data-revision-criterion-id="a1-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you reported the numerical comparisons using the correct counts, denominators and percentages?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An incorrect denominator changes the population being compared and can make a reported difference misleading.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each observed finding identifies its numerator and denominator, not just a percentage.</li><li><span class="util-guided-review__feature-key">B.</span> The engagement, flag-status and historical comparisons use their respective recorded populations.</li><li><span class="util-guided-review__feature-key">C.</span> Reported differences use percentage points where comparing rates.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Return to the relevant source table and add the count of students meeting the outcome and the total number in that group.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Separate the 240 engaged and 260 non-engaged flagged students from the 500 flagged and 1500 unflagged students, and distinguish both from the annual cohorts.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Where you compare two percentages, state the difference in percentage points rather than treating it as a relative percentage change.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-0" data-checklist-item-id="checklist-a1-a1-m4-item-0"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m4-c-1" data-revision-criterion-id="a1-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you distinguished reporting points, outcome measures and comparison groups?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A comparison can appear stronger than it is when preliminary enrolment, final continuation or differently constituted groups are treated as interchangeable.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The preliminary enrolment figures and the 31 May final continuation figures are explicitly distinguished.</li><li><span class="util-guided-review__feature-key">B.</span> The historical comparison is identified as a comparison between different annual cohorts.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the outcome and reporting point beside each relevant comparison rather than treating both records as one final measure.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify 2024/25 and 2025/26 as separate cohorts and state why this affects direct comparability.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-1" data-checklist-item-id="checklist-a1-a1-m4-item-1"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m4-c-2" data-revision-criterion-id="a1-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you kept observed associations separate from claims about SSI causing outcomes?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A numerical difference does not by itself identify what produced that difference.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each inference states what the recorded comparison can establish without claiming a demonstrated SSI effect.</li><li><span class="util-guided-review__feature-key">B.</span> The engaged versus non-engaged comparison recognises that engagement was not randomly assigned.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Rewrite any causal conclusion as an observation about the relevant groups or years, then identify what causal question remains unresolved.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Consider whether differences in students&#39; circumstances, motivation or support networks could affect the comparison independently of engagement.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-2" data-checklist-item-id="checklist-a1-a1-m4-item-2"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m4-c-3" data-revision-criterion-id="a1-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you used at least two relevant methodological limitations to qualify your interpretations?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An appraisal that lists limitations without connecting them to particular inferences does not show why the evidence warrants caution.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> At least two distinct limitations or alternative explanations appear in the completed workspace.</li><li><span class="util-guided-review__feature-key">B.</span> Each selected limitation is linked to the inference it restricts.</li><li><span class="util-guided-review__feature-key">C.</span> Possible explanations are not presented as established causes.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Select two different issues from NB-SSI-03 and identify which comparison each could affect.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain what conclusion becomes less secure because of the limitation, rather than simply naming the issue.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Distinguish a plausible competing explanation from an explanation actually demonstrated by the available records.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-3" data-checklist-item-id="checklist-a1-a1-m4-item-3"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Weigh Benefits and Operational Concerns</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Evaluate operational, equity and student-experience evidence, distinguishing recorded findings from unsupported conclusions about discrimination, identification accuracy or prevalence.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Having distinguished observed outcomes from unsupported causal claims, apply the same evidential discipline to implementation, equity and student experience. These sources introduce different kinds of findings and different limits on generalisation.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>The continuation figures are only one part of the evaluation. Operational records and individual student experiences provide further evidence about how the support process worked and how it was experienced.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">For each finding, separate the recorded observation or individual account from the inference it might support. Assess relevance, scope and limitations before judging its significance.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which finding raises an important question without answering it, and what additional information would be needed to resolve that question?</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the operational and equity review and the three selected student accounts.</p></span></div><article class="util-material-block util-material-table-block" data-material-id="A2-M1" data-material-type="data_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Operational and Equity Review</span></p><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-04 — Operational and Equity Review</h3><p><strong>Northbridge University | 10 June 2026 | Fictional institutional record</strong></p><h3 class="util-md-heading util-md-heading--source-3">SSI flags by recorded disability-registration status</h3><div class="util-table-scroll util-material-table"><table><thead><tr><th>Disability-registration status</th><th>Students flagged</th><th>Students in category</th><th>Flag rate</th></tr></thead><tbody><tr><td>Registered with the university as disabled</td><td>105</td><td>300</td><td>35.0%</td></tr><tr><td>Not registered as disabled</td><td>395</td><td>1700</td><td>23.2%</td></tr><tr><td>Total</td><td>500</td><td>2000</td><td>25.0%</td></tr></tbody></table></div><p>For this table, the registration categories are mutually exclusive and exhaustive. Registration status was recorded at the evaluation cut-off.</p><h3 class="util-md-heading util-md-heading--source-3">Operational observations</h3><div class="util-table-scroll util-material-table"><table><thead><tr><th>Recorded item</th><th>Finding</th><th>Source qualification</th></tr></thead><tbody><tr><td>Personalised contact</td><td>100 of 500 flagged students had no recorded personalised support contact</td><td>A missing recorded contact does not establish that no support was available by another route.</td></tr><tr><td>Attendance information</td><td>40 flagged cases may have been affected by incomplete attendance information</td><td>The review does not establish whether each affected flag was correct or incorrect.</td></tr><tr><td>Conventional support-seeker review</td><td>30 students were not flagged among a selected group of 100 students who sought conventional support</td><td>This selected group is not a representative sample of all students or all unflagged students.</td></tr><tr><td>Staff workload</td><td>Approximately 25 additional staff hours per week during the busiest period</td><td>This is a busiest-period estimate rather than a complete annual staff-cost calculation.</td></tr></tbody></table></div><h3 class="util-md-heading util-md-heading--source-3">Recorded evidential limits</h3><p>The difference between disability-registration flag rates does not, by itself, establish discriminatory treatment, differential identification accuracy or the cause of the difference. The available information does not establish SSI&#39;s overall false-positive or false-negative rates.</p><p>Use these source particulars to assess the significance and evidential weight of the findings. Keep the recorded observation separate from conclusions requiring additional evidence.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Complete the evidence appraisal table for the disability-registration flag-rate difference, recorded contact gaps, potentially incomplete attendance information, selected conventional support-seeker review, staff workload and student experiences.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A2-M2" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Three Student Accounts</span></p><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-05 — Stakeholder Evidence Digest</h3><p><strong>Northbridge University | 11 June 2026 | Fictional individual accounts</strong></p><p>The following are the original first-person statements from the three selected student accounts.</p><h3 class="util-md-heading util-md-heading--source-3">Samira Khan</h3><p>&gt; I was falling behind and didn&#39;t know who to ask. The message from my tutor made it easier to start a conversation. I probably wouldn&#39;t have contacted anyone myself.</p><h3 class="util-md-heading util-md-heading--source-3">Daniel Reed</h3><p>&gt; I was told my engagement suggested I might be struggling, but I was working offline and keeping up. I felt as though the university had already made up its mind about me.</p><h3 class="util-md-heading util-md-heading--source-3">Bethan Hughes</h3><p>&gt; I missed deadlines because things were difficult at home. Nobody contacted me through the new system. I found help later through my course administrator.</p><p>These are three fictional individual accounts, not representative survey findings. The records do not establish that any of these individuals belongs to a particular case or selected sample reported in NB-SSI-04.</p><p>Read each account as individual testimony. Consider how its specific wording relates to the operational findings, and distinguish that relationship from an unsupported claim about how frequently an experience occurs.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>For each entry, identify what the evidence shows, its significance for evaluating SSI and a conclusion it cannot establish.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-wor oup-level patterns and individual experiences; weighs possible benefits and concerns using source-specific limitations; and avoids unsupported conclusions about discrimination, overall identification accuracy or the prevalence of particular experiences.</p></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-task-step-step-4-4" data-response-part-id="A2-task-step-step-4-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-task-step-step-4-4-label" for="learner-workspace-a2-a2-task-step-step-4-4">Your response</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-task-step-step-4-4-desc">Explain how at least one individual account complements or complicates a quantitative finding without assuming that the account belongs to the recorded operational sample.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-task-step-step-4-4" name="learner-workspace-a2-a2-task-step-step-4-4" rows="6" aria-describedby="learner-workspace-a2-a2-task-step-step-4-4-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#learner-check-a2" data-check-sidebar-open aria-controls="learner-check-a2" aria-expanded="false" aria-label="Check your work: Weigh Benefits and Operational Concerns">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a2" data-composition-moment="check" data-activity-id="A2" data-check-sidebar="available" aria-labelledby="learner-check-a2-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="learner-check-a2-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a2">Back to your task (Weigh Benefits and Operational Concerns)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m4-c-0" data-revision-criterion-id="a2-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you represented the operational figures and the three student accounts faithfully?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Misstating a source changes the evidence on which the subsequent appraisal depends.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The disability-registration comparison uses the correct flagged counts, group totals and rates.</li><li><span class="util-guided-review__feature-key">B.</span> The contact, attendance, selected support-seeker and workload entries retain their recorded scope.</li><li><span class="util-guided-review__feature-key">C.</span> Any reference to Samira, Daniel or Bethan is grounded in that person&#39;s actual statement.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Restore the source numerators and denominators for each registration category before interpreting the difference.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Specify whether each number concerns flagged students, potentially affected cases, a selected sample or busiest-period staff time.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Return to the named first-person statement and replace any attributed experience that the speaker did not report.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-0" data-checklist-item-id="checklist-a2-a2-m4-item-0"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m4-c-1" data-revision-criterion-id="a2-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you separated what was observed or reported from what you infer about its significance?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A concern can be relevant without the record establishing its cause, prevalence or eventual consequence.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The observation column records source particulars rather than a conclusion about SSI&#39;s overall performance.</li><li><span class="util-guided-review__feature-key">B.</span> Each significance judgement explains how the item bears on possible benefit, concern or implementation.</li><li><span class="util-guided-review__feature-key">C.</span> At least one account is related to a quantitative finding without inventing a case-level linkage.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Move your evaluative interpretation to the significance column and restore the direct recorded value or testimony to the observation column.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect the particular finding to a relevant educational or operational question instead of merely calling it positive or negative.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain the conceptual relationship between the experience and the operational measure, while stating that the records do not identify the speaker as one of the measured cases.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-1" data-checklist-item-id="checklist-a2-a2-m4-item-1"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m4-c-2" data-revision-criterion-id="a2-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you respected the limits of selected samples, individual accounts and group differences?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Generalising beyond the observed group can turn a legitimate concern into an unsupported estimate or accusation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The selected conventional support-seeker figures are not treated as an overall false-negative rate.</li><li><span class="util-guided-review__feature-key">B.</span> Individual statements are not treated as evidence of how common each experience is.</li><li><span class="util-guided-review__feature-key">C.</span> The disability-registration rate difference is not treated as proof of discrimination or unequal accuracy.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the selected sample&#39;s denominator and distinguish it from the entire first-year cohort or all unflagged students.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Qualify prevalence claims and identify the accounts as individual experiences rather than representative survey results.</li><li><span class="util-guided-review__feature-key">Missing C:</span> State the observed group-rate difference separately from unresolved questions about support needs, identification accuracy and causes.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-2" data-checklist-item-id="checklist-a2-a2-m4-item-2"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m4-c-3" data-revision-criterion-id="a2-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you justified the weight given to each finding using its relevance and evidential limitations?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Evidence weighting requires explaining why a source can support some claims more securely than others.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each row includes a reasoned assessment of relevance to evaluating SSI.</li><li><span class="util-guided-review__feature-key">B.</span> Evidence weight is qualified by reliability, completeness, representativeness or inferential scope.</li><li><span class="util-guided-review__feature-key">C.</span> The appraisal acknowledges competing considerations rather than treating all evidence as pointing in one direction.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the specific benefit, concern or operational consequence to which that evidence item relates.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify the source-specific strength and the corresponding limitation that determines how far your judgement can extend.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Where relevant, explain how a possible benefit, an operational burden or an unresolved risk changes the weight of the item without forcing a single overall verdict.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m4-item-3" data-checklist-item-id="checklist-a2-a2-m4-item-3"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Reconcile the Evidence</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Integrate the evidence across sources, identifying and explaining significant tensions while maintaining appropriate uncertainty about causes and overall effects.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The first two activities established the numerical comparisons and examined the limitations of operational and individual-experience evidence. Bring these appraisals together to judge how strongly the combined records support different aspects of the initial positive interpretation.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>The records contain findings that can support different interpretations. Your task is to develop a coherent account of what the evidence collectively establishes, where it creates tension and what remains uncertain.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Look for tensions between findings rather than treating the evidence as a simple vote for or against SSI. Examine whether differences in populations, measures, reporting points or evidential scope can explain apparent contradictions.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Can two apparently opposing findings both be valid because they address different questions? Explain using a specific pair of records.</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Reinspect the supplied evidence extracts and your comparison and appraisal work.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M2" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Evidential Tensions and Qualified Synthesis Workspace</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify at least two significant tensions between the earlier encouraging interpretation and the newly available findings.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A3-M1" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Source Dossier for Cross-Evidence Synthesis</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-2">Northbridge University — SSI Evidence Dossier</h3><p>These source-labelled records concern the fictional Student Support Insight evaluation. Use the original figures, source dates and selected first-person statements to identify and analyse at least two evidential tensions. The dossier does not prescribe which tensions to select or how to resolve them.</p><h3 class="util-md-heading util-md-heading--source-3">NB-SSI-01 — Initial Evaluation Summary</h3><p><strong>12 March 2026 | Preliminary enrolment reporting point</strong></p><table><thead><tr><th>Recorded measure</th><th>Value</th></tr></thead><tbody><tr><td>First-year students flagged by SSI</td><td>500</td></tr><tr><td>Flagged students receiving recorded personalised support contact</td><td>400</td></tr><tr><td>Flagged students engaged with support</td><td>240</td></tr><tr><td>Engaged flagged students enrolled at preliminary reporting point</td><td>216/240 (90.0%)</td></tr><tr><td>Non-engaged flagged students enrolled at preliminary reporting point</td><td>208/260 (80.0%)</td></tr></tbody></table><p>The initial evaluation records an association between support engagement and preliminary enrolment, not a demonstrated causal effect.</p><h3 class="util-md-heading util-md-heading--source-3">NB-SSI-02 — Final Continuation Data</h3><p><strong>5 June 2026 | Continuation measured at 31 May 2026</strong></p><table><thead><tr><th>Group or year</th><th>Continued</th><th>Total</th><th>Reported rate</th></tr></thead><tbody><tr><td>Engaged flagged students</td><td>211</td><td>240</td><td>87.9%</td></tr><tr><td>Non-engaged flagged students</td><td>205</td><td>260</td><td>78.8%</td></tr><tr><td>All flagged students</td><td>416</td><td>500</td><td>83.2%</td></tr><tr><td>Unflagged students</td><td>1365</td><td>1500</td><td>91.0%</td></tr><tr><td>All first-year students, 2025/26</td><td>1781</td><td>2000</td><td>89.1%</td></tr><tr><td>All first-year students, 2024/25</td><td>1720</td><td>2000</td><td>86.0%</td></tr></tbody></table><p>The reported historical difference is 3.1 percentage points using the rounded overall rates. Preliminary enrolment and final continuation are different reporting measures.</p><h3 class="util-md-heading util-md-heading--source-3">NB-SSI-03 — Evaluation Limitations Note</h3><p><strong>8 June 2026 | Evaluation lead: Dr Priya Shah</strong></p><p>The evaluation identifies these limitations:</p><ol><li>Students engaging with support may differ from non-engaging students in motivation, circumstances and existing support networks.</li><li>The 2024/25 and 2025/26 cohorts are not equivalent comparison groups.</li><li>An expanded first-year academic adviser scheme was introduced in September 2025, alongside SSI.</li><li>Some attendance records were incomplete.</li><li>Continuation does not fully represent student wellbeing, confidence or educational experience.</li><li>The available evidence does not establish whether SSI outperforms equally resourced support without AI-assisted flagging.</li></ol><h3 class="util-md-heading util-md-heading--source-3">NB-SSI-04 — Operational and Equity Review</h3><p><strong>10 June 2026</strong></p><table><thead><tr><th>Recorded measure</th><th>Value</th></tr></thead><tbody><tr><td>Registered-with-disability students flagged</td><td>105/300 (35.0%)</td></tr><tr><td>Students not registered as disabled who were flagged</td><td>395/1700 (23.2%)</td></tr><tr><td>All first-year students flagged</td><td>500/2000 (25.0%)</td></tr><tr><td>Flagged students without recorded personalised contact</td><td>100/500</td></tr><tr><td>Flagged cases potentially affected by incomplete attendance information</td><td>40</td></tr><tr><td>Unflagged students among a selected group of conventional support seekers</td><td>30/100</td></tr><tr><td>Additional staff workload in busiest period</td><td>Approximately 25 hours per week</td></tr></tbody></table><p>The disability-registration categories are exhaustive and mutually exclusive, with status recorded at the evaluation cut-off. The rate difference does not establish discriminatory treatment or unequal prediction accuracy. The conventional support-seeker group is selected rather than representative. Overall false-positive and false-negative rates are unknown.</p><h3 class="util-md-heading util-md-heading--source-3">NB-SSI-05 — Stakeholder Evidence Digest</h3><p><strong>11 June 2026 | Selected fictional student accounts</strong></p><p><strong>Samira Khan</strong></p><p>&gt; I was falling behind and didn&#39;t know who to ask. The message from my tutor made it easier to start a conversation. I probably wouldn&#39;t have contacted anyone myself.</p><p><strong>Daniel Reed</strong></p><p>&gt; I was told my engagement suggested I might be struggling, but I was working offline and keeping up. I felt as though the university had already made up its mind about me.</p><p><strong>Bethan Hughes</strong></p><p>&gt; I missed deadlines because things were difficult at home. Nobody contacted me through the new system. I found help later through my course administrator.</p><p>These are original first-person statements from three selected fictional individual accounts, not representative survey findings. The records do not establish that these speakers are members of particular operational-review samples.</p><h3 class="util-md-heading util-md-heading--source-3">Using the dossier</h3><p>Choose at least two meaningful tensions from the available evidence. For each, identify the source particulars, explain the apparent conflict, consider a plausible explanation and identify what remains unresolved. Weigh the combined evidence in a qualified synthesis without making a final institutional recommendation.</p></article></li></ol></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>For each tension, explain the relevant evidence, why the findings may appear to conflict, a plausible explanation and what remains unresolved.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Write a balanced synthesis that weighs evidence consistent with possible benefit against limitations and concerns, without claiming a demonstrated SSI effect or making a final institutional recommendation.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Use the diagnostic review to check the coherence and evidential support of your synthesis.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A reasoned synthesis identifying at least two meaningful evidential tensions, using accurately attributed findings to explain their significance, considering plausible explanations without treating them as established, and reaching a qualified interpretation proportionate to the combined evidence.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m2-section-first-evidential-tension-1" data-response-part-id="A3-template-section-a3-m2-section-first-evidential-tension-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a3-a3-template-section-a3-m2-section-first-evidentia
