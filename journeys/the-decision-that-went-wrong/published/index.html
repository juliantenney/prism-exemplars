erion 4 of 4</p><p class="util-guided-review__statement">Have you respected the preliminary reporting point?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Treating an interim enrolment measure as final continuation would attribute an outcome to the evaluation that it has not reported.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response identifies the outcome as enrolment at a preliminary point.</li><li><span class="util-guided-review__feature-key">B.</span> The response does not equate preliminary enrolment with final continuation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the reporting status alongside the enrolment percentages.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Separate being enrolled on the reporting date from confirmed progression or continuation into the next academic year.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a2-a2-m5-item-3" data-checklist-item-id="checklist-a2-a2-m5-item-3"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a2-a2-m5-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article><details class="util-composition-reveal util-prose-measure" data-reveal-mode="details"><summary>Review the example response</summary><div class="util-composition-reveal__body"><article class="util-material-block util-sample-output util-prose-measure" data-material-id="A2-M4" data-material-type="sample_output" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></span><span class="util-semantic-icon__label">Review After Your Attempt: Interpreting NB-SSI-01</span></p><h3 class="util-md-heading util-md-heading--source-2">Release after completing your interpretation</h3><p>Compare your own response with the explanation below. It is feedback on the evidence, not a prescribed decision about SSI.</p><h3 class="util-md-heading util-md-heading--source-3">The comparison</h3><p>The engaged group consists of 240 flagged students who attended at least one support conversation. Of these, 216 were still enrolled at the preliminary reporting point, or 90%.</p><p>The non-engaged group consists of 260 flagged students who did not engage in a support conversation. Of these, 208 were still enrolled at that point, or 80%.</p><p>The observed difference is:</p><p>\[
90\%-80\%=10\text{ percentage points}
\]</p><p>The engaged group therefore had a preliminary enrolment rate 10 percentage points higher than the non-engaged flagged group.</p><h3 class="util-md-heading util-md-heading--source-3">What the finding does and does not establish</h3><p>This is an encouraging observed relationship between recorded support engagement and preliminary enrolment. It is consistent with the possibility that support conversations are helpful, but it does not establish that attending a conversation caused the difference.</p><p>Students were not necessarily comparable before engaging with support. Their circumstances, existing difficulties or willingness to seek help could have differed. The figures alone cannot separate these possible explanations from an effect of support.</p><p>The outcome is also limited to being enrolled at the preliminary reporting point. It must not be described as final continuation into the next academic year.</p><h3 class="util-md-heading util-md-heading--source-3">Common errors to correct</h3><ul><li>Using 400 as the denominator for the engaged group confuses students receiving contact with students attending support. The engaged comparison group contains 240 students.</li><li>Using 100 as the denominator for the non-engaged group confuses students without recorded contact with students without recorded engagement. The non-engaged comparison group contains 260 flagged students.</li><li>Calling the difference a 10% increase rather than 10 percentage points changes the meaning of the calculation.</li><li>Saying that SSI or support conversations proved a reduction in withdrawal converts an observed association into a causal claim.</li><li>Calling the outcome final continuation overlooks the preliminary reporting status.</li></ul><p>A learner may reasonably give this early evidence substantial weight or remain cautious about it. The quality of the judgement depends on accurate interpretation and recognition of uncertainty.</p></article></div></details></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c1--activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Make Your Provisional Judgement</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your interpretation of the preliminary figures provides the evidence for a decision under uncertainty. The challenge now is to decide how much weight to give the encouraging pattern while recognising what it cannot establish.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have examined the preliminary findings and their limitations. Now decide whether the available evidence makes SSI appear worth continuing. This is an initial judgement, not a final committee recommendation. Different positions are acceptable when supported by accurate reasoning. Allow approximately 3 minutes.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Weigh three considerations: what the early evidence suggests, what it cannot establish and whether the possible value of continuing warrants further investigation. A cautious positive position and a sceptical position can both be reasoned responses.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which case detail most influences your position, and what uncertainty prevents you from treating it as a settled conclusion?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A3"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><article class="util-material-block util-material-table-block" data-material-id="A3-M1" data-material-type="reference_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Evidence Reference for Your Provisional Judgement</span></p><h3 class="util-md-heading util-md-heading--source-2">Northbridge University: available evidence</h3><p>Institutional aim: identify first-year students who might benefit from timely academic support.</p><p>Source: NB-SSI-01, Initial Evaluation Summary, 12 March 2026.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Measure</th><th>Recorded value</th></tr></thead><tbody><tr><td>First-year students flagged by SSI</td><td>500</td></tr><tr><td>Flagged students receiving recorded personalised contact</td><td>400</td></tr><tr><td>Contacted students attending at least one support conversation</td><td>240</td></tr></tbody></table></div><h3 class="util-md-heading util-md-heading--source-3">Enrolment at the preliminary reporting point</h3><div class="util-table-scroll util-material-table"><table><thead><tr><th>Flagged-student group</th><th>Total in group</th><th>Still enrolled</th><th>Reported proportion</th></tr></thead><tbody><tr><td>Engaged in at least one support conversation</td><td>240</td><td>216</td><td>90%</td></tr><tr><td>Did not engage in a support conversation</td><td>260</td><td>208</td><td>80%</td></tr></tbody></table></div><p>The evaluation records enrolment at a preliminary point, not final continuation. The groups differ in recorded engagement; the figures do not establish why their enrolment proportions differ.</p><p>Use this reference to select the evidence relevant to your provisional judgement. No further evaluation findings are available at this stage of the experience.</p></article></div><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A3-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Weighing the Early Evidence</span></p><h3 class="util-md-heading util-md-heading--source-2">Deciding under uncertainty</h3><p>The university&#39;s immediate question is whether the early findings make SSI appear worth continuing while more evidence is collected. This is narrower than deciding whether SSI has been proven effective or should be adopted permanently.</p><p>The evaluation provides two kinds of relevant information. The identification, contact and engagement counts describe how far students progressed through the support process. These counts matter to the aim of timely support because a system that identifies students but does not lead to meaningful contact or engagement would offer a different practical prospect from one that does. However, the counts alone do not tell us whether students benefited.</p><p>The preliminary enrolment comparison addresses a possible outcome of interest. The recorded proportions can be weighed as a reason for interest in the pilot. Their evidential strength is limited, however, because students who engaged with support may have differed from those who did not. The comparison cannot isolate the effect of attending a conversation.</p><p>These considerations pull in different directions. An institution may regard a promising pattern as sufficient reason to continue gathering evidence, especially when the initiative is intended to offer help rather than impose academic consequences. Another judgement may place greater weight on uncertainty about whether the observed difference reflects the support itself. Neither approach should turn a provisional observation into a proven causal effect.</p><p>Your position should reflect how you weigh the evidence against the uncertainty. State whether you favour continuing, lean towards continuing, are undecided, lean against continuing or oppose continuing. Then explain which case details influence that position and why. Include a numerical finding, but use it to support an argument rather than allowing a single figure to stand in for the whole judgement.</p><p>Finally, identify an uncertainty that matters to your decision. A useful uncertainty is one whose resolution could reasonably change how you assess the pilot. The aim is a defensible initial judgement, not agreement with the evaluation summary&#39;s recommendation.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c1--learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="lj-c1--learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="lj-c1--learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c1--learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c1--learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="lj-c1--learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c1--learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Revisit the preliminary evaluation and choose an initial position: favour continuing, lean towards continuing, undecided, lean against continuing or oppose continuing.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A3-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Record Your Initial Position</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain your position in approximately 80–120 words using at least two specific case details, including one numerical finding.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify one important uncertainty that prevents a firmer conclusion.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Review whether your reasons support your chosen position without presenting association as proof of causation.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A clearly stated provisional position accompanied by a coherent 80–120-word justification that accurately uses at least two relevant case details, including one numerical finding. The learner identifies a meaningful unresolved uncertainty and reaches no stronger conclusion than the preliminary evidence warrants. No particular position is required.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-my-provisional-position-1" data-response-part-id="A3-template-section-a3-m3-section-my-provisional-position-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-my-provisional-position-1-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-my-provisional-position-1">My provisional position</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-my-provisional-position-1-desc">Record your response for My provisional position.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-my-provisional-position-1" name="learner-workspace-a3-a3-template-section-a3-m3-section-my-provisional-position-1" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-my-provisional-position-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-my-supporting-reasons-2" data-response-part-id="A3-template-section-a3-m3-section-my-supporting-reasons-2"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-my-supporting-reasons-2-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-my-supporting-reasons-2">My supporting reasons</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-my-supporting-reasons-2-desc">Record your response for My supporting reasons.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-my-supporting-reasons-2" name="learner-workspace-a3-a3-template-section-a3-m3-section-my-supporting-reasons-2" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-my-supporting-reasons-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-template-section-a3-m3-section-one-important-uncertainty-3" data-response-part-id="A3-template-section-a3-m3-section-one-important-uncertainty-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-one-important-uncertainty-3-label" for="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-one-important-uncertainty-3">One important uncertainty</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-one-important-uncertainty-3-desc">Record your response for One important uncertainty.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-one-important-uncertainty-3" name="learner-workspace-a3-a3-template-section-a3-m3-section-one-important-uncertainty-3" rows="6" aria-describedby="lj-c1--learner-workspace-a3-a3-template-section-a3-m3-section-one-important-uncertainty-3-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c1--learner-check-a3" data-check-sidebar-open aria-controls="lj-c1--learner-check-a3" aria-expanded="false" aria-label="Check your work: Make Your Provisional Judgement">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c1--learner-check-a3" data-composition-moment="check" data-activity-id="A3" data-check-sidebar="available" aria-labelledby="lj-c1--learner-check-a3-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c1--learner-check-a3-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c1--learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c1--learner-task-a3">Back to your task (Make Your Provisional Judgement)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m4-c-0" data-revision-criterion-id="a3-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you stated a recognisable provisional position?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without a clear position, the reader cannot determine what decision your supporting reasons are intended to justify.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response identifies one of the five available provisional positions.</li><li><span class="util-guided-review__feature-key">B.</span> The position is framed as an initial judgement rather than a settled institutional decision.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State whether you favour, lean towards, are undecided about, lean against or oppose continuing SSI.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Qualify any final-sounding statement so that it reflects the preliminary evidence currently available.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a3-a3-m4-item-0" data-checklist-item-id="checklist-a3-a3-m4-item-0"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a3-a3-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m4-c-1" data-revision-criterion-id="a3-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you used relevant and accurate case details?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A judgement based only on general beliefs about AI or student support does not demonstrate reasoning from this particular case.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The reasons use at least two specific details from the permitted case evidence.</li><li><span class="util-guided-review__feature-key">B.</span> At least one detail is a numerical finding reported with its correct meaning.</li><li><span class="util-guided-review__feature-key">C.</span> The details are not confused with evidence from a later or final evaluation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Select two relevant observations from the SSI process or NB-SSI-01 and explain how each bears on your position.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Include a reported count, proportion or calculated comparison and identify the student group or process stage to which it relates.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Restrict your reasons to the institutional background and the preliminary evaluation dated 12 March 2026.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a3-a3-m4-item-1" data-checklist-item-id="checklist-a3-a3-m4-item-1"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a3-a3-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m4-c-2" data-revision-criterion-id="a3-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you explained how the evidence supports your position?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Simply listing facts does not show why they should influence an institutional decision under uncertainty.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response connects at least one observed finding to the university&#39;s aim of timely academic support.</li><li><span class="util-guided-review__feature-key">B.</span> The response weighs a reason for interest in SSI against a reason for caution.</li><li><span class="util-guided-review__feature-key">C.</span> The reasoning is consistent with the selected provisional position.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Explain how the chosen observation matters to the prospect of identifying or helping students earlier.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify what gives the pilot possible value and what limits the strength of that consideration, then explain which you give more weight.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Check whether your stated balance of evidence and uncertainty actually supports the degree of support, opposition or indecision you selected.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a3-a3-m4-item-2" data-checklist-item-id="checklist-a3-a3-m4-item-2"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a3-a3-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m4-c-3" data-revision-criterion-id="a3-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you acknowledged an important uncertainty without making an unsupported causal claim?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A provisional judgement becomes overstated if it treats an observational comparison as proof or overlooks information that could change the decision.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The response identifies a specific unresolved issue relevant to continuation.</li><li><span class="util-guided-review__feature-key">B.</span> The enrolment comparison is not presented as proof that support caused the difference.</li><li><span class="util-guided-review__feature-key">C.</span> The uncertainty is connected to the provisional nature of the judgement.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name an uncertainty about the observed outcomes, the comparison groups or the practical value of support that could affect your judgement.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Distinguish the recorded association from an established effect of attending support conversations.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain why the missing information limits how firmly you can support your current position.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a3-a3-m4-item-3" data-checklist-item-id="checklist-a3-a3-m4-item-3"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a3-a3-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c1--activity-A4" data-journey-section="true" data-activity-id="A4" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Check Confidence and Communicate Cautiously</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A4"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">You have formed a provisional judgement and explained the evidence behind it. Confidence adds a different dimension: it expresses how securely that position is supported. Communicating the finding to another audience also tests whether you can preserve its meaning without overstating it.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Your provisional position is now available for reflection. Assess how confidently you hold it, then apply the same evidence-aware reasoning to a different communication task. Keep your initial judgement, reasons and confidence for reconsideration later in the Learning Journey. Allow approximately 2 minutes.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Confidence concerns the strength of the evidence, not how strongly you feel about your preferred position. When addressing students, keep the observed result and its limitation visible while avoiding unnecessary technical language.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">What makes your judgement more or less secure? How would you explain the preliminary result to someone who has not examined the evaluation?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A4"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><article class="util-material-block util-material-table-block" data-material-id="A4-M1" data-material-type="reference_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Preliminary Evidence for Confidence and Communication</span></p><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-01 — Initial Evaluation Summary</h3><p>Date: 12 March 2026.</p><p>Outcome measured: students still enrolled at the preliminary reporting point.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Flagged-student group</th><th>Students in group</th><th>Still enrolled</th><th>Reported proportion still enrolled</th></tr></thead><tbody><tr><td>Attended at least one support conversation</td><td>240</td><td>216</td><td>90%</td></tr><tr><td>Did not engage in a support conversation</td><td>260</td><td>208</td><td>80%</td></tr></tbody></table></div><p>These are preliminary enrolment observations for groups distinguished by recorded support engagement. They are not final continuation results.</p><p>Consult the original figures when explaining your confidence and preparing a message for new students.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c1--learner-task-a4" data-composition-moment="do" data-activity-id="A4" aria-labelledby="lj-c1--learner-task-a4-heading"><h3 class="util-composition-moment-heading" id="lj-c1--learner-task-a4-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c1--learner-revision-reminder-a4" hidden data-revision-reminder="true" data-activity-id="A4" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c1--learner-revision-guidance-a4" hidden data-revision-guidance="true" data-activity-id="A4" aria-labelledby="lj-c1--learner-revision-guidance-a4-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c1--learner-revision-guidance-a4-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Rate your confidence from 1 (very uncertain) to 5 (very confident) and explain briefly why that rating matches the strength of the available evidence.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Your Confidence and Student-Facing Message</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect a short draft headline intended for new students about the preliminary SSI findings. Write a replacement headline and one explanatory sentence that communicate the evidence accurately without claiming proven causation.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A4-M2" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Fictional Draft Headline for New Students</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-2">Simulated communication candidate</h3><p>The following is a fictional draft headline prepared solely for this learning exercise. It is not an authoritative Northbridge University finding or a statement made by a real university representative.</p><p>&gt; SSI support conversations keep more students enrolled, university pilot proves.</p><p>Intended audience: new undergraduate students.</p><p>Use the preliminary evaluation reference to examine the wording of this draft. Your task is to produce a replacement headline and one explanatory sentence that communicate the available finding without claiming more than the evidence establishes.</p></article></li></ol></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A five-point confidence rating with a concise evidence-related explanation that distinguishes confidence from support for or opposition to SSI. A replacement student-facing headline and explanatory sentence should accurately communicate the preliminary finding, avoid unwarranted causal claims and remain understandable without specialist terminology. The learner identifies what remains uncertain and retains a clear record of the initial judgement.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-my-confidence-rating-1" data-response-part-id="A4-template-section-a4-m3-section-my-confidence-rating-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-my-confidence-rating-1-label" for="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-my-confidence-rating-1">My confidence rating</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-my-confidence-rating-1-desc">Record your response for My confidence rating.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-my-confidence-rating-1" name="learner-workspace-a4-a4-template-section-a4-m3-section-my-confidence-rating-1" rows="6" aria-describedby="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-my-confidence-rating-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-why-i-chose-this-rating-2" data-response-part-id="A4-template-section-a4-m3-section-why-i-chose-this-rating-2"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-why-i-chose-this-rating-2-label" for="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-why-i-chose-this-rating-2">Why I chose this rating</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-why-i-chose-this-rating-2-desc">Record your response for Why I chose this rating.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-why-i-chose-this-rating-2" name="learner-workspace-a4-a4-template-section-a4-m3-section-why-i-chose-this-rating-2" rows="6" aria-describedby="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-why-i-chose-this-rating-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-my-replacement-headline-3" data-response-part-id="A4-template-section-a4-m3-section-my-replacement-headline-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-my-replacement-headline-3-label" for="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-my-replacement-headline-3">My replacement headline</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-my-replacement-headline-3-desc">Record your response for My replacement headline.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-my-replacement-headline-3" name="learner-workspace-a4-a4-template-section-a4-m3-section-my-replacement-headline-3" rows="6" aria-describedby="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-my-replacement-headline-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m3-section-my-explanatory-sentence-4" data-response-part-id="A4-template-section-a4-m3-section-my-explanatory-sentence-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-my-explanatory-sentence-4-label" for="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-my-explanatory-sentence-4">My explanatory sentence</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-my-explanatory-sentence-4-desc">Record your response for My explanatory sentence.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-my-explanatory-sentence-4" name="learner-workspace-a4-a4-template-section-a4-m3-section-my-explanatory-sentence-4" rows="6" aria-describedby="lj-c1--learner-workspace-a4-a4-template-section-a4-m3-section-my-explanatory-sentence-4-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c1--learner-check-a4" data-check-sidebar-open aria-controls="lj-c1--learner-check-a4" aria-expanded="false" aria-label="Check your work: Check Confidence and Communicate Cautiously">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c1--learner-check-a4" data-composition-moment="check" data-activity-id="A4" data-check-sidebar="available" aria-labelledby="lj-c1--learner-check-a4-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c1--learner-check-a4-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c1--learner-check-a4-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c1--learner-task-a4">Back to your task (Check Confidence and Communicate Cautiously)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Check your confidence explanation and revised communication against the diagnostic criteria. Retain your initial judgement, reasons and confidence for later reconsideration.</p></span></div><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A4-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a4-a4-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a4-m5-c-0" data-revision-criterion-id="a4-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you justified your confidence rating using the available evidence?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A number without an evidence-related explanation does not reveal how securely the provisional judgement is held.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> A rating from 1 to 5 is recorded.</li><li><span class="util-guided-review__feature-key">B.</span> The explanation identifies something in the preliminary findings that affects confidence.</li><li><span class="util-guided-review__feature-key">C.</span> The explanation acknowledges a limitation that affects the strength of the judgement.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Choose a value on the stated confidence scale and ensure it represents certainty rather than approval.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect your rating to a relevant feature of the reported comparison or the scope of the evaluation.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify how uncertainty about the comparison or reporting point constrains the firmness of your position.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a4-a4-m5-item-0" data-checklist-item-id="checklist-a4-a4-m5-item-0"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a4-a4-m5-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a4-m5-c-1" data-revision-criterion-id="a4-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you distinguished confidence from your preference about continuing SSI?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Strong support for a policy and strong confidence in the evidence are different judgements; conflating them conceals uncertainty.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The confidence explanation addresses the security of the evidence-based judgement.</li><li><span class="util-guided-review__feature-key">B.</span> The rating remains compatible with a favourable, sceptical or undecided position.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Explain how well the current findings support your position rather than repeating how much you like or dislike SSI.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Check that your reasoning could explain the certainty of your chosen position without assuming that one position must always receive a higher confidence score.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a4-a4-m5-item-1" data-checklist-item-id="checklist-a4-a4-m5-item-1"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a4-a4-m5-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a4-m5-c-2" data-revision-criterion-id="a4-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Does your student-facing message remain faithful to the preliminary figures?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A public-facing summary can mislead if it changes the comparison groups, the reported values or the status of the outcome.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The message accurately represents the relationship between the engaged and non-engaged flagged groups.</li><li><span class="util-guided-review__feature-key">B.</span> Any numerical detail agrees with NB-SSI-01.</li><li><span class="util-guided-review__feature-key">C.</span> The message does not present preliminary enrolment as final continuation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify which group had which reported preliminary enrolment outcome and avoid swapping the comparison.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Check each count or percentage against the reference and ensure it refers to the correct group.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Qualify the outcome as preliminary rather than implying confirmed progression into the following academic year.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a4-a4-m5-item-2" data-checklist-item-id="checklist-a4-a4-m5-item-2"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a4-a4-m5-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a4-m5-c-3" data-revision-criterion-id="a4-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you avoided unsupported causal claims while keeping the message accessible?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>New students need a clear account of the finding without being told that the evaluation proved an effect it did not establish.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The replacement headline does not claim that SSI or support conversations have been proved to cause the outcome.</li><li><span class="util-guided-review__feature-key">B.</span> The explanatory sentence makes the limitation of the evidence understandable.</li><li><span class="util-guided-review__feature-key">C.</span> The headline and sentence are understandable to students unfamiliar with evaluation terminology.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Replace language of proof or guaranteed effect with wording that reports the observed preliminary comparison.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Add a short qualification distinguishing an observed difference from proof that support produced it.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain the comparison in ordinary language and retain only technical terms needed for accuracy.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a4-a4-m5-item-3" data-checklist-item-id="checklist-a4-a4-m5-item-3"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a4-a4-m5-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A4"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M4" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Communicate the Evidence to New Students</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-transfer-prompt-a4-m4-910" data-response-part-id="A4-transfer-prompt-a4-m4-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a4-a4-transfer-prompt-a4-m4-910-label" for="lj-c1--learner-workspace-a4-a4-transfer-prompt-a4-m4-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="lj-c1--learner-workspace-a4-a4-transfer-prompt-a4-m4-910-desc"><p>You have already used the preliminary evaluation to form your own institutional judgement. Now apply the same care with evidence to a different purpose: writing for students who have not read the evaluation.</p><p>Read the fictional draft headline in the task card and consult the NB-SSI-01 reference.</p><p>Produce two pieces of text:</p><ol><li>A replacement headline suitable for new undergraduate students.</li><li>One explanatory sentence that conveys the observed preliminary relationship and makes its evidential limitation clear.</li></ol><p>Your wording should be accessible, accurate and proportionate to the findings. Do not introduce additional statistics or imply that the evaluation has established a causal effect. Enter both responses in the corresponding locations in your workspace.</p></div><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a4-a4-transfer-prompt-a4-m4-910" name="learner-workspace-a4-a4-transfer-prompt-a4-m4-910" rows="5" aria-describedby="lj-c1--learner-workspace-a4-a4-transfer-prompt-a4-m4-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><aside class="util-study-tips" data-region="study-tips" id="lj-c1--journey-study-tips" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--study-tips" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg></span><span class="util-semantic-icon__label">Study tips</span></h2><div class="util-study-tips__content util-prose-measure"><ul><li>Distinguish the SSI support process from its possible outcomes: a flag, a personalised contact and attendance at a support conversation are different events.</li><li>When comparing enrolment figures, check the groups and denominators, calculate differences in percentage points and distinguish observed association from proven causation.</li><li>Support a provisional institutional judgement with specific evidence while explaining what remains uncertain and how that affects confidence.</li><li>Retain your initial position, reasons and confidence so you can examine how your judgement develops in Reading the Evidence Carefully and When the Evidence Changes.</li></ul></div></aside><style id="lj-c1--prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;position:fixed;top:var(--learner-sticky-nav-height,0px);left:0;right:0;z-index:40;margin:0 auto;max-width:42rem;width:calc(100% - 1.5rem);padding:.45rem .75rem;border:1px solid #cbd5e1;border-left:3px solid #64748b;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.12)}.util-learner-renderer-vnext .util-revision-reminder__chrome{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.35rem .75rem;margin:0 0 .2rem}.util-learner-renderer-vnext .util-revision-reminder__label{margin:0;font-size:.75rem;font-weight:650;color:#64748b}.util-learner-renderer-vnext .util-revision-reminder__statement{margin:0;font-size:.9rem;line-height:1.4;font-weight:600;color:#0f172a}.util-learner-renderer-vnext .util-revision-reminder__view{font:inherit;font-size:.9rem;color:#1d4ed8;background:transpare
