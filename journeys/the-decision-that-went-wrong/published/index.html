-r3-c4" data-learner-cell="a1-a1-m3-input-r3-c4" rows="3" aria-labelledby="lj-c3--a1-a1-m3-row-3 lj-c3--a1-a1-m3-col-supported-interpretation-4" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c3--a1-a1-m3-input-r3-c5" name="a1-a1-m3-input-r3-c5" data-learner-cell="a1-a1-m3-input-r3-c5" rows="3" aria-labelledby="lj-c3--a1-a1-m3-row-3 lj-c3--a1-a1-m3-col-what-cannot-be-concluded-5" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><article class="util-prompt-set util-prose-measure" data-material-id="A1-M4" data-material-type="prompt_set" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-prompt-set-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"></path></svg></span><span class="util-semantic-icon__label">Interpret the Changing Evidence</span></p><p>Write one concise paragraph answering the following question:</p><p>How should the final continuation findings affect an interpretation based on the earlier preliminary results?</p><p>Your paragraph should identify at least one observation that supports the earlier positive interpretation and one question raised by the final evidence. Explain which groups or reporting points matter to your comparison. State explicitly why an observed association or cohort difference is not, by itself, evidence that SSI caused an outcome.</p><p>Your interpretation:</p><p>[Write your paragraph here.]</p><p>Use the evidence to justify your reasoning. You do not need to decide whether SSI should continue.</p></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A completed evidence comparison that accurately identifies relevant figures, denominators, populations and reporting points, followed by a concise interpretation of what the comparisons establish and what remains uncertain. The explanation must distinguish preliminary enrolment from final continuation, avoid treating non-equivalent groups as controls, and refrain from attributing observed differences to SSI without sufficient evidence.</p></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-task-step-step-3-3" data-response-part-id="A1-task-step-step-3-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c3--learner-workspace-a1-a1-task-step-step-3-3-label" for="lj-c3--learner-workspace-a1-a1-task-step-step-3-3">Your response</label><p class="util-learner-workspace__prompt" id="lj-c3--learner-workspace-a1-a1-task-step-step-3-3-desc">Explain which observations support the earlier positive interpretation and which introduce additional questions. Distinguish the reported associations from claims about SSI&#39;s causal effect.</p><textarea class="util-learner-workspace__input" id="lj-c3--learner-workspace-a1-a1-task-step-step-3-3" name="learner-workspace-a1-a1-task-step-step-3-3" rows="6" aria-describedby="lj-c3--learner-workspace-a1-a1-task-step-step-3-3-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c3--learner-check-a1" data-check-sidebar-open aria-controls="lj-c3--learner-check-a1" aria-expanded="false" aria-label="Check your work: Compare the Continuation Findings">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c3--learner-check-a1" data-composition-moment="check" data-activity-id="A1" data-check-sidebar="available" aria-labelledby="lj-c3--learner-check-a1-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c3--learner-check-a1-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c3--learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c3--learner-task-a1">Back to your task (Compare the Continuation Findings)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m5-c-0" data-revision-criterion-id="a1-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you recorded the relevant counts, denominators and rates accurately?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An inaccurate denominator changes the meaning of a percentage and can make a comparison appear more persuasive than the underlying data warrant.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each engagement comparison identifies the correct number of students in its groups.</li><li><span class="util-guided-review__feature-key">B.</span> The overall and historical continuation figures retain their respective cohort sizes.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Check the engaged and non-engaged group sizes separately against the source tables, then revise any result using the wrong denominator.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Re-enter the current and historical counts and denominators from the final continuation record before interpreting their difference.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c3--checklist-a1-a1-m5-item-0" data-checklist-item-id="checklist-a1-a1-m5-item-0"><label class="util-interactive-checklist__label" for="lj-c3--checklist-a1-a1-m5-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c3--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m5-c-1" data-revision-criterion-id="a1-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you distinguished the reporting points and outcome definitions?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Treating March enrolment and May continuation as the same measurement would conceal an important difference in what was observed.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The March results are labelled as preliminary enrolment.</li><li><span class="util-guided-review__feature-key">B.</span> The June record is connected to the 31 May continuation cut-off.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the March reporting point and use the preliminary enrolment label rather than final continuation.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Add the evaluation cut-off and distinguish it from the date on which the final record was issued.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c3--checklist-a1-a1-m5-item-1" data-checklist-item-id="checklist-a1-a1-m5-item-1"><label class="util-interactive-checklist__label" for="lj-c3--checklist-a1-a1-m5-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c3--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m5-c-2" data-revision-criterion-id="a1-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you considered whether the populations and cohorts are comparable?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Differences between groups may reflect their characteristics or circumstances rather than the effect of SSI.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The engaged and non-engaged comparison is identified as a comparison within the flagged population.</li><li><span class="util-guided-review__feature-key">B.</span> The flagged and unflagged groups are not treated as equivalent.</li><li><span class="util-guided-review__feature-key">C.</span> The historical cohort is identified as a different academic-year cohort.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the shared flagged population and distinguish engagement status from random assignment.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Qualify any interpretation that assumes the two groups had the same starting circumstances or support needs.</li><li><span class="util-guided-review__feature-key">Missing C:</span> State that the historical comparison is observational and does not provide a randomised control.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c3--checklist-a1-a1-m5-item-2" data-checklist-item-id="checklist-a1-a1-m5-item-2"><label class="util-interactive-checklist__label" for="lj-c3--checklist-a1-a1-m5-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c3--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m5-c-3" data-revision-criterion-id="a1-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you kept your causal claims proportionate to the evidence?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The records can establish observed differences without establishing the mechanism or intervention responsible for them.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your interpretation separates measured differences from explanations for those differences.</li><li><span class="util-guided-review__feature-key">B.</span> Your paragraph identifies a remaining question about causal attribution.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Rewrite any sentence that moves directly from a percentage difference to a claim that SSI produced it.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name the additional comparison or information that would be needed before attributing the outcome to SSI.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c3--checklist-a1-a1-m5-item-3" data-checklist-item-id="checklist-a1-a1-m5-item-3"><label class="util-interactive-checklist__label" for="lj-c3--checklist-a1-a1-m5-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c3--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c3--activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Test the Strength of Evidence</h2><div class="util-badge-row"><span class="util-badge util-badge-time">7 min</span></div></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your comparison established the observed differences and their boundaries. The next demand is to test how confidently those observations can support explanations about SSI, taking account of methodological limitations, operational practice, equity questions and individual experiences.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Continuation figures describe important outcomes, but their interpretation depends on how the evaluation was conducted, how the support process operated and what other evidence reveals. Examine the newly available evaluation, operational and stakeholder records before weighing the strength of possible conclusions.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Distinguish the fact reported by each source from the explanation it might support. Consider whether the evidence is representative, whether groups are comparable and whether a finding measures an outcome, a process or an individual experience.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which limitation most changes the strength of an inference you were previously prepared to make, and why?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A2"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Examine the evaluation limitations note, operational and equity review, and selected stakeholder accounts.</p></span></div></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c3--learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="lj-c3--learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="lj-c3--learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c3--learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c3--learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="lj-c3--learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c3--learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Complete an evidence appraisal identifying at least four distinct findings or limitations, including a methodological limitation, an operational finding, an equity-related observation and a qualitative account. For each, explain its significance and the inference it cannot support.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A2-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Evaluation Limitations Note</span></p><p>Source: Northbridge University, NB-SSI-03, 8 June 2026. Dr Priya Shah, Institutional Evaluation Lead.</p><p>The note identifies the following limitations:</p><ul><li>Students engaging with support may differ in motivation, circumstances or existing support networks from those not engaging.</li><li>The previous cohort is not an equivalent control group.</li><li>An expanded first-year academic adviser scheme was also introduced in September 2025.</li><li>Some attendance records were incomplete.</li><li>Continuation does not fully represent wellbeing, confidence or educational experience.</li><li>The evaluation cannot establish whether SSI performs better than an equally resourced non-AI approach.</li></ul><p>These are the limitations recorded in the fictional evaluation. Use them to examine which interpretations require qualification. Do not assume that any single alternative explanation has been established.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify at least two plausible alternative explanations or unanswered questions relevant to interpreting SSI&#39;s outcomes.</p></span></div><article class="util-material-block util-material-table-block" data-material-id="A2-M2" data-material-type="data_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Operational and Equity Review</span></p><p>Source: Northbridge University, NB-SSI-04, 10 June 2026.</p><h3 class="util-md-heading util-md-heading--source-3">SSI flags by disability-registration status</h3><div class="util-table-scroll util-material-table"><table><thead><tr><th>Registration status</th><th>Students flagged</th><th>Total students in category</th><th>Flag rate</th></tr></thead><tbody><tr><td>Registered with a disability</td><td>105</td><td>300</td><td>35.0%</td></tr><tr><td>Not registered with a disability</td><td>395</td><td>1,700</td><td>23.2%</td></tr><tr><td>Total</td><td>500</td><td>2,000</td><td>25.0%</td></tr></tbody></table></div><p>The two registration-status categories are exhaustive and mutually exclusive for this table. Status was recorded at the evaluation cut-off.</p><h3 class="util-md-heading util-md-heading--source-3">Operational findings</h3><div class="util-table-scroll util-material-table"><table><thead><tr><th>Recorded observation</th><th>Count or amount</th><th>Relevant population or condition</th></tr></thead><tbody><tr><td>Flagged students without recorded personalised support contact</td><td>100</td><td>500 flagged students</td></tr><tr><td>Flagged cases where incomplete attendance information may have contributed to the flag</td><td>40</td><td>Flagged cases identified by staff</td></tr><tr><td>Students not flagged among those seeking conventional support</td><td>30</td><td>Selected review of 100 conventional support seekers</td></tr><tr><td>Additional staff time spent reviewing flags</td><td>Approximately 25 hours per week</td><td>Across the academic support service during the busiest period</td></tr></tbody></table></div><h3 class="util-md-heading util-md-heading--source-3">Source cautions</h3><p>The flag-rate difference alone does not establish discriminatory treatment or unequal prediction accuracy. Information about underlying support needs, flag accuracy and outcomes is insufficient to determine its cause.</p><p>The conventional-support review involved a selected group rather than a representative sample of all unflagged students. The review cannot establish overall false-positive or false-negative rates.</p><p>Use the population and selection conditions attached to each finding when evaluating what it can support.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Write a short evaluation of which evidence most strengthens or qualifies the case for possible benefit, explaining why.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A2-M3" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Selected Stakeholder Accounts</span></p><h3 class="util-md-heading util-md-heading--source-2">Stakeholder Evidence Digest: Selected Accounts</h3><p>Source: Northbridge University, NB-SSI-05, 11 June 2026.</p><p>All statements below are fictional individual accounts, not representative survey findings.</p><h3 class="util-md-heading util-md-heading--source-3">Samira Khan — first-year student</h3><p>&gt; I was falling behind and didn&#39;t know who to ask. The message from my tutor made it easier to start a conversation. I probably wouldn&#39;t have contacted anyone myself.</p><h3 class="util-md-heading util-md-heading--source-3">Daniel Reed — first-year student</h3><p>&gt; I was told my engagement suggested I might be struggling, but I was working offline and keeping up. I felt as though the university had already made up its mind about me.</p><h3 class="util-md-heading util-md-heading--source-3">Bethan Hughes — first-year student</h3><p>&gt; I missed deadlines because things were difficult at home. Nobody contacted me through the new system. I found help later through my course administrator.</p><h3 class="util-md-heading util-md-heading--source-3">Tom Ellis — Head of Academic Support</h3><p>&gt; Some students have benefited from earlier contact, but the flags aren&#39;t always straightforward. Staff need time to check the context, and that has an impact on other support work.</p><p>Consider what each account contributes to understanding the initiative. An individual account may illuminate an experience without establishing how frequently it occurs.</p></article><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a2-a2-m4" data-material-source-id="A2-M4" data-activity-id="A2"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A2-M4" data-material-type="analysis_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-he d><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c3--a2-a2-m4-input-r5-c3" name="a2-a2-m4-input-r5-c3" data-learner-cell="a2-a2-m4-input-r5-c3" rows="3" aria-labelledby="lj-c3--a2-a2-m4-row-5 lj-c3--a2-a2-m4-col-limitation-or-alternative-explanation-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c3--a2-a2-m4-input-r5-c4" name="a2-a2-m4-input-r5-c4" data-learner-cell="a2-a2-m4-input-r5-c4" rows="3" aria-labelledby="lj-c3--a2-a2-m4-row-5 lj-c3--a2-a2-m4-col-what-cannot-be-concluded-4" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><article class="util-prompt-set util-prose-measure" data-material-id="A2-M5" data-material-type="prompt_set" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-prompt-set-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"></path></svg></span><span class="util-semantic-icon__label">Evaluate the Strength of the Evidence</span></p><p>How strongly does the available evidence support an interpretation of possible SSI benefit?</p><p>Write one concise evaluative paragraph. Compare at least two sources and explain why one finding deserves more or less weight for the particular claim you are assessing.</p><p>The continuation records measure student outcomes, while the evaluation note identifies limitations affecting causal attribution. The operational review records whether flags were followed by contact, the quality of some input data and additional staff time. The stakeholder accounts provide individual experiences of support, misinterpretation or missed identification. These sources address related but different questions.</p><p>In your evaluation, weigh the relevance of each source to the claim, the comparability and representativeness of its evidence, measurement quality, causal uncertainty, and operational or experiential significance. Address the tension between encouraging observed outcomes and unresolved explanations; between potentially useful outreach and the demands of delivering it; and between informative testimony and its limited representativeness.</p><p>Your evaluation:</p><p>[Write your paragraph here.]</p><p>Conclude with a provisional judgement about the strength of the evidence, not a decision about the institution&#39;s future policy. Different judgements are defensible when their reasoning is supported and their uncertainty is appropriately qualified.</p></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>An evidence appraisal using accurate source-specific particulars from quantitative and qualitative records, with explicit attention to methodological strength, operational delivery, equity interpretation and the limits of individual testimony. A successful evaluation identifies plausible alternative explanations without asserting them as established causes, distinguishes flag-rate differences from proof of discrimination, and weighs the significance of evidence rather than simply listing concerns.</p></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-task-step-step-4-4" data-response-part-id="A2-task-step-step-4-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c3--learner-workspace-a2-a2-task-step-step-4-4-label" for="lj-c3--learner-workspace-a2-a2-task-step-step-4-4">Your response</label><p class="util-learner-workspace__prompt" id="lj-c3--learner-workspace-a2-a2-task-step-step-4-4-desc">Write a short evaluation of which evidence most strengthens or qualifies the case for possible benefit, explaining why.</p><textarea class="util-learner-workspace__input" id="lj-c3--learner-workspace-a2-a2-task-step-step-4-4" name="learner-workspace-a2-a2-task-step-step-4-4" rows="6" aria-describedby="lj-c3--learner-workspace-a2-a2-task-step-step-4-4-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c3--learner-check-a2" data-check-sidebar-open aria-controls="lj-c3--learner-check-a2" aria-expanded="false" aria-label="Check your work: Test the Strength of Evidence">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c3--learner-check-a2" data-composition-moment="check" data-activity-id="A2" data-check-sidebar="available" aria-labelledby="lj-c3--learner-check-a2-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c3--learner-check-a2-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c3--learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c3--learner-task-a2">Back to your task (Test the Strength of Evidence)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M6" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m6" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m6-c-0" data-revision-criterion-id="a2-m6-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you used accurate, attributable details from the records?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An appraisal cannot justify its conclusions if the evidence is detached from its source, population or stated conditions.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Quantitative observations include the relevant count or rate and its denominator.</li><li><span class="util-guided-review__feature-key">B.</span> Methodological limitations are attributed to the evaluation note.</li><li><span class="util-guided-review__feature-key">C.</span> Individual accounts are correctly attributed to their speakers.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Return to the operational or continuation table and add the population against which the reported count was measured.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify which documented limitation you are using and connect it to the particular inference under consideration.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Check the named speaker and replace any generalised or misattributed description with the specific account.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c3--checklist-a2-a2-m6-item-0" data-checklist-item-id="checklist-a2-a2-m6-item-0"><label class="util-interactive-checklist__label" for="lj-c3--checklist-a2-a2-m6-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c3--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m6-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m6-c-1" data-revision-criterion-id="a2-m6-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you distinguished recorded observations from possible explanations?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Treating a plausible explanation as a demonstrated cause would overstate what the evaluation can establish.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your appraisal identifies what the record actually measured or reported.</li><li><span class="util-guided-review__feature-key">B.</span> Alternative explanations are expressed as possibilities rather than established causes.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Separate the source observation from your subsequent interpretation of its possible significance.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Qualify any assertion about motivation, the adviser scheme or incomplete data that goes beyond the source&#39;s evidence.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c3--checklist-a2-a2-m6-item-1" data-checklist-item-id="checklist-a2-a2-m6-item-1"><label class="util-interactive-checklist__label" for="lj-c3--checklist-a2-a2-m6-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c3--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m6-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m6-c-2" data-revision-criterion-id="a2-m6-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you recognised the limits of comparison, sampling and measurement?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A source may be relevant to an issue without supporting conclusions about causation, prevalence or prediction accuracy.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your evaluation accounts for the non-equivalence of engagement groups or historical cohorts.</li><li><span class="util-guided-review__feature-key">B.</span> The selected conventional-support review is not treated as a population-wide error estimate.</li><li><span class="util-guided-review__feature-key">C.</span> The stakeholder accounts are not treated as representative prevalence data.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the comparison that lacks an equivalent control and explain which causal claim therefore remains unresolved.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name the selection condition and remove any unsupported overall false-negative rate.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Retain the reported experience while removing claims about how commonly it occurs.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c3--checklist-a2-a2-m6-item-2" data-checklist-item-id="checklist-a2-a2-m6-item-2"><label class="util-interactive-checklist__label" for="lj-c3--checklist-a2-a2-m6-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c3--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m6-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m6-c-3" data-revision-criterion-id="a2-m6-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you justified the relative weight of quantitative and qualitative evidence?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A list of favourable and unfavourable observations does not explain how strongly the combined evidence supports the claim.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> At least two sources are compared for their relevance to the same evaluative question.</li><li><span class="util-guided-review__feature-key">B.</span> Your conclusion addresses both possible benefit and an important qualification.</li><li><span class="util-guided-review__feature-key">C.</span> Your judgement reflects the evidential weight rather than the number of concerns listed.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Explain what each source contributes to that question and why the contributions differ.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect the evidence favouring a possible benefit with the limitation that most constrains the strength of that inference.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify which observation or limitation is most consequential and justify its importance to the claim.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c3--checklist-a2-a2-m6-item-3" data-checklist-item-id="checklist-a2-a2-m6-item-3"><label class="util-interactive-checklist__label" for="lj-c3--checklist-a2-a2-m6-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c3--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m6-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c3--activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Reconcile the Emerging Tensions</h2><div class="util-badge-row"><span class="util-badge util-badge-time">4 min</span></div></header><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--activity-after-header" data-visual-slot="activity-after-header" data-learner-content-kind="image" data-figure-number="3" data-figure-id="asset-vb-38-4-va-a3-reconciliation-01-activity-a3-activity-after-header"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c3/activity-a3-activity-after-header.png" alt="Contrast between measurement-related differences and unresolved substantive tensions; detailed description follows." aria-describedby="lj-c3--figure-description-asset-vb-38-4-va-a3-reconciliation-01-activity-a3-activity-after-header" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 3.</strong> Two different reasons why findings may appear to conflict.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c3--figure-description-asset-vb-38-4-va-a3-reconciliation-01-activity-a3-activity-after-header">The first category concerns findings that may appear inconsistent because they use different populations, reporting points or outcome definitions. Its diagnostic question is whether the observations are genuinely comparable; checking these conditions may clarify the apparent difference. The second category concerns tensions that remain after such distinctions are recognised. Its diagnostic question asks which competing explanations still fit the observations and what further evidence is needed. Both categories distinguish plausible explanations from verified causes. No Northbridge pairing is classified.</p></figure><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The evidence appraisal identified what individual sources can support. Synthesis now requires you to connect those sources, distinguish apparent contradictions from substantive tensions, and explain how competing interpretations are strengthened or weakened by the combined record.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>You have examined both the measured outcomes and the limitations of the evidence. Now consider how findings that seem to point in different directions can be interpreted together without forcing them into a single simple conclusion.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">For each tension, identify the findings involved, check whether they concern the same population or outcome, and consider whether they can coexist. Where uncertainty remains, describe it rather than inventing a resolution.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which tension initially appeared most contradictory, and what changed when you examined the measures, populations and limitations together?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A3"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Examine the paired evidence references and candidate interpretations provided.</p></span></div></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c3--learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="lj-c3--learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="lj-c3--learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c3--learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c3--learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="lj-c3--learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c3--learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" ar
