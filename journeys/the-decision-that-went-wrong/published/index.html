ce__input" id="a1-a1-m2-input-r0-c2" name="a1-a1-m2-input-r0-c2" data-learner-cell="a1-a1-m2-input-r0-c2" rows="3" aria-label="Response field, row 1, column Potential benefit or harm" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r0-c3" name="a1-a1-m2-input-r0-c3" data-learner-cell="a1-a1-m2-input-r0-c3" rows="3" aria-label="Response field, row 1, column Priority or responsibility" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r0-c4" name="a1-a1-m2-input-r0-c4" data-learner-cell="a1-a1-m2-input-r0-c4" rows="3" aria-label="Response field, row 1, column Evidence or priority distinction" autocomplete="off"></textarea></div></td></tr><tr><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r1-c0" name="a1-a1-m2-input-r1-c0" data-learner-cell="a1-a1-m2-input-r1-c0" rows="3" aria-label="Response field, row 2, column Stakeholder" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r1-c1" name="a1-a1-m2-input-r1-c1" data-learner-cell="a1-a1-m2-input-r1-c1" rows="3" aria-label="Response field, row 2, column Account detail" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r1-c2" name="a1-a1-m2-input-r1-c2" data-learner-cell="a1-a1-m2-input-r1-c2" rows="3" aria-label="Response field, row 2, column Potential benefit or harm" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r1-c3" name="a1-a1-m2-input-r1-c3" data-learner-cell="a1-a1-m2-input-r1-c3" rows="3" aria-label="Response field, row 2, column Priority or responsibility" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r1-c4" name="a1-a1-m2-input-r1-c4" data-learner-cell="a1-a1-m2-input-r1-c4" rows="3" aria-label="Response field, row 2, column Evidence or priority distinction" autocomplete="off"></textarea></div></td></tr><tr><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r2-c0" name="a1-a1-m2-input-r2-c0" data-learner-cell="a1-a1-m2-input-r2-c0" rows="3" aria-label="Response field, row 3, column Stakeholder" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r2-c1" name="a1-a1-m2-input-r2-c1" data-learner-cell="a1-a1-m2-input-r2-c1" rows="3" aria-label="Response field, row 3, column Account detail" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r2-c2" name="a1-a1-m2-input-r2-c2" data-learner-cell="a1-a1-m2-input-r2-c2" rows="3" aria-label="Response field, row 3, column Potential benefit or harm" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r2-c3" name="a1-a1-m2-input-r2-c3" data-learner-cell="a1-a1-m2-input-r2-c3" rows="3" aria-label="Response field, row 3, column Priority or responsibility" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a1-a1-m2-input-r2-c4" name="a1-a1-m2-input-r2-c4" data-learner-cell="a1-a1-m2-input-r2-c4" rows="3" aria-label="Response field, row 3, column Evidence or priority distinction" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Write a brief synthesis identifying a potential benefit, a potential harm and an institutional responsibility that should remain visible when SSI&#39;s future is considered.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A1-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Stakeholder Synthesis</p></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>An evidence-linked comparison of at least three contrasting stakeholders, with accurate distinctions between reported experiences, possible consequences and underlying priorities. The synthesis explains both an evidential disagreement and a difference in priorities, identifies benefits and harms without generalising from individual accounts, and connects the analysis to an institutional responsibility.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-evidential-disagreement-1" data-response-part-id="A1-template-section-a1-m3-section-evidential-disagreement-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m3-section-evidential-disagreement-1-label" for="learner-workspace-a1-a1-template-section-a1-m3-section-evidential-disagreement-1">Evidential disagreement</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-template-section-a1-m3-section-evidential-disagreement-1-desc">Identify two perspectives that differ in what they believe the available evidence can justify. Explain the specific uncertainty or evidential limitation involved.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m3-section-evidential-disagreement-1" name="learner-workspace-a1-a1-template-section-a1-m3-section-evidential-disagreement-1" rows="6" aria-describedby="learner-workspace-a1-a1-template-section-a1-m3-section-evidential-disagreement-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-difference-in-priorities-2" data-response-part-id="A1-template-section-a1-m3-section-difference-in-priorities-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m3-section-difference-in-priorities-2-label" for="learner-workspace-a1-a1-template-section-a1-m3-section-difference-in-priorities-2">Difference in priorities</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-template-section-a1-m3-section-difference-in-priorities-2-desc">Identify two perspectives that emphasise different outcomes, values or responsibilities. Explain the difference without assuming either perspective is unreasonable.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m3-section-difference-in-priorities-2" name="learner-workspace-a1-a1-template-section-a1-m3-section-difference-in-priorities-2" rows="6" aria-describedby="learner-workspace-a1-a1-template-section-a1-m3-section-difference-in-priorities-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-benefit-and-harm-3" data-response-part-id="A1-template-section-a1-m3-section-benefit-and-harm-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m3-section-benefit-and-harm-3-label" for="learner-workspace-a1-a1-template-section-a1-m3-section-benefit-and-harm-3">Benefit and harm</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-template-section-a1-m3-section-benefit-and-harm-3-desc">Identify one potential educational benefit and one potential harm or lost opportunity. Explain whose experience or interests each concerns.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m3-section-benefit-and-harm-3" name="learner-workspace-a1-a1-template-section-a1-m3-section-benefit-and-harm-3" rows="6" aria-describedby="learner-workspace-a1-a1-template-section-a1-m3-section-benefit-and-harm-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-institutional-responsibility-4" data-response-part-id="A1-template-section-a1-m3-section-institutional-responsibility-4"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a1-a1-template-section-a1-m3-section-institutional-responsibility-4-label" for="learner-workspace-a1-a1-template-section-a1-m3-section-institutional-responsibility-4">Institutional responsibility</label><p class="util-learner-workspace__prompt" id="learner-workspace-a1-a1-template-section-a1-m3-section-institutional-responsibility-4-desc">Identify a responsibility the Student Success Committee should consider when weighing these perspectives. Explain why it matters even though the evidence remains incomplete.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a1-a1-template-section-a1-m3-section-institutional-responsibility-4" name="learner-workspace-a1-a1-template-section-a1-m3-section-institutional-responsibility-4" rows="6" aria-describedby="learner-workspace-a1-a1-template-section-a1-m3-section-institutional-responsibility-4-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#learner-check-a1" data-check-sidebar-open aria-controls="learner-check-a1" aria-expanded="false" aria-label="Check your work: Whose Consequences Count?">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a1" data-composition-moment="check" data-activity-id="A1" data-check-sidebar="available" aria-labelledby="learner-check-a1-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="learner-check-a1-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a1">Back to your task (Whose Consequences Count?)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m4-c-0" data-revision-criterion-id="a1-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you used the stakeholders&#39; actual statements accurately and connected specific account details to your interpretations?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without a traceable connection to testimony, the comparison risks assigning experiences or beliefs to people that they did not report.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> At least two student accounts and one professional or institutional account are identified by name.</li><li><span class="util-guided-review__feature-key">B.</span> Each interpretation is linked to a recognisable detail from the corresponding statement.</li><li><span class="util-guided-review__feature-key">C.</span> The account is not altered to claim an experience or outcome the speaker did not describe.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Check the stakeholder roles in the digest and replace or add rows so the comparison includes contrasting student experiences and an institutional or professional perspective.</li><li><span class="util-guided-review__feature-key">Missing B:</span> For any unsupported inference, identify the precise event, concern or qualification the stakeholder reported, then explain how that detail relates to your interpretation.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Separate the speaker&#39;s reported words from the possible consequence you infer, and qualify consequences that have not been observed directly.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-0" data-checklist-item-id="checklist-a1-a1-m4-item-0"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m4-c-1" data-revision-criterion-id="a1-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you considered contrasting potential benefits, harms and institutional responsibilities rather than merely listing opinions?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Institutional decisions concern consequences for different people, not simply the number of stakeholders expressing favourable or unfavourable views.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The comparison identifies a possible benefit and a possible harm or lost opportunity.</li><li><span class="util-guided-review__feature-key">B.</span> At least one staff or institutional responsibility is connected to a student consequence.</li><li><span class="util-guided-review__feature-key">C.</span> The synthesis acknowledges consequences for more than one stakeholder group.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify who could experience each consequence and connect it to a distinct account, rather than treating all stakeholder concerns as interchangeable.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain how an operational, evaluative or governance responsibility could affect the experience of students receiving, declining or missing support.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Add a consequence for a group currently absent from your synthesis and explain why the committee should take it into account.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-1" data-checklist-item-id="checklist-a1-a1-m4-item-1"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m4-c-2" data-revision-criterion-id="a1-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you distinguished disagreements about evidence from differences in priorities?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A dispute about what SSI has achieved calls for different reasoning from a disagreement about which benefits, harms or responsibilities should carry most weight.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> An evidential disagreement identifies a claim whose support or interpretation is contested.</li><li><span class="util-guided-review__feature-key">B.</span> A priority difference identifies the distinct values, outcomes or responsibilities being emphasised.</li><li><span class="util-guided-review__feature-key">C.</span> The synthesis recognises when a perspective involves both evidence and values.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Name the disputed evidential claim and explain what further interpretation or uncertainty separates the perspectives.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Describe what each stakeholder is trying to protect or achieve, without reducing the difference to whether they like SSI.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Where a concern combines uncertainty with a preferred outcome, distinguish the factual question from the priority that gives it importance.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-2" data-checklist-item-id="checklist-a1-a1-m4-item-2"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m4-c-3" data-revision-criterion-id="a1-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you avoided generalising from individual testimony to all students or staff?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The fictional accounts illuminate possible experiences but cannot establish how frequently those experiences occur across the university.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Individual statements are described as accounts rather than representative findings.</li><li><span class="util-guided-review__feature-key">B.</span> Potential consequences are distinguished from measured prevalence or established institutional effects.</li><li><span class="util-guided-review__feature-key">C.</span> The synthesis preserves meaningful uncertainty rather than treating testimony as proof of a preferred option.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Replace population-wide assertions with wording that attributes the experience to the named individual.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify any claim about how common a benefit or harm is and qualify it unless a relevant population-level measure is supplied.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify what the testimony can illuminate and what it cannot settle about SSI&#39;s overall performance or future.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a1-a1-m4-item-3" data-checklist-item-id="checklist-a1-a1-m4-item-3"><label class="util-interactive-checklist__label" for="checklist-a1-a1-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">What Can the Evidence Support?</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your stakeholder comparison identified possible benefits, harms and responsibilities. The next reasoning demand is to judge which concerns are grounded in documented observations, which remain plausible but unresolved, and what those limits mean for institutional action.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>The stakeholder accounts reveal consequences that continuation statistics alone cannot capture. Now test how far the institutional evidence supports claims about those consequences, especially fairness, reliability, trust and the capacity to act on flags.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Apply the distinction between observation, interpretation and unsupported conclusion. Use the reported operational and equity findings to evaluate implications without converting uncertainty into proof of either safety or harm.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">How would your judgement change if you treated a disparity or an individual experience as proof rather than as evidence requiring interpretation?</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the final continuation, evaluation limitations, and operational and equity evidence.</p></span></div><article class="util-material-block util-material-table-block" data-material-id="A2-M1" data-material-type="data_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Continuation Outcomes and Disability-Registration Flag Rates</span></p><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-02 — Final Continuation Data</h3><p><strong>Source date:</strong> 5 June 2026. <strong>Evaluation cut-off:</strong> 31 May 2026.</p><p><strong>Continuation definition:</strong> Remaining enrolled or formally progressed to the next academic year at the evaluation cut-off.</p><p><strong>Support engagement definition:</strong> Attendance at least once at a support conversation following an SSI-related contact.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Student group</th><th>Students</th><th>Continued</th><th>Continuation rate</th></tr></thead><tbody><tr><td>Flagged and engaged</td><td>240</td><td>211</td><td>87.9%</td></tr><tr><td>Flagged and did not engage</td><td>260</td><td>205</td><td>78.8%</td></tr><tr><td>All flagged</td><td>500</td><td>416</td><td>83.2%</td></tr><tr><td>Not flagged</td><td>1,500</td><td>1,365</td><td>91.0%</td></tr><tr><td>All first-year students, 2025/26</td><td>2,000</td><td>1,781</td><td>89.1%</td></tr><tr><td>Historical first-year cohort, 2024/25</td><td>2,000</td><td>1,720</td><td>86.0%</td></tr></tbody></table></div><p>The reported overall difference between 2025/26 and 2024/25 is <strong>3.1 percentage points</strong>, using rates rounded to one decimal place. The historical cohort was not a randomly assigned control group. Other institutional changes occurred between the two academic years.</p><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-04 — Operational and Equity Review</h3><p><strong>Source date:</strong> 10 June 2026.</p><p><strong>Disability-registration status:</strong> Recorded at the evaluation cut-off. The two categories are mutually exclusive and exhaustive for this table.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Disability-registration status</th><th>Total students</th><th>Students flagged</th><th>Flag rate</th></tr></thead><tbody><tr><td>Registered with a disability</td><td>300</td><td>105</td><td>35.0%</td></tr><tr><td>Not registered with a disability</td><td>1,700</td><td>395</td><td>23.2%</td></tr><tr><td>All students</td><td>2,000</td><td>500</td><td>25.0%</td></tr></tbody></table></div><p>The continuation table reports outcomes for different observed groups. The flag-rate table reports how frequently students in each recorded registration category were flagged. Use the denominators and group definitions when evaluating claims about SSI.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Evaluate three claims concerning SSI&#39;s effectiveness, fairness and operational reliability. For each, identify relevant source values or findings, explain what the evidence supports, identify what remains unresolved, and state one consequence for students or staff.</p></span></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="3" data-figure-id="asset-vb-38-4-va-a2-inference-boundaries-01-activity-a2-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c4/activity-a2-materials-entry.png" alt="Evidence-boundary graphic contrasting observations with stronger claims; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-a2-inference-boundaries-01-activity-a2-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 3.</strong> Why an observed pattern is not automatically a stronger institutional conclusion.</figcaption><p class="util-visual-asset-detailed-description" id="figure-description-asset-vb-38-4-va-a2-inference-boundaries-01-activity-a2-materials-entry">Three general evidence situations illustrate limits of inference. An outcome difference between non-random groups is an observation, not by itself a demonstrated causal effect. Different flag rates between categories are a recorded disparity, not by themselves an explanation of its cause. Counts of flags or support actions describe operational activity, not overall prediction accuracy. Each situation separates what has been observed from the stronger conclusion that would require additional evidence. No Northbridge-specific values or answers to the activity&#39;s three claims are provided.</p></figure><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A2-M2" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Evaluation Limitations, Operational Findings and Claims for Scrutiny</span></p><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-03 — Evaluation Limitations Note</h3><p><strong>Source:</strong> Northbridge University, 8 June 2026.</p><p>Dr Priya Shah identifies these limitations:</p><ul><li>Students engaging with support may differ in motivation, circumstances or existing support networks from those not engaging.</li><li>The previous cohort is not an equivalent control group.</li><li>An expanded first-year academic adviser scheme was also introduced in September 2025.</li><li>Some attendance records were incomplete.</li><li>Continuation does not fully represent wellbeing, confidence or educational experience.</li><li>The evaluation cannot establish whether SSI performs better than an equally resourced non-AI approach.</li></ul><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-04 — Operational and Equity Review</h3><p><strong>Source:</strong> Northbridge University, 10 June 2026.</p><h3 class="util-md-heading util-md-heading--source-3">Recorded operational findings</h3><ul><li><strong>100 of 500</strong> flagged students had no recorded personalised support contact.</li><li>Staff identified <strong>40 flagged cases</strong> where incomplete attendance information may have contributed to the flag.</li><li>A separate review of <strong>100 students who sought support through conventional routes</strong> found <strong>30 who had not been flagged</strong>. This was a selected group of conventional support users, not a representative sample of all unflagged students.</li><li>Reviewing flags added approximately <strong>25 hours of work per week</strong> across the academic support service during the busiest period.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Recorded equity-review limitations</h3><ul><li>The disability-registration flag rates appear in the accompanying data table.</li><li>The available information about underlying support needs, flag accuracy and outcomes is insufficient to determine the cause of the flag-rate difference.</li><li>The review cannot establish overall false-positive or false-negative rates.</li></ul><h3 class="util-md-heading util-md-heading--source-2">Claims to evaluate</h3><p>The following are <strong>propositions for scrutiny</strong>, not established institutional findings. Use the source evidence to decide what, if anything, each proposition is justified in claiming.</p><p><strong>Claim 1 — Contribution to continuation:</strong> The improvement in overall continuation establishes that SSI caused better continuation outcomes.</p><p><strong>Claim 2 — Fairness:</strong> The difference in flag rates between disability-registration categories establishes that SSI discriminates against students registered with a disability.</p><p><strong>Claim 3 — Operational reliability:</strong> SSI flags reliably identify students needing support and lead to appropriately targeted personalised contact.</p><p>For each claim, examine the recorded observations, the relevant comparison group, what remains unknown, and a possible consequence for students or staff. Avoid treating the wording of a proposition as evidence for it.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain which uncertainty most affects the committee&#39;s ability to judge whether SSI is operating acceptably, with a reason grounded in the evidence.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a2-a2-m3" data-material-source-id="A2-M3" data-activity-id="A2"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A2-M3" data-material-type="analysis_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Evaluate Three Institutional Claims</span></p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="a2-a2-m3-col-claim-0">Claim</th><th scope="col" id="a2-a2-m3-col-relevant-evidence-1">Relevant evidence</th><th scope="col" id="a2-a2-m3-col-supported-interpretation-2">Supported interpretation</th><th scope="col" id="a2-a2-m3-col-unresolved-limitation-3">Unresolved limitation</th><th scope="col" id="a2-a2-m3-col-student-or-staff-consequence-4">Student or staff consequence</th></tr></thead><tbody><tr><th scope="row" id="a2-a2-m3-row-0" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">1. Contribution to continuation</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r0-c1" name="a2-a2-m3-input-r0-c1" data-learner-cell="a2-a2-m3-input-r0-c1" rows="3" aria-labelledby="a2-a2-m3-row-0 a2-a2-m3-col-relevant-evidence-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r0-c2" name="a2-a2-m3-input-r0-c2" data-learner-cell="a2-a2-m3-input-r0-c2" rows="3" aria-labelledby="a2-a2-m3-row-0 a2-a2-m3-col-supported-interpretation-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r0-c3" name="a2-a2-m3-input-r0-c3" data-learner-cell="a2-a2-m3-input-r0-c3" rows="3" aria-labelledby="a2-a2-m3-row-0 a2-a2-m3-col-unresolved-limitation-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r0-c4" name="a2-a2-m3-input-r0-c4" data-learner-cell="a2-a2-m3-input-r0-c4" rows="3" aria-labelledby="a2-a2-m3-row-0 a2-a2-m3-col-student-or-staff-consequence-4" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a2-a2-m3-row-1" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">2. Fairness and disability-registration flag rates</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r1-c1" name="a2-a2-m3-input-r1-c1" data-learner-cell="a2-a2-m3-input-r1-c1" rows="3" aria-labelledby="a2-a2-m3-row-1 a2-a2-m3-col-relevant-evidence-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r1-c2" name="a2-a2-m3-input-r1-c2" data-learner-cell="a2-a2-m3-input-r1-c2" rows="3" aria-labelledby="a2-a2-m3-row-1 a2-a2-m3-col-supported-interpretation-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r1-c3" name="a2-a2-m3-input-r1-c3" data-learner-cell="a2-a2-m3-input-r1-c3" rows="3" aria-labelledby="a2-a2-m3-row-1 a2-a2-m3-col-unresolved-limitation-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r1-c4" name="a2-a2-m3-input-r1-c4" data-learner-cell="a2-a2-m3-input-r1-c4" rows="3" aria-labelledby="a2-a2-m3-row-1 a2-a2-m3-col-student-or-staff-consequence-4" autocomplete="off"></textarea></div></td></tr><tr><th scope="row" id="a2-a2-m3-row-2" class="util-learner-table-workspace__cell util-learner-table-workspace__cell--fixed">3. Operational reliability of flags and contact</th><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r2-c1" name="a2-a2-m3-input-r2-c1" data-learner-cell="a2-a2-m3-input-r2-c1" rows="3" aria-labelledby="a2-a2-m3-row-2 a2-a2-m3-col-relevant-evidence-1" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r2-c2" name="a2-a2-m3-input-r2-c2" data-learner-cell="a2-a2-m3-input-r2-c2" rows="3" aria-labelledby="a2-a2-m3-row-2 a2-a2-m3-col-supported-interpretation-2" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r2-c3" name="a2-a2-m3-input-r2-c3" data-learner-cell="a2-a2-m3-input-r2-c3" rows="3" aria-labelledby="a2-a2-m3-row-2 a2-a2-m3-col-unresolved-limitation-3" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="a2-a2-m3-input-r2-c4" name="a2-a2-m3-input-r2-c4" data-learner-cell="a2-a2-m3-input-r2-c4" rows="3" aria-labelledby="a2-a2-m3-row-2 a2-a2-m3-col-student-or-staff-consequence-4" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A2-M4" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Prioritise an Unresolved Uncertainty</p></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>Three evidence-based evaluations that distinguish recorded findings from conclusions the evaluation cannot establish. Each evaluation uses relevant source particulars, identifies a meaningful limitation and connects that limitation to a potential student or staff consequence. A short concluding judgement prioritises an unresolved uncertainty and explains its institutional significance without claiming that the evidence proves causation, discrimination or overall prediction error rates.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m4-section-most-consequential-uncertainty-1" data-response-part-id="A2-template-section-a2-m4-section-most-consequential-uncertainty-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-template-section-a2-m4-section-most-consequential-uncertainty-1-label" for="learner-workspace-a2-a2-template-section-a2-m4-section-most-consequential-uncertainty-1">Most consequential uncertainty</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-template-section-a2-m4-section-most-consequential-uncertainty-1-desc">State the unresolved question and why it remains unresolved.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-template-section-a2-m4-section-most-consequential-uncertainty-1" name="learner-workspace-a2-a2-template-section-a2-m4-section-most-consequential-uncertainty-1" rows="6" aria-describedby="learner-workspace-a2-a2-template-section-a2-m4-section-most-consequential-uncertainty-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m4-section-supporting-evidence-2" data-response-part-id="A2-template-section-a2-m4-section-supporting-evidence-2"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-template-section-a2-m4-section-supporting-evidence-2-label" for="learner-workspace-a2-a2-template-section-a2-m4-section-supporting-evidence-2">Supporting evidence</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-template-section-a2-m4-section-supporting-evidence-2-desc">Identify the relevant values, operational observations or evaluation limitations. Distinguish what the evidence records from what is still unknown.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-template-section-a2-m4-section-supporting-evidence-2" name="learner-workspace-a2-a2-template-section-a2-m4-section-supporting-evidence-2" rows="6" aria-describedby="learner-workspace-a2-a2-template-section-a2-m4-section-supporting-evidence-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m4-section-why-it-matters-for-the-committee-3" data-response-part-id="A2-template-section-a2-m4-section-why-it-matters-for-the-committee-3"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a2-a2-template-section-a2-m4-section-why-it-matters-for-the-committee-3-label" for="learner-workspace-a2-a2-template-section-a2-m4-section-why-it-matters-for-the-committee-3">Why it matters for the committee</label><p class="util-learner-workspace__prompt" id="learner-workspace-a2-a2-template-section-a2-m4-section-why-it-matters-for-the-committee-3-desc">Explain the potential consequence for students, staff or institutional responsibilities. If another uncertainty could reasonably be prioritised, acknowledge what makes the comparison difficult.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a2-a2-template-section-a2-m4-section-why-it-matters-for-the-committee-3" name="learner-workspace-a2-a2-template-section-a2-m4-section-why-it-matters-for-the-committee-3" rows="6" aria-describedby="learner-workspace-a2-a2-template-section-a2-m4-section-why-it-matters-for-the-committee-3-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#learner-check-a2" data-check-sidebar-open aria-controls="learner-check-a2" aria-expanded="false" aria-label="Check your work: What Can the Evidence Support?">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a2" data-composition-moment="check" data-activity-id="A2" data-check-sidebar="available" aria-labelledby="learner-check-a2-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="learner-check-a2-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a2">Back to your task (What Can the Evidence Support?)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m5-c-0" data-revision-criterion-id="a2-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you used the numerical findings with their correct groups, denominators and source context?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An incorrect denominator or comparison group changes what the observed rate describes and can invalidate an institutional inference.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Continuation values are associated with the correct flagged, engaged, unflagged or historical groups.</li><li><span class="util-guided-review__feature-key">B.</span> Disability-registration flag rates are linked to their respective registration-category totals.</li><li><span class="util-guided-review__feature-key">C.</span> The selected conventional-support review is distinguished from the full first-year population.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Match each continuation rate to its source-table row and specify the group being compared before drawing an inference.</li><li><span class="util-guided-review__feature-key">Missing B:</span> State which category each rate describes and use the relevant number of students in that category as the denominator.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify the 100-person review as a selected group of students using conventional support, and remove any population-wide rate inferred directly from that sample.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m5-item-0" data-checklist-item-id="checklist-a2-a2-m5-item-0"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m5-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m5-c-1" data-revision-criterion-id="a2-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you distinguished observations and associations from unsupported causal or discriminatory conclusions?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The committee could make a materially different decision if it mistakes an observed difference for proof of SSI&#39;s effect or the cause of unequal flag rates.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The continuation comparison is assessed in light of engagement selection and other institutional changes.</li><li><span class="util-guided-review__feature-key">B.</span> The flag-rate disparity is discussed without assuming its cause or the system&#39;s comparative prediction accuracy.</li><li><span class="util-guided-review__feature-key">C.</span> The evaluation states what cannot be established from the available evidence.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify how students choosing to engage and the expanded adviser scheme could complicate attribution of observed continuation differences.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Separate the recorded registration-category rates from questions about underlying support needs, flag accuracy and the reason for the difference.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify a specific causal, fairness or accuracy conclusion that the supplied findings do not resolve, rather than treating uncertainty as proof of either benefit or harm.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m5-item-1" data-checklist-item-id="checklist-a2-a2-m5-item-1"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m5-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m5-c-2" data-revision-criterion-id="a2-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you connected operational reliability to possible consequences for students and staff?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A system&#39;s institutional value depends partly on how flags are interpreted and acted upon, not only on the number of flags generated.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The contact gap is considered when evaluating the relationship between a flag and a support offer.</li><li><span class="util-guided-review__feature-key">B.</span> Incomplete attendance information is connected to the interpretation of student circumstances.</li><li><span class="util-guided-review__feature-key">C.</span> Staff review time is considered alongside potential support benefits.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Use the recorded contact figure to distinguish the generation of a flag from the subsequent staff decision or action.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain why the recorded cases of incomplete attendance information matter when judging whether a flag reflects a student&#39;s situation.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Connect the additional review workload to the capacity available for checking flags and delivering other academic support.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m5-item-2" data-checklist-item-id="checklist-a2-a2-m5-item-2"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m5-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m5-c-3" data-revision-criterion-id="a2-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you justified why your selected uncertainty is particularly consequential for the committee?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Prioritisation requires a defensible explanation of institutional significance, not merely identifying a limitation that appears in the source notes.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The chosen uncertainty is expressed as a question that the available evidence does not settle.</li><li><span class="util-guided-review__feature-key">B.</span> A source observation or limitation explains why the question remains open.</li><li><span class="util-guided-review__feature-key">C.</span> The judgement explains who could be affected and why the issue merits priority.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Reframe a broad concern as a specific unresolved issue about effectiveness, fairness, reliability or institutional consequences.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect the uncertainty to a particular comparison, missing measure, selected sample or operational observation.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify a plausible consequence for students, staff or governance, then explain why it matters relative to at least one other unresolved issue.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a2-a2-m5-item-3" data-checklist-item-id="checklist-a2-a2-m5-item-3"><label class="util-interactive-checklist__label" for="checklist-a2-a2-m5-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A3" data-journey-section="true" data-activity-id="A3" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Weigh the Committee&#39;s Four Options</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A3"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your stakeholder analysis identified competing benefits and harms; your evidence evaluation established which claims remain uncertain. Institutional judgement now requires applying both forms of reasoning to feasible alternatives, recognising that protecting one interest may carry costs for another.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>The Student Success Committee must recommend how Northbridge University should proceed with SSI for 2026/27. Compare the four available courses of action against the evidence, stakeholder consequences and practical limits already examined. Your task is to clarify the trade-offs that matter, not to produce the final recommendation.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Apply the same criteria to each fixed option. Distinguish known constraints from possible future consequences, consider who bears each trade-off, and avoid assuming additional funding or guaranteed results. All four options remain defensible in principle.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which trade-off would you find hardest to defend to someone whose experience of SSI differs from your own interpretation, and what evidence or priority would you need to acknowledge?</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a3" data-composition-moment="do" data-activity-id="A3" aria-labelledby="learner-task-a3-heading"><h3 class="util-composition-moment-heading" id="learner-task-a3-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a3" hidden data-revision-reminder="true" data-activity-id="A3" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a3" hidden data-revision-guidance="true" data-activity-id="A3" aria-labelledby="learner-revision-guidance-a3-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a3-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the committee&#39;s decision brief and four fixed options.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A3-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Student Success Committee Decision Brief</span></p><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-06 — Decision Brief</h3><p><strong>Source:</strong> Northbridge University, 15 June 2026.</p><p><strong>Decision-making body:</strong> Student Success Committee (SSC), chaired by Professor Helen Ward.</p><p><strong>Decision deadline:</strong> 18 June 2026.</p><p><strong>Decision period:</strong> Academic year 2026/27.</p><h3 class="util-md-heading util-md-heading--source-3">Institutional position</h3><p>The SSC must recommend a course of action for SSI for 2026/27 by 18 June 2026. Conventional academic support services and the expanded academic adviser scheme will remain available.</p><p>SSI costs <strong>£48,000 per academic year</strong> in software licensing and associated administration, <strong>excluding additional staff time</strong>. No additional recurring budget has been approved for 2026/27.</p><p>The committee must consider educational benefits, evidential limitations, fairness, reliability, student experience, staff capacity and financial implications.</p><h3 class="util-md-heading util-md-heading--source-3">Fixed decision options</h3><p><strong>Option A — Continue unchanged</strong></p><p>Retain SSI and current procedures for 2026/27.</p><p><strong>Option B — Continue with safeguards and further evaluation</strong></p><p>Retain SSI while improving oversight, communication, data quality and evaluation within available resources.</p><p><strong>Option C — Restrict or temporarily suspend SSI</strong></p><p>Limit use or pause flag-generated contacts while investigating specified concerns; retain conventional support routes.</p><p><strong>Option D — Withdraw SSI</strong></p><p>End the system and rely on conventional academic support and the expanded adviser scheme.</p><h3 class="util-md-heading util-md-heading--source-3">Conditions for the recommendation</h3><p>Conditions, safeguards, review dates and evidence requirements may be recommended within any option. No unapproved funding or certain future outcomes may be assumed. No option is designated correct.</p><p>Use this brief alongside the stakeholder accounts, continuation data, evaluation limitations and operational findings. The committee&#39;s task is to weigh consequences under the stated constraints; the final recommendation is reserved for &#39;The Committee Recommendation&#39;.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Complete a four-row comparison, considering for each option a potential educational benefit, a potential harm or lost opportunity, a fairness or trust implication, and an operational or financial constraint. Support the comparison with at least one relevant stakeholder account or institutional finding per option.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-wo
