tton" class="lj-shell__toc-link" data-lj-nav-id="c2">Reading the Evidence Carefully</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c3">When the Evidence Changes</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c4">The People Behind the Decision</button></li><li><button type="button" class="lj-shell__toc-link" data-lj-nav-id="c5">The Committee Recommendation</button></li></ol></nav></div></div></aside><div class="lj-shell__workspace"><div id="lj-shell-live" class="lj-shell__live" aria-live="polite" aria-atomic="true"></div><main id="lj-shell-main" class="lj-shell__main" data-lj-role="active-resource" aria-label="Learning content" tabindex="-1"></main></div></div><div class="lj-shell__templates" hidden aria-hidden="true"><template id="lj-resource-overview"><article class="lj-shell-overview" data-lj-overview="true" role="region" aria-labelledby="lj-shell-overview-heading"><h2 id="lj-shell-overview-heading" class="lj-shell-overview__title" data-lj-resource-title="true" tabindex="-1">Overview</h2><div class="util-editorial-opening" data-region="editorial-opening"><figure class="util-visual-asset util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-figure-number="1"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/editorial-opening.png" alt="" loading="lazy" decoding="async" /></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> A quiet British university student support meeting room with a table, empty chairs, notebooks and an unopened folder labelled Student Support Insight.</figcaption></figure></div><div class="lj-shell-overview__body"><p>A university introduces a new way of identifying students who might benefit from academic support. The early findings look promising. But what happens when further evidence raises difficult questions?</p><p>In this fictional case, you will follow Northbridge University as it considers the future of an AI-assisted student support initiative. You will interpret institutional findings, examine competing explanations, consider the experiences of students and staff, and recommend what the university should do next.</p><p>The challenge is not to understand how an AI system is built. It is to decide what evidence can justify, what remains uncertain and how an institution should act when different considerations point in different directions.</p><p>The journey takes approximately <strong>90 minutes</strong> and can be completed independently in one day. You do not need specialist knowledge of AI, statistics or university management. Everything needed for the case is provided as you progress.</p><p>You will encounter the evidence in stages. At first, you will know only what the university knew when its initial evaluation appeared encouraging. Later experiences will introduce further findings and perspectives. Keep a note of your initial judgement and how confident you feel about it: you will return to both.</p><p>By the end, you should be able to distinguish findings from interpretations, assess limitations, weigh stakeholder consequences and justify a proportionate recommendation without pretending that all uncertainty has disappeared. There may be more than one defensible decision; what matters is the quality of your reasoning.</p></div></article></template><template id="lj-resource-c1"><article class="util-learner-page util-page util-learner-renderer-vnext" data-renderer="vnext" data-page-kind="interactive" data-persistence-page-key="v1::22413210-0d16-40e4-93bf-4abac348bfd6::learner-page::2.0.0::a1-a2-a3-a4::the-promising-pilot" data-persistence-storage-key="learner-renderer-vnext:draft:v1::22413210-0d16-40e4-93bf-4abac348bfd6::learner-page::2.0.0::a1-a2-a3-a4::the-promising-pilot" data-composition-mode="moments" data-composed-activity-count="4" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">The Promising Pilot</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="6"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 6"><span class="util-journey-position__visible" aria-hidden="true">1 of 6</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c1--activity-A1" aria-label="Next section: Trace the Student Support Process"><span class="util-journey-adjacent__title">Trace the Student Support Process</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c1--journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#lj-c1--activity-A1">Trace the Student Support Process</a></li><li><a class="util-journey-all-link" href="#lj-c1--activity-A2">Interpret the Early Evaluation</a></li><li><a class="util-journey-all-link" href="#lj-c1--activity-A3">Make Your Provisional Judgement</a></li><li><a class="util-journey-all-link" href="#lj-c1--activity-A4">Check Confidence and Communicate Cautiously</a></li><li><a class="util-journey-all-link" href="#lj-c1--journey-study-tips">Study tips</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="lj-c1--journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>Northbridge University has introduced a fictional AI-assisted system to help identify first-year students who may benefit from academic support. The university has received an encouraging initial evaluation, but the evidence is not yet complete.</p><p>In this independent learning resource, you will explore how the system works, investigate the preliminary findings and record your own provisional judgement about whether the pilot appears worth continuing.</p><p>Begin with the institutional scenario and work through the four activities in order. Complete your interpretation of the evaluation before revealing its sample explanation. Keep your initial judgement and confidence rating for later reconsideration.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>Institutional decisions often have to be made before all the relevant evidence is available. This resource gives you an opportunity to practise interpreting numerical findings, distinguishing observations from causal claims and explaining a defensible position under uncertainty.</p><p>The quality of your reasoning matters more than whether you favour or oppose the pilot. You should be able to explain what the available evidence supports, what it cannot establish and how those limits affect your confidence.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><h3 class="util-md-heading util-md-heading--source-2">Understanding the institutional setting</h3><p>Northbridge University is a fictional public university in England. It wants to improve timely academic support for first-year undergraduates and help students continue their studies without undermining trust, autonomy or equitable treatment.</p><p>In September 2025, the university introduced Student Support Insight (SSI), an AI-assisted system that uses existing information about engagement with online learning systems, attendance where available and assignment submissions to identify possible support needs.</p><p>An SSI support flag is an indication for staff to consider. It is not a diagnosis, a measure of academic ability or an automatic decision about a student. Authorised staff review flags and decide whether personalised contact is appropriate. Students retain the choice to engage with an offer of support, and conventional academic support remains available independently of SSI.</p><h3 class="util-md-heading util-md-heading--source-2">Distinguishing stages of support</h3><p>Three terms describe different events:</p><ul><li>A support flag means the system has identified a possible need for attention.</li><li>Personalised support contact means staff have made a recorded approach to a student.</li><li>Support engagement means the student has attended at least one support conversation.</li></ul><p>These stages must not be treated as interchangeable. A student may be flagged without receiving recorded contact, and a student who receives contact may not attend a conversation. The reasons for either outcome cannot be assumed from the stage alone.</p><h3 class="util-md-heading util-md-heading--source-2">Reading a preliminary evaluation</h3><p>An evaluation may report counts, proportions and comparisons between groups. A count tells you how many students meet a specified condition. A percentage expresses a proportion relative to a particular denominator, so the group being counted must always be identified.</p><p>When comparing two percentages, the arithmetic difference is expressed in percentage points. For example, if 65% of one group and 55% of another meet a specified outcome, the difference is 10 percentage points. This is not the same calculation as a 10% relative increase.</p><p>The meaning of an outcome also depends on when and how it is measured. Being enrolled at a preliminary reporting point is not necessarily equivalent to confirmed continuation into the next academic year.</p><h3 class="util-md-heading util-md-heading--source-2">Association, causation and uncertainty</h3><p>An observed association is a relationship found in recorded information. A causal claim goes further: it says that one factor produced a change in another.</p><p>When students have not been assigned to comparison groups in a way that makes them equivalent, differences between those groups may have several explanations. For instance, students who choose to use a support service might differ in motivation or circumstances from students who do not. These are possibilities to investigate, not facts that can be assumed about particular students.</p><p>An observed difference may therefore provide a reason for interest without establishing that a service caused it. Equally, the absence of causal proof does not establish that the service has no benefit. A careful evaluation distinguishes what was recorded, what might explain it and what remains unknown.</p><h3 class="util-md-heading util-md-heading--source-2">Making a provisional judgement</h3><p>A provisional judgement is a reasoned position taken with the evidence currently available. It may favour an initiative, oppose it or remain undecided. A defensible judgement identifies relevant evidence, explains how that evidence supports the position and acknowledges uncertainty that could affect the conclusion.</p><p>Confidence is a separate consideration. It describes how securely the evidence supports your judgement, rather than how strongly you prefer a particular outcome. Recording your initial position, reasons, uncertainty and confidence creates a useful basis for reconsideration when further evidence becomes available.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/knowledge-summary-after-content.png" alt="Concept map linking SSI support stages, evaluation evidence and provisional judgement; detailed description follows." aria-describedby="lj-c1--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> How the SSI support process, preliminary evidence and provisional judgement relate without implying automatic or causal connections.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c1--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">The map connects three conceptual groups. The support process begins with existing learning information and a possible SSI flag, followed by authorised staff review, possible personalised contact and optional student engagement. The evaluation group distinguishes recorded counts and proportions, observed group comparisons, preliminary outcomes and uncertainty about causes. The judgement group connects evidence and supporting reasons with unresolved uncertainty, a provisional position and confidence in that position. Links indicate that recorded evidence informs reasoning; they do not establish that engagement causes continuation or prescribe a particular decision.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Describe the purpose of Student Support Insight (SSI) and distinguish between a support flag, a personalised support contact and student engagement, including the roles of staff judgement and student choice. <span class="util-outcome-id">(LO1)</span></li><li>Interpret the preliminary SSI evaluation by identifying the relevant comparison groups, accurately describing their enrolment proportions and distinguishing an observed association from a demonstrated causal effect. <span class="util-outcome-id">(LO2)</span></li><li>Form and justify a provisional judgement about whether SSI appears worth continuing, using at least two relevant details from the available evidence and identifying one important uncertainty that limits the conclusion. <span class="util-outcome-id">(LO3)</span></li><li>Rate and explain confidence in the provisional judgement, distinguishing the strength of the available evidence from personal preference and identifying what may need reconsideration when further evidence becomes available. <span class="util-outcome-id">(LO4)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="lj-c1--journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="lj-c1--activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Trace the Student Support Process</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The Promising Pilot begins with a question about whether a new approach to student support appears promising. Before judging the evidence, establish what the initiative actually does and distinguish identification, contact and engagement.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Northbridge University is a fictional public university in England. In September 2025, it introduced Student Support Insight (SSI), an AI-assisted system intended to help staff identify first-year students who might benefit from academic support. Begin by examining how the system works and where staff and students make decisions. Allow approximately 3 minutes.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Follow what happens to a possible support need rather than assuming that the system itself makes every decision. Distinguish an indication, an offer and an action taken by a student.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which part of the process depends on staff judgement, and which part depends on the student&#39;s choice?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A1"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Read the fictional institutional scenario and trace the sequence from an SSI flag to a possible support conversation.</p></span></div></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a1-support-process-01-activity-a1-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c1/activity-a1-materials-entry.png" alt="Conditional SSI pathway from support flag through staff review and student choice; detailed description follows." aria-describedby="lj-c1--figure-description-asset-vb-38-4-va-a1-support-process-01-activity-a1-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 2.</strong> The possible SSI support pathway, with staff decisions and student choice shown as conditional stages.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c1--figure-description-asset-vb-38-4-va-a1-support-process-01-activity-a1-materials-entry">Existing information about online learning engagement, available attendance and assignment submissions may contribute to an SSI support flag. The flag is considered by authorised staff, who decide whether personalised contact is appropriate. Where contact is offered, the student may attend a support conversation or decline. The branches distinguish identification from staff action and student engagement. A separate connection shows that conventional academic support remains available to students without requiring an SSI flag.</p></figure><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A1-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">How SSI Fits into Human-Led Support</span></p><h3 class="util-md-heading util-md-heading--source-2">From information to support</h3><p>SSI is best understood as an identification tool within a wider human-led support process. Its purpose is to draw staff attention to patterns that may indicate a student could benefit from contact. It does not establish why those patterns have occurred or determine what should happen next.</p><p>The process has four connected stages:</p><ol><li>Identification: SSI examines existing information about online learning engagement, attendance where available and assignment submission patterns. It may generate a support flag.</li><li>Staff review: Authorised staff consider the flag and decide whether personalised contact is appropriate.</li><li>Contact: If staff decide to act, they may offer the student a support conversation or another appropriate route to assistance.</li><li>Engagement: The student decides whether to take up the offer. Attending a support conversation is a further step, not an automatic consequence of being flagged or contacted.</li></ol><p>These stages matter because they describe different things. A flagged student has been identified by the system but may not have received contact. A contacted student has received an offer but may not have attended a conversation. A student who attends at least one support conversation has engaged with that support.</p><p>Human judgement and student choice affect how the process unfolds. For example, staff might review a flag and decide that contact is not appropriate at that time. Alternatively, staff might make contact but the student may decline. Neither outcome means that the system has made a diagnosis or an academic decision about the student.</p><p>Conventional support remains available independently of SSI. A student does not need an SSI flag to seek help.</p><p>As you construct your explanation, distinguish what the system indicates from what staff and students decide. Do not assume that each stage necessarily leads to the next.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c1--learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="lj-c1--learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="lj-c1--learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c1--learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c1--learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="lj-c1--learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c1--learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>In the response workspace, explain the purpose of SSI and distinguish a support flag, a personalised support contact and support engagement.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A1-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Northbridge University: Introducing Student Support Insight</span></p><h3 class="util-md-heading util-md-heading--source-2">The institutional setting</h3><p>Northbridge University is a fictional public university in England. Like many universities, it is concerned about first-year undergraduates who leave their courses before progressing to the second year. The university wants to identify students who may benefit from academic support while there is still time to offer it.</p><p>In September 2025, Northbridge introduced Student Support Insight (SSI), an AI-assisted system intended to help staff identify possible support needs earlier.</p><p>SSI draws on three categories of information already held by the university:</p><ul><li>Engagement with the university&#39;s online learning systems.</li><li>Attendance information, where it is available.</li><li>Patterns of assignment submission.</li></ul><p>The system uses these patterns to generate support flags for students who might benefit from additional academic contact.</p><h3 class="util-md-heading util-md-heading--source-2">What happens after a flag?</h3><p>An SSI flag is reviewed by authorised university staff. Staff decide whether personalised contact is appropriate. A student who receives an offer may choose to engage with the suggested support or decline it. Existing academic support services remain available to students whether or not SSI has flagged them.</p><p>SSI does not diagnose students, determine academic ability, award grades or automatically impose sanctions.</p><h3 class="util-md-heading util-md-heading--source-2">Your focus</h3><p>Trace the possible route from an SSI flag to a support conversation. Identify where the system supplies an indication, where staff exercise judgement and where students retain a choice.</p><p>This is a fictional case created for learning. It does not describe a real university&#39;s student monitoring system.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify one decision made by staff and one choice retained by students.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A1-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Your Explanation of the SSI Support Process</p></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A concise explanation that accurately identifies SSI&#39;s intended support purpose, distinguishes the three stages of identification, contact and engagement, and explains staff oversight and student choice. The explanation must not imply that a flag diagnoses a student, automatically triggers a sanction or guarantees a support conversation.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-purpose-of-ssi-1" data-response-part-id="A1-template-section-a1-m3-section-purpose-of-ssi-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-purpose-of-ssi-1-label" for="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-purpose-of-ssi-1">Purpose of SSI</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-purpose-of-ssi-1-desc">Record your response for Purpose of SSI.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-purpose-of-ssi-1" name="learner-workspace-a1-a1-template-section-a1-m3-section-purpose-of-ssi-1" rows="6" aria-describedby="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-purpose-of-ssi-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-flag-contact-and-engagement-2" data-response-part-id="A1-template-section-a1-m3-section-flag-contact-and-engagement-2"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-flag-contact-and-engagement-2-label" for="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-flag-contact-and-engagement-2">Flag, contact and engagement</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-flag-contact-and-engagement-2-desc">Record your response for Flag, contact and engagement.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-flag-contact-and-engagement-2" name="learner-workspace-a1-a1-template-section-a1-m3-section-flag-contact-and-engagement-2" rows="6" aria-describedby="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-flag-contact-and-engagement-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-staff-decision-3" data-response-part-id="A1-template-section-a1-m3-section-staff-decision-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-staff-decision-3-label" for="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-staff-decision-3">Staff decision</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-staff-decision-3-desc">Record your response for Staff decision.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-staff-decision-3" name="learner-workspace-a1-a1-template-section-a1-m3-section-staff-decision-3" rows="6" aria-describedby="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-staff-decision-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-template-section-a1-m3-section-student-choice-4" data-response-part-id="A1-template-section-a1-m3-section-student-choice-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-student-choice-4-label" for="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-student-choice-4">Student choice</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-student-choice-4-desc">Record your response for Student choice.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-student-choice-4" name="learner-workspace-a1-a1-template-section-a1-m3-section-student-choice-4" rows="6" aria-describedby="lj-c1--learner-workspace-a1-a1-template-section-a1-m3-section-student-choice-4-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c1--learner-check-a1" data-check-sidebar-open aria-controls="lj-c1--learner-check-a1" aria-expanded="false" aria-label="Check your work: Trace the Student Support Process">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c1--learner-check-a1" data-composition-moment="check" data-activity-id="A1" data-check-sidebar="available" aria-labelledby="lj-c1--learner-check-a1-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c1--learner-check-a1-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c1--learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c1--learner-task-a1">Back to your task (Trace the Student Support Process)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m4-c-0" data-revision-criterion-id="a1-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you explained SSI&#39;s intended purpose accurately?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An inaccurate purpose statement can make an early-support tool appear to be a system for diagnosing or judging students.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The explanation connects SSI to identifying first-year students who may benefit from timely academic support.</li><li><span class="util-guided-review__feature-key">B.</span> The explanation identifies the existing information used to generate possible support flags.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Relate the system&#39;s purpose to possible support needs and the university&#39;s concern about students leaving before their second year.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Add the relevant categories of learning-system engagement, attendance where available and assignment submission patterns.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a1-a1-m4-item-0" data-checklist-item-id="checklist-a1-a1-m4-item-0"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a1-a1-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m4-c-1" data-revision-criterion-id="a1-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you distinguished being flagged, contacted and engaged?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Collapsing these stages makes it impossible to describe accurately what has happened to an individual student.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> A support flag is distinguished from a recorded personalised contact.</li><li><span class="util-guided-review__feature-key">B.</span> Receiving contact is distinguished from attending a support conversation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Explain the difference between the system identifying a possible need and staff making contact.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Add the student&#39;s possible response to an offer and distinguish receipt of an offer from participation in support.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a1-a1-m4-item-1" data-checklist-item-id="checklist-a1-a1-m4-item-1"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a1-a1-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m4-c-2" data-revision-criterion-id="a1-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you identified the role of staff judgement?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Leaving out staff review incorrectly assigns responsibility for contact decisions to the automated system.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Authorised staff review the system&#39;s flags.</li><li><span class="util-guided-review__feature-key">B.</span> The decision to offer personalised contact is attributed to staff.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Insert the staff review stage between a generated flag and any possible contact.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify who decides whether contact is appropriate rather than describing contact as an automatic result.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a1-a1-m4-item-2" data-checklist-item-id="checklist-a1-a1-m4-item-2"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a1-a1-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m4-c-3" data-revision-criterion-id="a1-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you recognised student choice and the limits of SSI?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The account must preserve the difference between an invitation to receive support and an imposed academic consequence.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Students can accept or decline a support offer.</li><li><span class="util-guided-review__feature-key">B.</span> Conventional academic support remains available without an SSI flag.</li><li><span class="util-guided-review__feature-key">C.</span> SSI is not described as diagnosing, grading, determining academic ability or automatically sanctioning students.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the choice available after contact and distinguish that choice from the staff decision to make an offer.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Explain that access to existing support is not conditional on being identified by SSI.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Remove any automatic academic consequence attributed to a flag and distinguish identification from formal academic decisions.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a1-a1-m4-item-3" data-checklist-item-id="checklist-a1-a1-m4-item-3"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a1-a1-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c1--activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Interpret the Early Evaluation</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">You have distinguished an SSI flag from an offer of support and actual engagement. Those distinctions now matter when reading the evaluation: the figures describe different groups and must not be treated as interchangeable.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Northbridge&#39;s preliminary evaluation, dated 12 March 2026, contains encouraging figures. Examine the reported groups and outcomes before deciding what the findings might mean. Allow approximately 4 minutes.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Start with the denominators and the meaning of engagement. Calculate the difference between the percentages, then separate the observed pattern from an explanation of why it occurred.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">What can the comparison establish directly, and what would require stronger evidence?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A2"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A2-M2" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Comparing Percentages Without Overstating the Evidence</span></p><h3 class="util-md-heading util-md-heading--source-2">Percentage points</h3><p>A percentage describes a proportion within a specified group. When two groups have different sizes, their percentages can be compared, but the denominator for each percentage still matters.</p><p>The difference between two percentages is expressed in percentage points. For example, if 60% of one group and 45% of another group meet an outcome, the difference is 15 percentage points. It would be misleading to call that a 15% relative increase, because a relative percentage change uses a different calculation.</p><p>For the Northbridge figures, identify each group and its denominator first. Then subtract the reported percentages and state the result in percentage points.</p><h3 class="util-md-heading util-md-heading--source-2">Association and causation</h3><p>An observed association means that two characteristics occur together in the recorded data. It does not, by itself, establish that one caused the other.</p><p>For example, students who choose to attend support may differ from students who do not attend in ways that also affect their likelihood of remaining enrolled. Differences in motivation, circumstances or access to other help are possible explanations, not established facts about the Northbridge students.</p><p>A careful interpretation therefore separates three questions:</p><ol><li>What difference is recorded between the groups?</li><li>What might explain the difference?</li><li>What further evidence would be needed to establish an effect of the support itself?</li></ol><p>The evaluation also reports enrolment at a preliminary point. A student being enrolled on that date is not the same outcome as confirmed continuation into the following academic year.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c1--learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="lj-c1--learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="lj-c1--learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c1--learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c1--learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="lj-c1--learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c1--learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the preliminary evaluation record and identify the students being compared.</p></span></div><article class="util-material-block util-material-table-block" data-material-id="A2-M1" data-material-type="data_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">NB-SSI-01: Initial Evaluation Summary</span></p><h3 class="util-md-heading util-md-heading--source-2">Northbridge University — preliminary evaluation</h3><p>Source: NB-SSI-01, Initial Evaluation Summary, 12 March 2026.</p><p>The figures below describe students flagged by Student Support Insight and their recorded support activity. The enrolment figures refer to the preliminary reporting point.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Recorded measure</th><th>Students</th><th>Definition or reporting status</th></tr></thead><tbody><tr><td>Students flagged by SSI</td><td>500</td><td>First-year students identified as potentially needing academic support</td></tr><tr><td>Flagged students receiving recorded personalised contact</td><td>400</td><td>Students for whom a personalised support contact was recorded</td></tr><tr><td>Contacted students engaging in support</td><td>240</td><td>Students who attended at least one support conversation</td></tr></tbody></table></div><h3 class="util-md-heading util-md-heading--source-3">Preliminary enrolment among flagged students</h3><div class="util-table-scroll util-material-table"><table><thead><tr><th>Comparison group</th><th>Students in group</th><th>Still enrolled at preliminary reporting point</th><th>Reported proportion still enrolled</th></tr></thead><tbody><tr><td>Engaged with support</td><td>240</td><td>216</td><td>90%</td></tr><tr><td>Did not engage with support</td><td>260</td><td>208</td><td>80%</td></tr></tbody></table></div><p>For this comparison, engagement means attendance at least one support conversation. The non-engaged group comprises flagged students without recorded engagement in a support conversation; it is not the same as the group that did not receive contact.</p><p>The initial evaluation summary characterises the findings as encouraging and recommends continuing the pilot while collecting more evidence. That is the summary&#39;s recommendation, not a conclusion you are required to accept.</p><p>The enrolment measure is preliminary. It is not a final measure of continuation into the next academic year.</p><p>Use the counts, denominators and reported percentages to form your own interpretation before consulting the review material.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Record the enrolment proportions for the two groups and calculate the difference in percentage points.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A2-M3" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Your Interpretation of the Preliminary Evaluation</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain what relationship the figures show and whether they establish that support engagement caused the observed difference.</p></span></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Distinguish preliminary enrolment from final continuation.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>An accurate comparison that identifies the groups and denominators, records the reported enrolment proportions, calculates their percentage-point difference, describes the observed relationship and states an appropriate limit on causal interpretation. The response must recognise that the outcome concerns enrolment at a preliminary reporting point, not final continuation.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m3-section-groups-and-denominators-1" data-response-part-id="A2-template-section-a2-m3-section-groups-and-denominators-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c1--learner-workspace-a2-a2-template-section-a2-m3-section-groups-and-denominators-1-label" for="lj-c1--learner-workspace-a2-a2-template-section-a2-m3-section-groups-and-denominators-1">Groups and denominators</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a2-a2-template-section-a2-m3-section-groups-and-denominators-1-desc">Record your response for Groups and denominators.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a2-a2-template-section-a2-m3-section-groups-and-denominators-1" name="learner-workspace-a2-a2-template-section-a2-m3-section-groups-and-denominators-1" rows="6" aria-describedby="lj-c1--learner-workspace-a2-a2-template-section-a2-m3-section-groups-and-denominators-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a2-a2-template-section-a2-m3-section-reported-enrolment-proportions-2" data-response-part-id="A2-template-section-a2-m3-section-report of the conclusion</label><p class="util-learner-workspace__prompt" id="lj-c1--learner-workspace-a2-a2-template-section-a2-m3-section-limits-of-the-conclusion-5-desc">Record your response for Limits of the conclusion.</p><textarea class="util-learner-workspace__input" id="lj-c1--learner-workspace-a2-a2-template-section-a2-m3-section-limits-of-the-conclusion-5" name="learner-workspace-a2-a2-template-section-a2-m3-section-limits-of-the-conclusion-5" rows="6" aria-describedby="lj-c1--learner-workspace-a2-a2-template-section-a2-m3-section-limits-of-the-conclusion-5-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c1--learner-check-a2" data-check-sidebar-open aria-controls="lj-c1--learner-check-a2" aria-expanded="false" aria-label="Check your work: Interpret the Early Evaluation">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c1--learner-check-a2" data-composition-moment="check" data-activity-id="A2" data-check-sidebar="available" aria-labelledby="lj-c1--learner-check-a2-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c1--learner-check-a2-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c1--learner-check-a2-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c1--learner-task-a2">Back to your task (Interpret the Early Evaluation)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="5"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Review your interpretation using the feedback and diagnostic checklist.</p></span></div><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A2-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a2-a2-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a2-m5-c-0" data-revision-criterion-id="a2-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you identified the comparison groups and their denominators correctly?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confusing contact with engagement changes which students are being compared and can invalidate the interpretation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The engaged group is identified as flagged students who attended at least one support conversation.</li><li><span class="util-guided-review__feature-key">B.</span> The non-engaged group is identified as flagged students without recorded support engagement.</li><li><span class="util-guided-review__feature-key">C.</span> Each reported enrolment count is matched to its own group size.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Define engagement by attendance at a support conversation and use the count belonging to that group.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Distinguish lack of engagement from lack of contact, then use the corresponding flagged-student denominator.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Pair the number still enrolled with the total number of students in the same comparison group before interpreting its proportion.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a2-a2-m5-item-0" data-checklist-item-id="checklist-a2-a2-m5-item-0"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a2-a2-m5-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a2-m5-c-1" data-revision-criterion-id="a2-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you calculated and described the numerical difference appropriately?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An incorrect calculation or unit can make the size of the observed relationship misleading.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Both reported preliminary enrolment percentages are stated accurately.</li><li><span class="util-guided-review__feature-key">B.</span> The difference is calculated by subtracting one reported percentage from the other.</li><li><span class="util-guided-review__feature-key">C.</span> The resulting difference is expressed in percentage points.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Copy the two reported rates from the evaluation table and identify which group each belongs to.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Subtract the smaller reported enrolment percentage from the larger and show the resulting difference.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Label the subtraction result in percentage points rather than treating it as a relative percentage increase.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a2-a2-m5-item-1" data-checklist-item-id="checklist-a2-a2-m5-item-1"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a2-a2-m5-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a2-m5-c-2" data-revision-criterion-id="a2-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you distinguished the observed relationship from a demonstrated causal effect?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The data compare groups with different recorded engagement, but do not establish that engagement itself produced the enrolment difference.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The interpretation describes the difference as an observed association.</li><li><span class="util-guided-review__feature-key">B.</span> The response avoids saying that support engagement or SSI proved the outcome.</li><li><span class="util-guided-review__feature-key">C.</span> At least one plausible alternative explanation is acknowledged as uncertain.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Describe what the enrolment figures record before offering an explanation of why the groups differ.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Replace any claim of proven impact with a statement limited to the observed comparison.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify a possible difference between students who engaged and those who did not, without presenting that possibility as an established fact.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c1--checklist-a2-a2-m5-item-2" data-checklist-item-id="checklist-a2-a2-m5-item-2"><label class="util-interactive-checklist__label" for="lj-c1--checklist-a2-a2-m5-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c1--learner-task-a2" data-revise-with-criterion="true" data-activity-id="A2" data-revision-criterion-id="a2-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a2-m5-c-3" data-revision-criterion-id="a2-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Crit
