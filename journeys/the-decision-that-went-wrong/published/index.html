btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">An encouraging result, but what does it tell us?</span><p class="util-journey-position" aria-label="Section 1 of 6"><span class="util-journey-position__visible" aria-hidden="true">1 of 6</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c2--exposition-S2" aria-label="Next section: What was counted, and who was compared?"><span class="util-journey-adjacent__title">What was counted, and who was compared?</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c2--exposition-S1" aria-current="location">An encouraging result, but what does it tell us?</a></li><li><a class="util-journey-all-link" href="#lj-c2--exposition-S2">What was counted, and who was compared?</a></li><li><a class="util-journey-all-link" href="#lj-c2--exposition-S3">From observation to interpretation</a></li><li><a class="util-journey-all-link" href="#lj-c2--exposition-S4">Why might the groups differ?</a></li><li><a class="util-journey-all-link" href="#lj-c2--exposition-S5">What the measures cannot tell us</a></li><li><a class="util-journey-all-link" href="#lj-c2--exposition-S6">Making a judgement the evidence can support</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-exposition-sections" data-region="exposition"><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c2--exposition-S1" data-section-id="S1" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">An encouraging result, but what does it tell us?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Northbridge University introduced Student Support Insight (SSI) in September 2025 because it wanted to identify first-year students who might benefit from academic support before difficulties became more serious. The university was concerned about students leaving their courses before the second year and hoped that earlier conversations could help.</p><p>SSI is an AI-assisted advisory system. It uses existing information about engagement with university learning systems, attendance where available, and assignment submission patterns to identify students who may benefit from support. A flag is not a diagnosis or a judgement about academic ability. Authorised staff review flags and decide whether to contact students. Students can decline support, and conventional academic support routes remain available.</p><p>The university&#39;s initial evaluation summary, NB-SSI-01, dated 12 March 2026, reported an encouraging difference. Among students flagged by SSI, 90% of those who engaged in a support conversation were still enrolled at the preliminary reporting point. Among flagged students who did not engage, the corresponding figure was 80%.</p><p>It is reasonable to notice that difference. A higher enrolment rate among students who engaged with support is potentially useful information for a university trying to improve student continuation. But there is a further question: does the difference show that support engagement caused students to remain enrolled?</p><p>Those are not equivalent claims. The first describes what was observed. The second offers an explanation for why it happened. Moving from one to the other requires additional reasoning and evidence.</p><p>If you completed The Promising Pilot, revisit the provisional judgement you made about SSI, including your reasons and how confident you felt. Keep that judgement in mind as you examine which parts of your reasoning follow directly from the preliminary findings and which depend on assumptions. You do not need to have reached a particular conclusion, and the relevant figures are provided here independently.</p><p>Reading evidence carefully does not mean assuming that encouraging findings are misleading. Nor does it mean accepting a positive interpretation simply because the numbers look persuasive. It means being precise about what the evidence establishes, considering what else could explain the pattern, and adjusting confidence to match the strength of the evidence.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c2--exposition-S2" data-section-id="S2" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">What was counted, and who was compared?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Before deciding what the preliminary figures mean, we need to understand exactly who was counted. A percentage can appear straightforward while concealing an important question: a percentage of which group?</p><p>The initial evaluation recorded 500 students who had been flagged by SSI. Of those students, 400 received a recorded personalised offer of academic support. This is called support contact. Of the contacted students, 240 attended at least one support conversation. This is called support engagement.</p><p>These numbers describe different events. Being flagged does not mean that a student was contacted. Being contacted does not mean that a student attended a conversation. And attending a conversation does not, by itself, establish that the conversation improved the student&#39;s circumstances.</p><p>The difference between the 500 flagged students and the 240 who engaged is 260. These 260 students form the non-engaged comparison group. They should not all be described as students who refused help. Some did not receive a recorded personalised contact; others were contacted but did not attend a support conversation. The summary does not establish why each individual did not engage.</p><p>A count tells us how many cases meet a particular description. A percentage tells us what share of a defined group those cases represent. To calculate a percentage, divide the relevant count by the total number in that group, known as the denominator, and multiply by 100.</p><p>For the 240 flagged students who engaged, 216 were still enrolled at the preliminary reporting point. The calculation is 216 ÷ 240 × 100 = 90%. The denominator is 240 because the question concerns students who engaged, not all students flagged by SSI.</p><p>For the 260 flagged students who did not engage, 208 were still enrolled. The calculation is 208 ÷ 260 × 100 = 80%. Here the denominator is 260 because the question concerns the non-engaged group.</p><p>Subtracting 80% from 90% gives a difference of 10 percentage points. A percentage-point difference is the direct difference between two percentages. It is not the same as saying that engagement increased an individual&#39;s chance of remaining enrolled by 10%, and it does not establish that engagement caused the difference.</p><p>Notice also that both groups consist of students who were flagged by SSI. The comparison is not between every student who used SSI and every student who did not. It is between flagged students who engaged with a support conversation and flagged students who did not engage.</p><p>The reported outcome is similarly specific: students were still enrolled at the preliminary reporting point. The figures do not yet tell us whether they eventually continued into the next academic year.</p><p>We can therefore state the numerical finding accurately: among the 500 students flagged by SSI, 90% of those who engaged with support and 80% of those who did not engage were still enrolled at the preliminary reporting point. The observed difference was 10 percentage points.</p><p>That statement establishes the pattern in the reported data. Explaining why the pattern exists is a separate matter.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material util-exposition-structured-fallback" data-material-id="XM-S2-01" data-material-kind="Nested population and comparison diagram" data-material-type="expository_structured_fallback" data-section-id="S2" data-expository-structured="fallback" data-representation-spec-suppressed="section-figure"><h3>From support flags to support conversations</h3></article><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-S2-02" data-material-kind="Preliminary enrolment comparison" data-material-type="expository_structured_table" data-section-id="S2" data-expository-structured="table"><h3>Preliminary enrolment among flagged students</h3><p>Both groups were flagged by SSI. They differ according to whether students attended at least one support conversation.</p><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Comparison group</th><th scope="col">Still enrolled</th><th scope="col">Total in group</th><th scope="col">Preliminary enrolment rate</th></tr></thead><tbody><tr><td>Flagged and engaged</td><td>216</td><td>240</td><td>90%</td></tr><tr><td>Flagged and did not engage</td><td>208</td><td>260</td><td>80%</td></tr></tbody></table></div><div><p><strong>Outcome</strong></p><p>Still enrolled at the preliminary reporting point</p></div><section><h4>Worked difference</h4><dl><div><dt>Label</dt><dd>Difference between the reported rates</dd></div><div><dt>Calculation</dt><dd>90% − 80% = 10 percentage points</dd></div><div><dt>Result</dt><dd>10 percentage points</dd></div></dl></section><div><p><strong>Accessible text</strong></p><p>Among 240 flagged students who engaged with support, 216 were still enrolled at the preliminary reporting point, equivalent to 90%. Among 260 flagged students who did not engage, 208 were still enrolled, equivalent to 80%. The difference between the reported enrolment rates was 10 percentage points.</p></div><p>The comparison establishes a higher recorded preliminary enrolment rate in the engaged group. It does not establish that engagement produced the difference.</p></article></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--section-after-content" data-visual-slot="section-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-s2-population-01-section-s2-section-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/section-after-content.png" alt="Branching diagram of 500 flagged students. Of these, 400 received recorded personalised support contact and 100 did not. Among the 400 contacted, 240 engaged and 160 did not. The engaged group totals 240; the non-engaged group totals 260." aria-describedby="lj-c2--figure-description-asset-vb-38-4-va-s2-population-01-section-s2-section-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> How the 500 flagged students divide into 240 who engaged with support and 260 who did not engage.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c2--figure-description-asset-vb-38-4-va-s2-population-01-section-s2-section-after-content">A compact top-down branching diagram begins with a single box labelled &#39;500 students flagged by SSI&#39;. Two connected branches lead to &#39;400 received recorded personalised support contact&#39; and &#39;100 no recorded personalised contact&#39;. The 400-contact branch divides into &#39;240 engaged in at least one support conversation&#39; and &#39;160 contacted but did not engage&#39;. At the bottom, a comparison-group summary visually connects the 240 engaged students to an &#39;Engaged: 240&#39; total and the 160 plus 100 students to a &#39;Did not engage: 260&#39; total. Connectors must follow these exact branches and no others. The diagram uses neutral, accessible styling, clear numerical labels and sufficient spacing for the nested structure to remain legible. A small note explains that non-engagement does not necessarily mean refusal.</p></figure></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c2--exposition-S3" data-section-id="S3" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">From observation to interpretation</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>The Northbridge calculations are straightforward once the groups are correctly identified. The difficulty begins when we turn those numbers into statements about SSI.</p><p>An observation is something recorded or measured. For example, the initial evaluation recorded that 216 of the 240 flagged students who engaged with support were still enrolled at the preliminary reporting point. This statement describes a reported outcome for a defined group.</p><p>An association is a relationship observed between two characteristics or outcomes. In this case, engagement with support was associated with a higher preliminary enrolment rate among flagged students. The relationship is visible because the engaged and non-engaged groups had different recorded rates.</p><p>Association tells us that two things occurred together in a particular pattern. It does not, on its own, tell us why.</p><p>A causal interpretation makes a stronger claim. It proposes that one factor produced a change in another. Saying that support engagement caused more students to remain enrolled is therefore different from saying that students who engaged had a higher enrolment rate. The causal claim attributes the difference to the support conversation itself.</p><p>That interpretation may be plausible. A supportive conversation could help a student identify difficulties, access advice or decide to remain on their course. These are possible ways in which support might be beneficial. But a plausible mechanism is not proof that the mechanism produced the observed difference in this evaluation.</p><p>A further type of statement is an evaluative judgement or opinion. The preliminary summary described the difference as encouraging. This is an assessment of the finding&#39;s significance rather than another measurement. It is not automatically unreasonable: a university seeking to support students may regard a positive association as a reason to investigate further.</p><p>The judgement becomes problematic if &#39;encouraging&#39; is treated as interchangeable with &#39;proven effective&#39;. A finding can justify interest, cautious optimism or further investigation without establishing the causal explanation behind it.</p><p>Consider how the wording changes the claim. &#39;The engaged group had a 90% preliminary enrolment rate&#39; reports a finding. &#39;The engaged group had a higher rate than the non-engaged group&#39; identifies an association. &#39;Engagement caused the higher rate&#39; asserts causation. &#39;The difference is encouraging&#39; evaluates the significance of the association. Each statement performs different intellectual work, and the evidence needed to justify it differs accordingly.</p><p>It is also possible to overcorrect. If a causal claim is not established, it does not follow that the recorded difference is imaginary or irrelevant. The observations remain part of the evidence. The responsible response is to preserve what the comparison shows while being cautious about explanations that go beyond it.</p><p>This is a general principle of evidence literacy: the strength of a conclusion should match the strength of the evidence supporting that particular conclusion. We can be confident that the reported rates differ while being less confident about the reason for the difference.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-S3-01" data-material-kind="Comparison of evidential claims" data-material-type="expository_structured_table" data-section-id="S3" data-expository-structured="table"><h3>Four ways of describing the same finding</h3><p>Statements about the same figures can make different kinds of claims. The wording determines how much justification is needed.</p><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Type of statement</th><th scope="col">Example</th><th scope="col">What the evidence supports</th></tr></thead><tbody><tr><td>Observation</td><td>Of the 240 flagged students who engaged with support, 216 were still enrolled at the preliminary reporting point.</td><td>Directly supported by the reported count and denominator. It describes a recorded outcome for one group.</td></tr><tr><td>Association</td><td>Flagged students who engaged had a higher preliminary enrolment rate than flagged students who did not engage: 90% compared with 80%.</td><td>Directly supported by comparing the two reported rates. It establishes a relationship in the observed data, not its cause.</td></tr><tr><td>Causal interpretation</td><td>Support engagement caused the engaged group&#39;s preliminary enrolment rate to be 10 percentage points higher.</td><td>Not established by the comparison. This explanation would require a credible way to distinguish the effect of support from differences between the groups and other influences.</td></tr><tr><td>Evaluative judgement</td><td>The 10-percentage-point difference is encouraging and warrants further investigation.</td><td>A defensible assessment of the positive association, provided it remains provisional and does not claim that effectiveness has been demonstrated.</td></tr></tbody></table></div><p>The causal statement adds an explanation that the observed figures cannot verify. The evaluative statement instead considers the significance of the finding while leaving its cause open.</p></article></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c2--exposition-S4" data-section-id="S4" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Why might the groups differ?</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Why is the higher enrolment rate among engaged students not enough to demonstrate that engagement caused the difference?</p><p>The two groups were not formed through random assignment. Students were not randomly allocated to attend a support conversation or to avoid one. Instead, some flagged students engaged with the support offered and others did not. Their engagement may have been related to circumstances that also influenced whether they remained enrolled.</p><p>Imagine two hypothetical students who both receive an offer of support. One has time to attend a conversation, already feels connected to their course and is comfortable asking for help. The other is dealing with competing responsibilities, finds it difficult to arrange a meeting or is uncertain about whether university support will help. Their different responses to the offer might be connected to circumstances that also affect their ability to remain enrolled.</p><p>This example does not establish that students at Northbridge differed in these particular ways. It illustrates a possibility that the preliminary figures cannot rule out.</p><p>A selection effect occurs when the characteristics that influence whether people enter or participate in a group are also related to the outcome being studied. In the SSI comparison, students who attended a conversation may have differed from those who did not in motivation, circumstances or existing support networks. Such differences could contribute to the observed enrolment rates even if the conversations themselves had no effect.</p><p>Another possibility is that the conversations genuinely helped some students remain enrolled. A third possibility is that both processes operated: support had a beneficial effect, while pre-existing differences between the groups also influenced the outcome.</p><p>These explanations are not mutually exclusive. The preliminary evidence is compatible with more than one account of what happened.</p><p>The related idea of confounding describes a situation in which another factor is associated with both the characteristic being investigated and the outcome. If a student&#39;s circumstances influence both their likelihood of engaging with support and their likelihood of remaining enrolled, those circumstances complicate the interpretation of the relationship between engagement and enrolment.</p><p>The difficulty is not that the reported numbers are necessarily wrong. It is that the comparison does not isolate the effect of support from other possible influences.</p><p>To establish a causal effect, we would want to know what would have happened to the students if they had not engaged with support. This is the counterfactual question. We cannot observe the same student, under identical circumstances, both engaging and not engaging with the conversation. Evaluation therefore needs a credible basis for estimating what would otherwise have happened.</p><p>The initial Northbridge comparison does not provide that basis with sufficient confidence. The non-engaged students are a comparison group, but they are not automatically an equivalent substitute for what would have happened to the engaged students without support.</p><p>This does not mean that the intervention was ineffective. An alternative explanation is not a disproof. It identifies another credible account that must be considered before assigning a causal interpretation to the observed pattern.</p><p>For example, if someone argues that the 10-percentage-point difference proves the support conversations worked, you can respond by asking whether students who engaged may already have differed in ways relevant to enrolment. That question identifies a limitation without denying that support might have been helpful.</p><p>The strongest conclusion available from the preliminary comparison is therefore more restrained than either complete endorsement or complete rejection. Engagement and higher preliminary enrolment occurred together. Support may have contributed, but the comparison cannot establish how much of the difference, if any, was caused by engagement.</p></div><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material util-exposition-structured-fallback" data-material-id="XM-S4-01" data-material-kind="Conceptual diagram of competing explanations" data-material-type="expository_structured_fallback" data-section-id="S4" data-expository-structured="fallback" data-representation-spec-suppressed="section-figure"><h3>More than one possible route to the observed difference</h3></article></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--section-after-content" data-visual-slot="section-after-content" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-s4-competing-explanations-01-section-s4-section-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c2/section-after-content-vb-38-4-va-s4-competing-.png" alt="Conceptual diagram with three nodes: possible pre-existing student circumstances, support engagement and preliminary enrolment. Hypothetical arrows run from circumstances to engagement, circumstances to enrolment, and engagement to enrolment. A separate annotation records the observed 90% versus 80% association without asserting causation." aria-describedby="lj-c2--figure-description-asset-vb-38-4-va-s4-competing-explanations-01-section-s4-section-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption" id="lj-c2--figure-description-asset-vb-38-4-va-s4-competing-explanations-01-section-s4-section-after-content"><strong>Figure 2.</strong> Several possible influences could contribute to the association between support engagement and preliminary enrolment.</figcaption></figure></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c2--exposition-S5" data-section-id="S5" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">What the measures cannot tell us</span></h2><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation"><p>Even if we set aside the question of causation, there is another limit to what the preliminary evaluation can tell us. We must consider whether the measures actually represent the outcomes we are interested in.</p><p>SSI was introduced to help staff identify students who might benefit from timely academic support. A support flag is an indication of possible need, not confirmation that the student is struggling. The system uses available patterns of engagement and study activity, but those patterns do not provide a complete account of an individual&#39;s circumstances.</p><p>Similarly, a recorded personalised contact tells us that an offer of support was made. It does not establish whether the student welcomed the contact, understood the offer or benefited from it.</p><p>Support engagement is more specific: a student attended at least one support conversation. This provides evidence that a conversation occurred, but attendance is not the same as a measured improvement in academic confidence, wellbeing or educational experience.</p><p>The preliminary enrolment figures measure another distinct outcome. They report whether students were still enrolled at the preliminary reporting point. Remaining enrolled is relevant to the university&#39;s concern about student continuation, but it is not identical to final continuation into the next academic year. The reporting point matters because a student&#39;s status may change later.</p><p>Measurement validity concerns whether a measure adequately represents the concept we want to understand. Preliminary enrolment is a relevant indicator of whether students were still studying at that point. It is not, by itself, a complete measure of student success or the quality of the support received.</p><p>Consider the statement: &#39;The preliminary evaluation demonstrates that SSI improved students&#39; wellbeing.&#39; The reported enrolment figures cannot establish that claim. Wellbeing was not measured by those figures. Even if more students remained enrolled, we would still need suitable evidence about their wellbeing before making that conclusion.</p><p>The same reasoning applies to a claim that every student flagged by SSI needed support. The number of flags tells us how many students the system identified, not whether every identification accurately reflected an individual need.</p><p>Incomplete information creates further uncertainty. The preliminary summary does not tell us enough about the circumstances of the engaged and non-engaged groups to establish why their enrolment rates differed. It also does not provide a complete picture of the students&#39; experiences of support.</p><p>These are different limitations. Selection effects concern whether the comparison groups differ in ways that influence the outcome. Measurement limitations concern what the recorded information can legitimately represent. Both affect the strength of a conclusion, but they do so for different reasons.</p><p>Careful interpretation therefore requires two questions. First, does the evidence justify the proposed explanation for the observed difference? Second, does the measure itself capture the outcome being claimed? A conclusion may exceed the evidence on either ground.</p></div></section><section class="util-exposition-section" data-region-item="exposition-section" id="lj-c2--exposition-S6" data-section-id="S6" data-expository-section-role="terminal-close" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Making a judgement the evidence can support</span></h2><div class="util-exposition-materials" data-region="exposition-materials"><article class="util-material-block util-prose-measure util-exposition-material" data-material-id="XM-S6-01" data-material-kind="Evidence interpretation synthesis framework" data-material-type="expository_structured_table" data-section-id="S6" data-expository-structured="table"><h3>A proportionate reading of the preliminary evidence</h3><p>A balanced interpretation keeps the reported finding separate from explanations that still need testing.</p><div class="util-table-scroll util-exposition-table-scroll util-exposition-table-breakout"><table class="util-exposition-structured-table"><thead><tr><th scope="col">Question</th><th scope="col">Proportionate interpretation</th></tr></thead><tbody><tr><td>What the evidence shows</td><td>Among flagged students, 90% of those who engaged and 80% of those who did not engage were still enrolled at the preliminary reporting point. The observed difference was 10 percentage points.</td></tr><tr><td>What it does not establish</td><td>The comparison does not establish that support engagement caused the difference or that the preliminary outcome represents final continuation or wider educational benefit.</td></tr><tr><td>What else might explain the difference</td><td>Students who engaged may have differed in relevant circumstances from those who did not. Support may also have helped. These explanations could operate separately or together.</td></tr><tr><td>How confident can we be?</td><td>We can be confident about the arithmetic of the reported comparison while remaining less confident about its causal explanation. The positive association is encouraging but provisional.</td></tr></tbody></table></div><p>A justified conclusion preserves the observed association, identifies the limits of causal inference and matches confidence to what the evidence can support.</p></article></div><div class="util-exposition-explanation util-prose-measure" data-exposition-field="explanation" data-expository-closure="terminal"><p>The preliminary Northbridge evidence can now be interpreted with greater precision.</p><p>Suppose someone concludes: &#39;SSI support increased student enrolment by 10 percentage points.&#39; The statement uses the reported difference, but it attributes that difference to support. The evaluation has not established this causal explanation.</p><p>A more proportionate interpretation would be: &#39;Among students flagged by SSI, 90% of those who engaged with support and 80% of those who did not engage were still enrolled at the preliminary reporting point. The 10-percentage-point difference is encouraging, but it does not establish that support engagement caused the difference.&#39;</p><p>This revised statement retains the useful evidence. It identifies the groups, the measured outcome and the observed difference. It also makes the limit of the causal claim explicit.</p><p>Confidence can be considered separately for different parts of the interpretation. The arithmetic is clear: 216 out of 240 is 90%, and 208 out of 260 is 80%. We can have substantial confidence in the reported numerical comparison as an accurate description of the supplied preliminary figures.</p><p>Our confidence that engagement caused the difference should be more limited. Students were not randomly assigned to the two groups, and the available evidence does not establish whether differences in their circumstances influenced both engagement and enrolment. The figures also concern a preliminary reporting point rather than a final continuation outcome.</p><p>This is calibrated confidence: the degree of certainty attached to a claim reflects the evidence supporting that particular claim. It is possible to be confident about an observation and uncertain about its explanation without contradiction.</p><p>Two extreme interpretations illustrate the problem. Saying &#39;the figures prove SSI works&#39; treats an association as a demonstrated causal effect. Saying &#39;the figures tell us nothing&#39; dismisses an observed difference that may still be informative. Neither response accurately represents the preliminary evidence.</p><p>A defensible interpretation lies between them, although it does not prescribe a single judgement about what Northbridge should eventually do. The preliminary findings may reasonably support cautious optimism and further investigation. They do not establish how much benefit, if any, can be attributed specifically to support engagement.</p><p>When you consider your provisional judgement from The Promising Pilot, distinguish the reasons that relied on the reported observations from those that depended on an explanation for the difference. You may find that your overall judgement remains reasonable but that your confidence needs adjusting. Alternatively, you may decide that some of your earlier reasoning should be revised. The purpose is not to change your mind automatically; it is to make the reasoning behind your judgement more defensible.</p><p>The same approach will be useful in When the Evidence Changes. Additional findings may support, qualify or challenge an initial interpretation. Evaluating them requires more than deciding whether each new number looks positive or negative. It requires attention to comparison groups, measurement, alternative explanations and the strength of the conclusions drawn.</p><p>Reading evidence carefully means holding two ideas together: the preliminary association is real within the reported data, and its cause remains uncertain. You can preserve a finding&#39;s value without claiming that it proves more than it does. That is the foundation of evidence-informed judgement.</p></div></section></section></article></template><template id="lj-resource-c3"><article class="util-learner-page util-page util-learner-renderer-vnext" data-renderer="vnext" data-page-kind="interactive" data-persistence-page-key="v1::5709435c-6757-4d78-9226-160e83209ee7::learner-page::2.0.0::a1-a2-a3-a4::when-the-evidence-changes" data-persistence-storage-key="learner-renderer-vnext:draft:v1::5709435c-6757-4d78-9226-160e83209ee7::learner-page::2.0.0::a1-a2-a3-a4::when-the-evidence-changes" data-composition-mode="moments" data-composed-activity-count="4" data-beats-fallback-activity-count="0" role="region" aria-label="Learning resource"><div class="util-learner-draft-controls" data-learner-draft-controls="true"><p class="util-learner-draft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">When the Evidence Changes</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="6"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 6"><span class="util-journey-position__visible" aria-hidden="true">1 of 6</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c3--activity-A1" aria-label="Next section: Compare the Continuation Findings"><span class="util-journey-adjacent__title">Compare the Continuation Findings</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c3--journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#lj-c3--activity-A1">Compare the Continuation Findings</a></li><li><a class="util-journey-all-link" href="#lj-c3--activity-A2">Test the Strength of Evidence</a></li><li><a class="util-journey-all-link" href="#lj-c3--activity-A3">Reconcile the Emerging Tensions</a></li><li><a class="util-journey-all-link" href="#lj-c3--activity-A4">Reconsider Your Confidence</a></li><li><a class="util-journey-all-link" href="#lj-c3--journey-study-tips">Study tips</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c3/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="lj-c3--journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This self-study resource examines new evidence from Northbridge University&#39;s fictional Student Support Insight (SSI) pilot. Begin by comparing the preliminary and final evaluation records, then examine the limitations and experiences that complicate their interpretation. Use the later activities to reconcile competing readings and reconsider your provisional judgement. Allow approximately 20 minutes, and consult your earlier work from The Promising Pilot and Reading the Evidence Carefully where available.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The first part of the resource establishes a basis for comparing and appraising evidence. The second part uses that appraisal to support an integrated interpretation and a review of confidence. Complete your own reasoning before consulting the diagnostic review criteria.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><p>Evidence-informed judgement requires attention to what was measured, who was included, how observations were collected and which conclusions the evidence can support. New findings may strengthen, weaken or qualify an earlier interpretation without necessarily reversing it.</p><h3 class="util-md-heading util-md-heading--source-3">Observation, association and causation</h3><p>An observation describes a recorded finding. An association describes a relationship between observed characteristics or outcomes. A causal claim goes further: it proposes that one factor produced a change in another. An observed difference between students who engage with support and those who do not is not, by itself, evidence that engagement caused the difference. Students may have different circumstances, motivations or access to other forms of support.</p><p>A causal interpretation therefore requires consideration of alternative explanations and the design of the comparison. This does not make observational findings uninformative. It establishes a boundary around what they can demonstrate.</p><h3 class="util-md-heading util-md-heading--source-3">Populations, denominators and reporting points</h3><p>A percentage has meaning only in relation to its denominator: the population or group from which it was calculated. Before comparing rates, identify the people included in each group and whether the groups are sufficiently comparable for the proposed inference.</p><p>The reporting point and outcome definition matter too. Preliminary enrolment and continuation at a later evaluation cut-off are related but distinct measures. A difference between their reported values should not automatically be interpreted as an inconsistency or an intervention effect.</p><p>Historical comparisons require similar care. Even when two cohorts have the same number of students and use the same outcome definition, they may differ in characteristics, circumstances or concurrent support provision. A change between academic years cannot automatically be attributed to one initiative.</p><h3 class="util-md-heading util-md-heading--source-3">Evaluating different kinds of evidence</h3><p>Quantitative records can establish counts, rates and observed differences within their stated populations. Their interpretation depends on data quality, selection processes, measurement definitions and the availability of suitable comparisons.</p><p>Operational evidence addresses whether an initiative was delivered as intended, including whether identified students received contact, whether input records were complete and what staff resources were required. Delivery and implementation are relevant to interpreting an intervention, but an operational finding does not independently establish its educational effect.</p><p>Equity-related evidence requires attention to the difference between an observed group disparity and an explanation for that disparity. Different flag rates across groups may warrant investigation without independently demonstrating discrimination, predictive accuracy or the reason for the difference.</p><p>Selected samples also limit generalisation. A review of students recruited through a particular support route cannot automatically establish an overall missed-identification rate. Population-level accuracy estimates require appropriately defined and sufficiently representative evidence.</p><p>Qualitative accounts can reveal how students and staff experience an initiative, including benefits, misunderstandings and practical constraints that aggregate outcome measures may not capture. Individual accounts provide evidence of particular experiences, not their prevalence across the whole student population.</p><h3 class="util-md-heading util-md-heading--source-3">Reconciling findings and weighing evidence</h3><p>Apparently conflicting findings may arise because different records concern different populations, measures or reporting points. Other tensions are substantive: two observations may both be credible while leaving an important question unresolved.</p><p>A useful reconciliation begins by checking the source and scope of each finding. It then considers plausible explanations, asks which interpretations accommodate the available evidence and identifies what remains uncertain. A plausible explanation is not an established cause.</p><p>Evidence should be weighted according to the claim being assessed. A continuation record may be directly relevant to an outcome claim, while an operational record may be more informative about delivery and an individual account about lived experience. No single source answers every evaluative question.</p><h3 class="util-md-heading util-md-heading--source-3">Provisional judgement and calibrated confidence</h3><p>A provisional judgement is the interpretation currently considered most defensible. Confidence expresses how securely the available evidence supports that interpretation. The judgement and confidence can change independently.</p><p>Retaining an earlier position can be as reasonable as revising it, provided the reasoning engages with new evidence and its limitations. A well-calibrated conclusion identifies its strongest supporting observations, addresses consequential counterevidence and states what cannot yet be established.</p><p>The purpose at this stage is to develop a defensible interpretation of the evidence, not to make the institution&#39;s final decision.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c3/knowledge-summary-after-content.png" alt="Concept map connecting evidence types, interpretative checks, provisional judgement and confidence; detailed description follows." aria-describedby="lj-c3--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> How different evidence sources and inferential checks contribute to a provisional judgement and calibrated confidence.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c3--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">Three evidence categories contribute to interpretation: quantitative observations provide counts, rates and differences; operational evidence describes implementation, data quality and resources; individual accounts describe particular experiences. Interpretation is qualified by checks on populations, denominators, reporting points, outcome definitions, comparison equivalence, alternative explanations, selection and representativeness. The resulting interpretation informs a provisional judgement. Evidence strength and remaining uncertainty inform confidence, which is shown as distinct from the judgement itself. No case-specific conclusion is supplied.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Compare preliminary and final evaluation findings for Student Support Insight (SSI), identifying relevant differences in outcomes, populations, denominators and reporting points, and distinguishing observed associations from claims of causation. <span class="util-outcome-id">(LO1)</span></li><li>Evaluate the strength and limitations of quantitative and qualitative evidence about SSI, identifying plausible alternative explanations, operational and equity concerns, and conclusions that cannot be established from the available findings. <span class="util-outcome-id">(LO2)</span></li><li>Reconcile apparently conflicting findings by constructing a reasoned interpretation that distinguishes differences in measurement or population from substantive tensions, and explains how the combined evidence affects the strength of competing interpretations. <span class="util-outcome-id">(LO3)</span></li><li>Justify a revised, retained or more qualified provisional judgement about SSI, explaining which evidence carries the greatest weight and calibrating confidence in that judgement against the remaining uncertainty. <span class="util-outcome-id">(LO4)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="lj-c3--journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="lj-c3--activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Compare the Continuation Findings</h2><div class="util-badge-row"><span class="util-badge util-badge-time">4 min</span></div></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The enquiry begins with a provisional interpretation of encouraging early results. Comparing those results with later measurements establishes which observations remain consistent, which have changed, and what the different comparisons can legitimately support.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>If you completed The Promising Pilot, revisit your provisional judgement and confidence rating. Draw on your work in Reading the Evidence Carefully to distinguish observed differences from causal explanations. You will now examine later evidence about the same fictional Student Support Insight initiative and consider what it adds to your earlier interpretation.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Work from the recorded figures before interpreting their significance. Check the population, denominator, outcome definition and reporting point for each comparison. Keep a distinction between what was measured and what might explain it.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which comparison most affected your interpretation, and what feature of its population, measurement or reporting point explains its significance?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A1"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Examine the preliminary evaluation and final continuation records. Identify the population, denominator, measured outcome and reporting point for each relevant comparison.</p></span></div></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c3--learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="lj-c3--learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="lj-c3--learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c3--learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c3--learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="lj-c3--learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c3--learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Complete the comparison table, contrasting engagement-group findings at the two reporting points and the final flagged, unflagged and historical cohort findings.</p></span></div><article class="util-material-block util-material-table-block" data-material-id="A1-M1" data-material-type="data_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Initial Evaluation Summary: March 2026</span></p><h3 class="util-md-heading util-md-heading--source-2">Initial Evaluation Summary</h3><p>Source: Northbridge University, NB-SSI-01, 12 March 2026. Northbridge University and Student Support Insight (SSI) are fictional.</p><p>This preliminary institutional summary uses first-semester and early second-semester indicators. The outcome reported here is whether students were still enrolled at the preliminary reporting point. It is not the final continuation outcome.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Population or measure</th><th>Count</th><th>Denominator</th><th>Rate</th><th>Reporting point</th></tr></thead><tbody><tr><td>Students flagged by SSI</td><td>500</td><td>2,000 first-year students</td><td>25.0%</td><td>12 March 2026 summary</td></tr><tr><td>Flagged students receiving recorded personalised support contact</td><td>400</td><td>500 flagged students</td><td>80.0%</td><td>12 March 2026 summary</td></tr><tr><td>Flagged students engaging in at least one support conversation</td><td>240</td><td>500 flagged students</td><td>48.0%</td><td>12 March 2026 summary</td></tr><tr><td>Engaged flagged students still enrolled</td><td>216</td><td>240 engaged students</td><td>90.0%</td><td>Preliminary enrolment, March 2026</td></tr><tr><td>Non-engaged flagged students still enrolled</td><td>208</td><td>260 non-engaged students</td><td>80.0%</td><td>Preliminary enrolment, March 2026</td></tr></tbody></table></div><p>Source note: The ten-percentage-point difference between the two preliminary enrolment rates was described as encouraging. The summary recommended continuing the pilot while collecting more evidence. It also stated that the difference does not establish that support engagement caused improved enrolment.</p><p>For your comparison, retain the distinction between receiving contact, engaging with support and remaining enrolled. These are different measures.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain which observations support the earlier positive interpretation and which introduce additional questions. Distinguish the reported associations from claims about SSI&#39;s causal effect.</p></span></div><article class="util-material-block util-material-table-block" data-material-id="A1-M2" data-material-type="data_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Final Continuation Data: June 2026</span></p><h3 class="util-md-heading util-md-heading--source-2">Final Continuation Data</h3><p>Source: Northbridge University, NB-SSI-02, 5 June 2026. Evaluation cut-off: 31 May 2026.</p><p>Continuation means remaining enrolled or formally progressing to the next academic year at the evaluation cut-off.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Population</th><th>Students continuing</th><th>Denominator</th><th>Continuation rate</th><th>Reporting point</th></tr></thead><tbody><tr><td>Flagged and engaged</td><td>211</td><td>240</td><td>87.9%</td><td>31 May 2026 cut-off</td></tr><tr><td>Flagged and did not engage</td><td>205</td><td>260</td><td>78.8%</td><td>31 May 2026 cut-off</td></tr><tr><td>All flagged</td><td>416</td><td>500</td><td>83.2%</td><td>31 May 2026 cut-off</td></tr><tr><td>Not flagged</td><td>1,365</td><td>1,500</td><td>91.0%</td><td>31 May 2026 cut-off</td></tr><tr><td>All first-year students, 2025/26</td><td>1,781</td><td>2,000</td><td>89.1% rounded</td><td>31 May 2026 cut-off</td></tr><tr><td>Historical first-year cohort, 2024/25</td><td>1,720</td><td>2,000</td><td>86.0%</td><td>Previous academic year, same continuation definition</td></tr></tbody></table></div><p>The reported difference between the rounded overall rates is 3.1 percentage points.</p><p>Source cautions: The cohorts were not randomly assigned. Other institutional changes occurred between years. The historical cohort is not a randomised control group. The observed difference does not establish how much, if any, of the improvement was caused by SSI.</p><p>Use these figures alongside the March record. Do not assume that preliminary enrolment and final continuation are interchangeable outcomes.</p></article><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a1-comparison-01-activity-a1-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c3/activity-a1-materials-entry.png" alt="Framework aligning engagement groups across preliminary and final reporting points; detailed description follows." aria-describedby="lj-c3--figure-description-asset-vb-38-4-va-a1-comparison-01-activity-a1-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 2.</strong> Identify reporting points and comparison groups before interpreting the figures.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c3--figure-description-asset-vb-38-4-va-a1-comparison-01-activity-a1-materials-entry">The framework distinguishes March preliminary enrolment from continuation at the 31 May evaluation cut-off. At each reporting point, two parallel categories identify flagged students who engaged with support and flagged students who did not. The final record also contains broader flagged, unflagged and cohort comparisons, shown separately from the engagement categories. The figure supplies no outcome rates or conclusions. It directs attention to which population and outcome definition belongs to each comparison.</p></figure><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a1-a1-m3" data-material-source-id="A1-M3" data-activity-id="A1"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A1-M3" data-material-type="comparison_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" widt
