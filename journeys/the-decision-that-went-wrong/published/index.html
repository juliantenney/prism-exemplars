rner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c3--a3-a3-m2-input-r0-c4" name="a3-a3-m2-input-r0-c4" data-learner-cell="a3-a3-m2-input-r0-c4" rows="3" aria-label="Response field, row 1, column Remaining uncertainty" autocomplete="off"></textarea></div></td></tr><tr><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c3--a3-a3-m2-input-r1-c0" name="a3-a3-m2-input-r1-c0" data-learner-cell="a3-a3-m2-input-r1-c0" rows="3" aria-label="Response field, row 2, column Findings in tension" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c3--a3-a3-m2-input-r1-c1" name="a3-a3-m2-input-r1-c1" data-learner-cell="a3-a3-m2-input-r1-c1" rows="3" aria-label="Response field, row 2, column Relevant source details" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c3--a3-a3-m2-input-r1-c2" name="a3-a3-m2-input-r1-c2" data-learner-cell="a3-a3-m2-input-r1-c2" rows="3" aria-label="Response field, row 2, column Apparent contradiction or substantive tension" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c3--a3-a3-m2-input-r1-c3" name="a3-a3-m2-input-r1-c3" data-learner-cell="a3-a3-m2-input-r1-c3" rows="3" aria-label="Response field, row 2, column Plausible explanation" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c3--a3-a3-m2-input-r1-c4" name="a3-a3-m2-input-r1-c4" data-learner-cell="a3-a3-m2-input-r1-c4" rows="3" aria-label="Response field, row 2, column Remaining uncertainty" autocomplete="off"></textarea></div></td></tr><tr><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c3--a3-a3-m2-input-r2-c0" name="a3-a3-m2-input-r2-c0" data-learner-cell="a3-a3-m2-input-r2-c0" rows="3" aria-label="Response field, row 3, column Findings in tension" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c3--a3-a3-m2-input-r2-c1" name="a3-a3-m2-input-r2-c1" data-learner-cell="a3-a3-m2-input-r2-c1" rows="3" aria-label="Response field, row 3, column Relevant source details" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c3--a3-a3-m2-input-r2-c2" name="a3-a3-m2-input-r2-c2" data-learner-cell="a3-a3-m2-input-r2-c2" rows="3" aria-label="Response field, row 3, column Apparent contradiction or substantive tension" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c3--a3-a3-m2-input-r2-c3" name="a3-a3-m2-input-r2-c3" data-learner-cell="a3-a3-m2-input-r2-c3" rows="3" aria-label="Response field, row 3, column Plausible explanation" autocomplete="off"></textarea></div></td><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class="util-learner-table-workspace__input" id="lj-c3--a3-a3-m2-input-r2-c4" name="a3-a3-m2-input-r2-c4" data-learner-cell="a3-a3-m2-input-r2-c4" rows="3" aria-label="Response field, row 3, column Remaining uncertainty" autocomplete="off"></textarea></div></td></tr></tbody></table></div></article></div><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>For each, explain whether the findings can coexist because of different measurements, populations or purposes, or whether a meaningful unresolved tension remains. Identify a plausible explanation where the evidence permits one.</p></span></div><article class="util-prompt-set util-prose-measure" data-material-id="A3-M3" data-material-type="prompt_set" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-prompt-set-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"></path></svg></span><span class="util-semantic-icon__label">Synthesize the Competing Interpretations</span></p><p>Write approximately 100–150 words comparing at least two plausible interpretations of the combined evidence.</p><p>Use details from more than one record. Explain which findings each interpretation can accommodate, which findings qualify it and why some evidence deserves greater weight for a particular claim. Distinguish an apparent contradiction caused by different measures or populations from a substantive uncertainty that remains unresolved.</p><p>Your synthesis:</p><p>[Write 100–150 words here.]</p><p>End by identifying what the combined evidence supports and what it cannot yet establish. Do not turn this synthesis into a final institutional recommendation.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Construct a short synthesis that weighs at least two competing interpretations of SSI&#39;s results, explaining what the combined evidence supports and what it leaves unresolved.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A3-M1" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Evidence Pairings and Competing Interpretations</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-2">Evidence for reconciliation</h3><p>Use the following source pairings to examine apparent contradictions and unresolved tensions. The figures and accounts come from the fictional Northbridge records. The candidate interpretations below are instructional propositions for you to test; they are not statements made by the institution.</p><h3 class="util-md-heading util-md-heading--source-3">Pairing 1: Different reporting points</h3><table><thead><tr><th>Source</th><th>Population</th><th>Recorded outcome</th><th>Reporting point</th></tr></thead><tbody><tr><td>NB-SSI-01</td><td>Flagged and engaged: 240 students</td><td>216 still enrolled (90.0%)</td><td>Preliminary enrolment, March 2026</td></tr><tr><td>NB-SSI-01</td><td>Flagged and did not engage: 260 students</td><td>208 still enrolled (80.0%)</td><td>Preliminary enrolment, March 2026</td></tr><tr><td>NB-SSI-02</td><td>Flagged and engaged: 240 students</td><td>211 continued (87.9%)</td><td>31 May 2026 cut-off</td></tr><tr><td>NB-SSI-02</td><td>Flagged and did not engage: 260 students</td><td>205 continued (78.8%)</td><td>31 May 2026 cut-off</td></tr></tbody></table><p>The March figures measure preliminary enrolment. The May figures measure continuation at the final evaluation cut-off.</p><h3 class="util-md-heading util-md-heading--source-3">Pairing 2: Overall continuation and concurrent change</h3><table><thead><tr><th>Source</th><th>Recorded detail</th></tr></thead><tbody><tr><td>NB-SSI-02</td><td>2025/26: 1,781 of 2,000 students continued (89.1% rounded).</td></tr><tr><td>NB-SSI-02</td><td>2024/25: 1,720 of 2,000 students continued (86.0%).</td></tr><tr><td>NB-SSI-02</td><td>The reported difference using rounded rates is 3.1 percentage points.</td></tr><tr><td>NB-SSI-03</td><td>The previous cohort is not an equivalent control group.</td></tr><tr><td>NB-SSI-03</td><td>An expanded first-year academic adviser scheme was also introduced in September 2025.</td></tr></tbody></table><h3 class="util-md-heading util-md-heading--source-3">Pairing 3: Individual experiences and operational records</h3><p>From NB-SSI-05, 11 June 2026:</p><p>Samira Khan:</p><p>&gt; I was falling behind and didn&#39;t know who to ask. The message from my tutor made it easier to start a conversation. I probably wouldn&#39;t have contacted anyone myself.</p><p>Daniel Reed:</p><p>&gt; I was told my engagement suggested I might be struggling, but I was working offline and keeping up. I felt as though the university had already made up its mind about me.</p><p>Bethan Hughes:</p><p>&gt; I missed deadlines because things were difficult at home. Nobody contacted me through the new system. I found help later through my course administrator.</p><p>From NB-SSI-04, 10 June 2026:</p><ul><li>100 of 500 flagged students had no recorded personalised support contact.</li><li>A selected review of 100 students who sought support through conventional routes found 30 who had not been flagged.</li><li>The selected review was not representative of all unflagged students, and the operational review could not establish overall false-positive or false-negative rates.</li></ul><h3 class="util-md-heading util-md-heading--source-3">Candidate interpretations to test</h3><p>These propositions deliberately offer competing readings of the evidence. Neither is endorsed.</p><ul><li>Candidate interpretation A: The continuation findings and accounts of helpful outreach provide grounds for considering SSI potentially beneficial, even though its specific contribution remains uncertain.</li><li>Candidate interpretation B: The methodological limitations, operational gaps and differing student experiences substantially constrain how confidently SSI&#39;s apparent benefits can be interpreted.</li></ul><p>For each interpretation, identify the evidence it accommodates, the evidence it does not adequately explain and the uncertainty that remains. You may develop a third interpretation if the combined records justify it.</p></article></li></ol></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A concise, source-grounded reconciliation of at least two tensions, distinguishing differences in measurement or population from unresolved substantive concerns. The synthesis compares competing interpretations, uses evidence from multiple records, identifies plausible explanations without presenting them as proven, and states the limits of what the combined findings establish.</p></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a3-a3-task-step-step-4-4" data-response-part-id="A3-task-step-step-4-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c3--learner-workspace-a3-a3-task-step-step-4-4-label" for="lj-c3--learner-workspace-a3-a3-task-step-step-4-4">Your response</label><p class="util-learner-workspace__prompt" id="lj-c3--learner-workspace-a3-a3-task-step-step-4-4-desc">Construct a short synthesis that weighs at least two competing interpretations of SSI&#39;s results, explaining what the combined evidence supports and what it leaves unresolved.</p><textarea class="util-learner-workspace__input" id="lj-c3--learner-workspace-a3-a3-task-step-step-4-4" name="learner-workspace-a3-a3-task-step-step-4-4" rows="6" aria-describedby="lj-c3--learner-workspace-a3-a3-task-step-step-4-4-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c3--learner-check-a3" data-check-sidebar-open aria-controls="lj-c3--learner-check-a3" aria-expanded="false" aria-label="Check your work: Reconcile the Emerging Tensions">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c3--learner-check-a3" data-composition-moment="check" data-activity-id="A3" data-check-sidebar="available" aria-labelledby="lj-c3--learner-check-a3-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c3--learner-check-a3-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c3--learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c3--learner-task-a3">Back to your task (Reconcile the Emerging Tensions)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M4" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m4" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m4-c-0" data-revision-criterion-id="a3-m4-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you used findings from multiple records faithfully?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A reconciliation needs to explain the relationship between actual observations rather than between simplified or misremembered claims.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each tension identifies at least two relevant source findings.</li><li><span class="util-guided-review__feature-key">B.</span> The cited counts, rates or accounts remain consistent with their source records.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Add the second source and its specific observation before explaining how the findings relate.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Check the cited detail against the corresponding evidence pairing and correct any changed figure or attribution.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c3--checklist-a3-a3-m4-item-0" data-checklist-item-id="checklist-a3-a3-m4-item-0"><label class="util-interactive-checklist__label" for="lj-c3--checklist-a3-a3-m4-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c3--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m4-c-1" data-revision-criterion-id="a3-m4-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you distinguished different populations and reporting points?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Findings may appear inconsistent simply because they measure different outcomes or concern different groups.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The March and May measurements retain their distinct outcome definitions.</li><li><span class="util-guided-review__feature-key">B.</span> Your comparison specifies whether the relevant students were flagged, unflagged, engaged or non-engaged.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify preliminary enrolment and final continuation separately before comparing their rates.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name the population for each finding and reconsider any inference that assumes the groups are equivalent.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c3--checklist-a3-a3-m4-item-1" data-checklist-item-id="checklist-a3-a3-m4-item-1"><label class="util-interactive-checklist__label" for="lj-c3--checklist-a3-a3-m4-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c3--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m4-c-2" data-revision-criterion-id="a3-m4-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you distinguished plausible explanations from established conclusions?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An explanation may reconcile findings conceptually without being demonstrated by the available evidence.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each proposed explanation is connected to the findings it might account for.</li><li><span class="util-guided-review__feature-key">B.</span> Unverified causal explanations remain qualified.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State which particular observations the explanation addresses and why it is relevant.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Replace a definitive causal statement with a conditional explanation and identify what further evidence would be needed.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c3--checklist-a3-a3-m4-item-2" data-checklist-item-id="checklist-a3-a3-m4-item-2"><label class="util-interactive-checklist__label" for="lj-c3--checklist-a3-a3-m4-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c3--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m4-c-3" data-revision-criterion-id="a3-m4-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you weighed competing interpretations and retained meaningful uncertainty?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A synthesis should explain the relative strength of different readings rather than merely presenting them side by side.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> At least two interpretations are compared using shared evidence.</li><li><span class="util-guided-review__feature-key">B.</span> Your synthesis distinguishes a reconcilable difference from an unresolved substantive concern.</li><li><span class="util-guided-review__feature-key">C.</span> The conclusion identifies the limits of the combined evidence.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Evaluate both interpretations against one or more of the same findings, identifying where their explanatory reach differs.</li><li><span class="util-guided-review__feature-key">Missing B:</span> For each tension, state whether the apparent inconsistency depends on measurement or population differences, or on a question the evidence cannot answer.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Name the consequential inference that remains unsupported and connect it to a documented limitation.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c3--checklist-a3-a3-m4-item-3" data-checklist-item-id="checklist-a3-a3-m4-item-3"><label class="util-interactive-checklist__label" for="lj-c3--checklist-a3-a3-m4-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c3--learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m4-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c3--activity-A4" data-journey-section="true" data-activity-id="A4" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Reconsider Your Confidence</h2><div class="util-badge-row"><span class="util-badge util-badge-time">5 min</span></div></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A4"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your synthesis brought together observed outcomes, methodological limits, operational concerns and individual experiences. You can now use that integrated interpretation to test your earlier judgement, explain the evidence that confirms or challenges it, and communicate a defensible level of confidence to another audience.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Return to your provisional view of SSI. The purpose is not to reward changing your mind, but to judge whether your position and confidence remain proportionate to the evidence now available.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Separate the direction of your judgement from your confidence in it. An unchanged position can be more qualified; a revised position can still be uncertain. Give the strongest evidence and its limitations more weight than the number of points on either side.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">What did you initially think? Which evidence most challenged or confirmed that view? What do you now conclude, why, and how confident are you? Which uncertainty would matter most when this judgement is considered further?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A4"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--definition" data-composition-role="definition"><article class="util-material-block util-prose-measure" data-material-id="A4-M3" data-material-type="text" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg></span><span class="util-semantic-icon__label">Judgement and Confidence Are Different</span></p><p>A provisional judgement describes the interpretation you currently find most defensible. Confidence describes how securely the available evidence supports that interpretation.</p><p>The two can change independently. You might retain a judgement while becoming less confident in its explanation. You might revise a judgement while remaining uncertain. You might also become more confident about a narrow observation without becoming more confident about a broader causal claim.</p><p>When reviewing your position, distinguish what was directly measured from what remains an explanation. Consider the strength of the comparisons, the quality and coverage of the evidence, plausible alternatives and the consequences of unresolved questions. Give reasons for the weight you place on particular findings rather than counting how many appear favourable or unfavourable.</p><p>A justified confidence assessment explains both what the evidence supports and where that support ends.</p></article></div><div class="util-composition-learn-item util-composition-learn-item--example" data-composition-role="example"><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A4-M4" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated Draft Campus Update</span></p><h3 class="util-md-heading util-md-heading--source-2">Simulated student-facing communication</h3><p>The following is an invented, unverified draft claim created for this learning activity. It is not an authentic Northbridge University statement or an additional institutional evidence record.</p><p>Intended audience: Northbridge students.</p><p>Draft campus update:</p><p>&gt; Student Support Insight has been shown to cause Northbridge&#39;s improved continuation rate, and its flags reliably identify which students need help.</p><p>Review the exact claim against the records you have examined. Your task is to prepare a more appropriately qualified response for its intended audience.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c3--learner-task-a4" data-composition-moment="do" data-activity-id="A4" aria-labelledby="lj-c3--learner-task-a4-heading"><h3 class="util-composition-moment-heading" id="lj-c3--learner-task-a4-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c3--learner-revision-reminder-a4" hidden data-revision-reminder="true" data-activity-id="A4" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c3--learner-revision-guidance-a4" hidden data-revision-guidance="true" data-activity-id="A4" aria-labelledby="lj-c3--learner-revision-guidance-a4-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c3--learner-revision-guidance-a4-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Revisit the provisional judgement and confidence you recorded in The Promising Pilot, if available. Identify your starting position and the reasons that supported it.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M2" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Provisional Judgement and Confidence Review</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Using the newly examined evidence, identify the findings that most challenge or confirm your starting position. Explain their relative weight.</p></span></div><article class="util-prompt-set util-prose-measure" data-material-id="A4-M6" data-material-type="prompt_set" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-prompt-set-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"></path></svg></span><span class="util-semantic-icon__label">Your Student-Facing Response</span></p><p>Write your 50–80-word replacement for the simulated draft campus update here.</p><p>Your student-facing statement:</p><p>[Write your response here.]</p><p>Before finishing, check that the statement does not present an observed difference as proof of causation, claim an unmeasured level of identification accuracy, invent new findings or announce an institutional decision.</p><h3 class="util-md-heading util-md-heading--source-3">Page learner-resource closure</h3><ul><li>Revisit the sequence from preliminary enrolment to final continuation: the reporting point, population and outcome definition determine what a comparison can support.</li><li>Weigh methodological limitations, operational records, equity observations and individual testimony together, while respecting the different questions each source can answer.</li><li>Distinguish a change in provisional judgement from a change in confidence. Explain both using evidence, alternative interpretations and unresolved uncertainty.</li><li>When communicating findings to another audience, preserve supported observations and qualify claims that go beyond the evidence.</li></ul></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>State whether your provisional judgement has changed, remained or become more qualified. Record your current confidence and justify it by distinguishing established observations from unresolved causal and operational questions.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A4-M1" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Evidence Reference for Your Provisional Judgement</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-2">Northbridge evidence reference</h3><p>This reference brings together the records already examined. Northbridge University and SSI are fictional. It does not replace the provisional judgement you made in The Promising Pilot.</p><h3 class="util-md-heading util-md-heading--source-3">Outcomes</h3><table><thead><tr><th>Source</th><th>Population and outcome</th><th>Recorded result</th></tr></thead><tbody><tr><td>NB-SSI-01, 12 March 2026</td><td>Engaged flagged students still enrolled at the preliminary reporting point</td><td>216 of 240 (90.0%)</td></tr><tr><td>NB-SSI-01, 12 March 2026</td><td>Non-engaged flagged students still enrolled at the preliminary reporting point</td><td>208 of 260 (80.0%)</td></tr><tr><td>NB-SSI-02, 5 June 2026</td><td>Engaged flagged students continuing at 31 May</td><td>211 of 240 (87.9%)</td></tr><tr><td>NB-SSI-02, 5 June 2026</td><td>Non-engaged flagged students continuing at 31 May</td><td>205 of 260 (78.8%)</td></tr><tr><td>NB-SSI-02, 5 June 2026</td><td>All flagged students continuing</td><td>416 of 500 (83.2%)</td></tr><tr><td>NB-SSI-02, 5 June 2026</td><td>Unflagged students continuing</td><td>1,365 of 1,500 (91.0%)</td></tr><tr><td>NB-SSI-02, 5 June 2026</td><td>All first-year students continuing in 2025/26</td><td>1,781 of 2,000 (89.1% rounded)</td></tr><tr><td>NB-SSI-02, 5 June 2026</td><td>Historical first-year students continuing in 2024/25</td><td>1,720 of 2,000 (86.0%)</td></tr></tbody></table><p>The recorded difference between rounded overall continuation rates is 3.1 percentage points.</p><h3 class="util-md-heading util-md-heading--source-3">Methodological cautions</h3><p>NB-SSI-01 cautions that the preliminary engagement difference does not establish causation. NB-SSI-02 states that the cohorts were not randomly assigned and that other institutional changes occurred between years.</p><p>NB-SSI-03, 8 June 2026, records potential selection effects among students engaging with support, non-equivalence of the historical cohort, an expanded first-year academic adviser scheme introduced in September 2025, incomplete attendance records, limits of continuation as a measure of student experience, and an unresolved comparison with an equally resourced non-AI approach.</p><h3 class="util-md-heading util-md-heading--source-3">Operational and equity observations</h3><p>From NB-SSI-04, 10 June 2026:</p><table><thead><tr><th>Recorded measure</th><th>Result</th></tr></thead><tbody><tr><td>Students registered with a disability who were flagged</td><td>105 of 300 (35.0%)</td></tr><tr><td>Students not registered with a disability who were flagged</td><td>395 of 1,700 (23.2%)</td></tr><tr><td>Total students flagged</td><td>500 of 2,000 (25.0%)</td></tr><tr><td>Flagged students without recorded personalised support contact</td><td>100 of 500</td></tr><tr><td>Flagged cases potentially affected by incomplete attendance information</td><td>40</td></tr><tr><td>Unflagged students in a selected review of conventional support seekers</td><td>30 of 100 reviewed</td></tr><tr><td>Additional staff time reviewing flags at the busiest period</td><td>Approximately 25 hours per week</td></tr></tbody></table><p>The disability-registration categories were exhaustive and mutually exclusive at the cut-off. The flag-rate difference alone does not establish discrimination or unequal prediction accuracy. The conventional-support review was selected rather than representative. Overall false-positive and false-negative rates could not be established.</p><h3 class="util-md-heading util-md-heading--source-3">Selected individual accounts</h3><p>From NB-SSI-05, 11 June 2026. These are fictional individual accounts, not representative survey findings.</p><p>Samira Khan:</p><p>&gt; I was falling behind and didn&#39;t know who to ask. The message from my tutor made it easier to start a conversation. I probably wouldn&#39;t have contacted anyone myself.</p><p>Daniel Reed:</p><p>&gt; I was told my engagement suggested I might be struggling, but I was working offline and keeping up. I felt as though the university had already made up its mind about me.</p><p>Bethan Hughes:</p><p>&gt; I missed deadlines because things were difficult at home. Nobody contacted me through the new system. I found help later through my course administrator.</p><p>Tom Ellis:</p><p>&gt; Some students have benefited from earlier contact, but the flags aren&#39;t always straightforward. Staff need time to check the context, and that has an impact on other support work.</p><p>Use this reference to select and weigh evidence. It does not prescribe a conclusion.</p></article></li></ol></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Apply the same evidence-appraisal principles to a short public-facing claim about SSI. Draft a brief, appropriately qualified response for a student audience that corrects any overstatement without making a final institutional recommendation.</p></span></div><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A concise evidence-based judgement review recording the earlier position, the findings that challenged or confirmed it, the current provisional interpretation and a justified confidence assessment. The response must weigh evidence rather than merely list it, acknowledge consequential uncertainty and explain any change or continuity in reasoning. A separate brief student-facing response must apply the same standards to a different communication purpose, accurately qualifying the supplied claim without inventing findings or recommending a final institutional course of action.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m2-section-my-earlier-provisional-judgement-1" data-response-part-id="A4-template-section-a4-m2-section-my-earlier-provisional-judgement-1"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-earlier-provisional-judgement-1-label" for="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-earlier-provisional-judgement-1">My earlier provisional judgement</label><p class="util-learner-workspace__prompt" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-earlier-provisional-judgement-1-desc">[Enter your original position, if available. Do not reconstruct it as though it were recorded if you no longer have it.]</p><textarea class="util-learner-workspace__input" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-earlier-provisional-judgement-1" name="learner-workspace-a4-a4-template-section-a4-m2-section-my-earlier-provisional-judgement-1" rows="5" aria-describedby="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-earlier-provisional-judgement-1-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="2" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m2-section-my-earlier-confidence-2" data-response-part-id="A4-template-section-a4-m2-section-my-earlier-confidence-2"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-earlier-confidence-2-label" for="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-earlier-confidence-2">My earlier confidence</label><p class="util-learner-workspace__prompt" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-earlier-confidence-2-desc">[Enter your original confidence rating or description, if available.]</p><textarea class="util-learner-workspace__input" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-earlier-confidence-2" name="learner-workspace-a4-a4-template-section-a4-m2-section-my-earlier-confidence-2" rows="6" aria-describedby="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-earlier-confidence-2-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="3" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m2-section-evidence-that-challenged-or-confirmed-my-view-3" data-response-part-id="A4-template-section-a4-m2-section-evidence-that-challenged-or-confirmed-my-view-3"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-evidence-that-challenged-or-confirmed-my-view-3-label" for="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-evidence-that-challenged-or-confirmed-my-view-3">Evidence that challenged or confirmed my view</label><p class="util-learner-workspace__prompt" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-evidence-that-challenged-or-confirmed-my-view-3-desc">[Identify at least two findings from the records. Explain how each bears on your earlier reasoning and why one may carry more weight for the claim being considered.]</p><textarea class="util-learner-workspace__input" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-evidence-that-challenged-or-confirmed-my-view-3" name="learner-workspace-a4-a4-template-section-a4-m2-section-evidence-that-challenged-or-confirmed-my-view-3" rows="6" aria-describedby="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-evidence-that-challenged-or-confirmed-my-view-3-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m2-section-my-current-provisional-judgement-4" data-response-part-id="A4-template-section-a4-m2-section-my-current-provisional-judgement-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-current-provisional-judgement-4-label" for="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-current-provisional-judgement-4">My current provisional judgement</label><p class="util-learner-workspace__prompt" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-current-provisional-judgement-4-desc">[State whether your position has changed, remained or become more qualified. Give a provisional interpretation of SSI&#39;s possible benefit and limitations, not a final institutional recommendation.]</p><textarea class="util-learner-workspace__input" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-current-provisional-judgement-4" name="learner-workspace-a4-a4-template-section-a4-m2-section-my-current-provisional-judgement-4" rows="5" aria-describedby="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-current-provisional-judgement-4-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="5" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m2-section-my-current-confidence-5" data-response-part-id="A4-template-section-a4-m2-section-my-current-confidence-5"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-current-confidence-5-label" for="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-current-confidence-5">My current confidence</label><p class="util-learner-workspace__prompt" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-current-confidence-5-desc">[State your confidence using a clear rating or description.]</p><textarea class="util-learner-workspace__input" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-current-confidence-5" name="learner-workspace-a4-a4-template-section-a4-m2-section-my-current-confidence-5" rows="6" aria-describedby="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-my-current-confidence-5-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="6" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m2-section-why-this-confidence-is-justified-6" data-response-part-id="A4-template-section-a4-m2-section-why-this-confidence-is-justified-6"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-why-this-confidence-is-justified-6-label" for="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-why-this-confidence-is-justified-6">Why this confidence is justified</label><p class="util-learner-workspace__prompt" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-why-this-confidence-is-justified-6-desc">[Weigh the observed outcomes against relevant alternative explanations, measurement limits, operational gaps and individual experiences. Explain why the evidence warrants this level of confidence rather than a stronger or weaker one.]</p><textarea class="util-learner-workspace__input" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-why-this-confidence-is-justified-6" name="learner-workspace-a4-a4-template-section-a4-m2-section-why-this-confidence-is-justified-6" rows="6" aria-describedby="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-why-this-confidence-is-justified-6-desc"></textarea></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="7" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m2-section-most-consequential-remaining-uncertainty-7" data-response-part-id="A4-template-section-a4-m2-section-most-consequential-remaining-uncertainty-7"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-most-consequential-remaining-uncertainty-7-label" for="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-most-consequential-remaining-uncertainty-7">Most consequential remaining uncertainty</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-most-consequential-remaining-uncertainty-7-desc"><p>[Identify the unresolved question that matters most to your current interpretation and explain why it matters.]</p><p>Your current position need not differ from your earlier one. What matters is whether the reasoning and confidence are proportionate to the available evidence.</p></div><textarea class="util-learner-workspace__input" id="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-most-consequential-remaining-uncertainty-7" name="learner-workspace-a4-a4-template-section-a4-m2-section-most-consequential-remaining-uncertainty-7" rows="6" aria-describedby="lj-c3--learner-workspace-a4-a4-template-section-a4-m2-section-most-consequential-remaining-uncertainty-7-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c3--learner-check-a4" data-check-sidebar-open aria-controls="lj-c3--learner-check-a4" aria-expanded="false" aria-label="Check your work: Reconsider Your Confidence">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c3--learner-check-a4" data-composition-moment="check" data-activity-id="A4" data-check-sidebar="available" aria-labelledby="lj-c3--learner-check-a4-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c3--learner-check-a4-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c3--learner-check-a4-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c3--learner-task-a4">Back to your task (Reconsider Your Confidence)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A4-M7" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a4-a4-m7" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a4-m7-c-0" data-revision-criterion-id="a4-m7-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you explained the relationship between your earlier and current reasoning?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A judgement review should reveal how evidence affected your interpretation, not merely record two positions.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your earlier position and confidence are recorded accurately where available.</li><li><span class="util-guided-review__feature-key">B.</span> Your current position states whether the earlier interpretation was retained, revised or qualified.</li><li><span class="util-guided-review__feature-key">C.</span> The reasoning explains why the current interpretation is defensible.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Use your original response if you have it; otherwise identify the missing earlier record rather than inventing a previous judgement.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Describe the direction of any change and connect it to a particular finding or limitation.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Link your provisional position to the source observations and qualifications that most directly bear on it.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c3--checklist-a4-a4-m7-item-0" data-checklist-item-id="checklist-a4-a4-m7-item-0"><label class="util-interactive-checklist__label" for="lj-c3--checklist-a4-a4-m7-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c3--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m7-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a4-m7-c-1" data-revision-criterion-id="a4-m7-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you selected and weighed evidence rather than simply listing findings?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The persuasiveness of a judgement depends on the relevance and strength of the evidence, not the number of observations cited.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> At least two source-specific findings are used to challenge or confirm the earlier view.</li><li><span class="util-guided-review__feature-key">B.</span> Your review explains the relative importance of the selected findings.</li><li><span class="util-guided-review__feature-key">C.</span> Contrary or qualifying evidence is addressed rather than omitted.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify two concrete findings and explain how each affects the claim under consideration.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Compare their relevance, comparability or measurement limitations and state why one deserves greater weight.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify a consequential finding that complicates your preferred interpretation and explain how it affects its scope.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c3--checklist-a4-a4-m7-item-1" data-checklist-item-id="checklist-a4-a4-m7-item-1"><label class="util-interactive-checklist__label" for="lj-c3--checklist-a4-a4-m7-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c3--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m7-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a4-m7-c-2" data-revision-criterion-id="a4-m7-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Is your stated confidence proportionate to the evidence and its limitations?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confidence that exceeds the strength of the evidence can turn a defensible provisional interpretation into an unsupported claim.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your confidence assessment distinguishes observed outcomes from causal explanations.</li><li><span class="util-guided-review__feature-key">B.</span> The assessment accounts for relevant methodological or operational limitations.</li><li><span class="util-guided-review__feature-key">C.</span> A consequential remaining uncertainty is named and justified.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify which part of your interpretation is directly supported and which depends on an unresolved explanation.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect a documented limitation to the strength of the inference it constrains.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify the unanswered question that would most affect your current interpretation and explain its importance.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c3--checklist-a4-a4-m7-item-2" data-checklist-item-id="checklist-a4-a4-m7-item-2"><label class="util-interactive-checklist__label" for="lj-c3--checklist-a4-a4-m7-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c3--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m7-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a4-m7-c-3" data-revision-criterion-id="a4-m7-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you communicated the separate student-facing claim accurately and with appropriate qualification?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Public communication can mislead when it converts associations into proven effects or presents unmeasured system accuracy as established.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your replacement addresses the draft&#39;s causal claim without asserting an established SSI effect.</li><li><span class="util-guided-review__feature-key">B.</span> Your replacement does not claim that flags reliably identify support needs without accuracy evidence.</li><li><span class="util-guided-review__feature-key">C.</span> Your statement is understandable to students and retains the possibility of benefit without announcing a final decision.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Separate the recorded continuation differences from any claim about what caused them.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Qualify the identification claim using the recorded limits on flag accuracy and the selected nature of the conventional-support review.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Use plain language to convey the supported observations and their uncertainty, and remove any institutional recommendation.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c3--checklist-a4-a4-m7-item-3" data-checklist-item-id="checklist-a4-a4-m7-item-3"><label class="util-interactive-checklist__label" for="lj-c3--checklist-a4-a4-m7-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c3--learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m7-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A4"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M5" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Apply Your Evidence Appraisal to Student Communication</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-transfer-prompt-a4-m5-910" data-response-part-id="A4-transfer-prompt-a4-m5-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c3--learner-workspace-a4-a4-transfer-prompt-a4-m5-910-label" for="lj-c3--learner-workspace-a4-a4-transfer-prompt-a4-m5-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="lj-c3--learner-workspace-a4-a4-transfer-prompt-a4-m5-910-desc"><p>You have reconsidered your own provisional judgement. Now apply the same standards to a different purpose: communicating evidence responsibly to students.</p><p>Read the simulated draft campus update. Write a replacement statement of approximately 50–80 words suitable for a student audience.</p><p>Your statement should address the draft&#39;s claims about causation and reliable identification, retain observations that the evidence supports, and make consequential uncertainty understandable without implying that possible benefits have been disproved. Use the Northbridge evidence rather than general claims about AI.</p><p>Do not include your personal confidence rating or make a final recommendation about whether the institution should continue SSI. The aim is an accurate, appropriately qualified public explanation.</p></div><textarea class="util-learner-workspace__input" id="lj-c3--learner-workspace-a4-a4-transfer-prompt-a4-m5-910" name="learner-workspace-a4-a4-transfer-prompt-a4-m5-910" rows="5" aria-describedby="lj-c3--learner-workspace-a4-a4-transfer-prompt-a4-m5-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><aside class="util-study-tips" data-region="study-tips" id="lj-c3--journey-study-tips" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--study-tips" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg></span><span class="util-semantic-icon__label">Study tips</span></h2><div class="util-study-tips__content util-prose-measure"><ul><li>Revisit the sequence from preliminary enrolment to final continuation: the reporting point, population and outcome definition determine what a comparison can support.</li><li>Weigh methodological limitations, operational records, equity observations and individual testimony together, while respecting the different questions each source can answer.</li><li>Distinguish a change in provisional judgement from a change in confidence. Explain both using evidence, alternative interpretations and unresolved uncertainty.</li><li>When communicating findings to another audience, preserve supported observations and qualify claims that go beyond the evidence.</li></ul></div></aside><style id="lj-c3--prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;position:fixed;top:var(--learner-sticky-nav-height,0px);left:0;right:0;z-index:40;margin:0 auto;max-width:42rem;width:calc(100% - 1.5rem);padding:.45rem .75rem;border:1px solid #cbd5e1;border-left:3px solid #64748b;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.12)}.util-learner-renderer-vnext .util-revision-reminder__chrome{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.35rem .75rem;margin:0 0 .2rem}.util-learner-renderer-vnext .util-revision-reminder__label{
