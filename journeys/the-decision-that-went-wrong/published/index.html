utton><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Your recommendation to the Student Success Committee</span><p class="util-journey-position" aria-label="Section 1 of 2"><span class="util-journey-position__visible" aria-hidden="true">1 of 2</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c5--elicitation-self_review" aria-label="Next section: Review your recommendation"><span class="util-journey-adjacent__title">Review your recommendation</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c5--elicitation-recommendation" aria-current="location">Your recommendation to the Student Success Committee</a></li><li><a class="util-journey-all-link" href="#lj-c5--elicitation-self_review">Review your recommendation</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c5/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-assessment-intro" data-region="assessment-intro" data-journey-section="true"><p>You are preparing a recommendation for the Student Success Committee at Northbridge University, an entirely fictional public university in England. The committee must decide what should happen to Student Support Insight (SSI), an AI-assisted student support system, in the 2026/27 academic year. You have the complete case evidence, including encouraging findings, methodological limitations, operational concerns, stakeholder perspectives and institutional constraints. Your task is to make an independent, defensible recommendation and then review the quality of your reasoning. All four committee options are defensible in principle; there is no predetermined correct recommendation. This is a formative assessment, not a graded examination.</p><p>Allow approximately 25 minutes in total.

1. Independent recommendation — approximately 19 minutes. Review the complete fictional evidence dossier and write your recommendation to the Student Success Committee. Choose one of the four fixed options. Support your decision with specific quantitative and qualitative evidence, critically appraise limitations, integrate conflicting findings, weigh stakeholder benefits and harms, compare at least one plausible alternative, and propose proportionate safeguards, conditions or further evidence. Explain what remains uncertain.

2. Criteria-based self-review — approximately 6 minutes. Review your completed recommendation against six criteria: accuracy, critical appraisal, integration, stakeholder evaluation, proportionality and uncertainty. Identify one specific strength and one remaining weakness or assumption. Compare your final position with your initial judgement and confidence where possible. Make a concise revision if it would improve your reasoning.

The complete evidence is supplied within this assessment. You do not need to recall figures from earlier activities. Complete your recommendation independently before reviewing it. No model conclusion will be provided beforehand. Your written argument and reflection will not receive automatic correctness judgements, scores or grades.</p></section><section class="util-assessment-guidance util-assessment-section" data-region="assessment" id="lj-c5--journey-assessment" data-journey-section="true" data-assessment-product="assessment_pack" data-feedback-timing="per_component"><section class="util-assessment-orientation" data-region="assessment-orientation" id="lj-c5--journey-assessment-briefing" data-journey-section="true"><h3>What to bring with you</h3><ul><li><p>If you completed the earlier activities, revisit your initial judgement and confidence from &#39;The Promising Pilot&#39;, your evidence appraisal from &#39;Reading the Evidence Carefully&#39;, your revised or defended interpretation from &#39;When the Evidence Changes&#39;, and your stakeholder analysis from &#39;The People Behind the Decision&#39;.</p><p>Use these earlier judgements and analyses to inform your independent committee recommendation, then compare your final reasoning with your initial position and identify what has strengthened, changed or remains uncertain.</p></li></ul></section><article class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" id="lj-c5--elicitation-recommendation" data-elicitation-id="recommendation" data-journey-section="true"><h3>Your recommendation to the Student Success Committee</h3><section class="util-assessment-stimulus" data-region="assessment-stimulus" data-stimulus-kind="structured"><section class="util-assessment-stimulus__scenario" data-stimulus-part="scenario"><h4>Scenario</h4><p>Northbridge University is an entirely fictional public university in England. All people, institutional records, statements and evaluation findings in this dossier are invented for this educational activity; they are not authentic research findings or evidence about an actual institution or AI system. Northbridge introduced Student Support Insight (SSI) in September 2025 because of concerns about first-year students leaving before their second year. SSI uses existing information about engagement with university learning systems, attendance records where available, and assignment submission patterns to identify students who may benefit from additional academic support. It generates advisory support flags for authorised staff to review. Staff decide whether to contact a student and what support to offer. Students may decline support. SSI does not diagnose students, determine academic ability, award grades or automatically impose sanctions. Conventional academic support routes remain available to all students. The institutional objective is to improve access to timely support and increase first-year continuation without undermining trust, autonomy or equitable treatment. The Student Success Committee must recommend action for 2026/27 by 18 June 2026.</p></section><section class="util-assessment-stimulus__alternatives" data-stimulus-part="alternatives"><h4>Alternatives</h4><ol><li data-alternative-id="A"><p><strong>Option A — Continue unchanged</strong></p><p>Retain SSI and current procedures for 2026/27.</p></li><li data-alternative-id="B"><p><strong>Option B — Continue with safeguards and further evaluation</strong></p><p>Retain SSI while improving oversight, communication, data quality and evaluation within available resources.</p></li><li data-alternative-id="C"><p><strong>Option C — Restrict or temporarily suspend SSI</strong></p><p>Limit use or pause flag-generated contacts while investigating specified concerns; retain conventional support routes.</p></li><li data-alternative-id="D"><p><strong>Option D — Withdraw SSI</strong></p><p>End the system and rely on conventional academic support and the expanded adviser scheme.</p></li></ol></section><section class="util-assessment-stimulus__evidence" data-stimulus-part="evidence"><h4>Evidence</h4><article class="util-assessment-stimulus__evidence-item"><h5>Population, definitions and comparison basis</h5><p>The 2025/26 evaluation population comprises 2,000 first-year undergraduates: 500 flagged by SSI and 1,500 not flagged. Support contact means a recorded personalised offer of academic support following an SSI flag. Support engagement means attending at least one support conversation after that contact. Continuation means remaining enrolled or formally progressing to the next academic year at the evaluation cut-off of 31 May 2026. The historical comparison is the previous academic year&#39;s overall first-year continuation rate using the same definition.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>The historical comparison is observational, not a randomised control group. Flagged and unflagged students must not be assumed to be equivalent comparison groups.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-01 — Initial Evaluation Summary, 12 March 2026</h5><p>The preliminary institutional summary drew on first-semester and early second-semester indicators. Of 500 flagged students, 400 received recorded personalised support contact. Of those contacted, 240 engaged in at least one support conversation. Among the 240 engaged students, 216 (90%) were still enrolled at the preliminary reporting point. Among the 260 flagged students who had not engaged, 208 (80%) were still enrolled. The ten-percentage-point difference was described as encouraging. The summary recommended continuing the pilot while collecting more evidence.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>The 90% versus 80% comparison is an association within the flagged group and does not establish that support engagement caused improved enrolment. These are provisional enrolment indicators, not final continuation outcomes.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-02 — Final Continuation Data, 5 June 2026</h5><p>At the evaluation cut-off of 31 May 2026, 211 of 240 flagged and engaged students continued (87.9%); 205 of 260 flagged students who did not engage continued (78.8%); 416 of all 500 flagged students continued (83.2%); and 1,365 of 1,500 unflagged students continued (91.0%). Overall, 1,781 of 2,000 first-year students continued (89.1% when rounded to one decimal place). In the historical 2024/25 cohort, 1,720 of 2,000 continued (86.0%). The reported overall improvement is 3.1 percentage points using the rounded rates.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>The historical cohorts were not randomly assigned and other institutional changes occurred between years. The 3.1-percentage-point difference does not establish how much, if any, of the improvement was caused by SSI. Flagged and unflagged students are not equivalent groups, and preliminary enrolment and final continuation refer to different reporting points.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-03 — Evaluation Limitations Note, 8 June 2026</h5><p>Dr Priya Shah, Institutional Evaluation Lead, identifies several limitations. Students who engage with support may differ from those who do not in motivation, circumstances or existing support networks. The previous cohort is not an equivalent control group. An expanded first-year academic adviser scheme was also introduced in September 2025. Some attendance records were incomplete. Continuation does not fully represent wellbeing, confidence or educational experience. The evaluation cannot establish whether SSI performs better than an equally resourced non-AI approach.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>These limitations constrain causal attribution, comparison with other approaches and conclusions about students&#39; wider educational experiences. They do not independently establish that SSI has no benefit.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-04 — Operational and Equity Review, 10 June 2026: flag rates</h5><p>Among 300 students registered with a disability, 105 were flagged (35.0%). Among 1,700 students not registered with a disability, 395 were flagged (23.2% when rounded to one decimal place). Across the full population of 2,000 students, 500 were flagged (25.0%). The two disability-registration-status categories are exhaustive and mutually exclusive for this table, and status is recorded at the evaluation cut-off.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>The flag-rate difference alone does not establish discriminatory treatment, unequal prediction accuracy or its cause. Information about underlying support needs, flag accuracy and outcomes is insufficient to determine why the rates differ.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-04 — Operational and Equity Review, 10 June 2026: delivery and reliability</h5><p>Of 500 flagged students, 100 had no recorded personalised support contact. Staff identified 40 flagged cases where incomplete attendance information may have contributed to the flag. A separate review of 100 students who sought support through conventional routes found 30 who had not been flagged. Reviewing flags added approximately 25 hours of work per week across the academic support service during the busiest period.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>The 100 conventional-support users form a selected group, not a representative sample of all unflagged students. The review cannot establish an overall missed-identification rate or overall false-positive and false-negative rates. The 40 cases indicate possible data-quality concerns rather than confirmed incorrect flags.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-05 — Stakeholder Evidence Digest, 11 June 2026: Samira Khan</h5><p>Samira Khan, a first-year student, said: &quot;I was falling behind and didn&#39;t know who to ask. The message from my tutor made it easier to start a conversation. I probably wouldn&#39;t have contacted anyone myself.&quot;</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>This fictional individual account illustrates a possible benefit of SSI-initiated contact but does not establish how frequently other students experience that benefit.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-05 — Stakeholder Evidence Digest, 11 June 2026: Daniel Reed</h5><p>Daniel Reed, a first-year student, said: &quot;I was told my engagement suggested I might be struggling, but I was working offline and keeping up. I felt as though the university had already made up its mind about me.&quot;</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>This fictional individual account illustrates possible misinterpretation and harm to trust but does not establish the overall frequency of inaccurate or unwelcome SSI-related contact.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-05 — Stakeholder Evidence Digest, 11 June 2026: Bethan Hughes</h5><p>Bethan Hughes, a first-year student, said: &quot;I missed deadlines because things were difficult at home. Nobody contacted me through the new system. I found help later through my course administrator.&quot;</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>This fictional individual account illustrates a possible missed support opportunity and the continuing importance of conventional support routes. It does not establish SSI&#39;s overall missed-identification rate.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-05 — Stakeholder Evidence Digest, 11 June 2026: Tom Ellis</h5><p>Tom Ellis, Head of Academic Support, said: &quot;Some students have benefited from earlier contact, but the flags aren&#39;t always straightforward. Staff need time to check the context, and that has an impact on other support work.&quot;</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>This fictional operational perspective identifies a potential trade-off between early contact and staff capacity. It does not quantify benefits or opportunity costs beyond the separately reported workload evidence.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-05 — Stakeholder Evidence Digest, 11 June 2026: Morgan Price</h5><p>Morgan Price, Students&#39; Union Education Officer, said: &quot;Students want support, but they also want to understand how decisions about them are made. We shouldn&#39;t assume that a well-intentioned system automatically feels supportive.&quot;</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>This fictional representative&#39;s perspective highlights transparency and trust concerns but is not a representative survey measurement of student attitudes.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-05 — Stakeholder Evidence Digest, 11 June 2026: Dr Aisha Rahman</h5><p>Dr Aisha Rahman, Director of Student Success, said: &quot;The early signs are encouraging. I would be reluctant to lose a potentially useful route to support before we&#39;ve had a fair opportunity to improve it.&quot;</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>This fictional stakeholder interpretation favours considering further development, but the early findings do not establish SSI&#39;s causal effectiveness or justify assuming future improvements.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-05 — Stakeholder Evidence Digest, 11 June 2026: Dr Priya Shah</h5><p>Dr Priya Shah, Institutional Evaluation Lead, said: &quot;The evidence is consistent with possible benefit, but we cannot yet isolate the effect of SSI from other changes or establish whether the benefits and risks are distributed fairly.&quot;</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>This fictional evaluation perspective identifies unresolved causal and equity questions. It does not determine which institutional option must be chosen.</p></article><article class="util-assessment-stimulus__evidence-item"><h5>NB-SSI-06 — Decision Brief, 15 June 2026</h5><p>The Student Success Committee, chaired by Professor Helen Ward, Pro-Vice-Chancellor (Education), must recommend a course of action for 2026/27 by 18 June 2026. Professor Ward is accountable for the decision and concerned with continuation, fairness, resources and institutional confidence. SSI costs £48,000 per academic year in software licensing and associated administration, excluding additional staff time. No additional recurring budget has been approved for 2026/27. Conventional academic support services and the expanded academic adviser scheme will remain available. The committee must consider educational benefits, evidential limitations, fairness, reliability, student experience, staff capacity and financial implications.</p><p class="util-assessment-stimulus__qualification"><span class="util-visually-hidden">Qualification: </span>Recommendations must remain feasible within available resources and must not assume unapproved funding or certain future outcomes. Conditions, safeguards, review dates and evidence requirements may accompany any of the four options. No option is designated correct.</p></article></section><section class="util-assessment-stimulus__boundary" data-stimulus-part="evidence-boundary"><p>All case information is fictional and synthetic. Use the evidence to make an institutional judgement, not to infer technical AI model properties that have not been evaluated. Associations do not establish causation; subgroup flag-rate differences do not establish discrimination or prediction accuracy; selected examples do not establish population error rates; and individual accounts do not establish prevalence. All four options remain defensible in principle.</p></section></section><p>It is 18 June 2026. Northbridge University&#39;s Student Success Committee, chaired by Professor Helen Ward, must decide what should happen to Student Support Insight (SSI) in 2026/27. You have the complete fictional case dossier below. The committee needs a reasoned recommendation, not a claim that the evidence proves one option is correct. All four options are open to you.</p><p>Write your independent recommendation to the committee. Select Option A, B, C or D and explain why you prefer it. Use specific quantitative findings and relevant stakeholder accounts from the dossier. Critically examine important limitations, including what the evidence cannot establish. Bring together findings that point in different directions and explain their implications. Weigh benefits and harms for students, staff and the institution, including fairness, trust, operational reliability and resources. Compare your preferred action with at least one plausible alternative. Recommend proportionate safeguards, conditions, a review arrangement or further evidence as appropriate. Explain the uncertainty that remains and why your choice is nevertheless defensible.</p><p>Produce a coherent committee recommendation in your own words. Make the preferred action explicit, support it with accurate evidence, explain your reasoning and trade-offs, and identify feasible conditions or evidence needs. You may choose any of the four options; the quality of your reasoning matters more than which option you select. Complete this recommendation independently before beginning your self-review.</p><p>Approximately 350–500 words. This is a flexible guide, not a strict limit.</p><p>Approximately 19 minutes, including reviewing the evidence and writing your recommendation.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-recommendation" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c5--assessment-constructed-recommendation">Your response</label><p>Write in connected prose, using short headings if helpful. Refer to specific evidence and explain why it matters. You may organise your recommendation around your preferred action, supporting evidence, limitations, stakeholder consequences, alternative options and conditions.</p><textarea class="util-learner-workspace__input" id="lj-c5--assessment-constructed-recommendation" name="assessment-constructed-recommendation" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="lj-c5--assessment-constructed-recommendation-review">Review your response</button></p><div id="lj-c5--assessment-constructed-recommendation-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="recommendation_criteria"><p>Your recommendation is not judged by whether you chose Option A, B, C or D. Each is defensible in principle. Review the reasoning you have written against six criteria: Accuracy — are the figures, definitions and reporting points correct? Critical appraisal — have you explained what the evidence cannot establish? Integration — have you brought together encouraging findings, conflicting evidence and stakeholder experiences? Stakeholder evaluation — have you weighed benefits and harms for students, staff and the institution? Proportionality — have you justified a feasible action against at least one alternative and identified appropriate conditions or evidence needs? Uncertainty — have you acknowledged unresolved questions without treating uncertainty as proof that action is impossible?</p></article><article class="util-formative-material" data-material-id="recommendation_evidence_boundaries"><p>Check the limits of your claims. The preliminary 90% versus 80% finding compares enrolment among flagged students who did and did not engage; it does not show that engagement caused the difference. The final overall continuation rate was 89.1%, compared with 86.0% historically, but the 3.1-percentage-point observed difference cannot be attributed to SSI alone. The 35.0% versus 23.2% disability-registration flag rates do not establish discrimination or prediction accuracy. The 30 unflagged students in the selected group of 100 conventional-support users do not establish an overall missed-identification rate. Individual accounts illuminate experiences without establishing their prevalence. These distinctions help you make a proportionate recommendation rather than an overconfident one.</p></article><article class="util-formative-material" data-material-id="recommendation_decision_check"><p>A defensible recommendation connects the evidence to a practical decision. Consider whether you have explained what your preferred option may preserve, improve, risk or give up; why at least one alternative is less suitable under your stated priorities; and how your proposed safeguards, conditions or evidence requirements fit the available resources. SSI costs £48,000 annually excluding additional staff time, no additional recurring budget is approved, and conventional support and the expanded adviser scheme remain available. A well-supported judgement may still acknowledge that important questions cannot yet be answered.</p></article></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>Now review the recommendation you actually wrote. Use the six criteria to identify one strength and one remaining weakness or assumption, then consider how your final judgement compares with your initial position. You do not need to change your chosen option to demonstrate thoughtful reflection.</p></section></article><article class="util-assessment-item util-assessment-item--constructed" data-assessment-mode="constructed" data-auto-checkable="false" id="lj-c5--elicitation-self_review" data-elicitation-id="self_review" data-journey-section="true"><h3>Review your recommendation</h3><p>You have now written your independent recommendation to Northbridge University&#39;s Student Success Committee. Review the reasoning you actually used, rather than judging your work by whether you selected a supposedly correct option. All four committee options remain defensible in principle.</p><p>Read your recommendation against the six criteria below. Identify one specific strength in your reasoning and one remaining weakness, assumption or uncertainty. Explain how your final position compares with the provisional judgement and confidence you expressed in &#39;The Promising Pilot&#39;, if you completed that activity. Consider whether the evidence appraisal developed in &#39;Reading the Evidence Carefully&#39;, the conflicting findings considered in &#39;When the Evidence Changes&#39;, and the stakeholder perspectives examined in &#39;The People Behind the Decision&#39; strengthened, changed or qualified your reasoning. If you identify an important improvement, make one concise revision to your recommendation.</p><p>Write a brief, specific self-review referring to features of your own recommendation. Identify one strength, one remaining weakness or assumption, and how your judgement developed. You may retain your preferred option or revise it; a change of position is not required. Make a concise improvement if it would strengthen your reasoning.</p><p>Approximately 100–150 words, plus an optional concise revision.</p><p>Approximately 6 minutes.</p><div class="util-learner-workspace util-prose-measure" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-self_review" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c5--assessment-constructed-self_review">Your response</label><p>Be specific about your own argument. Identify one convincing feature and one point that remains uncertain or could be improved. Explain what influenced your judgement, then revise a sentence or short passage if useful.</p><textarea class="util-learner-workspace__input" id="lj-c5--assessment-constructed-self_review" name="assessment-constructed-self_review" rows="8"></textarea><p>Your response is not marked correct or incorrect.</p></div><p><button type="button" class="util-assessment-check" data-assessment-open-review aria-expanded="false" aria-controls="lj-c5--assessment-constructed-self_review-review">Review your response</button></p><div id="lj-c5--assessment-constructed-self_review-review" class="util-assessment-review-region" data-assessment-review-region hidden tabindex="-1"><p class="util-visually-hidden" aria-live="polite" data-assessment-review-status></p><section class="util-formative-return" data-region="formative-return" data-automated-judgement="false"><article class="util-formative-material" data-material-id="self_review_quality"><p>A useful self-review identifies specific features of your own reasoning rather than simply declaring the recommendation strong or weak. A strength might be an accurate comparison, a carefully qualified inference, a convincing synthesis of competing evidence or a balanced consideration of stakeholder consequences. A remaining weakness might be an assumption you have not tested, an alternative you have not fully considered, an uncertain effect on students or an unresolved question about feasibility. Explain why the feature matters to the recommendation.</p></article><article class="util-formative-material" data-material-id="self_review_judgement_development"><p>Compare your final judgement with your initial position and confidence where you have an earlier response available. A change in preferred option may show that new evidence affected your priorities, but keeping the same option can also reflect careful reasoning if you can explain how your justification became more qualified or better supported. If you cannot refer to an earlier response, identify the assumptions and uncertainties that shaped your present judgement without inventing an earlier position.</p></article><article class="util-formative-material" data-material-id="self_review_revision"><p>If your self-review identifies a meaningful improvement, a concise revision is enough. You might correct a numerical interpretation, qualify an unsupported claim, make a stakeholder trade-off more explicit, strengthen the comparison with an alternative or specify a more feasible condition for review. A revision should make your own argument clearer or more defensible; it does not need to change the committee option you selected.</p></article></section><section class="util-assessment-revision" data-region="assessment-revision" data-automated-judgement="false"><p class="util-revision-offer" data-revision-offered="true">If your self-review identified an important weakness or assumption, revise one sentence or short passage of your recommendation to address it. You may retain your original preferred option. Make the change because it improves the reasoning, not because a particular answer is expected.</p><div class="util-learner-workspace" data-workspace-kind="text_entry" data-workspace-id="assessment-constructed-self_review-weakness" data-assessment-judgement="none"><label class="util-learner-workspace__label" for="lj-c5--assessment-constructed-self_review-weakness">What is the most important weakness you identified in your argument?</label><textarea class="util-learner-workspace__input" id="lj-c5--assessment-constructed-self_review-weakness" name="assessment-constructed-self_review-weakness" rows="3"></textarea></div><p>Revision is yours to make. It is not marked correct or incorrect.</p><p><a href="#lj-c5--assessment-constructed-self_review" data-assessment-return-to-response="assessment-constructed-self_review">Revise your written judgement</a></p></section></div><section class="util-elicitation-forward" data-region="elicitation-forward"><p>You have completed the independent recommendation and its criteria-based review. Consider what this exercise shows about your approach to institutional decisions: which kinds of evidence you use confidently, where you remain cautious, and how you balance possible benefits against uncertainty and consequences. Keep your recommendation and reflection together as a record of your reasoning.</p></section></article><section class="util-pack-forward" data-region="pack-forward" id="lj-c5--journey-assessment-pack-forward" data-journey-section="true"><h2>What to take forward</h2><p>Your completed recommendation and self-review provide a record of how you made a consequential institutional judgement using incomplete and sometimes conflicting evidence. The value of this work lies in the accuracy, transparency, balance and proportionality of your reasoning, not in selecting a predetermined committee option. Retain both pieces together so you can revisit how your position developed, what evidence mattered most and which uncertainties would warrant further investigation. This is formative reflection, not an automated evaluation, grade or progression decision.</p></section></section></article></template></div><script type="application/json" id="lj-shell-manifest">[{"commissionId":"overview","title":"Overview","kind":"overview","pageKey":"","productId":""},{"commissionId":"c1","title":"The Promising Pilot","kind":"resource","pageKey":"v1::22413210-0d16-40e4-93bf-4abac348bfd6::learner-page::2.0.0::a1-a2-a3-a4::the-promising-pilot","productId":"interactive"},{"commissionId":"c2","title":"Reading the Evidence Carefully","kind":"resource","pageKey":"v1::ac3616c5-e047-49fb-9682-b9b23f61e2f6::learner-page::2.0.0::no-activities::reading-the-evidence-carefully","productId":"expository"},{"commissionId":"c3","title":"When the Evidence Changes","kind":"resource","pageKey":"v1::5709435c-6757-4d78-9226-160e83209ee7::learner-page::2.0.0::a1-a2-a3-a4::when-the-evidence-changes","productId":"interactive"},{"commissionId":"c4","title":"The People Behind the Decision","kind":"resource","pageKey":"v1::f701b3d4-79f5-4cbb-a43c-5cdde345833e::learner-page::2.0.0::a1-a2-a3::the-people-behind-the-decision","productId":"interactive"},{"commissionId":"c5","title":"The Committee Recommendation","kind":"resource","pageKey":"v1::d13fd7cd-9d85-459d-b5a2-1b7995175ad2::learner-page::2.0.0::no-activities::the-committee-recommendation","productId":"assessment_pack"}]</script><script type="application/json" id="lj-shell-artefact-contract">{"produces":[],"references":[],"conflicts":[]}</script><script src="runtime/learner-renderer-vnext-browser.js" data-lj-shell-runtime="external"></script><script data-lj-shell-controller="true">(function(){var api=window.PRISM_LEARNER_RENDERER_VNEXT;if(!api||typeof api.mountLearnerResource!=='function'){console.error('PRISM unified shell: mount API missing');return;}var manifestEl=document.getElementById('lj-shell-manifest');if(!manifestEl)return
