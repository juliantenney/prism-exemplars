ft-status" aria-live="polite" data-learner-draft-status>Draft not saved</p><button type="button" class="util-learner-draft-clear" data-learner-draft-clear aria-label="Clear saved responses for this page">Clear saved responses</button></div><header class="util-page-header util-learning-header"><h2 data-lj-resource-title="true" tabindex="-1">The People Behind the Decision</h2></header><nav class="util-journey-nav util-journey-nav--sequential" aria-label="Learning sections" data-journey-total="4"><div class="util-journey-sequential"><div class="util-journey-sequential__row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 4"><span class="util-journey-position__visible" aria-hidden="true">1 of 4</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#lj-c4--activity-A1" aria-label="Next section: Unpack Stakeholder Disagreements"><span class="util-journey-adjacent__title">Unpack Stakeholder Disagreements</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#lj-c4--journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#lj-c4--activity-A1">Unpack Stakeholder Disagreements</a></li><li><a class="util-journey-all-link" href="#lj-c4--activity-A2">Weigh Benefits, Harms and Uncertainty</a></li><li><a class="util-journey-all-link" href="#lj-c4--activity-A3">Compare the Committee's Four Choices</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c4/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="lj-c4--journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This self-study resource examines how Northbridge University&#39;s Student Success Committee should take account of the people affected by its AI-assisted Student Support Insight (SSI) pilot. Begin with your own provisional judgement and unresolved questions from When the Evidence Changes. You will examine fictional stakeholder accounts, evaluate potential consequences and compare four institutional options. Work through each analysis independently before using the review criteria to refine your reasoning. You are not yet required to make a final recommendation.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The three activities build towards a more comprehensive basis for institutional judgement. First, distinguish stakeholder interests and disagreements. Next, evaluate potential benefits and harms using evidence of differing strengths. Finally, compare the four available courses of action within the university&#39;s constraints. Your resulting analysis will provide a basis for the subsequent recommendation task.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><h3 class="util-md-heading util-md-heading--source-2">From evidence appraisal to institutional judgement</h3><p>A university decision can remain difficult even when everyone accepts the same recorded findings. Evidence helps establish what has been observed and what remains uncertain. Institutional judgement also requires consideration of whose interests are affected, which consequences matter, and what the university can reasonably deliver.</p><p>Northbridge University&#39;s fictional SSI pilot generates indications that first-year students might benefit from supportive contact. Staff review the flags and decide whether to make contact; students choose whether to engage. The system does not automatically diagnose students, assign grades or impose sanctions. Conventional academic support remains available alongside SSI.</p><p>The Student Success Committee must consider the system&#39;s future for 2026/27. Its task is not simply to determine whether SSI appears promising. It must also consider what continuing, modifying, restricting or withdrawing the system could mean for students, staff and the institution.</p><h3 class="util-md-heading util-md-heading--source-2">Stakeholders, interests and responsibilities</h3><p>A stakeholder is a person or group whose experience, interests or responsibilities may be affected by a decision. Students may value timely support, fair treatment, privacy, autonomy and confidence in how information about them is interpreted. Academic support staff may be concerned with providing effective assistance while checking contextual information and managing competing demands on their time. Student representatives may focus on transparency, trust and whether different students can access support fairly. Institutional leaders and evaluators must consider educational aims, the quality of the evidence, operational feasibility and the responsible use of resources.</p><p>Stakeholders need not disagree about every fact to favour different approaches. They may attach different importance to the same possible consequences. Conversely, two people may share a priority, such as improving student support, while disagreeing about whether the available evidence establishes that a particular system achieves it.</p><p>A useful analysis therefore distinguishes three questions: What does this person report or argue? What interest or responsibility makes that perspective significant? What consequence might follow, and how securely is it supported?</p><h3 class="util-md-heading util-md-heading--source-2">Disagreements about evidence and differences in priorities</h3><p>An evidential disagreement concerns what observations justify. For example, a difference in outcomes between students who engaged with support and those who did not may be relevant, but it does not by itself establish that engagement caused the difference. Students may have entered those groups with different circumstances, motivations or existing sources of help.</p><p>A difference in priorities concerns what should receive greater weight in a decision. One stakeholder might place particular importance on reaching students who would not otherwise seek help; another might emphasise the risk of students feeling misjudged or the burden of reviewing uncertain flags. Those concerns can both be legitimate without either determining the institutional choice.</p><p>Evidence and priorities often interact. Better evidence could change the estimated likelihood of a consequence, while differences in values could remain even after the uncertainty was reduced. Distinguishing the two prevents an analysis from treating every disagreement as either a factual error or an irreconcilable opinion.</p><h3 class="util-md-heading util-md-heading--source-2">What different sources can establish</h3><p>The SSI case combines continuation records, methodological qualifications, operational observations, individual accounts and an institutional decision brief. These sources answer different kinds of questions.</p><p>Continuation figures describe recorded outcomes at specified reporting points. Preliminary enrolment and later continuation must not be treated as interchangeable. Associations between engagement and continuation do not establish causal effects, and comparisons with historical cohorts cannot isolate SSI from other changes, including the expanded first-year academic adviser scheme.</p><p>Operational records can identify matters such as contact coverage, potentially incomplete data and staff time. They do not automatically establish the accuracy of individual flags or the reasons for differences between student groups. In particular, a difference in flag rates is not, by itself, proof of discrimination or unequal predictive accuracy. A selected review of students who sought conventional support cannot establish the population-wide rate of missed identification.</p><p>Individual accounts can reveal experiences and concerns that a continuation measure does not capture. They can make a possible benefit, harm or burden intelligible, but they cannot establish how common that experience is. A responsible evaluation draws on both recorded quantities and testimony without asking either to support claims beyond its scope.</p><h3 class="util-md-heading util-md-heading--source-2">Benefits, harms and consequential trade-offs</h3><p>A potential benefit is an outcome that could improve someone&#39;s circumstances, such as access to a supportive conversation. A potential harm or burden could involve unnecessary concern, loss of trust, missed assistance or diversion of staff capacity. A possible consequence is not the same as an established effect.</p><p>A consequential trade-off arises when an institutional action could advance one legitimate aim while placing pressure on another. Earlier identification may need to be considered alongside contextual accuracy and student autonomy. Additional oversight may need to be considered alongside the staff time required to deliver it. Retaining a service may preserve one route to support while committing resources that cannot simultaneously be used elsewhere.</p><p>Good comparative reasoning does not require inventing numerical scores for trust, fairness or educational value. Instead, identify the affected stakeholders, explain the potential consequences, distinguish observations from inferences, and justify why particular considerations deserve weight. Where a judgement depends on missing evidence, make that dependence explicit.</p><h3 class="util-md-heading util-md-heading--source-2">Institutional options and feasibility</h3><p>The committee&#39;s four fixed choices are to continue SSI unchanged; continue with safeguards and further evaluation; restrict or temporarily suspend its use while investigating concerns; or withdraw it and rely on conventional academic support and the expanded adviser scheme.</p><p>These are different institutional responses, not four established predictions of what will happen. Conditions, safeguards and review dates may be considered, but their effectiveness cannot be assumed. The committee must also work within the stated financial position: SSI has an annual software and administration cost of £48,000, excluding staff time, and no additional recurring budget has been approved.</p><p>Comparing the options therefore requires attention to educational benefit, fairness, reliability, trust, autonomy, staff capacity, financial feasibility and the support routes that remain available. There is no designated correct option. A defensible later recommendation will depend on how transparently these considerations are weighed, how accurately the evidence is represented and how responsibly unresolved questions are handled.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c4/knowledge-summary-after-content.png" alt="Concept map connecting evidence, stakeholders, consequences, constraints and four options; detailed description follows." aria-describedby="lj-c4--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> The connected dimensions of a defensible institutional decision.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c4--figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">The map connects five areas of reasoning. Recorded evidence includes continuation observations and operational findings, qualified by selection effects, non-equivalent groups and incomplete information. Stakeholder perspectives include students, support staff, student representatives and institutional evaluators. These perspectives inform the importance assigned to possible consequences for support access, fairness, reliability, trust, autonomy and staff capacity. Institutional constraints include available resources, the £48,000 annual SSI cost excluding staff time, and continuing support alternatives. All these dimensions inform comparison of the four fixed options: continue unchanged, continue with safeguards and evaluation, restrict or suspend, and withdraw. No option is marked as preferred.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Analyse the interests and potential consequences represented in the SSI stakeholder accounts, distinguishing disagreements about the strength of evidence from differences in stakeholder priorities and identifying perspectives that a decision must not overlook. <span class="util-outcome-id">(LO1)</span></li><li>Evaluate the potential benefits and harms of SSI for different stakeholders, using the available evidence to assess implications for fairness, operational reliability, student trust, autonomy and access to support while distinguishing established findings from uncertain consequences. <span class="util-outcome-id">(LO2)</span></li><li>Compare the four fixed institutional options for SSI against consequential stakeholder trade-offs and resource constraints, justifying which considerations and unresolved uncertainties should carry the greatest weight in a subsequent committee recommendation without selecting a final option. <span class="util-outcome-id">(LO3)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="lj-c4--journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="lj-c4--activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Unpack Stakeholder Disagreements</h2><div class="util-badge-row"><span class="util-badge util-badge-time">5 min</span></div></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Your earlier evidence appraisal provides a starting point for institutional judgement. This activity broadens the question from what the SSI findings support to whose interests are affected, why perspectives differ and which voices must inform a responsible decision.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>The Student Success Committee must consider more than whether Student Support Insight (SSI) appears promising. Its effects and uncertainties matter differently to students, staff and institutional leaders. If you completed When the Evidence Changes, revisit your revised, retained or qualified provisional judgement and the significant uncertainties you identified. Use that earlier reasoning to examine the stakeholder accounts here, rather than assuming everyone interprets the evidence or prioritises its consequences in the same way.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Analyse what each person is concerned about, the evidence or experience informing that concern and the possible consequences for others. Distinguish disagreement about what the evidence establishes from disagreement about what should matter most. An individual account can reveal an important possibility without establishing how common it is.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which two stakeholders could agree about the same observation yet disagree about its importance? Which apparent disagreement concerns what the evidence can actually establish?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A1"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Read the stakeholder evidence digest and identify the interests, responsibilities and potential consequences represented by at least four different stakeholders, including student and staff perspectives.</p></span></div></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a1-distinction-01-activity-a1-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c4/activity-a1-materials-entry.png" alt="Contrast between evidential disagreements and priority differences, including overlap; detailed description follows." aria-describedby="lj-c4--figure-description-asset-vb-38-4-va-a1-distinction-01-activity-a1-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 2.</strong> Two questions for examining stakeholder disagreement, with a possible overlap.</figcaption><p class="util-visual-asset-detailed-description" id="lj-c4--figure-description-asset-vb-38-4-va-a1-distinction-01-activity-a1-materials-entry">Two conceptual areas distinguish questions about evidence from questions about priorities. The evidence area asks what an observation or account supports and what remains uncertain. The priorities area asks which stakeholder interests and potential consequences should receive greater weight. Their overlap indicates that a disagreement can involve both. A separate source-strength reminder distinguishes an individual account from evidence of prevalence. No fictional stakeholder is assigned to a category; learners must make those judgements using the source material.</p></figure><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><article class="util-material-block util-material-table-block" data-material-id="A1-M2" data-material-type="reference_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Simulated Evaluation Findings and Their Limits</span></p><h3 class="util-md-heading util-md-heading--source-2">Evaluation evidence for stakeholder comparison</h3><p>The following records are from the fictional Northbridge University SSI evaluation. The March figures concern preliminary enrolment; the June report concerns continuation at the 31 May 2026 cut-off. The groups and reporting points must remain distinct.</p><div class="util-table-scroll util-material-table"><table><thead><tr><th>Source</th><th>Directly recorded finding</th><th>Interpretative boundary</th></tr></thead><tbody><tr><td>NB-SSI-01, 12 March 2026</td><td>Of 240 flagged students who engaged with support, 216 (90%) remained enrolled at the preliminary reporting point.</td><td>Preliminary enrolment, not final continuation. Engagement was not randomly assigned.</td></tr><tr><td>NB-SSI-01, 12 March 2026</td><td>Of 260 flagged students who did not engage, 208 (80%) remained enrolled at the preliminary reporting point.</td><td>The 10-percentage-point difference between engagement groups is an association, not an established effect of engagement.</td></tr><tr><td>NB-SSI-02, 5 June 2026</td><td>Of 240 flagged students who engaged, 211 continued (87.9%) at the 31 May cut-off.</td><td>Final continuation uses a later reporting point than the March preliminary figures.</td></tr><tr><td>NB-SSI-02, 5 June 2026</td><td>Of 260 flagged students who did not engage, 205 continued (78.8%).</td><td>Students who did and did not engage may differ in other relevant ways.</td></tr><tr><td>NB-SSI-02, 5 June 2026</td><td>Across all flagged students, 416/500 continued (83.2%).</td><td>Flagged students are not an equivalent comparison group to unflagged students.</td></tr><tr><td>NB-SSI-02, 5 June 2026</td><td>Among unflagged students, 1,365/1,500 continued (91.0%).</td><td>Differences between flagged and unflagged groups cannot establish SSI effectiveness.</td></tr><tr><td>NB-SSI-02, 5 June 2026</td><td>Across the 2025/26 cohort, 1,781/2,000 continued (89.1% rounded); in 2024/25, 1,720/2,000 continued (86.0%).</td><td>The 3.1-percentage-point difference between rounded cohort rates is observational, not an established SSI effect.</td></tr><tr><td>NB-SSI-03, 8 June 2026</td><td>Students engaging with support may differ in motivation, circumstances or existing support networks.</td><td>Selection into engagement limits causal interpretation.</td></tr><tr><td>NB-SSI-03, 8 June 2026</td><td>The historical cohort is not an equivalent control group; an expanded first-year academic adviser scheme also began in September 2025.</td><td>The contribution of SSI cannot be isolated from other changes.</td></tr><tr><td>NB-SSI-03, 8 June 2026</td><td>Some attendance records were incomplete; continuation does not fully represent wellbeing, confidence or educational experience.</td><td>The records do not establish the full range of student experiences or outcomes.</td></tr><tr><td>NB-SSI-03, 8 June 2026</td><td>The evaluation cannot establish whether SSI performs better than an equally resourced non-AI support approach.</td><td>Comparative effectiveness remains unresolved.</td></tr></tbody></table></div><p>Use the source references and recorded observations when explaining whether a stakeholder disagreement concerns what the evidence supports, what should be prioritised, or both.</p></article></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c4--learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="lj-c4--learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="lj-c4--learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c4--learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c4--learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="lj-c4--learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c4--learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Complete the stakeholder comparison table, grounding each entry in an identifiable statement or recorded finding rather than a general impression.</p></span></div><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A1-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated Stakeholder Evidence Digest</span></p><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-05 — Stakeholder Evidence Digest</h3><p>11 June 2026 | Northbridge University | Fictional case</p><p>These are fictional statements from individual participants in the Student Support Insight (SSI) pilot. They are not representative survey findings. Read each account in full before comparing the interests, responsibilities and experiences involved.</p><h3 class="util-md-heading util-md-heading--source-3">Samira Khan — first-year student</h3><p>&gt; I was falling behind and didn&#39;t know who to ask. The message from my tutor made it easier to start a conversation. I probably wouldn&#39;t have contacted anyone myself.</p><h3 class="util-md-heading util-md-heading--source-3">Daniel Reed — first-year student</h3><p>&gt; I was told my engagement suggested I might be struggling, but I was working offline and keeping up. I felt as though the university had already made up its mind about me.</p><h3 class="util-md-heading util-md-heading--source-3">Bethan Hughes — first-year student</h3><p>&gt; I missed deadlines because things were difficult at home. Nobody contacted me through the new system. I found help later through my course administrator.</p><h3 class="util-md-heading util-md-heading--source-3">Tom Ellis — Head of Academic Support</h3><p>&gt; Some students have benefited from earlier contact, but the flags aren&#39;t always straightforward. Staff need time to check the context, and that has an impact on other support work.</p><h3 class="util-md-heading util-md-heading--source-3">Morgan Price — Students&#39; Union Education Officer</h3><p>&gt; Students want support, but they also want to understand how decisions about them are made. We shouldn&#39;t assume that a well-intentioned system automatically feels supportive.</p><h3 class="util-md-heading util-md-heading--source-3">Dr Aisha Rahman — Director of Student Success</h3><p>&gt; The early signs are encouraging. I would be reluctant to lose a potentially useful route to support before we&#39;ve had a fair opportunity to improve it.</p><h3 class="util-md-heading util-md-heading--source-3">Dr Priya Shah — Institutional Evaluation Lead</h3><p>&gt; The evidence is consistent with possible benefit, but we cannot yet isolate the effect of SSI from other changes or establish whether the benefits and risks are distributed fairly.</p><p>These statements describe particular experiences and professional perspectives. Their significance, relationship to the evaluation findings and implications for the committee are for you to examine.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify one disagreement about the strength or interpretation of evidence and one difference in priorities. Explain why they are different kinds of disagreement, allowing for overlap where appropriate.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a1-a1-m3" data-material-source-id="A1-M3" data-activity-id="A1"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A1-M3" data-material-type="comparison_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Stakeholder Comparison Workspace</span></p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="lj-c4--a1-a1-m3-col-stakeholder-and-source-passage-0">Stakeholder and source passage</th><th scope="col" id="lj-c4--a1-a1-m3-col-interest-or-responsibility-1">Interest or responsibility</th><th scope="col" id="lj-c4--a1-a1-m3-col-evidence-or-experience-invoked-2">Evidence or experience invoked</th><th scope="col" id="lj-c4--a1-a1-m3-col-potential-consequence-3">Potential consequence</th><th scope="col" id="lj-c4--a1-a1-m3-col-limitation-or-uncertainty-4">Limitation or uncertainty</th></tr></thead><tbody><tr><td class="util-learner-table-workspace__cell util-learner-table-workspace__cell--editable"><div class="util-learner-table-workspace__cell--editable-inner"><textarea class aria-hidden="true" focusable="false"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"></path></svg></span><span class="util-semantic-icon__label">Disagreements and Stakeholder Synthesis</span></p><h3 class="util-md-heading util-md-heading--source-2">Response 1 — What kind of disagreement is this?</h3><p>Identify one disagreement about the strength or interpretation of evidence and one difference in stakeholder priorities. For each, cite an identifiable passage or recorded finding and explain why it is primarily an evidential disagreement or a difference in what matters. Acknowledge overlap if the same disagreement involves both.</p><p>Your response:</p><h3 class="util-md-heading util-md-heading--source-2">Response 2 — Whose interests matter?</h3><p>Write a short synthesis of at least three distinct stakeholder interests. Identify one perspective the committee could overlook and explain what might be missed if that perspective were absent. Distinguish an individual account from evidence of how common an experience is.</p><p>Your response:</p><p>Do not select or recommend an institutional option.</p></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A source-grounded stakeholder comparison covering at least four perspectives, with accurately attributed concerns, potential consequences and evidential limitations. The accompanying synthesis distinguishes at least one evidential disagreement from one priority difference, recognises the limits of individual testimony and explains why a potentially overlooked perspective deserves consideration. The response uses the learner&#39;s earlier provisional interpretation as a starting point without treating it as a predetermined decision.</p></div><div class="util-learner-workspace util-prose-measure" data-workspace-step="4" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a1-a1-task-step-step-4-4" data-response-part-id="A1-task-step-step-4-4"><label class="util-composition-subheading util-learner-workspace__label" id="lj-c4--learner-workspace-a1-a1-task-step-step-4-4-label" for="lj-c4--learner-workspace-a1-a1-task-step-step-4-4">Your response</label><p class="util-learner-workspace__prompt" id="lj-c4--learner-workspace-a1-a1-task-step-step-4-4-desc">Write a short synthesis identifying at least three distinct stakeholder interests, one perspective that could be overlooked and why that omission would matter to the committee. Do not select an institutional option.</p><textarea class="util-learner-workspace__input" id="lj-c4--learner-workspace-a1-a1-task-step-step-4-4" name="learner-workspace-a1-a1-task-step-step-4-4" rows="6" aria-describedby="lj-c4--learner-workspace-a1-a1-task-step-step-4-4-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#lj-c4--learner-check-a1" data-check-sidebar-open aria-controls="lj-c4--learner-check-a1" aria-expanded="false" aria-label="Check your work: Unpack Stakeholder Disagreements">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="lj-c4--learner-check-a1" data-composition-moment="check" data-activity-id="A1" data-check-sidebar="available" aria-labelledby="lj-c4--learner-check-a1-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="lj-c4--learner-check-a1-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="lj-c4--learner-check-a1-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#lj-c4--learner-task-a1">Back to your task (Unpack Stakeholder Disagreements)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A1-M5" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a1-a1-m5" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a1-m5-c-0" data-revision-criterion-id="a1-m5-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you represented distinct stakeholders accurately and grounded their perspectives in identifiable sources?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Misattribution or narrow coverage can make the committee&#39;s apparent disagreement a product of your summary rather than the recorded perspectives.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> At least four distinct stakeholders are identified, with student, staff, student-representation and leadership or evaluation perspectives covered.</li><li><span class="util-guided-review__feature-key">B.</span> Each comparison identifies a recognisable passage or specific recorded finding.</li><li><span class="util-guided-review__feature-key">C.</span> Statements and responsibilities are attributed to the correct person.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify which perspective category is absent and add a stakeholder from NB-SSI-05 whose role fills that gap.</li><li><span class="util-guided-review__feature-key">Missing B:</span> For each unsupported entry, add the speaker&#39;s relevant words or the particular NB-SSI-01 to NB-SSI-03 observation on which your interpretation depends.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Check each name against NB-SSI-05 and separate a person&#39;s own account from your inference about its significance.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c4--checklist-a1-a1-m5-item-0" data-checklist-item-id="checklist-a1-a1-m5-item-0"><label class="util-interactive-checklist__label" for="lj-c4--checklist-a1-a1-m5-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c4--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a1-m5-c-1" data-revision-criterion-id="a1-m5-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you explained stakeholder interests and consequences rather than simply listing opinions?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A list of positions does not establish why a disagreement matters for student experience, professional responsibilities or institutional action.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each selected stakeholder has an identifiable interest or responsibility.</li><li><span class="util-guided-review__feature-key">B.</span> Potential consequences are linked to the interest or responsibility concerned.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Add what the person seeks, needs or is accountable for, drawing on their role or statement rather than assigning a generic opinion.</li><li><span class="util-guided-review__feature-key">Missing B:</span> For a consequence currently stated in isolation, explain whose situation could change and how that change relates to the cited concern.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c4--checklist-a1-a1-m5-item-1" data-checklist-item-id="checklist-a1-a1-m5-item-1"><label class="util-interactive-checklist__label" for="lj-c4--checklist-a1-a1-m5-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c4--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a1-m5-c-2" data-revision-criterion-id="a1-m5-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you distinguished disagreement about evidence from disagreement about priorities?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Confusing the two can imply that better data alone would settle a value-based disagreement, or that different priorities invalidate an evidential limitation.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> One comparison concerns what a finding or account can establish.</li><li><span class="util-guided-review__feature-key">B.</span> Another comparison concerns the relative importance of different interests or consequences.</li><li><span class="util-guided-review__feature-key">C.</span> Any overlap between evidence and priorities is acknowledged rather than forced into an exclusive category.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify the contested inference and explain what the relevant source supports and what it leaves unresolved.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify the competing considerations and explain why people might weigh them differently even if they accepted the same recorded facts.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Where a disagreement combines uncertainty and differing values, explain both elements and why one does not eliminate the other.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c4--checklist-a1-a1-m5-item-2" data-checklist-item-id="checklist-a1-a1-m5-item-2"><label class="util-interactive-checklist__label" for="lj-c4--checklist-a1-a1-m5-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c4--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a1-m5-c-3" data-revision-criterion-id="a1-m5-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you recognised the limits of testimony and the importance of perspectives that may be overlooked?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Individual experiences can identify consequential possibilities without establishing their frequency; ignoring a relevant voice can leave a material consequence outside the committee&#39;s consideration.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Individual accounts are not presented as representative prevalence estimates.</li><li><span class="util-guided-review__feature-key">B.</span> A potentially overlooked perspective is identified with a reason it matters.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Qualify any claim about how many students or staff share an experience unless the supplied evaluation records provide that denominator.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name the perspective and specify which experience, responsibility or possible consequence the committee might otherwise miss.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="lj-c4--checklist-a1-a1-m5-item-3" data-checklist-item-id="checklist-a1-a1-m5-item-3"><label class="util-interactive-checklist__label" for="lj-c4--checklist-a1-a1-m5-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#lj-c4--learner-task-a1" data-revise-with-criterion="true" data-activity-id="A1" data-revision-criterion-id="a1-m5-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="lj-c4--activity-A2" data-journey-section="true" data-activity-id="A2" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Weigh Benefits, Harms and Uncertainty</h2><div class="util-badge-row"><span class="util-badge util-badge-time">4 min</span></div></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A2"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The stakeholder comparison established whose interests may be affected and why reasonable people can disagree. You can now test the significance of those concerns against the recorded equity, reliability and operational evidence, distinguishing observed problems from possible consequences that remain uncertain.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Stakeholder perspectives expose different interests, but a responsible evaluation also asks which benefits and harms the evidence can support, who may experience them and where uncertainty remains. Examine the operational and equity findings alongside the testimony without treating a recorded disparity or an individual experience as a settled verdict.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Use evidence to weigh competing consequences across fairness, reliability, trust, autonomy, access to support and staff capacity. Distinguish a directly observed condition, an interpretation supported only to a limited extent and a conditional future consequence. An important concern need not be proven widespread to warrant examination, but its frequency and cause must not be invented.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which consequence has the strongest direct support in the available records? Which matters for institutional judgement even though its frequency, cause or future scale is uncertain?</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="lj-c4--learner-task-a2" data-composition-moment="do" data-activity-id="A2" aria-labelledby="lj-c4--learner-task-a2-heading"><h3 class="util-composition-moment-heading" id="lj-c4--learner-task-a2-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="lj-c4--learner-revision-reminder-a2" hidden data-revision-reminder="true" data-activity-id="A2" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="lj-c4--learner-revision-guidance-a2" hidden data-revision-guidance="true" data-activity-id="A2" aria-labelledby="lj-c4--learner-revision-guidance-a2-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="lj-c4--learner-revision-guidance-a2-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Inspect the equity and operational review and the stakeholder accounts, identifying at least two potential benefits and two potential harms or burdens affecting different groups.</p></span></div><article class="util-material-block util-material-table-block" data-material-id="A2-M1" data-material-type="data_table" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Simulated Equity and Operational Review</span></p><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-04 — Operational and Equity Review</h3><p>10 June 2026 | Northbridge University | Fictional evaluation record</p><h3 class="util-md-heading util-md-heading--source-3">SSI flag rates by disability-registration status</h3><div class="util-table-scroll util-material-table"><table><thead><tr><th>Disability-registration status</th><th>Students in group</th><th>Students flagged</th><th>Flag rate</th></tr></thead><tbody><tr><td>Registered with a disability</td><td>300</td><td>105</td><td>35.0%</td></tr><tr><td>Not registered with a disability</td><td>1,700</td><td>395</td><td>23.2%</td></tr><tr><td>Total</td><td>2,000</td><td>500</td><td>25.0%</td></tr></tbody></table></div><p>These two registration-status categories are exhaustive and mutually exclusive for this table. Status was recorded at the evaluation cut-off. The difference in flag rates alone does not establish discrimination, unequal prediction accuracy or the reason for the difference. Information about underlying support needs, flag accuracy and outcomes is insufficient to determine its cause.</p><h3 class="util-md-heading util-md-heading--source-3">Recorded operational observations</h3><div class="util-table-scroll util-material-table"><table><thead><tr><th>Operational area</th><th>Recorded observation</th><th>Scope or limitation</th></tr></thead><tbody><tr><td>Personalised support contact</td><td>100 of 500 flagged students had no recorded personalised support contact.</td><td>A support flag is not itself a recorded personalised offer of support.</td></tr><tr><td>Attendance information</td><td>Staff identified 40 flagged cases in which incomplete attendance information may have contributed to the flag.</td><td>These are potentially affected cases, not 40 confirmed erroneous flags.</td></tr><tr><td>Conventional support routes</td><td>In a separate review of 100 students who sought help through conventional routes, 30 had not been flagged.</td><td>The 100 were a selected group, not a representative sample of all unflagged students.</td></tr><tr><td>Staff workload</td><td>Reviewing SSI flags added approximately 25 staff hours per week across the academic support service during the busiest period.</td><td>This is an observed peak-period workload, not a forecast of annual hours or costs.</td></tr></tbody></table></div><p>The review cannot establish overall false-positive or false-negative rates. Use the recorded quantities and their sampling conditions when considering possible consequences for different groups.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Complete the consequence analysis table. For each selected consequence, name the affected stakeholder, cite a specific source observation or passage, explain its possible significance and state a relevant limitation or alternative explanation.</p></span></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="3" data-figure-id="asset-vb-38-4-va-a2-evidence-scope-01-activity-a2-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c4/activity-a2-materials-entry.png" alt="SSI cohort and selected-review boundaries, showing what recorded counts apply to; detailed description follows." aria-describedby="lj-c4--figure-description-asset-vb-38-4-va-a2-evidence-scope-01-activity-a2-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 3.</strong> Which population or selected group does each observation describe?</figcaption><p class="util-visual-asset-detailed-description" id="lj-c4--figure-description-asset-vb-38-4-va-a2-evidence-scope-01-activity-a2-materials-entry">The full cohort contains 2,000 students, divided into 500 flagged and 1,500 unflagged students. A separate division of the same cohort shows 300 disability-registered students, including 105 flagged, and 1,700 nonregistered students, including 395 flagged. Within the flagged group, 100 had no recorded personalised contact, while 40 cases may have involved incomplete attendance information; their overlap is not specified. A separate selected review of 100 conventional support seekers includes 30 unflagged students. Its boundary makes clear that these selected cases cannot establish a population-wide missed-identification rate. No overall flag-error rate is shown.</p></figure><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A2-M2" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Simulated Accounts of Support and Student Experience</span></p><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-05 — Stakeholder Evidence Digest</h3><p>11 June 2026 | Northbridge University | Fictional individual accounts</p><p>These are the complete statements recorded for this fictional learning case. They are not representative survey responses and cannot establish the prevalence of an experience.</p><h3 class="util-md-heading util-md-heading--source-3">Samira Khan — first-year student</h3><p>&gt; I was falling behind and didn&#39;t know who to ask. The message from my tutor made it easier to start a conversation. I probably wouldn&#39;t have contacted anyone myself.</p><h3 class="util-md-heading util-md-heading--source-3">Daniel Reed — first-year student</h3><p>&gt; I was told my engagement suggested I might be struggling, but I was working offline and keeping up. I felt as though the university had already made up its mind about me.</p><h3 class="util-md-heading util-md-heading--source-3">Bethan Hughes — first-year student</h3><p>&gt; I missed deadlines because things were difficult at home. Nobody contacted me through the new system. I found help later through my course administrator.</p><h3 class="util-md-heading util-md-heading--source-3">Tom Ellis — Head of Academic Support</h3><p>&gt; Some students have benefited from earlier contact, but the flags aren&#39;t always straightforward. Staff need time to check the context, and that has an impact on other support work.</p><h3 class="util-md-heading util-md-heading--source-3">Morgan Price — Students&#39; Union Education Officer</h3><p>&gt; Students want support, but they also want to understand how decisions about them are made. We shouldn&#39;t assume that a well-intentioned system automatically feels supportive.</p><h3 class="util-md-heading util-md-heading--source-3">Dr Aisha Rahman — Director of Student Success</h3><p>&gt; The early signs are encouraging. I would be reluctant to lose a potentially useful route to support before we&#39;ve had a fair opportunity to improve it.</p><h3 class="util-md-heading util-md-heading--source-3">Dr Priya Shah — Institutional Evaluation Lead</h3><p>&gt; The evidence is consistent with possible benefit, but we cannot yet isolate the effect of SSI from other changes or establish whether the benefits and risks are distributed fairly.</p><p>Read these accounts alongside NB-SSI-04. A recorded experience and a numerical observation may address different questions; neither automatically supplies the missing information from the other.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Write a short evaluative judgement weighing at least two competing consequences. Explain which evidence carries greater or lesser weight for the particular claims being made and why, including implications for fairness, operational reliability, student trust or autonomy, and staff capacity.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a2-a2-m3" data-material-source-id="A2-M3" data-activity-id="A2"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A2-M3" data-material-type="impact_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-table-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></span><span class="util-semantic-icon__label">Evidence-to-Consequence Analysis</span></p><div class="util-table-scroll util-learner-table-workspace__table"><table><thead><tr><th scope="col" id="lj-c4--a2-a2-m3-col-potential-benefit-harm-or-burden-0">Potential benefit, harm or burden
