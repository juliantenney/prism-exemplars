heck-sidebar__title" id="learner-check-a3-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="learner-check-a3-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a3">Back to your task (Reconcile the Evidence)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A3-M3" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a3-a3-m3" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a3-m3-c-0" data-revision-criterion-id="a3-m3-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you supported your synthesis with accurately attributed evidence from the records?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A synthesis cannot be checked against the case if its figures, quotations or reporting points are misattributed.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Numerical claims identify the relevant record, population, denominator and outcome.</li><li><span class="util-guided-review__feature-key">B.</span> Student experiences are attributed to the correct speaker and grounded in the actual first-person statement.</li><li><span class="util-guided-review__feature-key">C.</span> Methodological and operational qualifications are attributed to the appropriate records.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Attach the correct NB-SSI source and group definition to each quantitative claim, and distinguish preliminary enrolment from final continuation.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Check each named account against NB-SSI-05 and remove any experience or case linkage that the speaker&#39;s statement does not establish.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Identify whether a qualification comes from the evaluation limitations note or the operational review, and connect it to the claim it constrains.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m3-item-0" data-checklist-item-id="checklist-a3-a3-m3-item-0"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m3-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m3-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a3-m3-c-1" data-revision-criterion-id="a3-m3-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you explained at least two substantive evidential tensions rather than merely listing different findings?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The intellectual task is to account for apparent conflict, including differences in the measures and populations underlying the findings.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Two distinct tensions are explicitly identified.</li><li><span class="util-guided-review__feature-key">B.</span> Each tension identifies the specific observations that appear difficult to reconcile.</li><li><span class="util-guided-review__feature-key">C.</span> Differences in reporting point, group, outcome or evidential scope are considered where relevant.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Select a second conflict involving a different comparison, source type or evidential question rather than repeating the first.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name the relevant figures or statements on both sides of the apparent conflict and explain why they might initially seem inconsistent.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Specify whether the apparent conflict concerns different dates, populations, measured outcomes or kinds of testimony before interpreting it.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m3-item-1" data-checklist-item-id="checklist-a3-a3-m3-item-1"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m3-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m3-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a3-m3-c-2" data-revision-criterion-id="a3-m3-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you distinguished plausible explanations from causes or mechanisms demonstrated by the evidence?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>An explanation may make two observations compatible without establishing why either occurred.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Each tension includes at least one plausible explanation linked to its source particulars.</li><li><span class="util-guided-review__feature-key">B.</span> Each explanation is accompanied by an unresolved question or evidential gap.</li><li><span class="util-guided-review__feature-key">C.</span> No observed difference or individual account is used to claim an established SSI causal effect.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Identify a case-grounded alternative that could account for the observations, and state which findings it is intended to explain.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name the additional comparison, measurement or information needed to test the explanation rather than treating plausibility as confirmation.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Qualify causal language and distinguish the observed association or reported experience from the causal claim requiring further evidence.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m3-item-2" data-checklist-item-id="checklist-a3-a3-m3-item-2"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m3-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m3-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a3-m3-c-3" data-revision-criterion-id="a3-m3-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Have you produced a balanced interpretation whose confidence is proportionate to the combined evidence?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A synthesis that ignores countervailing evidence or unresolved uncertainty misrepresents what the evaluation can support.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The overall weighting addresses evidence consistent with possible benefit and evidence of limitations or concerns.</li><li><span class="util-guided-review__feature-key">B.</span> The synthesis distinguishes relatively secure observations from uncertain explanations.</li><li><span class="util-guided-review__feature-key">C.</span> The final interpretation is qualified and does not become an institutional policy recommendation.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Bring a relevant finding from the other side of your interpretation into the weighting and explain how it changes the scope of your conclusion.</li><li><span class="util-guided-review__feature-key">Missing B:</span> State which parts of your interpretation rest directly on recorded figures or testimony and which remain conditional.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Replace any proposed committee decision with a statement about what the combined evidence presently warrants and what remains unresolved.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a3-a3-m3-item-3" data-checklist-item-id="checklist-a3-a3-m3-item-3"><label class="util-interactive-checklist__label" for="checklist-a3-a3-m3-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a3" data-revise-with-criterion="true" data-activity-id="A3" data-revision-criterion-id="a3-m3-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section></article><article class="util-activity util-task-block util-vnext-activity" id="activity-A4" data-journey-section="true" data-activity-id="A4" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Reconsider Your Initial Judgement</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A4"><div class="util-composition-moment__body"><p class="util-composition-framing util-composition-framing--activityPurpose util-composition-activity-purpose" data-source-field="learning_sequence.timeline.purpose">Reassess an earlier provisional interpretation and confidence in light of the combined evidence, then transfer the same evaluative discipline to a concise student-facing briefing.</p><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">The cross-source synthesis provides a more qualified evidence base than the preliminary evaluation alone. Use that appraisal to explain how your position and confidence respond to the new findings, then apply the same reasoning to a different communication purpose.</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>Your task is now to reconsider the strength of your earlier interpretation, not to choose an institutional course of action. A well-justified decision to retain your position is as valid as a well-justified change.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Separate your substantive position from your confidence in it. Identify which new evidence matters most, how it changes or supports the reasoning, and which important questions remain unresolved.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which specific evidence most affected your confidence, and why might confidence change even if your broad position does not?</p></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a4" data-composition-moment="do" data-activity-id="A4" aria-labelledby="learner-task-a4-heading"><h3 class="util-composition-moment-heading" id="learner-task-a4-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a4" hidden data-revision-reminder="true" data-activity-id="A4" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a4" hidden data-revision-guidance="true" data-activity-id="A4" aria-labelledby="learner-revision-guidance-a4-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a4-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Record or refer to your original provisional judgement and confidence from &#39;The Promising Pilot&#39;; if that earlier response is unavailable, state the provisional position you are now reconsidering without presenting it as a recovered earlier answer.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M2" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Judgement Revision and Confidence Workspace</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Identify the new or reconsidered evidence that most strongly supports or challenges that position.</p></span></div><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M5" data-material-type="template" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Two-Sentence Briefing Workspace</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>State whether your interpretation changes, remains or becomes more qualified, explaining why.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A4-M1" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Evidence Reference for Reconsidering Your Judgement</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-2">Northbridge University — SSI Evidence Reference</h3><p>Use this fictional case dossier with your own earlier comparison and synthesis. It supplies source particulars without prescribing a revised interpretation or confidence level.</p><h3 class="util-md-heading util-md-heading--source-3">NB-SSI-01 — Initial Evaluation Summary</h3><p><strong>12 March 2026 | Preliminary enrolment reporting point</strong></p><table><thead><tr><th>Recorded item</th><th>Finding</th></tr></thead><tbody><tr><td>First-year students flagged</td><td>500</td></tr><tr><td>Flagged students receiving recorded personalised contact</td><td>400</td></tr><tr><td>Flagged students engaging with support</td><td>240</td></tr><tr><td>Preliminary enrolment, engaged flagged students</td><td>216/240 (90.0%)</td></tr><tr><td>Preliminary enrolment, non-engaged flagged students</td><td>208/260 (80.0%)</td></tr></tbody></table><h3 class="util-md-heading util-md-heading--source-3">NB-SSI-02 — Final Continuation Data</h3><p><strong>5 June 2026 | Continuation cut-off: 31 May 2026</strong></p><table><thead><tr><th>Recorded group or year</th><th>Continued / total</th><th>Reported rate</th></tr></thead><tbody><tr><td>Engaged flagged students</td><td>211/240</td><td>87.9%</td></tr><tr><td>Non-engaged flagged students</td><td>205/260</td><td>78.8%</td></tr><tr><td>All flagged students</td><td>416/500</td><td>83.2%</td></tr><tr><td>Unflagged students</td><td>1365/1500</td><td>91.0%</td></tr><tr><td>All first-year students, 2025/26</td><td>1781/2000</td><td>89.1%</td></tr><tr><td>All first-year students, 2024/25</td><td>1720/2000</td><td>86.0%</td></tr></tbody></table><p>The historical difference between the rounded overall rates is 3.1 percentage points. The preliminary record concerns enrolment at an earlier reporting point; the final record concerns continuation at the May cut-off.</p><h3 class="util-md-heading util-md-heading--source-3">NB-SSI-03 — Evaluation Limitations Note</h3><p><strong>8 June 2026 | Evaluation lead: Dr Priya Shah</strong></p><ul><li>Students who engaged with support may differ from those who did not in motivation, circumstances and existing support networks.</li><li>The 2024/25 and 2025/26 cohorts are not equivalent comparison groups.</li><li>An expanded first-year academic adviser scheme was introduced in September 2025 alongside SSI.</li><li>Some attendance records were incomplete.</li><li>Continuation does not fully measure wellbeing, confidence or educational experience.</li><li>The evaluation cannot establish whether SSI outperforms equally resourced non-AI support.</li></ul><h3 class="util-md-heading util-md-heading--source-3">NB-SSI-04 — Operational and Equity Review</h3><p><strong>10 June 2026</strong></p><table><thead><tr><th>Recorded item</th><th>Finding</th></tr></thead><tbody><tr><td>Registered-with-disability students flagged</td><td>105/300 (35.0%)</td></tr><tr><td>Students not registered as disabled who were flagged</td><td>395/1700 (23.2%)</td></tr><tr><td>All first-year students flagged</td><td>500/2000 (25.0%)</td></tr><tr><td>Flagged students without recorded personalised contact</td><td>100/500</td></tr><tr><td>Flagged cases potentially affected by incomplete attendance information</td><td>40</td></tr><tr><td>Unflagged students among a selected group of conventional support seekers</td><td>30/100</td></tr><tr><td>Additional staff workload in busiest period</td><td>Approximately 25 hours per week</td></tr></tbody></table><p>The disability-registration categories are exhaustive and mutually exclusive, with registration status recorded at the evaluation cut-off. Differences in flag rates do not establish discriminatory treatment or unequal prediction accuracy. The conventional support-seeker sample is selected, not representative. Overall false-positive and false-negative rates are unknown.</p><h3 class="util-md-heading util-md-heading--source-3">NB-SSI-05 — Stakeholder Evidence Digest</h3><p><strong>11 June 2026 | Selected fictional student accounts</strong></p><p><strong>Samira Khan</strong></p><p>&gt; I was falling behind and didn&#39;t know who to ask. The message from my tutor made it easier to start a conversation. I probably wouldn&#39;t have contacted anyone myself.</p><p><strong>Daniel Reed</strong></p><p>&gt; I was told my engagement suggested I might be struggling, but I was working offline and keeping up. I felt as though the university had already made up its mind about me.</p><p><strong>Bethan Hughes</strong></p><p>&gt; I missed deadlines because things were difficult at home. Nobody contacted me through the new system. I found help later through my course administrator.</p><p>These are original first-person statements from three selected fictional individuals, not representative survey findings. The records do not establish that the speakers correspond to particular cases in NB-SSI-04.</p><h3 class="util-md-heading util-md-heading--source-3">Reconsideration reference</h3><p>If you have your provisional interpretation and confidence from <strong>The Promising Pilot</strong>, consult your own earlier response. If it is unavailable, explicitly reconstruct the provisional position you are now reconsidering; do not present a reconstruction as a recovered answer. Use the combined evidence to justify either change, continuity or qualification in your interpretation, and assess your confidence separately. No final institutional recommendation is required.</p></article></li></ol></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="4"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>State your current confidence and justify any change or continuity in confidence using the strength and limitations of the evidence.</p></span></div><article class="util-material-block util-material-task-cards util-prose-measure" data-material-id="A4-M3" data-material-type="task_card" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-task-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg></span><span class="util-semantic-icon__label">Student-Representative Briefing Request</span></p><ol class="util-task-card-list" aria-label="Task cards"><li class="util-task-card-list__item"><article class="util-task-card"><p class="util-task-card__title">Card 1</p><h3 class="util-md-heading util-md-heading--source-2">Fictional briefing request</h3><p>A student representative is preparing a short explanation for fellow students about Student Support Insight. They ask you to respond to this claim:</p><p>&gt; The difference in disability-registration flag rates proves that SSI treated disabled students discriminatorily.</p><h3 class="util-md-heading util-md-heading--source-3">Source particulars: NB-SSI-04, 10 June 2026</h3><table><thead><tr><th>Disability-registration status</th><th>Students flagged</th><th>Students in category</th><th>Flag rate</th></tr></thead><tbody><tr><td>Registered with the university as disabled</td><td>105</td><td>300</td><td>35.0%</td></tr><tr><td>Not registered as disabled</td><td>395</td><td>1700</td><td>23.2%</td></tr></tbody></table><p>The registration categories are exhaustive and mutually exclusive, with status recorded at the evaluation cut-off. The available review does not establish the underlying differences in support needs, group-specific identification accuracy or subsequent outcomes needed to determine the cause of the rate difference.</p><p>The claim is a fictional instructional prompt, not testimony attributed to an actual student representative. Use only the supplied evidence; no new dataset or legal analysis is required.</p></article></li></ol></article><div class="util-composition-expected-output util-prose-measure" data-source-field="expected_output"><p class="util-composition-subheading">What to produce</p><p>A traceable account of an initial or explicitly reconstructed provisional interpretation, the evidence prompting reconsideration, a justified revised or retained position, and a separately reasoned confidence judgement. The accompanying student-representative briefing applies the same evidence-appraisal principles to a different audience and claim without overstating the evidence or making the final institutional recommendation.</p></div><div class="util-learner-response-group util-prose-measure"><p class="util-learner-response-group__note">Your draft is saved on this device when possible. It is not submitted.</p><div class="util-learner-workspace util-prose-measure" data-workspace-step="1" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-template-section-a4-m2-section-initial-provisional-interpretation-1" data-response-part-id="A4-template-section-a4-m2-section-initial-provisional-interpretation-1"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-template-section-a4-m2-section-initial-provisional-interpretation-1-label" for="learner-worksp ord your response for Reason for confidence change or continuity.</p><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-template-section-a4-m2-section-reason-for-confidence-change-or-continuity-7" name="learner-workspace-a4-a4-template-section-a4-m2-section-reason-for-confidence-change-or-continuity-7" rows="6" aria-describedby="learner-workspace-a4-a4-template-section-a4-m2-section-reason-for-confidence-change-or-continuity-7-desc"></textarea></div></div><p class="util-check-sidebar-launch"><a class="util-check-sidebar-launch__control" href="#learner-check-a4" data-check-sidebar-open aria-controls="learner-check-a4" aria-expanded="false" aria-label="Check your work: Reconsider Your Initial Judgement">Check your work</a></p></div></section><section class="util-composition-moment util-composition-moment--check util-prose-measure" id="learner-check-a4" data-composition-moment="check" data-activity-id="A4" data-check-sidebar="available" aria-labelledby="learner-check-a4-heading"><div class="util-check-sidebar__chrome"><div class="util-check-sidebar__brand"><p class="util-check-sidebar__title" id="learner-check-a4-sidebar-title">Check your work</p><p class="util-check-sidebar__progress" data-check-sidebar-progress></p></div><button type="button" class="util-check-sidebar__close" data-check-sidebar-close aria-label="Close check your work"><svg class="util-check-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span class="util-check-sidebar__sr">Close check your work</span></button></div><h3 class="util-composition-moment-heading" id="learner-check-a4-heading">Check your response</h3><p class="util-composition-moment-nav"><a class="util-composition-moment-nav__link" href="#learner-task-a4">Back to your task (Reconsider Your Initial Judgement)</a></p><div class="util-composition-moment__body"><p class="util-composition-check-guidance">Complete your response first, then use this material to check or improve it.</p><article class="util-checklist-block util-material-role-checklist util-prose-measure" data-material-id="A4-M6" data-material-type="checklist" data-body-format="json"><div class="util-guided-review util-interactive-checklist" data-guided-review="true" data-guided-review-presentation="listed" data-workspace-kind="checklist_entry" data-workspace-capability="checklist_entry" data-workspace-id="checklist-a4-a4-m6" data-guided-review-count="4"><p class="util-guided-review__title">Review your answer</p><p class="util-guided-review__status util-visually-hidden" aria-live="polite" data-guided-review-status></p><div class="util-guided-review__panels"><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="0" data-guided-criterion-id="a4-m6-c-0" data-revision-criterion-id="a4-m6-c-0"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 1 of 4</p><p class="util-guided-review__statement">Have you made the relationship between your initial interpretation, the new evidence and your current position traceable?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 1</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>Without a clear chain of reasoning, it is impossible to distinguish evidence-driven reconsideration from an unsupported change or restatement.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Your initial position is recorded, or explicitly identified as reconstructed if the earlier response is unavailable.</li><li><span class="util-guided-review__feature-key">B.</span> Specific findings supporting and challenging that position are identified.</li><li><span class="util-guided-review__feature-key">C.</span> Your revised, retained or qualified position follows from your stated evidence weighting.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> State the provisional interpretation you are reconsidering and identify whether it comes from your own earlier work or is reconstructed now.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name the relevant source particulars and distinguish how each bears on your provisional interpretation.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Explain why the relative strength of the supporting and challenging findings warrants the position you now hold.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a4-a4-m6-item-0" data-checklist-item-id="checklist-a4-a4-m6-item-0"><label class="util-interactive-checklist__label" for="checklist-a4-a4-m6-item-0">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m6-c-0">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="1" data-guided-criterion-id="a4-m6-c-1" data-revision-criterion-id="a4-m6-c-1"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 2 of 4</p><p class="util-guided-review__statement">Have you calibrated your confidence independently of whether your interpretation changed?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 2</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>A position may remain the same while the evidential basis for holding it becomes more or less secure.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Both initial and current confidence are recorded as separate judgements from the interpretation itself.</li><li><span class="util-guided-review__feature-key">B.</span> The reason for confidence change or continuity refers to evidence strength and limitations.</li><li><span class="util-guided-review__feature-key">C.</span> The current confidence level is consistent with the uncertainty acknowledged elsewhere in the response.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Add an explicit confidence assessment at each point instead of relying on the wording of your conclusion to imply certainty.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Connect your confidence judgement to source reliability, comparability, unresolved causal questions or completeness rather than to whether you changed your mind.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Reconsider any high-certainty wording that conflicts with the methodological or operational gaps you identified.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a4-a4-m6-item-1" data-checklist-item-id="checklist-a4-a4-m6-item-1"><label class="util-interactive-checklist__label" for="checklist-a4-a4-m6-item-1">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m6-c-1">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="2" data-guided-criterion-id="a4-m6-c-2" data-revision-criterion-id="a4-m6-c-2"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 3 of 4</p><p class="util-guided-review__statement">Have you respected the limits on causal, identification-accuracy and equity claims?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 3</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The case includes observed differences and individual experiences but lacks information needed for several stronger causal or population-wide conclusions.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> Observed continuation differences are not described as a demonstrated causal SSI effect.</li><li><span class="util-guided-review__feature-key">B.</span> Disability-registration flag-rate differences are not treated as proof of discriminatory treatment or unequal predictive accuracy.</li><li><span class="util-guided-review__feature-key">C.</span> Selected support seekers and individual accounts are not generalised to the entire cohort.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Separate the recorded outcome comparisons from unresolved questions about selection effects, concurrent support provision and causal contribution.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Identify the observed rates and qualify any inference that requires information about underlying support needs, accuracy or subsequent outcomes.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Specify the selected or individual nature of the evidence and remove any unsupported population-wide prevalence or error-rate estimate.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a4-a4-m6-item-2" data-checklist-item-id="checklist-a4-a4-m6-item-2"><label class="util-interactive-checklist__label" for="checklist-a4-a4-m6-item-2">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m6-c-2">Revise with this criterion</a></p></section><section class="util-guided-review__panel" data-revision-criterion-root data-guided-review-index="3" data-guided-criterion-id="a4-m6-c-3" data-revision-criterion-id="a4-m6-c-3"><p class="util-guided-review__progress" data-guided-review-progress>Criterion 4 of 4</p><p class="util-guided-review__statement">Does your two-sentence briefing accurately communicate both the evidence and its limits to a student representative?</p><details class="util-composition-reveal util-guided-review__guidance" data-reveal-mode="details"><summary>Show guidance<span class="util-visually-hidden"> for criterion 4</span></summary><div class="util-composition-reveal__body"><div class="util-guided-review__why"><p class="util-guided-review__section-label">Why this matters</p><p>The changed-audience task requires an accessible explanation that neither dismisses an observed difference nor converts it into a conclusion the records cannot support.</p></div><div class="util-guided-review__look-for"><p class="util-guided-review__section-label">What to look for</p><ul><li><span class="util-guided-review__feature-key">A.</span> The first sentence identifies the recorded group-rate evidence without changing the figures or group definitions.</li><li><span class="util-guided-review__feature-key">B.</span> The second sentence identifies a material uncertainty about interpreting the rate difference.</li><li><span class="util-guided-review__feature-key">C.</span> The briefing is exactly two sentences, avoids unsupported legal or policy conclusions and is understandable to fellow students.</li></ul></div><div class="util-guided-review__missing"><p class="util-guided-review__section-label">If something is missing</p><ul><li><span class="util-guided-review__feature-key">Missing A:</span> Check the two registration categories, their flagged counts and their denominators, then express the supported observation in accessible language.</li><li><span class="util-guided-review__feature-key">Missing B:</span> Name a specific unresolved issue concerning causes, support needs, identification accuracy or outcomes instead of offering a generic caution.</li><li><span class="util-guided-review__feature-key">Missing C:</span> Condense the response to one evidence statement and one limitation statement, removing specialist claims not warranted by NB-SSI-04.</li></ul></div></div></details><div class="util-interactive-checklist__item util-guided-review__confirm"><input type="checkbox" class="util-interactive-checklist__input" id="checklist-a4-a4-m6-item-3" data-checklist-item-id="checklist-a4-a4-m6-item-3"><label class="util-interactive-checklist__label" for="checklist-a4-a4-m6-item-3">My response now meets this criterion</label></div><p class="util-revision-criterion-action"><a class="util-revision-criterion-action__link" href="#learner-task-a4" data-revise-with-criterion="true" data-activity-id="A4" data-revision-criterion-id="a4-m6-c-3">Revise with this criterion</a></p></section></div><div class="util-guided-review__nav" hidden data-guided-review-nav><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--prev" data-guided-review-prev disabled>Previous criterion</button><button type="button" class="util-guided-review__nav-btn util-guided-review__nav-btn--next" data-guided-review-next>Next criterion</button></div></div></article></div></section><section class="util-composition-moment util-composition-moment--transfer util-prose-measure" data-composition-moment="transfer" data-activity-id="A4"><h3 class="util-composition-moment-heading">Transfer your learning</h3><div class="util-composition-moment__body"><article class="util-material-block util-material-block--response-composed util-prose-measure" data-material-id="A4-M4" data-material-type="transfer_prompt" data-response-composed="true"><p class="util-material-heading util-composition-subheading">Brief a Student Representative</p></article><div class="util-learner-workspace util-prose-measure" data-workspace-step="910" data-workspace-capability="text_entry" data-workspace-kind="text_entry" data-workspace-id="learner-workspace-a4-a4-transfer-prompt-a4-m4-910" data-response-part-id="A4-transfer-prompt-a4-m4-910" data-source-field="transfer_or_application_task"><label class="util-composition-subheading util-learner-workspace__label" id="learner-workspace-a4-a4-transfer-prompt-a4-m4-910-label" for="learner-workspace-a4-a4-transfer-prompt-a4-m4-910">Transfer response</label><div class="util-learner-workspace__prompt util-learner-workspace__prompt--block" id="learner-workspace-a4-a4-transfer-prompt-a4-m4-910-desc"><p>Apply your evidence-appraisal approach to a different purpose and audience: a student representative needs a concise, accessible response to the claim in the briefing request.</p><p>Write <strong>exactly two sentences</strong> for fellow students. In the first, state what the recorded disability-registration figures support. In the second, identify an evidential limit or unresolved question that matters when assessing the claim. Make both sentences understandable without specialist statistical language, but do not weaken or overstate the source evidence. Do not make a final institutional policy recommendation.</p><p>Enter the two sentences separately in the briefing workspace.</p></div><textarea class="util-learner-workspace__input" id="learner-workspace-a4-a4-transfer-prompt-a4-m4-910" name="learner-workspace-a4-a4-transfer-prompt-a4-m4-910" rows="5" aria-describedby="learner-workspace-a4-a4-transfer-prompt-a4-m4-910-desc"></textarea><p class="util-learner-workspace__note">Your draft is saved on this device when possible. It is not submitted.</p></div></div></section></article></section><aside class="util-study-tips" data-region="study-tips" id="journey-study-tips" data-journey-section="true"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--study-tips" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg></span><span class="util-semantic-icon__label">Study tips</span></h2><div class="util-study-tips__content util-prose-measure"><ul><li>When comparing evidence, keep the population, denominator, outcome and reporting point attached to every figure; an observed difference is not automatically a causal effect.</li><li>Weigh quantitative records alongside operational findings and individual experiences, respecting the different questions each source can answer and the limits of selected or incomplete evidence.</li><li>A defensible synthesis can acknowledge both possible educational benefit and unresolved implementation or equity concerns without claiming more than the evidence warrants.</li><li>Revisit your provisional interpretation and your confidence separately. Whether your position changes or remains, explain its evidential basis and apply the same care when communicating a claim to another audience.</li></ul></div></aside><style id="prism-revision-reminder-css">.util-learner-renderer-vnext .util-revision-reminder{display:none}.util-learner-renderer-vnext .util-revision-reminder[data-revision-reminder-active="true"]{display:block;position:fixed;top:var(--learner-sticky-nav-height,0px);left:0;right:0;z-index:40;margin:0 auto;max-width:42rem;width:calc(100% - 1.5rem);padding:.45rem .75rem;border:1px solid #cbd5e1;border-left:3px solid #64748b;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.12)}.util-learner-renderer-vnext .util-revision-reminder__chrome{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.35rem .75rem;margin:0 0 .2rem}.util-learner-renderer-vnext .util-revision-reminder__label{margin:0;font-size:.75rem;font-weight:650;color:#64748b}.util-learner-renderer-vnext .util-revision-reminder__statement{margin:0;font-size:.9rem;line-height:1.4;font-weight:600;color:#0f172a}.util-learner-renderer-vnext .util-revision-reminder__view{font:inherit;font-size:.9rem;color:#1d4ed8;background:transparent;border:0;padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer}.util-learner-renderer-vnext .util-revision-reminder__view:focus{outline:2px solid #2563eb;outline-offset:2px}</style><style id="prism-check-sidebar-css">.util-learner-renderer-vnext{--learner-reading-width __row"><button type="button" class="util-journey-all-btn" aria-expanded="false" aria-controls="util-journey-all-panel" title="All sections" aria-label="All sections"><svg class="util-journey-all-btn__icon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M3 4.5h12v1.5H3V4.5zm0 3.75h12v1.5H3V8.25zm0 3.75h12V13.5H3v-1.5z"/></svg></button><span class="util-journey-adjacent util-journey-adjacent--placeholder util-journey-adjacent--prev" aria-hidden="true"></span><div class="util-journey-current-wrap"><span class="util-journey-current" data-journey-current-title="true">Orient</span><p class="util-journey-position" aria-label="Section 1 of 5"><span class="util-journey-position__visible" aria-hidden="true">1 of 5</span></p></div><a class="util-journey-adjacent util-journey-adjacent--next" href="#activity-A1" aria-label="Next section: Whose Consequences Count?"><span class="util-journey-adjacent__title">Whose Consequences Count?</span><span class="util-journey-adjacent__chevron" aria-hidden="true">›</span></a></div><div id="util-journey-all-panel" class="util-journey-all-panel" hidden><div class="util-journey-all-panel__header"><p class="util-journey-all-panel__title">All sections</p><button type="button" class="util-journey-all-close">Close</button></div><ul class="util-journey-all-list"><li><a class="util-journey-all-link" href="#journey-orient" aria-current="location">Orient</a></li><li><a class="util-journey-all-link" href="#activity-A1">Whose Consequences Count?</a></li><li><a class="util-journey-all-link" href="#activity-A2">What Can the Evidence Support?</a></li><li><a class="util-journey-all-link" href="#activity-A3">Weigh the Committee's Four Options</a></li><li><a class="util-journey-all-link" href="#journey-study-tips">Study tips</a></li></ul></div></div></nav><div class="util-editorial-opening" data-region="editorial-opening" data-affordance-id="va-editorial-opening"><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--editorial-opening" data-visual-slot="editorial-opening" data-learner-content-kind="image" data-figure-id="asset-brief-editorial-opening"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c4/editorial-opening.png" alt="" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div></figure></div><section class="util-page-orientation" data-region="orientation"><div id="journey-orient" data-journey-section="true"><section class="util-orientation-section util-overview" data-orientation-type="overview"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span><span class="util-semantic-icon__label">Overview</span></h2><div class="util-orientation-content util-overview__content util-prose-measure"><p>This self-study resource examines how Northbridge University&#39;s Student Success Committee must consider different experiences and institutional responsibilities when deciding the future of Student Support Insight (SSI). Begin with the stakeholder accounts, then examine the evaluation evidence and compare the four available options. You will use your own reasoning throughout; the final recommendation belongs to the next resource.</p></div></section><section class="util-orientation-section util-learning_purpose" data-orientation-type="learning_purpose"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning purpose</span></h2><div class="util-orientation-content util-learning_purpose__content util-prose-measure"><p>The three activities build towards an institutional decision: first identify contrasting stakeholder perspectives, then test what the evidence can justify, and finally compare feasible options and explain the decision criteria to students. Keep your earlier responses available as you progress.</p></div></section><section class="util-orientation-section util-knowledge_summary" data-orientation-type="knowledge_summary"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--knowledge-summary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Knowledge summary</span></h2><div class="util-orientation-content util-knowledge_summary__content util-prose-measure"><p>Northbridge University is a fictional English public university. In September 2025, it introduced <strong>Student Support Insight (SSI)</strong> to help identify first-year students who might benefit from academic support. SSI uses learning-platform engagement, attendance information where available, and assignment-submission patterns to generate flags for authorised staff to review. Staff decide whether to offer supportive contact; students may decline. SSI does not automatically diagnose students, determine grades or impose sanctions. Conventional academic support remains available.</p><p>The Student Success Committee must consider SSI&#39;s future for 2026/27. This involves more than asking whether the system appears promising. A responsible institutional judgement brings together several kinds of reasoning.</p><h3 class="util-md-heading util-md-heading--source-3">Stakeholder experiences and institutional responsibilities</h3><p>Students may experience proactive support differently. An offer of help can be welcome, but being flagged can also raise questions about how the university interprets a student&#39;s circumstances. A student who is not flagged may still need support. Staff must interpret information, check context and balance additional work with existing responsibilities. Institutional leaders must consider educational benefit, fairness, confidence in university processes and the resources required to operate them.</p><p><strong>An account illustrates a possible experience; it does not establish how common that experience is.</strong> Similarly, stakeholders may disagree for different reasons. An <em>evidential disagreement</em> concerns what available information supports. A <em>difference in priorities</em> concerns which benefits, harms or responsibilities deserve the greatest weight. A perspective can involve both.</p><h3 class="util-md-heading util-md-heading--source-3">Reading institutional evidence carefully</h3><p>An <strong>observation</strong> records what happened or what was measured. An <strong>association</strong> describes a relationship between observed groups or outcomes. A <strong>causal claim</strong> asserts that one factor produced an outcome and requires stronger evidence than a simple comparison.</p><p>For example, students who engage with an optional support service may differ from those who do not. A difference in their outcomes cannot, by itself, establish the effect of the service. Historical comparisons also require care when other institutional arrangements have changed.</p><p>Fairness requires similarly careful interpretation. Different flag rates between student groups can justify investigation without independently establishing discrimination or explaining the difference. Evaluating a support system also requires attention to students who receive flags without subsequent contact, students who seek help through other routes, incomplete records and the time staff spend reviewing information. These observations concern different parts of the support process and should not be treated as interchangeable measures of prediction accuracy.</p><h3 class="util-md-heading util-md-heading--source-3">From evidence to institutional judgement</h3><p>The committee&#39;s four fixed options are to <strong>continue unchanged</strong>, <strong>continue with safeguards and further evaluation</strong>, <strong>restrict or temporarily suspend SSI</strong>, or <strong>withdraw SSI</strong>. Conventional support and the expanded academic adviser scheme continue regardless of the option selected.</p><p>Each option needs to be examined against consistent considerations: potential educational benefit, possible harms or lost opportunities, fairness and trust, operational capacity, financial feasibility and the limits of the evidence. A <strong>trade-off</strong> arises when pursuing one legitimate aim may place another at risk or consume resources needed elsewhere. Identifying a trade-off does not automatically determine which option is preferable.</p><p>The committee must also distinguish <strong>known constraints</strong> from <strong>possible future consequences</strong>. The available budget, staff capacity and existing support arrangements constrain what can responsibly be proposed. Future improvements, harms or savings should not be treated as guaranteed.</p><p>Finally, institutional accountability includes explaining how a decision is reached. Students should be able to understand which evidence, experiences, uncertainties and responsibilities the committee has considered, even when the available information does not support a definitive conclusion.</p><p>Use these distinctions to investigate the evidence and make your own comparisons in the activities. The resource deliberately leaves the final institutional recommendation open.</p></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--knowledge-summary-after-content" data-visual-slot="knowledge-summary-after-content" data-learner-content-kind="image" data-figure-number="1" data-figure-id="asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c4/knowledge-summary-after-content.png" alt="Concept map of SSI support, evidence limitations and institutional choices; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 1.</strong> How the SSI support process, qualified evidence and institutional decision criteria connect.</figcaption><p class="util-visual-asset-detailed-description" id="figure-description-asset-vb-38-4-va-page-knowledge-summary-01-page-page-knowledge-summary-after-content">The map separates two connected structures. The support process begins with learning-platform engagement, available attendance information and submission patterns. These contribute to SSI flags reviewed by authorised staff, who may offer contact that students can accept or decline. Conventional support remains independently available. The decision process draws on individual stakeholder accounts and institutional evaluation findings. Methodological limitations constrain conclusions drawn from those findings. The committee considers educational benefit, harms, fairness, trust, staff capacity and financial feasibility when comparing four options: continue unchanged, continue with safeguards, restrict or temporarily suspend, or withdraw. No connection establishes a causal effect or preferred option.</p></figure></section><section class="util-orientation-section util-learning-outcomes" data-orientation-type="learning_outcomes"><h2 class="util-section-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-section-icon--learning-purpose" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg></span><span class="util-semantic-icon__label">Learning outcomes</span></h2><div class="util-orientation-content util-learning-outcomes__content util-prose-measure"><p>By the end of this lesson, you should be able to:</p><ol><li>Analyse contrasting stakeholder accounts to identify potential benefits, harms and institutional responsibilities associated with SSI, distinguishing disagreements about evidence from differences in stakeholder priorities. <span class="util-outcome-id">(LO1)</span></li><li>Evaluate the implications of unresolved evidence and operational findings for fairness, reliability, student trust and staff capacity, distinguishing established observations from unsupported conclusions. <span class="util-outcome-id">(LO2)</span></li><li>Compare the four institutional options for SSI by weighing consequential trade-offs across educational benefit, potential harms, fairness, trust, operational capacity and financial feasibility, identifying the considerations that should inform a subsequent recommendation. <span class="util-outcome-id">(LO3)</span></li></ol></div></section></div></section><section class="util-learning-activities" data-region="activities" id="journey-activities" data-journey-section="true"><article class="util-activity util-task-block util-vnext-activity" id="activity-A1" data-journey-section="true" data-activity-id="A1" data-render-path="moments"><header class="util-activity-header"><h2 class="util-activity-title">Whose Consequences Count?</h2></header><section class="util-composition-moment util-composition-moment--orient util-prose-measure" data-composition-moment="orient" data-activity-id="A1"><div class="util-composition-moment__body"><div class="util-pedagogical-guidance util-pedagogical-guidance--intellectual-coherence-bridge util-composition-coherence-bridge util-prose-measure" data-guidance-type="intellectual_coherence_bridge" data-source-field="intellectual_coherence_bridge"><p class="util-guidance-label util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg></span><span class="util-semantic-icon__label">Connect your learning</span></p><div class="util-guidance-body">Evidence appraisal establishes what can reasonably be claimed about SSI. Stakeholder analysis adds a different question: who might benefit, who might be harmed, and why might people assign different importance to the same possible consequences?</div></div><div class="util-composition-framing util-composition-framing--activity-preamble util-composition-preamble" data-source-field="activity_preamble"><p>If you completed &#39;When the Evidence Changes&#39;, revisit your revised or defended interpretation of SSI and the uncertainties you identified. Use that earlier reasoning as your starting point: you are now examining how the same uncertain evidence matters differently to students, staff and institutional leaders. The fictional stakeholder accounts are individual perspectives, not representative findings.</p></div><p class="util-composition-framing util-composition-framing--reasoning-orientation util-composition-reasoning-orientation" data-source-field="reasoning_orientation">Distinguish what a stakeholder reports, what consequence their account illustrates, what remains uncertain, and which priority or responsibility shapes their perspective. Compare perspectives rather than sorting people into supporters and opponents.</p><p class="util-composition-framing util-composition-self-explanation" data-source-field="self_explanation_prompt">Which stakeholder consequence would be easiest to overlook if the committee considered continuation rates alone, and why?</p></div></section><section class="util-composition-moment util-composition-moment--learn util-prose-measure" data-composition-moment="learn" data-activity-id="A1"><h3 class="util-composition-moment-heading">Explore the idea</h3><div class="util-composition-moment__body"><div class="util-composition-learn-item util-composition-learn-item--explanation" data-composition-role="explanation"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="1"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Read the seven fictional stakeholder accounts in the evidence digest.</p></span></div></div></div></section><section class="util-composition-moment util-composition-moment--do util-prose-measure" id="learner-task-a1" data-composition-moment="do" data-activity-id="A1" aria-labelledby="learner-task-a1-heading"><h3 class="util-composition-moment-heading" id="learner-task-a1-heading" tabindex="-1">Your task</h3><div class="util-revision-reminder" id="learner-revision-reminder-a1" hidden data-revision-reminder="true" data-activity-id="A1" role="status"><div class="util-revision-reminder__chrome"><p class="util-revision-reminder__label">Revising against</p><button type="button" class="util-revision-reminder__view" data-revision-reminder-view>View guidance</button></div><p class="util-revision-reminder__statement" data-revision-reminder-statement></p></div><aside class="util-revision-guidance" id="learner-revision-guidance-a1" hidden data-revision-guidance="true" data-activity-id="A1" aria-labelledby="learner-revision-guidance-a1-heading"><div class="util-revision-guidance__chrome"><h4 class="util-revision-guidance__heading" id="learner-revision-guidance-a1-heading" tabindex="-1">Review guidance</h4><button type="button" class="util-revision-guidance__hide" data-revision-guidance-hide>Hide guidance</button></div><p class="util-revision-guidance__honesty">This is review guidance you chose to keep in view while you revise. You decide whether your response meets the criterion. Prism does not mark or score your answer.</p><div class="util-revision-guidance__body" data-revision-guidance-body></div></aside><div class="util-composition-moment__body"><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="2"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Complete a comparison of at least three contrasting perspectives, including at least two students and one institutional or professional stakeholder. For each, identify a specific account detail, a potential benefit or harm, and the stakeholder&#39;s relevant priority or responsibility.</p></span></div><figure class="util-visual-asset util-visual-asset--expandable util-visual-asset--materials-entry" data-visual-slot="materials-entry" data-learner-content-kind="image" data-figure-number="2" data-figure-id="asset-vb-38-4-va-a1-perspective-distinction-01-activity-a1-materials-entry"><div class="util-visual-asset-media"><img class="util-visual-asset-image" src="media/c4/activity-a1-materials-entry.png" alt="Contrast between disagreements about evidence and differences in priorities; detailed description follows." aria-describedby="figure-description-asset-vb-38-4-va-a1-perspective-distinction-01-activity-a1-materials-entry" loading="lazy" decoding="async" /><button type="button" class="util-learner-content-expand" aria-label="View image larger" title="View image larger"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg></button></div><figcaption class="util-visual-asset-caption"><strong>Figure 2.</strong> Two questions to keep separate when comparing stakeholder perspectives.</figcaption><p class="util-visual-asset-detailed-description" id="figure-description-asset-vb-38-4-va-a1-perspective-distinction-01-activity-a1-materials-entry">Two related reasoning categories are distinguished. Evidential disagreement concerns what the available information supports and which claims remain uncertain. Difference in priorities concerns the relative importance assigned to possible benefits, harms, values or responsibilities. An overlap between the categories indicates that the same perspective can involve both questions. No stakeholder names or completed classifications appear, leaving learners to apply the distinction to the testimony themselves.</p></figure><article class="util-scenario-card util-material-role-scenario util-prose-measure" data-material-id="A1-M1" data-material-type="scenario" data-body-format="markdown"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--md util-material-icon util-semantic-icon__svg util-scenario-card-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span class="util-semantic-icon__label">Stakeholder Evidence Digest: Seven Perspectives</span></p><h3 class="util-md-heading util-md-heading--source-2">NB-SSI-05 — Stakeholder Evidence Digest</h3><p><strong>Source:</strong> Northbridge University, 11 June 2026.</p><p><strong>Source status:</strong> All statements below are fictional individual accounts, not representative survey findings.</p><h3 class="util-md-heading util-md-heading--source-3">Student accounts</h3><p><strong>Samira Khan — First-year student</strong></p><p>&gt; I was falling behind and didn&#39;t know who to ask. The message from my tutor made it easier to start a conversation. I probably wouldn&#39;t have contacted anyone myself.</p><p><strong>Daniel Reed — First-year student</strong></p><p>&gt; I was told my engagement suggested I might be struggling, but I was working offline and keeping up. I felt as though the university had already made up its mind about me.</p><p><strong>Bethan Hughes — First-year student</strong></p><p>&gt; I missed deadlines because things were difficult at home. Nobody contacted me through the new system. I found help later through my course administrator.</p><h3 class="util-md-heading util-md-heading--source-3">Professional and institutional accounts</h3><p><strong>Tom Ellis — Head of Academic Support</strong></p><p>&gt; Some students have benefited from earlier contact, but the flags aren&#39;t always straightforward. Staff need time to check the context, and that has an impact on other support work.</p><p><strong>Morgan Price — Students&#39; Union Education Officer</strong></p><p>&gt; Students want support, but they also want to understand how decisions about them are made. We shouldn&#39;t assume that a well-intentioned system automatically feels supportive.</p><p><strong>Dr Aisha Rahman — Director of Student Success</strong></p><p>&gt; The early signs are encouraging. I would be reluctant to lose a potentially useful route to support before we&#39;ve had a fair opportunity to improve it.</p><p><strong>Dr Priya Shah — Institutional Evaluation Lead</strong></p><p>&gt; The evidence is consistent with possible benefit, but we cannot yet isolate the effect of SSI from other changes or establish whether the benefits and risks are distributed fairly.</p><p>Use the original wording of these accounts when identifying details that support your comparison. The accounts describe different experiences and professional perspectives; their wider significance is for you to evaluate.</p></article><div class="util-beat-instruction util-icon-heading util-prose-measure" data-source-step-number="3"><span class="util-semantic-icon" aria-hidden="true"><svg class="util-lucide-icon util-lucide-icon--sm util-material-icon util-semantic-icon__svg util-generic-material-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></span><span class="util-semantic-icon__label"><p>Explain one disagreement primarily about the strength or interpretation of evidence and one difference primarily about priorities.</p></span></div><div class="util-learner-table-workspace util-learner-table-breakout" data-workspace-kind="table_entry" data-workspace-capability="table_entry" data-workspace-id="a1-a1-m2" data-material-source-id="A1-M2" data-activity-id="A1"><article class="util-material-block util-learner-table-workspace__material" data-material-id="A1-M2" data-material-type="comparison_table" data-body-format="markdown" data-render-mode="table_workspace"><p class="util-material-heading util-icon-heading"><span class="util-semantic-icon" aria-hidden="true"><svg class
